# Baut spielfertige Pakete (Desktop mit gebuendelter Java-Laufzeit, Android-APK).
# Veroeffentlicht NICHTS: kein itch.io, kein Store. Von Hand gestartet liegen alle Ergebnisse
# nur als Workflow-Artefakte am Lauf. Bei einem Tag v* legt der Job "release-entwurf" zusaetzlich
# einen GitHub-Release als ENTWURF an, den nur Personen mit Schreibrecht sehen. Veroeffentlicht
# wird er erst per Klick auf "Publish release". Anleitung: docs/NEUKOELLN-RELEASE.md
name: Release-Build (ohne Veroeffentlichung)

on:
  workflow_dispatch:
    inputs:
      installers:
        description: "Zusaetzlich Installationspakete bauen (.deb, .msi, .dmg)"
        type: boolean
        default: true
      mac_intel:
        description: "Zusaetzlich macOS fuer Intel-Macs bauen (kostet extra macOS-Minuten)"
        type: boolean
        default: false
      android:
        description: "Android-APK bauen"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.mac_intel && '["ubuntu-24.04","windows-latest","macos-latest","macos-15-intel"]' || '["ubuntu-24.04","windows-latest","macos-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          # Auf Windows scheitert das Speichern des Gradle-Caches (tar exit code 2); dort ohne Cache.
          cache: ${{ runner.os != 'Windows' && 'gradle' || '' }}

      - name: Version pruefen
        run: |
          version=$(sed -n "s/^[[:space:]]*appVersionName[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" build.gradle | head -n1)
          echo "appVersionName=$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::warning::Tag $GITHUB_REF_NAME passt nicht zu appVersionName $version in build.gradle"
          fi

      - name: Release-JAR bauen
        run: ./gradlew desktop:release --console=plain

      # Legt LICENSE.txt, NOTICE, THIRD-PARTY-NOTICES.txt, licenses/ (inkl. Hinweise der Java-Laufzeit)
      # und LIESMICH.txt mit Link auf genau diesen Tag bzw. Commit (GITHUB_SHA) in jedes Paket
      # und bricht ab, wenn eine davon im Archiv fehlt.
      - name: App-Image und Archiv bauen
        run: bash tools/package-desktop.sh --out dist

      - name: Installationspaket vorbereiten (Windows, WiX 3)
        if: runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || inputs.installers)
        continue-on-error: true
        run: |
          if ! command -v candle.exe >/dev/null 2>&1; then
            choco install wixtoolset --version 3.14.1 -y --no-progress
          fi
          wix_bin=$(ls -d "/c/Program Files (x86)/WiX Toolset v3."*/bin 2>/dev/null | head -n1 || true)
          if [[ -n "$wix_bin" ]]; then
            cygpath -w "$wix_bin" >> "$GITHUB_PATH"
          fi

      - name: Installationspaket vorbereiten (Linux, rpmbuild)
        if: runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || inputs.installers)
        continue-on-error: true
        run: |
          if ! command -v rpmbuild >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          fi
          rpmbuild --version

      - name: Installationspaket bauen
        if: github.event_name != 'workflow_dispatch' || inputs.installers
        continue-on-error: true
        run: bash tools/package-desktop.sh --out dist --installer --skip-archive

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v6
        with:
          name: neukoelln-desktop-${{ runner.os }}-${{ runner.arch }}
          path: dist/pixel-dungeon-neukoelln-*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  android:
    name: Android
    if: github.event_name != 'workflow_dispatch' || inputs.android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Keystore aus Secrets (falls gesetzt)
        env:
          KEYSTORE_B64: ${{ secrets.NK_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NK_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NK_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NK_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/neukoelln-release.keystore"
            {
              echo "NK_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/neukoelln-release.keystore"
              echo "NK_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "NK_ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "NK_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
              echo "NK_SIGNING=release"
            } >> "$GITHUB_ENV"
            echo "Release-Signatur aktiv."
          else
            echo "NK_SIGNING=debug" >> "$GITHUB_ENV"
            echo "::notice::Keine Signatur-Secrets gesetzt: APK wird mit Debug-Schluessel signiert (nur zum Testen)."
          fi

      - name: APK bauen
        run: ./gradlew android:assembleRelease --console=plain

      - name: APK pruefen und benennen
        run: |
          version=$(sed -n "s/^[[:space:]]*appVersionName[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" build.gradle | head -n1)
          mkdir -p dist
          apk=$(ls android/build/outputs/apk/release/*.apk | head -n1)
          suffix=""
          [[ "$NK_SIGNING" == debug ]] && suffix="-debugsigniert"
          cp "$apk" "dist/pixel-dungeon-neukoelln-$version-android$suffix.apk"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          "$tools/apksigner" verify --print-certs "dist/pixel-dungeon-neukoelln-$version-android$suffix.apk"
          "$tools/aapt2" dump badging "dist/pixel-dungeon-neukoelln-$version-android$suffix.apk" | grep -E "^(package|application-label)" || true
          for f in LICENSE.txt NOTICE THIRD-PARTY-NOTICES.txt licenses/Apache-2.0.txt; do
            unzip -l "dist/pixel-dungeon-neukoelln-$version-android$suffix.apk" | grep -qF "assets/legal/$f" \
              || { echo "::error::Lizenzdatei fehlt in der APK: assets/legal/$f"; exit 1; }
          done
          [[ -f android/build/outputs/mapping/release/mapping.txt ]] && cp android/build/outputs/mapping/release/mapping.txt "dist/r8-mapping-$version.txt" || true

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v6
        with:
          name: neukoelln-android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Nur bei Tag-Push: sammelt die Pakete aller Jobs und legt einen Release-ENTWURF an.
  # Laeuft nur, wenn Desktop und Android komplett gruen sind. Die R8-Mapping-Datei bleibt draussen.
  release-entwurf:
    name: Release-Entwurf
    needs: [desktop, android]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Artefakte holen
        uses: actions/download-artifact@v6
        with:
          path: artefakte
          merge-multiple: true

      - name: Dateien pruefen
        run: |
          version=$(sed -n "s/^[[:space:]]*appVersionName[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" build.gradle | head -n1)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu appVersionName $version. Kein Entwurf."
            exit 1
          fi
          if ls artefakte/*-debugsigniert.apk >/dev/null 2>&1; then
            echo "::error::APK ist nur debug-signiert (Signatur-Secrets fehlen). Kein Entwurf."
            exit 1
          fi
          mkdir -p release
          shopt -s nullglob
          for f in artefakte/pixel-dungeon-neukoelln-*.{apk,zip,tar.gz,deb,rpm,msi,dmg}; do
            cp "$f" release/
          done
          ls release/*-android.apk >/dev/null 2>&1 || { echo "::error::Keine APK gefunden."; exit 1; }
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_ENV"
          ls -l release

      - name: Release-Text schreiben
        run: |
          base="https://github.com/$GITHUB_REPOSITORY"
          cat > notes.md <<NOTES
          **Entwurf.** Automatisch aus Tag \`$GITHUB_REF_NAME\` gebaut. Vor dem Veröffentlichen Text
          prüfen und die Pakete auf echten Geräten starten.

          ## Herunterladen

          | System | Datei |
          | --- | --- |
          | Android | \`pixel-dungeon-neukoelln-$version-android.apk\` |
          | Windows | \`…-windows-x64.msi\` (Installer) oder \`…-windows-x64.zip\` |
          | macOS (Apple-Chip) | \`…-mac-arm64.dmg\` oder \`…-mac-arm64.zip\` |
          | Linux | \`…-linux-x64.deb\` (Ubuntu/Debian), \`…-linux-x64.rpm\` (Fedora), \`…-linux-x64.tar.gz\` |

          Desktop-Pakete bringen ihre eigene Java-Laufzeit mit. Prüfsummen stehen in \`SHA256SUMS.txt\`.

          ## Erster Start

          Die Pakete sind nicht mit einem kostenpflichtigen Zertifikat signiert.
          Android: Installation aus unbekannten Quellen erlauben. Windows: SmartScreen,
          *Weitere Informationen* und *Trotzdem ausführen*. macOS: einmal starten, dann
          *Systemeinstellungen*, *Datenschutz & Sicherheit*, *Dennoch öffnen*.

          ## Quelltext und Lizenz

          GPLv3. Quelltext genau dieses Stands: $base/tree/$GITHUB_REF_NAME
          Basiert auf Shattered Pixel Dungeon von Evan Debenham, das wiederum auf Pixel Dungeon
          von Watabou basiert. Spielstände liegen getrennt von Shattered Pixel Dungeon.
          NOTES
          cat notes.md

      - name: Entwurf anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft > draft.txt 2>/dev/null; then
            if [[ "$(cat draft.txt)" != true ]]; then
              echo "::error::Release $GITHUB_REF_NAME ist bereits veroeffentlicht. Nichts geaendert."
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            echo "Vorhandenen Entwurf aktualisiert."
          else
            gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
              --title "Pixel Dungeon Neukölln $version" --notes-file notes.md
            echo "Entwurf angelegt. Veroeffentlichen: Releases, Entwurf oeffnen, Publish release."
          fi
