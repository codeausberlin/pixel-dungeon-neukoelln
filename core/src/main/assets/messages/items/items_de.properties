###armor curses
items.armor.curses.antientropy.name=%s der Anti-Entropie
items.armor.curses.antientropy.desc=Ein Anti-Entropie-Fluch arbeitet gegen die Kräfte des Universums, indem er der Umgebung Energie entzieht und in den Träger überführt. Dies setzt den Träger kurz in Flammen, friert aber alles um ihn herum ein!

items.armor.curses.bulk.name=%s des Füllstoffs
items.armor.curses.bulk.desc=Eine Füllstoff-Rüstung sieht zwar größer und imposanter aus, schützt jedoch nicht besser. Was noch schlimmer ist: Das zusätzliche Volumen macht es sehr schwer, sich durch Türöffnungen zu zwängen.

items.armor.curses.corrosion.name=%s der Zersetzung
items.armor.curses.corrosion.desc=Eine Rüstung der Zersetzung ist dazu in der Lage, mit einer zersetzenden Flüssigkeit aufzuplatzen, wodurch alles im Umkreis mit einem klebrigen Säureschlamm bedeckt wird.

items.armor.curses.displacement.name=%s der Verdrängung
items.armor.curses.displacement.desc=Der Fluch der Verschiebung versucht es, den Träger in die Sicherheit zu verschieben, wenn er angegriffen wird. Der Fluch ist jedoch etwas zu effektiv und teleportiert den Benutzer zufällig in der Ebene herum.

items.armor.curses.metabolism.name=%s des Metabolismus
items.armor.curses.metabolism.desc=Der Metabolismusfluch verwandelt Sättigung direkt in Gesundheit, wenn der Träger verletzt wird, was die Gesundheit erhöht, aber zu einem schnellem Verhungern führt.

items.armor.curses.multiplicity.name=%s der Vervielfältigung
items.armor.curses.multiplicity.desc=Rüstungen, auf denen der Vervielfältigungsfluch lastet, enthalten eine gefährliche Verdoppelungsmagie. Sie wird manchmal ein Spiegelbild des Trägers erschaffen, aber es ist ebenso wahrscheinlich, dass sie den Gegner verdoppelt.

items.armor.curses.overgrowth.name=%s der Überwucherung
items.armor.curses.overgrowth.desc=Die Rüstung der Überwucherung ist mit verschiedenen, blühenden Pflanzen überzogen. Während dieser Effekt sicherlich interessant aussieht, bringt er nichts für die Verteidigung und Pflanzenwachstum wird zufällig im Kampf aktiviert!

items.armor.curses.stench.name=%s des Gestanks
items.armor.curses.stench.desc=Rüstung, die mit Gestank verflucht wurde, wird Wolken aus einem schädlichen Gas absondern, was gefährlich für alles und jeden ist, welcher sich in den Gaswolke aufhält.


###glyphs
items.armor.glyphs.affection.name=%s der Zuneigung
items.armor.glyphs.affection.desc=Diese starke Glyphe manipuliert den Verstand von Gegnern, was sie kurzzeitig betört.

items.armor.glyphs.antimagic.name=%s der Antimagie
items.armor.glyphs.antimagic.desc=Diese starke Glyphe ermöglicht es einer Rüstung, den Träger nicht nur gegen physische, sondern auch magische Angriffe zu verteidigen. Die magische Verteidigung ist unabhängig von der Rüstungsklasse.

items.armor.glyphs.brimstone.name=%s des Schwefels
items.armor.glyphs.brimstone.desc=Diese Glyphe schützt den Träger und alle seine Gegenstände vor Feuer und all dessen Effekten.

items.armor.glyphs.camouflage.name=%s der Tarnung
items.armor.glyphs.camouflage.desc=Diese Glyphe ermöglicht es dem Träger, sich mit hohem Gewächs optisch anzugleichen, was ihn kurzzeitig unsichtbar macht.

items.armor.glyphs.entanglement.name=%s der Verwurzlung
items.armor.glyphs.entanglement.desc=Diese Glyphe lässt eine irdene Rüstung um den Träger wachsen, um Schaden zu absorbieren, jedoch bricht sie bei Bewegung.

items.armor.glyphs.flow.name=%s des Flusses
items.armor.glyphs.flow.desc=Diese Glyphe manipuliert den Wasserfluss um den Träger, wodurch er viel schneller wird, wenn er durch Wasser geht.

items.armor.glyphs.obfuscation.name=%s der Vernebelung
items.armor.glyphs.obfuscation.desc=Diese Glyphe verdunkelt den Träger, so dass er schwerer zu entdecken ist.

items.armor.glyphs.potential.name=%s des Potenzials
items.armor.glyphs.potential.desc=Diese Glyphe sammelt Energie, wenn sie getroffen wird, mit der sie die Zauberstäbe des Trägers ein wenig auflädt.

items.armor.glyphs.repulsion.name=%s des Rückstoßes
items.armor.glyphs.repulsion.desc=Diese Glyphe lässt Angreifer abprallen, wodurch sie zurückgeschleudert werden.

items.armor.glyphs.stone.name=%s des Steins
items.armor.glyphs.stone.desc=Diese Glyphe umhüllt die Rüstung mit schwerem, magischen Gestein, das Ausweichen unmöglich macht und Schaden im Verhältnis zur Ausweichrate blockt.

items.armor.glyphs.swiftness.name=%s der Schnelligkeit
items.armor.glyphs.swiftness.desc=Diese Glyphe erhöht die Geschwindigkeit des Trägers, wenn er nicht in der Nähe eines Feindes steht.

items.armor.glyphs.thorns.name=%s der Dornen
items.armor.glyphs.thorns.desc=Diese starke Glyphe lässt Angreifer langsam verbluten, wenn sie den Träger angreifen.

items.armor.glyphs.viscosity.name=%s der Zähigkeit
items.armor.glyphs.viscosity.deferred=verzögert %d
items.armor.glyphs.viscosity$defereddamage.name=verzögerter Schaden
items.armor.glyphs.viscosity$defereddamage.ondeath=Der verzögerte Schaden hat dich getötet...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Durch verzögerten Schaden getötet
items.armor.glyphs.viscosity$defereddamage.desc=Anstelle davon, dass Schaden sofort zugefügt wird, verteilt er sich über die Zeit.\n\nVerbleibender verzögerter Schaden: %d.
items.armor.glyphs.viscosity.desc=Diese Glyphe ist dazu in der Lage, den durch den Träger erlittenen Schaden zu verzögern. Mit der Zeit wird der gespeicherte Schaden nach und nach, anstatt auf einmal, auf den Träger übertragen.



###armor
items.armor.armor.ac_detach=ENTFERNEN
items.armor.armor.detach_seal=Du trennst den Kiez-Aufnäher von deiner Jacke.
items.armor.armor.equip_cursed=Die Jacke schnürt sich schmerzhaft um dich. Reißverschluss klemmt.
items.armor.armor.identify=Du bist mit deiner Rüstung nun vertraut genug, um sie zu identifizieren.
items.armor.armor.hardening_gone=Die Härtung auf dieser Rüstung ist abgetragen!
items.armor.armor.incompatible=Die Interaktion mit verschiedenen Arten von Magie hat die Glyphe von dieser Rüstung entfernt!
items.armor.armor.curr_absorb=Diese _Klasse-%1$d_ Rüstung verhindert _%2$d-%3$d Schadenspunkte_ und benötigt eine _Stärke von %4$d,_ um ohne Abzüge verwendet werden zu können.
items.armor.armor.avg_absorb=Üblicherweise verhindert diese _Klasse-%1$d_ Rüstung _%2$d-%3$d Schaden_ und benötigt eine _Stärke von %4$d,_ um ohne Abzüge verwendet werden zu können.
items.armor.armor.too_heavy=Aufgrund deiner unzureichenden Stärke wird diese Rüstung deine Bewegungs-, Ausweich- und Verteidigungsfähigkeiten verringern.
items.armor.armor.probably_too_heavy=Diese Rüstung ist wahrscheinlich zu schwer für dich.
items.armor.armor.excess_str=Aufgrund deiner überschüssigen Stärke hast du eine _erhöhte Ausweichfähigkeit,_ solange du diese Rüstung trägst.
items.armor.armor.evasion=Darauf optimiert, die _Ausweichrate_ zu erhöhen.
items.armor.armor.defense=Darauf optimiert, die _Verteidigung_ zu erhöhen.
items.armor.armor.inscribed=trägt die Inschrift _%s._
items.armor.armor.glyph_hardened=Der Gegenstand wurde _verhärtet._
items.armor.armor.hardened_no_glyph=Diese Rüstung wurde _verhärtet,_ aber ist derzeit nicht mit einer Glyphe graviert.
items.armor.armor.cursed_worn=Da diese Rüstung verflucht ist, bist du nicht dazu in der Lage, sie abzulegen.
items.armor.armor.cursed=Du spürst, dass eine bösartige Magie in dieser Rüstung ruht.
items.armor.armor.weak_cursed=Trotz des Fluchs gelingt es dir, die Rüstung abzulegen.
items.armor.armor.not_cursed=Diese Rüstung ist frei von bösartiger Magie.
items.armor.armor.seal_attached=Der Kiez-Aufnäher der Alteingesessenen ist an dieser Rüstung befestigt. Sobald ihre Gesundheit unter die Hälfte ihrer Lebenspunkte zu sinken droht, verleiht er ihr bis zu _%d Abschirmung_.
items.armor.armor.seal_transfer=Der Kiez-Aufnäher der Alteingesessenen muss an ihrer ausgerüsteten Rüstung befestigt sein, um einen Bonus zu gewähren. Möchtest du ihn automatisch von der bisherigen Rüstung abtrennen und an die neue nähen?
items.armor.armor.seal_transfer_yes=ja
items.armor.armor.seal_transfer_no=nein
items.armor.armor$glyph.glyph=Glyphe
items.armor.armor$glyph.killed=%s hat dich getötet...
items.armor.armor$glyph.rankings_desc=Getötet von einer Glyphe
items.armor.armor$glyph.discover_hint=Du kannst einen Gegenstand mit diesem Effekt zufällig in den Tiefen finden, oder du kannst versuchen, ihn selber auf einen Gegenstand anzuwenden.

items.armor.classarmor.ac_ability=FÄHIGKEIT AUSWÄHLEN
items.armor.classarmor.ac_transfer=ÜBERTRAGEN
items.armor.classarmor.no_ability=Deine Rüstung hat momentan keine Fähigkeit, du solltest aber eine auswählen!
items.armor.classarmor.not_equipped=Du musst diese Rüstung tragen, um ihre speziellen Fähigkeiten zu verwenden.
items.armor.classarmor.low_charge=Die Rüstung hat nicht genug Ladung, um ihre besonderen Fähigkeiten zu verwenden.
items.armor.classarmor.charge_use=Die sofortige Verwendung der Fähigkeit verbraucht _%s_ Ladung.
items.armor.classarmor.transfer_title=Rüstung übertragen
items.armor.classarmor.transfer_desc=Die Magie der Penthouse-Krone kann auf eine andere Rüstung übertragen werden. Bedenke jedoch, dass die ursprüngliche Rüstung dabei zerstört wird. Upcycling mit Verlusten.
items.armor.classarmor.transfer_prompt=Wähle eine Rüstung
items.armor.classarmor.transfer_cancel=Abbrechen
items.armor.classarmor.transfer_complete=Die Eigenschaften deiner Heldenrüstung wurden übertragen!
items.armor.classarmor.discover_hint=Du kannst diesen Gegenstand finden, nachdem du den Boss auf Ebene 20 mit einem bestimmten Helden besiegt hast.

items.armor.clericarmor.name=Kleidung des Helden
items.armor.clericarmor.desc=Während der Kleriker diese Mischung aus Stoff und Stahl trägt, kann er eine Spezialfähigkeit einsetzen.

items.armor.clotharmor.name=Hoodie
items.armor.clotharmor.desc=Ein ausgeleierter Hoodie vom „Tresen“, einem Club, der 2020 für Eigentumswohnungen schließen musste. Er bietet grundlegenden Schutz, anders als der Mietvertrag des Clubs.
items.armor.clotharmor.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.armor.duelistarmor.name=Brustpanzer des Helden
items.armor.duelistarmor.desc=Während sie diese Plattenrüstung und den Umhang trägt, kann die Zweikämpferin eine besondere Fähigkeit einsetzen.

items.armor.huntressarmor.name=Vintage-Cordjacke
items.armor.huntressarmor.no_enemies=Keine Gegner in Sicht. Endlich Ruhe.
items.armor.huntressarmor.desc=Eine Cordjacke vom Kilo-Vintage. Solange die Zugezogene sie trägt, kann sie eine besondere Fähigkeit einsetzen.

items.armor.leatherarmor.name=Lederjacke
items.armor.leatherarmor.desc=Eine abgewetzte Lederjacke vom Flohmarkt, an den Ellbogen schon fast durch. Sie ist nicht so leicht wie ein Hoodie, schützt aber besser.

items.armor.magearmor.name=Gründer-Fleeceweste
items.armor.magearmor.desc=Fleeceweste eines Startups, das es nicht mehr gibt. Solange der Expat sie trägt, kann er eine besondere Fähigkeit einsetzen.

items.armor.mailarmor.name=Bomberjacke
items.armor.mailarmor.desc=Eine wattierte Bomberjacke, die schon mehrere Jugendkulturen und zwei Modezyklen überlebt hat. Hart, aber flexibel.

items.armor.platearmor.name=Türsteherweste
items.armor.platearmor.desc=Eine schwere Schutzweste mit Metallplatten, wie sie die Türsteher vor dem Bärghain tragen. Sie bietet jedem, der stark genug für ihr Gewicht ist, unvergleichlichen Schutz. Auf dem Rücken steht nur: „Heute nicht.“

items.armor.roguearmor.name=Hawaiihemd
items.armor.roguearmor.desc=Ein grelles Hawaiihemd mit erstaunlich vielen Taschen. Solange der Tourist es trägt, kann er eine besondere Fähigkeit einsetzen.

items.armor.scalearmor.name=Funktionsjacke
items.armor.scalearmor.desc=Eine Hightech-Outdoorjacke mit Membran und Taschen für jede Expedition, getragen vor allem zum Biomarkt. Flexibel und dennoch schützend.

items.armor.warriorarmor.name=Ballonseiden-Anzug
items.armor.warriorarmor.desc=Ein raschelnder Trainingsanzug aus Ballonseide. Solange die Alteingesessene ihn trägt, kann sie eine besondere Fähigkeit einsetzen.



###artifacts
items.artifacts.alchemiststoolkit.name=Hobbybrauer-Set
items.artifacts.alchemiststoolkit.ac_brew=BRAUEN
items.artifacts.alchemiststoolkit.ac_energize=AUFWÄRMEN
items.artifacts.alchemiststoolkit.not_ready=Dein Brauset ist noch nicht auf Betriebstemperatur.
items.artifacts.alchemiststoolkit.cursed=Dein verfluchtes Brauset hindert dich daran, Alchemie zu verwenden!
items.artifacts.alchemiststoolkit.need_energy=Du benötigst mindestens 6 Energie dafür.
items.artifacts.alchemiststoolkit.energize_desc=Jeweils 6 Energiekristalle geben dem Brauset genügend Energie, um eine neue Stufe zu erreichen, was wiederum seine Energieproduktion und die Geschwindigkeit seiner Aufwärmung erhöht.\n\nWieviel Energie möchtest du einsetzen?
items.artifacts.alchemiststoolkit.energize_1=6 Energie: +1 Stufe
items.artifacts.alchemiststoolkit.energize_all=%1$d Energie: +%2$d Level
items.artifacts.alchemiststoolkit.desc=Ein Set, mit dem ein Hipster einst Craft-Bier im Badezimmer braute. Es enthält Stoffe, Kräuter und eine kleine Mischphiole und ermöglicht "Alchemie unterwegs". In der Phiole ist etwas, das wie flüssige Kristalle alchemischer Energie aussieht.
items.artifacts.alchemiststoolkit.desc_cursed=Das verfluchte Brauset hat sich an deine Seite gefesselt und verhindert, dass du Alchemie verwenden kannst.
items.artifacts.alchemiststoolkit.desc_warming=Das Brauset wärmt sich gerade auf und ist gleich einsatzbereit.
items.artifacts.alchemiststoolkit.desc_hint=Das ausgerüstete Brauset erzeugt langsam alchemische Energie, während du Erfahrung sammelst. Vielleicht kann man die Mixtur in der Phiole verbessern, wenn man Energiekristalle beimischt.

items.artifacts.artifact.cannot_wear_two=Du kannst nicht zwei gleiche Artefakte tragen.
items.artifacts.artifact.equip_cursed=Das Artefakt bindet sich schmerzhaft an dich.
items.artifacts.artifact.curse_known=Du spürst, dass eine bösartige Magie in diesem Artefakt ruht.
items.artifacts.artifact.not_cursed=Dieses Artefakt ist frei von bösartiger Magie.
items.artifacts.artifact.need_to_equip=Du musst das Artefakt ausrüsten, um das zu tun.

items.artifacts.capeofthorns.name=Nietenweste
items.artifacts.capeofthorns.desc=Blechplatten von Bohrlinde (DM-300), zu einer schweren Nietenweste verbogen, wie aus einem Punk-Keller der Achtziger. Darin scheint noch mächtige Energie der Bohrmaschine gespeichert zu sein.
items.artifacts.capeofthorns.desc_inactive=Die Weste liegt schwer und beruhigend auf deinen Schultern. Sie scheint an Kraft zu gewinnen, wenn du Schaden erleidest.
items.artifacts.capeofthorns.desc_active=Die Weste gibt die gespeicherte Energie frei und umgibt dich mit einem schützenden Kraftfeld.
items.artifacts.capeofthorns$thorns.inert=Deine Weste wird wieder inaktiv.
items.artifacts.capeofthorns$thorns.radiating=Deine Weste beginnt Energie abzustrahlen! Du fühlst dich geschützt!
items.artifacts.capeofthorns$thorns.levelup=Deine Weste wird stärker!
items.artifacts.capeofthorns$thorns.name=Nieten
items.artifacts.capeofthorns$thorns.desc=Deine Nietenweste umgibt dich mit einem abschirmenden Kraftfeld!\n\nDein erlittener Schaden ist reduziert, solange der Nieten-Effekt besteht. Steht der Angreifer neben dir, bekommt er den reduzierten Schadensbetrag ab.\n\nVerbleibende Züge mit Nieten: %s.

items.artifacts.chaliceofblood.name=Plasmaspende-Ausweis
items.artifacts.chaliceofblood.ac_prick=STECHEN
items.artifacts.chaliceofblood.yes=Ja, ich weiß was ich tue
items.artifacts.chaliceofblood.no=Nein, habs mir anders überlegt
items.artifacts.chaliceofblood.prick_warn=Jedes Mal, wenn du für den Ausweis spendest, entzieht er dir mehr Lebensenergie, erhöht im Gegenzug aber deine natürliche Regeneration von Lebenspunkten.\n\nDerzeit fügt dir das Stechen _%1$d-%2$d_ Schaden zu, der _sowohl durch physischen als auch durch magischen Schutz oder Schadensreduktion_ verringert werden kann. Ohne Schadensreduktion besteht derzeit eine _Chance von %3$s%%_, dass deine Lebensenergie vollständig ausgelaugt wird.\n\nBist du sicher, dass du noch mehr Lebensenergie spenden willst? Die Aufwandsentschädigung ist ein Keks.
items.artifacts.chaliceofblood.onprick=Du stichst dich, und dein Blut fließt in den Ausweis. Nächster Termin in zwei Wochen.
items.artifacts.chaliceofblood.ondeath=Der Plasmaspende-Ausweis hat dir das Blut ausgesaugt...
items.artifacts.chaliceofblood.desc=Ein abgegriffener Spenderausweis mit spitzen Metallecken. Blut ist das Einzige in Berlin, das noch ohne Termin angenommen wird.
items.artifacts.chaliceofblood.desc_cursed=Der verfluchte Ausweis klebt an deiner Hand und verhindert, dass sich deine Lebensenergie wieder auflädt.
items.artifacts.chaliceofblood.desc_1=Wenn du den Ausweis in den Händen hältst, verspürst du den seltsamen Drang, dich an seinen spitzen Ecken zu stechen.
items.artifacts.chaliceofblood.desc_2=Ein bisschen deines Blutes steckt im Ausweis, und du spürst schwach, wie er dir Lebensenergie zurückgibt und deine natürliche Regeneration von Lebenspunkten erhöht. Obwohl es weh tun wird, willst du nochmal spenden.
items.artifacts.chaliceofblood.desc_3=Der Ausweis ist voller Spendenstempel und mit deinem Blut gesättigt. Du spürst, wie er dir Lebensenergie zurückgibt.

items.artifacts.cloakofshadows.name=Poncho der Schatten
items.artifacts.cloakofshadows.ac_stealth=TARNUNG
items.artifacts.cloakofshadows.cooldown=Dein Poncho benötigt noch %d Schritte, um sich wieder aufzuladen.
items.artifacts.cloakofshadows.cursed=Du kannst keinen verfluchten Poncho verwenden.
items.artifacts.cloakofshadows.no_charge=Dein Poncho ist noch nicht genug aufgeladen.
items.artifacts.cloakofshadows.desc=Ein knisternder Einweg-Regenponcho, gekauft für 12 Euro vor einem Stadion. Der Tourist hat nie bemerkt, dass er magisch ist. Getragen kann er seinen Träger für kurze Zeit unsichtbar machen, denn niemand schaut freiwillig auf jemanden im Regenponcho.\n\nJe öfter der Poncho verwendet wird, desto mächtiger wird er, was längere und häufigere Verwendung ermöglicht.
items.artifacts.cloakofshadows.discover_hint=Einer der Helden startet mit diesem Gegenstand.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Die Energie deines Ponchos ist aufgebraucht.
items.artifacts.cloakofshadows$cloakstealth.levelup=Dein Poncho wird stärker!
items.artifacts.cloakofshadows$cloakstealth.name=verhüllt
items.artifacts.cloakofshadows$cloakstealth.desc=Dein Poncho der Schatten macht dich unsichtbar, wenn du dich damit verhüllst. Du bleibst verhüllt, bis die Unsichtbarkeit abgebrochen wird oder die Ladungen des Ponchos verbraucht sind.\n\nSolange du unsichtbar bist, können Gegner dich nicht angreifen oder verfolgen. Physische Angriffe oder magische Effekte (wie Schriftrollen und Zauberstäbe) beenden die Unsichtbarkeit sofort.\n\nZüge bis zum Verbrauch der nächsten Ladung: %d.

items.artifacts.driedrose.name=Nadelnder Christbaum
items.artifacts.driedrose.ac_summon=RUFEN
items.artifacts.driedrose.ac_direct=BEFEHLEN
items.artifacts.driedrose.ac_outfit=AUSRÜSTEN
items.artifacts.driedrose.spawned=Der Schwabe ist bereits bei dir.
items.artifacts.driedrose.no_charge=Der Christbaum ist noch nicht vollständig aufgeladen.
items.artifacts.driedrose.cursed=Du kannst keinen verfluchten Christbaum benutzen.
items.artifacts.driedrose.no_space=Es ist kein Platz in deiner Nähe frei.
items.artifacts.driedrose.charged=Der Christbaum ist vollständig aufgeladen!
items.artifacts.driedrose.desc=Ist das der Christbaum, von dem der Schwabe sprach? Er nadelt bei jeder Bewegung, und trotzdem hat ihn jemand bis zuletzt gegossen. Solange du ihn trägst, ist der Schwabe nicht allein, vielleicht lässt er sich damit zu dir rufen.
items.artifacts.driedrose.desc_no_quest=Ein vertrockneter Christbaum aus dem Januar, der trotz allem noch zusammenhält. Am Stamm klebt ein Zettel: „Bitte net wegwerfen.“\n\nEr scheint eine besondere Kraft zu besitzen, aber du hast zurzeit keine Idee, wie du ihn nutzen könntest.
items.artifacts.driedrose.desc_hint=Ihm scheinen ein paar Zweige zu fehlen. Vielleicht wird der Christbaum stärker, wenn man sie wieder ansteckt.
items.artifacts.driedrose.desc_cursed=Der verfluchte Christbaum ist an deine Hand gebunden. Er fühlt sich kalt an und nadelt dir in den Ärmel.
items.artifacts.driedrose.desc_weapon=Waffe des Schwaben: %s
items.artifacts.driedrose.desc_armor=Rüstung des Schwaben: %s
items.artifacts.driedrose.desc_strength=Stärke des Schwaben: %s
items.artifacts.driedrose$petal.name=Vertrockneter Tannenzweig
items.artifacts.driedrose$petal.no_rose=Du hast keinen Christbaum, an den du diesen Zweig stecken kannst.
items.artifacts.driedrose$petal.no_room=Am Christbaum ist kein Platz mehr für diesen Zweig, du wirfst ihn weg.
items.artifacts.driedrose$petal.maxlevel=Der Christbaum ist wieder vollständig! So buschig war er nicht mal im Laden.
items.artifacts.driedrose$petal.levelup=Du steckst den Zweig an den Christbaum.
items.artifacts.driedrose$petal.desc=Ein vertrockneter Tannenzweig, der es irgendwie bis so tief unter den Kiez geschafft hat. Im Januar fällt hier einiges aus dem Fenster.
items.artifacts.driedrose$wndghosthero.title=Ausrüstung des Schwaben
items.artifacts.driedrose$wndghosthero.desc=Der Schwabe ist allein schwach, aber noch fest genug, um eine Waffe und eine Rüstung zu tragen, und er pflegt beides besser als du. Er kann diese Dinge genauso benutzen wie du.\n\nDer Schwabe kann zurzeit Gegenstände ausrüsten, die bis zu _%d Stärke_ benötigen.
items.artifacts.driedrose$wndghosthero.weapon_prompt=Wähle eine Waffe
items.artifacts.driedrose$wndghosthero.armor_prompt=Wähle eine Rüstung
items.artifacts.driedrose$wndghosthero.cant_unique=Der Schwabe kann keine einzigartigen Gegenstände nutzen.
items.artifacts.driedrose$wndghosthero.cant_cursed=Der Schwabe benutzt nur Ausrüstung, bei der du dir sicher bist, dass sie nicht verflucht ist.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Der Schwabe ist dafür möglicherweise nicht stark genug.
items.artifacts.driedrose$wndghosthero.cant_strength=Der Schwabe ist dafür nicht stark genug.

##ghost hero
items.artifacts.driedrose$ghosthero.name=Dagebliebener Schwabe
items.artifacts.driedrose$ghosthero.def_verb=ausgewichen
items.artifacts.driedrose$ghosthero.discover_hint=Du kannst diesen Charakter mit einem bestimmten Artefakt finden.

items.artifacts.driedrose$ghosthero.hello=Grüß Gott, %s! Endlich ruft mal einer an.
items.artifacts.driedrose$ghosthero.introduce=Du hast meinen Christbaum gfunden! Den hab i jeden Tag gegossen, obwohl er scho genadelt hat. Mei Familie ruft dauernd an, ob i net doch heimkomm. I bleib. Einmal Weihnachten in Berlin.\n\nAber dank dir bin i nimmer allein. Sobald i kann, komm i, wenn du rufst, und kämpf an deiner Seite, gell.\n\nSolang du den Baum dabeihast, hör i deine Stimme, und du kannst mich aus der Ferne lenken.\n\nUnd hinterher gibt's Maultaschen. I hab für acht vorgekocht, es kam ja keiner.

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=In dem Keller hab i mal mein Fahrrad abgstellt. Ordentlich angeschlossen. Des Schloss isch no da.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Wo isch eigentlich der Hausmeister? Ach so. Zwischen den Jahren.
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Mei Mutter hat heut scho dreimal angrufen. I soll mir was Warmes anziehen. Mama, i bin durchsichtig.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Die Hausverwaltung wird mit den Viechern net fertig. Aber wir zwei, gell? Wo Kehrwochenkraut wächst, isch Hoffnung.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Wenn's scho im Hinterhof so ausschaut... wie schaut's dann erst weiter unten aus?
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Was macht die Pfandratten bloß so groß? Bei uns daheim wird des Leergut am selben Tag zurückbracht.
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Von dem Amt hab i Gschichten ghört. Keine guten.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Daheim krieg i einen Termin in der nächsten Woch. Die hier warten seit Jahrzehnten. I sag nix.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=I mag mir gar net vorstellen, was hier los war, als des Amt zugmacht hat. Die Wartenden sind einfach dageblieben. Wie i.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Wartende und Amtssecurity, alle zu Monstern worden. Nur die Anzeige zeigt no 0815.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Wer isch denn hier für die ewig Wartenden zuständig? Ach so. Keiner.
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Die hätten net so enden müssen. Die wollten doch nur einen Termin.
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Hier war scho ewig keiner mehr. Fast so leer wie Berlin an Heiligabend.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Was bringt Eigentümerzwerge dazu, einen Goldstollen aufzugeben? Woanders war wohl mehr Rendite.
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Schad um des ganze Gold. I hätt's in den Bausparvertrag gsteckt.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Die Viecher hier sind genauso verdorben wie im Hinterhof. Nur mit Bauhelm.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Sogar die Schachtvampire sind hier blutdurstig. Grüßen tut au keiner.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Keine Spur von Baumaschinen. Die sind wohl au über die Feiertage heimgfahren.
items.artifacts.driedrose$ghosthero.dialogue_city_1=Schaffe, schaffe, Häusle baue. Die Eigentümerzwerge haben die Häusle bloß gekauft.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Dann isch des Renditequartier also wirklich gfallen. Gwohnt hat hier eh keiner.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Hoffentlich schaut's oben nie so aus wie hier. Na ja. Bald.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Eigentümerzwerge sollten net so blass ausschauen. Denen fehlt a ordentlicher Teller Spätzle.
items.artifacts.driedrose$ghosthero.dialogue_city_5=I weiß net, was schlimmer isch: die Eigentümerzwerge oder des, was sie bauen lassen.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Jetzt sind au die Eigentümerzwerge nur no hirnlose Monster. Viel geändert hat sich net.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Was isch des für a Ort?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Des hier isch grauenhaft. Da vorne widerspricht sich a Hausordnung selber. Des tut mir körperlich weh.
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Was haben sich die Eigentümerzwerge dabei denkt, mit solchen Mächten rumzuspielen?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Die Viecher hier wirken wie aus einer anderen Welt. Woher kommen die bloß?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Merksch des au? Als ob uns wer beobachtet. Wie die Nachbarin, wenn i Kehrwoche mach.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Zum Glück gibt's hier Fackeln. Im Berliner Treppenhaus geht des Licht ja nie.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Warum passiert des? I hab denkt, wir hätten's gschafft.
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Wie kann des Ding immer no so viel Einfluss haben?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Hoffentlich weisch, was du mit dem Mietvertrag machst. Den hebt man gut auf, gell. Im Ordner.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=I nehm an, wir sind no net ganz fertig.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Jetzt sind wir so weit kommen. Des schaffen wir bis zum Ende.
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Nur no a bissle. Dann sind wir draußen. Und dann ruf i endlich daheim an.

items.artifacts.driedrose$ghosthero.seen_goo_1=Vorsicht, Mietschimmel!
items.artifacts.driedrose$ghosthero.seen_goo_2=Wegen dem hab i dreimal am Tag stoßgelüftet. Jetzt zahlen wir's ihm heim.
items.artifacts.driedrose$ghosthero.seen_goo_3=So was darf net weiterwachsen. Au wenn's sich Ausstattung nennt.
items.artifacts.driedrose$ghosthero.seen_tengu_1=Do parkt einer mitm SUV aufm Tempelhofer Feld. Des isch net amol a Parkplatz.
items.artifacts.driedrose$ghosthero.seen_tengu_2=Der hat uns zugeparkt! Und sagt, er steht nur kurz.
items.artifacts.driedrose$ghosthero.seen_tengu_3=I hab ghört, sein Duftbäumchen gibt ihm Vorfahrt vor allem.
items.artifacts.driedrose$ghosthero.seen_dm300_1=Nur Eigentümerzwerge bauen a Bohrmaschine mit Eindringlingsabwehr.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Des Ding isch ja riesig. Da wackelt ja des ganze Haus.
items.artifacts.driedrose$ghosthero.seen_dm300_3=Wie kann des Ding so lang laufen? Fertig wird's trotzdem net.
items.artifacts.driedrose$ghosthero.seen_king_1=Des meinen die Leut wohl, wenn sie sagen, Eigentum verdirbt.
items.artifacts.driedrose$ghosthero.seen_king_2=Der isch jetzt mehr Leiche als König. Verwaltet wird trotzdem.
items.artifacts.driedrose$ghosthero.seen_king_3=Sogar im Tod gehorchen die Eigentümerzwerge ihrem König.
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh. Des schaut net gut aus.
items.artifacts.driedrose$ghosthero.seen_yog_2=So schaut also a Gottheit aus? Wie a Tabelle.
items.artifacts.driedrose$ghosthero.seen_yog_3=Des wird weh tun. Wie jede Erhöhung.

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Viel Glück, gell...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=I werd grad a bissle durchsichtiger...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=I komm wieder... Versprochen...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Tut mir leid... Viel Glück...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Mach's fertig... ohne mich...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Na... i kann nimmer...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Wie hasch des überlebt?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=So eins hätt i au gern ghabt.
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Mei Güte! Du lebsch ja no!
items.artifacts.driedrose$ghosthero.player_killed_1=Nein...!
items.artifacts.driedrose$ghosthero.player_killed_2=I hab nix machen können...
items.artifacts.driedrose$ghosthero.player_killed_3=Net so...

items.artifacts.driedrose$ghosthero.direct_prompt=Was soll i machen?
items.artifacts.driedrose$ghosthero.directed_follow_1=Gut, i folg dir.
items.artifacts.driedrose$ghosthero.directed_follow_2=I bleib hinter dir.
items.artifacts.driedrose$ghosthero.directed_follow_3=Hinterher...
items.artifacts.driedrose$ghosthero.directed_follow_4=Passt, los geht's!
items.artifacts.driedrose$ghosthero.directed_follow_5=I halt dir den Rücken frei.
items.artifacts.driedrose$ghosthero.directed_attack_1=Gut, den nehm i mir vor.
items.artifacts.driedrose$ghosthero.directed_attack_2=Den krieg i scho.
items.artifacts.driedrose$ghosthero.directed_attack_3=Auf ihn!
items.artifacts.driedrose$ghosthero.directed_attack_4=Den kehren wir weg!
items.artifacts.driedrose$ghosthero.directed_attack_5=Den hab i.
items.artifacts.driedrose$ghosthero.directed_position_1=Gut, i pass hier auf.
items.artifacts.driedrose$ghosthero.directed_position_2=I geh da hin und kämpf.
items.artifacts.driedrose$ghosthero.directed_position_3=I wechsel die Stelle...
items.artifacts.driedrose$ghosthero.directed_position_4=Bin scho unterwegs!
items.artifacts.driedrose$ghosthero.directed_position_5=I stell mich da hin. Ordentlich.

items.artifacts.driedrose$ghosthero.desc=Ein halb durchsichtiger Schwabe im Norwegerpulli, die Tupperdose Spätzle immer dabei. Seine Kraft hängt an dem Christbaum, den du trägst.\n\nViel hermachen mag er nicht, aber er ist dein einziger echter Freund hier unten. Und du seiner.

##back to artifacts
items.artifacts.etherealchains.name=Äther-Spanngurte
items.artifacts.etherealchains.ac_cast=AUSWERFEN
items.artifacts.etherealchains.rooted=Deine Spanngurte können dich nicht ziehen, solange du verwurzelt bist.
items.artifacts.etherealchains.no_charge=Deine Spanngurte sind nicht ausreichend aufgeladen.
items.artifacts.etherealchains.cursed=Du kannst verfluchte Spanngurte nicht verwenden.
items.artifacts.etherealchains.does_nothing=Das wird gar nichts bewirken.
items.artifacts.etherealchains.cant_pull=Deine Spanngurte können dieses Ziel nicht ziehen.
items.artifacts.etherealchains.cant_reach=Deine Spanngurte können diesen Ort nicht erreichen.
items.artifacts.etherealchains.inside_wall=Deine Spanngurte können dich durch Wände ziehen, aber nicht hinein.
items.artifacts.etherealchains.nothing_to_grab=Dort ist nichts zu greifen.
items.artifacts.etherealchains.prompt=Wähle eine Zielposition.
items.artifacts.etherealchains.desc=Diese langen, leichten Spanngurte von einem Umzugstransporter glühen vor spiritueller Energie. Mit ihnen kannst du dich zu Wänden ziehen oder Gegner zu dir heranziehen. Dank ihrer ätherischen Natur lassen sie sich sogar durch Wände schleudern.
items.artifacts.etherealchains.desc_cursed=Die verfluchten Spanngurte haben sich um dich gewickelt, zerren an dir und versuchen, dich zu fesseln oder zu Fall zu bringen.
items.artifacts.etherealchains.desc_equipped=Die Gurte hängen an deiner Seite und saugen langsam die spirituelle Energie derer auf, die du besiegst. Jede Ladung entspricht einem Gurtstück, das genau eine Kachel weit reicht.
items.artifacts.etherealchains$chainsrecharge.levelup=Deine Spanngurte werden stärker!

items.artifacts.holytome.name=heiliger Foliant
items.artifacts.holytome.ac_cast=AUSWERFEN
items.artifacts.holytome.no_spell=Du kannst diesen Zauber gerade nicht sprechen.
items.artifacts.holytome.cursed=Du kannst ein verfluchtes Zauberbuch nicht benutzen.
items.artifacts.holytome.levelup=Dein Zauberbuch wurde stärker!
items.artifacts.holytome.desc=Ein heiliger Foliant, der als Fokus für die göttliche Magie des Klerikers fungiert. Mithilfe des Folianten kann der Kleriker eine Vielzahl von Zaubersprüchen wirken.\n\nWährend der Kleriker den Folianten verwendet, wird dieser mit der Zeit immer mächtiger, wodurch der Kleriker mehr maximale Ladungen erhält und sich die Aufladerate leicht erhöht.
items.artifacts.holytome.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.artifacts.hornofplenty.name=Foodsharing-Tüte
items.artifacts.hornofplenty.ac_snack=IMBISS
items.artifacts.hornofplenty.ac_eat=ESSEN
items.artifacts.hornofplenty.ac_store=FÜTTERN
items.artifacts.hornofplenty.eat=Du isst aus der Tüte.
items.artifacts.hornofplenty.prompt=Wähle etwas zu Essen aus
items.artifacts.hornofplenty.no_food=In deiner Tüte ist nichts zu essen!
items.artifacts.hornofplenty.full=Deine Tüte ist voll mit Essen!
items.artifacts.hornofplenty.reject=Deine Tüte spuckt die ungekochte Fadfrucht wieder aus.
items.artifacts.hornofplenty.maxlevel=Deine Tüte hat so viel Essen gerettet, wie sie kann!
items.artifacts.hornofplenty.levelup=Deine Tüte hat die Nahrungsspende verzehrt und wird stärker!
items.artifacts.hornofplenty.feed=Die Tüte hat deine Nahrungsspende verzehrt.
items.artifacts.hornofplenty.desc=Eine Stofftüte aus einem Foodsharing-Regal, die sich nach und nach mit geretteten Lebensmitteln füllt, wenn man sie ausrüstet und Erfahrung gewinnt. Du kannst jede Ladung einzeln als Imbiss genießen oder essen, bis du voll bist.
items.artifacts.hornofplenty.desc_hint=Vielleicht wird die Tüte stärker, wenn man ihr Nahrung spendet.
items.artifacts.hornofplenty.desc_cursed=Die verfluchte Tüte hat sich an dich gebunden und scheint dir Essen zu entreißen, statt welches zu retten.

items.artifacts.lloydsbeacon.name=Uraltes Jahresticket
items.artifacts.lloydsbeacon.ac_zap=FEUERN
items.artifacts.lloydsbeacon.ac_set=FESTLEGEN
items.artifacts.lloydsbeacon.ac_return=RÜCKKEHR
items.artifacts.lloydsbeacon.no_charge=Dein Jahresticket hat im Moment nicht genug Energie.
items.artifacts.lloydsbeacon.tele_fail=Die Teleportationsmagie versagt.
items.artifacts.lloydsbeacon.prompt=Wähle ein Feld, auf das gefeuert werden soll.
items.artifacts.lloydsbeacon.levelup=Dein Jahresticket wird stärker!
items.artifacts.lloydsbeacon.preventing=Die starke magische Aura dieses Ortes verhindert, dass du dein Jahresticket verwenden kannst!
items.artifacts.lloydsbeacon.creatures=Die psychische Aura naher Kreaturen erlaubt es dir nicht, dein Jahresticket zu verwenden.
items.artifacts.lloydsbeacon.return=Dein Jahresticket wurde auf deine momentane Position abgestempelt und erlaubt dir, jederzeit hierher zurückzukehren.
items.artifacts.lloydsbeacon.desc=Ein laminiertes Jahresticket von 1996, niemals abgelaufen und noch immer gültig, weil niemand mehr weiß, wie man es kontrolliert. Es erlaubt Teleportationsmagie: Du kannst an eine vorher festgelegte Position zurückkehren und, sofern es durch Ausrüsten aufgeladen wurde, auch zufällige Teleportationen auslösen. Diese lassen sich auf beliebige Ziele oder auf dich selbst richten.
items.artifacts.lloydsbeacon.desc_set=Die Haltestelle wurde irgendwo auf Ebene %d gesetzt.

items.artifacts.masterthievesarmband.name=VIP-Bändchen
items.artifacts.masterthievesarmband.ac_steal=STEHLEN
items.artifacts.masterthievesarmband.no_charge=Dein Bändchen hat noch nicht genügend Ladung.
items.artifacts.masterthievesarmband.cursed=Du kannst kein verfluchtes Bändchen benutzen.
items.artifacts.masterthievesarmband.full=Dein Bändchen ist vollständig aufgeladen!
items.artifacts.masterthievesarmband.prompt=Wähle einen Feind aus, auf den du zielen möchtest
items.artifacts.masterthievesarmband.no_target=Du musst auf einen Feind zielen, der direkt neben dir steht.
items.artifacts.masterthievesarmband.steal_shopkeeper=Du kannst nicht direkt vom Spätimann stehlen.
items.artifacts.masterthievesarmband.no_steal=Dieser Feind hat nichts, was man stehlen könnte.
items.artifacts.masterthievesarmband.stole_item=Du hast gestohlen: %s.
items.artifacts.masterthievesarmband.failed_steal=Du hast es nicht geschafft, etwas zu stehlen.
items.artifacts.masterthievesarmband.level_up=Dein Bändchen wird stärker!
items.artifacts.masterthievesarmband.desc=Ein purpurnes Festivalbändchen mit dem Aufdruck "ALL AREAS" und einem verwischten Clubstempel, der genauso aussieht wie der vom Bürgeramt. Es gehört dir zwar nicht, aber wahrscheinlich gehörte es seinem vorigen Träger auch nicht.
items.artifacts.masterthievesarmband.desc_cursed=Das verfluchte Bändchen klebt an deinem Handgelenk, und irgendwie wird dein Goldbeutel immer leichter... wie auf jedem Festival.
items.artifacts.masterthievesarmband.desc_worn=Während du Erfahrung sammelst, baut sich im Bändchen Energie auf. Damit kannst du aus Läden stehlen oder Feinde ausrauben!\n\nFeinde ausrauben geschieht augenblicklich: Sie werden kurz desorientiert, und du kannst ihnen abnehmen, was auch immer sie dabeihaben! Gegen ahnungslose Feinde wirkt das besser. Denselben Feind mehrmals auszurauben bringt keine zusätzliche Beute.

items.artifacts.sandalsofnature.name=Barfußschuhe
items.artifacts.sandalsofnature.name_1=Moos-Sneaker
items.artifacts.sandalsofnature.name_2=Moos-Stiefel
items.artifacts.sandalsofnature.name_3=Wurzel-Beinschienen
items.artifacts.sandalsofnature.ac_feed=FÜTTERN
items.artifacts.sandalsofnature.ac_root=VERWURZELN
items.artifacts.sandalsofnature.prompt=Wähle eine Samenbombe
items.artifacts.sandalsofnature.levelup=Das Schuhwerk wächst rapide!
items.artifacts.sandalsofnature.absorb_seed=Das Schuhwerk absorbiert das Samenkorn, es sieht gesünder aus.
items.artifacts.sandalsofnature.no_effect=Du musst deinen Barfußschuhen erst einen Samen verfüttern.
items.artifacts.sandalsofnature.low_charge=Deine Schuhe haben dafür nicht genug Energie.
items.artifacts.sandalsofnature.prompt_target=Wähle einen Ort
items.artifacts.sandalsofnature.out_of_range=Dieser Ort ist außer Reichweite.
items.artifacts.sandalsofnature.desc_1=Was wie ein Paar handgeflochtene Barfußschuhe aus einem Concept Store aussah, sind in Wahrheit zwei Pflanzen! Sie wirken schwach und blass, vielleicht brauchen sie Nährstoffe?
items.artifacts.sandalsofnature.desc_2=Das Schuhwerk ist gewachsen und sieht nun eher wie ein paar maßgeschneiderter Sneaker aus. Es hat wieder etwas Farbe bekommen; vielleicht kann es noch weiter wachsen?
items.artifacts.sandalsofnature.desc_3=Die Pflanzen sind erneut gewachsen und sehen jetzt aus wie feste Stiefel aus Moos und Rinde. Sie haben ihre Kraft zurückerlangt, vielleicht können sie aber noch weiter wachsen?
items.artifacts.sandalsofnature.desc_4=Die Pflanzen sind ausgewachsen und umschließen deine Beine wie Wurzel-Beinschienen, braun und kräftig wie die Straßenbäume, die das Bezirksamt seit Jahren fällen will.
items.artifacts.sandalsofnature.desc_hint=Mit diesen Schuhen fühlst du jede Wurzel, jeden Kronkorken und dich mit der Natur verbunden.
items.artifacts.sandalsofnature.desc_cursed=Die verfluchten Barfußschuhe verhindern jegliche Einstimmung auf die Natur. Und sie drücken.
items.artifacts.sandalsofnature.desc_ability=Die Schuhe haben eine Schattierung der Farbe des Samens, den du ihnen zuletzt verfüttert hast. Sie können sich kurzzeitig im Erdboden verwurzeln und den Effekt der jeweiligen Pflanze irgendwo in einem Radius von 3 Feldern hervorrufen.\nSamen: _%s_\nBenötigte Ladungen: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=Du hast dem Schuhwerk %d Samen gefüttert.

items.artifacts.skeletonkey.name=Generalschlüssel
items.artifacts.skeletonkey.ac_insert=EINSETZEN
items.artifacts.skeletonkey.cursed=Du kannst keinen verfluchten Generalschlüssel verwenden.
items.artifacts.skeletonkey.prompt=Wähle ein Ziel
items.artifacts.skeletonkey.invalid_target=Hier gibt es nichts, was man auf- oder abschließen könnte.
items.artifacts.skeletonkey.lock_no_space=Du kannst niemanden, der in einer Tür steht, abschließen!
items.artifacts.skeletonkey.iron_charges=Es kostet 1 Ladung, ein normales Schloss zu öffnen.
items.artifacts.skeletonkey.gold_charges=Es kostet 2 Ladungen, ein goldenes Schloss zu öffnen.
items.artifacts.skeletonkey.lock_charges=Es kostet 2 Ladungen, eine Tür abzuschließen.
items.artifacts.skeletonkey.wall_charges=Es kostet 2 Ladungen, eine temporäre Wand zu erschaffen.
items.artifacts.skeletonkey.crystal_charges=Es kostet 5 Ladungen, ein Kristallschloss zu öffnen.
items.artifacts.skeletonkey.wont_open=Aus irgendeinem Grund weigert sich der Schlüssel, in dieses Schloss zu passen.
items.artifacts.skeletonkey.locked_with_key=Diese Tür wurde mit deinem Generalschlüssel verschlossen.
items.artifacts.skeletonkey.force_lock=Das Schloss ist ohne deinen Generalschlüssel marode geworden. Du schaffst es, es aufzubrechen.
items.artifacts.skeletonkey.discard=Du wirfst deine überflüssigen Schlüssel weg.
items.artifacts.skeletonkey.levelup=Dein Generalschlüssel wird stärker!
items.artifacts.skeletonkey.desc=Der Generalschlüssel eines Hausmeisters, der seit Jahren niemandem mehr aufmacht. Jedes Mal, wenn du darauf schaust, scheinen die Zähne anders angeordnet zu sein.
items.artifacts.skeletonkey.desc_worn=Dieser magische Schlüssel scheint stärker zu werden, wenn du ihn anstelle der normalen Schlüssel hier unten benutzt. Er passt in fast jedes Schloss unter Neukölln und kann es entweder öffnen oder verschließen. Es funktioniert sogar bei Schlössern, deren Türen zuvor nicht verschlossen waren.\n\nZudem kann der Schlüssel in freien Räumen in eine der vier Himmelsrichtungen oder diagonal verwendet werden, um die Luft vor dir zu ‚verschließen‘. Dadurch entsteht eine drei Felder breite Barriere, die 10 Züge lang bestehen bleibt. Bei diesem Vorgang werden Gegner weggestoßen, sofern genügend Platz dafür vorhanden ist.
items.artifacts.skeletonkey.desc_cursed=Der verfluchte Schlüssel scheint aktiv zu vermeiden, in überhaupt irgendein Schloss zu passen, und erschwert dir sogar die Nutzung deiner anderen Schlüssel (aber verhindert es nicht völlig).
items.artifacts.skeletonkey$keywall.desc=Hier wurde mit dem Generalschlüssel eine vorübergehende magische Barriere errichtet. Zutritt nur für Befugte.

items.artifacts.talismanofforesight.name=Türspion-Talisman
items.artifacts.talismanofforesight.ac_scry=VORHERSEHUNG
items.artifacts.talismanofforesight.low_charge=Dieser Talisman benötigt mindestens 5% Ladung, um vorauszuschauen.
items.artifacts.talismanofforesight.prompt=Wähle ein Feld zum Untersuchen.
items.artifacts.talismanofforesight.levelup=Dein Talisman wird stärker!
items.artifacts.talismanofforesight.full_charge=Dein Talisman ist vollständig aufgeladen!
items.artifacts.talismanofforesight.desc=Ein Türspion aus einer Altbautür, an einer Kette getragen. Er scheint alles um dich herum zu beobachten und ein Auge für Verstecktes offen zu halten, wie die Nachbarin aus dem Erdgeschoss.
items.artifacts.talismanofforesight.desc_worn=Als du den Talisman umhängst, spürst du, wie sich deine Sinne schärfen. Der Talisman lädt sich langsam auf, wenn Zeit vergeht und wenn du versteckte Türen oder Haufen aufdeckst.\n\nDer Talisman kann seine Ladung einsetzen, um alle Geheimnisse in einem kegelförmigen Gebiet zu enthüllen, und erlaubt dir, Gegner und Gegenstände für kurze Zeit zu sehen.
items.artifacts.talismanofforesight.desc_cursed=Der verfluchte Türspion starrt dich an, was deine Sinne abschwächt.
items.artifacts.talismanofforesight$foresight.name=Vorhersehung
items.artifacts.talismanofforesight$foresight.uneasy=Du fühlst dich unwohl.
items.artifacts.talismanofforesight$foresight.desc=Du bist nervös. Als wäre eine unsichtbare Gefahr in der Nähe.

items.artifacts.timekeepershourglass.name=Eieruhr des Bürgeramts
items.artifacts.timekeepershourglass.ac_activate=AKTIVIEREN
items.artifacts.timekeepershourglass.deactivate=Du beendest die Unterbrechung des Laufs der Zeit.
items.artifacts.timekeepershourglass.no_charge=Deine Eieruhr hat sich noch nicht genug aufgeladen.
items.artifacts.timekeepershourglass.cursed=Du kannst eine verfluchte Eieruhr nicht verwenden.
items.artifacts.timekeepershourglass.onstasis=Die Welt scheint sich in einem Augenblick verändert zu haben.
items.artifacts.timekeepershourglass.onfreeze=Deine Umgebung friert urplötzlich ein.
items.artifacts.timekeepershourglass.stasis=Versetze mich selbst in Stasis
items.artifacts.timekeepershourglass.freeze=Friere die Zeit ein
items.artifacts.timekeepershourglass.prompt=Wie möchtest du die Magie der Eieruhr verwenden?\n\nIn Stasis läuft die Zeit normal weiter, während du eingefroren und absolut unverwundbar bist. Verbraucht bis zu 2 Ladungen auf einmal.\n\nWenn die Zeit eingefroren ist, kannst du dich bewegen, als würden deine Handlungen keine Zeit beanspruchen. Ein Angriff oder das Benutzen der Eieruhr stoppt den Effekt.
items.artifacts.timekeepershourglass.desc=Diese große, verzierte Eieruhr stand früher am Schalter des Bürgeramts, wo die Zeit ohnehin stillstand. Wenn du sie drehst und den rieselnden Sand beobachtest, spürst du, wie ihre Magie dich in den Bann zieht. Sie gibt dir sicher etwas Kontrolle über die Zeit.
items.artifacts.timekeepershourglass.desc_hint=Die Eieruhr scheint Sand verloren zu haben. Wenn du nur welchen finden könntest...
items.artifacts.timekeepershourglass.desc_cursed=Die verfluchte Eieruhr ist an dich gefesselt, und du spürst, wie sie deinen Zeitfluss manipulieren will. Wie jede Warteschlange.
items.artifacts.timekeepershourglass$timefreeze.name=Zeit einfrieren
items.artifacts.timekeepershourglass$timefreeze.desc=Die Zeit um dich herum ist eingefroren, so dass du Aktionen augenblicklich ausführen kannst. Dieser Effekt hält an, bis er abgebrochen wird oder deine Eieruhr keine Ladung mehr hat. Auch ein Angriff oder die Verwendung von Magie wird diesen Effekt beenden.\n\nZüge bis zum Einsatz einer Ladung: %s.
items.artifacts.timekeepershourglass$sandbag.name=Tüte Spielplatzsand
items.artifacts.timekeepershourglass$sandbag.levelup=Du hast den Sand in deine Eieruhr gefüllt.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Deine Eieruhr ist mit magischem Sand gefüllt!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Du hast keine Eieruhr, in die du diesen Sand füllen könntest.
items.artifacts.timekeepershourglass$sandbag.desc=Diese kleine Tüte feinen Sandes passt perfekt in deine Eieruhr.\n\nMerkwürdig, dass der Spätimann sie genau dann im Regal hat, wenn du sie brauchst...

items.artifacts.unstablespellbook.name=Wackeliger Sprachführer
items.artifacts.unstablespellbook.ac_read=LESEN
items.artifacts.unstablespellbook.ac_add=HINZUFÜGEN
items.artifacts.unstablespellbook.blinded=Solange du blind bist kannst du nicht im Buch lesen.
items.artifacts.unstablespellbook.no_charge=Dein Sprachführer hat im Moment keine Energie.
items.artifacts.unstablespellbook.cursed=Du kannst nicht in einem verfluchten Sprachführer lesen.
items.artifacts.unstablespellbook.prompt=Wähle eine Schriftrolle
items.artifacts.unstablespellbook.infuse_scroll=Du fügst die Energie der Schriftrolle dem Buch hinzu.
items.artifacts.unstablespellbook.unable_scroll=Du kannst dem Buch diese Schriftrolle nicht hinzufügen.
items.artifacts.unstablespellbook.unknown_scroll=Du weißt noch nicht, was das für eine Schriftrolle ist.
items.artifacts.unstablespellbook.desc=Ein zerlesener Sprachführer "Deutsch für Expats" mit Eselsohren. Beim Blättern zischt und knistert es, die Seiten pulsieren vor instabiler Energie. Liest du daraus vor, lässt sich nicht vorhersagen, welchen Zauberspruch du hervorbringst. Wie bei jedem Meeting, das mit „quick sync“ beginnt.
items.artifacts.unstablespellbook.desc_cursed=Der verfluchte Sprachführer hat sich an dich gebunden und hindert dich daran, die meisten Schriftrollen zu lesen.
items.artifacts.unstablespellbook.desc_index=Das Inhaltsverzeichnis ist unvollständig und weist im Moment auf die folgenden leeren Seiten hin:
items.artifacts.unstablespellbook.desc_empowered=Die Formulare, die du dem Sprachführer hinzugefügt hast, pulsieren vor Macht. Du kannst die exotische Variante ihrer Effekte wählen, das kostet aber eine zusätzliche Ladung.
items.artifacts.unstablespellbook.read_empowered=Die Schriftrolle, die du zum Sprachführer hinzugefügt hast, strotzt vor Energie. Du kannst entweder die normale oder die exotische Variante des Effekts von diesem Zauberspruch kanalisieren.\n\nWählst du die exotische Variante, kostet das 2 Ladungen anstelle von 1.



###bags
items.bags.bag.name=Jutebeutel
items.bags.bag.discover_hint=Du kannst diesen Gegenstand in einem Laden kaufen.

items.bags.potionbandolier.name=Sixpack-Gurt
items.bags.potionbandolier.desc=Dieser breite Gurt hat viele kleine Schlaufen, in denen du Pullen, dein Sternchen-Pils oder Fläschchen mit Flüssigmetall sicher verstauen kannst. Im Kiez trägt man so etwas zum Flohmarkt am Maybachufer.\n\nIn den Schlaufen sollten deine Tränke gut vor Kälte geschützt sein.

items.bags.scrollholder.name=Aktenordner
items.bags.scrollholder.desc=Ein grauer Behördenordner mit Rückenschild "Diverses". Deine Formulare passen hinein, dazu Seitenfächer für Zauberkristalle, arkane Stifte und arkanes Harz.\n\nNichts auf der Welt ist so schwer entflammbar wie eine Akte, die niemand bearbeiten will. Deine Schriftrollen sind darin vor Feuer sicher.

items.bags.velvetpouch.name=Bauchtasche
items.bags.velvetpouch.desc=Diese quer getragene Bauchtasche nimmt viele kleine Gegenstände auf, zum Beispiel Samen, Stadttauben und einige Alchemie-Zutaten. Ironisch getragen, aber tatsächlich praktisch.
items.bags.velvetpouch.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.bags.magicalholster.name=Magischer Fahrradkorb
items.bags.magicalholster.desc=Ein verbeulter Fahrradkorb ohne Fahrrad. Das Fahrrad wurde vermutlich geklaut, der Korb blieb aus Protest. Eine mächtige Magie lässt ihn eine große Anzahl an Fernkampfwaffen aufnehmen.\n\nDu greifst hinein und ziehst immer genau den gesuchten Gegenstand heraus.\n\nDie Magie des Korbs sorgt dafür, dass Zauberstäbe ein wenig schneller laden und Geschosse etwas länger halten.



###bombs
items.bombs.arcanebomb.name=Esoterik-Böller
items.bombs.arcanebomb.desc=Dieser Böller wurde bei Vollmond energetisiert. Er explodiert mit enormem Druck, ähnlich dem aufgepumpten Angriff des Schleims, und verursacht _%1$d-%2$d Punkte magischen Schaden_ innerhalb von 2 Feldern. Chakren inklusive.
items.bombs.arcanebomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.bomb.name=Lachgasflasche
items.bombs.bomb.ac_lightthrow=AUFDREHEN & WERFEN
items.bombs.bomb.snuff_fuse=Du drehst das Ventil schnell wieder zu. Das Zischen hört auf, die Flasche schmollt.
items.bombs.bomb.ondeath=Die Explosion hat dich getötet...
items.bombs.bomb.rankings_desc=Von einer Explosion getötet worden
items.bombs.bomb.desc=Eine knallbunte Zwei-Kilo-Flasche Lachgas, übrig geblieben neben hundert leeren Kartuschen im Rinnstein. Auf dem Etikett steht „Nur für Sahnesiphons“, und irgendwer hat „LOL“ daneben gekritzelt. Wer das Ventil aufdreht, erlebt, wie wenig lustig Überdruck ist: Die Flasche platzt mit _%1$d-%2$d Punkten Schaden_ an allem in direkter Nähe und zerlegt manches an benachbartem Terrain oder Gegenständen.
items.bombs.bomb.desc_fuse=Nach dem Aufdrehen zischt das Ventil ein paar Züge lang, dann gibt die Flasche auf. Genug Zeit für ein Video.
items.bombs.bomb.desc_burning=Das Ventil zischt und die Flasche beult sich schon, also halte Abstand oder dreh es zu!
items.bombs.bomb$doublebomb.name=zwei Lachgasflaschen
items.bombs.bomb$doublebomb.desc=Zwei Lachgasflaschen! Die zweite gab es gratis dazu, im Kiez nennt man das Mengenrabatt.

items.bombs.firebomb.name=Grillkohle-Bombe
items.bombs.firebomb.desc=Diese Bombe wurde mit Grillanzünder aufgewertet. Sie explodiert in einem größeren Bereich, verursacht _%1$d-%2$d Schadenspunkte_ und hinterlässt innerhalb von 2 Feldern anhaltendes Feuer. Wie ein Sonntag im Park.
items.bombs.firebomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.flashbangbomb.name=Stroboskop-Böller
items.bombs.flashbangbomb.desc=Diese Bombe explodiert in einer Welle aus Licht, Bass und Elektrizität, wie der Moment, in dem im Club das Licht angeht. Alles im Umkreis von 2 Feldern erleidet _%1$d- %2$d Schaden_ durch die Explosion, zusätzlich 25%% Schaden durch die Elektrizität und wird 10 Züge lang betäubt.
items.bombs.flashbangbomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.frostbomb.name=Trockeneis-Bombe
items.bombs.frostbomb.desc=Diese Bombe, früher Nebeleffekt einer Kellerparty, explodiert in einem größeren Bereich, verursacht _%1$d-%2$d Schadenspunkte_ und verbreitet innerhalb von 2 Feldern einen anhaltenden, eiskalten Windstoß.
items.bombs.frostbomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.holybomb.name=Weihwasser-Böller
items.bombs.holybomb.desc=Diese Bombe wurde mit Weihwasser aus einer Gemeinde befüllt, die ihren Kirchturm gerade zu Lofts umbaut. Alles im Umkreis von 2 Feldern erleidet _%1$d-%2$d Punkte_ Schaden, und untote oder dämonische Gegner nehmen zusätzlich 50%% Schaden durch das heilige Licht.
items.bombs.holybomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.noisemaker.name=Ruhestörer
items.bombs.noisemaker.desc=Diese Bombe macht nach Ablauf der Lunte immer wieder Lärm, wie eine Nachbarsparty um vier Uhr morgens. Wenn etwas sie berührt, explodiert sie und verursacht an allem im Umkreis von 2 Feldern _%1$d-%2$d Punkte_ Schaden!
items.bombs.noisemaker.desc_burning=Der Ruhestörer wummert vor sich hin. Er explodiert, sobald sich jemand beschweren kommt!
items.bombs.noisemaker.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.smokebomb.name=Nebelkerze
items.bombs.smokebomb.desc=Diese Bombe stößt bei der Explosion eine dicke Wolke aus, wie jede gute Pressemitteilung. Sie verursacht _%1$d-%2$d Schadenspunkte_ und verteilt im Umkreis von 2 Feldern dichte Nebelschwaden.
items.bombs.smokebomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.regrowthbomb.name=Wildwuchs-Bombe
items.bombs.regrowthbomb.desc=Guerilla-Gardening in seiner ehrlichsten Form. Statt zu explodieren, verspritzt diese Bombe lebensspendende Flüssigkeit im Umkreis von 3 Feldern, und dort sprießen schnell Gras und Pflanzen. Du und alle betroffenen Verbündeten werden geheilt, als hättet ihr einen Ingwer-Heilshot getrunken.
items.bombs.regrowthbomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.shrapnelbomb.name=Schrottbombe
items.bombs.shrapnelbomb.desc=Diese Bombe wurde mit Metallplatten von DM-300 gespickt. Wenn sie explodiert, zerbrechen die Platten und schießen in alle Richtungen davon. Alles in einem riesigen Bereich erleidet _%1$d-%2$d Punkte_ Schaden. Such dir besser eine Deckung, bevor du sie einsetzt...
items.bombs.shrapnelbomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.bombs.woollybomb.name=Streichelzoo-Bombe
items.bombs.woollybomb.desc=Diese Bombe erschafft bei der Explosion eine Herde magischer Schafe, als hätte ein Kinderbauernhof sein Budget verloren. Die Explosion verursacht _%1$d-%2$d Punkte_ Schaden im Umkreis von 2 Feldern. Die Schafe blockieren Bewegung und bleiben lange stehen! In der Nähe mächtiger Feinde verschwinden sie früher, und wenn man mit ihnen interagiert, noch schneller.
items.bombs.woollybomb.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

###food
items.food.berry.name=Hinterhofbeere
items.food.berry.eat_msg=Lecker! Urban Foraging lohnt sich doch.
items.food.berry.desc=Diese kleine Beere wächst zwischen Mülltonnen und Fahrradleichen, wo die Hausverwaltung seit Jahren „Grünpflege“ abrechnet. Sie ist schnell gegessen, sättigt ein wenig und könnte einen brauchbaren Samen enthalten!
items.food.berry.discover_hint=Du kannst diesen Gegenstand durch ein bestimmtes Heldentalent finden.

items.food.blandfruit.name=Fadfrucht
items.food.blandfruit.cooked=gekochte Fadfrucht
items.food.blandfruit.sunfruit=Pflasterfrucht
items.food.blandfruit.rotfruit=Fäulnisfrucht
items.food.blandfruit.earthfruit=Sitzfleischfrucht
items.food.blandfruit.blindfruit=Blendfrucht
items.food.blandfruit.firefruit=Brandfrucht
items.food.blandfruit.icefruit=Frostfrucht
items.food.blandfruit.fadefruit=Räumungsfrucht
items.food.blandfruit.sorrowfruit=Neidfrucht
items.food.blandfruit.stormfruit=Schwindelfrucht
items.food.blandfruit.dreamfruit=Kehrwochenfrucht
items.food.blandfruit.starfruit=Segensfrucht
items.food.blandfruit.swiftfruit=Hektikfrucht
items.food.blandfruit.raw=Du kannst es nicht über dich bringen, es roh zu essen.
items.food.blandfruit.desc=So trocken und substanzlos wie ein Gemeinschaftsgarten im November. Vielleicht bringt es etwas, sie mit einer anderen Zutat zu kochen.
items.food.blandfruit.desc_cooked=Die Frucht ist während der Zeit im Topf sichtbar praller geworden und hat sogar die Eigenschaften des mitgekochten Samens übernommen. Sie hat nun die gleichen Effekte wie ein aus mehreren dieser Samen gebrauter Trank.
items.food.blandfruit.desc_eat=Sieht so aus, als könne man sie jetzt essen!
items.food.blandfruit.desc_throw=Sieht ziemlich gefährlich aus, vielleicht solltest du sie lieber werfen als essen.
items.food.blandfruit$chunks.name=Fadfruchtstücke
items.food.blandfruit$chunks.desc=Die Fadfrucht ist beim Aufprall geplatzt und hat farblose Stücke hinterlassen.\n\nAbgesehen von etwas Dreck sehen diese großen Stücke einer gekochten Fadfrucht recht essbar aus.

items.food.chargrilledmeat.name=Parkgrill-Steak
items.food.chargrilledmeat.desc=Außen verkohlt, innen gut. Gegrillt auf dem Tempelhofer Feld, zwei Meter außerhalb der Grillzone. Das Ordnungsamt ist schon unterwegs, zu Fuß, quer über die Landebahn.
items.food.chargrilledmeat.discover_hint=Du kannst das mit einem anderen essbaren Gegenstand herstellen.

items.food.food.name=Schachtel Baklava
items.food.food.ac_eat=ESSEN
items.food.food.eat_msg=Pistazie, Sirup, hauchdünner Teig. Satt bis zur nächsten Ecke.
items.food.food.desc=Eine Schachtel Baklava vom Konditor an der Sonnenallee, verschnürt mit Geschenkband, weil man so etwas nicht ohne Schleife verkauft. Stillt den Hunger. Die Schachtel hält dicht, die Finger kleben trotzdem.

items.food.frozencarpaccio.name=Tiefkühl-Carpaccio
items.food.frozencarpaccio.invis=Du siehst, wie deine Hände unsichtbar werden!
items.food.frozencarpaccio.hard=Du spürst wie deine Haut härter wird!
items.food.frozencarpaccio.refresh=Erfrischend!
items.food.frozencarpaccio.better=Dir geht es besser!
items.food.frozencarpaccio.desc=Ein Stück gefrorenes, rohes Fleisch. Man kann es nur essen, indem man dünne Scheiben abschneidet. In Mitte würde man dafür 19 Euro verlangen. Es schmeckt überraschend gut.
items.food.frozencarpaccio.discover_hint=Du kannst das mit einem anderen essbaren Gegenstand herstellen.

items.food.meatpie.name=Döner mit alles
items.food.meatpie.eat_msg=Mit alles und scharf. Das Leben ist wieder gut!
items.food.meatpie.desc=Fladenbrot, Fleisch, Salat und drei Soßen, um drei Uhr nachts das ehrlichste Angebot im Kiez. Der Preis steht mit Kreide an der Tafel, damit jede Gewerbemieterhöhung ihn wegwischen und 50 Cent dazuschreiben kann.\n\nMacht dich viel satter als jede andere Mahlzeit.
items.food.meatpie.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.food.mysterymeat.name=Rätselhafter Spieß
items.food.mysterymeat.eat_msg=Das hat irgendwie ... nach drei Uhr nachts geschmeckt.
items.food.mysterymeat.hot=Oh! Heiß, heiß, heiß!
items.food.mysterymeat.legs=Du spürst deine Beine nicht mehr!
items.food.mysterymeat.not_well=Du fühlst dich nicht wirklich wohl.
items.food.mysterymeat.stuffed=Du bist satt.
items.food.mysterymeat.desc=Fleisch unbekannter Herkunft, gefunden an einem Ort ohne Gewerbeschein. Verzehr auf eigene Gefahr!
items.food.mysterymeat.discover_hint=Dieser Gegenstand wird von bestimmten Gegnern fallengelassen.
items.food.mysterymeat$placeholder.name=Fleisch

items.food.phantommeat.name=Phantomfilet
items.food.phantommeat.desc=Ein großes, halbdurchsichtig schimmerndes Filet von einem Phantom-Kanalpiranha. Dieses magische Fleisch muss nicht gekocht werden und sättigt dich vollständig. Außerdem macht es unsichtbar, gibt Rindenhaut, heilt etwas und hebt viele negative Effekte auf.
items.food.phantommeat.discover_hint=Dieser Gegenstand wird von bestimmten Gegnern fallengelassen.

items.food.pasty.name=Bulettenschrippe
items.food.pasty.fish_name=gedünsteter Fisch
items.food.pasty.amulet_name=der unbefristete Mietvertrag?
items.food.pasty.egg_name=Osterei
items.food.pasty.rainbow_name=Regenbogentrank
items.food.pasty.shattered_name=grüne Torte
items.food.pasty.pie_name=Kürbiskuchen
items.food.pasty.vanilla_name=blaue Torte
items.food.pasty.cane_name=Zuckerstange
items.food.pasty.sparkling_name=spritziger Trank
items.food.pasty.desc=Eine Berliner Schrippe mit einer ehrlichen Bulette und Senf, wie sie schon vor der ersten Galerie im Kiez verkauft wurde. Köstlich!
items.food.pasty.fish_desc=Ein ganzer, gedünsteter Fisch, magisch haltbar gemacht, auf Blattgemüse angerichtet. Es ist in dieser Jahreszeit Tradition, etwas von dem Fisch für später aufzuheben, du wirst also einige Reste behalten, anstatt alles auf einmal aufzuessen.\n\nGesundes Mond-Neujahr!
items.food.pasty.amulet_desc=Endlich hast du ihn gefunden, den unbefristeten Mietvertrag von... Moment mal, das ist ja nur eine Waffel mit Zuckerguss, die so aussehen soll wie der Mietvertrag! Das verleiht dir sicher keine grenzenlose Macht, aber wenigstens kann sie dich sättigen und deine Artefakte etwas aufladen.\n\nApril, April!
items.food.pasty.egg_desc=Ein riesengroßes Schokoladen-Osterei in grell-gelber Alufolie. Das reicht locker dazu, dich zu sättigen, und der Zuckergehalt allein könnte deinen Artefakten etwas zusätzliche Ladung verschaffen.\n\nFrohe Ostern!
items.food.pasty.rainbow_desc=Dieser farbenfrohe Trank ist eine Art flüssige Nahrung. Er stillt deinen Hunger und hat die magische Eigenschaft, einen direkt neben dir stehenden Gegner, der kein Boss ist, zu besänftigen, so dass dieser eine Zeitlang zögern wird, gegen dich zu kämpfen.\n\nHappy Pride!
items.food.pasty.shattered_desc=Dieses große Stück Vanilletorte ist mit bunten Steuseln und grüner Glasur bedeckt. Die Torte wurde gebacken, um die Jahre an Erfahrung zu feiern, und sie verleiht einen kleinen Teil dieser Erfahrung, wenn sie gegessen wird.\n\nShattered Pixel Dungeon wurde erstmals am 5. August 2014 veröffentlicht. Herzlichen Glückwunsch zum Geburtstag, Shattered Pixel Dungeon!
items.food.pasty.pie_desc=Ein großes und großartiges Stück Kürbiskuchen. Sein würzig-süßer Geschmack wird dich sättigen und dich ein kleines bisschen heilen.\n\nHappy Halloween!
items.food.pasty.vanilla_desc=Dieses große Stück Vanilletorte ist mit bunten Steuseln und blauer Glasur bedeckt. Die Torte wurde gebacken, um die Jahre an Erfahrung zu feiern, und sie verleiht einen kleinen Teil dieser Erfahrung, wenn sie gegessen wird.\n\nDas originale Pixel Dungeon wurde erstmals am 4. Dezember 2012 veröffentlicht. Herzlichen Glückwunsch zum Geburtstag, Pixel Dungeon!
items.food.pasty.cane_desc=Eine riesige,-süße Zuckerstange. Sie ist groß genug, um dich zu sättigen, und allein der Zuckergehalt könnte deinen Zauberstäben etwas zusätzliche Ladung verschaffen.\n\nFrohes Fest!
items.food.pasty.sparkling_desc=Dieser spritzige Trank ist eine Art flüssige Nahrung. Er stillt deinen Hunger und soll Sekt imitieren, enthält aber keinen Alkohol. Das warme Gefühl im Bauch verleiht dir ein wenig Abschirmung.\n\nGesundes Neues Jahr!
items.food.pasty$fishleftover.name=Fischreste
items.food.pasty$fishleftover.eat_msg=Das Essen... naja, ging so.
items.food.pasty$fishleftover.desc=Etwas übriger Fisch von deiner vorigen Mahlzeit. Du kannst das jederzeit für den kleinen Hunger essen.

items.food.smallration.name=Späti-Snack
items.food.smallration.eat_msg=Das Essen... naja, ging so. Hauptsache, es knistert.
items.food.smallration.desc=Ein Päckchen Salzstangen aus dem Späti. Kleiner als eine Schachtel Baklava und längst nicht so gut. Die Packungsgröße schrumpft, der Preis nicht.
items.food.smallration.discover_hint=Du kannst diesen Gegenstand in einem Laden kaufen.

items.food.stewedmeat.name=Dosengulasch
items.food.stewedmeat.eat_msg=Schmeckt wie bei Oma in der Laube.
items.food.stewedmeat.desc=Gulasch aus der Dose, so lange gekocht, bis alle Keime tot sind und das Mindesthaltbarkeitsdatum nicht mehr lesbar ist. Es dürfte sicher sein, das zu essen.
items.food.stewedmeat.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.food.supplyration.name=Hostel-Lunchpaket
items.food.supplyration.desc=Heimlich vom Frühstücksbuffet eines Hostels eingesteckt, eingewickelt in drei Servietten. Genau das Richtige für unterwegs und für allerlei Gemeinheiten.\n\nEs füllt deinen Bauch nicht so gut wie eine Schachtel Baklava, lässt sich aber schnell essen, heilt sofort ein wenig und füllt die Ladungen des Ponchos der Schatten des Touristen wieder auf.
items.food.supplyration.discover_hint=Du kannst diesen Gegenstand durch ein bestimmtes Heldentalent finden.



##journal items
items.journal.documentpage.name=Herausgerissene Seite
items.journal.documentpage.desc=Eine einsame, herausgerissene Seite, welche aus einem Buch stammt. Du musst sie aufheben, um sie lesen zu können.

items.journal.alchemypage.name=herausgerissene Seite eines Alchemiebuchs
items.journal.alchemypage.desc=Eine herausgerissene Seite aus dem Handbuch der Hinterhof-Alchemie.\n\nAus dieser Distanz kannst du den kleinen Text nicht lesen, die Überschrift _"%s"_ jedoch schon.

items.journal.guidebook.name=Kiez-Überlebensratgeber
items.journal.guidebook.hint_mobile=Dein Kiez-Überlebensratgeber enthält neue Hinweise! Betätige den blinkenden Tagebuch-Knopf oben rechts, um sie zu lesen.
items.journal.guidebook.hint_desktop=Dein Kiez-Überlebensratgeber enthält neue Hinweise! Betätige den blinkenden Tagebuch-Knopf (%s) oben rechts, um sie zu lesen.
items.journal.guidebook.hint_status=Ratgeber
items.journal.guidebook.desc=Ein Ratgeber, den jemand hier liegen gelassen hat, als die Kündigung kam. Auf der letzten Seite steht in Bleistift eine neue Adresse in Brandenburg. Das Buch hat magische Eigenschaften: Es weist dich zur rechten Zeit darauf hin, eine bestimmte Seite zu lesen.\n\nBeliebt ist es vor allem wegen der Aufschrift "Keine Panik!", die in großen, freundlichen Lettern auf dem Einband steht.

items.journal.guidepage.name=Herausgerissene Seite des "Kiezführers für Abenteurer"
items.journal.guidepage.desc=Eine herausgerissene Seite aus dem „Kiezführer für Abenteurer“.\n\nDer meiste Text in dieser Distanz ist zu klein um es zu erkennen, aber du kannst die Überschrift klar und deutlich lesen:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=verschlissener Brief
items.journal.regionlorepage$sewers.desc=Das sieht aus wie ein Brief auf einem schmutzigen Fetzen Papier. Du musst ihn aufheben, um erkennen zu können, was da geschrieben steht.

items.journal.regionlorepage$prison.name=verschlissener Tagebucheintrag
items.journal.regionlorepage$prison.desc=Ein Tagebucheintrag oder eine andere Art Eintragung auf einem Stück alten Papiers. Es scheint besser erhalten zu sein als die Briefe, die du in den Hinterhöfen gefunden hast, aber du musst es immer noch aufheben, um es zu lesen.

items.journal.regionlorepage$caves.name=alter Logbucheintrag
items.journal.regionlorepage$caves.desc=Das sieht aus wie eine Eintragung aus dem Logbuch eines Erkunders, erstaunlich gut erhalten, obwohl es sehr alt sein muss. Hebe es auf, um es zu lesen.

items.journal.regionlorepage$city.name=rostige Platte
items.journal.regionlorepage$city.desc=Eine kleine, rostige Metallplatte mit einer magisch darauf eingebrannten Nachricht. Die Buchstaben sind trotz des Alters der Platte gut zu erkennen, aber du musst sie aufheben, um es zu lesen.

items.journal.regionlorepage$halls.name=leuchtende Platte
items.journal.regionlorepage$halls.desc=Eine kleine, schwarze Platte mit darauf eingebrannten, leuchtenden Lettern. Die leuchtenden Lettern verschwimmen auf die Entfernung, du wirst die Platte also aufheben, um sie zu lesen.


###keys
items.keys.goldenkey.name=Goldener Schlüssel
items.keys.goldenkey.desc=Die Zähne dieses goldenen Schlüssels sind winzig und kunstvoll. Er sieht aus wie der Schlüssel zu einem Penthouse. Vielleicht passt er zu einem Schloss an einem angeketteten Sperrmüllberg?

items.keys.crystalkey.name=Kristallschlüssel
items.keys.crystalkey.desc=Die geschliffenen Flächen dieses Kristallschlüssels schimmern im Dunkeln wie eine Schlüsselkarte für Co-Working. Vielleicht öffnet er etwas aus Kristall?

items.keys.ironkey.name=Kellerschlüssel
items.keys.ironkey.desc=Der Bart dieses alten Eisenschlüssels ist deutlich abgewetzt, und am Ring hängt ein Zettel: "NICHT VERLIEREN! Hausverwaltung". Welches Schloss auf dieser Ebene er wohl öffnet?

items.keys.wornkey.name=Abgenutzter Schlüssel
items.keys.wornkey.desc=Der Schlüssel ist abgenutzt und verfärbt, wirkt aber so wichtig wie der letzte Schlüssel zu einer mietpreisgebundenen Wohnung. Er öffnet vielleicht eine besondere Tür in der Nähe.



###potions
items.potions.potion.ac_drink=TRINKEN
items.potions.potion.turquoise=Türkise Pulle
items.potions.potion.crimson=Karminrote Pulle
items.potions.potion.azure=Himmelblaue Pulle
items.potions.potion.jade=Jadegrüne Pulle
items.potions.potion.golden=Goldene Pulle
items.potions.potion.magenta=Magentafarbene Pulle
items.potions.potion.charcoal=Kohlschwarze Pulle
items.potions.potion.ivory=Elfenbeinweiße Pulle
items.potions.potion.amber=Bernsteinfarbene Pulle
items.potions.potion.bistre=Bräunliche Pulle
items.potions.potion.indigo=Indigoblaue Pulle
items.potions.potion.silver=Silberne Pulle
items.potions.potion.unknown_desc=Eine Pulle ohne Etikett und ohne Pfandlogo, gefüllt mit einer wallenden farbigen Flüssigkeit. Wer weiß, was passiert, wenn man sie trinkt oder wirft?
items.potions.potion.harmful=Schädliche Pulle!
items.potions.potion.beneficial=Nützliche Pulle
items.potions.potion.yes=Ja, ich weiß was ich tue
items.potions.potion.no=Nein, lieber doch nicht...
items.potions.potion.sure_drink=Willst du die wirklich trinken? Normalerweise wirft man diese Pulle auf Gegner.
items.potions.potion.sure_throw=Willst du die wirklich werfen? In den meisten Fällen trinkt man diese Pulle besser. Außerdem ist Pfand drauf.
items.potions.potion.shatter=Die Pulle zerbricht und die Flüssigkeit spritzt harmlos herum. 25 Cent Pfand, verloren.
items.potions.potion.discover_hint=Du kannst diesen Gegenstand zufällig in den Tiefen finden oder mit Alchemie herstellen.
items.potions.potion$placeholder.name=Pulle
items.potions.potion$seedtopotion.name=Zufällige Pulle

items.potions.potionofexperience.name=Lebenserfahrungs-Weiße
items.potions.potionofexperience.desc=Eine Weiße mit Waldmeister, darin gelöst alles, was Alteingesessene je mit „Früher war hier alles …“ angefangen haben. Wer sie trinkt, steigt eine Stufe auf.

items.potions.potionoffrost.name=Frost-Slush
items.potions.potionoffrost.desc=Die bunte Chemie in diesem Slush verdampft bei Kontakt mit der Luft zu einer eiskalten Wolke. Hirnfrost für alle.

items.potions.potionofhaste.name=Doppel-Mate
items.potions.potionofhaste.energetic=Du fühlst dich tatkräftig! Und ein bisschen zittrig.
items.potions.potionofhaste.desc=Zwei Flaschen Mate in einer, eingekocht auf Espresso-Stärke. Diese seltsam süße Flüssigkeit gibt dir kurzzeitig enorm viel Energie und lässt dich sehr schnell rennen.

items.potions.potionofhealing.name=Ingwer-Heilshot
items.potions.potionofhealing.heal=Deine Wunden beginnen sich zu schließen.
items.potions.potionofhealing.desc=Dieser scharfe Shot stellt deine Gesundheit schnell wieder her und heilt sofort viele Beschwerden. Auf dem Etikett steht handschriftlich: Kein Wellnessprodukt. Wirkt tatsächlich.

items.potions.potionofinvisibility.name=Tarnkappen-Limo
items.potions.potionofinvisibility.invisible=Du siehst, wie deine Hände unsichtbar werden!
items.potions.potionofinvisibility.desc=Wer diese Limo trinkt, wird zeitweilig unsichtbar, wie Mieterbeschwerden bei der Hausverwaltung. Solange du unsichtbar bist, können Feinde dich nicht sehen. Physische Angriffe und magische Effekte (zum Beispiel aus Schriftrollen und Zauberstäben) beenden die Unsichtbarkeit aber sofort.

items.potions.potionoflevitation.name=Helium-Brause
items.potions.potionoflevitation.float=Du schwebst! Deine Stimme klingt leicht albern.
items.potions.potionoflevitation.desc=Nach dieser sonderbaren Brause kannst du schweben und mühelos über Haufen und Abgründe gleiten. Geworfen erzeugt sie eine Gaswolke, die Desorientierung verursacht.

items.potions.potionofliquidflame.name=Grillanzünder-Flasche
items.potions.potionofliquidflame.desc=Flüssiger Grillanzünder vom Feld. Auf dem Etikett eine brennende Wurst und der Hinweis „Nur im Freien verwenden“. Hier unten ist nichts im Freien.\n\nDiese instabile Mischung bricht bei Kontakt mit der Luft in gewaltige Flammen aus.

items.potions.potionofmindvision.name=Gedankenlese-Kombucha
items.potions.potionofmindvision.see_mobs=Irgendwie spürst du die Gedanken anderer Kreaturen. Die meisten denken an Miete.
items.potions.potionofmindvision.see_none=Irgendwie weißt du, dass du im Moment auf dieser Ebene alleine bist.
items.potions.potionofmindvision.desc=Selbst fermentiert in einer WG-Küche. Danach nimmt dein Geist die Anwesenheit entfernter Kreaturen durch Wände hindurch wahr, wie ein hellhöriger Altbau. Außerdem kannst du durch benachbarte Wände und Türen sehen.

items.potions.potionofparalyticgas.name=Lähmgas-Fassbrause
items.potions.potionofparalyticgas.desc=Wenn diese Flüssigkeit mit Luft in Kontakt kommt, verdunstet sie zu einer gelben Wolke. Wer sie einatmet, ist sofort für eine Weile gelähmt, wie eine Warteschlange im Bürgeramt. Dieser Gegenstand kann auf entfernte Gegner geworfen werden.

items.potions.potionofpurity.name=Reinheits-Leitungswasser
items.potions.potionofpurity.freshness=Du spürst ungewöhnliche Frische in der Luft.
items.potions.potionofpurity.protected=Eine schützende Schicht umhüllt dich!
items.potions.potionofpurity.desc=Berliner Leitungswasser, stolze 16 Grad deutscher Härte, magisch gefiltert. Es neutralisiert schnell alle gefährlichen Flächeneffekte in einem großen Bereich. Trinkst du es, bist du zeitweilig gegen die Effekte immun.

items.potions.potionofstrength.name=Kraft-Wegbier
items.potions.potionofstrength.msg=Neue Stärke durchströmt deinen Körper; du hast nun %d Stärkepunkte!
items.potions.potionofstrength.desc=Eine braune Späti-Flasche, die nach Wegbier aussieht und nach Malz und Muskelkater schmeckt. Sie durchströmt deinen Körper und erhöht deine Stärke dauerhaft um einen Punkt.

items.potions.potionoftoxicgas.name=Giftgas-Energydrink
items.potions.potionoftoxicgas.desc=Sobald diese Dose geöffnet oder zerstört wird, entweicht eine grüne Wolke tödlich-toxischer Gase. Geschmacksrichtung "Ultra Toxic Lime". Du solltest sie lieber auf Gegner werfen, statt sie in der Hand zu öffnen.



###brews
items.potions.brews.brew.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.potions.brews.aquabrew.name=Rohrbruch-Bowle
items.potions.brews.aquabrew.desc=Wenn das Gefäß zerbricht, schießt ein Schwall unter Druck stehenden Wassers heraus, wie beim Rohrbruch im Altbau. Er schadet feurigen Gegnern, verteilt Wasser auf nahes Terrain, spült Haufen weg (entschärft sie) und stößt Charaktere in der Nähe zurück.

items.potions.brews.blizzardbrew.name=Blizzard-Bowle
items.potions.brews.blizzardbrew.desc=Zerbrochen entfesselt diese Bowle einen tosenden Schneesturm, der sich schnell wie ein Gas ausbreitet. Wie ein Berliner Februar, nur kürzer.

items.potions.brews.causticbrew.name=Kloreiniger-Bowle
items.potions.brews.causticbrew.desc=Diese Bowle verteilt ätzenden Schlamm überall dort, wo ihr Gefäß zerbricht. Alles, woran der Schlamm klebt, schmilzt langsam, bis er in Wasser abgewaschen wird.

items.potions.brews.infernalbrew.name=Höllen-Glühwein
items.potions.brews.infernalbrew.desc=Zerbrochen entfesselt dieser Glühwein ein flammendes Inferno, das sich schnell wie ein Gas ausbreitet. Vom Weihnachtsmarkt, also auch preislich die Hölle.

items.potions.brews.shockingbrew.name=Starkstrom-Bowle
items.potions.brews.shockingbrew.desc=Zerbrochen entfesselt diese Bowle einen elektrischen Sturm in einem weiten Bereich um die Aufprallstelle.

items.potions.brews.unstablebrew.name=Reste-Bowle
items.potions.brews.unstablebrew.desc=Alles, was nach der WG-Party übrig war, in einem Gefäß. Es schimmert abwechselnd in allen Regenbogenfarben.\n\nGetrunken oder geworfen löst es den Effekt eines zufälligen Tranks aus. Getrunken ist die Wirkung immer vorteilhaft, geworfen immer schädlich.

###elixirs
items.potions.elixirs.elixir.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.potions.elixirs.elixirofarcanearmor.name=Aluhut-Elixier
items.potions.elixirs.elixirofarcanearmor.desc=Schützt lange gegen magische Angriffe. Leider wirkt es wirklich. Die Verschwörungsfreunde fühlen sich bestätigt.

items.potions.elixirs.elixirofaquaticrejuvenation.name=Spreebad-Elixier
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Die Überreste eines Schleims, angereichert mit einem Ingwer-Heilshot. Es heilt nicht sofort, stellt deine Lebenskraft aber zuverlässig wieder her, während du im Wasser stehst. Baden in der Spree ist trotzdem verboten.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=Spreebad-Heilung
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Du hast vorübergehend Heilungskräfte wie die des Schleims erhalten.\n\nWährend du im Wasser stehst, wirst du pro Zug ein wenig Gesundheit zurückgewinnen. Dieser Effekt pausiert, wenn du volle Lebenspunkte hast oder nicht im Wasser stehst.\n\nVerbleibende Runden: %d.

items.potions.elixirs.elixirofdragonsblood.name=Extrascharf-Elixier
items.potions.elixirs.elixirofdragonsblood.desc=Die Soße, bei der der Imbiss vorher fragt, ob du sicher bist. Sie lässt feurige Energie durch deine Adern fließen: Du wirst immun gegen Feuer, und Feinde, die du mit physischen Angriffen triffst, gehen in Flammen auf.

items.potions.elixirs.elixiroffeatherfall.name=Federleicht-Elixier
items.potions.elixirs.elixiroffeatherfall.light=Du fühlst dich so leicht wie eine Feder!
items.potions.elixirs.elixiroffeatherfall.desc=Dieses Elixier bietet einen schwächeren, aber kontrollierteren Schwebeeffekt, mit dem du für kurze Zeit unbeschadet aus größeren Höhen fallen kannst. Ideal für Altbau-Treppenhäuser ohne Licht.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=Federleicht
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Du stehst unter der Wirkung eines Federflug-Elixiers, das es dir ermöglicht, in Abgründe zu fallen, ohne Schaden zu nehmen!\n\nVerbleibende Züge: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=Stadthonig-Elixier
items.potions.elixirs.elixirofhoneyedhealing.desc=Heilung plus Stadthonig vom Dach einer Agentur, die "Bienen" in ihr Nachhaltigkeitsreporting schreibt. Getrunken wirkt es wie ein Heiltrank und stillt ein wenig Hunger. Geworfen heilt es einen Verbündeten.\n\nKreaturen mit einer Vorliebe für Honig könnten besänftigt werden, wenn dieser Gegenstand bei ihnen angewendet wird.

items.potions.elixirs.elixiroficytouch.name=Spätikühlschrank-Elixier
items.potions.elixirs.elixiroficytouch.desc=Die Kälte aus der hintersten Ecke des Späti-Kühlschranks, in Flaschen abgefüllt. Wer es trinkt, entzieht Feinden mit Angriffen Wärme: Du wirst immun gegen Kälte, und physische Angriffe frieren Gegner ein.

items.potions.elixirs.elixirofmight.name=Muckibuden-Elixier
items.potions.elixirs.elixirofmight.msg=Neue Stärke durchströmt deinen Körper; du hast nun %d Stärkepunkte!
items.potions.elixirs.elixirofmight.desc=Riecht nach Gummimatte und Ehrgeiz. Diese Flüssigkeit erhöht deine Stärke dauerhaft um einen Punkt und deine maximalen Lebenspunkte zeitweise um %d. Der Lebenspunkte-Bonus ist größer, wenn deine maximalen Lebenspunkte höher sind, und schwindet langsam, während du Stufen aufsteigst.
items.potions.elixirs.elixirofmight$htboost.name=Pump
items.potions.elixirs.elixirofmight$htboost.desc=Dein Körper fühlt sich unnatürlich stark und gesund an.\n\nDeine maximalen Lebenspunkte sind für längere Zeit erhöht. Wenn du Erfahrungsstufen gewinnst, wird diese Erhöhung langsam abnehmen\n\nMomentane Erhöhung: %d.\nVerbleibende Erfahrungsstufen: %d.

items.potions.elixirs.elixiroftoxicessence.name=Kanalduft-Elixier
items.potions.elixirs.elixiroftoxicessence.desc=Destilliertes Aroma eines Neuköllner Gullys im August. Wer es trinkt, verbreitet bei jeder Bewegung Giftgas um sich herum und wird immun gegen Giftgas und Gift. Die Immunität hält etwas länger als der Effekt selbst.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=Türkis-Importpulle
items.potions.exotic.exoticpotion.crimson=Karmin-Importpulle
items.potions.exotic.exoticpotion.azure=Himmelblau-Importpulle
items.potions.exotic.exoticpotion.jade=Jade-Importpulle
items.potions.exotic.exoticpotion.golden=Gold-Importpulle
items.potions.exotic.exoticpotion.magenta=Magenta-Importpulle
items.potions.exotic.exoticpotion.charcoal=Kohle-Importpulle
items.potions.exotic.exoticpotion.ivory=Elfenbein-Importpulle
items.potions.exotic.exoticpotion.amber=Bernstein-Importpulle
items.potions.exotic.exoticpotion.bistre=Braun-Importpulle
items.potions.exotic.exoticpotion.indigo=Indigo-Importpulle
items.potions.exotic.exoticpotion.silver=Silber-Importpulle
items.potions.exotic.exoticpotion.unknown_desc=Eine runde Import-Pulle mit schlieriger, farbiger Flüssigkeit und einem Etikett in einer Sprache, die nicht mal der Expat kennt. Wer weiß, was passiert, wenn man sie trinkt oder wirft?
items.potions.exotic.exoticpotion.warning=Willst du die Nutzung dieser Pulle wirklich abbrechen? Sie wird trotzdem verbraucht.
items.potions.exotic.exoticpotion.yes=Ja, ich bin mir sicher
items.potions.exotic.exoticpotion.no=Nein, lieber doch nicht...
items.potions.exotic.exoticpotion.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.potions.exotic.potionofcleansing.name=Detox-Saft
items.potions.exotic.potionofcleansing.desc=Kaltgepresst, 9 Euro, schmeckt nach Rasen. Getrunken neutralisiert er einige Züge lang alle schädlichen Effekte, die dir anhängen. Er kann auch auf ein Ziel geworfen werden, um es zu reinigen.
items.potions.exotic.potionofcleansing$cleanse.name=entgiftet
items.potions.exotic.potionofcleansing$cleanse.desc=Dieser Charakter ist vorübergehend immun gegen alle schädlichen Effekte!\n\nVerbleibende Züge: %s.

items.potions.exotic.potionofcorrosivegas.name=Abflussreiniger-Pulle
items.potions.exotic.potionofcorrosivegas.desc=Wird diese unter Druck stehende Pulle geöffnet oder zerbrochen, explodiert der Inhalt zu einer tödlichen Wolke aus ätzendem, rostbraunem Gas. Es breitet sich schneller aus als Giftgas und ist tödlicher, hält sich aber nicht lange. Selbst der Hausmeister ist beeindruckt.

items.potions.exotic.potionofdragonsbreath.name=Chili-Shot
items.potions.exotic.potionofdragonsbreath.prompt=Wähle ein Ziel zum Anpusten.
items.potions.exotic.potionofdragonsbreath.desc=Eine Mixtur, die bei Kontakt mit Speichel in Flammen aufgeht. Wer schnell ist, kann damit Feuer aus dem Mund speien, wie nach der Soße "Hölle" im Imbiss um die Ecke!

items.potions.exotic.potionofearthenarmor.name=Beton-Smoothie
items.potions.exotic.potionofearthenarmor.desc=Statt zu lähmen, härtet diese Flüssigkeit deine Haut, so dass sie kurzzeitig zu einer natürlichen Rüstung wird. Grau, zäh und nach Baustelle schmeckend.

items.potions.exotic.potionofdivineinspiration.name=Zeremonienkakao
items.potions.exotic.potionofdivineinspiration.no_more_points=Du kannst nicht noch mehr Bonus-Talentpunkte erlangen.
items.potions.exotic.potionofdivineinspiration.select_tier=Wähle eine Talentstufe, in der du zwei Bonuspunkte bekommen möchtest. Du musst die Stufe freigeschaltet haben, bevor du darin Talentpunkte vergibst.
items.potions.exotic.potionofdivineinspiration.bonus=+2 Talentpunkte!
items.potions.exotic.potionofdivineinspiration.desc=Serviert bei einem Retreat in einem Loft, Teilnahmegebühr "nach Selbsteinschätzung, ab 120 Euro". Er erfüllt dich mit göttlicher Eingebung und gewährt dir zwei Talentpunkte in einer Stufe deiner Wahl.\n\nDieser Trank kann nur einmal pro Talentstufe eingesetzt werden.

items.potions.exotic.potionofmagicalsight.name=Röntgenblick-Brause
items.potions.exotic.potionofmagicalsight.desc=Wenn du sie trinkst, werden deine Sinne kurzzeitig extrem geschärft, und du kannst in einem Radius von 12 Feldern durch Wände sehen. Wie Nachbarn mit Fernglas, nur legal.

items.potions.exotic.potionofmastery.name=Muskelgedächtnis-Shake
items.potions.exotic.potionofmastery.prompt=Einen Gegenstand meistern
items.potions.exotic.potionofmastery.weapon_easier=Deine Waffe ist nun leichter zu handhaben!
items.potions.exotic.potionofmastery.armor_easier=Deine Rüstung lässt sich nun leichter tragen!
items.potions.exotic.potionofmastery.desc=Dieser Proteinshake verleiht keine rohe Stärke, sondern stimmt deine Muskeln auf einen bestimmten Gegenstand ab, als hättest du ihn seit Jahren im Fitnessstudio benutzt.\n\nDie ausgewählte Waffe oder Rüstung benötigt dann 2 Stärkepunkte weniger. Dieser Trank kann nur einmal pro Gegenstand verwendet werden.

items.potions.exotic.potionofshielding.name=Dickes-Fell-Tee
items.potions.exotic.potionofshielding.desc=Ein bitterer Kräutertee aus der Thermoskanne der Alteingesessenen, die ihn vor jedem Termin bei der Hausverwaltung trinkt. Statt zu heilen, baut er einen beständigen Schild um deinen Körper auf, der eine beträchtliche Menge Schaden abblockt.

items.potions.exotic.potionofshroudingfog.name=Nebelmaschinen-Fluid
items.potions.exotic.potionofshroudingfog.desc=Wird dieses Fluid der Luft ausgesetzt, erzeugt es einen dicken, rauchigen Nebel wie auf jedem Dancefloor. Er breitet sich schnell aus und behindert die Sicht deiner Gegner.

items.potions.exotic.potionofsnapfreeze.name=Schockfrost-Slush
items.potions.exotic.potionofsnapfreeze.desc=Die Chemikalien in diesem Slush reagieren schnell mit der Luft: Sie frieren alles in ihrer Reichweite ein und halten es an Ort und Stelle fest.

items.potions.exotic.potionofstamina.name=Mate-Kanister
items.potions.exotic.potionofstamina.desc=Fünf Liter koffeinhaltige Brause für die Deadline. Wenn du diese sonderbar süße Flüssigkeit trinkst, erfasst dich ein langanhaltender Energieschub, und du läufst längere Zeit mit erhöhtem Tempo.

items.potions.exotic.potionofstormclouds.name=Wolkenbruch-Sprudel
items.potions.exotic.potionofstormclouds.desc=Geworfen erzeugt dieser Sprudel eine sich schnell ausbreitende Dampfwolke, die kondensiert, wie ein Berliner Sommergewitter über dem Hof. Der Großteil des Terrains wird zu Wasser, feurige Gegner erleiden Schaden, Feuer wird gelöscht und Haufen werden weggespült und zerstört.



###quest items
items.quest.ceremonialcandle.name=Zeremoniekerze
items.quest.ceremonialcandle.desc=Ein Satz Kerzen, durch mehrfachen Gebrauch zu einem Klumpen verschmolzen. Vermutlich von der Weihnachtsfeier der Abteilung, Jahrgang unbekannt.\n\nDer Satz alleine ist wertlos, aber wenn mehrere Kerzen in einem gewissen Muster verwendet werden, können sie Energie sammeln, um ein Beschwörungsritual durchzuführen.
items.quest.ceremonialcandle.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.

items.quest.corpsedust.name=Leichenstaub
items.quest.corpsedust.chill=Dir läuft ein Schauer den Rücken hinunter.
items.quest.corpsedust.desc=Dieser Ball aus Leichenstaub sieht fast aus wie eine gewöhnliche Wollmaus aus dem Archiv, strahlt aber eine bösartige Energie aus. Hier hat jemand zu lange gewartet.\n\nDu solltest das Zeug so schnell wie möglich loswerden.
items.quest.corpsedust.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.
items.quest.corpsedust&dustwraith.rankings_desc=Verflucht durch Leichenstaub

items.quest.darkgold.name=Glasfaserstück
items.quest.darkgold.you_now_have=Du hast nun %d Glasfaserstücke.
items.quest.darkgold.desc=Ein Stück Glasfaserkabel, 2019 verlegt, nie angeschlossen und seither im Gestein festgewachsen. Wenn Licht darauf fällt, schimmert es golden. Oben wäre es nutzlos, weil es niemand anschließt. Der Netztechniker sammelt es trotzdem.
items.quest.darkgold.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.

items.quest.dwarftoken.name=Garderobenmarke
items.quest.dwarftoken.discard=Du brauchst keine Garderobenmarken mehr und lässt die Marke liegen.
items.quest.dwarftoken.desc=Eine rote Plastikmarke an einem Spiralband, darauf eine Nummer. Jemand hat sie im Club verloren, vielleicht du.\n\n_Die Garderobe gibt nur gegen alle 7 Marken etwas heraus._ Im Club gibt es genau 7, in jedem der gut gesicherten Nebenräume eine.
items.quest.dwarftoken.desc_old=Viele Eigentümerzwerge und einige ihrer größeren Schöpfungen tragen diese Garderobenmarken bei sich, obwohl hier seit Jahren keine Garderobe mehr offen hat. Vielleicht ein Andenken an den Club, der hier früher war.
items.quest.dwarftoken.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.

items.quest.embers.name=Asche eines Elementars
items.quest.embers.desc=Spezielle Asche, die nur von jungen Feuerelementaren gewonnen werden kann. Sie strahlt thermische Energie aus, mehr als die Heizung im Amt je geschafft hat.
items.quest.embers.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.

items.quest.escapecrystal.name=Notausgangs-Bändchen
items.quest.escapecrystal.ac_use=VERWENDEN
items.quest.escapecrystal.prompt=Wähle einen Gegenstand
items.quest.escapecrystal.desc=Ein Stoffbändchen mit dem Aufdruck "Notausgang, jederzeit", vom Filialisten mit einem Teleportzauber bestickt. _Du kannst es jederzeit benutzen, um den Club zu verlassen_, aber wer früh geht, bekommt nicht die volle Belohnung!
items.quest.escapecrystal.discover_hint=Du kannst diesen Gegenstand bei einer bestimmten Aufgabe finden.
items.quest.escapecrystal.leaving_start=Die Zeit scheint langsamer zu laufen, als du die Stimme des Filialisten hörst:\n\n"Hör mal, ich verstehe, dass du nervös bist, aber verlass wenigstens den Eingangsbereich!"\n\n"Um deine Ausrüstung musst du dir keine Sorgen machen, ich bin ein Filialist, der Wort hält. Alles wartet auf dich, wenn du zurückkommst. Und ich verspreche, dass du mit dem Bändchen raus darfst, wenn du wirklich in Gefahr bist."
items.quest.escapecrystal.leaving_early=Die Zeit scheint langsamer zu laufen, als du die Stimme des Filialisten hörst:\n\n"Echt jetzt, du gehst schon!? Du weißt schon, dass du vor den meisten Leuten dort einfach wegrennen kannst?"\n\n"Wenn dein Leben in Gefahr ist, hol ich dich raus, aber mitnehmen darfst du nichts. Ich hatte viel mehr von dir erwartet. Das kostet dich einen Stern."
items.quest.escapecrystal.leaving_partly_explored=Die Zeit scheint langsamer zu laufen, und du hörst die Stimme des Filialisten:\n\n"Oh, du gehst schon? Na ja, immerhin hast du geholfen, den Laden zu kartieren. Besser als nichts."\n\n"Trotzdem, da war mehr Potenzial. Natürlich hol ich dich raus, wenn du willst. Etwas wie einen Trank oder eine Schriftrolle darfst du wohl mitnehmen."
items.quest.escapecrystal.leaving_fully_explored=Die Zeit scheint langsamer zu laufen, und du hörst die Stimme des Filialisten:\n\n"Du musst gehen? Na gut, du hast den Club zumindest ordentlich erkundet. Ich hatte gehofft, du würdest bis in den VIP-Bereich kommen, aber jetzt weiß ich viel besser, wie der Laden funktioniert."\n\n"Du darfst etwas mitnehmen, aber nichts magisch Verbessertes!"
items.quest.escapecrystal.leaving_partial_victory=Die Zeit scheint langsamer zu laufen, und du hörst die Stimme des Filialisten:\n\n"Ich hatte gehofft, du holst mir meine Statuette, aber du hast den Großteil des Clubs großartig erkundet und aufgeräumt!"\n\n"Weißt du was: Du darfst einen Gegenstand behalten, solange er nicht über +1 verbessert ist, und ich eröffne trotzdem weiter unten einen Laden. Ich brauche ohnehin Zeit, um meine nächsten Schritte zu planen."
items.quest.escapecrystal.leaving_victory=Die Zeit scheint langsamer zu laufen, und du hörst die Stimme des Filialisten:\n\n"Hervorragende Arbeit!! Bist du bereit zu gehen? Ich nehme dir die Statuette ab, wenn du zurück bist."\n\n"Wie versprochen eröffne ich weiter unten einen Laden, und du darfst mitnehmen, was du willst! Lass dir ruhig Zeit mit der Wahl, alles andere bleibt im Club."
items.quest.escapecrystal.leaving_item=Bist du sicher, dass du diesen Gegenstand mitnehmen willst?
items.quest.escapecrystal.leaving_seal=_Der Kiez-Aufnäher an dieser Rüstung ist an den Spiegel gebunden und kann nicht mitgenommen werden._ Er wird automatisch von der Rüstung entfernt. Das senkt die Stufe der Rüstung um 1, entfernt aber keine Glyphe.
items.quest.escapecrystal.leaving_staff=_Dieser magische Selfie-Stick ist an den Spiegel gebunden und kann nicht mitgenommen werden, der darin verschmolzene Zauberstab aber schon._ Der Zauberstab wird automatisch entfernt und dir mit der Stufe des Selfie-Sticks -1 gegeben.
items.quest.escapecrystal.leaving_yes=Club verlassen
items.quest.escapecrystal.leaving_no=Hierbleiben
items.quest.escapecrystal.error_start=Anscheinend bist du nicht im Club! Das kann an einem Programmfehler oder Programmabsturz liegen.
items.quest.escapecrystal.error_no_items=Keiner deiner Gegenstände wird aufbewahrt, daher wurde das Bändchen aus deinem Inventar entfernt.
items.quest.escapecrystal.error_with_items=Deine Gegenstände werden gerade aufbewahrt, du solltest also erneut in die Ilse hinabsteigen, um die Aufgabe zu beginnen. Du bekommst deine Gegenstände zurück, wenn die Aufgabe endet.

items.quest.gooblob.name=Schleimklumpen
items.quest.gooblob.desc=Ein schwabbelnder Klumpen, der sich beim Tod vom Mietschimmel gelöst hat. Er wackelt wie Götterspeise, aber essen würdest du ihn trotzdem nicht.\n\nFür sich genommen ist er nutzlos, doch könnte er wirkungsvoll sein, wenn man ihn zusammen mit bestimmten Tränken oder einer Bombe kombiniert. Zumindest sollte man ihn in eine ordentliche Menge Energie umwandeln können.
items.quest.gooblob.discover_hint=Dieser Gegenstand wird von bestimmten Gegnern fallengelassen.

items.quest.impstatue.name=Obsidian-Statuette
items.quest.impstatue.desc=Eine kleine, pechschwarze Statue aus Obsidian. Sie ähnelt dem Filialisten, der dich hier runtergeschickt hat, samt leuchtend grüner Augen. Am Sockel steht eine Inschrift in einer Sprache, die du noch nie gesehen hast.
items.quest.impstatue.discover_hint=Du kannst diesen Gegenstand bei einer bestimmten Aufgabe finden.

items.quest.vaultbeacon.name=Wiedereinlass-Stempel
items.quest.vaultbeacon.desc=Ein Stempel für den Handrücken, das Stempelkissen noch feucht. Wer ihn benutzt, steht sofort wieder im Eingangsbereich, in dem er lag.\n\nDu kannst damit beim Erkunden Zeit sparen oder in Gefahr fliehen.
items.quest.vaultbeacon.discover_hint=Du kannst diesen Gegenstand bei einer bestimmten Aufgabe finden.

items.quest.metalshard.name=verfluchte Metallplatte
items.quest.metalshard.desc=Eine Platte rostigen, verfluchten Metalls, die sich von der DM-300 Bohrlinde gelöst hat, als sie zerstört wurde. Aufgedruckt: "Fertigstellung vsl. Herbst". Du kannst eine inaktive, böse Magie in ihr spüren.\n\nFür sich genommen ist sie nutzlos, doch könnte sie nützlich sein, wenn man sie zusammen mit bestimmten Schriftrollen oder einer Bombe kombiniert. Zumindest sollte man sie in eine ordentliche Menge Energie konvertieren können.
items.quest.metalshard.discover_hint=Dieser Gegenstand wird von bestimmten Gegnern fallengelassen.

items.quest.pickaxe.name=Spitzhacke
items.quest.pickaxe.ability_name=durchbohren
items.quest.pickaxe.ability_desc=Die Zweikämpferin kann einen Gegner mit einer Spitzhacke _durchbohren_. Der Hieb trifft garantiert, bewirkt für 3 Züge Verwundbarkeit und fügt Gegnern mit starrer Haut _%1$d-%2$d Schaden_ zu.
items.quest.pickaxe.upgrade_ability_stat_name=Fähigkeitsschaden
items.quest.pickaxe.desc=Dies ist ein robustes und schweres Werkzeug zum Zerschlagen von Stein. Auf dem Stiel klebt ein Inventaraufkleber des Netzbetreibers, darunter ein älterer: "Volkseigentum". Du musst die Spitzhacke nicht ausrüsten, um damit zu schürfen, aber notfalls kann sie wahrscheinlich auch als Waffe eingesetzt werden.
items.quest.pickaxe.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.



###remains
items.remains.remainsitem.ac_use=VERWENDEN
items.remains.remainsitem.discover_hint=Du kannst diesen Gegenstand in den Gebeinen eines bestimmten Helden aus einem zuvor verlorenen Spiel finden.

items.remains.bowfragment.name=Bogensplitter
items.remains.bowfragment.desc=Dieses Stück Parkett war einst Teil des Upcycling-Bogens einer verschollenen Zugezogenen. Du spürst noch ein wenig natürliche Energie darin und kannst damit etwas hohes Gras um dich herum wachsen lassen. Dabei wird der Splitter allerdings zerstört.

items.remains.brokenhilt.name=zerbrochener Griff
items.remains.brokenhilt.desc=Dieser zerbrochene Griff sieht aus, als stamme er von der Waffe einer besiegten Zweikämpferin. Man spürt noch etwas Kampfkraft im Griff, die man nutzen kann, um bei den nächsten beiden Nahkampfschlägen etwas Bonusschaden zu erzielen. Allerdings wird der Griff dadurch zerstört.

items.remains.brokenstaff.name=Kaputter Selfie-Stick
items.remains.brokenstaff.desc=Dieser Selfie-Stick ist in der Mitte zerbrochen, nachdem sein Eigentümer, ein Expat, sein letztes Video gedreht hat. Du spürst noch etwas magische Energie darin und kannst damit deinen Zauberstäben zusätzliche Ladung verleihen. Dabei wird der Stick allerdings zerstört.

items.remains.cloakscrap.name=Ponchofetzen
items.remains.cloakscrap.desc=Dieser Plastikfetzen stammt aus dem Poncho der Schatten eines verschollenen Touristen. Du spürst noch ein wenig mystische Energie darin und kannst damit deinen Artefakten zusätzliche Ladung verleihen. Dabei wird der Fetzen allerdings zerstört.

items.remains.sealshard.name=Aufnäher-Reste
items.remains.sealshard.desc=Diese ausgefransten Stofffäden stammen vom Kiez-Aufnäher einer gefallenen Alteingesessenen. Du spürst noch etwas von ihrer Sturheit darin und kannst sie nutzen, um dir etwas Abschirmung zu verleihen. Dabei werden die Reste allerdings zerstört.

items.remains.tornpage.name=Herausgerissene Seite
items.remains.tornpage.desc=Diese Seite sieht aus, als sei sie aus dem heiligen Folianten eines verblichenen Klerikers gerissen worden. Ihr haftet noch ein wenig göttliche Energie an, die du nutzen kannst, um ein wenig Gesundheit wiederherzustellen. Dabei wir die Seite allerdings zerstört.



###rings
items.rings.ring.diamond=Diamantring
items.rings.ring.opal=Opalring
items.rings.ring.garnet=Granatring
items.rings.ring.ruby=Rubinring
items.rings.ring.amethyst=Amethystring
items.rings.ring.topaz=Topasring
items.rings.ring.onyx=Onyxring
items.rings.ring.tourmaline=Turmalinring
items.rings.ring.emerald=Smaragdring
items.rings.ring.sapphire=Saphirring
items.rings.ring.quartz=Quarzring
items.rings.ring.agate=Achatring
items.rings.ring.equip_cursed=Der Ring schnürt sich schmerzhaft um deinen Finger!
items.rings.ring.unknown_desc=Ein Ring vom Flohmarkt am Kanal, mit einem großen Stein, der im Dunkeln glitzert. Der Verkäufer schwor, er sei echt. Wer weiß, was er bewirkt, wenn man ihn trägt?
items.rings.ring.known=Dies ist ein %s
items.rings.ring.identify=Nun bist du mit deinem Ring vertraut genug, um ihn zu identifizieren.
items.rings.ring.cursed_worn=Da dieser Ring verflucht ist, bist du nicht dazu in der Lage, ihn abzustreifen.
items.rings.ring.curse_known=Du spürst, dass eine bösartige Magie in diesem Ring ruht.
items.rings.ring.not_cursed=Dieser Ring ist frei von bösartiger Magie.

items.rings.ringofaccuracy.name=Ring der Dartkneipe
items.rings.ringofaccuracy.stats=Wenn dieser Ring getragen wird, erhöht er deine Genauigkeit um _%s%%._
items.rings.ringofaccuracy.typical_stats=Wenn dieser Ring getragen wird, erhöht er normalerweise deine Genauigkeit um _%s%%._
items.rings.ringofaccuracy.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und erhöhen so deine Genauigkeit insgesamt um _%s%%._
items.rings.ringofaccuracy.upgrade_stat_name_1=Präzisionssteigerung
items.rings.ringofaccuracy.desc=Dieser Ring aus einer verrauchten Dartkneipe verbessert deine Konzentration und hilft deinen Angriffen, ihr Ziel zu finden. Ein verfluchter Ring macht es deinen Angriffen stattdessen schwerer.

items.rings.ringofarcana.name=Esoterik-Ring
items.rings.ringofarcana.stats=Wenn dieser Ring getragen wird, verstärkt er die Wirkung von Verzauberungen und Glyphen um _%s%%._
items.rings.ringofarcana.typical_stats=Wenn dieser Ring getragen wird, verstärkt er normalerweise die Wirkung von Verzauberungen und Glyphen um _%s%%._
items.rings.ringofarcana.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und erhöhen so die Stärke deiner Verzauberungen und Glyphen insgesamt um _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Arkane Verstärkung
items.rings.ringofarcana.desc=Dieser Ring mit Heilstein verstärkt Verzauberungen von Waffen und Glyphen auf Rüstungen, einschließlich der Flüche! Zuerst steigt die Häufigkeit des magischen Effekts. Tritt er garantiert ein, erhöht sich danach seine Stärke. Ein verfluchter Ring schwächt stattdessen Verzauberungen, Glyphen und Flüche.

items.rings.ringofelements.name=Altbau-Ring
items.rings.ringofelements.stats=Wenn dieser Ring getragen wird, bietet er _%s%%_ Elementarwiderstand.
items.rings.ringofelements.typical_stats=Wenn er getragen wird, bietet dieser Ring normalerweise _%s%%_ Elementarwiderstand.
items.rings.ringofelements.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und gewähren dir somit insgesamt _%s%%_ Elementarwiderstand.
items.rings.ringofelements.upgrade_stat_name_1=Widerstand
items.rings.ringofelements.desc=Wer jahrelang ohne Heizung im Altbau überlebt hat, hält alles aus. Der Träger dieses Rings widersteht elementaren und magischen Effekten leichter: Erlittener Schaden und Dauer der Effekte sinken. Ein verfluchter Ring verstärkt stattdessen die negativen Effekte.

items.rings.ringofenergy.name=Powerbank-Ring
items.rings.ringofenergy.stats=Wenn dieser Ring getragen wird, erhöht sich die Aufladegeschwindigkeit von Zauberstäben, Artefakten und Heldenrüstung um _%s%%._
items.rings.ringofenergy.typical_stats=Wenn dieser Ring getragen wird, erhöht sich die Aufladegeschwindigkeit von Zauberstäben, Artefakten und Heldenrüstung normalerweise um _%s%%._
items.rings.ringofenergy.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und erhöhen so die Aufladegeschwindigkeit insgesamt um _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Aufladungssteigerung
items.rings.ringofenergy.desc=Deine magische Ausrüstung lädt sich im arkanen Feld dieses Rings schneller auf, als hinge sie am Schnellladekabel. Ein verfluchter Ring verlangsamt die Aufladung dagegen.

items.rings.ringofevasion.name=Radweg-Ring
items.rings.ringofevasion.stats=Wenn dieser Ring getragen wird, erhöht sich das Ausweichen um _%s%%._
items.rings.ringofevasion.typical_stats=Wenn dieser Ring getragen wird, erhöht sich normalerweise das Ausweichen um _%s%%._
items.rings.ringofevasion.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und erhöhen so dein Ausweichen insgesamt um _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Verstärkung des Ausweichens
items.rings.ringofevasion.desc=Dieser Ring schärft die Reflexe seines Trägers wie ein Jahr auf Berliner Radwegen, sodass er nicht so leicht zu treffen ist. Ein verfluchter Ring erleichtert Gegnern dagegen Treffer.

items.rings.ringofforce.name=Tresenfaust-Ring
items.rings.ringofforce.stats=Unbewaffnet wirst du mit diesem Ring bei deiner momentanen Stärke _%1$d-%2$d Schaden_ verursachen. Mit einer ausgerüsteten Waffe erhöht dieser Ring den Schaden um _%3$d._
items.rings.ringofforce.typical_stats=Unbewaffnet wirst du mit diesem Ring bei deiner momentanen Stärke typischerweise _%1$d-%2$d Schaden_ verursachen. Mit einer ausgerüsteten Waffe erhöht dieser Ring typischerweise den Schaden um _%3$d._
items.rings.ringofforce.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und verursachen so insgesamt _%1$d-%2$d Schaden_ ohne ausgerüstete Waffe, oder sie erhöhen den Schaden um _%3$d_ mit einer ausgerüsteten Waffe.
items.rings.ringofforce.upgrade_stat_name_1=Unbewaffneter Schaden
items.rings.ringofforce.upgrade_stat_name_2=Gesteigerter Waffenschaden
items.rings.ringofforce.upgrade_stat_name_3=Fähigkeitsschaden
items.rings.ringofforce.ability_name=Kämpferstellung
items.rings.ringofforce.typical_ability_desc=Die Zweikämpferin kann mit diesem Ring eine _Kämpferstellung_ einnehmen, so dass sie diesen Ring immer, selbst mit ausgerüsteter Waffe einsetzt. Solche Angriffe verursachen üblicherweise _%1$d-%2$d Schaden_ und nutzen ebenso die Verzauberung und Verbesserung der Waffe. Die Kämpferstellung verlangsamt die Aufladerate einer Waffe um 50%%.
items.rings.ringofforce.ability_desc=Die Zweikämpferin kann mit diesem Ring eine _Kämpferstellung_ einnehmen, so dass sie diesen Ring immer, selbst mit ausgerüsteter Waffe einsetzt. Solche Angriffe verursachen _%1$d-%2$d Schaden_ und nutzen ebenso die Verzauberung und Verbesserung der Waffe. Die Kämpferstellung verlangsamt die Aufladerate einer Waffe um 50%%.
items.rings.ringofforce.desc=Dieser Ring verbessert die Wucht der Nahkampfangriffe des Trägers. Mit Waffe ist die zusätzliche Kraft recht schwach, ein unbewaffneter Angriff wird aber deutlich stärker, wie auf der Eigentümerversammlung, wenn es um die Fassade geht. Ein verfluchter Ring schwächt die Angriffe des Trägers stattdessen.
items.rings.ringofforce$brawlersstance.name=Kämpferstellung
items.rings.ringofforce$brawlersstance.desc=In dieser Stellung wird ein ausgerüsteter Ring der Kraft bei allen regulären Angriffen der Zweikämpferin eingesetzt, selbst, wenn sie eine Waffe ausgerüstet hat. Diese Angriffe erhalten Bonusschaden und nutzen dabei die Verbesserungen und Verzauberungen der Waffe.\n\nDie Aufrechterhaltung dieser Stellung benötigt Konzentration, wodurch die Aufladegeschwindigkeit der Waffenfähigkeit um 50% reduziert wird.\n\nDiese Stellung kann durch die Nutzung des Rings der Kraft eingenommen und wieder verlassen werden, jedoch wird die Aufladegeschwindigkeit eine Zeitlang erhalten bleiben, wenn die Stellung schnell eingenommen und wieder verlassen wird.

items.rings.ringoffuror.name=Ring der Parkplatzwut
items.rings.ringoffuror.stats=Wenn dieser Ring getragen wird, erhöht er die Geschwindigkeit deiner Angriffe um _%s%%._
items.rings.ringoffuror.typical_stats=Wenn dieser Ring getragen wird, erhöht er normalerweise die Geschwindigkeit deiner Angriffe um _%s%%._
items.rings.ringoffuror.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und erhöhen so deine Angriffsgeschwindigkeit insgesamt um _%s%%._
items.rings.ringoffuror.upgrade_stat_name_1=Gesteigerte Angriffsgeschwindigkeit
items.rings.ringoffuror.desc=Dieser Ring entfacht in seinem Träger den Zorn eines Autofahrers auf Parkplatzsuche, wodurch er schneller angreift. Ein verfluchter Ring verlangsamt stattdessen die Angriffsgeschwindigkeit des Trägers.

items.rings.ringofhaste.name=Ring des Anschlusszugs
items.rings.ringofhaste.stats=Wenn dieser Ring getragen wird, erhöht sich deine Bewegungsgeschwindigkeit um _%s%%._
items.rings.ringofhaste.typical_stats=Wenn dieser Ring getragen wird, erhöht sich normalerweise deine Bewegungsgeschwindigkeit um _%s%%._
items.rings.ringofhaste.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und erhöhen so Bewegungsgeschwindigkeit insgesamt um _%s%%._
items.rings.ringofhaste.upgrade_stat_name_1=Gesteigerte Bewegungsgeschwindigkeit
items.rings.ringofhaste.desc=Dieser Ring verringert für den Träger die Anstrengung jeder Bewegung, wie der Sprint zum Anschlusszug, der ausnahmsweise pünktlich ist. Er bewegt sich mit übermenschlicher Geschwindigkeit. Ein verfluchter Ring bremst den Träger stattdessen.

items.rings.ringofmight.name=Muckibuden-Ring
items.rings.ringofmight.stats=Wenn dieser Ring getragen wird, erhöht sich deine Stärke um _%1$d_ und deine maximalen Lebenspunkte um _%2$s%%._
items.rings.ringofmight.typical_stats=Wenn dieser Ring getragen wird, erhöht sich normalerweise deine Stärke um _%1$d_ und deine maximalen Lebenspunkte um _%2$s%%._
items.rings.ringofmight.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und steigern so deine Stärke insgesamt um _%1$d_ und die maximalen Lebenspunkte um _%2$s%%._
items.rings.ringofmight.upgrade_stat_name_1=Stärkebonus
items.rings.ringofmight.upgrade_stat_name_2=Gesteigerte Maximale Lebenspunkte
items.rings.ringofmight.desc=Dieser Ring riecht nach Magnesia und Selbstoptimierung. Er verstärkt die körperlichen Eigenschaften seines Trägers und erhöht so Körperkraft und Konstitution. Ein verfluchter Ring schwächt die körperlichen Eigenschaften seines Trägers.

items.rings.ringofsharpshooting.name=Pfandwurf-Ring
items.rings.ringofsharpshooting.stats=Wenn dieser Ring getragen wird, erhöht er den Schaden deiner Wurfwaffen, als wäre ihre Stufe um _%1$d_ erhöht, sowie deren Lebensdauer um _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Wenn dieser Ring getragen wird, erhöht er normalerweise den effektiven Nutzen deiner Wurfwaffen um _%1$d_ und deren Lebensdauer um _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und steigern so die effektive Stufe von Wurfwaffen insgesamt um _%1$d_ und erhöhen ihre Haltbarkeit um _%2$s%%._
items.rings.ringofsharpshooting.upgrade_stat_name_1=Gesteigerter Stufenschaden
items.rings.ringofsharpshooting.upgrade_stat_name_2=Gesteigerte Haltbarkeit
items.rings.ringofsharpshooting.desc=Dieser Ring verleiht die Zielsicherheit von jemandem, der Flaschen aus zehn Metern in den Altglascontainer trifft. Alle Wurfwaffen erhalten höhere Durchschlagskraft und Lebensdauer. Ein verfluchter Ring hat den gegenteiligen Effekt.

items.rings.ringoftenacity.name=Ring der Wohnungssuche
items.rings.ringoftenacity.stats=Wenn dieser Ring getragen wird, verringert er den erlittenen Schaden um bis zu _%s%%._
items.rings.ringoftenacity.typical_stats=Wenn dieser Ring getragen wird, verringert er normalerweise den erlittenen Schaden um bis zu _%s%%._
items.rings.ringoftenacity.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und verringern so den dir zugefügten Schaden insgesamt um _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Maximaler Schadenswiderstand
items.rings.ringoftenacity.desc=Wer 200 Besichtigungen überlebt hat, fällt nicht so schnell. Getragen macht er seinen Träger widerstandsfähiger gegen tödliche Angriffe: Je stärker er verletzt ist, desto weniger Schaden erleidet er. Ein verfluchter Ring macht es Gegnern dagegen leichter, den Träger zu erledigen.

items.rings.ringofwealth.name=Erbschafts-Ring
items.rings.ringofwealth.stats=Wenn dieser Ring getragen wird, erhöht sich dein Glück um _%s%%._
items.rings.ringofwealth.typical_stats=Wenn dieser Ring getragen wird, erhöht sich normalerweise dein Glück um _%s%%._
items.rings.ringofwealth.combined_stats=Deine ausgerüsteten Ringe kombinieren ihre Kraft und erhöhen so dein Glück insgesamt um _%s%%._
items.rings.ringofwealth.upgrade_stat_name_1=Gesteigertes Glück
items.rings.ringofwealth.desc=Der wahre Weg zum Wohlstand in Berlin: erben. Dieser Ring zieht Schätze an und erhöht die Wahrscheinlichkeit, dass Gegner und Behälter wertvolle Gegenstände bei sich tragen. Ein verfluchter Ring senkt die Wahrscheinlichkeit hingegen.



###scrolls
items.scrolls.scroll.ac_read=LESEN
items.scrolls.scroll.kaunan=Formular KAUNAN
items.scrolls.scroll.sowilo=Formular SOWILO
items.scrolls.scroll.laguz=Formular LAGUZ
items.scrolls.scroll.yngvi=Formular YNGVI
items.scrolls.scroll.gyfu=Formular GEBO
items.scrolls.scroll.raido=Formular RAIDO
items.scrolls.scroll.isaz=Formular ISAZ
items.scrolls.scroll.mannaz=Formular MANNAZ
items.scrolls.scroll.naudiz=Formular NAUDIZ
items.scrolls.scroll.berkanan=Formular BERKANAN
items.scrolls.scroll.odal=Formular ODAL
items.scrolls.scroll.tiwaz=Formular TIWAZ
items.scrolls.scroll.unknown_desc=Ein amtliches Formular mit unleserlichem Vordruck, einem Aktenzeichen aus Runen und keinem erkennbaren Zweck. Wer weiß, was passiert, wenn man es laut vorliest?
items.scrolls.scroll.blinded=Du kannst keine Formulare lesen, wenn du geblendet bist. Das Bürgeramt auch nicht.
items.scrolls.scroll.no_magic=Du kannst keine Formulare lesen, während du gegen Magie immun bist.
items.scrolls.scroll.cursed=Dein verfluchter Sprachführer hindert dich daran, die Magie der Schriftrolle zu wirken! Ein Entfluchungsantrag könnte jedoch stark genug sein...
items.scrolls.scroll$placeholder.name=Formular

items.scrolls.inventoryscroll.warning=Willst du das Formular wirklich abbrechen? Es war noch nicht identifiziert und wird trotzdem verbraucht. Ablage P.
items.scrolls.inventoryscroll.yes=Ja, ich bin mir sicher
items.scrolls.inventoryscroll.no=Nein, lieber doch nicht...

items.scrolls.scrollofidentify.name=Anmeldebescheinigung
items.scrolls.scrollofidentify.inv_title=Identifiziere Gegenstand
items.scrolls.scrollofidentify.it_is=Amtlich festgestellt: %s.
items.scrolls.scrollofidentify.desc=Die seltenste Urkunde der Stadt. Sie enthüllt sämtliche Geheimnisse eines einzigen Gegenstandes.

items.scrolls.scrolloflullaby.name=Plenumsprotokoll
items.scrolls.scrolloflullaby.sooth=Das Protokoll verliest TOP 1 bis TOP 47. Du wirst müde.
items.scrolls.scrolloflullaby.desc=Das Protokoll eines vierstündigen Hausplenums. Beim Vorlesen fallen alle, die es hören, in einen magischen Schlaf. Für dich und deine Verbündeten ist dieser Schlaf erholsam.

items.scrolls.scrollofmagicmapping.name=Kiez-Lageplan
items.scrolls.scrollofmagicmapping.layout=Du kennst nun die Räumlichkeiten dieser Ebene.
items.scrolls.scrollofmagicmapping.desc=Wenn du diesen Plan liest, prägt sich eine genaue Karte dieser Ebene samt aller Geheimnisse in dein Gedächtnis ein. Wo Gegenstände und Kreaturen sind, bleibt dir verborgen. Der Plan ist von 1987, stimmt aber trotzdem.

items.scrolls.scrollofmirrorimage.name=Ausweiskopie
items.scrolls.scrollofmirrorimage.copies=Die Ausweiskopie erschafft Doppelgänger von dir.
items.scrolls.scrollofmirrorimage.no_copies=Die Ausweiskopie versucht, Doppelgänger von dir zu erschaffen, aber sie finden nirgends Platz. Wie auf dem Wohnungsmarkt.
items.scrolls.scrollofmirrorimage.desc=Liest du diese Kopie vor, erscheinen zwei unwirkliche Doppelgänger. Sie handeln wie schwächere Abbilder von dir und jagen deine Feinde. Sie halten jedoch nichts aus und verblassen, sobald sie Schaden erleiden.

items.scrolls.scrollofretribution.name=Fristlose Kündigung
items.scrolls.scrollofretribution.blast=Aufgestaute Wut bricht aus der Kündigung hervor!
items.scrolls.scrollofretribution.desc=Dieses Schreiben kanalisiert dein Leiden in einer mächtigen Detonation nach außen. Je schwächer du bist, desto mehr Schaden richtet es an. Bei sehr wenig Lebenskraft kann es die meisten Feinde sofort töten.\n\nAllerdings fordert es einen Tribut: Du wirst geblendet und geschwächt.

items.scrolls.scrollofrage.name=Lärmbeschwerde
items.scrolls.scrollofrage.roar=Die Lärmbeschwerde brüllt so laut, dass es bis ins Rathaus schallt!
items.scrolls.scrollofrage.desc=Liest du diese Beschwerde vor, entfesselt sie einen ohrenbetäubenden Schrei, der sämtliche Gegner anzieht. Gegner in unmittelbarer Nähe werden wütend. Ironie ist ihr fremd.

items.scrolls.scrollofrecharging.name=Ökostromvertrag
items.scrolls.scrollofrecharging.surge=Eine Energiewelle aus 100 Prozent Wind und Hoffnung erfüllt deine Zauberstäbe mit neuer Kraft.
items.scrolls.scrollofrecharging.desc=Die rohe Energie dieses Vertrags lädt nach dem Lesen alle deine Zauberstäbe über eine gewisse Zeit auf. Kündigungsfrist: nie.

items.scrolls.scrollofremovecurse.name=Entfluchungsantrag
items.scrolls.scrollofremovecurse.inv_title=Wähle einen Gegenstand für den Antrag
items.scrolls.scrollofremovecurse.cleansed=Antrag bewilligt! Eine bösartige Energie entweicht aus deinem Gegenstand!
items.scrolls.scrollofremovecurse.not_cleansed=Dein Gegenstand wird geprüft. Ergebnis: kein Fluch festgestellt.
items.scrolls.scrollofremovecurse.spirit=Dein Entfluchungsantrag befreit die gequälte Seele!
items.scrolls.scrollofremovecurse.desc=Vollständig ausgefüllt entfernt dieser Antrag sofort alle Flüche von einer einzelnen Waffe, einem Ring, einem Zauberstab, einer Rüstung oder einem Artefakt. Es ist der einzige Antrag der Stadt, der ohne Termin bearbeitet wird.

items.scrolls.scrollofteleportation.name=Wohnungstauschantrag
items.scrolls.scrollofteleportation.tele=Tausch genehmigt! Du wurdest an einen anderen Ort auf dieser Ebene versetzt.
items.scrolls.scrollofteleportation.no_tele=Der Wohnungstausch scheitert. Wie immer.
items.scrolls.scrollofteleportation.cant_reach=Dorthin kannst du dich nicht versetzen lassen.
items.scrolls.scrollofteleportation.prompt=Wähle einen Zielort.
items.scrolls.scrollofteleportation.desc=Dieser Antrag versetzt dich sofort an einen anderen Ort auf dieser Ebene, bevorzugt in Bereiche, in denen du noch nicht warst. Hinter verschlossene Türen oder Barrikaden bringt er dich nicht, kann aber verborgene Türen zu neuen Bereichen enthüllen. Die einzige Wohnungsbörse Berlins, die sofort antwortet.

items.scrolls.scrollofterror.name=Mieterhöhung
items.scrolls.scrollofterror.none=Die Mieterhöhung leuchtet grell rot auf.
items.scrolls.scrollofterror.one=Die Mieterhöhung leuchtet grell rot auf und %s flieht!
items.scrolls.scrollofterror.many=Die Mieterhöhung leuchtet grell rot auf und die Monster fliehen!
items.scrolls.scrollofterror.desc=Liest du diese Mieterhöhung vor, blitzt ein rotes Licht auf, und alle Feinde in deinem Sichtfeld werden von Schrecken überwältigt und fliehen. Angriffe auf einen fliehenden Feind verkürzen die Dauer dieses Effekts.

items.scrolls.scrolloftransmutation.name=Umwidmungsantrag
items.scrolls.scrolloftransmutation.inv_title=Gegenstand umwidmen
items.scrolls.scrolloftransmutation.nothing=Es passiert nichts Interessantes. Antrag abgelehnt.
items.scrolls.scrolloftransmutation.morph=Dein Gegenstand wurde umgewidmet!
items.scrolls.scrolloftransmutation.desc=Dieser Antrag macht aus einem passenden Gegenstand einen anderen Gegenstand des gleichen Typs, so wie aus Wohnungen Ferienapartments werden. Aufwertungen, Verzauberungen und Glyphen bleiben erhalten. Schriftrollen und Tränke werden zu ihrem exotischen, exotische zu ihrem normalen Gegenstück.

items.scrolls.scrollofupgrade.name=Modernisierungsbescheid
items.scrolls.scrollofupgrade.inv_title=Gegenstand modernisieren
items.scrolls.scrollofupgrade.weaken_curse=Die Modernisierung schwächt den Fluch deines Gegenstandes.
items.scrolls.scrollofupgrade.remove_curse=Die Modernisierung bricht den Fluch deines Gegenstandes.
items.scrolls.scrollofupgrade.desc=Dieser Bescheid modernisiert einen einzelnen Gegenstand oder einen Satz Wurfwaffen. Zauberstäbe werden stärker und erhalten mehr Ladungen, Waffen und Rüstungen verursachen bzw. blockieren mehr Schaden, Wurfwaffensätze werden komplett repariert und haltbarer, und Ringe wirken stärker. Die Miete steigt nicht, versprochen.\n\nDer Bescheid kann Flüche abschwächen oder manchmal ganz aufheben, wirkt aber schwächer als ein Entfluchungsantrag. Leider kann die Modernisierung Verzauberungen oder Glyphen auf höherwertiger Ausrüstung löschen.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=Sonderformular KAUNAN
items.scrolls.exotic.exoticscroll.sowilo=Sonderformular SOWILO
items.scrolls.exotic.exoticscroll.laguz=Sonderformular LAGUZ
items.scrolls.exotic.exoticscroll.yngvi=Sonderformular YNGVI
items.scrolls.exotic.exoticscroll.gyfu=Sonderformular GEBO
items.scrolls.exotic.exoticscroll.raido=Sonderformular RAIDO
items.scrolls.exotic.exoticscroll.isaz=Sonderformular ISAZ
items.scrolls.exotic.exoticscroll.mannaz=Sonderformular MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=Sonderformular NAUDIZ
items.scrolls.exotic.exoticscroll.berkanan=Sonderformular BERKANAN
items.scrolls.exotic.exoticscroll.odal=Sonderformular ODAL
items.scrolls.exotic.exoticscroll.tiwaz=Sonderformular TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Ein pulsierendes Sonderformular auf schwarzem Papier, mit einer Rune als Aktenzeichen. Es scheint aus einer Behörde zu stammen, die es offiziell nicht gibt. Wer weiß, was passiert, wenn man es laut liest?
items.scrolls.exotic.exoticscroll.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.scrolls.exotic.scrollofsirenssong.name=WG-Casting-Zusage
items.scrolls.exotic.scrollofsirenssong.prompt=Wähle ein Ziel
items.scrolls.exotic.scrollofsirenssong.no_target=Die Zusage wird ohne Empfänger verschickt.
items.scrolls.exotic.scrollofsirenssong.cancel=Du musst ein Ziel auswählen.
items.scrolls.exotic.scrollofsirenssong.desc=Liest du diese Zusage vor, erklingt eine betörende Melodie, die eine feindliche Kreatur bezaubert und sie dauerhaft zu deiner Verbündeten macht! Ein Zimmer in Neukölln lehnt niemand ab. Andere Feinde, die die Melodie hören, werden zeitweilig betört.\n\nBesonders starke Feinde widerstehen der Bezauberung und werden stattdessen nur betört.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=eingezogen
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Diese Kreatur hat eine WG-Casting-Zusage angenommen und ist bei dir eingezogen.\n\nEin bezaubertes Wesen ist für immer dein Verbündeter und bekämpft jeden Feind, dem es begegnet.

items.scrolls.exotic.scrollofantimagic.name=Offline-Verordnung
items.scrolls.exotic.scrollofantimagic.desc=Diese Verordnung umgibt dich mit einer Aura, die zeitweilig alle magischen Effekte blockiert, schädliche wie hilfreiche. Das umfasst auch die meisten Effekte magischer Gegenstände wie Zauberstäbe, Schriftrollen, Ringe, Artefakte, Verzauberungen und Flüche. Die Fähigkeiten der Heldenrüstung sind stark genug, um trotzdem zu funktionieren. Ein Digital Detox, den niemand bestellt hat.

items.scrolls.exotic.scrollofchallenge.name=Hausrecht-Erklärung
items.scrolls.exotic.scrollofchallenge.desc=Laut vorgelesen entfesselt diese Erklärung ein lautes "Ick wohn hier!", das Feinde zu dir lockt, während um dich herum eine kleine Arena entsteht.\n\nSolange du in dieser Arena bleibst, erleidest du 33% weniger Schaden aus jeder Quelle (vor anderen Arten der Schadensreduktion), und deine Sättigung nimmt nicht ab.\n\nDie Arena ist umso größer, je größer das Gebiet ist, in dem du stehst. In manchen Boss-Gebieten ist sie besonders klein.
items.scrolls.exotic.scrollofchallenge$challengearena.name=Hausrecht
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Um dich herum ist eine Arena entstanden, markiert durch wabernden roten Nebel. Hier gilt dein Hausrecht.\n\nSolange du innerhalb des Nebels bleibst, nimmt dein Hunger nicht zu und du erleidest 33%% weniger Schaden aus jeder Quelle. Andere Schadensreduktion (etwa durch Rüstung) wird erst nach dieser 33%%-Reduktion angewandt.\n\nVerbleibende Züge: %d.

items.scrolls.exotic.scrollofdivination.name=Grundbuchauszug
items.scrolls.exotic.scrollofdivination.nothing_left=Es gibt nichts mehr zu identifizieren! Alles ist amtlich.
items.scrolls.exotic.scrollofdivination.desc=Dieser Auszug identifiziert vier zufällige Gegenstandsarten, die dir noch nicht bekannt sind: die Farbe einer Pulle, das Runen-Aktenzeichen eines Formulars oder den Edelstein eines Rings. Die identifizierten Gegenstände müssen nicht unbedingt unter denen sein, die du bei dir trägst.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Dein Grundbuchauszug hat die folgenden Gegenstände identifiziert:

items.scrolls.exotic.scrollofdread.name=Räumungsklage
items.scrolls.exotic.scrollofdread.desc=Liest du diese Klage vor, blitzt ein rotes Licht auf und erfüllt alle Feinde in deinem Sichtkreis mit unvorstellbarem Schrecken. Er ist so heftig, dass sie aus den Tiefen fliehen und nie wiederkommen!\n\nWie bei der Mieterhöhung kann der Effekt mit der Zeit nachlassen oder wenn der Feind angegriffen wird.\n\nFeinde mit besonders starkem Willen, etwa Bosse, verfallen stattdessen nur gewöhnlichem Schrecken. Die haben Anwälte.

items.scrolls.exotic.scrollofenchantment.name=Sondergenehmigung
items.scrolls.exotic.scrollofenchantment.inv_title=Gegenstand genehmigen
items.scrolls.exotic.scrollofenchantment.weapon=Wähle eine Verzauberung. die du auf deiner Waffe anwenden willst.
items.scrolls.exotic.scrollofenchantment.armor=Wähle eine Glyphe, die du auf deiner Rüstung anbringen willst.
items.scrolls.exotic.scrollofenchantment.cancel=Abbrechen
items.scrolls.exotic.scrollofenchantment.cancel_warn=Abbrechen verbraucht deine Sondergenehmigung trotzdem. Bist du sicher?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Ja, ich bin mir sicher.
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Nein, ich habe meine Meinung geändert
items.scrolls.exotic.scrollofenchantment.desc=Diese Genehmigung versieht eine Rüstung oder Waffe mit starker magischer Energie. Du darfst sogar mitentscheiden, welche Art von Magie hineinkommt. Mitbestimmung, einmal im Leben.

items.scrolls.exotic.scrollofforesight.name=Mängelanzeige
items.scrolls.exotic.scrollofforesight.desc=Nachdem du diese Mängelanzeige liest, erscheinen Details des umgebenden Terrains mit kristallener Klarheit in deinem Kopf. Der Effekt hält eine beträchtliche Zeit an und offenbart verborgene Türen und Haufen, ohne dass du suchen musst. Beheben wird sie trotzdem niemand.

items.scrolls.exotic.scrollofmetamorphosis.name=Umschulungsbescheid
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Wähle ein Talent für die Metamorphose
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Wähle ein neues Talent, durch das dein gewandeltes Talent ersetzt werden soll.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Auch wenn du abbrichst, wird dein Umschulungsbescheid verbraucht. Bist du sicher?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=Talent umwandeln
items.scrolls.exotic.scrollofmetamorphosis.desc=Dieser Bescheid vom Amt wirkt auf dich statt auf einen Gegenstand. Du wählst ein Talent und ersetzt es durch eines von fünf Talenten derselben Stufe anderer Heldenklassen. Ob du willst, fragt niemand.\n\nDas wirkt nur auf Klassentalente, nicht auf Talente aus Unterklassen oder Rüstungsfähigkeiten. Talente, die du nicht einsetzen kannst, stehen nicht zur Auswahl.

items.scrolls.exotic.scrollofmysticalenergy.name=Nebenkostenrückzahlung
items.scrolls.exotic.scrollofmysticalenergy.desc=Eine Nebenkostenabrechnung mit Guthaben, amtlich beglaubigt, damit es jemand glaubt. Die Energie dieses Schreibens lädt nach dem Lesen deine ausgerüsteten Artefakte über eine gewisse Zeit auf.

items.scrolls.exotic.scrollofpassage.name=Rückfahrschein
items.scrolls.exotic.scrollofpassage.desc=Dieser Fahrschein befördert dich sofort zum Eingang der ersten Ebene der aktuellen Region. Sehr nützlich, um schnell zum Spätimann zu kommen. Ausnahmsweise pünktlich.

items.scrolls.exotic.scrollofprismaticimage.name=Glitzer-Flyer
items.scrolls.exotic.scrollofprismaticimage.desc=Dieser Partyflyer erschafft eine Illusion von dir, die in allen Farben des Regenbogens strahlt. Das Abbild hat eine ähnliche Verteidigung wie du, aber weniger Lebensenergie und verursacht weniger Schaden.\n\nEs erscheint, wenn Gegner in der Nähe sind, und versucht, dich zu verteidigen.\n\nExistiert es bereits, heilt der Flyer es vollständig.

items.scrolls.exotic.scrollofpsionicblast.name=Steuerbescheid
items.scrolls.exotic.scrollofpsionicblast.ondeath=Der Steuerbescheid hat deinen Verstand in Stücke gerissen...
items.scrolls.exotic.scrollofpsionicblast.desc=Dieser Bescheid birgt eine unglaubliche Zerstörungskraft und reißt den Verstand aller sichtbaren Kreaturen in Stücke.\n\nDas hat eine bedeutende Kehrseite: Auch du wirst verletzt, geblendet und geschwächt. Je mehr Ziele er trifft, desto weniger Schaden erleidest du. Geteiltes Leid.



###spells
items.spells.alchemize.name=Flohmarkt-Zauber
items.spells.alchemize.prompt=einen Gegenstand alchemisieren
items.spells.alchemize.desc=Dieser Zauber verwandelt Kram in Kohle, wie ein guter Flohmarkttag am Maybachufer. Jede Anwendung macht aus einem Gegenstand (oder einem Stapel) Gold oder alchemische Energie. Tränke oder Schriftrollen, die du in Energie verwandelst, werden dabei sogar identifiziert!\n\nEinige Anwendungen gibt es in Läden zu kaufen, viele weitere lassen sich per Alchemie aus einem Samen, einer Stadttaube und etwas alchemischer Energie herstellen.
items.spells.alchemize$wndalchemizeitem.sell=In %d Gold umwandeln
items.spells.alchemize$wndalchemizeitem.sell_1=1 in %d Gold umwandeln
items.spells.alchemize$wndalchemizeitem.sell_all=Alle in %d Gold umwandeln
items.spells.alchemize$wndalchemizeitem.energize=In %d Energie umwandeln
items.spells.alchemize$wndalchemizeitem.energize_1=1 in %d Energie umwandeln
items.spells.alchemize$wndalchemizeitem.energize_all=Alle in %d Energie umwandeln

items.spells.beaconofreturning.name=Nachhause-Taxi
items.spells.beaconofreturning.preventing=Die starke magische Aura dieses Ortes verhindert, dass du diesen Zauber verwendest.
items.spells.beaconofreturning.creatures=Die psychische Aura naher Kreaturen erlaubt es dir im Moment nicht, dich zu teleportieren.
items.spells.beaconofreturning.set=Das Nachhause-Taxi hat sich deine jetzige Position als Abholadresse gemerkt.
items.spells.beaconofreturning.wnd_body=Setzen überschreibt die Abholadresse, die das Taxi sich vorher gemerkt hat.\n\nZurückkehren bringt dich zur zuletzt gesetzten Position zurück und verbraucht eine Benutzung des Zaubers.
items.spells.beaconofreturning.wnd_set=Setzen
items.spells.beaconofreturning.wnd_return=Rückkehr
items.spells.beaconofreturning.desc_set=Die Abholadresse liegt irgendwo auf Ebene %d.
items.spells.beaconofreturning.desc=Dieser Zauber bringt dich zu einem gespeicherten Ort zurück, egal wie weit weg du bist, wie ein Nachtbus mit Haustürservice. Verbraucht wird er erst bei der Rückkehr. Den Ort kannst du beliebig oft neu festlegen, gemerkt wird aber nur der zuletzt gesetzte.

items.spells.curseinfusion.name=Fluchinfusion
items.spells.curseinfusion.inv_title=Verfluche einen Gegenstand
items.spells.curseinfusion.desc=Dieser Zauber erfüllt einen Gegenstand mit der gleichen starken, bösartigen Magie, die auch in Bohrlinde (DM-300) steckt. Der betroffene Gegenstand wird sofort verflucht und jede Verzauberung oder Glyphe überschrieben.\n\nBei Waffen, Rüstung oder Zauberstäben wird der jeweilige Gegenstand zusätzlich zum Fluch deutlich verbessert. Verbesserungen durch Fluchinfusion summieren sich aber nicht, und die Verbesserungen verschwinden, sobald der Fluch des Gegenstands gebrochen wird.\n\nMehrere Fluchinfusionen können auch dazu genutzt werden, den Fluch auf einer Waffe oder Rüstung zu ändern.

items.spells.spell.ac_cast=ZAUBERN
items.spells.spell.no_magic=Du kannst keine Zauber sprechen, während du gegen Magie immun bist.
items.spells.spell.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.spells.magicalinfusion.name=Bestandsschutz-Upgrade
items.spells.magicalinfusion.inv_title=Fusioniere Gegenstand
items.spells.magicalinfusion.infuse=Dein Gegenstand ist von arkaner Macht durchdrungen!
items.spells.magicalinfusion.desc=Dieser Zauberspruch besitzt die gleiche magische Energie wie der Modernisierungsbescheid, aber in stabilerer Form, mit Bestandsschutz.\n\nAbgesehen von der normalen Verbesserung eines Gegenstandes entfernt dieser Zauberspruch niemals eine Verzauberung oder einen Fluch.

items.spells.magicalporter.name=Paketboten-Zauber
items.spells.magicalporter.inv_title=Trage einen Gegenstand
items.spells.magicalporter.nowhere=Es gibt keinen Ort, an welchen ein Gegenstand hingetragen werden könnte.
items.spells.magicalporter.desc=Dieser Zauber transportiert jeden Gegenstand auf magische Weise. Anders als beim Späti-Pager landen die Gegenstände jedoch am Eingang der nächsten Boss-Ebene. Zugestellt, aber nicht bei dir, wie jedes Paket in Berlin.

items.spells.phaseshift.name=Zwangsumzug
items.spells.phaseshift.no_target=Es gibt hier nichts zu teleportieren.
items.spells.phaseshift.desc=Dieser chaotische Zauber verfrachtet jede Figur, auf die er zielt, an einen zufälligen Ort der aktuellen Ebene und betäubt sie für längere Zeit, ganz ohne Kündigungsfrist. Starke Gegner widerstehen der Betäubung. Du kannst ihn auf ein Ziel oder auf dich selbst richten.

items.spells.reclaimtrap.name=Haufen-Recycling
items.spells.reclaimtrap.no_trap=Dort liegt kein Haufen.
items.spells.reclaimtrap.desc_trap=Der Zauber ist derzeit dazu bereit, _%s_ auszulösen.
items.spells.reclaimtrap.desc=Dieser Zauber enthält Reste der mechanischen Energie von Bohrlinde (DM-300). Wirkst du ihn auf einen aktiven Haufen, geht seine Kraft auf dich über, und du kannst sie mit einer weiteren Anwendung an einem beliebigen Ort auslösen. Wie ein Kotbeutel, nur magisch und wiederverwendbar.\n\nManche Haufen wirken jedoch nicht überall, und du kannst immer nur einen Haufen speichern.

items.spells.recycle.name=Tauschregal
items.spells.recycle.inv_title=Einen Gegenstand wiederverwerten
items.spells.recycle.recycled=Dein Gegenstand wurde als %s wiederverwertet.
items.spells.recycle.desc=Dieser Zauberspruch wirkt wie ein Tauschregal im Hausflur. Er wirkt nicht auf Ausrüstung, kann aber Schriftrollen, Tränke, Samen, Stadttauben oder präparierte Dartpfeile in einen zufälligen Gegenstand gleicher Art umwandeln.

items.spells.summonelemental.name=Elementar beschwören
items.spells.summonelemental.ac_imbue=VERSCHMELZEN
items.spells.summonelemental.imbue_prompt=Einen Gegenstand verschmelzen
items.spells.summonelemental.desc=Dieser Zauberspruch kanalisiert die Energie der zur Herstellung verwendeten Asche eines Elementars und beschwört ein freundliches Elementar, das an deiner Seite kämpft! Es kann immer nur ein Elementar gleichzeitig beschworen werden, aber du kannst den Zauberspruch weiterhin, ohne ihn zu verbrauchen, einsetzen, um das Elementar zu dir zurückzurufen.
items.spells.summonelemental.desc_newborn=Dieser Zauberspruch ist derzeit nicht verschmolzen und wird ein _neugeborenes Elementar_ ohne Fernkampffähigkeit beschwören. Du kannst eine identifizierte Grillanzünder-Flasche, einen Frost-Slush, einen Ökostromvertrag oder einen Umwidmungsantrag mit dem Zauberspruch verschmelzen, um ihm mehr Kraft zu verleihen, so dass künftige Beschwörungen ein ausgewachsenes Elementar erschaffen!
items.spells.summonelemental.desc_fire=Dieser Zauberspruch fühlt sich derzeit heiß an, er wird ein _Feuerelementar_ beschwören. Du kannst ihn mit einem anderen Gegenstand verschmelzen, doch dann verliert der Spruch seine gegenwärtige Verschmelzung.
items.spells.summonelemental.desc_frost=Der Zauberspruch fühlt sich derzeit kalt an, er wird ein _Frostelementar_ beschwören. Du kannst ihn mit einem anderen Gegenstand verschmelzen, doch dann verliert der Spruch seine gegenwärtige Verschmelzung.
items.spells.summonelemental.desc_shock=Dieser Zauberspruch strahlt derzeit elektrostatische Energie aus, er wird ein _Schockelementar_ beschwören. Du kannst ihn mit einem anderen Gegenstand verschmelzen, doch dann verliert der Spruch seine gegenwärtige Verschmelzung.
items.spells.summonelemental.desc_chaos=Dieser Zauberspruch strahlt derzeit chaotische Energie aus, er wird ein _Chaoselementar_ beschwören. Du kannst ihn mit einem anderen Gegenstand verschmelzen, doch dann verliert der Spruch seine gegenwärtige Verschmelzung.

items.spells.targetedspell.prompt=Wähle ein Ziel
items.spells.targetedspell.inv_title=Fusioniere Gegenstand

items.spells.telekineticgrab.name=Müllgreifer
items.spells.telekineticgrab.cant_grab=Du kannst nicht danach greifen.
items.spells.telekineticgrab.no_target=Dort gibt es nichts zu greifen.
items.spells.telekineticgrab.desc=Ein unsichtbarer Müllgreifer, wie ihn die Stadtreinigung benutzt. Mit diesem Zauber greifst du aus der Ferne alle Gegenstände an einem Ort oder alle Wurfwaffen, die in einem Gegner stecken!\n\nFremdes Eigentum und Behälter wie Sperrmüllberge kannst du damit nicht greifen.

items.spells.unstablespell.name=Wundertüte
items.spells.unstablespell.desc=Eine kleine schwarze Wundertüte, auf der sich ständig andere Runen abzeichnen. Was drin ist, weiß niemand.\n\nBeim Öffnen löst sie den Effekt einer zufälligen Schriftrolle aus. Sind Gegner in deinem Sichtfeld, ist es immer ein Kampfeffekt, sonst immer ein Effekt für außerhalb des Kampfes.

items.spells.wildenergy.name=Wilde Energie
items.spells.wildenergy.desc=Dieser Zauber enthält einen Teil der verfluchten Energie, mit der Bohrlinde (DM-300) lief. Beim Wirken lädt er deine Zauberstäbe und getragenen Artefakte auf und löst zugleich einen zufälligen Effekt eines verfluchten Zauberstabs aus. Die Richtung, in die diese verfluchte Magie schießt, bestimmst du aber selbst.


###runestones
items.stones.inventorystone.ac_use=VERWENDEN

items.stones.runestone$placeholder.name=Stadttaube
items.stones.runestone.discover_hint=Du kannst diesen Gegenstand zufällig in den Tiefen finden oder mit Alchemie herstellen.

items.stones.stoneofaggression.name=Stänker-Taube
items.stones.stoneofaggression.desc=Diese Taube landet auf einem Verbündeten oder Feind und fliegt gleich wieder davon. Danach greifen alle Feinde in der Nähe für kurze Zeit bevorzugt diesen Charakter an. Wie ein Kommentar in der Kiezgruppe.\n\nBosse können nicht direkt Ziel dieses Effekts sein, ihre Helfer aber schon.
items.stones.stoneofaggression$aggression.name=markiert
items.stones.stoneofaggression$aggression.desc=Eine Stänker-Taube hat diesen Charakter markiert. Alle nahen Feinde greifen ihn bevorzugt an.\n\nVerbleibende Züge: %s.

items.stones.stoneofaugmentation.name=Tuning-Taube
items.stones.stoneofaugmentation.inv_title=Tune einen Gegenstand
items.stones.stoneofaugmentation.desc=Am Fußring steht: „Tuning. Tieferlegung. Alles legal.“ Diese Taube landet auf einem Ausrüstungsteil, verbessert eine Eigenschaft auf Kosten einer anderen und fliegt dann davon.\n\nAuf eine Waffe angewandt, erhöht sie wahlweise Geschwindigkeit oder Schaden. Wurfwaffen gewinnen oder verlieren dabei Haltbarkeit im Verhältnis zu ihrer Geschwindigkeit.\n\nAuf eine Rüstung angewandt, erhöht sie wahlweise Verteidigung oder Ausweichen.
items.stones.stoneofaugmentation.discover_hint=Du kannst diesen Gegenstand in einem Laden kaufen oder mit Alchemie herstellen.
items.stones.stoneofaugmentation$wndaugment.choice=Das Tuning einer Eigenschaft senkt die andere. Welche Eigenschaft möchtest du verbessern?
items.stones.stoneofaugmentation$wndaugment.already=Dieser Gegenstand ist bereits getunt. Du kannst das Tuning tauschen oder entfernen.
items.stones.stoneofaugmentation$wndaugment.speed=+Tempo -Schaden
items.stones.stoneofaugmentation$wndaugment.damage=+Schaden -Tempo
items.stones.stoneofaugmentation$wndaugment.evasion=+Ausweichen -Verteidigung
items.stones.stoneofaugmentation$wndaugment.defense=+Verteidigung -Ausweichen
items.stones.stoneofaugmentation$wndaugment.none=Feineinstellung entfernen
items.stones.stoneofaugmentation$wndaugment.cancel=Später entscheiden

items.stones.stoneofblast.name=Böllertaube
items.stones.stoneofblast.desc=Diese Taube hat an Silvester gelernt, Böller fallen zu lassen, und sitzt längst wieder auf dem Dach, wenn es knallt. Der Böller explodiert sofort an der Stelle, an der sie landet, und beschädigt wie eine Lachgasflasche alles in der Nähe.

items.stones.stoneofblink.name=Blinzeltaube
items.stones.stoneofblink.desc=Am Bein klebt ein Zettel: „Bin gleich wieder da.“ Diese Taube teleportiert dich zu der Stelle, an der sie landet, und fliegt dann davon.

items.stones.stoneofclairvoyance.name=Hellseh-Taube
items.stones.stoneofclairvoyance.desc=Diese Taube wohnt hinter einem Esoterikladen und hat ein drittes Auge aufgemalt. Wo sie landet, enthüllt sie sofort alle Felder in einem sehr großen Bereich, sogar durch Wände hindurch, und fliegt dann davon.

items.stones.stoneofdeepsleep.name=Mittagsschlaf-Taube
items.stones.stoneofdeepsleep.desc=Diese Taube riecht nach Kantine um 13 Uhr. Landet sie auf einem Gegner, fällt dieser in einen tiefen magischen Mittagsschlaf, aus dem er nicht mehr aufwacht, bis ihn etwas stört. Die Taube fliegt leise davon.

items.stones.stoneofdetectmagic.name=Gutachter-Taube
items.stones.stoneofdetectmagic.inv_title=Prüfe einen Gegenstand
items.stones.stoneofdetectmagic.detected_none=Du bemerkst keine Magie, die auf diesen Gegenstand einwirkt.
items.stones.stoneofdetectmagic.detected_both=Du entdeckst sowohl positive als auch bösartige Magie, die auf diesen Gegenstand einwirkt!
items.stones.stoneofdetectmagic.detected_good=Du entdeckst positive Magie, die diesen Gegenstand beeinflusst!
items.stones.stoneofdetectmagic.detected_bad=Du entdeckst, dass bösartige Magie auf diesen Gegenstand einwirkt!
items.stones.stoneofdetectmagic.desc=Eine Taube mit Prüfsiegel am Fußring, die Magie an Gegenständen erkennt. Landet sie auf einem nicht identifizierten Gegenstand, sagt sie dir, ob ein böser Fluch darauf liegt und ob positive Magie wie eine Verzauberung oder Verbesserungen darauf wirkt. Danach fliegt sie davon. Das einzige Gutachten im Kiez, das nichts kostet.

items.stones.stoneofdisarming.name=Entschärfungs-Taube
items.stones.stoneofdisarming.desc=Diese Taube scharrt heimtückische versteckte Haufen unschädlich, wie ein Hauswart mit Kotbeutel und Feierabendlaune. Sie entschärft bis zu 9 Haufen im Bereich, in dem sie landet, und fliegt dann davon.

items.stones.stoneofenchantment.name=Verzauberungs-Taube
items.stones.stoneofenchantment.inv_title=Verzaubere einen Gegenstand
items.stones.stoneofenchantment.weapon=Deine Waffe glüht in der Dunkelheit!
items.stones.stoneofenchantment.armor=Deine Rüstung glüht in der Dunkelheit!
items.stones.stoneofenchantment.desc=Diese Taube besitzt die Magie der Bezauberung. Anders als ein Modernisierungsbescheid kann sie nicht direkt die Macht eines Gegenstands erhöhen. Stattdessen landet sie auf einer Waffe oder Rüstung, versieht sie mit einem Zauber, so dass sie eine neue Eigenschaft erhält, und fliegt davon.

items.stones.stoneoffear.name=Schreck-Taube
items.stones.stoneoffear.desc=Um das Bein dieser Taube ist eine Mahnung in Rot gewickelt. Landet sie auf einer Figur, packt diese das blanke Entsetzen, und sie dreht um und flieht. Die Taube fliegt davon. Greifst du eine fliehende Figur an, endet der Effekt früher.

items.stones.stoneofflock.name=Schäfertaube
items.stones.stoneofflock.desc=Diese Taube ruft rund um die Stelle, an der sie landet, für kurze Zeit eine Herde magischer Schafe herbei und fliegt dann davon. Die Schafe sind aus dem Streichelgehege entlaufen und stehen jetzt allen im Weg.

items.stones.stoneofintuition.name=Bauchgefühl-Taube
items.stones.stoneofintuition.inv_title=Wähle einen Gegenstand
items.stones.stoneofintuition.desc=Diese Taube besitzt eine schwächere Version der Magie, die auch in Anmeldebescheinigungen zu finden ist. Anstatt einen Gegenstand direkt zu identifizieren, bemüht sie deine Intuition und erlaubt dir so den Versuch, die Eigenschaften eines Tranks, einer Schriftrolle oder eines Rings zu erraten.
items.stones.stoneofintuition.break_info=Eine Bauchgefühl-Taube hilft dir zweimal, bevor sie davonfliegt. _Deine nächste Nutzung wird keine Taube verbrauchen_.
items.stones.stoneofintuition.break_warn=Du hast zuvor eine Bauchgefühl-Taube benutzt, also _wird deine nächste Nutzung eine Taube verbrauchen_.
items.stones.stoneofintuition$wndguess.text=Errate, welchen Typs der nicht identifizierte Gegenstand ist. Falls du richtig liegst, wird der Gegenstand identifiziert!
items.stones.stoneofintuition$wndguess.correct=Richtig. Der Typ des Gegenstands wurde identifiziert!
items.stones.stoneofintuition$wndguess.incorrect=Du hast falsch geraten.
items.stones.stoneofintuition$wndguess.break=Deine Bauchgefühl-Taube fliegt davon...

items.stones.stoneofshock.name=Weidezaun-Taube
items.stones.stoneofshock.desc=Diese Taube summt wie ein Elektro-Weidezaun am Stadtrand. Wo sie landet, entlädt sie einen Stoß elektrischer Energie, der alle Ziele in der Nähe kurz betäubt, und gibt dir für jedes getroffene Ziel Zauberstab-Ladung. Danach fliegt sie davon.


###trinkets
items.trinkets.chaoticcenser.name=Chaos-Räucherstäbchen
items.trinkets.chaoticcenser.spew=Dein Weihrauchgefäß produziert gleich: %s.
items.trinkets.chaoticcenser.desc=Nach einiger Zeit im Alchemiekessel qualmt dieser Räucherstäbchenhalter ganz von allein, wie im Flur eines Yogastudios. Die Gase sammeln sich an und schießen in halb zufälligen Abständen auf Gegner. Er kann alle möglichen Gase erzeugen, aber kurz bevor er loslegt, wirst du gewarnt.
items.trinkets.chaoticcenser.typical_stats_desc=Normalerweise erzeugt dieses Kleinod etwa alle _%d_ Züge ein schädliches Gas in der Nähe eines Gegners. Gase entstehen nur, wenn Gegner da sind. Auf höheren Stufen sind die Gase eher exotisch und mächtig.
items.trinkets.chaoticcenser.stats_desc=Auf seiner aktuellen Stufe erzeugt dieses Kleinod etwa alle _%d_ Züge ein schädliches Gas in der Nähe eines Gegners. Gase entstehen nur, wenn Gegner da sind. Auf höheren Stufen sind die Gase eher exotisch und mächtig.

items.trinkets.crackedspyglass.name=Gesprungenes Fernglas
items.trinkets.crackedspyglass.desc=Dieses Fernglas wäre ein Meisterwerk präziser Handarbeit, wäre da nicht der Sprung in der vorderen Linse. Irgendjemand hat damit zu lange in fremde Wohnungen geschaut. Es hilft dir, zusätzliche Gegenstände aufzuspüren, doch wegen des Sprungs sind sie ziemlich schwer zu erkennen!
items.trinkets.crackedspyglass.typical_stats_desc=Normalerweise erschafft dieses Kleinod mit einer _Chance von %1$s%%_ einen zusätzlichen versteckten Gegenstand auf jeder Ebene ohne Boss.
items.trinkets.crackedspyglass.stats_desc=Auf seiner aktuellen Stufe erschafft dieses Kleinod mit einer _Chance von %1$s%%_ einen zusätzlichen versteckten Gegenstand auf jeder Ebene ohne Boss.
items.trinkets.crackedspyglass.stats_desc_upgraded=Auf seiner aktuellen Stufe hat dieses Kleinod eine _Chance von 100%%_, einen zusätzlichen verborgenen Gegenstand auf jeder Nicht-Boss-Ebene zu erschaffen, sowie eine _Chance von %1$s%%_, einen zweiten verborgenen Gegenstand zu erschaffen.

items.trinkets.dimensionalsundial.name=Hinterhof-Sonnenuhr
items.trinkets.dimensionalsundial.warning=Deine Hinterhof-Sonnenuhr wirft keinen Schatten, du fühlst dich unbehaglich.
items.trinkets.dimensionalsundial.desc=Eine Sonnenuhr aus einem Hinterhof, in den seit dem Dachausbau keine Sonne mehr fällt. Trotzdem wirft sie einen Schatten, der sich nach der echten Uhrzeit richtet, auch hier unten. Nachts wirft sie keinen, und dann scheint sie Gefahr anzuziehen.
items.trinkets.dimensionalsundial.typical_stats_desc=Normalerweise reduziert dieses Kleinod die Spawn-Rate tagsüber (8-20 Uhr) um _%1$d %%_, und es erhöht die Spawn-Rate nachts (20-8 Uhr) um _%2$d%%_.
items.trinkets.dimensionalsundial.stats_desc=Auf der aktuellen Stufe reduziert dieses Kleinod die Spawn-Rate tagsüber (8-20 Uhr) um _%1$d %%_, und es erhöht die Spawn-Rate nachts (20-8 Uhr) um _%2$d%%_.

items.trinkets.exoticcrystals.name=Importkristalle
items.trinkets.exoticcrystals.desc=Rosa Kristalle aus einem Laden, der früher ein Späti war und jetzt „Crystal Healing“ anbietet. Sie haben die Form von Kristallen alchemischer Energie, taugen aber nicht zur Energiegewinnung. Stattdessen beeinflussen sie irgendwie die Tränke und Formulare, die du findest.
items.trinkets.exoticcrystals.typical_stats_desc=Normalerweise wird dieses Kleinod _%s%%_ der gefundenen Tränke oder Schriftrollen durch ihr exotisches Äquivalent ersetzen. Das betrifft kein Kraft-Wegbier, keine Modernisierungsbescheide oder Gegenstände, die benötigt werden, um Gefahrenräume zu meistern.
items.trinkets.exoticcrystals.stats_desc=Auf der aktuellen Stufe wird dieses Kleinod _%s%%_ der gefundenen Tränke oder Schriftrollen durch ihr exotisches Äquivalent ersetzen. Das betrifft kein Kraft-Wegbier, keine Modernisierungsbescheide oder Gegenstände, die benötigt werden, um Gefahrenräume zu meistern.

items.trinkets.eyeofnewt.name=Milchglasbrille
items.trinkets.eyeofnewt.desc=Eine Brille mit Gläsern aus einem Badezimmerfenster. Du siehst damit kaum etwas, aber wie jeder im Altbau hörst du trotzdem, wer nebenan ist.
items.trinkets.eyeofnewt.typical_stats_desc=Normalerweise wird dieses Kleinod deine Sichtweite um _%1$s%%_ verringern, verleiht dir aber gleichzeitig übersinnliche Wahrnehmung gegenüber Feinden in einem Umkreis von _%2$d_ Feldern.
items.trinkets.eyeofnewt.stats_desc=Auf der aktuellen Stufe wird dieses Kleinod deine Sichtweite um _%1$s%%_ verringern, verleiht dir aber gleichzeitig übersinnliche Wahrnehmung gegenüber Feinden in einem Umkreis von _%2$d_ Feldern.

items.trinkets.ferrettuft.name=Stadttaubenfeder
items.trinkets.ferrettuft.desc=Eine graue Feder von einer Stadttaube, die jedem Fahrrad in letzter Sekunde ausweicht und nie früher. Das Kleinod scheint etwas von dieser Kunst auszustrahlen und erleichtert allem um sich herum das Ausweichen.
items.trinkets.ferrettuft.typical_stats_desc=Normalerweise erhöht dieses Kleinod die Ausweichrate aller Charaktere um _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=Auf seiner aktuellen Stufe erhöht dieses Kleinod die Ausweichrate aller Charaktere um _%1$s%%_.

items.trinkets.mimictooth.name=Sperrmüllzahn
items.trinkets.mimictooth.desc=Dieser große, scharfe Zahn stammt wohl aus einem sehr unglücklichen Sperrmüllmonster. Er scheint die Sperrmüllberge hier unten zu beeinflussen: Monster darunter tauchen häufiger auf und sind gefährlicher.
items.trinkets.mimictooth.typical_stats_desc=Normalerweise macht dieses Kleinod alle Arten von Sperrmüllmonstern _%1$sx_ so häufig und viel schwerer zu erkennen, erhöht aber auch ihre Beute. Außerdem enthält jede Ebene mit _%2$s%%_ Chance einen zusätzlichen, gut getarnten Schatten-Sperrmüll.
items.trinkets.mimictooth.stats_desc=Auf seiner aktuellen Stufe macht dieses Kleinod alle Arten von Sperrmüllmonstern _%1$sx_ so häufig und viel schwerer zu erkennen, erhöht aber auch ihre Beute. Außerdem enthält jede Ebene mit _%2$s%%_ Chance einen zusätzlichen, gut getarnten Schatten-Sperrmüll.

items.trinkets.mossyclump.name=Moosklumpen
items.trinkets.mossyclump.desc=Dieser Klumpen feuchten Mooses stammt aus der Fuge eines Balkons, der seit 1974 auf seine Sanierung wartet. Er bleibt nass, egal wie sehr du ihn ausquetschst, und scheint mit den Tiefen selbst verbunden zu sein, wodurch Gras und Wasser wesentlich häufiger vorkommen.
items.trinkets.mossyclump.typical_stats_desc=Normalerweise wird dieses Kleinod _%d%%_ des normalen Untergrundes so verändern, dass er entweder mit Wasser oder Gras angefüllt ist.\n\nEs kostet eine größere Menge Energie, dieses Kleinod zu verbessern.
items.trinkets.mossyclump.stats_desc=Auf seiner aktuellen Stufe wird dieses Kleinod _%d%%_  des normalen Untergrundes so verändern, dass er entweder mit Wasser oder Gras angefüllt ist.\n\nEs kostet eine größere Menge Energie, dieses Kleinod zu verbessern.

items.trinkets.parchmentscrap.name=Formularfetzen
items.trinkets.parchmentscrap.desc=Dieser kleine Fetzen stammt aus einem Formular, vermutlich Anlage B. Er hat etwas von seiner Magie behalten und scheint die Waffen und Rüstungen hier unten zu beeinflussen.
items.trinkets.parchmentscrap.typical_stats_desc=Normalerweise macht dieses Kleinod Verzauberungen und Glyphen _%dx_ so häufig und Flüche auf Waffen und Rüstungen _%sx_ so häufig. Flüche auf Zauberstäben, Ringen oder Artefakten bleiben unverändert.\n\nDieses Kleinod zu verbessern kostet mehr Energie als üblich.
items.trinkets.parchmentscrap.stats_desc=Auf seiner aktuellen Stufe macht dieses Kleinod Verzauberungen und Glyphen _%dx_ so häufig und Flüche auf Waffen und Rüstungen _%sx_ so häufig. Flüche auf Zauberstäben, Ringen oder Artefakten bleiben unverändert.\n\nDieses Kleinod zu verbessern kostet mehr Energie als üblich.

items.trinkets.petrifiedseed.name=versteinerte Samenbombe
items.trinkets.petrifiedseed.desc=Eine Samenbombe, die so lange auf einer Baumscheibe lag, dass sie versteinert ist. Sie scheint die Flora hier unten magisch zu beeinflussen, wodurch Samen mitunter durch Stadttauben ersetzt werden.
items.trinkets.petrifiedseed.typical_stats_desc=Üblicherweise führt dieses Kleinod dazu, dass zertrampeltes Gras in _%1$s%%_ der Fälle Stadttauben statt Samen hervorbringt und dass hohes Gras außerdem _%2$s%%_ häufiger Gegenstände enthält.
items.trinkets.petrifiedseed.stats_desc=Auf seiner aktuellen Stufe bewirkt dieses Kleinod, dass zertrampeltes Gras in _%1$s%%_ der Fälle Stadttauben statt Samen hervorbringt und dass hohes Gras außerdem _%2$s%%_ häufiger Gegenstände enthält.

items.trinkets.ratskull.name=Pfandrattenschädel
items.trinkets.ratskull.desc=Der Schädel einer Pfandratte, kaum größer als ein Kronkorken, was hier unten schon eine Seltenheit ist. Sein magischer Einfluss scheint die selteneren Bewohner der Tiefen anzuziehen, so dass diese wesentlich häufiger auftreten.
items.trinkets.ratskull.typical_stats_desc=Normalerweise wird dieses Kleinod dafür sorgen, dass seltene exotische Feinde _%dx_ wahrscheinlicher erscheinen. Der Schädel ist allerdings nur halb so effektiv, wenn es darum geht, Vitrinenmonster und gepanzerte Kunst-am-Bau-Statuen anzulocken.
items.trinkets.ratskull.stats_desc=Auf seiner aktuellen Stufe wird dieses Kleinod dafür sorgen, dass seltene exotische Feinde _%dx_ wahrscheinlicher erscheinen. Der Schädel ist allerdings nur halb so effektiv, wenn es darum geht, Vitrinenmonster und gepanzerte Kunst-am-Bau-Statuen anzulocken.

items.trinkets.saltcube.name=Streusalz-Brocken
items.trinkets.saltcube.desc=Ein fast würfelförmiger Brocken Streusalz, übrig vom einzigen Wintertag, an dem der Winterdienst kam. Im Alchemiekessel hat er die Hälfte des Wassers aufgesaugt, statt sich aufzulösen. Er scheint deine Nahrung magisch zu dehydrieren und zu bewahren: Er steigert deine Sättigung, reduziert aber auch deine Regeneration, wenn du nicht am Verhungern bist.
items.trinkets.saltcube.typical_stats_desc=Normalerweise wird dieses Kleinod die Zeit, bis du hungrig wirst, um _%1$s%%_ verlängern, aber es wird auch deine Regenerationsrate um _%2$s%%_ reduzieren, es sei denn, die Ebene ist gesperrt.
items.trinkets.saltcube.stats_desc=Auf seiner aktuellen Stufe wird dieses Kleinod die Zeit, bis du hungrig wirst, um _%1$s%%_ verlängern, aber es wird auch deine Regenerationsrate um _%2$s%%_ reduzieren, es sei denn, die Ebene ist gesperrt.

items.trinkets.shardofoblivion.name=Scherbe des Vergessens
items.trinkets.shardofoblivion.desc=Nach dem Schmoren im Alchemietopf hat sich diese kleine Scherbe aus verfluchtem Metall verändert und besteht nun aus … nichts? Das Licht scheint sich um sie herum zu biegen, und sie schwebt an Ort und Stelle, wenn du sie nicht hältst. Die Scherbe scheint auf magische Weise Kraft aus deiner Unwissenheit zu beziehen, also ist es wahrscheinlich am besten, nicht zu viel darüber nachzudenken.
items.trinkets.shardofoblivion.typical_stats_desc=Normalerweise erhöht dieses Kleinod die Rate, mit der Feinde Beute fallen lassen, um 20%% pro jeden nicht identifizierten Ausrüstungsgegenstand, den du ausgerüstet oder kürzlich verwendet hast, bis zu einem Maximum von _%d Gegenstand(en)_. Die Scherbe verhindert auch, dass du Ausrüstung identifizieren kannst, sie kann aber verwendet werden, um Gegenstände, die dafür bereit sind, manuell zu identifizieren.
items.trinkets.shardofoblivion.stats_desc=Auf der derzeitigen Stufe erhöht dieses Kleinod die Rate, mit der Feinde Beute fallen lassen, um 20%% pro jeden nicht identifizierten Ausrüstungsgegenstand, den du ausgerüstet oder kürzlich verwendet hast, bis zu einem Maximum von _%d Gegenstand(en)_. Die Scherbe verhindert auch, dass du Ausrüstung identifizieren kannst, sie kann aber verwendet werden, um Gegenstände, die dafür bereit sind, manuell zu identifizieren.
items.trinkets.shardofoblivion.ac_identify=IDENTIFIZIEREN
items.trinkets.shardofoblivion.identify_prompt=Identifiziere einen Gegenstand
items.trinkets.shardofoblivion.identify_ready=Ein Gegenstand kann nun identifiziert werden: %s. Nutze deine Scherbe des Vergessens, um ihn zu identifizieren.
items.trinkets.shardofoblivion.identify_ready_worn=All deine getragenen Gegenstände sind bereit, identifiziert zu werden. Nutze deine Scherbe des Vergessens, um sie zu identifizieren.
items.trinkets.shardofoblivion.identify_not_yet=Dieser Gegenstand kann noch nicht identifiziert werden.
items.trinkets.shardofoblivion.identify=Du hast den Gegenstand erkannt!
items.trinkets.shardofoblivion$wandusetracker.name=Unbekannter Stab benutzt
items.trinkets.shardofoblivion$wandusetracker.desc=Du hast vor Kurzem einen nicht identifizierten Zauberstab verwendet, der für kurze Zeit als ein verwendetes, nicht identifiziertes Ausrüstungsstück für die Scherbe des Vergessens zählt.\n\nVerbleibende Züge: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Unbekannte Wurfwaffe
items.trinkets.shardofoblivion$thrownusetracker.desc=Du hast kürzlich eine nicht identifizierte Wurfwaffe benutzt, die eine kleine Zeitlang für die Scherbe des Vergessens als ein nicht identifizierter Ausrüstungsgegenstand zählt.\n\nVerbleibende Züge: %s.

items.trinkets.thirteenleafclover.name=dreizehnblättriges Kleeblatt
items.trinkets.thirteenleafclover.desc=Irgendwie hat das Köcheln im Alchemiekessel diesen Klee dazu gebracht, einen Strauß Extrablätter wachsen zu lassen! Es ist nicht ganz klar, ob dieses Kleinod Glück oder Unglück bringt, aber vielleicht macht es dein Glück etwas chaotischer?
items.trinkets.thirteenleafclover.typical_stats_desc=Normalerweise verursachst du durch dieses Kleinod in _%1$d%%_ der Fälle den Maximalschaden, und in _%2$d%%_ der Fälle den Minimalschaden.
items.trinkets.thirteenleafclover.stats_desc=Auf seiner aktuellen Stufe verursachst du durch dieses Kleinod in _%1$d%%_ der Fälle den Maximalschaden, und in _%2$d%%_ der Fälle den Minimalschaden.

items.trinkets.trapmechanism.name=Haufen-Mechanik
items.trinkets.trapmechanism.desc=Das Herzstück des Mechanismus eines bodenlosen roten Haufens, das vorsichtig aus dem Boden herausgetrennt wurde, damit es sich transportieren lässt. Es scheint magisch mit den Tiefen selbst verbunden zu sein, so dass gefährliches Terrain häufiger vorkommt, aber auch deine Affinität dazu erhöht wird.
items.trinkets.trapmechanism.typical_stats_desc=Normalerweise wird dieses Kleinod _%1$d%%_ des normalen Untergrundes so verändern, dass er entweder mit Haufen oder Abgründen angefüllt ist. Zusätzlich werden _%2$d%%_ der verborgenen Haufen stattdessen sichtbar sein.
items.trinkets.trapmechanism.stats_desc=Auf seiner aktuellen Stufe wird dieses Kleinod _%1$d%%_ des normalen Untergrundes so verändern, dass er entweder mit Haufen oder Abgründen angefüllt ist. Außerdem werden _%2$d%%_ der versteckten Haufen sichtbar sein.

items.trinkets.vialofblood.name=Blutröhrchen
items.trinkets.vialofblood.desc=Ein Röhrchen aus einer Hausarztpraxis, die seit 2019 keine neuen Patienten aufnimmt. Das Blut darin bewegt sich langsam, wenn du es drehst. Es scheint Heilungseffekte auf magische Weise zu verstärken, sie aber auch zu verzögern, wie jeder Termin in dieser Praxis.
items.trinkets.vialofblood.typical_stats_desc=Normalerweise erhöht dieses Kleinod die allgemeine Gesundheit, die du durch das Trinken von Heiltränken, Wasserschläuchen oder Heilbrunnen gewinnst, um _%1$s%%_. Diese Heileffekte treten jedoch auch langsamer ein; es werden maximal _%2$s_ LP pro Runde regeneriert (dies skaliert mit der Stufe des Helden).
items.trinkets.vialofblood.stats_desc=Auf seiner aktuellen Stufe erhöht dieses Kleinod die allgemeine Gesundheit, die du durch das Trinken von Heiltränken, Wasserschläuchen oder Heilbrunnen gewinnst, um _%1$s%% _. Diese Heileffekte treten jedoch auch langsamer ein; es werden maximal _%2$s_ LP pro Runde regeneriert (dies skaliert mit der Stufe des Helden).

items.trinkets.wondrousresin.name=Wunderharz
items.trinkets.wondrousresin.desc=Dieses schimmernde blaue Harz enthält die destillierte Essenz der Magie eines verfluchten Zauberstabs. Die Magie des Alchemiekessels scheint diese etwas stabilisiert zu haben, und nun beeinflusst es deine Zauberstäbe.
items.trinkets.wondrousresin.typical_stats_desc=Normalerweise bewirkt dieses Kleinod, dass die Effekte verfluchter Zauberstäbe in _%1$s%%_ der Fälle neutral oder positiv werden, und sorgt dafür, dass nicht verfluchte Zauberstäbe in _%2$s%%_ der Fälle einen zusätzlichen neutralen oder positiven verfluchten Schuss abfeuern.\n\nEs kostet recht viel Energie, dieses Kleinod zu verbessern.
items.trinkets.wondrousresin.stats_desc=Auf seiner aktuellen Stufe bewirkt dieses Kleinod, dass die Effekte verfluchter Zauberstäbe in _%1$s%%_ der Fälle neutral oder positiv werden, und sorgt dafür, dass nicht verfluchte Zauberstäbe in _%2$s%%_ der Fälle einen zusätzlichen neutralen oder positiven verfluchten Schuss abfeuern.\n\nEs kostet recht viel Energie, dieses Kleinod zu verbessern.

items.trinkets.trinketcatalyst.name=WG-Umzugskarton
items.trinkets.trinketcatalyst.window_title=Kleinod erschaffen
items.trinkets.trinketcatalyst.window_text=Als du den Karton in den Kessel stellst, weicht das Paketband auf, und das Wasser beginnt zu leuchten. Es gibt einige Dinge in der Nähe, die du mit Energie durchdringen kannst, sodass sie zu einem magischen Kleinod werden.
items.trinkets.trinketcatalyst.desc=Ein zugeklebter Umzugskarton aus einer WG, unbeschriftet, seit drei Generationen von Mitbewohnenden im Flur. Wem er gehört, weiß niemand, und hineingeschaut hat auch niemand. Manchmal summt er. Mit etwas alchemischer Energie kannst du ihn in einem Alchemiekessel öffnen und daraus ein einzigartiges Kleinod herstellen.\n\nKleinodien bewirken verschiedene Effekte, welche die Tiefen oder ihre Bewohner leicht verändern. Sie können mit alchemischer Energie verbessert werden, um ihren Effekt zu verstärken, oder man legt sie einfach ab, wodurch ihr Effekt abbricht.
items.trinkets.trinketcatalyst$randomtrinket.name=zufälliges Kleinod
items.trinkets.trinketcatalyst$randomtrinket.desc=Ganz unten im Karton steckt ein Gegenstand, eingewickelt in drei Lagen Zeitungspapier, und du bekommst ihn nicht heraus.\n\nDer Alchemie-Prozess würde das Papier auflösen, aber was für ein Kleinod es ist, wirst du erst herausfinden, wenn du es machst!

items.trinkets.trinket.discover_hint=Dieser Gegenstand kann bei der Herstellung eines Kleinods durch Alchemie herauskommen.
items.trinkets.trinket$placeholder.name=Kleinod

###wands
items.wands.cursedwand.ondeath=Dein eigener %s hat dich getötet. Kein gutes Video.
items.wands.cursedwand.nothing=Es passiert nichts.
items.wands.cursedwand.mass_invuln=Ein gleißendes Licht bricht aus deinem Zauberstab hervor!
items.wands.cursedwand.petrify=Du erstarrst plötzlich!
items.wands.cursedwand.grass=Plötzlich beginnt Gras um dich zu wuchern!
items.wands.cursedwand.fire=Du riechst etwas Verbranntes...
items.wands.cursedwand.transmogrify_wand=Dein Zauberstab verwandelt sich in einen anderen Gegenstand!
items.wands.cursedwand.transmogrify_other=Dein Gegenstand transformiert sich in etwas anderes!
items.wands.cursedwand.disguise=Dein Aussehen verändert sich vor deinen Augen!
items.wands.cursedwand.supernova=Ein flammender Energieball beginnt zu wachsen. Vielleicht solltest du weglaufen!
items.wands.cursedwand.supernova_positive=Ein flammender Energieball beginnt zu wachsen, aber du fühlst dich irgendwie sicher.
items.wands.cursedwand.sinkhole=Der Boden um dich herum gibt nach!
items.wands.cursedwand.sinkhole_positive=Der Boden gibt nach, aber unter dir fühlt er sich fest genug an.
items.wands.cursedwand.gravity=Die Gravitation beginnt plötzlich in zufällige Richtungen zu ziehen!
items.wands.cursedwand.gravity_positive=Die Gravitation beginnt plötzlich in zufällige Richtungen zu ziehen, aber das scheint dich nicht zu beeinflussen.
items.wands.cursedwand.gravity_end=Die chaotische Gravitation hört auf.

items.wands.damagewand.upgrade_stat_name_1=Magieschaden

items.wands.wand.ac_zap=FEUERN
items.wands.wand.fizzles=Dein Gerät zischt; der Akku scheint nicht genug Ladungen zu haben.
items.wands.wand.no_magic=Dein Gerät zischt; du kannst keine Zauberstäbe verwenden, während du gegen Magie immun bist.
items.wands.wand.self_target=Du kannst dich selber nicht als Ziel bestimmen.
items.wands.wand.identify=Du hast die Bedienungsanleitung dieses Zauberstabs endlich verstanden und kannst ihn identifizieren.
items.wands.wand.resin_one=Dieser Zauberstab hat _1 Stufe_ aus arkanem Harz gewonnen.
items.wands.wand.resin_many=Dieser Zauberstab hat _%d Stufen_ durch arkanes Harz gewonnen.
items.wands.wand.cursed=Dieser Zauberstab ist verflucht, wodurch seine Magie zufällig und chaotisch wirkt.
items.wands.wand.not_cursed=Dieser Zauberstab ist frei von bösartiger Magie.
items.wands.wand.curse_discover=Dieser %s ist verflucht!
items.wands.wand.prompt=Wähle ein Ziel zum Zaubern.
items.wands.wand$placeholder.name=Zauberstab

items.wands.wandofblastwave.name=Laubbläser
items.wands.wandofblastwave.staff_name=Laubbläser-Stick
items.wands.wandofblastwave.ondeath=Du hast dich mit deinem eigenen Laubbläser getötet... Samstag, sieben Uhr früh, war es trotzdem wert.
items.wands.wandofblastwave.knockback_ondeath=Der Zusammenprall hat dich getötet...
items.wands.wandofblastwave.desc=Ein schwerer, marmorierter Laubbläser mit goldenen Verzierungen und einem schwarzen Edelstein an der Düse. Er macht den Lärm eines ganzen Hausmeisterdienstes.
items.wands.wandofblastwave.typical_stats_desc=Dieser Zauberstab schleudert ein magisches Geschoss, welcher an seinem Zielort heftig explodiert. Die Kraft dieser Explosion richtet normalerweise _%1$d-%2$d Schaden_ an und ist so stark, dass die meisten Gegner davonfliegen.
items.wands.wandofblastwave.stats_desc=Dieser Zauberstab schleudert ein magisches Geschoss, welcher an seinem Zielort gewaltsam explodiert. Die Kraft dieser Schockwelle richtet _%1$d-%2$d Schaden_ an und ist so stark, dass die meisten Gegner davonfliegen.
items.wands.wandofblastwave.upgrade_stat_name_2=Rückstoß
items.wands.wandofblastwave.bmage_desc=Wenn _der Hands-on-Gründer_ einen paralysierten Gegner mit einem Laubbläser-Stick trifft, verbraucht es die Paralyse, um einen Stoß an zusätzlichem Magieschaden zuzufügen. Dies hat eine kurze Abklingzeit pro Feind.
items.wands.wandofblastwave.eleblast_desc=Eine Disruption mit einem Laubbläser-Stick verursacht 67% Schaden und stößt Feinde außerhalb des Explosionsbereiches.

items.wands.wandofcorrosion.name=Rostlöser-Sprüher
items.wands.wandofcorrosion.staff_name=Rostlöser-Stick
items.wands.wandofcorrosion.desc=Eine aschgraue Sprühdose mit Pistolengriff, an deren Düse ein orange glänzender Edelstein sitzt. Laut Etikett "nur für Außenbereiche".
items.wands.wandofcorrosion.stats_desc=Dieser Zauberstab schießt einen Bolzen, der am Zielort explodiert und eine Wolke mit stark zersetzendem Gas freigibt. Alles, was sich in der Wolke befindet, wird zunehmend mehr Schaden erleiden, beginnend mit _%d Schaden._
items.wands.wandofcorrosion.upgrade_stat_name_1=Korrosionsschaden
items.wands.wandofcorrosion.upgrade_stat_name_2=Gas Volumen
items.wands.wandofcorrosion.bmage_desc=Wenn _der Hands-on-Gründer_ einen Feind mit einem Rostlöser-Stick trifft, besteht die Chance, dass der Gegner mit ätzendem Schlamm bedeckt wird.
items.wands.wandofcorrosion.eleblast_desc=Eine Disruption mit einem Rostlöser-Stick fügt Feinden 4 Züge lang Korrosion zu, beginnend mit 6 Schaden.

items.wands.wandofcorruption.name=Influencer-Ringlicht
items.wands.wandofcorruption.staff_name=Ringlicht-Stick
items.wands.wandofcorruption.already_corrupted=Dieser Charakter folgt dir bereits. Mehr Reichweite geht nicht.
items.wands.wandofcorruption.desc=Dieses Ringlicht strahlt chaotische, dunkle Energie ab, falls das nicht schon durch den kleinen Totenkopf-Aufkleber offensichtlich wurde. Wer lange genug hineinschaut, wird Follower.
items.wands.wandofcorruption.stats_desc=Dieser Zauberstab setzt eine Welle korrumpierender Energie frei, welche Gegner schwächt und sie schließlich Deinem Willen unterwirft. Gegner können versuchen der Korruption zu widerstehen, aber geschwächte Gegner sind deutlich leichter zu korrumpieren als gesunde.
items.wands.wandofcorruption.upgrade_stat_name_1=Korrumpierende Macht
items.wands.wandofcorruption.upgrade_stat_name_2=Dauer der Schwächung
items.wands.wandofcorruption.bmage_desc=Wenn _der Hands-on-Gründer_ einen Gegner mit einem Ringlicht-Stick trifft, kann das Amok beim Gegner auslösen.
items.wands.wandofcorruption.eleblast_desc=Eine Disruption mit einem Ringlicht-Stick verursacht bei Feinden 5 Züge Amok.

items.wands.wandofdisintegration.name=Laserpointer
items.wands.wandofdisintegration.staff_name=Laser-Stick
items.wands.wandofdisintegration.desc=Ein Laserpointer aus glattem Obsidian, umgeben von violettem Licht. Früher für Präsentationen, heute für die Zerstörung von allem in einer Linie. Er wartet geduldig auf seinen Einsatz.
items.wands.wandofdisintegration.stats_desc=Dieser Stab sendet einen alles durchdringenden Strahl aus, welcher noch weiter reicht, wenn der Stab verbessert wird. Dieser Stab richtet _%1$d-%2$d Schaden_ an und verursacht zusätzlichen Schaden für jeden Gegner und jedes Hindernis, welcher der Strahl durchdrungen hat.
items.wands.wandofdisintegration.upgrade_stat_name_2=maximale Reichweite
items.wands.wandofdisintegration.bmage_desc=Wenn er von _dem Hands-on-Gründer_ geschwungen wird, hat ein Laser-Stick eine erhöhte Angriffsreichweite, als ob er eine projizierende Verzauberung hätte.
items.wands.wandofdisintegration.eleblast_desc=Eine Disruption mit einem Laser-Stick verursacht 100% Schaden und durchdringt Wände.

items.wands.wandoffireblast.name=Flambierbrenner
items.wands.wandoffireblast.staff_name=Flambier-Stick
items.wands.wandoffireblast.desc=Ein Küchenbrenner aus rot lackiertem Metall mit goldenen Blättern, fürs Crème brûlée gekauft und nie dafür benutzt. Aus der Düse knackt und zischt es, begierig darauf, seine Magie zu entfachen.
items.wands.wandoffireblast.stats_desc=Dieser Zauberstab stößt einen Feuerkegel aus, wenn er benutzt wird. Sein nächster Angriff verbraucht _%1$d Ladungen_ und verursacht _%2$d-%3$d Schaden._ Je mehr Ladungen der Zauberstab verbraucht, desto größer und stärker ist der Effekt.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Aufladeschaden
items.wands.wandoffireblast.upgrade_stat_name_2=2 Aufladeschaden
items.wands.wandoffireblast.upgrade_stat_name_3=3 Aufladeschaden
items.wands.wandoffireblast.bmage_desc=Wenn _der Hands-on-Gründer _ einen Gegner mit dem Flambier-Stick angreift, besteht die Chance, dass er eine Explosion hervorruft, die Gegner schädigt und in der Nähe befindliches Feuer verschlingt! Je mehr Feuer sich in unmittelbarer Nähe des Feindes befindet, desto höher ist diese Chance.
items.wands.wandoffireblast.eleblast_desc=Eine Disruption mit einem Flambier-Stick verursacht 100% Schaden, reißt Türen auf und setzt Gegner und das Gelände in Flammen.

items.wands.wandoffrost.name=Kältespray
items.wands.wandoffrost.staff_name=Kältespray-Stick
items.wands.wandoffrost.desc=Eine Dose Kältespray aus dem Erste-Hilfe-Koffer eines Kreisliga-Vereins, mit einem Sprühkopf aus magischem Eis. Sie fühlt sich eisig an, doch deine Hand bleibt irgendwie warm.
items.wands.wandoffrost.stats_desc=Dieser Zauberstab schießt Stöße eisiger Energie auf deine Feinde, fügt _%1$d-%2$d Schaden zu_ und lässt sie unterkühlen. Der Effekt scheint im Wasser stärker zu sein. Gegner, die bereits unterkühlt oder eingefroren sind, erleiden durch diesen Zauberstab weniger Schaden.
items.wands.wandoffrost.upgrade_stat_name_2=Dauer der Unterkühlung
items.wands.wandoffrost.bmage_desc=Wenn _der Hands-on-Gründer_ einen unterkühlten Feind mit dem Kältespray-Stick angreift, hat dieser eine Chance, sofort einzufrieren. Diese Chance ist umso größer, je stärker der Gegner unterkühlt ist.
items.wands.wandoffrost.eleblast_desc=Eine Disruption mit einem Kältespray-Stick verursacht 100% Schaden, friert Gegner ein und löscht Feuer.

items.wands.wandoflightning.name=Starkstromkabel
items.wands.wandoflightning.staff_name=Starkstrom-Stick
items.wands.wandoflightning.ondeath=Du hast dich mit deinem eigenen Starkstromkabel getötet... Die Hausverwaltung wird es nie reparieren.
items.wands.wandoflightning.desc=Ein dickes Starkstromkabel aus einem Baustellenverteiler, schwerer als es aussieht. An den zwei blanken Enden entlädt sich die Elektrizität in Lichtbögen.
items.wands.wandoflightning.stats_desc=Dieser Stab sendet starke Blitze, die alles durchdringen, worauf sie treffen und dabei _%1$d-%2$d Schaden verursachen._ Dieser Stromschlag springt auch auf nahe befindliche Charaktere über und verbreitet sich leichter im Wasser. Die Stromschläge von diesem Stab können dir Schaden zufügen, sie verletzen deine Alliierten jedoch nicht.
items.wands.wandoflightning.bmage_desc=Wenn _der Hands-on-Gründer_ einen Gegner mit einem Starkstrom-Stick trifft, besteht die Chance, dass er sich im Verlauf von 10 Zügen selbst elektrisch auflädt. Während er aufgeladen ist, bleibt der Hands-on-Gründer immun gegen Blitzschlag und verteilt Blitzschläge weiter.
items.wands.wandoflightning.eleblast_desc=Eine Disruption mit einem Starkstrom-Stick verursacht 100% Schaden, betäubt Gegner und setzt Wasser unter Strom.
items.wands.wandoflightning$lightningcharge.name=Elektrisch geladen
items.wands.wandoflightning$lightningcharge.desc=Der Hands-on-Gründer ist derzeit mit Energie geladen, wodurch er immun gegen seinen Starkstrom-Stick ist und dessen Blitzschläge eine größere Reichweite haben.\n\nVerbleibende Züge: %s.

items.wands.wandoflivingearth.name=Bauschaum-Sprüher
items.wands.wandoflivingearth.staff_name=Bauschaum-Stick
items.wands.wandoflivingearth.desc=Eine Bauschaumpistole mit einer Kartusche aus eigenartigem, leuchtend gelb durchzogenem Material. Der Schaum bewegt sich leicht, wenn du den Griff umfasst, als würde er deine Hand spüren.
items.wands.wandoflivingearth.stats_desc=Dieser Zauberstab schickt Pfeile aus magischem Stein auf Feinde und verursacht _%1$d-%2$d Schaden_. Die Steine  bauen sich um den Benutzer neu auf und gewähren ihm Schutz im Verhältnis zum verursachten Schaden. Hat sich ausreichend Rüstung geformt, formt sie sich zu einem Fels-Wächter, sobald der Stab das nächste Mal benutzt wird.
items.wands.wandoflivingearth.upgrade_stat_name_2=Wächter Max LP
items.wands.wandoflivingearth.upgrade_stat_name_3=Blockierung durch Wächter
items.wands.wandoflivingearth.bmage_desc=Wenn _der Hands-on-Gründer_ einen Gegner mit dem Bauschaum-Stick trifft, kehrt ein Teil des zugefügten Schadens als Steinrüstung zurück.
items.wands.wandoflivingearth.eleblast_desc=Eine Disruption mit einem Bauschaum-Stick verursacht 50% Schaden und heilt einen aktiven irdenen Wächter bei jedem getroffenen Gegner.
items.wands.wandoflivingearth$rockarmor.name=Bauschaumpanzer
items.wands.wandoflivingearth$rockarmor.desc=Magische Steine umgeben deinen Körper. Wirst du angegriffen, so werden sie versuchen, den Angriff für dich zu blocken; sie reduzieren den dir zugefügten Schaden um 50%%. Jeder abgewendete Schaden kratzt allerdings etwas an den Steinen.\n\nVerbleibende Rüstung: %1$d.\n\nWenn sich genügend Steine um dich herum aufgebaut haben, wird das nächste Mal, wenn du den Bauschaum-Sprüher benutzt, ein Wächter aus den Steinen erschaffen, der gemeinsam mit dir kämpft.\n\nFür den Wächter nötige Rüstung: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Dieser irdene Wächter profitiert auch von der Macht der Vielen. Verbleibende Züge: %d.
items.wands.wandoflivingearth$earthguardian.name=Bauschaum-Wächter
items.wands.wandoflivingearth$earthguardian.desc=Die Steine aus deinem Bauschaum-Sprüher haben sich in einen irdenen Wächter verwandelt! Dieser steinerne Wächter wird Feinde in der Nähe angreifen, was sie dazu zwingen wird, sich auf ihn anstatt auf dich zu konzentrieren. Sind alle Gefahren um dich herum beseitigt, wird er sich zurückverwandeln und wiederkehren, wenn du deinen Stab das nächste Mal benutzt.
items.wands.wandoflivingearth$earthguardian.wand_info=Die Verteidigungskraft des Wächters hängt von der Stufe deines Zauberstabs ab. Derzeit blockiert er _%1$d-%2$d Schaden._
items.wands.wandoflivingearth$earthguardian.discover_hint=Du kannst diesen Charakter mit einem bestimmten Zauberstab finden.

items.wands.wandofmagicmissile.name=Konfetti-Werfer
items.wands.wandofmagicmissile.staff_name=Konfetti-Stick
items.wands.wandofmagicmissile.desc=Dieser recht einfache Werfer verschießt Konfetti aus purer magischer Energie. Er hat selbst keine besonderen Effekte, verfügt jedoch über mehr Ladungen und kann kurzzeitig andere Zauberstäbe verstärken, wenn er verbessert wird.
items.wands.wandofmagicmissile.stats_desc=Jedes Geschoss dieses Zauberstabs richtet _%1$d–%2$d Schaden_ an. Er verstärkt kurzzeitig andere Stäbe, wenn er verbessert ist.
items.wands.wandofmagicmissile.bmage_desc=Wenn _der Hands-on-Gründer_ einen Gegner mit dem Konfetti-Stick trifft, erhalten alle seine Zauberstäbe zusätzlich zu seinem Stab eine Aufladung.
items.wands.wandofmagicmissile.eleblast_desc=Eine Disruption mit einem Konfetti-Stick verursacht 50% Schaden und gewährt dem Expat 15 Züge Zauberstabaufladung.
items.wands.wandofmagicmissile.discover_hint=Einer der Helden startet mit diesem Gegenstand.
items.wands.wandofmagicmissile$magiccharge.name=Konfetti-Ladung
items.wands.wandofmagicmissile$magiccharge.desc=Dein Konfetti-Werfer hat Kraft in deine Stäbe zurückgeführt und die Stufe des nächsten Schusses, den sie abfeuern, erhöht.\n\nDeine Stäbe wurden um %d Stufen erhöht.\n\nVerbleibende Züge mit magischer Ladung: %s.

items.wands.wandofprismaticlight.name=Discokugel-Stab
items.wands.wandofprismaticlight.staff_name=Disco-Stick
items.wands.wandofprismaticlight.desc=Eine kleine Discokugel auf einem Stab aus lichtdurchlässigem Kristall, übrig aus einem Club, der jetzt ein Bioladen ist. Bunte Lichtschimmer tanzen um die Spitze, begierig darauf, sich zu entfesseln.
items.wands.wandofprismaticlight.stats_desc=Dieser Zauberstab gibt einen Lichtstrahl frei, der durch die Dunkelheit der Tiefen schneidet und Geheimgänge und verborgene Haufen sichtbar macht. Dieser Lichtstrahl kann Feinde blenden und verursacht _%1$d-%2$d Schaden_. Dämonen und Untote gehen durch dieses Licht in Flammen auf und erleiden dadurch Zusatzschaden.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Chance auf Blendung
items.wands.wandofprismaticlight.upgrade_stat_name_3=Leuchtdauer
items.wands.wandofprismaticlight.bmage_desc=Wenn _der Hands-on-Gründer_ einen Gegner mit dem Disco-Stick trifft, wird er für eine Dauer, die sich mit Stufe des Stabs verlängert, verkrüppelt.
items.wands.wandofprismaticlight.eleblast_desc=Eine Disruption mit einem Disco-Stick verursacht 67% Schaden, enthüllt das Gelände im Schussbereich, und lässt Gegner für 5 Züge erblinden.

items.wands.wandofregrowth.name=Guerilla-Gartenschlauch
items.wands.wandofregrowth.staff_name=Gartenschlauch-Stick
items.wands.wandofregrowth.desc=Ein grüner Gartenschlauch, der ohne Wasseranschluss funktioniert. Er scheint lebendig zu sein und zu wachsen. Auf dem Aufkleber steht „Baumscheibe statt Parkplatz“, darunter hat jemand mit Edding geantwortet.
items.wands.wandofregrowth.stats_desc=Wenn dieser Zauberstab benutzt wird, schießt er magische Wachstumsenergie in einem Kegel nach außen, wodurch Gras, Wurzeln und seltene Pflanzen zum Leben erwachen. Sein nächster Angriff verbraucht _%1$d Ladungen_. Je mehr Ladungen der Zauberstab verbraucht, desto größer und stärker ist der Effekt.
items.wands.wandofregrowth.degradation=Nach weiteren _%d Aufladungen_ wird dieser Zauberstab keine Pflanzen und kein frisches Gras mehr zu produzieren. Diese Begrenzung wird durch das Erreichen neuer Stufen oder Verbesserung des Zauberstabs erhöht.
items.wands.wandofregrowth.upgrade_stat_name_1=Gras pro Ladung
items.wands.wandofregrowth.upgrade_stat_name_2=gesamtes Gras-Limit
items.wands.wandofregrowth.bmage_desc=Wenn _der Hands-on-Gründer_ einen Gegner mit einem Gartenschlauch-Stick trifft und jemand davon auf Gras steht, erhält er Kräuterheilung im Verhältnis zum zugefügten Schaden.
items.wands.wandofregrowth.eleblast_desc=Eine Disruption mit einem Gartenschlauch-Stick verwurzelt Gegner und lässt im Bereich des Schusses zufällig Gras wachsen.
items.wands.wandofregrowth$dewcatcher.name=Tropfenfänger
items.wands.wandofregrowth$dewcatcher.desc=Tropfenfänger sind wundersame Pflanzen, die sich mit magischen Biertropfen füllen. Sie versuchen, sich als Gras zu tarnen, um nicht aufzufallen, aber ihre prallen Knospen mit Kronkorken obendrauf verraten sie.
items.wands.wandofregrowth$dewcatcher.discover_hint=Du kannst diese Pflanze mit einem bestimmten Zauberstab finden.
items.wands.wandofregrowth$seedpod.name=Samenschote
items.wands.wandofregrowth$seedpod.desc=Samenschoten sind magische Pflanzen, die Samen anderer Pflanzen anstelle eigener produzieren. Irgendwie schaffen sie es, sich zu vermehren, obwohl sie keine eigenen Samen haben.
items.wands.wandofregrowth$seedpod.discover_hint=Du kannst diese Pflanze mit einem bestimmten Zauberstab finden.
items.wands.wandofregrowth$lotus.name=Goldener Lotus
items.wands.wandofregrowth$lotus.desc=Der goldene Lotus ist eine mystische Pflanze, die nur von einem mächtigen Guerilla-Gartenschlauch beschworen werden kann. Seine Aura verbessert alle Pflanzen und Pflanzen-Effekte, jedoch brennt er durch seine Energie und stirbt nach kurzer Zeit.
items.wands.wandofregrowth$lotus.wand_info=Dieser Lotus wurde durch einen _+%1$d_ Guerilla-Gartenschlauch hervorgebracht. Alle Pflanzen in seinem Einfluss werden _sofort auslösen_, wenn sie auf deinem Feld oder dem Feld eines Gegners gepflanzt werden. Die Pflanzen haben außerdem eine _%2$d%%-prozentige Wahrscheinlichkeit,_ ihre Samen fallen zu lassen, und präparierte Dartpfeile verbrauchen _%3$d%% weniger von ihrer Haltbarkeit_.
items.wands.wandofregrowth$lotus.discover_hint=Du kannst diese Pflanze mit einem bestimmten Zauberstab finden, nachdem du ihn mehrmals verbessert hast.

items.wands.wandoftransfusion.name=Free-Hugs-Schild
items.wands.wandoftransfusion.staff_name=Free-Hugs-Stick
items.wands.wandoftransfusion.ondeath=Du hast dich mit deinem eigenen Free-Hugs-Schild getötet... Zu viel Nähe.
items.wands.wandoftransfusion.charged=Dein Schild ist geladen mit der Lebensenergie deines Feindes!
items.wands.wandoftransfusion.desc=Ein handgemaltes Pappschild mit magentafarbener Schrift und einem pechschwarzen Edelstein in der Ecke. Wer es sieht, bekommt Lebensenergie oder eine Umarmung, ob er will oder nicht.
items.wands.wandoftransfusion.stats_desc=Auf Verbündete oder betörte Feinde angewandt, verzehrt dieser Zauberstab _%1$d der Lebensenergie des Anwenders_, um den Verbündeten um _%2$d Lebensenergie_ zu heilen oder abzuschirmen. Auf Feinde angewandt, betört er sie kurzzeitig und verleiht dem Anwender _%3$d Abschirmung_. Feindliche Untote erleiden _%4$d-%5$d Schaden_, anstatt verzaubert zu werden.
items.wands.wandoftransfusion.upgrade_stat_name_1=Verbündeten-Heilung
items.wands.wandoftransfusion.upgrade_stat_name_2=Selbstabschirmung
items.wands.wandoftransfusion.upgrade_stat_name_3=Schaden an Untoten
items.wands.wandoftransfusion.bmage_desc=Wenn _der Hands-on-Gründer_ einen verzauberten Gegner mit dem Free-Hugs-Stick trifft, erhält er einen Schild und der nächste Schuss mit dem Stab kostet keine Gesundheit.
items.wands.wandoftransfusion.eleblast_desc=Eine Disruption mit einem Free-Hugs-Stick betört Gegner, heilt Verbündete und verursacht 100% Schaden bei untoten Gegnern.

items.wands.wandofwarding.name=Überwachungsmast
items.wands.wandofwarding.staff_name=Überwachungs-Stick
items.wands.wandofwarding.no_more_wards=Dein Überwachungsmast kann keinen weiteren Wächter mehr versorgen.
items.wands.wandofwarding.bad_location=Hier kannst du keinen Wächter aufstellen.
items.wands.wandofwarding.desc=Ein kurzer Metallmast mit einem hellen, violetten Kameraobjektiv an der Spitze. Datenschutz ist hier unten eher eine Empfehlung.
items.wands.wandofwarding.stats_desc=Anstatt den Gegner direkt zu verletzen, wird dieser Zauberstab stationäre Wächter heraufbeschwören. Wächter können überall beschworen werden, sogar durch Wände hindurch, wenn du Sicht hast. Dieser Zauberstab hat genug Energie, um _%d Wächter_ auf einmal aufrechtzuerhalten.
items.wands.wandofwarding.upgrade_stat_name_1=Wächterschaden
items.wands.wandofwarding.upgrade_stat_name_2=Wächterenergie
items.wands.wandofwarding.bmage_desc=Wenn der Hands-on-Gründer einen Gegner mit dem Überwachungs-Stick trifft, haben alle aktiven Wächter und Schildwachen die Chance, geheilt zu werden.
items.wands.wandofwarding.eleblast_desc=Eine Disruption mit einem Überwachungs-Stick heilt alle Wächter und Schildwachen im Bereich des Einschlags.
items.wands.wandofwarding$ward.desc_generic_ward=Der Wächter wird jeden Gegner in Reichweite automatisch unter Beschuss nehmen.\n\nWird der Wächter mit deinem Überwachungsmast beschossen, wird er stärker.\n\nWächter haben eine begrenzte Zahl an Schüssen, bevor sie sich auflösen.
items.wands.wandofwarding$ward.desc_generic_sentry=Diese Schildwache hat dieselbe Feuerkraft wie ein Wächter, aber statt einer begrenzten Zahl an Schüssen hat sie Lebenspunkte. Sie ähnelt dem Stein auf der Spitze deines Überwachungsmasts.\n\nBeschießt du diese Schildwache mit deinem Überwachungsmast, so wird ihre Stufe erhöht und sie wird geheilt.\n\nDiese Schildwache wird jedes Mal etwas Gesundheit verlieren, wenn sie einen Gegner beschießt, sie kann aber geheilt werden, wenn du deinen Überwachungsmast auf sie richtest.
items.wands.wandofwarding$ward.name_1=kleiner Wächter
items.wands.wandofwarding$ward.desc_1=Der Standard-Wächter wird jeden Gegner in Sichtweite automatisch unter Beschuss nehmen und verursacht _%1$d–%2$d Schaden._\n\nWird der Wächter mit deinem Überwachungsmast beschossen, wird er stärker.\n\nDer Wächter wird nur einen Schuss abgeben, bevor er verschwindet.\n\nDein Überwachungsmast benötigt _%3$d Energiepunkte_, um den Wächter am Leben zu erhalten.
items.wands.wandofwarding$ward.name_2=Wächter
items.wands.wandofwarding$ward.desc_2=Dieser verbesserte Wächter besitzt eine komplexere Taktik und kann mehrfach angreifen. Jeder Schuss dieses Wächters verursacht _%1$d–%2$d Schaden._\n\nWird der Wächter mit deinem Überwachungsmast beschossen, so wird er stärker.\n\nDer Wächter wird dreimal schießen, bevor er verschwindet.\n\nDein Überwachungsmast benötigt _%3$d Energiepunkte_, um den Wächter am Leben zu erhalten.
items.wands.wandofwarding$ward.name_3=großer Wächter
items.wands.wandofwarding$ward.desc_3=Der voll ausgerüstete Wächter kann mehrmals und schneller angreifen als seine Vorgänger. Jeder Schuss dieses Wächters verursacht _%1$d–%2$d_ Schaden.\n\nWird der Wächter mit deinem Überwachungsmast beschossen, so wird er stärker.\n\nDer Wächter wird fünfmal schießen, bevor er verschwindet.\n\nDein Überwachungsmast benötigt _%3$d Energiepunkte_, um den Wächter am Leben zu erhalten.
items.wands.wandofwarding$ward.name_4=kleine Schildwache
items.wands.wandofwarding$ward.desc_4=Dieser kleine Wächter hat die gleiche Feuerkraft wie ein großer Wächter, aber besitzt Gesundheit anstelle einer Anzahl von Ladungen. Er ähnelt dem Edelstein an der Spitze deines Überwachungsmasts. Jeder Schuss von diesem Wächter verursacht _%1$d-%2$dSchaden._\n\nWenn du diesen Wächter mit deinem Überwachungsmast beschießt, wird er aufgewertet und geheilt.\n\nDein Überwachungsmast benutzt _%3$dEnergie_, um den Wächter zu erhalten.
items.wands.wandofwarding$ward.name_5=Schildwache
items.wands.wandofwarding$ward.desc_5=Diese verbesserte Schildwache ist größer und zäher als die schwache Schildwache. Jeder Schuss von dieser Wache verursacht _%1$d–%2$d Schaden._\n\nWird die Schildwache mit deinem Überwachungsmast beschossen, so wird sie stärker und geheilt.\n\nJeder Schuss der Schildwache zieht dieser Lebensenergie ab. Sie kann jedoch mit dem Überwachungsmast geheilt werden.\n\nDein Überwachungsmast benötigt _%3$d Energiepunkte_, um die Schildwache aufrechtzuerhalten.
items.wands.wandofwarding$ward.name_6=große Schildwache
items.wands.wandofwarding$ward.desc_6=Diese voll ausgerüstete Schildwache ist deutlich zäher als ihre Vorgänger. Jeder Schuss von dieser Wache verursacht _%1$d–%2$d Schaden._\n\nWird die Schildwache mit deinem Überwachungsmast beschossen, so wird sie geheilt.\n\nJeder Schuss der Schildwache zieht dieser Lebensenergie ab. Sie kann jedoch mit dem Überwachungsmast geheilt werden.\n\nDein Überwachungsmast benötigt _%3$d Energiepunkte_, um die Schildwache aufrechtzuerhalten.
items.wands.wandofwarding$ward.discover_hint=Du kannst diesen Charakter mit einem bestimmten Zauberstab finden.
items.wands.wandofwarding$ward.dismiss_title=Diesen Wächter entfernen?
items.wands.wandofwarding$ward.dismiss_body=Du kannst diesen Wächter entfernen, falls dein Zauberstab ihn nicht länger versorgen soll. Dies wird den Wächter sofort zerstören.\n\nWächter entfernen?
items.wands.wandofwarding$ward.dismiss_confirm=ja
items.wands.wandofwarding$ward.dismiss_cancel=nein

###weapon curses
items.weapon.curses.annoying.name=%s der Nerverei
items.weapon.curses.annoying.msg_1=OH, BEKÄMPFEN WIR ETWAS?
items.weapon.curses.annoying.msg_2=JA, HOL SIE DIR!
items.weapon.curses.annoying.msg_3=HEY, HÖR MIR ZU!
items.weapon.curses.annoying.msg_4=SIND WIR SCHON BEIM ENDGEGNER?
items.weapon.curses.annoying.msg_5=AUTSCH, SCHLAG NICHT SO FEST ZU!
items.weapon.curses.annoying.msg_6=STIRB, DU INSEKT!
items.weapon.curses.annoying.msg_7=HUIIIIIIIIIIIII!
items.weapon.curses.annoying.msg_8=KÖNNEN WIR KURZ PAUSE MACHEN!?
items.weapon.curses.annoying.msg_9=ZACK, HAHA!
items.weapon.curses.annoying.msg_10=GUTER SCHLAG!
items.weapon.curses.annoying.msg_11=Ich wollte keine Waffe, ich wollte einer Holzfälleraxt sein.
items.weapon.curses.annoying.msg_12=Denk daran, Selbstüberschätzung ist ein langsamer und heimtückischer Mörder.
items.weapon.curses.annoying.msg_13=ALL DEINE STÜTZPUNKT SIND GEHÖREN UNS!
items.weapon.curses.annoying.desc=Nervige Waffen können sprechen, aber sie sind etwas zu energisch. Sie werden oft die Aufmerksamkeit auf dich lenken, ohne, dass sie das eigentlich wollen.
items.weapon.curses.annoying.elestrike_desc=Ein Elementarschlag mit dem Fluch der Nerverei wird mit einer Wahrscheinlichkeit von 20% alle Gegner in Angriffsreichweite für 6 Züge wütend machen.

items.weapon.curses.dazzling.name=%s der Blendung
items.weapon.curses.dazzling.desc=Waffen der Blendung leuchten gelegentlich in einem grellen Blitz auf und blenden so alles und jeden, der sie sehen kann.
items.weapon.curses.dazzling.elestrike_desc=Ein Elementarschlag mit dem Fluch der Blendung wird mit einer Wahrscheinlichkeit von 50% alle Gegner in Angriffsreichweite für 6 Züge blenden.

items.weapon.curses.displacing.name=%s der Verdrängung
items.weapon.curses.displacing.desc=Waffen der Verdrängung wurden mit einer chaotischen Teleportationsmagie versehen. Sie besitzen die Fähigkeit, Gegner irgendwo auf diese Ebene zu teleportieren.
items.weapon.curses.displacing.elestrike_desc=Ein Elementarschlag mit dem Fluch der Verdrängung wird mit einer Wahrscheinlichkeit von 50% alle Gegner in Angriffsreichweite an einen anderen Ort teleportieren.

items.weapon.curses.explosive.name=Explosions-%s
items.weapon.curses.explosive.warm=Warm...
items.weapon.curses.explosive.hot=Heiß!
items.weapon.curses.explosive.desc=Explosive Waffen bauen ständig Ladung auf und explodieren alles in ihrer Nähe.
items.weapon.curses.explosive.desc_cool=Deine Waffe fühlt sich momentan kühl an.
items.weapon.curses.explosive.desc_warm=Deine Waffe baut Ladung auf und wird warm...
items.weapon.curses.explosive.desc_hot=Deine Waffe ist heiß! Sie wird gleich explodieren!
items.weapon.curses.explosive.elestrike_desc=Ein Elementarschlag mit dem explosiven Fluch wird mit einer Wahrscheinlichkeit von 50% eine Explosion bei einem zufälligen Gegner in Angriffsreichweite verursachen.

items.weapon.curses.friendly.name=%s der Freundlichkeit
items.weapon.curses.friendly.desc=Freundliche Waffen sind am besten für Pazifisten geeignet und lösen gelegentlich Magie aus, die es unmöglich macht zu kämpfen.
items.weapon.curses.friendly.elestrike_desc=Ein Elementarschlag mit einem Fluch der Freundlichkeit wird mit einer Wahrscheinlichkeit von 50% alle Gegner in Reichweite für 6 Züge betören.

items.weapon.curses.polarized.name=%s der Polarisation
items.weapon.curses.polarized.desc=Eine polarisierte Waffe steht unter dem Einfluss von Magie, die dazu führt, dass diese Waffe entweder 50% mehr oder gar keinen Schaden anrichtet.
items.weapon.curses.polarized.elestrike_desc=Ein Elementarschlag mit einem Fluch der Polarisation wird mit einer Wahrscheinlichkeit von 50% bei allen Gegnern in Reichweite 24-36 Schaden anrichten.

items.weapon.curses.pressurized.name=Rohrbruch-%s
items.weapon.curses.pressurized.desc=Rohrbruch-Waffen können einen gewaltigen Wassergeysir ausstoßen, der alles wegstößt, auch dich. Wie ein Altbau-Keller nach Starkregen.
items.weapon.curses.pressurized.elestrike_desc=Ein Elementarschlag mit dem Rohrbruch-Fluch erzeugt eine Wasserwelle, die Terrain zerstört und jeden Gegner in Reichweite zurückstößt.

items.weapon.curses.sacrificial.name=Opfer-%s
items.weapon.curses.sacrificial.desc=Opferwaffen dürstet es nach dem Blut ihres Trägers als Gegenleistung für den Angriff auf Feinde. Je gesünder der Träger ist, desto mehr Blut wird der Fluch verlangen.
items.weapon.curses.sacrificial.elestrike_desc=Ein Elementarschlag mit einem Opfer-Fluch wird am Helden und allen Gegnern in Reichweite 12 Punkte Blutungsschaden anrichten.

items.weapon.curses.wayward.name=%s der Launigkeit
items.weapon.curses.wayward.desc=Launische Waffen werden mitunter sehr ungenau. Diese Magie hält eine kurze Zeitlang an, wenn sie aktiviert wird, sie wird jedoch zerstreut, wenn man mit der launischen Waffe einen Treffer landet.
items.weapon.curses.wayward.elestrike_desc=Ein Elementarschlag mit einem Fluch der Launigkeit wird mit einer Wahrscheinlichkeit von 50% alle Gegner in Reichweite für 6 Züge verhexen.
items.weapon.curses.wayward$waywardbuff.name=launisch
items.weapon.curses.wayward$waywardbuff.desc=Die Magie deiner launischen Waffe wurde aktiviert, so dass sie eine kurze Zeit lang sehr ungenau ist. Dies betrifft aber keine Angriffe, deren Treffer garantiert ist, wie zum Beispiel Überraschungsangriffe. Ein erfolgreicher Angriff mit einer launischen Waffe wird diesen Effekt sofort zerstreuen.\n\nVerbleibende Züge: %s.

items.weapon.curses.wondrous.name=Wundertüten-%s
items.weapon.curses.wondrous.desc=Wundertüten-Waffen enthalten dieselbe chaotische Magie wie verfluchte Zauberstäbe. Niemand weiß, was passiert, wenn dieser Fluch ausgelöst wird!
items.weapon.curses.wondrous.elestrike_desc=Ein Elementarschlag mit dem Wundertüten-Fluch kann auf jeden Gegner in Reichweite einen anderen Effekt eines verfluchten Zauberstabs anwenden.

###enchantments
items.weapon.enchantments.blazing.name=Flammen-%s
items.weapon.enchantments.blazing.desc=Diese Verzauberung lässt Flammen aus einer Waffe züngeln, sodass Feinde in Flammen aufgehen; bereits brennende Feinde erleiden zusätzlichen Schaden.
items.weapon.enchantments.blazing.elestrike_desc=Ein Elementarschlag mit einer Flammen-Verzauberung entfacht auf allen Feldern in Reichweite Feuer, das 8 Züge lang brennt.

items.weapon.enchantments.blocking.name=%s der Abwehr
items.weapon.enchantments.blocking.desc=Abwehrende Waffen haben die Chance, dich kurz zu schützen, nachdem du mit ihnen angegriffen hast.
items.weapon.enchantments.blocking.elestrike_desc=Ein Elementarschlag mit einer Abwehrverzauberung gewährt der Zweikämpferin für jeden Gegner in Reichweite 6 Punkte Abschirmung.
items.weapon.enchantments.blocking$blockbuff.name=Abwehr
items.weapon.enchantments.blocking$blockbuff.desc=Die Abwehrverzauberung deiner Waffe hat kurzzeitig deine Defensivkräfte verstärkt!\n\nVerbleibende Abwehr: %d\n\nVerbleibende Züge: %s.

items.weapon.enchantments.blooming.name=%s der Blüte
items.weapon.enchantments.blooming.desc=Blühende Waffen enthalten Magie, die dazu führt, dass Vegetation an oder neben der Position des damit Geschlagenen zu sprießen beginnt.
items.weapon.enchantments.blooming.elestrike_desc=Ein Elementarschlag mit einer Verzauberung der Blüte wird auf bis zu 8 Feldern in Reichweite Gras wachsen lassen und dabei alle Gegner in Reichweite für 6 Züge verwurzeln.

items.weapon.enchantments.chilling.name=Frost-%s
items.weapon.enchantments.chilling.desc=Gegner, die mit dieser Verzauberung getroffen werden, werden unterkühlt, was ihre Bewegungen und Angriffe verlangsamt.
items.weapon.enchantments.chilling.elestrike_desc=Ein Elementarschlag mit einer Frost-Verzauberung verströmt eisige Luft auf allen Feldern in Reichweite, die dort 8 Züge lang verweilt.

items.weapon.enchantments.crystal.name=Kristall-%s
items.weapon.enchantments.crystal.alert_fixed=Deine Kristallwaffe ist vollständig repariert!
items.weapon.enchantments.crystal.alert_fixed_ghost=Die Kristallwaffe des Schwaben ist vollständig repariert!
items.weapon.enchantments.crystal.alert_noflaw=Deine Kristallwaffe ist nicht mehr beschädigt.
items.weapon.enchantments.crystal.alert_noflaw_ghost=Die Kristallwaffe des Schwaben ist nicht mehr beschädigt.
items.weapon.enchantments.crystal.alert_nocrack=Deine Kristallwaffe hat keine Risse mehr.
items.weapon.enchantments.crystal.alert_nocrack_ghost=Die Kristallwaffe des Schwaben hat keine Risse mehr.
items.weapon.enchantments.crystal.alert_flawed=Deine Kristallwaffe wurde leicht beschädigt.
items.weapon.enchantments.crystal.alert_flawed_ghost=Die Kristallwaffe des Schwaben wurde leicht beschädigt.
items.weapon.enchantments.crystal.alert_cracked=Deine Kristallwaffe bekommt Risse, sie bricht gleich!
items.weapon.enchantments.crystal.alert_cracked_ghost=Die Kristallwaffe des Schwaben bekommt Risse, sie bricht gleich!
items.weapon.enchantments.crystal.alert_shattered=Deine Kristallwaffe zerspringt in Stücke!
items.weapon.enchantments.crystal.alert_shattered_ghost=Die Kristallwaffe des Schwaben zerspringt in Stücke!
items.weapon.enchantments.crystal.desc=Diese mächtige Verzauberung verursacht zusätzlichen magischen Schaden und steigert den Wert einer Waffe. Die Waffe kann jedoch zerspringen, wenn die Kristalle nicht repariert werden oder keine Zeit zur Selbstreparatur bekommen.
items.weapon.enchantments.crystal.desc_thrown=Kristall-Wurfwaffen sind deutlich weniger haltbar, erholen sich aber langsam mit der Zeit.
items.weapon.enchantments.crystal.desc_perfect=Diese Kristallwaffe ist derzeit in perfektem Zustand.
items.weapon.enchantments.crystal.desc_fine=Diese Kristallwaffe ist derzeit in gutem Zustand.
items.weapon.enchantments.crystal.desc_flawed=Diese Kristallwaffe hat einen Makel, bricht aber noch nicht.
items.weapon.enchantments.crystal.desc_cracked=Diese Kristallwaffe hat Risse und droht, dauerhaft zu zerbrechen!
items.weapon.enchantments.crystal.elestrike_desc=Ein Elementarschlag mit der Kristall-Verzauberung verursacht 10-20 Schaden und repariert die Waffe für jeden Gegner in Reichweite außer dem Hauptziel.

items.weapon.enchantments.kinetic.name=%s der Kinetik
items.weapon.enchantments.kinetic.desc=Wenn ein Gegner mit einer kinetischen Waffe getötet wird, nimmt diese jede überschüssige Kraft auf und überträgt sie auf ihren nächsten erfolgreichen Angriff.
items.weapon.enchantments.kinetic.elestrike_desc=Ein Elementarschlag mit einer kinetischen Verzauberung fügt allen Gegnern in Reichweite, abgesehen vom eigentlichen Angriffsziel, 40% des aufgenommenen überschüssigen Schadens zu.
items.weapon.enchantments.kinetic$conserveddamage.name=konservierter Schaden
items.weapon.enchantments.kinetic$conserveddamage.desc=Deine Waffe hat überschüssige Kraft von vorherigen Tötungen gespeichert und fügt diese deinem nächsten Angriff als zusätzlichen Schaden zu. Jedoch wird diese Kraft langsam mit der Zeit verschwinden.\n\nKonservierter Schaden: %d.

items.weapon.enchantments.corrupting.name=%s der Korruption
items.weapon.enchantments.corrupting.desc=Diese mächtige Verzauberung besitzt die Fähigkeit, Feinde deinem Willen zu unterwerfen. Wird ein Feind mit dieser Waffe getötet, besteht die Chance, dass er korrumpiert wird, anstatt zu sterben.
items.weapon.enchantments.corrupting.elestrike_desc=Ein Elementarschlag mit einer Verzauberung der Korruption wird alle Gegner in Reichweite, abgesehen vom eigentlichen Angriffsziel, mit einer Wahrscheinlichkeit von 5-25% (abhängig von den fehlenden LP) korrumpieren.

items.weapon.enchantments.eldritch.name=Eldritch-%s
items.weapon.enchantments.eldritch.desc=Eldritch-Waffen versetzen nahe Gegner, die ihre Schläge sehen, in Angst, sodass sie vor dem Angreifer fliehen.
items.weapon.enchantments.eldritch.elestrike_desc=Ein Elementarschlag mit der Eldritch-Verzauberung versetzt jeden Gegner in Reichweite, einschließlich des Hauptziels, in verlängerte Angst.

items.weapon.enchantments.elastic.name=%s der Elastizität
items.weapon.enchantments.elastic.desc=Mit elastischen Waffen hat man eine Chance, Feinde über eine kurze Distanz zurückzuschleudern.
items.weapon.enchantments.elastic.elestrike_desc=Ein Elementarschlag mit einer Verzauberung der Elastizität schleudert alle Gegner in Reichweite 5 Felder weit zurück.

items.weapon.enchantments.grim.name=%s des Grauens
items.weapon.enchantments.grim.desc=Diese mächtige Verzauberung besitzt die Kraft, einen Gegner sofort zu exekutieren. Je schwächer der Gegner ist, desto wahrscheinlicher wird dieser sofort getötet.
items.weapon.enchantments.grim.elestrike_desc=Ein Elementarschlag mit einer Verzauberung des Grauens wird mit einer Wahrscheinlichkeit von 6-30% (abhängig von den fehlenden LP) alle Gegner in Reichweite, abgesehen vom eigentlichen Angriffsziel, töten.

items.weapon.enchantments.lucky.name=%s des Glücks
items.weapon.enchantments.lucky.desc=Feinde, die mit einer glücklichen Waffe getötet werden, hinterlassen möglicherweise zusätzliche Beute.
items.weapon.enchantments.lucky.elestrike_desc=Ein Elementarschlag mit einer Verzauberung des Glücks lässt mit einer Wahrscheinlichkeit von 12,5% unter allen Gegnern in Reichweite Beute erscheinen. Dieser Effekt kann bei jedem Gegner nur einmal ausgelöst werden.

items.weapon.enchantments.projecting.name=%s der Reichweite
items.weapon.enchantments.projecting.desc=Mit dieser Verzauberung werden Nahkampfwaffen eine größere Reichweite erhalten. Fernwaffen werden nahegelegene Wände durchdringen, wenn ein nahegelegenes Ziel anvisiert wird.
items.weapon.enchantments.projecting.elestrike_desc=Ein Elementarschlag mit einer Verzauberung der Projektion wird allen Gegnern in Reichweite, abgesehen vom eigentlichen Angriffsziel, 30% des Angriffsschadens zufügen.

items.weapon.enchantments.shocking.name=Schock-%s
items.weapon.enchantments.shocking.desc=Elekrizität geht von der verzauberten Waffe kontrolliert hervor, was zusätzlichen Schaden an alle Gegner in der Nähe anrichtet.
items.weapon.enchantments.shocking.elestrike_desc=Ein Elementarschlag mit einer Schock-Verzauberung generiert Elektrizität auf allen Feldern in Reichweite, die dann 8 Züge lang unter Spannung stehen.

items.weapon.enchantments.unstable.name=%s des Chaos
items.weapon.enchantments.unstable.desc=Diese Verzauberung sondert eine chaotische Energie ab und wird mit jedem Treffer als eine andere Verzauberung agieren.
items.weapon.enchantments.unstable.elestrike_desc=Ein Elementarschlag mit einer chaotischen Verzauberung fügt jedem Gegner in Reichweite, abgesehen vom eigentlichen Angriffsziel, den Effekt einer zufälligen Verzauberung zu.

items.weapon.enchantments.vampiric.name=%s des Vampirs
items.weapon.enchantments.vampiric.desc=Diese mächtige Verzauberung saugt mit jedem Treffer Lebensenergie aus den getroffenen Gegnern und gibt diese an den Träger der verzauberten Waffe weiter. Je weniger Lebenspunkte der Träger hat, desto stärker ist dieser Effekt.
items.weapon.enchantments.vampiric.elestrike_desc=Ein Elementarschlag mit einer Vampir-Verzauberung heilt die Zweikämpferin um 2,5 LP pro Gegner in Reichweite.

items.weapon.enchantments.venomous.name=%s des Giftes
items.weapon.enchantments.venomous.desc=Giftwaffen verursachen ein verzögertes, aber tödliches Gift, das mit jeder Anwendung stärker wird.
items.weapon.enchantments.venomous.elestrike_desc=Ein Elementarschlag mit der Gift-Verzauberung fügt jedem Gegner in Reichweite außer dem Hauptziel zusätzliches verzögertes Gift zu.

items.weapon.enchantments.vorpal.name=%s der Schärfe
items.weapon.enchantments.vorpal.desc=Waffen der Schärfe sind besonders tödlich: Sie können so sauber treffen, dass sie bei blutenden Gegnern Blutungen statt Schaden verursachen.
items.weapon.enchantments.vorpal.elestrike_desc=Ein Elementarschlag mit der Schärfe-Verzauberung fügt jedem Gegner in Reichweite außer dem Hauptziel zusätzliche Blutungen zu.


###melee weapons
items.weapon.melee.assassinsblade.name=Teppichmesser
items.weapon.melee.assassinsblade.stats_desc=Diese Waffe kann gegen ahnungslose Gegner besonders effektiv geführt werden.
items.weapon.melee.assassinsblade.ability_name=schleichen
items.weapon.melee.assassinsblade.typical_ability_desc=Die Zweikämpferin kann _schleichen_, wenn sie eine Attentäterklinge führt. Diese Fähigkeit gestattet es der Zweikämpferin, sofort bis zu 3 Felder weit zu springen und verleiht ihr im Schnitt _%d Züge Unsichtbarkeit_.
items.weapon.melee.assassinsblade.ability_desc=Die Zweikämpferin kann _schleichen_, wenn sie eine Attentäterklinge führt. Diese Fähigkeit gestattet es der Zweikämpferin, sofort bis zu 3 Felder weit zu springen und verleiht ihr _%d Züge Unsichtbarkeit_.
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Dauer der Fähigkeit
items.weapon.melee.assassinsblade.desc=Ein kleines Teppichmesser mit abbrechbarer Klinge, gefunden in einem Baustellen-Eimer. Die Klinge ist sehr leicht, aber schwer zu führen. In den richtigen Händen ist es tödlich.

items.weapon.melee.battleaxe.name=Feuerwehraxt
items.weapon.melee.battleaxe.stats_desc=Diese Waffe ermöglicht präzise Angriffe.
items.weapon.melee.battleaxe.ability_name=schwerer Hieb
items.weapon.melee.battleaxe.typical_ability_desc=Die Zweikämpferin kann mit der Streitaxt einen _schweren Hieb_ ausführen. Dieser wuchtige Schlag verursacht üblicherweise _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und macht ihn 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, verursacht aber normalen Schaden, wenn er den Gegner nicht überrascht.
items.weapon.melee.battleaxe.ability_desc=Die Zweikämpferin kann mit der Streitaxt einen _schweren Hieb_ ausführen. Dieser wuchtige Schlag verursacht _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und macht ihn 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, fügt aber nur normalen Schaden zu, wenn der Gegner damit nicht überrascht wird.
items.weapon.melee.battleaxe.desc=Der enorme Stahlkopf dieser Feuerwehraxt aus einem entkernten Treppenhaus bringt beachtliche Wucht in jeden Schlag.

items.weapon.melee.crossbow.name=Sperrmüll-Armbrust
items.weapon.melee.crossbow.typical_stats_desc=Normalerweise verbessert diese Waffe Dartpfeile, so dass diese _%1$d-%2$d Schaden_ zufügen, wenn sie ausgerüstet ist, und sie verleiht ihnen sogar ihre Verzauberung.
items.weapon.melee.crossbow.stats_desc=Diese Waffe verstärkt, wenn ausgerüstet, Dartpfeile so, dass diese _%1$d-%2$d_ Schaden verursachen, und verleiht ihnen sogar ihre Verzauberung.
items.weapon.melee.crossbow.ability_name=geladener Schuss
items.weapon.melee.crossbow.typical_ability_desc=Die Zweikämpferin kann ihre Armbrust _aufladen_, wodurch ihr nächster normaler Angriff damit immer trifft und einen von drei Effekten ausführt: Nahkampfangriffe stoßen Feinde weg, nicht präparierte Pfeile verursachen normalerweise _+%1$d Schaden_, präparierte Pfeile lösen ihre Wirkung in einem 7x7-Bereich aus und halten normalerweise für _%2$d nochmalige Anwendungen_.
items.weapon.melee.crossbow.ability_desc=Die Zweikämpferin kann ihre Armbrust _aufladen_, wodurch ihr nächster normaler Angriff damit immer trifft und einen von drei Effekten ausführt: Nahkampfangriffe stoßen Feinde weg, nicht präparierte Pfeile verursachen _+%1$d Schaden_ und präparierte Pfeile lösen ihren Effekt in einem 7x7-Bereich aus und halten für _%2$d weitere Anwendungen_.
items.weapon.melee.crossbow.desc=Eine etwas komplizierte Konstruktion aus Bettrost und Expander, die Bolzen mit außergewöhnlicher Geschwindigkeit verschießt. Dank ihrer schweren, kräftigen Bauweise taugt sie durchaus auch für den Nahkampf.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Fähigkeitsschub
items.weapon.melee.crossbow$chargedshot.name=aufgeladen
items.weapon.melee.crossbow$chargedshot.desc=Die Zweikämpferin konzentriert ihre Kraft auf ihre Armbrust. Der nächste Angriff, den sie damit ausführt, wird immer treffen und einen von drei Effekten auslösen:\n- Nahkampfangriffe werden Feinde ein paar Felder weit wegstoßen.\n- nicht präparierte Pfeile verursachen Bonusschaden.\n- Präparierte Pfeile erhalten zusätzliche Nutzungen und entfalten ihre Wirkung in einem 7x7-Bereich. Positive Pfeileffekte wirken sich nur auf Verbündete aus, schädliche Effekte wirken sich nur auf Feinde aus. Die Zweikämpferin kann diese Fähigkeit nicht nutzen, um positive Pfeileffekte auf sich selbst auszuüben.

items.weapon.melee.cudgel.name=Nudelholz
items.weapon.melee.cudgel.stats_desc=Diese Waffe ermöglicht präzise Angriffe.
items.weapon.melee.cudgel.ability_name=schwerer Hieb
items.weapon.melee.cudgel.typical_ability_desc=Die Zweikämpferin kann mit dem Totschläger einen _schweren Hieb_ ausführen. Dieser konzentrierte Schlag verursacht üblicherweise _%1$d-%2$d Schaden_, wenn er den Feind überrascht, und macht ihn 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, fügt aber nur normalen Schaden zu, wenn der Gegner damit nicht überrascht wird.
items.weapon.melee.cudgel.ability_desc=Die Zweikämpferin kann mit dem Totschläger einen _schweren Hieb_ ausführen. Dieser konzentrierte Schlag verursacht _%1$d-%2$d Schaden_, wenn er den Feind überrascht, und macht ihn 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, fügt aber nur normalen Schaden zu, wenn der Gegner damit nicht überrascht wird.
items.weapon.melee.cudgel.desc=Ein kleines Nudelholz aus Omas Küche, eher zur Selbstverteidigung gedacht...
items.weapon.melee.cudgel.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.melee.dagger.name=Taschenmesser
items.weapon.melee.dagger.stats_desc=Diese Waffe ist gegen ahnungslose Gegner wirksamer.
items.weapon.melee.dagger.ability_name=schleichen
items.weapon.melee.dagger.typical_ability_desc=Die Zweikämpferin kann _schleichen_, wenn sie ein Taschenmesser führt. Diese Fähigkeit gestattet es der Zweikämpferin, sofort bis zu 5 Felder weit zu springen und verleiht ihr üblicherweise _%d Züge Unsichtbarkeit_.
items.weapon.melee.dagger.ability_desc=Die Zweikämpferin kann _schleichen_, wenn sie ein Taschenmesser führt. Diese Fähigkeit gestattet es der Zweikämpferin, sofort bis zu 5 Felder weit zu springen und verleiht ihr _%d Züge Unsichtbarkeit_.
items.weapon.melee.dagger.upgrade_ability_stat_name=Dauer der Fähigkeit
items.weapon.melee.dagger.desc=Ein einfaches Taschenmesser mit Flaschenöffner und abgenutztem Griff.
items.weapon.melee.dagger.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.melee.dirk.name=Brotmesser
items.weapon.melee.dirk.stats_desc=Diese Waffe kann gegen ahnungslose Gegner effektiv geführt werden.
items.weapon.melee.dirk.ability_name=schleichen
items.weapon.melee.dirk.typical_ability_desc=Die Zweikämpferin kann _schleichen_, wenn sie einen Langdolch führt. Diese Fähigkeit gestattet es der Zweikämpferin, sofort bis zu 4 Felder weit zu springen und verleiht ihr üblicherweise _%d Züge Unsichtbarkeit_.
items.weapon.melee.dirk.ability_desc=Die Zweikämpferin kann _schleichen_, wenn sie einen Langdolch führt. Diese Fähigkeit gestattet es der Zweikämpferin, sofort bis zu 4 Felder weit zu springen und verleiht ihr _%d Züge Unsichtbarkeit_.
items.weapon.melee.dirk.upgrade_ability_stat_name=Dauer der Fähigkeit
items.weapon.melee.dirk.desc=Ein langes Brotmesser mit Wellenschliff. Etwas mehr Stahl, den man in Gegner versenken kann, und ideal für Sauerteig.

items.weapon.melee.flail.name=Fahrradschloss-Kette
items.weapon.melee.flail.stats_desc=Dies ist eine eher ungenaue Waffe.\nDiese Waffe kann nicht für Überraschungsangriffe genutzt werden.
items.weapon.melee.flail.ability_name=schwingen
items.weapon.melee.flail.spin_warn=Du kannst den Flegel nicht mehr schwingen.
items.weapon.melee.flail.typical_ability_desc=Die Zweikämpferin kann einen Flegel _schwingen_, um kurzzeitig Kraft aufzubauen. Jeder Zug, in der die Flegel gedreht wird, verursacht bei ihrem nächsten regulären Angriff normalerweise _+%d Schaden_, höchstens 3 Mal. Ein sich drehender Flegel trifft garantiert. Nur der erste Schwung kostet eine Ladung.
items.weapon.melee.flail.ability_desc=Die Zweikämpferin kann einen Flegel _schwingen_, um damit kurzzeitig Kraft aufzubauen. Jeder Zug, in dem der Flegel geschwungen wird, verursacht bei seinem nächsten normalen Angriff _+%d Schaden_ bis zu maximal 3 Zügen. Ein schwingender Flegel trifft außerdem garantiert. Nur der erste Schwung kostet eine Ladung.
items.weapon.melee.flail.desc=Ein schweres Kettenschloss mit Vorhängeschloss am Ende, das länger überlebt hat als jedes Fahrrad, an das es je gekettet war. Sehr unhandlich, richtet bei einem direkten Treffer aber verheerenden Schaden an.
items.weapon.melee.flail$spinabilitytracker.name=schwingend
items.weapon.melee.flail$spinabilitytracker.desc=Die Zweikämpferin schwingt ihren Flegel und baut so für ihren nächsten regulären Angriff Schaden auf. Jeder Schwung benötigt einen Zug, erhöht aber den Schaden, bis zu maximal drei Drehungen. Ein geschwungener Flegel trifft außerdem garantiert.\n\nAktive Drehungen: %1$d%%.\nVerbleibende Züge: %2$s.

items.weapon.melee.gauntlet.name=Beton-Fäustling
items.weapon.melee.gauntlet.stats_desc=Diese Waffe ermöglicht sehr schnelle Angriffe.
items.weapon.melee.gauntlet.ability_name=Kombi-Angriff
items.weapon.melee.gauntlet.typical_ability_desc=Die Zweikämpferin kann mit einem Beton-Fäustling einen _Kombo-Schlag_ ausführen. Dieser Angriff trifft garantiert und verursacht üblicherweise _+%d Schaden_ für jeden Treffer, den die Zweikämpferin mit einem regulären Nahkampf- oder Wurfwaffenangriff gelandet hat. Trifft sie 5 Züge lang nicht (15 nach einem Kill), wird die Kombo zurückgesetzt.
items.weapon.melee.gauntlet.ability_desc=Die Zweikämpferin kann mit einem Beton-Fäustling einen _Kombo-Schlag_ ausführen. Dieser Angriff trifft garantiert und verursacht _+%d Schaden_ für jeden Treffer, den die Zweikämpferin mit einem regulären Nahkampf- oder Wurfwaffenangriff gelandet hat. Trifft sie 5 Züge lang nicht (15 nach einem Kill), wird die Kombo zurückgesetzt.
items.weapon.melee.gauntlet.desc=Dieser massive Arbeitshandschuh ist aus karminrotem Material gefertigt, mit schweren, magischen Betonbrocken darauf. Das Material zieht sich um deine Hand zusammen, bis die Platte fast eine zweite Haut ist. Eine so schwere Waffe zu schwingen erfordert viel Stärke, bringt aber enorme Wucht in deine Schläge.

items.weapon.melee.glaive.name=Schneeschieber
items.weapon.melee.glaive.stats_desc=Dies ist eine eher langsame Waffe.\nDiese Waffe hat eine erhöhte Reichweite.
items.weapon.melee.glaive.ability_name=aufspießen
items.weapon.melee.glaive.typical_ability_desc=Die Zweikämpferin kann die Spitze einer Glefe dazu benutzen, einen Gegner in Reichweite _aufzuspießen_, sofern er nicht auf einem benachbarten Feld steht. Dies fügt üblicherweise _%1$d-%2$d_ Schaden zu, wirft den Gegner zurück und trifft garantiert.
items.weapon.melee.glaive.ability_desc=Die Zweikämpferin kann die Spitze einer Glefe dazu benutzen, einen Gegner in Reichweite _aufzuspießen_, sofern er nicht auf einem benachbarten Feld steht. Dies fügt _%1$d-%2$d_ Schaden zu, wirft den Gegner zurück und trifft garantiert.
items.weapon.melee.glaive.desc=Ein Schneeschieber mit geschärfter Kante an einer langen Stange. Endlich im Einsatz.

items.weapon.melee.gloves.name=Spülhandschuhe
items.weapon.melee.gloves.stats_desc=Diese Waffe ermöglicht sehr schnelle Angriffe.
items.weapon.melee.gloves.ability_name=Kombi-Angriff
items.weapon.melee.gloves.typical_ability_desc=Die Zweikämpferin kann mit Spülhandschuhen einen _Kombo-Schlag_ ausführen. Dieser Angriff trifft garantiert und verursacht üblicherweise _+%d Schaden_ für jeden Treffer, den die Zweikämpferin mit einem regulären Nahkampf- oder Wurfwaffenangriff gelandet hat. Trifft sie 5 Züge lang nicht (15 nach einem Kill), wird die Kombo zurückgesetzt.
items.weapon.melee.gloves.ability_desc=Die Zweikämpferin kann mit Spülhandschuhen einen _Kombo-Schlag_ ausführen. Dieser Angriff trifft garantiert und verursacht _+%d Schaden_ für jeden Treffer, den die Zweikämpferin mit einem regulären Nahkampf- oder Wurfwaffenangriff gelandet hat. Trifft sie 5 Züge lang nicht (15 nach einem Kill), wird die Kombo zurückgesetzt.
items.weapon.melee.gloves.desc=Diese gelben Spülhandschuhe aus der WG-Küche bieten keinen Schutz, dienen aber als einsatzbereite Waffe, die die Hände frei lässt. Der Abwasch bleibt trotzdem liegen.
items.weapon.melee.gloves.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.melee.greataxe.name=Holzspalter-Axt
items.weapon.melee.greataxe.stats_desc=Diese Waffe ist unglaublich schwer.
items.weapon.melee.greataxe.ability_name=Vergeltung
items.weapon.melee.greataxe.typical_ability_desc=Die Zweikämpferin kann mit ihrer Großaxt einen _Vergeltungsangriff_ ausführen, wenn sie weniger als 50%% Lebenspunkte hat. Dieser verheerende Angriff fügt üblicherweise _%1$d-%2$d Schaden_ zu, trifft garantiert und passiert augenblicklich, wenn dadurch ein Gegner getötet wird.
items.weapon.melee.greataxe.ability_desc=Die Zweikämpferin kann mit ihrer Großaxt einen _Vergeltungsangriff_ ausführen, wenn sie weniger als 50%% Lebenspunkte hat. Dieser verheerende Angriff fügt _%1$d-%2$d Schaden_ zu, trifft garantiert und passiert augenblicklich, wenn dadurch ein Gegner getötet wird.
items.weapon.melee.greataxe.desc=Gedacht, um auf der Schulter getragen zu werden, wie auf dem Weg zum Kaminofen im Loft. Diese gigantische Axt ist ebenso mächtig wie schwer.

items.weapon.melee.greatshield.name=Kundenstopper
items.weapon.melee.greatshield.typical_stats_desc=Diese Waffe wehrt typischerweise 0-%d Schaden ab. Die Abwehrkraft steigt mit den Aufwertungen der Waffe.
items.weapon.melee.greatshield.stats_desc=Diese Waffe wehrt 0–%d Schaden ab. Die Abwehrkraft steigt mit den Aufwertungen der Waffe.
items.weapon.melee.greatshield.ability_name=schützen
items.weapon.melee.greatshield.typical_ability_desc=Die Zweikämpferin kann sich mit ihrem Großschild _schützen_ und so innerhalb von üblicherweise _%d Zügen_ alle gegen sie geführten physischen oder magischen Angriffe vollständig negieren. Nachdem die Zweikämpferin einen Angriff abgeblockt hat, beendet ein Gegenangriff oder die Anwendung von Magie diesen Schutz vorzeitig.
items.weapon.melee.greatshield.ability_desc=Die Zweikämpferin kann sich mit ihrem Großschild _schützen_ und so innerhalb von _%d Zügen_ alle gegen sie geführten physischen oder magischen Angriffe vollständig negieren. Nachdem die Zweikämpferin so einen Angriff abgeblockt hat, beendet ein Gegenangriff oder die Anwendung von Magie diesen Schutz vorzeitig.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Dauer der Fähigkeit
items.weapon.melee.greatshield.desc=Dieser gigantische Aufsteller vor einem Café ist eher eine mobile Wand als ein Schild. "Heute: Hafer-Flat-White 5,90". Er hilft bei der Verteidigung, lässt aber wenig Spielraum zum Angreifen.

items.weapon.melee.greatsword.name=Rotorblatt
items.weapon.melee.greatsword.ability_name=aufschlitzen
items.weapon.melee.greatsword.typical_ability_desc=Die Zweikämpferin kann mit ihrem Großschwert einen Gegner _aufschlitzen_. Dies fügt üblicherweise _%1$d-%2$d Schaden_ zu und trifft garantiert. Wenn ein Gegner durch Aufschlitzen getötet wird, geschieht es augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.greatsword.ability_desc=Die Zweikämpferin kann mit ihrem Großschwert einen Gegner _aufschlitzen_. Dies fügt _%1$d-%2$d Schaden_ zu und trifft garantiert. Wenn ein Gegner durch Aufschlitzen getötet wird, geschieht es augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.greatsword.desc=Das abgebrochene Blatt eines Windrads, niemand weiß, wie es hier runterkam. Es richtet aufgrund der Wucht jedes Hiebes hohen Schaden an.

items.weapon.melee.handaxe.name=Hackebeil
items.weapon.melee.handaxe.stats_desc=Diese Waffe ermöglicht präzise Angriffe.
items.weapon.melee.handaxe.ability_name=schwerer Hieb
items.weapon.melee.handaxe.typical_ability_desc=Die Zweikämpferin kann mit der Handaxt einen _schweren Hieb_ ausführen. Dieser wuchtige Schlag verursacht üblicherweise _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und macht das Ziel 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, verursacht aber nur normalen Schaden, wenn der Gegner dadurch nicht überrascht wird.
items.weapon.melee.handaxe.ability_desc=Die Zweikämpferin kann mit der Handaxt einen _schweren Hieb_ ausführen. Dieser wuchtige Schlag verursacht _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und macht das Ziel 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, verursacht aber nur normalen Schaden, wenn der Gegner dadurch nicht überrascht wird.
items.weapon.melee.handaxe.desc=Ein leichtes Hackebeil aus einer Imbissküche. Zweckentfremdet funktioniert die breite Klinge auch gut gegen Feinde.

items.weapon.melee.katana.name=Deko-Katana
items.weapon.melee.katana.stats_desc=Diese Waffe wehrt 0-3 Schaden ab.
items.weapon.melee.katana.ability_name=stürzen
items.weapon.melee.katana.typical_ability_desc=Die Zweikämpferin kann sich mit einem Katana auf einen Gegner _stürzen_, der sich 1 Feld entfernt befindet. Dadurch bewegt sie sich auf den Gegner zu, fügt üblicherweise _%1$d-%2$d Schaden_ zu und trifft garantiert.
items.weapon.melee.katana.ability_desc=Die Zweikämpferin kann sich mit einem Katana auf einen Gegner _stürzen_, der sich 1 Feld entfernt befindet. Dadurch bewegt sie sich auf den Gegner zu, fügt _%1$d-%2$d Schaden_ zu und trifft garantiert.
items.weapon.melee.katana.desc=Ein schlankes Schwert mit breiter Parierstange. Hing jahrelang über einem WG-Sofa.

items.weapon.melee.longsword.name=Zaunlatte
items.weapon.melee.longsword.ability_name=aufschlitzen
items.weapon.melee.longsword.typical_ability_desc=Die Zweikämpferin kann mit ihrem Langschwert einen Gegner _aufschlitzen_. Dies fügt üblicherweise _%1$d-%2$d Schaden_ zu und trifft garantiert. Wenn ein Gegner durch Aufschlitzen getötet wird, geschieht es augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.longsword.ability_desc=Die Zweikämpferin kann mit einem Langschwert einen Gegner _aufschlitzen_. Dies fügt _%1$d-%2$d Schaden_ zu und trifft garantiert. Wenn ein Gegner durch Aufschlitzen getötet wird, geschieht es augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.longsword.desc=Eine lange, stabile Latte aus einem Bauzaun, an den Kanten scharf abgesplittert. Sie liegt beruhigend in der Hand, ist wegen ihrer Länge aber recht schwer.

items.weapon.melee.mace.name=Fleischklopfer
items.weapon.melee.mace.stats_desc=Diese Waffe ermöglicht präzise Angriffe.
items.weapon.melee.mace.ability_name=schwerer Hieb
items.weapon.melee.mace.typical_ability_desc=Die Zweikämpferin kann mit dem Streitkolben einen _schweren Hieb_ ausführen. Dieser wuchtige Schlag verursacht üblicherweise _%1$d-%2$d Schaden_ und macht das Ziel 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, fügt aber nur normalen Schaden zu, wenn der Gegner damit nicht überrascht wird.
items.weapon.melee.mace.ability_desc=Die Zweikämpferin kann mit dem Streitkolben einen _schweren Hieb_ ausführen. Dieser wuchtige Schlag verursacht _%1$d-%2$d Schaden_ und macht das Ziel 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, fügt aber nur normalen Schaden zu, wenn der Gegner damit nicht überrascht wird.
items.weapon.melee.mace.desc=Der große Metallkopf dieses Fleischklopfers richtet beträchtlichen Schaden an. Schnitzel-Energie.

items.weapon.melee.magesstaff.name=Magischer Selfie-Stick
items.weapon.melee.magesstaff.ac_imbue=VERSCHMELZEN
items.weapon.melee.magesstaff.ac_zap=FEUERN
items.weapon.melee.magesstaff.prompt=Wähle einen Zauberstab zum Verschmelzen
items.weapon.melee.magesstaff.imbue=Du hast deinen Selfie-Stick mit dem %s verschmolzen.
items.weapon.melee.magesstaff.preserved=Der vorherige Zauberstab blieb erhalten!
items.weapon.melee.magesstaff.imbue_desc=Bist du dir sicher, dass du deinen Selfie-Stick mit diesem Zauberstab verschmelzen möchtest?\n\nWenn der Zauberstab die gleiche oder eine höhere Stufe hat, erhält der Selfie-Stick die Stufe des Zauberstabs und eine einzelne seiner eigenen Verbesserungen.
items.weapon.melee.magesstaff.imbue_level=Diese Verschmelzung wird einen _+%d Selfie-Stick_ erzeugen.
items.weapon.melee.magesstaff.imbue_unknown=Du kennst die Stufe dieses Zauberstabs nicht, aber diese Verschmelzung wird zumindest einen _+%d Selfie-Stick_ erzeugen.
items.weapon.melee.magesstaff.imbue_cursed=_Wenn du mit einem verfluchten Zauberstab verschmilzt, wird dein Selfie-Stick ebenfalls verflucht!_
items.weapon.melee.magesstaff.imbue_lost=Der Zauberstab, der derzeit mit deinem Selfie-Stick verschmolzen ist, _geht verloren_.
items.weapon.melee.magesstaff.imbue_talent=Der Zauberstab, der derzeit mit deinem Selfie-Stick verschmolzen ist, _wird mit +0 zurückkommen_.
items.weapon.melee.magesstaff.yes=Ja, ich bin mir sicher.
items.weapon.melee.magesstaff.no=Nein, lieber doch nicht...
items.weapon.melee.magesstaff.desc=Der Expat hat diesen Selfie-Stick selbst "customized" und nennt ihn sein "personal branding tool". Eine einzigartige magische Waffe, die mit einem Zauberstab verschmolzen werden kann.
items.weapon.melee.magesstaff.no_wand=In diesem Selfie-Stick ruht aktuell keine Magie. Zuerst muss er _mit der Kraft eines Zauberstabs verschmolzen werden,_ damit er Zauber wirken kann.
items.weapon.melee.magesstaff.has_wand=Der Selfie-Stick ist derzeit mit einem _%s_ verschmolzen.
items.weapon.melee.magesstaff.cursed_wand=Dieser Selfie-Stick ist verflucht, was seine Magie chaotisch und zufällig macht.
items.weapon.melee.magesstaff.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.melee.meleeweapon.ac_ability=FÄHIGKEIT
items.weapon.melee.meleeweapon.stats_known=Diese Nahkampfwaffe der _Stufe %1$d_ richtet _%2$d-%3$d Schaden_ an und benötigt eine _Stärke von %4$d,_ um die Waffe ohne Abzüge verwenden zu können.
items.weapon.melee.meleeweapon.stats_unknown=Diese Nahkampfwaffe der _Stufe %1$d_ richtet gewöhnlich _%2$d-%3$d Schaden_ an und benötigt eine _Stärke von %4$d,_ um die Waffe ohne Abzüge verwenden zu können.
items.weapon.melee.meleeweapon.probably_too_heavy=Wahrscheinlich ist diese Waffe zu schwer für dich.
items.weapon.melee.meleeweapon.stats_desc=
items.weapon.melee.meleeweapon.ability_need_equip=Du musst diese Waffe ausrüsten, um ihre Fähigkeit nutzen zu können.
items.weapon.melee.meleeweapon.ability_low_str=Du bist nicht stark genug, um die Fähigkeit dieser Waffe zu nutzen.
items.weapon.melee.meleeweapon.ability_no_charge=Du hast nicht genügend Energie, um diese Fähigkeit zu nutzen.
items.weapon.melee.meleeweapon.ability_cant_use=Du kannst diese Fähigkeit jetzt nicht nutzen.
items.weapon.melee.meleeweapon.ability_no_target=Es ist kein Ziel da.
items.weapon.melee.meleeweapon.ability_target_range=Dieses Ziel befindet sich nicht in Reichweite.
items.weapon.melee.meleeweapon.ability_occupied=Dieser Ort ist bereits besetzt.
items.weapon.melee.meleeweapon.upgrade_ability_stat_name=Fähigkeitsschaden
items.weapon.melee.meleeweapon.prompt=Wähle ein Ziel
items.weapon.melee.meleeweapon.swap=Waffen tauschen
items.weapon.melee.meleeweapon.swap_full=Du kannst das mit einem vollen Inventar nicht tun.


items.weapon.melee.shortsword.name=Gardinenstange
items.weapon.melee.shortsword.ability_name=aufschlitzen
items.weapon.melee.shortsword.typical_ability_desc=Die Zweikämpferin kann mit ihrer Gardinenstange einen Gegner _aufschlitzen_. Dies fügt üblicherweise _%1$d-%2$d Schaden_ zu und trifft garantiert. Wenn ein Gegner durch Aufschlitzen getötet wird, geschieht es augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.shortsword.ability_desc=Die Zweikämpferin kann mit ihrer Gardinenstange einen Gegner _aufschlitzen_. Dies fügt _%1$d-%2$d Schaden_ zu und trifft garantiert.  Wenn ein Gegner durch Aufschlitzen getötet wird, geschieht es augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.shortsword.desc=Eine kurze, massive Gardinenstange aus Messing, nur wenig länger als ein Messer.

items.weapon.melee.quarterstaff.name=Besenstiel
items.weapon.melee.quarterstaff.stats_desc=Diese Waffe blockt 0-2 Schaden.
items.weapon.melee.quarterstaff.ability_name=Verteidigungshaltung
items.weapon.melee.quarterstaff.typical_ability_desc=Die Zweikämpferin kann mit einem Kampfstab eine _Verteidigungshaltung_ einnehmen. Diese Haltung benötigt keine Aktivierungszeit und verdreifacht das Ausweichen für üblicherweise _%d Züge_.
items.weapon.melee.quarterstaff.ability_desc=Die Zweikämpferin kann mit einem Kampfstab eine _Verteidigungshaltung_ einnehmen. Diese Haltung benötigt keine Aktivierungszeit und verdreifacht das Ausweichen für _%d Züge_.
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=Dauer der Fähigkeit
items.weapon.melee.quarterstaff.desc=Ein Besenstiel aus Hartholz, an den Enden mit Metall beschlagen. Der Hof wird ohnehin nie gefegt.
items.weapon.melee.quarterstaff$defensivestance.name=Verteidigungshaltung
items.weapon.melee.quarterstaff$defensivestance.desc=Die Zweikämpferin benutzt ihren Kampfstab dazu, eingehende Schläge und Projektile abzuwehren. Solange sie in dieser Haltung verbleibt, ist es dreimal so wahrscheinlich, dass sie einem beliebigen Angriff ausweichen kann.\n\nVerbleibende Züge: %s.

items.weapon.melee.rapier.name=Stockschirm
items.weapon.melee.rapier.stats_desc=Diese Waffe blockt 0-1 Schadenspunkte.
items.weapon.melee.rapier.ability_name=stürzen
items.weapon.melee.rapier.typical_ability_desc=Die Zweikämpferin kann sich mit einem Rapier auf einen Gegner _stürzen_, der sich 1 Feld entfernt befindet. Dadurch bewegt sie sich auf den Gegner zu, fügt üblicherweise _%1$d-%2$d Schaden_ zu und trifft garantiert.
items.weapon.melee.rapier.ability_desc=Die Zweikämpferin kann sich mit einem Rapier auf einen Gegner _stürzen_, der sich 1 Feld entfernt befindet. Dadurch bewegt sie sich auf den Gegner zu, fügt _%1$d-%2$d Schaden_ zu und trifft garantiert.
items.weapon.melee.rapier.desc=Ein schmaler, stabiler Regenschirm mit Metallspitze. Er bietet etwas Schutz, eignet sich aber weniger zum Aufschlitzen der Gegner. Wird nie geöffnet, das bringt Unglück.
items.weapon.melee.rapier.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.melee.roundshield.name=Mülltonnendeckel
items.weapon.melee.roundshield.typical_stats_desc=Diese Waffe wehrt üblicherweise 0–%d Schaden ab. Diese Abwehr steigt mit der Aufwertung der Waffe.
items.weapon.melee.roundshield.stats_desc=Diese Waffe wehrt 0–%d Schaden ab. Die Abwehrkraft steigt mit den Aufwertungen der Waffe.
items.weapon.melee.roundshield.ability_name=schützen
items.weapon.melee.roundshield.typical_ability_desc=Die Zweikämpferin kann sich mit ihrem Rundschild _schützen_ und so innerhalb von üblicherweise _%d Zügen_ alle gegen sie geführten physischen oder magischen Angriffe komplett negieren. Nachdem die Zweikämpferin so einen Angriff blockiert hat, beendet ein Gegenangriff oder die Anwendung von Magie diesen Schutz.
items.weapon.melee.roundshield.ability_desc=Die Zweikämpferin kann sich mit ihrem Rundschild _schützen_ und so innerhalb von _%d Zügen_ alle gegen sie geführten physischen oder magischen Angriffe komplett negieren. Nachdem die Zweikämpferin so einen Angriff blockiert hat, beendet ein Gegenangriff oder die Anwendung von Magie diesen Schutz.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Dauer der Fähigkeit
items.weapon.melee.roundshield.desc=Dieser große Deckel einer Biotonne wehrt Angriffe effektiv ab und ist zur Not auch eine brauchbare Waffe. Er riecht nach Mitte Juli.
items.weapon.melee.roundshield$guardtracker.name=beschützt
items.weapon.melee.roundshield$guardtracker.guarded=beschützt
items.weapon.melee.roundshield$guardtracker.desc=Die Zweikämpferin hat ihren Schild in Erwartung kommender Angriffe bereitgemacht. Gegen sie geführte physische oder magische Angriffe werden vollständig negiert.\n\nVerbleibende Züge: %s.

items.weapon.melee.runicblade.name=Esoterik-Säbel
items.weapon.melee.runicblade.stats_desc=Diese Waffe wird von weiteren Aufwertungen besonders profitieren.
items.weapon.melee.runicblade.ability_name=Runenschnitt
items.weapon.melee.runicblade.typical_ability_desc=Die Zweikämpferin kann mit einer Runenklinge einen _Runenschnitt_ ausführen. Dieser Angriff trifft garantiert und hat üblicherweise eine Verzauberungskraft von _+%d%%_.
items.weapon.melee.runicblade.ability_desc=Die Zweikämpferin kann mit einer Runenklinge einen _Runenschnitt_ ausführen. Dieser Angriff trifft garantiert und hat eine Verzauberungskraft von _+%d%%_.
items.weapon.melee.runicblade.upgrade_ability_stat_name=Fähigkeitskraft
items.weapon.melee.runicblade.desc=Eine mysteriöse Klinge aus dem Heilsteinladen, mit leuchtend blauer Schneide.

items.weapon.melee.sai.name=Grillzangen
items.weapon.melee.sai.stats_desc=Diese Waffe ermöglicht sehr schnelle Angriffe.
items.weapon.melee.sai.ability_name=Kombi-Angriff
items.weapon.melee.sai.typical_ability_desc=Die Zweikämpferin kann mit Grillzangen einen _Kombo-Schlag_ ausführen. Dieser Angriff trifft garantiert und verursacht üblicherweise _+%d Schaden_ für jeden Treffer, den die Zweikämpferin mit einem regulären Nahkampf- oder Wurfwaffenangriff gelandet hat. Trifft sie 5 Züge lang nicht (15 nach einem Kill), wird die Kombo zurückgesetzt.
items.weapon.melee.sai.ability_desc=Die Zweikämpferin kann mit Grillzangen einen _Kombo-Schlag_ ausführen. Dieser Angriff trifft garantiert und verursacht _+%d Schaden_ für jeden Treffer, den die Zweikämpferin mit einem regulären Nahkampf- oder Wurfwaffenangriff gelandet hat. Trifft sie 5 Züge lang nicht (15 nach einem Kill), wird die Kombo zurückgesetzt.
items.weapon.melee.sai.desc=Zwei Grillzangen aus Edelstahl, eine für jede Hand. Großartig geeignet, um Gegner mit hektischen Stichen niederzustrecken, und um Würstchen zu wenden.
items.weapon.melee.sai$combostriketracker.name=Kombi-Angriff
items.weapon.melee.sai$combostriketracker.desc=Die Zweikämpferin baut eine Kombo auf, die den Schaden ihres Kombo-Schlags erhöht. Jeder erfolgreiche reguläre Nahkampf- oder Wurfwaffenangriff zählt, aber 5 Züge ohne Treffer (15 nach einem Kill) setzen die Kombo zurück.\n\nLetzte Treffer: %1$d.\n\nZüge, bis Treffer verfallen: %2$s.

items.weapon.melee.scimitar.name=Dönermesser
items.weapon.melee.scimitar.stats_desc=Diese Waffe ermöglicht schnelle Angriffe.
items.weapon.melee.scimitar.ability_name=Schwerttanz
items.weapon.melee.scimitar.typical_ability_desc=Die Zweikämpferin kann mit einem Krummsäbel einen _Schwerttanz_ ausführen. Diese Haltung benötigt keine Aktivierungszeit und gewährt der Zweikämpferin eine Angriffsgeschwindigkeit von +60%% und +50%% Genauigkeit im Verlauf von üblicherweise _%d Zügen_.
items.weapon.melee.scimitar.ability_desc=Die Zweikämpferin kann mit einem Krummsäbel einen _Schwerttanz_ ausführen. Diese Haltung benötigt keine Aktivierungszeit und gewährt der Zweikämpferin eine Angriffsgeschwindigkeit von +60%% und +50%% Genauigkeit im Verlauf von _%d Zügen_.
items.weapon.melee.scimitar.upgrade_ability_stat_name=Dauer der Fähigkeit
items.weapon.melee.scimitar.desc=Ein langes, geschwungenes Messer vom Drehspieß, geschliffen für Scheiben, die mit jedem Preisanstieg dünner werden. Seine Form ermöglicht schnelle, aber weniger kraftvolle Hiebe.
items.weapon.melee.scimitar$sworddance.name=Schwerttanz
items.weapon.melee.scimitar$sworddance.desc=Die Zweikämpferin bewegt sich tänzerisch mit schnellen, schwungvollen Hieben. In diesem Zustand greift sie um 60%% schneller an (schnell genug, um genau zweimal pro Zug mit einem Krummsäbel anzugreifen) und ihre Genauigkeit steigt um +50%%.\n\nVerbleibende Züge: %s.

items.weapon.melee.sickle.name=Heckenschere
items.weapon.melee.sickle.stats_desc=Dies ist eine ziemlich ungenaue Waffe.
items.weapon.melee.sickle.ability_name=ernten
items.weapon.melee.sickle.typical_ability_desc=Die Zweikämpferin kann einen Feind mit einer Sichel _ernten_. Dieser verheerende Angriff trifft garantiert und verursacht üblicherweise _%d Schaden._ Dieser Schaden wird als Blutung angewendet, wenn das Ziel nicht immun ist.
items.weapon.melee.sickle.ability_desc=Die Zweikämpferin kann einen Feind mit einer Sichel _ernten_. Dieser verheerende Angriff trifft garantiert und verursacht _%d Schaden._ Dieser Schaden wird als Blutung angewendet, wenn das Ziel nicht immun ist.
items.weapon.melee.sickle.desc=Eine alte Heckenschere aus der Kleingartenkolonie. Taugt als starke, aber unhandliche Waffe.

items.weapon.melee.spear.name=Sonnenschirmstange
items.weapon.melee.spear.stats_desc=Dies ist eine eher langsame Waffe.\nDiese Waffe besitzt erhöhte Reichweite.
items.weapon.melee.spear.ability_name=aufspießen
items.weapon.melee.spear.typical_ability_desc=Die Zweikämpferin kann die Spitze eines Speers dazu benutzen, einen Gegner in Reichweite _aufzuspießen_, sofern er nicht auf einem angrenzenden Feld steht. Dies fügt üblicherweise _%1$d-%2$d_ Schaden zu, wirft den Gegner zurück und trifft garantiert.
items.weapon.melee.spear.ability_desc=Die Zweikämpferin kann die Spitze eines Speers dazu benutzen, einen Gegner in Reichweite _aufzuspießen_, sofern er nicht auf einem angrenzenden Feld steht. Dies fügt _%1$d-%2$d_ Schaden zu, wirft den Gegner zurück und trifft garantiert.
items.weapon.melee.spear.desc=Eine schlanke Stange eines Biergarten-Sonnenschirms, an der Spitze scharf abgebrochen.

items.weapon.melee.sword.name=Flohmarkt-Säbel
items.weapon.melee.sword.ability_name=aufschlitzen
items.weapon.melee.sword.typical_ability_desc=Die Zweikämpferin kann mit ihrem Schwert einen Gegner _aufschlitzen_. Dies fügt üblicherweise _%1$d-%2$d Schaden_ zu und trifft garantiert. Wenn ein Gegner durch das Aufschlitzen getötet wird, geschieht es augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.sword.ability_desc=Die Zweikämpferin kann mit einem Schwert einen Gegner _aufschlitzen_. Dies fügt _%1$d-%2$d Schaden_ zu und trifft garantiert. Wenn ein Gegner durch das Aufschlitzen getötet wird, geschieht es augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.sword.desc=Ein gut ausbalancierter Säbel vom Flohmarkt. Nicht zu groß, aber merklich länger als eine Gardinenstange.
items.weapon.melee.sword$cleavetracker.name=aufschlitzen
items.weapon.melee.sword$cleavetracker.desc=Die Zweikämpferin ist bereit, dem einen aufgeschlitzten Feind einen weiteren hinzuzufügen. Die nächste Aktivierung des Aufschlitzens verbraucht keine Ladungen der Waffenfähigkeit.\n\nVerbleibende Züge: %s.

items.weapon.melee.warhammer.name=Vorschlaghammer
items.weapon.melee.warhammer.stats_desc=Diese Waffe ermöglicht präzise Angriffe.
items.weapon.melee.warhammer.ability_name=schwerer Hieb
items.weapon.melee.warhammer.typical_ability_desc=Die Zweikämpferin kann mit dem Streithammer einen _schweren Hieb_ ausführen. Dieser wuchtige Schlag verursacht üblicherweise _%1$d-%2$d Schaden_ und macht das Ziel 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, fügt aber nur normalen Schaden zu, wenn der Gegner damit nicht überrascht wird.
items.weapon.melee.warhammer.ability_desc=Die Zweikämpferin kann mit dem Streithammer einen _schweren Hieb_ ausführen. Dieser wuchtige Schlag verursacht _%1$d-%2$d Schaden_ und macht das Ziel 5 Züge lang benommen, wodurch Genauigkeit und Ausweichen um 50%% reduziert werden. Ein schwerer Hieb trifft immer, fügt aber nur normalen Schaden zu, wenn der Gegner damit nicht überrascht wird.
items.weapon.melee.warhammer.desc=Nur wenige Kreaturen halten dem Schlag dieses Vorschlaghammers stand, mit dem schon ganze Altbauwände für "offene Wohnkonzepte" fielen. Man braucht große Stärke, um ihn effektiv zu führen.

items.weapon.melee.warscythe.name=Kleingarten-Sense
items.weapon.melee.warscythe.stats_desc=Dies ist eine ziemlich ungenaue Waffe.
items.weapon.melee.warscythe.ability_name=ernten
items.weapon.melee.warscythe.typical_ability_desc=Die Zweikämpferin kann einen Feind mit einer Kriegssense _ernten_. Dieser verheerende Angriff trifft garantiert und verursacht üblicherweise _%d Schaden._ Dieser Schaden wird als Blutung angewendet, wenn das Ziel nicht immun ist.
items.weapon.melee.warscythe.ability_desc=Die Zweikämpferin kann einen Feind mit einer Kriegssense _ernten_. Dieser verheerende Angriff trifft garantiert und verursacht _%d Schaden._ Dieser Schaden wird als Blutung angewendet, wenn das Ziel nicht immun ist.
items.weapon.melee.warscythe.desc=Dieses große, unhandliche Werkzeug wurde verstärkt, um damit statt Rasen die Köpfe von Feinden zu mähen. Die Kolonie hat es nie zurückverlangt.

items.weapon.melee.whip.name=Verlängerungskabel
items.weapon.melee.whip.stats_desc=Diese Waffe verfügt über eine enorme Reichweite.
items.weapon.melee.whip.ability_name=Rundumschlag
items.weapon.melee.whip.typical_ability_desc=Die Zweikämpferin kann mit einer Peitsche zu einem _Rundumschlag_ gegen alle Gegner um sie herum ausholen. Diese Fähigkeit verursacht üblicherweise _%1$d-%2$d Schaden_, greift alle Gegner in Reichweite an und trifft garantiert.
items.weapon.melee.whip.ability_desc=Die Zweikämpferin kann mit einer Peitsche zu einem _Rundumschlag_ gegen alle Gegner um sie herum ausholen. Diese Fähigkeit verursacht _%1$d-%2$d Schaden_, greift alle Gegner in Reichweite an und trifft garantiert.
items.weapon.melee.whip.desc=Ein 25-Meter-Kabel mit Mehrfachstecker am Ende. Es richtet nur geringen Schaden an, doch die Reichweite ist unschlagbar.

items.weapon.melee.wornshortsword.name=Verbogene Gardinenstange
items.weapon.melee.wornshortsword.ability_name=aufschlitzen
items.weapon.melee.wornshortsword.typical_ability_desc=Die Zweikämpferin kann mit ihrer verbogenen Gardinenstange einen Gegner _aufschlitzen_. Dies fügt üblicherweise _%1$d-%2$d Schaden_ zu und trifft garantiert. Wird ein Gegner durch das Aufschlitzen getötet, geschieht dies augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.wornshortsword.ability_desc=Die Zweikämpferin kann mit ihrer verbogenen Gardinenstange einen Gegner _aufschlitzen_. Dies fügt _%1$d-%2$d Schaden_ zu und trifft garantiert. Wird ein Gegner durch das Aufschlitzen getötet, geschieht dies augenblicklich und die Zweikämpferin kann innerhalb von 5 Zügen kostenfrei einen weiteren Gegner aufschlitzen.
items.weapon.melee.wornshortsword.desc=Eine kurze Gardinenstange, die seit Jahrzehnten im Kiez im Einsatz ist und entsprechend verbogen ist. Sie ist schwächer und leichter als eine gewöhnliche Gardinenstange, aber sie gehört dir.
items.weapon.melee.wornshortsword.discover_hint=Einer der Helden startet mit diesem Gegenstand.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=Adrenalin-Dartpfeil
items.weapon.missiles.darts.adrenalinedart.desc=Diese Dartpfeile wurden mit einer Mischung auf Basis von Hektikdistel präpariert. Sie erhöht Bewegungs- und Angriffsgeschwindigkeit von Verbündeten oder senkt kurz die Bewegungsgeschwindigkeit von Gegnern. Gegnern fügen die Dartpfeile weiterhin Schaden zu, Verbündeten nicht.

items.weapon.missiles.darts.blindingdart.name=Blend-Dartpfeil
items.weapon.missiles.darts.blindingdart.desc=Diese Dartpfeile wurden mit einer Mischung auf Basis von Blendwerk präpariert, die ihr Ziel kurz erblinden lässt. Ein geblendeter Gegner weiß aber noch, wo er dich zuletzt gesehen hat.

items.weapon.missiles.darts.chillingdart.name=Frost-Dartpfeil
items.weapon.missiles.darts.chillingdart.desc=Diese Dartpfeile wurden mit einer Mischung auf Basis von Frostbeule präpariert, die ihr Ziel deutlich abkühlt.

items.weapon.missiles.darts.cleansingdart.name=Reinigungs-Dartpfeil
items.weapon.missiles.darts.cleansingdart.desc=Diese Dartpfeile wurden mit einer Mischung auf Basis von Kehrwochenkraut präpariert. Sie macht Verbündete vorübergehend immun gegen alle negativen Effekte oder entfernt positive Effekte von Gegnern. Gegnern fügen die Dartpfeile weiterhin Schaden zu, Verbündeten nicht.

items.weapon.missiles.darts.dart.name=Dartpfeil
items.weapon.missiles.darts.dart.ac_tip=PRÄPARIEREN
items.weapon.missiles.darts.dart.prompt=Wähle eine Samenbombe
items.weapon.missiles.darts.dart.tip_title=Pfeile präparieren
items.weapon.missiles.darts.dart.tip_desc=Ein Samen kann mit einem oder zwei Pfeilen kombiniert werden, um sie zu präparieren. Die Sorte des Samens bestimmt die Art des Pfeils und seine einzigartige Wirkung.\n\nEin mit diesen Samen präparierter Pfeil wird ein _%s_.
items.weapon.missiles.darts.dart.tip_all=präpariere %1$d Pfeile mit %2$d Samen
items.weapon.missiles.darts.dart.tip_two=präpariere 2 Pfeile mit 1 Samen
items.weapon.missiles.darts.dart.tip_one=präpariere 1 Pfeil mit 1 Samen
items.weapon.missiles.darts.dart.tip_cancel=Abbrechen
items.weapon.missiles.darts.dart.desc=Einfache Dartpfeile aus der Eckkneipe, mit Metallspitzen. Ideal für zielgenaue Würfe und stechen ihr Opfer mit nur einem Schwung aus dem Handgelenk. Sie können mit Samen präpariert werden, um zusätzliche Effekte zu bewirken.
items.weapon.missiles.darts.dart.unlimited_uses=Dank ihrer einfachen Bauweise nutzen sich Dartpfeile nicht ab und halten somit für immer.

items.weapon.missiles.darts.displacingdart.name=Versetzungs-Dartpfeil
items.weapon.missiles.darts.displacingdart.desc=Diese Dartpfeile wurden mit einer Mischung auf Basis von Räumungsklee präpariert, die ihr Ziel ein kleines Stück wegteleportiert.

items.weapon.missiles.darts.healingdart.name=Heil-Dartpfeil
items.weapon.missiles.darts.healingdart.desc=Diese Dartpfeile wurden mit einer Mischung auf Basis von Pflasterkraut präpariert, die beim Ziel einen Heilungsschub auslöst. Gegnern fügen die Dartpfeile weiterhin Schaden zu, Verbündeten nicht.

items.weapon.missiles.darts.holydart.name=Heiliger Dartpfeil
items.weapon.missiles.darts.holydart.desc=Diese Dartpfeile wurden mit einer Mischung auf Basis von Mietsenkungsblume präpariert, die dem Ziel heilige Energie einflößt. Verbündete und normale Gegner werden gesegnet, untote und dämonische Gegner erleiden schweren Schaden. Gegnern fügen die Dartpfeile weiterhin Schaden zu, Verbündeten nicht.

items.weapon.missiles.darts.incendiarydart.name=Brand-Dartpfeil
items.weapon.missiles.darts.incendiarydart.desc=Diese Dartpfeile wurden mit einer Mischung auf Basis von Brandnessel präpariert, die sich beim Aufprall hell entzündet.

items.weapon.missiles.darts.paralyticdart.name=Lähmungs-Dartpfeil
items.weapon.missiles.darts.paralyticdart.desc=Diese Dartpfeile wurden mit einer Mischung auf Basis von Sitzfleischwurz präpariert, die ihr Ziel kurzzeitig lähmt.

items.weapon.missiles.darts.poisondart.name=Gift-Dartpfeil
items.weapon.missiles.darts.poisondart.desc=Diese Dartpfeile wurden in eine Mischung mit Neidmoos getaucht, die das Ziel vergiftet.

items.weapon.missiles.darts.rotdart.name=Fäulnis-Dartpfeil
items.weapon.missiles.darts.rotdart.desc=Diese bösartigen Dartpfeile werden mit einer säurehaltigen, auf Faulbeeren basierenden Mischung präpariert und ätzen sich aggressiv durch alles, womit der Pfeil in Berührung kommt. Starke Feinde werden einen Großteil der Wirkung aushalten, aber die Korrosion ist stark genug, um die meisten normalen Gegner zu töten. Diese Dartpfeile sind länger haltbar als andere präparierte Dartpfeile, jedoch kann ihre Lebensdauer nicht erhöht werden.
items.weapon.missiles.darts.rotdart.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.

items.weapon.missiles.darts.shockingdart.name=Schock-Dartpfeil
items.weapon.missiles.darts.shockingdart.desc=Diese Dartpfeile wurden in eine Mischung mit Schwindelranke getaucht, die dem Ziel einen ordentlichen Schock verpasst.

items.weapon.missiles.darts.tippeddart.ac_clean=SÄUBERN
items.weapon.missiles.darts.tippeddart.clean_title=Saubere Pfeile
items.weapon.missiles.darts.tippeddart.clean_desc=Diese Aktion wird den Samen von den Pfeilen entfernen, dabei werden sie wieder zu normalen Pfeilen.
items.weapon.missiles.darts.tippeddart.clean_all=alle säubern
items.weapon.missiles.darts.tippeddart.clean_one=einen säubern
items.weapon.missiles.darts.tippeddart.cancel=Abbrechen
items.weapon.missiles.darts.tippeddart.uses_left=Diese Dartpfeile können noch _%d/%d_ mal verwendet werden, bevor die Wirkung einer präparierten Spitze nachlässt.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Aber diese sind von so hoher Qualität, dass sie für immer halten werden._
items.weapon.missiles.darts.tippeddart.about_to_break=Die Wirkung deines präparierten Pfeils läuft bald ab.
items.weapon.missiles.darts.tippeddart.has_broken=Die Wirkung deines präparierten Pfeils ist abgelaufen.
items.weapon.missiles.darts.tippeddart.discover_hint=Du kannst diesen Gegenstand in einem Laden kaufen oder ihn mit einem Samen herstellen.


items.weapon.missiles.bolas.name=Kabelbinder-Bola
items.weapon.missiles.bolas.stats_desc=Diese Waffe verkrüppelt das von ihr getroffene Ziel.
items.weapon.missiles.bolas.desc=Zwei Pflastersteine, verbunden mit Kabelbindern und Optimismus. Sie richten nicht viel Schaden an, verlangsamen das Ziel aber zuverlässig.

items.weapon.missiles.boomerang.name=Wurfscheibe
items.weapon.missiles.boomerang.desc=Eine Plastikwurfscheibe vom Tempelhofer Feld. Auf einen Feind geworfen, kehrt sie in die Hand des Werfers zurück.
items.weapon.missiles.boomerang.durability=Aufgrund seiner soliden Bauweise nutzt sich dieser Bumerang nicht ab.

items.weapon.missiles.fishingspear.name=Angler-Harpune
items.weapon.missiles.fishingspear.desc=Kleine Harpunen, eigentlich zum Fischen im Landwehrkanal gedacht, was ohnehin keiner tun sollte. Als improvisierte Waffe taugen sie gut.

items.weapon.missiles.forcecube.name=Betonwürfel
items.weapon.missiles.forcecube.ondeath=Du hast dich mit deinem eigenen Kraftwürfel getötet...
items.weapon.missiles.forcecube.stats_desc=Diese Waffe verteilt die Gewalt ihres Einschlags in einem kleinen Gebiet, wodurch alles in der Nähe getroffen wird.
items.weapon.missiles.forcecube.desc=Diese seltsam geformten magischen Betonwürfel von einer Poller-Absperrung passen in eine Hand, sind aber unglaublich schwer.

items.weapon.missiles.heavyboomerang.name=Backblech
items.weapon.missiles.heavyboomerang.stats_desc=Fünf Züge, nachdem sie geworfen wurde, fliegt diese Waffe zurück an den Ort, von dem sie geworfen wurde.
items.weapon.missiles.heavyboomerang.desc=Ein großes, schweres Backblech aus einer Großküche. Schwer zu beherrschen, verursacht aber erheblichen Schaden.

items.weapon.missiles.javelin.name=Halteverbotsschild
items.weapon.missiles.javelin.desc=Diese schweren mobilen Halteverbotsschilder werden eigentlich für Umzüge aufgestellt. Sie sind so ausbalanciert, dass sie immer mit der Stange voranfliegen.

items.weapon.missiles.kunai.name=Grillspieß
items.weapon.missiles.kunai.stats_desc=Diese Waffe ist gegen ahnungslose Gegner wirksamer.
items.weapon.missiles.kunai.desc=Diese kleinen Metallspieße entfalten in geübter Hand eine große Wirkung. Die Paprika ist schon ab.

items.weapon.missiles.missileweapon.stats_known=Dieser Satz Wurfwaffen der _Stufe %1$d_ verursacht _%2$d-%3$d Schaden_ und benötigt eine _Stärke von %4$d_ für die Benutzung.
items.weapon.missiles.missileweapon.stats_unknown=Dieser Satz an Wurfwaffen der _Stufe %1$d_ verursacht üblicherweise _%2$d-%3$d Schaden_ und benötigt eine _Stärke von %4$d_ für die Benutzung.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Wahrscheinlich ist diese Waffe zu schwer für dich.
items.weapon.missiles.missileweapon.distance=Wurfwaffen sind auf Entfernung genauer, aber weniger genau im Nahbereich.
items.weapon.missiles.missileweapon.durability=Wurfwaffen werden beim Gebrauch abgenutzt und zerbrechen.
items.weapon.missiles.missileweapon.uses_left=Diese Waffen können noch _%d/%d_ Mal verwendet werden, bevor eine zerbricht.
items.weapon.missiles.missileweapon.unlimited_uses=_Dieser Satz ist von so hoher Qualität, dass sie für immer halten werden._
items.weapon.missiles.missileweapon.unknown_uses=Im Normalfall hat man mit diesem Satz Wurfwaffen _%d_ Anwendungen, bevor eine davon bricht.
items.weapon.missiles.missileweapon.curse_discover=Diese Wurfwaffe ist verflucht!
items.weapon.missiles.missileweapon.about_to_break=Deine Wurfwaffe zerbricht gleich.
items.weapon.missiles.missileweapon.has_broken=Eine deiner Wurfwaffen ist zerbrochen.
items.weapon.missiles.missileweapon.dust=Diese Wurfwaffe zerfällt zu Staub, als du sie berührst.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Wenn die letzte Wurfwaffe aus deinem verbesserten Satz Wurfwaffen bricht, geht der Satz unwiederbringlich verloren. Bist du sicher, dass du sie werfen möchtest?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Ja
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Nein
items.weapon.missiles.missileweapon$placeholder.name=Wurfwaffe

items.weapon.missiles.shuriken.name=Kronkorken
items.weapon.missiles.shuriken.stats_desc=Kronkorken können augenblicklich mit einer Abklingzeit von 20 Zügen geworfen werden.
items.weapon.missiles.shuriken.desc=Diese gezackten Metalldeckel mit messerscharfen Kanten lassen sich schnell aus der Bewegung heraus schnipsen. Der Boden jedes Späti-Vorplatzes ist voll davon.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Kronkorken-Abklingzeit
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Du hast vor Kurzem augenblicklich einen Kronkorken geschnipst und musst nun warten, bevor du das wieder tun kannst. Kronkorken können weiterhin geworfen werden, jedoch mit der normalen Waffengeschwindigkeit.\n\nVerbleibende Züge: %s.

items.weapon.missiles.throwingclub.name=Pfandflasche
items.weapon.missiles.throwingclub.stats_desc=Diese Waffe bleibt nicht in Feinden stecken und kann sofort wieder aufgesammelt werden.
items.weapon.missiles.throwingclub.desc=Eine dickwandige Mehrweg-Glasflasche, praktisch unzerstörbar. Sie auf Feinde zu werfen statt sie abzugeben, ist in Berlin fast ein Verbrechen.

items.weapon.missiles.throwinghammer.name=Gummihammer
items.weapon.missiles.throwinghammer.stats_desc=Diese Waffe bleibt nicht in Feinden stecken und kann sofort wieder aufgesammelt werden.
items.weapon.missiles.throwinghammer.desc=Diese schweren Hämmer vom Fliesenleger wurden eigentlich nie zum Werfen gemacht. Ihre robuste Bauweise macht sie ausgesprochen haltbar.

items.weapon.missiles.throwingknife.name=Souvenir-Brieföffner
items.weapon.missiles.throwingknife.stats_desc=Diese Waffe ist gegen ahnungslose Gegner wirksamer.
items.weapon.missiles.throwingknife.desc=Leichte Brieföffner mit Fernsehturm-Griff aus dem Andenkenladen, drei Stück im Sparpack. Sie fliegen erstaunlich gerade durch die Luft direkt ans Ziel.
items.weapon.missiles.throwingknife.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.missiles.throwingspear.name=Zeltstange
items.weapon.missiles.throwingspear.desc=Diese leichten Zeltstangen haben dünne Schäfte und sind zum Werfen gedacht, nicht zum Stoßen. Das Festivalzelt ist weg.

items.weapon.missiles.throwingspike.name=Zelthering
items.weapon.missiles.throwingspike.desc=Diese robusten, spitzen Zeltheringe sollen auf entfernte Gegner geschleudert werden.
items.weapon.missiles.throwingspike.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.missiles.throwingstone.name=Hoftaube
items.weapon.missiles.throwingstone.desc=Eine der Hoftauben, die die Alteingesessene seit 1978 im Hinterhof füttert. Auf Zuruf flattert sie los und pickt dem Ziel kräftig ins Schienbein. Danach wartet sie am Boden, bis jemand sie wieder aufhebt. Treu ist sie nur der Schrippe.
items.weapon.missiles.throwingstone.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.missiles.tomahawk.name=Wurfbeil
items.weapon.missiles.tomahawk.stats_desc=Diese Waffe fügt ihrem Ziel _Blutungen der Stärke %1$d-%2$d_ zu.
items.weapon.missiles.tomahawk.typical_stats_desc=Normalerweise fügt diese Waffe ihrem Ziel _Blutungen der Stärke %1$d-%2$d_ zu.
items.weapon.missiles.tomahawk.desc=Kleine Spaltbeile vom Brennholzstand, gekauft für den Kaminofen einer Wohnung ohne Schornstein. Ihre gezackte Kante reißt Wunden, während sie im Feind stecken bleiben.

items.weapon.missiles.trident.name=Mistgabel
items.weapon.missiles.trident.desc=Massive Mistgabeln aus einem Kinderbauernhof, mit drei tödlichen Zinken. Mächtig, aber ziemlich schwer.


items.weapon.spiritbow.name=Upcycling-Bogen
items.weapon.spiritbow.ac_shoot=SCHIESSEN
items.weapon.spiritbow.prompt=Wähle ein Ziel
items.weapon.spiritbow.stats=Der Bogen kann nicht direkt verbessert werden, sondern wird mit zunehmendem Level immer stärker. Auf deinem aktuellen Level verursachen Pfeile, die aus dem Bogen geschossen werden, _%1$d–%2$d Schaden_ und er erfordert eine _Stärke von %3$d_, um korrekt verwendet zu werden.
items.weapon.spiritbow.desc=Ein Bogen, liebevoll aus einem alten Parkett und Fahrradspeichen gebaut. Schnur und Zeichen erglühen in einem blassen Blau. Wird die Sehne gespannt, beschwört der Bogen einen magischen Pfeil, der auf einen Feind geschossen werden kann.
items.weapon.spiritbow.discover_hint=Einer der Helden startet mit diesem Gegenstand.

items.weapon.weapon.identify=Du bist mit deiner Waffe nun vertraut genug, um sie zu identifizieren.
items.weapon.weapon.too_heavy=Aufgrund deiner unzureichenden Stärke wirst du diese Waffe mit verringerter Angriffsgeschwindigkeit und Treffergenauigkeit verwenden.
items.weapon.weapon.excess_str=Aufgrund deiner überschüssigen Stärke wirst du bis  _0-%d Zusatzschaden_ mit dieser Waffe anrichten.
items.weapon.weapon.hardening_gone=Die Verhärtung dieser Waffe wurde abgetragen!
items.weapon.weapon.incompatible=Die Interaktion mit verschiedenen Arten von Magie hat die Verzauberung von dieser Waffe entfernt!
items.weapon.weapon.cursed_worn=Da diese Waffe verflucht ist, kannst du sie nicht mehr loslassen.
items.weapon.weapon.cursed=Du spürst, dass eine bösartige Magie in dieser Waffe ruht.
items.weapon.weapon.weak_cursed=Trotz des Fluchs gelingt es dir, die Waffe abzulegen.
items.weapon.weapon.not_cursed=Diese Waffe ist frei von bösartiger Magie.
items.weapon.weapon.faster=Darauf optimiert, die _Geschwindigkeit_ zu erhöhen.
items.weapon.weapon.stronger=Darauf optimiert, mehr _Schaden_ zu verursachen.
items.weapon.weapon.enchanted=steht unter der Wirkung von _%s_.
items.weapon.weapon.enchant_hardened=Sie wurde _verhärtet._
items.weapon.weapon.hardened_no_enchant=Diese Waffe wurde _verhärtet,_ aber ist derzeit nicht verzaubert.
items.weapon.weapon$enchantment.enchant=Verzauberung
items.weapon.weapon$enchantment.rankings_desc=Getötet durch eine Verzauberung
items.weapon.weapon$enchantment.discover_hint=Du kannst einen Gegenstand mit diesem Effekt zufällig in den Tiefen finden, oder du kannst versuchen, ihn selber auf einen Gegenstand anzuwenden.


###misc items
items.amulet.name=Unbefristeter Mietvertrag
items.amulet.ac_end=SPIEL BEENDEN
items.amulet.desc=Der letzte unbefristete Mietvertrag Berlins: Altbau, Kaltmiete von 1987, keine Staffel, kein Index, kein Eigenbedarf. Das mächtigste Dokument, das Menschen oder Zwerge kennen. Makler, die ihn sehen, müssen sich erst einmal setzen.
items.amulet.desc_origins=Es ist nicht bekannt, wer diesen Mietvertrag einst unterschrieben hat. Die Geschichtsschreibung besagt, dass der König der Eigentumswohnungen ihn entdeckte, kurz bevor die Eigentümerzwerge alle Kontakte abbrachen. Wie hat er ihn gefunden? Wie hat der Ewige Mietspiegel ihn ihm abgenommen? Diese Fragen heben wir uns für später auf. Jetzt zählt nur, dass du ihn in der Hand hältst. Deine Kaution übrigens nicht, die wird mit der Nebenkostenabrechnung verrechnet.
items.amulet.desc_ascent=Es ist nicht bekannt, wer diesen Mietvertrag einst unterschrieben hat, jedoch steht er deutlich unter dem Einfluss des Ewigen Mietspiegels. Der Untergrund scheint sich seinem Willen zu beugen, während du ihn durchquerst, so dass deine Feinde zahlreicher und stärker werden! Du bist auch nicht mehr dazu in der Lage, den Mietvertrag zu aktivieren oder abzuwerfen, ganz, als wäre er verflucht.
items.amulet.ascent_title=Aufstieg
items.amulet.ascent_desc=Du beginnst zu spüren, wie die große und schreckliche Macht des Ewigen Mietspiegels aus dem Mietvertrag ausstrahlt. Als einfacher Sterblicher wieder zurück durch den Untergrund an die Oberfläche zu steigen, könnte schwerer werden, als du gedacht hast!\n\nWenn du damit fortfährst, mit dem Mietvertrag nach oben zu steigen, wird der Untergrund gefährlicher werden, Teleportationen zwischen Ebenen werden unmöglich und du kannst das Spiel nur gewinnen, wenn du Feinde besiegst, während du durch den Untergrund bis nach oben steigst!\n\nDu kannst den Mietvertrag aber auch erst einmal hier liegen lassen, wenn du aufsteigen willst, ohne dich dieser Herausforderung zu stellen, oder den Mietvertrag aktivieren, bevor du aufsteigst, und das Spiel so normal beenden.
items.amulet.ascent_yes=Fortfahren!
items.amulet.ascent_no=Vorerst abbrechen
items.amulet.discover_hint=Du kannst diesen Gegenstand ganz unten im Untergrund finden, unter dem Rathaus...

items.ankh.name=Zweitschlüssel
items.ankh.ac_bless=SEGNEN
items.ankh.bless=Du beträufelst den Zweitschlüssel mit deinen gesammelten Biertropfen. Jetzt passt er auch in das neue Schloss, das die Hausverwaltung heimlich eingebaut hat.
items.ankh.desc=Ein Zweitschlüssel zu deiner Wohnung, hinterlegt bei der Nachbarin aus dem Erdgeschoss. Sie gießt die Blumen, nimmt Pakete an und holt dich notfalls von den Toten zurück.\n\nStirbst du, kehrst du mit dem Zweitschlüssel ins Leben zurück. Die meisten Gegenstände fallen dort zu Boden, wo du gestorben bist, und lassen sich dort wieder einsammeln. Mit einem vollen Sternchen-Pils kann der Zweitschlüssel mit zusätzlicher Kraft gesegnet werden.
items.ankh.desc_blessed=Dieser Zweitschlüssel wurde gesegnet und passt jetzt auch in das neue Schloss, von dem dir niemand etwas gesagt hat.\n\nEr ist viel stärker als zuvor: Solltest du in tödlicher Gefahr sein, opfert sich der Zweitschlüssel und rettet dich.
items.ankh.discover_hint=Du kannst diesen Gegenstand in einem Laden kaufen.

items.arcaneresin.name=arkanes Harz
items.arcaneresin.prompt=Wähle einen Stab zum Verschmelzen
items.arcaneresin.ac_apply=ANWENDEN
items.arcaneresin.level_too_high=Dieser Zauberstab ist zu mächtig, als dass Harz ihn verbessern könnte.
items.arcaneresin.not_enough=Du besitzt nicht genug Harz dafür!
items.arcaneresin.apply=Du beschichtest deinen Zauberstab mit Harz und erhöhst damit seine Kraft!
items.arcaneresin.desc=Dieses feine Pulver schimmert in Violett- und Weißtönen. Es kann als Verstärker magischer Energien wirken und die Stufe von Zauberstäben erhöhen, wenn es auf sie aufgetragen wird!\n\nDie Verbesserung eines Zauberstabs kostet 1, 2 oder 3 Harze, je nach der ursprünglichen Stufe des Zauberstabs. Harz kann Zauberstäbe bis zu einem Maximum von +3 aufrüsten.\n\nAufwertungen durch Harz werden jedoch _von anderen Quellen für Verbesserungen_ (wie Modernisierungsbescheide) überschrieben und gelten nicht, wenn ein Zauberstab in den Selfie-Stick des Expats eingearbeitet wird.
items.arcaneresin.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.brokenseal.name=Kiez-Aufnäher
items.brokenseal.ac_affix=BEFESTIGEN
items.brokenseal.prompt=Wähle eine Jacke (Rüstung)
items.brokenseal.unknown_armor=Du musst zuerst identifizieren, ob diese Rüstung verflucht ist oder nicht.
items.brokenseal.cursed_armor=Der Aufnäher hält nicht auf einer verfluchten Rüstung. Nicht mal mit Sekundenkleber.
items.brokenseal.affix=Du nähst den Aufnäher an deine Rüstung.
items.brokenseal.desc=Ein ausgefranster Aufnäher mit dem Wappen eines Fußballvereins aus der Kreisliga, halb abgerissen. Die Schrift ist längst unleserlich, alle wissen trotzdem, was draufstand.\n\nAls Erinnerung an einen Kiez, den es so nicht mehr gibt, hilft er der Alteingesessenen durchzuhalten. Solange er getragen wird, erhält sie sofort Abschirmung, sobald ein Schaden ihre LP auf mindestens die Hälfte der gesamten LP zu verringern droht.\n\nDer Aufnäher kann _an eine Rüstung angebracht_ und von Rüstung zu Rüstung übertragen werden. Er kann eine einzige Aufwertung mitnehmen, sofern er während der Aufwertung an der Rüstung befestigt war.
items.brokenseal.inscribed=Auf dem Aufnäher steht: _%s._
items.brokenseal.choose_title=Wähle eine Glyphe
items.brokenseal.choose_desc=Sowohl diese Rüstung als auch der Kiez-Aufnäher tragen eine Glyphe. Wähle, welche der beiden Glyphen bewahrt werden soll.\n\nRüstungsglyphe: %1$s\nGlyphe des Aufnähers: %2$s\n\nBedenke: Wenn du die Glyphe wählst, die derzeit auf der Rüstung ist, kann der Aufnäher sie später nicht übertragen.
items.brokenseal.discover_hint=Einer der Helden startet mit diesem Gegenstand.
items.brokenseal$warriorshield.name=Ick wohn hier
items.brokenseal$warriorshield.desc_active=Der Kiez-Aufnäher hilft der Alteingesessenen derzeit durchzuhalten und verleiht ihr Abschirmung über ihre LP. Nach der Aktivierung muss eine Abklingzeit ablaufen, bevor sie erneut aktiviert werden kann.\n\nDer Schild nimmt nicht mit der Zeit ab, endet aber, wenn für ein paar Züge keine Gegner in der Nähe sind. Wenn er endet, reduzieren unverbrauchte Schildpunkte die Abklingzeit um maximal 50%%.\n\nVerbleibender Schild: %1$d.\n\nVerbleibende Abklingzeit: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Die Alteingesessene hat vor Kurzem Abschirmung vom Kiez-Aufnäher erhalten und muss warten, bevor sie wieder von diesem schützenden Effekt profitieren kann.\n\nVerbleibende Züge: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Die Abklingzeit der Abschirmung der Alteingesessenen ist momentan negativ: Wird ihre Abschirmung aktiviert, ist die Abklingzeit kürzer als die üblichen 150 Züge. Sie kann auf bis zu -150 Züge sinken, dann ist die Abschirmung nach der Aktivierung sofort wieder verfügbar. Derzeitige Abklingzeit: %d.

items.dewdrop.name=Biertropfen
items.dewdrop.already_full=Du bist bereits bei vollständiger Gesundheit.
items.dewdrop.desc=Ein einzelner Biertropfen unter einem Kronkorken, wie sie vor jedem Späti auf dem Gehweg liegen. Der Spätimann nennt das Kundenbindung.\n\nDurch die Magie dieses Ortes hat der Tropfen eine leichte Heilwirkung.

items.equipableitem.curse_detected=Kurz, bevor du den Gegenstand ausrüstest, spürst du, dass er verflucht ist!
items.equipableitem.unequip_cursed=Du kannst einen verfluchten Gegenstand nicht ablegen!
items.equipableitem.ac_equip=AUSRÜSTEN
items.equipableitem.ac_unequip=ABLEGEN

items.energycrystal.name=Energiekristall
items.energycrystal.desc=Eine Sammlung kleiner magischer Kristalle, die mit alchemischer Energie angefüllt sind.\n\nDiese Kristalle sind die am weitesten verbreitete Zutat von Alchemierezepten und können in einem Alchemiekessel durch Umwandlung verbrauchbarer Gegenstände erzeugt werden.

items.gold.name=Gold
items.gold.desc=Goldmünzen für den An- und Verkauf beim Spätimann. Hier unten gilt nur Bares. Karte nimmt er erst ab zehn Euro, und das Gerät sucht seit Jahren Netz.

items.heap.for_sale=%1$dg: %2$s
items.heap.chest=Sperrmüllberg
items.heap.chest_desc=Matratze, Ecksofa, drei Kartons und eine Stehlampe ohne Schirm, seit Wochen „zu verschenken“. Was darunter liegt, weißt du erst, wenn du wühlst!
items.heap.locked_chest=Angeketteter Sperrmüllberg
items.heap.locked_chest_desc=Jemand hat diesen Sperrmüllberg mit einer goldenen Fahrradkette gesichert. Ohne goldenen Schlüssel kommst du nicht an das, was darunter liegt. Wer Sperrmüll abschließt, hat etwas zu verbergen.
items.heap.crystal_chest=Sperrmüll-Vitrine
items.heap.crystal_chest_desc=Durch das Glas der ausrangierten Vitrine erkennst du _%s_, aber um sie zu öffnen, benötigst du einen Kristallschlüssel.
items.heap.artifact=ein Artefakt
items.heap.wand=einen Zauberstab
items.heap.ring=einen Ring
items.heap.tomb=Grabmal
items.heap.tomb_desc=Dieses uralte Grabmal könnte etwas Nützliches enthalten, doch sein Besitzer hätte sicher etwas dagegen, wenn du sein Grab plünderst. Er ist der Einzige hier unten mit Bestandsschutz.
items.heap.skeleton=Gebeine
items.heap.skeleton_desc=Die Überreste von jemandem, der hier unten nur kurz sein Fahrrad holen wollte. Vielleicht lässt sich hier etwas Wertvolles finden.
items.heap.remains=Gebeine eines Helden
items.heap.remains_desc=Das hier ist alles, was noch von deinem Vorgänger übrig ist. Vielleicht lässt sich hier etwas Wertvolles finden.

items.honeypot.name=Stadthonig-Topf
items.honeypot.ac_shatter=ZERSCHMETTERN
items.honeypot.desc=In diesem Honigtopf ist kaum Honig, stattdessen lebt darin eine gigantische Biene! Riesenbienen bleiben eigentlich in ihrem Nest, vielleicht ist das ein Spezialgefängnis eines Dachimkers? Die Biene wirkt entspannt und surrt warnend, wenn du in ihren Topf schaust.
items.honeypot$shatteredpot.name=zerbrochener Honigtopf
items.honeypot$shatteredpot.desc=Dieser Topf ist zerschmettert worden und nur der klebrige Honig hält die Bruchstücke zusammen, welche langsam auseinanderfallen.\n\nAuch wenn der Topf zerschmettert ist, scheint die Biene weiterhin den Topf zu verteidigen.

items.item.prompt=Wähle die Wurfrichtung
items.item.ac_drop=FALLEN LASSEN
items.item.ac_throw=WERFEN
items.item.rankings_desc=Getötet von: %s
items.item.curse=Fluch
items.item.custom_note_type=Dieser Gegenstands-Typ hat eine persönliche Notiz: "_%s_"
items.item.custom_note=Dieser Gegenstand hat eine persönliche Notiz: "_%s_"
items.item.discover_hint=Du kannst diesen Gegenstand zufällig in den Tiefen unter Neukölln finden.

items.kindofmisc.unequip_title=Ein Ausrüstungsteil ablegen
items.kindofmisc.unequip_message=Du musst erst einen dieser Gegenstände ablegen. Wähle einen Gegenstand, mit dem du tauschen möchtest.

items.kindofweapon.swift_equip=Du rüstest deine Waffe blitzschnell aus.
items.kindofweapon.equip_cursed=Dein Griff verfestigt sich unfreiwillig um die Waffe.
items.kindofweapon.which_equip_msg=In welcher Waffenhand möchtest du diesen Gegenstand ausrüsten?\n\nDie Nebenjobberin führt direkte Angriffe mit ihrer Primärwaffe aus, kann aber die Fähigkeiten beider Waffen benutzen. Die beiden Waffen teilen sich die Zahl der Ladungen.\n\nDie Nebenjobberin kann ebenso augenblicklich Primär- und Sekundärwaffe tauschen.
items.kindofweapon.which_equip_primary=Primär (%s)
items.kindofweapon.which_equip_secondary=Sekundär (%s)
items.kindofweapon.empty=leer

items.kingscrown.name=Penthouse-Krone
items.kingscrown.ac_wear=TRAGEN
items.kingscrown.naked=Unglücklicherweise kann die Krone deine Unterwäsche nicht verwandeln.
items.kingscrown.upgraded=Die Krone leuchtet hell und löst sich auf, während sich deine Rüstung verwandelt!
items.kingscrown.ratgraded=Die Pfoten des Pfandkönigs leuchten hell, während sich deine Rüstung verwandelt!
items.kingscrown.desc=Die Krone des Königs der Eigentumswohnungen, des letzten Herrschers der Eigentümerzwerge. Sie strahlt ungeheure magische Energie aus.\n\nSetzt du sie auf, fließt ihre Magie in die Rüstung, die du gerade trägst, und verwandelt sie in eine _einzigartige epische Rüstung mit besonderen Fähigkeiten._ Die neue Rüstung behält alle Eigenschaften der ursprünglichen Rüstung.
items.kingscrown.discover_hint=Dieser Gegenstand wird von bestimmten Gegnern fallengelassen.

items.liquidmetal.name=Flüssigmetall
items.liquidmetal.ac_apply=ANWENDEN
items.liquidmetal.prompt=Wähle eine Wurfwaffe
items.liquidmetal.already_fixed=Diese Wurfwaffe befindet sich schon in perfektem Zustand!
items.liquidmetal.apply=Du benutzt %d Flüssigmetall, um deine Wurfwaffe zu reparieren.
items.liquidmetal.desc=Diese magische Flüssigkeit kann durch Gebrauch entstandene Risse und Brüche einer Wurfwaffe ausbessern und sie so wieder in einen makellosen Zustand versetzen! Wenn einem Satz Waffen ein Exemplar fehlt, es ansonsten aber vollständig repariert ist, kann dieses flüssige Metall sogar dazu verwendet werden, die fehlende Waffe in dem Satz zu ersetzen!\n\nEine Waffe der Stufe 1 benötigt 10 Einheiten Flüssigmetall, um vollständig repariert zu werden, eine Waffe der Stufe 5 benötigt 30. Mit jeder Verbesserung erhöht sich auch die benötigte Menge an Metall um 35%.\n\nFlüssigmetall kann nicht dazu verwendet werden, die Spitzen von präparierten Dartpfeilen aufzufrischen.
items.liquidmetal.discover_hint=Du kannst diesen Gegenstand mit Alchemie herstellen.

items.lostbackpack.name=Verlorener Jutebeutel
items.lostbackpack.desc=Das ist dein verlorenes Inventar, noch im Jutebeutel. Sammle es ein, um alle verlorenen Gegenstände wiederzubekommen!

items.merchantsbeacon.name=Späti-Pager
items.merchantsbeacon.ac_use=VERWENDEN
items.merchantsbeacon.desc=Ein Pager aus den Neunzigern, auf den jemand mit Filzstift "SPÄTI" geschrieben hat. Gespeichert ist genau eine Nummer.\n\nNach der Aktivierung kannst du deine Gegenstände an den Spätimann verkaufen, egal, wo du dich unter Neukölln befindest.\n\nDer Pager funktioniert nur ein einziges Mal. Danach ist das Guthaben alle.

items.stylus.name=Arkaner Permanentmarker
items.stylus.ac_inscribe=EINGRAVIEREN
items.stylus.prompt=Wähle eine Rüstung
items.stylus.identify=Du musst erst bestimmen, ob diese Rüstung verflucht ist.
items.stylus.cursed=Die Magie dieses Markers funktioniert nicht auf einer verfluchten Rüstung.
items.stylus.inscribed=Du hast deine Rüstung mit dem Permanentmarker beschriftet.
items.stylus.desc=Ein schwarzer Permanentmarker, mit dem schon jede Hauswand im Kiez getaggt wurde. Mit ihm kannst du deine Rüstung mit einer magischen Glyphe beschriften, doch du hast keinen Einfluss darauf, welche es wird. Der Stift entscheidet für dich.

items.tengusmask.name=Duftbäumchen des Kurzparkers
items.tengusmask.ac_wear=UMHÄNGEN
items.tengusmask.used=Das Duftbäumchen zerfällt, und seine Kraft strömt in dich! Es riecht nach Neuwagen.
items.tengusmask.desc=Dieses Duftbäumchen fiel vom Rückspiegel des Kurzparkers, als er liegen blieb. Es riecht nach Neuwagen und Vorfahrt, und du spürst starke magische Macht darin. War es die Quelle seiner Selbstgewissheit?\n\nHängst du es dir um, geht seine gewaltige Macht auf dich über, und du kannst _eine Unterklasse für deinen Helden wählen._\n\nWelche Unterklasse wählst du?
items.tengusmask.discover_hint=Dieser Gegenstand wird von bestimmten Gegnern fallengelassen.

items.torch.name=Handytaschenlampe
items.torch.ac_light=ENTZÜNDEN
items.torch.desc=Eines der wichtigsten Werkzeuge in Neukölln, sobald das Treppenhauslicht nach sieben Sekunden ausgeht. Wo hier unten sämtliches Licht fehlt, hilft sie, den Weg zu erleuchten.

items.waterskin.name=Sternchen-Pils
items.waterskin.ac_drink=TRINKEN
items.waterskin.collected=Du sammelst einen Biertropfen in dein Sternchen-Pils.
items.waterskin.full=Dein Sternchen-Pils ist voll!
items.waterskin.empty=Dein Sternchen-Pils ist leer!
items.waterskin.desc=Eine braune Halbliterflasche Sternchen-Pils aus dem Späti, zugedrückt mit dem alten Kronkorken. Auf dem Etikett prangt ein einzelnes Sternchen, für ein zweites hat das Budget nicht gereicht.
items.waterskin.desc_water=Momentan ist in der Flasche nur Leitungswasser. Hier unten gibt es bestimmt etwas, das sich stattdessen darin sammeln lässt. Die Biertropfen unter den Kronkorken zum Beispiel.
items.waterskin.desc_heal=In der Flasche sammelst du gerade heilende Biertropfen. Je voller sie ist, desto mehr heilt dich ein Schluck sofort. Du trinkst nur so viel, wie du brauchst.
items.waterskin.desc_full=Das volle Sternchen-Pils scheint Energie auszustrahlen. Möglicherweise kann es benutzt werden, um einen anderen fürs Überleben wichtigen Gegenstand zu segnen?
items.waterskin.discover_hint=Einer der Helden startet mit diesem Gegenstand.
items.quest.dwarftoken.progress=Garderobenmarken: %1$d/%2$d
items.quest.dwarftoken.complete=Alle %d Garderobenmarken beisammen! Ab zur Garderobe.
