plants.blandfruitbush.name=Fadfrucht
plants.blandfruitbush.desc=Die birnenförmige Frucht des Fadfruchtbuschs, ein entfernter Cousin der Faulbeere, schmeckt wie gebackener Staub. Sie ist nicht giftig, aber roh kaum genießbar; vielleicht sollte man sie kochen. Das Szenerestaurant nebenan serviert sie roh als „Urban Harvest“ für 14 Euro.
plants.blandfruitbush.discover_hint=Du findest diese Pflanze zufällig in den Tiefen unter Neukölln.
plants.blandfruitbush$seed.name=Fadfrucht-Samenbombe

plants.blindweed.name=Blendwerk
plants.blindweed.desc=Ein unscheinbares Kraut aus der Pflasterritze, das mehr verspricht, als es hält. Bei Berührung vergeht das Blendwerk in einem grellen Lichtblitz, der dich für einige Sekunden orientierungslos macht.
plants.blindweed.warden_desc=_Die Baumscheibenpatin_ lenkt die Energie des Blendwerks in einen kurzen Schleier der Unsichtbarkeit um, statt orientierungslos zu werden.
plants.blindweed$seed.name=Blendwerk-Samenbombe

plants.mageroyal.name=Kehrwochenkraut
plants.mageroyal.refreshed=Du fühlst dich erholt. Wie nach einem Spaziergang im Körnerpark.
plants.mageroyal.desc=Ein stacheliges Kraut, das jemand mit Putzplan im Treppenhaus ausgesät hat. Seine Blüten enthalten einen Stoff, der als starkes Neutralisierungsmittel bekannt ist. Wer in diese Pflanze tritt, wird von vielen negativen Effekten befreit, ob er will oder nicht.
plants.mageroyal.warden_desc=Zusätzlich zur neutralisierenden Wirkung wird _die Baumscheibenpatin_ kurzzeitig immun gegen alle Flächeneffekte, wenn sie auf Kehrwochenkraut tritt.
plants.mageroyal$seed.name=Kehrwochenkraut-Samenbombe

plants.earthroot.name=Sitzfleischwurz
plants.earthroot.desc=Eine zähe Wurzel, die ihre Baumscheibe verteidigt wie ein SUV den Anwohnerparkplatz. Berührt eine Kreatur die Sitzfleischwurz, bilden die Wurzeln eine unbewegliche natürliche Rüstung um sie. Sie schützt nur, solange man sitzen bleibt.
plants.earthroot.warden_desc=Die Wurzeln der Sitzfleischwurz wandern mit _der Baumscheibenpatin_ mit und verleihen ihr eine bewegliche Rindenhaut-Rüstung.
plants.earthroot$seed.name=Sitzfleischwurz-Samenbombe
plants.earthroot$armor.name=Sitzfleisch
plants.earthroot$armor.desc=Eine natürliche, aber unbewegliche Rüstung aus Rinde und Ranken. Sie hält, solange du sitzen bleibst.\n\nDiese pflanzliche Rüstung blockt %d Schaden von jedem körperlichen Treffer, bis sie am Ende ihrer Haltbarkeit in sich zusammenfällt.\n\nDa die Rüstung unbeweglich ist, zerbricht sie und geht verloren, sobald du dich bewegst.\n\nVerbleibende Rüstung: %d.

plants.fadeleaf.name=Räumungsklee
plants.fadeleaf.desc=Der Räumungsklee wächst dort, wo gestern noch ein Kiezladen war. Wer ihn berührt, wird an einen zufälligen Ort auf der aktuellen Ebene teleportiert. Ohne Frist, ohne Widerspruch.
plants.fadeleaf.warden_desc=Für _die Baumscheibenpatin_ wirkt der Räumungsklee stärker: Er teleportiert sie zurück ans Ende der vorherigen Ebene.
plants.fadeleaf$seed.name=Räumungsklee-Samenbombe

plants.firebloom.name=Brandnessel
plants.firebloom.desc=Die Brennnessel, die es ernst meint. Berührt etwas eine Brandnessel, geht sie in Flammen auf.
plants.firebloom.warden_desc=Zertritt _die Baumscheibenpatin_ eine Brandnessel, wird sie kurz von Flammen durchdrungen, statt Schaden zu nehmen.
plants.firebloom$seed.name=Brandnessel-Samenbombe

plants.icecap.name=Frostbeule
plants.icecap.desc=Eine blasse, geschwollene Knolle, die nur im ewigen Schatten der Hinterhöfe gedeiht. Bei Berührung stößt die Frostbeule eine Wolke gefrierender Pollen aus. In nasser Umgebung friert sie deutlich stärker ein.
plants.icecap.warden_desc=Zertritt _die Baumscheibenpatin_ eine Frostbeule, wird sie kurz von Frost durchdrungen, statt Schaden zu nehmen.
plants.icecap$seed.name=Frostbeulen-Samenbombe

plants.plant.warden_desc=Diese Pflanze hat keine besondere Wirkung, wenn die Baumscheibenpatin sie benutzt.
plants.plant.discover_hint=Du findest diese Pflanze zufällig in den Tiefen oder ziehst sie aus ihrem Samen, zum Beispiel auf einer freien Baumscheibe.
plants.plant$seed.seed_of=%s/n-Samen
plants.plant$seed.ac_plant=PFLANZEN
plants.plant$seed.info=Wirf diese Samenbombe an die Stelle, an der eine Pflanze wachsen soll. Guerilla-Gardening, ganz ohne Grünflächenamt.\n\n%s
plants.plant$seed$placeholder.name=Samenbombe

plants.rotberry.name=Faulbeere
plants.rotberry.desc=Die Beeren eines jungen Faulbeerenbuschs schmecken nach süßem, süßem Tod. Im Lauf einiger Jahre wird dieser Busch zu einem neuen Fäulnisherz heranwachsen, wie jede ignorierte Mängelanzeige. Wird eine junge Faulbeere zertrampelt, setzt sie eine kleine Wolke Giftgas frei.
plants.rotberry.warden_desc=Normalerweise gibt ein zertretener Faulbeerenbusch nur ein wenig Giftgas ab, aber _die Baumscheibenpatin_ zapft seine Energie an und erhöht so kurzzeitig ihre Stärke!
plants.rotberry.discover_hint=Du kannst diese Pflanze während einer bestimmten Aufgabe mit dem dazugehörigen Samen anpflanzen.
plants.rotberry$seed.name=Faulbeeren-Samenbombe
plants.rotberry$seed.discover_hint=Du kannst diesen Gegenstand während einer bestimmten Aufgabe finden.

plants.sorrowmoss.name=Neidmoos
plants.sorrowmoss.desc=Das Neidmoos ist eine Blume (kein Moos, das Schild im Gemeinschaftsgarten lügt), deren rasiermesserscharfe Blütenblätter mit tödlichem Gift überzogen sind. Giftig vor Neid auf jeden Balkon, der mehr Sonne abkriegt.
plants.sorrowmoss.warden_desc=Zertritt _die Baumscheibenpatin_ Neidmoos, wird sie kurz von Gift durchdrungen, statt Schaden zu nehmen.
plants.sorrowmoss$seed.name=Neidmoos-Samenbombe

plants.starflower.name=Mietsenkungsblume
plants.starflower.desc=Die Mietsenkungsblume ist so selten, dass die meisten sie für ein Gerücht halten. Wer sie berührt, wird gesegnet. Zuletzt gesehen wurde sie 1987.
plants.starflower.warden_desc=Zusätzlich zum Segen erhält _die Baumscheibenpatin_ eine große Menge Zauberstab-Aufladung, wenn sie eine Mietsenkungsblume zertritt.
plants.starflower$seed.name=Mietsenkungsblumen-Samenbombe

plants.stormvine.name=Schwindelranke
plants.stormvine.desc=Die Schwindelranke hängt schwerelos in der Luft, ohne Stütze, ohne Pfosten, wie jedes Versprechen im Exposé. Wer sich in ihren dünnen blauen Trieben verfängt, dem wird schwindlig.
plants.stormvine.warden_desc=_Die Baumscheibenpatin_ beherrscht die Schwerkraftwirkung der Schwindelranke und schwebt kurz, wenn sie eine zertritt.
plants.stormvine$seed.name=Schwindelranken-Samenbombe

plants.sungrass.name=Pflasterkraut
plants.sungrass.desc=Pflasterkraut wächst zwischen den Pflastersteinen an der einzigen Stelle im Hof, an die mittags Sonne kommt. Sein Saft wirkt wie ein Pflaster: langsam, aber zuverlässig heilend.
plants.sungrass.warden_desc=_Die Baumscheibenpatin_ wird von zertretenem Pflasterkraut auch dann weiter geheilt, wenn sie sich davon wegbewegt.
plants.sungrass$seed.name=Pflasterkraut-Samenbombe
plants.sungrass$health.name=Kräuterheilung
plants.sungrass$health.desc=Pflasterkraut heilt ausgezeichnet, aber viel langsamer als ein Ingwer-Heilshot.\n\nWenn du dich von der Pflanze wegbewegst, bricht die Heilwirkung ab.\n\nVerbleibende Heilung: %d.

plants.swiftthistle.name=Hektikdistel
plants.swiftthistle.desc=Eine Distel vom Mittelstreifen der Sonnenallee, an Hektik gewöhnt. Wird sie zertreten, beschleunigt die Hektikdistel kurz den Fluss der Zeit um sich herum, und wer sie zertreten hat, kann sofort mehrere Handlungen ausführen.
plants.swiftthistle.warden_desc=Zusätzlich zu den sofortigen Aktionen erhält _die Baumscheibenpatin_ einen kurzen Eile-Schub, wenn sie eine Hektikdistel zertritt.
plants.swiftthistle$seed.name=Hektikdistel-Samenbombe
plants.swiftthistle$timebubble.name=Zeitblase
plants.swiftthistle$timebubble.desc=Eine kleine Blase beschleunigter Zeit, in der du Handlungen sofort ausführen kannst. Ein Angriff oder der Einsatz von Magie beendet diesen Effekt jedoch.\n\nVerbleibende Züge: %s.
