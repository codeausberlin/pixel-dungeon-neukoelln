journal.document.adventurers_guide.title=Kiezführer für Abenteurer
journal.document.adventurers_guide.intro.title=Einführung
journal.document.adventurers_guide.intro.body=Willkommen, Neuankömmling im Untergrund! Du liest den Kiezführer für Abenteurer, das einzige Nachschlagewerk über Neukölln, das nicht von einem Lifestyle-Magazin stammt. Er zeigt dir auf magische Weise an, wann der beste Zeitpunkt ist, eine bestimmte Seite zu lesen.\n\n(Wenn das Buchsymbol oben rechts blinkt, wähle es an, um zu lesen, was dir der Kiezführer zu sagen hat! Einige Seiten scheinen allerdings zu fehlen; vielleicht kannst du sie im Untergrund finden? Jemand hat sie vermutlich in die Altpapiertonne gestopft.)
journal.document.adventurers_guide.examining.title=Alles untersuchen!
journal.document.adventurers_guide.examining.body=Es ist wichtig, Gegner und Umgebung genau anzuschauen, statt sich blind auf sie zu stürzen. In Neukölln ist nichts, was es zu sein scheint: Der Sperrmüllberg ist ein Monster, die Ratte hat Pfand dabei, und der Sessel am Straßenrand wartet nur auf dich. Gewöhne dir an, alles zu untersuchen, was dir neu begegnet.\n\n(Du kannst etwas untersuchen, indem du auf die Lupentaste und dann auf den Gegenstand tippst, den du untersuchen möchtest. Du kannst auch Stärkungs- oder Schwächungseffekte untersuchen, indem du auf die entsprechenden Symbole tippst.)
journal.document.adventurers_guide.surprise_attacks.title=Überraschungsangriffe
journal.document.adventurers_guide.surprise_attacks.body=Überraschungsangriffe treffen garantiert, deshalb sind sie gegen wendige Feinde wie Kabelschlangen und Vormieterspuk besonders nützlich. Frag jeden Türsteher, der kurz aufs Handy geschaut hat.\n\nDu kannst Feinde überraschen, wenn sie dich verfolgen und dabei eine Türöffnung betreten, oder wenn sie dich auf andere Weise aus den Augen verlieren.
journal.document.adventurers_guide.identifying.title=Gegenstände identifizieren
journal.document.adventurers_guide.identifying.body=Die Farbe jeder Pulle und das Runen-Aktenzeichen jedes Formulars sind in jedem Lauf anders, wie die Etiketten im Späti nach dem Lieferantenwechsel. Nicht identifizierte Ausrüstung kann aufgewertet oder verzaubert sein, wenn du Glück hast, sie könnte aber auch verflucht sein!\n\nAnmeldebescheinigungen (identifizieren), Modernisierungsbescheide (verbessern) und Widerspruchsformulare (entfernen Flüche) sind sehr nützlich, wenn du das Risiko beim Benutzen nicht identifizierter Ausrüstung verringern willst.\n\n(Eine Liste aller identifizierten Gegenstände findest du auf der Registerkarte Katalog in deinem Tagebuch.)
journal.document.adventurers_guide.food.title=Umgang mit Hunger
journal.document.adventurers_guide.food.body=Nahrung klug einzuteilen ist eines der besten Dinge, die du für deine Überlebenschancen tun kannst. Du musst nicht sofort etwas essen, wenn du hungrig wirst! Der Döner läuft dir nicht weg. Er wird nur mit jeder Region teurer.\n\nWenn du nicht gerade verhungerst, regeneriert sich deine Gesundheit allmählich. Wenn du also bei voller Gesundheit isst, wird diese Regeneration vergeudet!\n\nWenn du deine Mahlzeiten nach deiner Gesundheit ausrichtest, reicht deine Nahrung viel länger.
journal.document.adventurers_guide.alchemy.title=Alchemie & Kleinodien
journal.document.adventurers_guide.alchemy.body=Wenn du einen verbrauchbaren Gegenstand nicht besonders nützlich findest, kannst du ihn stattdessen als Zutat in einem Alchemiekessel verwenden oder in vielseitig verwendbare alchemische Energie umwandeln. Upcycling, aber mit Ergebnis. Durch die Umwandlung von Pullen oder Formularen in Energie werden diese außerdem identifiziert!\n\nKleinodien sind eine besondere Art Ausrüstung, die man mittels Alchemie herstellen und verbessern kann. Sie werden aus einem magischen Katalysator und nur ein wenig alchemischer Energie hergestellt.\n\n(Du kannst den ersten Alchemiekessel auf Ebene 3 oder 4 des Untergrunds finden. In der Nähe des Kessels liegen außerdem Seiten eines Buchs mit Alchemierezepten.)
journal.document.adventurers_guide.dieing.title=Niederlagen einstecken
journal.document.adventurers_guide.dieing.body=Die Erkundung des Neuköllner Untergrunds ist ein gefährliches Unterfangen, und die meisten Abenteurer finden hier irgendwann ihr Ende. Der Rest zieht nach Brandenburg. Die Hausverwaltung verbucht beides als Mieterwechsel.\n\nGlück spielt eine Rolle, aber die besten Abenteurer nutzen jeden kleinen Trick, um ihre Erfolgschancen zu verbessern.\n\n(Lass dich nicht entmutigen, wenn du oft stirbst; dieses Spiel ist schwer! Konzentriere dich darauf, das Spiel zu lernen und dich stetig zu verbessern, und nicht darauf, sofort zu gewinnen.)
journal.document.adventurers_guide.searching.title=Suche
journal.document.adventurers_guide.searching.body=Der Untergrund ist voller Geheimtüren und versteckter Hundehaufen, die auf den ersten Blick unsichtbar sind. Hinter mancher Wand liegt ein Kellerverschlag, der laut Hausverwaltung niemandem gehört. Du kannst etwas Zeit investieren und gründlich suchen, wenn du vermutest, dass in der Nähe eine Tür oder ein Haufen versteckt ist.\n\n(Du kannst alle Felder um dich herum durchsuchen, indem du doppelt auf die Lupentaste tippst. Vielleicht gibt es sogar verborgene Türen nahe der Stelle, an der du diese Seite gefunden hast!)
journal.document.adventurers_guide.strength.title=Stärke
journal.document.adventurers_guide.strength.body=Du hast keine Zeit, mit den Waffen und Rüstungen, die du hier findest, zu trainieren. Die Muckibude hat sowieso nur für Mitglieder mit Jahresvertrag offen. Also brauchst du rohe Kraft, um sie effektiv einzusetzen.\n\nKraft-Wegbier und Modernisierungsbescheide sind der effektivste Weg, die Anforderungen für schwerere, höherwertige Ausrüstung zu erfüllen.\n\nEs ist wichtig, dass du darauf hinarbeitest, hochrangige Gegenstände nutzen zu können, aber du solltest die Ausrüstung, die du schon früher einsetzen kannst, nicht völlig ignorieren.
journal.document.adventurers_guide.upgrades.title=Verbesserungen
journal.document.adventurers_guide.upgrades.body=Je tiefer du in den Untergrund vordringst, desto wichtiger wird magisch verbesserte Ausrüstung höherer Stufen; du brauchst aber auch die nötige Stärke, um sie richtig zu verwenden. Unten im Renditequartier wird nichts billiger.\n\nZauberstäbe, Ringe und Artefakte benötigen keine Stärke, haben aber einen begrenzten Nutzen oder helfen nicht direkt im Kampf.\n\nKluge Entscheidungen beim Aufwerten sind sehr wichtig, um die frühen Abschnitte zu überleben, und eine Grundlage für den Erfolg im späteren Verlauf des Abstiegs.
journal.document.adventurers_guide.looting.title=Effektives Plündern
journal.document.adventurers_guide.looting.body=Räume hinter verschlossenen Türen oder anderen Hindernissen enthalten oft bessere Beute. Wann immer ein Hindernis deinen Weg versperrt, findest du in der Regel auf derselben Ebene einen Gegenstand, der dir weiterhilft. Anders als beim Amt.\n\nIn jeder Region aus fünf Ebenen kann man 2 Kraft-Wegbiere und 3 Modernisierungsbescheide finden, das ist also ein guter Anhaltspunkt dafür, wie gründlich du die Gegend erkundest.\n\n(Eine Liste wichtiger Orientierungspunkte und unbenutzter Schlüssel findest du auf der Registerkarte Kieznotizen im Tagebuch.)
journal.document.adventurers_guide.levelling.title=Erfahrung sammeln
journal.document.adventurers_guide.levelling.body=Höhere Stufen erhöhen deine Statuswerte und bringen dir Talentpunkte, was zusammen im Kampf einen großen Unterschied ausmacht. Am besten hast du für jede Ebene des Untergrunds mindestens eine Erfahrungsstufe.\n\nEs kann verlockend sein, durchzuhetzen wie zur letzten Ringbahn und dabei Erkundung oder Kampf zu vermeiden, aber dadurch gehen dir sowohl Vorräte als auch Erfahrung durch die Lappen.\n\n(Du kannst Informationen über deinen Helden, einschließlich der Erfahrung, in der Statusleiste oben auf der Spieloberfläche sehen. Tippe auf dein Heldenporträt, um noch mehr Informationen zu erhalten.)
journal.document.adventurers_guide.positioning.title=Positionierung
journal.document.adventurers_guide.positioning.body=Strategie ist ebenso wichtig wie Ausrüstung. Schlechte Situationen, zum Beispiel eingekreist zu werden wie ein Tourist von Flyer-Verteilern, lassen sich oft durch gute Positionierung vermeiden.\n\nDie meisten Ebenen haben zum Beispiel schmale Gänge, die Feinde dazu zwingen, einzeln gegen dich anzutreten. Diese Gänge haben oft auch Türen, die sich für Überraschungsangriffe nutzen lassen!\n\nEs gibt auch viele kleinere Möglichkeiten, Umgebungsmerkmale wie Gras, Wasser oder Haufen zu deinem Vorteil zu nutzen.
journal.document.adventurers_guide.magic.title=Magische Attacken
journal.document.adventurers_guide.magic.body=Magische Angriffe schneiden durch Rüstungen hindurch, und man kann ihnen schwer ausweichen. Das bedeutet, dass deine Zauberstäbe sehr zuverlässig Schaden verursachen, es macht magisch begabte Feinde aber auch sehr gefährlich!\n\nMagische Angriffe haben jedoch immer einen Nachteil. Bei Zauberstäben ist das ihre begrenzte Aufladung, und magisch begabte Feinde können ihre Magie meist nicht aus nächster Nähe einsetzen.\n\nWenn du es mit magisch begabten Feinden zu tun bekommst, ist es wichtig herauszufinden, wie du sie davon abhältst, Magie gegen dich einzusetzen. Unterbrechen hilft. Das weiß jeder, der schon mal in einer Hausversammlung saß.

journal.document.alchemy_guide.title=Handbuch der Hinterhof-Alchemie
journal.document.alchemy_guide.potions.title=Einleitung und Pullen
journal.document.alchemy_guide.potions.body=Willkommen zu den Praktischen Anwendungen der Alchemie, 3. Auflage, überarbeitet von einer Balkonkräuter-Initiative! Dieses Buch ist ein Referenzwerk mit Rezepten, mit denen man Gegenstände in einem Alchemiekessel herstellen kann.\n\nBeginnen wir mit dem Klassiker schlechthin: Pullen!\n\nGib drei Samenbomben in den Alchemiekessel, um eine zufällige Pulle abzufüllen! Zu jeder Art Samenbombe gibt es eine entsprechende Pulle; nimmst du mehrere Samenbomben der gleichen Art, ist es wahrscheinlicher, dass die Pulle herauskommt, die zu diesen Samenbomben passt.
journal.document.alchemy_guide.stones.title=Runensteine erschaffen
journal.document.alchemy_guide.stones.body=Wenn du ein Formular in einen Alchemiekessel gibst, wird seine Magie in zwei Steine im Topf übertragen. Dadurch entstehen Runensteine, und das Formular wird identifiziert. Aus Papier wird Stein, wie bei jedem Bauantrag.
journal.document.alchemy_guide.energy_food.title=Energie und Essen
journal.document.alchemy_guide.energy_food.body=Viele Rezepte erfordern alchemische Energiekristalle, die entstehen, wenn man magische Verbrauchsgegenstände in einem Alchemiekessel zersetzt. Wer Pullen oder Formulare zu Energie kristallisiert, identifiziert sie dabei auch.\n\nManche Rezepte, die Energie benötigen, sind magisch, aber diese hier erinnern eher an traditionelle Kochrezepte. Omas Küche, nur mit mehr Funken.
journal.document.alchemy_guide.exotic_potions.title=Exotische Pullen
journal.document.alchemy_guide.exotic_potions.body=Pullen können mit Energie gemischt werden, sodass exotische Pullen entstehen. Diese haben stärkere Effekte, sind aber oft auf ganz andere Weise nützlich. Wie ein Craft-Bier, das eigentlich ein Reinigungsmittel ist.
journal.document.alchemy_guide.exotic_scrolls.title=Exotische Formulare
journal.document.alchemy_guide.exotic_scrolls.body=Exotische Formulare können mit etwas Energie und einem Formular erzeugt werden. Sie sind etwas stärker und teurer als exotische Pullen. Der Vordruck ist derselbe, nur das Kleingedruckte ist gemeiner.
journal.document.alchemy_guide.bombs.title=Verbesserte Bomben
journal.document.alchemy_guide.bombs.body=Eine ganz normale Lachgasflasche kann mit einem bestimmten Gegenstand kombiniert werden, um eine verbesserte Bombe herzustellen. Bitte nicht auf dem Balkon testen, die Nachbarn haben schon genug Material für die Hausversammlung.
journal.document.alchemy_guide.weapons.title=Verbesserung von Waffen
journal.document.alchemy_guide.weapons.body=Manche der leichten oder magischen Waffen können alchemisch aufbereitet werden!\n\nJeder Satz Wurfwaffen produziert genug Flüssigmetall, um einen anderen Satz Wurfwaffen der gleichen Stufe und des gleichen Ranges vollständig zu reparieren. Das Alchemisieren eines Satzes Wurfwaffen zerstört diesen Satz komplett, auch wenn du gerade nicht alle Exemplare davon bei dir hast!\n\nEin Zauberstab produziert genug arkanes Harz, um zwei Zauberstäbe der gleichen Stufe zu verbessern, aber nicht höher als +3.
journal.document.alchemy_guide.brews_elixirs.title=Bowlen und Elixiere
journal.document.alchemy_guide.brews_elixirs.body=Bowlen und Elixiere sind fortgeschrittene Pullen mit einer Vielzahl von Effekten, meist für eine einzige Anwendung. Die Kiezkneipe nennt so etwas "Hausmischung".
journal.document.alchemy_guide.spells.title=Zaubersprüche
journal.document.alchemy_guide.spells.body=Zauber werden in Kristallen eingefangen und bieten eine Vielzahl von Effekten, meist für mehrere Anwendungen.

journal.document.intros.title=Einführungen zu den Regionen
journal.document.intros.discover_hint=Du kannst diesen Text in einer bestimmten Region finden, aber nur nachdem du alle vorherigen Texte dieses Sets gefunden hast.
journal.document.intros.dungeon.title=Unter Neukölln
journal.document.intros.dungeon.body=Du wolltest nur kurz in den Keller, dein Fahrrad holen. Auf der ersten Stufe lag ein Hundehaufen, hinter dir fiel die Brandschutztür ins Schloss, und der Schlüssel liegt irgendwo weiter unten. Die Treppe nach unten wurde offenbar öfter verlängert als die U7.\n\nGanz unten soll er liegen: der letzte unbefristete Mietvertrag Berlins. Altbau, Kaltmiete von 1987, keine Staffel, kein Index, kein Eigenbedarf. Seit er erwacht ist, sickert Magie nach oben. Der Schimmel spricht, die Sperrmüllberge beißen, und niemand fühlt sich zuständig. Alle wollen diesen Vertrag. Offen ist nur, für wen.\n\nHol den Mietvertrag. Der Spätimann hat vielleicht noch offen.
journal.document.intros.sewers.title=Neuköllner Hinterhöfe
journal.document.intros.sewers.body=Hinter dem Vorderhaus kommt der erste Hinterhof, dahinter der zweite, dahinter ein Keller, und unter dem Keller Kanäle, Waschküchen und Räume, die im Exposé als "Atelier" bezeichnet wurden. Hier beginnt die Unterwelt von Neukölln: Mülltonnen, Wäscheleinen, Fahrradleichen und Pfandkisten, so weit das Auge reicht.\n\nPfandratten und Kabelschlangen haben die Hausverwaltung übernommen, und die ist genauso gut erreichbar wie vorher. Weiter unten wächst etwas aus Feuchtigkeit und jahrzehntelang ignorierten Mängelanzeigen: der Mietschimmel.\n\nDie Magie ist hier noch schwach. Halte Ausschau nach Vorräten, untersuche unbekannte Wesen und lass dich nicht einkreisen. Der Ausgang ist selten dort, wo die Maklerin ihn eingezeichnet hat.
journal.document.intros.prison.title=Das Amt ohne Termin
journal.document.intros.prison.body=Unter den Hinterhöfen liegt eine vergessene Bürgeramt-Außenstelle, eingerichtet in einem alten Gefängnis. Die Zellen blieben. Man nannte sie jetzt Wartezonen. Über jedem Gang hängt eine Wartenummern-Anzeige, die seit Jahren 0815 zeigt.\n\nAls die dunkle Magie eintraf, liefen die Vorgänge einfach weiter. Wachleute bewachen längst abgelaufene Fristen, Antragsteller warten auf einen Aufruf, der nie kommt, und hinter den Schaltern stapeln sich Akten, die nicht mehr wissen, wem sie gehören. Ein Schild verspricht baldige Digitalisierung. Das Schild ist aus Messing.\n\nAuf Ebene 6 betreibt der Spätimann seinen Laden. Vorräte kaufen, Fundstücke verkaufen, tief durchatmen. Hier gibt es endlich jemanden, der zuständig ist.
journal.document.intros.caves.title=Die ewige Baustelle
journal.document.intros.caves.body=Hier sollte einmal die Verlängerung von U7 und U8 fertig werden. Was genau, wann genau und wer genau, steht in einer Akte, die unter einer anderen Baustelle liegt. Zwischen Gleisbett, Absperrbaken und Tunnelgerüsten graben längst ganz andere: Maschinen, Höhlenwesen und Bauwichte, die eigene Pläne verfolgen und nie eine Ausschreibung gewonnen haben.\n\nDie Magie hat die Arbeiten beschleunigt. Leider ausschließlich den Rückbau. Am Bauzaun klebt ein Plakat von Kanzler März: „Wir bauen!“ Es ist das Einzige hier, das regelmäßig erneuert wird.\n\nAuf Ebene 11 hält der Spätimann Nachschub bereit. Er nennt diesen Standort "vorübergehend". Das Schild ist inzwischen versteinert.
journal.document.intros.city.title=Das Renditequartier
journal.document.intros.city.body=Unter der Baustelle lag einst ein lebendiger Zwergenkiez mit Kneipen, Werkstätten und viel zu vielen Hausversammlungen. Dann versprach sein König, der heutige König der Eigentumswohnungen, "Entwicklungspotenzial", und aus Zwergen wurden Eigentümerzwerge. Die Mieten stiegen, die Tore schlossen sich, die Glasfassaden wuchsen, und die dunkle Magie bekam einen Sitz im Aufsichtsrat.\n\nZurück blieben prunkvolle Hallen mit Concierge-Lobby, in denen niemand wohnt, und Bewohner, die ihrem Herrscher auf unheimliche Weise gehorchen. Die Luxussanierung ist abgeschlossen. Die Bewohner auch.\n\nAuf Ebene 16 findest du den letzten Späti. Danach wird die Nahversorgung deutlich schwieriger.
journal.document.intros.halls.title=Unter dem Rathaus
journal.document.intros.halls.body=Unter allen Kellern, unter allen Baustellen und unter allen Renditeobjekten liegen diese Hallen: das Fundament unter dem Rathaus. Auf keinem Fluchtplan, in keinem Haushalt. Irgendwo über dir fährt ein Paternoster, der nie ankommt. Die Akten hier unten sind zu Fels geworden. Auf einer steht noch lesbar: „Wasserschaden 3. OG, gemeldet 2009, in Bearbeitung.“\n\nDämonische Wesen bewachen den Weg zum unbefristeten Mietvertrag. Die Macht hinter ihnen heißt der Ewige Mietspiegel, das Grundübel unter allem. Selbst der König der Eigentumswohnungen war nur sein Mieter. Ob der Mietspiegel ein uralter Gott, eine Tabelle oder eine Beteiligungsgesellschaft ist, lässt sich bisher nicht klären.\n\nGanz unten hängen noch die alten Ortsschilder: Rixdorf. Früher war hier alles Rixdorf. Und da wollte auch keiner wohnen.
journal.document.intros.halls.discover_hint=Du kannst diesen Text in einer bestimmten Region finden, aber nur nachdem du alle vorherigen Texte dieses Sets gefunden hast.

journal.document.sewers_guard.title=Die Briefe der Hofwächterin
journal.document.sewers_guard.discover_hint=Du kannst diesen Text in einer bestimmten Region finden, aber nur nachdem du alle vorherigen Texte dieses Sets gefunden hast.
journal.document.sewers_guard.new_position.title=Meine neue Anstellung!
journal.document.sewers_guard.new_position.body=Am 85. des Herbstes 375\nLiebe Mama und Papa,\n\nich habe es euch doch gesagt: Die ganze Schufterei beim Ordnungsdienst zahlt sich aus. Ich wurde gerade befördert! Mit Dienstausweis und allem!\n\nIch bin jetzt in einem Sondertrupp, der unter den Hinterhöfen arbeitet. Offenbar gibt es da unten Probleme mit Ungeziefer und "ungeklärten Nutzungsverhältnissen", und unsere Aufgabe ist es, alles auszuräuchern. Es ist Dreckarbeit, aber in den Kellern ist es im Winter warm, und man zahlt uns das Dreifache vom normalen Streifendienst! Für die Dienstunterkunft musste ich zwar drei Monatsmieten Kaution hinterlegen, aber die bekomme ich beim Auszug ja zurück. Hat der Verwalter versprochen.\n\nEs ist nur alles ein wenig geheim, daher darf ich diesen Brief eigentlich gar nicht abschicken. Aber es würde sich seltsam anfühlen, euch gar nicht zu schreiben, also schreibe ich trotzdem. Vielleicht kann ich euch die Briefe ja eines Tages zeigen.\n\nLiebe Grüße,\n- Sonja
journal.document.sewers_guard.dangerous.title=Eine gefährliche Arbeit...
journal.document.sewers_guard.dangerous.body=Am 88. des Herbstes 375\nLiebe Mama und Papa,\n\njetzt verstehe ich, warum die Bezahlung so gut ist: Die Keller sind voller Monster! Das "Ungeziefer" sind riesige, bissige Pfandratten, und die "ungeklärten Nutzungsverhältnisse" sind ganze Rotten zorniger Besichtigungswichte, die jede Wand mit Maßband abmessen und jeden anfallen, der ihnen im Weg steht!\n\nZum Glück weiß der Rest des Trupps ziemlich genau, was zu tun ist. Unser Anführer Thomas ist Experte in solchen Dingen, er hat schon drei Zwangsräumungen überlebt. Ich gebe mir Mühe, schnell zu lernen, damit ich den anderen nicht zur Last falle.\n\nDiese Arbeit ist viel gefährlicher, als ich dachte. Ich bin froh, dass ich diese Briefe nicht abschicken kann, denn ich will nicht, dass ihr euch Sorgen macht.\n\nIch passe auf mich auf, versprochen.\nSonja\n\nPS: Am Kellereingang hängt ein Zettel: „Wem gehört der Hund?“ Ich habe den Fall übernommen. Den Hund habe ich noch nicht gefunden. Nur seine Spuren. Auf jeder Stufe.
journal.document.sewers_guard.crabs.title=Kanalpanzer!
journal.document.sewers_guard.crabs.body=Am 11. des Winters 376\nLiebe Mama und Papa,\n\nals wären die Ratten nicht schon schlimm genug: Weiter unten in den Kanälen gibt es auch noch Kanalpanzer, gepanzerte Krabbenviecher, so groß wie ein Lastenrad! Eins davon stürmte direkt an mir vorbei und hat Lee übel erwischt, bevor wir es erledigen konnten. Thomas sagt, es sei nicht meine Schuld, aber ich weiß, dass er nur nett sein will.\n\nZum Glück haben wir auf dem Weg nach unten einen Abenteurer getroffen, der noch etwas Pflasterkraut-Salbe übrig hatte. Ohne das Zeug hätte Lee es vielleicht nicht geschafft.\n\nBevor er ging, starrte der Abenteurer auf einen vertrockneten Tannenzweig; er sagte, den habe ihm seine Mutter geschickt. Warum riskiert jemand hier unten sein Leben, wenn es da oben jemanden gibt, dem er nicht egal ist?\n\nAber genau das tue ich ja auch, oder? Mir wächst die Sache langsam über den Kopf.
journal.document.sewers_guard.guild.title=Die Nummernklauer-Gilde
journal.document.sewers_guard.guild.body=Am 23. des Winters 376\nLiebe Mama und Papa,\n\ndiesmal keine neuen Monster. Stattdessen sind wir auf Streife über eine kleine Gruppe der Nummernklauer-Gilde gestolpert, mitten in einem Fahrradkeller voller Bolzenschneider.\n\nIch habe über die Gilde nur Schlechtes gehört, aber die anderen aus meinem Trupp waren fast schon freundlich zu ihnen. Thomas hat mit einem von ihnen Informationen und Vorräte getauscht, bevor wir wieder auseinandergingen. Er hat sogar ein Fahrrad zurückbekommen, das ihm vor acht Jahren geklaut wurde.\n\nIch verstehe das nicht: Sollten wir nicht die Gesetzlosen hier unten loswerden? Thomas sagte sogar, wir sollen niemandem von der Dienststelle davon erzählen. Ihre Informationen und Vorräte waren allerdings sehr nützlich, und noch mehr Kämpfe hätten wir nicht verkraftet.\n\nIch schätze, hier unten sitzen wir einfach alle im selben Hinterhof.
journal.document.sewers_guard.lost.title=Wir haben uns verlaufen
journal.document.sewers_guard.lost.body=Am 40. des Winters 376\n\nThomas und ich haben uns verlaufen. Wir wurden vom Rest des Trupps abgeschnitten, als wir gegen ein paar Besichtigungswichte kämpften. Wir sind beide unverletzt, aber die tieferen Keller sind wie ein Labyrinth. Hinterhof, Seitenflügel, Hinterhof, Waschküche, und dann wieder derselbe Hinterhof. Von der Decke tropft es. Thomas sagt, das sei der Wasserschaden von 2009, der gehöre hier quasi zum Trupp.\n\nThomas sagt, er kenne einen Weg nach draußen, aber der beginnt am Eingang zur alten Amtsaußenstelle am tiefsten Punkt der Kanäle. Ich habe wirklich keine Lust, noch tiefer zu gehen, aber wir haben keine Rationen mehr, und es wäre schneller, einfach hinunterzugehen, statt umherzuirren und unsere Streifenroute zu suchen.\n\nEs wird schon gut gehen. Thomas weiß, was er tut.
journal.document.sewers_guard.not_worth.title=Das ist es nicht wert
journal.document.sewers_guard.not_worth.body=Thomas und ich sind am Eingang zum Amt in einen gewaltigen Schimmelberg gerannt. Der Mietschimmel. Er war größer als die Wand, aus der er gewachsen ist. Bevor wir etwas tun konnten, hat er uns mit dunkler Magie angegriffen. Thomas hat das meiste abbekommen. Jetzt ist er tot.\n\nKein Geld der Welt ist das wert. Ich fliehe über die Route, von der Thomas mir erzählt hat. Dann nehme ich, was ich beim Ordnungsdienst verdient habe, und ziehe mit meinen Eltern aus dieser verfluchten Stadt weg. Ein kleiner Teil von mir hofft noch, dass der Senat einen Plan für all das hier hat, aber ich bezweifle es.\n\nIch lasse diese Briefe als Warnung für andere hier. Es sind nicht nur Pfandratten und Kanalpanzer; hier unten ist etwas ganz und gar... faul. Und es gehört niemandem, also macht auch niemand etwas dagegen.

journal.document.prison_warden.title=Das Diensttagebuch der Amtsleiterin
journal.document.prison_warden.discover_hint=Du kannst diesen Text in einer bestimmten Region finden, aber nur nachdem du alle vorherigen Texte dieses Sets gefunden hast.
journal.document.prison_warden.journal.title=Ein Tagebuch führen
journal.document.prison_warden.journal.body=Am 1. des Frühlings 362\n\nDies ist der erste Eintrag im Diensttagebuch von Kiana Schmidt, Leiterin der unterirdischen Außenstelle. Bei allem, was hier in letzter Zeit vor sich geht, habe ich beschlossen, ein Tagebuch zu führen, um meine Gedanken zu sortieren. Dienstlich vorgesehen ist das nicht. Dienstlich vorgesehen ist hier gar nichts.\n\nEs war noch nie leicht, eine Behörde eine halbe Meile unter der Erde zu leiten, aber in letzter Zeit scheint eine Art organisierte Störung abzulaufen. Wartende verhalten sich plötzlich grundlos seltsam, ziehen dreimal hintereinander eine Wartenummer und können hinterher nicht erklären, warum.\n\nEinige meiner Wachleute erzählen, dass es in der Außenstelle spukt. Ich kann nicht zulassen, dass meine eigenen Leute Gerüchte verbreiten, aber ich kann ihnen auch nicht verübeln, dass ihnen unwohl ist.\n- Schmidt
journal.document.prison_warden.recruits.title=Neue Rekruten
journal.document.prison_warden.recruits.body=Am 80. des Frühlings 362\n\nWie versprochen sind heute neue Rekruten eingetroffen. Das Übliche: einige wenige Vielversprechende und eine Menge Haudraufs, die nur aufs Geld aus sind und "Serviceorientierung" für eine Kampfsportart halten. Trotzdem sollten die ganzen neuen Muskeln gegen die neuerdings unbändigen Wartenden helfen.\n\nBei so einer Arbeit ist es wichtig zu wissen, wem man vertrauen kann. Ein neuer Rekrut, Thomas, wirkt besonders vielversprechend. Er hat seine Personalakte selbst sortiert. Ich brauche jede Hilfe, die ich kriegen kann, und wenn er sich gut macht, sorge ich für eine schnelle Beförderung.\n- Schmidt
journal.document.prison_warden.mines.title=Versiegelung des Schachts
journal.document.prison_warden.mines.body=Am 54. des Winters 363\n\nHeute kam ein Trupp Ingenieure aus der Stadt; sie sagten, sie würden den alten Zugang zum U-Bahn-Schacht unter uns versiegeln. Die Stadt will sich offenbar nicht mehr um die Instandhaltung der Tunnel kümmern, die Baustelle ruht "bis auf Weiteres". Wie üblich wurde ich nicht vorab informiert. Der Bescheid kam drei Tage nach der Versiegelung.\n\nIhr Chefingenieur erzählte auch irgendeinen Unsinn über die Magie der Eigentümerzwerge, die aus dem Schacht dringe. Ich glaube kein Wort davon.\n\nMit dem neuen Personal ist die Lage jetzt viel besser unter Kontrolle, aber die Wurzel des Problems ist immer noch nicht angegangen. Irgendetwas beeinflusst die Wartenden hier eindeutig, und ein paar zugemauerte Wände werden daran nichts ändern.\n- Schmidt
journal.document.prison_warden.rotberry.title=Die Faulbeere
journal.document.prison_warden.rotberry.body=Am 23. des Herbstes 363\n\nHeute ein nettes Geschenk von Felix bekommen. Eine Art hellroter Strauch, den man "Faulbeere" nennt. Endlich eine Büropflanze, die nicht aus Plastik ist.\n\nIch hatte ihm erzählt, wie trostlos es hier unten ist, und er hat sich das offenbar gemerkt. Er sagt, diese Pflanze mag weder Licht noch Wasser, ich muss also nur etwa einmal im Monat die Triebe zurückschneiden. Dieser Rückschnitt scheint wichtig zu sein, er hat ihn in seinem Brief gut ein Dutzend Mal erwähnt. Unterstrichen.\n\nNatürlich macht Felix nie etwas umsonst. Er sagt, die Samen dieser Pflanze eignen sich zur Herstellung von Zauberstäben, also muss ich ihm jedes Mal welche abgeben, wenn die Pflanze welche abwirft.\n- Schmidt
journal.document.prison_warden.no_support.title=Keine Unterstützung
journal.document.prison_warden.no_support.body=Am 11. des Frühlings 364\n\nWas zum Henker denken die sich im Bezirksamt? Nachdem ich dringend Unterstützung angefordert habe, kam gar nichts, nicht einmal eines ihrer üblichen Formschreiben, in denen sie meine Anfragen "zur Kenntnis nehmen". Nur ein Wahlplakat von Kanzler März: „Termine für alle. Ab der nächsten Legislatur.“\n\nWährenddessen wird es mit den Wartenden immer schlimmer, und selbst einige Wachleute machen jetzt Probleme. Wollen die das hier einfach eskalieren lassen, bis wir einen regelrechten Aufstand am Schalter haben?\n\nWenigstens ist Thomas immer zuverlässig. Seine Hilfe bei der Organisation war unbezahlbar, und seine Idee, die alten DM-100 Aufrufautomaten zu reaktivieren, war leider notwendig. Ich bin zuversichtlich, dass ich die Lage wieder in den Griff bekomme, ich brauche nur, verdammt noch eins, etwas Unterstützung!\n- Schmidt
journal.document.prison_warden.letter.title=Brief an Thomas
journal.document.prison_warden.letter.body=Thomas,\n\nDu warst ein guter Freund, also tue ich Dir einen Gefallen.\n\nWenn Du heute Abend Deine Schicht beginnst, verschließe und verbarrikadiere die Wartezone des Schalterspringers, wirf den Schlüssel in irgendeine Wandnische und mach, dass Du rauskommst. Es ist egal, dass die übrigen Wartenden unbeaufsichtigt sind, denn schon ziemlich bald wird niemand mehr diese Außenstelle verlassen können. Aber dieses Scheusal muss gut gesichert bleiben, denn wenn der Schalterspringer entkommt, kann keiner sagen, was er als Nächstes tut.\n\nLetzte Nacht ist die Anzeige in der Wartezone zum ersten Mal umgesprungen: 0815. Es war niemand mehr da, der aufstehen konnte.\n\nSprich mit niemandem darüber, und versuch nicht, mich zu finden. Eine Amtsleiterin geht mit ihrer Behörde unter. Das steht zwar in keiner Dienstanweisung, aber irgendwer muss ja zuständig sein.\n- Kiana

journal.document.caves_explorer.title=Das Bautagebuch des Forschers
journal.document.caves_explorer.discover_hint=Du kannst diesen Text in einer bestimmten Region finden, aber nur nachdem du alle vorherigen Texte dieses Sets gefunden hast.
journal.document.caves_explorer.expedition.title=Die Expedition beginnt!
journal.document.caves_explorer.expedition.body=Am 1. des Sommers 308\n\nHeute beginnt unsere vierwöchige Expedition in die verlassene Tunnelbaustelle der Zwerge (heute nennen sie sich Eigentümerzwerge)! Die Senatsverwaltung hat mich persönlich beauftragt, die Region zu begutachten. Meine wichtigsten Ziele sind, unerschlossene Rohstoffe zu finden und die Stollen für den späteren Bau einer Behördenaußenstelle zu prüfen. Und die U-Bahn-Verlängerung. Die kommt ja bald.\n\nIch kann mich durchaus selbst verteidigen, habe aber die Begleitung durch den Ordnungsdienst akzeptiert, weil der Senat darauf bestand. Ein Haufen Einfaltspinsel, aber solange sie mich nicht behindern, ist ihre Gegenwart hinnehmbar.\n\nWir planen, am Abend die Kanäle zu verlassen und den Schacht zu erreichen.\n- Archibald Drummond, Oberzauberrat, Institut für Zauberei Süd, Gutachter für Tiefbau und Übersinnliches.
journal.document.caves_explorer.gold.title=So viel Gold!
journal.document.caves_explorer.gold.body=Am 4. des Sommers 308\n\nUnsere ersten Tage waren tatsächlich sehr ergiebig! Nachdem wir ein Basislager eingerichtet hatten, erkundeten wir die oberen Abschnitte der Baustelle. Überall liegt nutzloser Plunder der Eigentümerzwerge herum, halb verbaute Gleisbetten, Absperrbaken und Pläne für Bauabschnitte, die nie begonnen wurden, aber viele der Stollenwände strotzen nur so vor Gold!\n\nLeider sind wir hier unten nicht die Ersten. Die Stollen wimmeln von aggressivem Getier, und ganze Trupps von Bauwichten interessieren sich ebenfalls für das Gold. Ich muss zugeben, dass ich meiner Eskorte unrecht getan habe; sie sind weit bessere Entdecker und Leibwächter, als ich erwartet hatte.\n\nTrotz dieses ersten Erfolgs haben wir immer noch einen Großteil der Baustelle vor uns.\n- Archibald
journal.document.caves_explorer.troll.title=Den Alten Polier getroffen
journal.document.caves_explorer.troll.body=Am 11. des Sommers 308\n\nIn den mittleren Abschnitten der Baustelle stießen wir auf ein freundliches Gesicht! Nun, zumindest... relativ freundlich. Ein alter Handwerker mit Haut wie Sichtbeton, der sich nur "der Alte Polier" nennt, hat sich hier eine kleine Schmiede eingerichtet, ganz ohne Genehmigung. Er ist grob und nicht sehr gesprächig, hat aber unsere Ausrüstung für etwas Gold repariert. Schneller als jeder Handwerker, der je einen Termin versprochen hat.\n\nLeider hat uns der Alte Polier auch erklärt, dass all das schöne Gold nicht so gut ist, wie es aussieht. Er nennt es "Dunkelgold", und offenbar zerfällt es schnell im Sonnenlicht. Das erklärt jedenfalls, warum sich hier nie jemand um die Rohstoffe gestritten hat.\n\nIch schätze, wir müssen noch tiefer graben, um zu sehen, ob es hier etwas von höherem Wert gibt.\n- Archibald
journal.document.caves_explorer.city.title=Der Eingang zum Quartier
journal.document.caves_explorer.city.body=Am 21. des Sommers 308\n\nDie dritte Woche liegt hinter uns, und nachdem wir zehn Tage lang immer tiefere Abschnitte kartiert haben, sind wir endlich am tiefsten Punkt der Baustelle angekommen. Wir fanden verschiedene metallische Baumaschinen und ein großes Tor, das den Eingang zur alten Metropole der Eigentümerzwerge versperrt.\n\nDer Alte Polier hat uns vor einigen dieser Maschinen gewarnt. Sie waren offenbar als Abwehrmechanismen gedacht und haben die unschöne Eigenart, anzuspringen, wenn man sie stört. Wir haben im Quartier der Eigentümerzwerge nichts verloren, und das Metall hätte nur geringen Schrottwert, also haben wir die Warnung beherzigt und uns auf den Rückweg gemacht.\n\nIch gebe zu, ich war neugierig, aber dort unten weiterzuforschen ist das Risiko sicher nicht wert.\n- Archibald
journal.document.caves_explorer.alive.title=Es lebt!
journal.document.caves_explorer.alive.body=Am 23. des Sommers 308\n\nEine der Maschinen der Eigentümerzwerge hat sich irgendwie aktiviert! Wir gingen nur vorbei, als sie plötzlich angriff und zwei aus unserer Gruppe mit ihren Metallfäusten beinahe erschlagen hätte. Zum Glück hatte ich meinen Laserpointer dabei. Einige gut gezielte Schüsse, und das abscheuliche Ding war nur noch Schrott. Der einzige Rückbau auf dieser Baustelle, der je termingerecht war.\n\nWas mich beunruhigt: Wir haben rein gar nichts getan, um die Maschine zu provozieren. Die Eigentümerzwerge können sie kaum so aggressiv konstruiert haben, aber es war, als hätte das Ding uns auflauern wollen!\n\nWenigstens konnte ich meinen Begleitern dieses eine Mal behilflich sein.\n- Archibald
journal.document.caves_explorer.report.title=Abschlussbericht
journal.document.caves_explorer.report.body=Am 28. des Sommers 308\n\nHeute packen wir unsere Sachen und machen uns für den Aufbruch bereit. Ausgerechnet jetzt werden einige aus unserer Gruppe von schrecklichen Albträumen heimgesucht, seit diesem Zwischenfall mit der aggressiven Maschine. Sicher nur Übermüdung, aber ihre Albträume sind sich beunruhigend ähnlich.\n\nFazit: Die oberen Abschnitte der Baustelle sind relativ sicher. Sollte man eine Verwendung für das Dunkelgold finden, wäre sein Abbau ziemlich lukrativ. Die großen freien Flächen würden sich auch gut für die Baupläne der Stadt eignen. Die tieferen Abschnitte sind jedoch gefährlicher und sollten gemieden werden.\n\nIch schreibe all diese Erkenntnisse in den kommenden Tagen in meinem Abschlussbericht auf. Voraussichtliche Fertigstellung der U-Bahn laut meiner Schätzung: in zwei Jahren. Höchstens drei.\n- Archibald

journal.document.city_warlock.title=Das Tagebuch des Abschreibungshexers
journal.document.city_warlock.discover_hint=Du kannst diesen Text in einer bestimmten Region finden, aber nur nachdem du alle vorherigen Texte dieses Sets gefunden hast.
journal.document.city_warlock.old_king.title=Der König ist tot
journal.document.city_warlock.old_king.body=Wir schreiben den 5. Tag des 2. Monats im Jahre 33 des Zeitalters der Magie. Sollte ein Überweltler dies lesen: Das entspricht einem Zeitpunkt im Winter 264. Mein Name ist Thymor Zahir, und soweit ich weiß, bin ich das letzte freie Mitglied am Hof der Eigentümerzwerge.\n\nUnser alter König ist tot, ersetzt durch einen meiner ehemaligen Kollegen, der vor Machtgier den Verstand verloren hat. Er nennt seine Herrschaft "Aufwertung". Die anderen Mitglieder des Hofs, diese Narren, haben sich ihm unterworfen und dabei ihren freien Willen verloren. Nur ich sah die Gefahr kommen und floh, bevor das Ritual vollendet war.\n\nDer Innere Kreis ist gefallen, doch die Macht des Neuen Königs hat noch nicht jeden erreicht. Ich muss so schnell wie möglich einen Widerstand aufbauen. Ich lasse nicht zu, dass unser lebendiger Kiez zum Anlageobjekt dieses Größenwahnsinnigen wird!
journal.document.city_warlock.resistance.title=Der Widerstand
journal.document.city_warlock.resistance.body=Die Kunde hat sich schnell verbreitet. Nur ein paar Tage sind vergangen, und schon habe ich eine kleine Armee von Anhängern des Alten Königs versammelt. Nur wenige sind in der Magie geübt, aber fast der gesamte Orden der Concierge-Mönche steht in unseren Reihen, und die sind durch jahrelange Mieterversammlungen bestens in zähem Widerstand geschult. Mit einem verrückten Eigentümerzwerg und seinem Hofstaat aus willenlosen Dienern sollten wir es gut und gern aufnehmen können.\n\nInzwischen hat sich der Neue König in den inneren Kammern unseres Quartiers verkrochen, hinter einer Concierge-Lobby. Gewiss hat er einen Großteil seiner Macht verbraucht und will sich erholen, bevor er auf weiteren Widerstand stößt.\n\nWir beginnen unseren Angriff binnen weniger Stunden. Mit etwas Glück können wir einen Übergangsrat bilden und unserem wunderbaren Kiez wieder Frieden und Sicherheit bringen, bevor der neue Tag anbricht.
journal.document.city_warlock.failure.title=Fehlschlag
journal.document.city_warlock.failure.body=Es scheint, auch ich bin ein Narr. Ich nahm an, der Neue König bräuchte die freiwillige Unterwerfung des Hofs, doch jetzt weiß ich, dass er selbst jene kontrollieren kann, die sich ihm widersetzen.\n\nBlind und naiv habe ich die Stärksten des Widerstands direkt vor seine Türschwelle geführt, und er musste sie nur noch, einen nach dem anderen, zu seinen Dienern machen. Nun wogen Wellen seiner nekrotischen Energie durch das Quartier und verwandeln die meisten in seine Handlanger.\n\nDie wenigen, die noch einen freien Willen haben, fliehen, verdrängt an den Rand ihres eigenen Kiezes. Ich habe beschlossen, zurückzubleiben, so gut es geht zu beobachten und auf ein Schlupfloch zu warten. Mit meiner Magie sollte ich eine Zeit lang sicher im Verborgenen bleiben können.
journal.document.city_warlock.more_powerful.title=Immer stärker
journal.document.city_warlock.more_powerful.body=Es fällt schwer, das Zeitgefühl nicht zu verlieren; seit meinem letzten Eintrag muss etwa eine Woche vergangen sein. Unsere Zivilisation ist wahrhaftig zusammengebrochen. Die Tore sind verriegelt, und alles, was unsere Gemeinschaft ausgemacht hat, funktioniert nicht mehr. Die Kneipen sind Showrooms, die Werkstätten Lofts. Leere Körperhüllen von Eigentümerzwergen schleppen sich durch die Hallen. Vor der Lobby hat sich gestern ein Oberwelt-Kanzler namens März fotografieren lassen, unter einem Plakat, das ein aufgeräumtes Stadtbild verspricht. Aufgeräumt wurden wir.\n\nBei alledem wird der Neue König auf unerklärliche Weise immer mächtiger. Mit jedem Tag wird die Macht seines Willens stärker, aber sie verändert sich auch. Ich kann es nicht beschreiben, aber ich habe das Gefühl, er ist inzwischen gar kein Eigentümerzwerg mehr.\n\nIch muss mir eingestehen, dass es wohl das Beste ist, diese Ereignisse einfach zu dokumentieren. Ich bleibe hier, solange es geht, und ziehe mich zurück, sobald meine Willenskraft zu schwinden beginnt.
journal.document.city_warlock.new_power.title=Eine neue Macht
journal.document.city_warlock.new_power.body=Was geht hier vor? Die Macht, die der Neue König ausstrahlt, ist wahrlich anders als zu Beginn, aber da ist noch etwas anderes. Diese neue Macht scheint aus dem tiefsten Fundament des Quartiers zu strömen.\n\nNoch seltsamer: Auch in den oberen Ebenen der Metropole ist alles zum Erliegen gekommen. Ich weiß nicht, was weiter unten geschieht, aber es scheint fast die gesamte Aufmerksamkeit des Neuen Königs zu fesseln.\n\nEs wird gefährlich, in die tieferen Hallen zurückzukehren, aber ich muss wissen, was diese Veränderungen verursacht. Vielleicht hat der Neue König doch eine Schwachstelle?
journal.document.city_warlock.seen_it.title=Ich habe es gesehen
journal.document.city_warlock.seen_it.body=Ich habe gesehen, was weiter unten ist, doch ich vermag es nicht zu beschreiben. Meine Hände zittern unkontrolliert, während ich versuche, meine Gedanken aufzuschreiben.\n\nWarum geschieht all das? Ist der Neue König dafür verantwortlich? Es ergibt keinen Sinn. Hat sein rücksichtsloser Machtmissbrauch es angelockt? Ich wollte unseren Kiez retten, doch jetzt erkenne ich, dass die ganze Welt auf dem Spiel steht.\n\nSo gesehen ist der König das kleinere Übel. Ich habe keine andere Wahl: Um des größeren Guten willen muss ich mich ergeben. Führe mich, mein König, gebrauche mich als dein willfähriges Werkzeug, um den Ewigen Mietspiegel im Zaum zu halten!

journal.document.halls_king.title=Tagebuch des ???
journal.document.halls_king.discover_hint=Du kannst diesen Text in einer bestimmten Region finden, aber nur nachdem du alle vorherigen Texte dieses Sets gefunden hast.
journal.document.halls_king.rejection.title=Ablehnung
journal.document.halls_king.rejection.body=DIESE SCHWACHKÖPFE!\n\nIn den vergangenen 33 Jahren ist unser Königreich dank der neuen magischen Technologie aufgeblüht. Wir haben gelernt, Elementargeister zu beschwören und unserem Willen zu unterwerfen, aber nun sollen weitergehende Experimente "zu gefährlich" sein. Mein Konzept wurde abgelehnt. Mit Formular. Ohne Begründung.\n\nIch weiß genau, was wirklich dahintersteckt. Die Ablehnung meiner Theorien hat nichts mit ihrem Wert zu tun, sondern alles mit der Person, die sie einreicht. Sicher lachen sie jetzt alle hinter meinem Rücken über mich.\n\nWohlan, genug davon! Mich interessiert nicht, was sie sagen. Ich werde die tiefsten Tiefen unserer Welt allein erforschen, und alles, was ich finde, behalte ich für mich! Privatisieren nennt man das.\n- R.
journal.document.halls_king.amulet.title=Der Mietvertrag
journal.document.halls_king.amulet.body=ICH HABE IHN!\n\nIch wusste nicht genau, was ich finden würde. Aber was ich entdeckt habe, übersteigt meine wildesten Spekulationen. Ein Mietvertrag. Unbefristet. Altbau, Kaltmiete von 1987, keine Staffel, kein Index, kein Eigenbedarf. So viel Macht, die einfach nur daliegt und ergriffen werden will, und alles gehört mir! Kein Eigenbedarf? Den melde ich an. Meinen.\n\nDamit wird es niemand vom Hof mehr wagen, sich mir entgegenzustellen. Oh, ich erbebe vor Erregung, wenn ich mir all die Möglichkeiten vorstelle, sie zu demütigen. Zum Teufel, warum mich darauf beschränken? Ich habe genug Macht, jeden Einzelnen von ihnen zu vernichten, wenn ich will! Das mag übertrieben sein, doch ich darf nicht zu lange zögern, sonst schöpfen sie Verdacht.\n\nNatürlich werde ich ihn niemals unterschreiben lassen. Ich werde ihn besitzen.\n- R.
journal.document.halls_king.ritual.title=Das Ritual
journal.document.halls_king.ritual.body=Thymor hat mich heute öffentlich zur Rede gestellt und verlangt, dass ich meine neue Quelle der Macht offenlege. Transparenz! Ich habe ihn abgewimmelt, so gut es ging, doch ich spüre wieder die urteilenden Blicke der anderen Mitglieder des Hofs.\n\nIch hatte gehofft, die Ruhe vor dem Sturm etwas länger zu genießen, aber eigentlich macht es keinen Unterschied. Mein Vorgehen steht fest: Ich gebe vor, meine Macht durch ein neues Ritual erlangt zu haben, und biete an, dieses Ritual mit den anderen Abschreibungshexern und dem König abzuhalten. Eine Beteiligung für alle! Und sobald es vorbei ist, bin ich König!\n\nThymor wird selbstverständlich protestieren, doch bei der Aussicht auf so viel Macht wird ihm niemand mehr zuhören!\n\nALLE WERDEN SICH VOR MIR NIEDERWERFEN!\n- Der künftige König der Eigentumswohnungen
journal.document.halls_king.new_king.title=Ein neuer König
journal.document.halls_king.new_king.body=ICH BIN DER KÖNIG, AHAHAHAHAAA!\n\nSie haben mich einfach machen lassen! Ohne nennenswerte Überzeugungsarbeit haben sie mein Angebot angenommen, diese Macht in einem großen Ritual mit ihnen zu "teilen". In einem einzigen Augenblick wurden sie von einem Chor spöttischer Stimmen zu meinem neuen Hof schweigender Untertanen!\n\nWie zu erwarten, ist Thymor beim ersten Anzeichen von Ärger wie ein Feigling geflohen. Ich spüre bereits, wie er eine Widerstandsbewegung aufbaut. Ich lasse ihn vorerst gewähren, damit er all seine Verschwörer direkt vor meine Haustür führt!\n\nAuch das Königreich respektiert mich noch nicht vollends. Das werde ich aufwerten müssen. Erst die Fassaden, dann die Bewohner.\n- Der König der Eigentumswohnungen
journal.document.halls_king.thing.title=Das Ding
journal.document.halls_king.thing.body=Es gibt ein Problem. Mit Thymor bin ich mühelos fertig geworden, doch meine Aktivitäten in den oberen Ebenen haben offenbar Aufmerksamkeit erregt.\n\nEin gewisses... "Ding"... wurde in meine Welt gelockt und dringt nun durch die Tiefen der unteren Hallen nach oben. Schlimmer noch, genau dort habe ich den Mietvertrag versteckt! Welch heimtückische Kreatur! Warum muss sie mir meine Macht streitig machen, wo es doch dort draußen noch so vieles zu holen gibt?\n\nTrotz meiner Macht bezweifle ich, dass ich einfach losstürmen und es stellen kann. Seine wahre Macht scheint unermesslich, aber es muss einen Weg geben, sie zu begrenzen. ICH WERDE MEIN EIGENTUM VERTEIDIGEN!
journal.document.halls_king.attrition.title=Zermürbungstaktik
journal.document.halls_king.attrition.body=Ich habe einen Plan, wie ich dieses Ding besiege. Seine Macht ist unendlich, sein Zugriff auf diese Welt aber nicht. Es ist auf Lakaien und Avatare angewiesen, die seinen Willen ausführen, während es Macht sammelt, um den Mietvertrag zu ergreifen.\n\nIch besitze den Mietvertrag zwar nicht physisch, habe aber die vollständige Kontrolle über seine Macht. Mit allen Eigentümerzwergen zu meiner Verfügung bin ich ihm zahlenmäßig überlegen. Ich kann einfach fortlaufend Soldaten schicken, die es vom Mietvertrag fernhalten, und diesen Krieg durch reine Zermürbung gewinnen! Hinhalten, vertagen, aussitzen. Das hat hier unten schon immer funktioniert.\n\nICH, RODNEY, KÖNIG DER EIGENTUMSWOHNUNGEN, WERDE DICH ÜBERDAUERN, EWIGER MIETSPIEGEL!

