scenes.titlescene$changesbutton.title=Es gibt eine Aktualisierung!
scenes.titlescene$changesbutton.versioned_title=Es gibt eine Aktualisierung: %s
scenes.titlescene$changesbutton.desc=Shattered Pixel Dungeon, das Original, auf dem Pixel Dungeon Neukölln basiert, wird regelmäßig mit Überarbeitungen und komplett neuen Inhalten aktualisiert.\n\nDie Spielbalance wird dabei häufig verbessert, damit bestimmte Gegenstände, Helden oder Feinde nicht zu stark oder zu schwach sind.\n\nAktualisierungen enthalten außerdem Fehlerbehebungen und Verbesserungen der Stabilität. Hinweise hier beziehen sich auf das Original; dieser Fork wird davon unabhängig gepflegt.
scenes.titlescene$changesbutton.update=Zur Update-Seite gehen
scenes.titlescene$changesbutton.changes=Bildschirm mit den derzeitigen Änderungen

scenes.welcomescene.update_intro=Pixel Dungeon Neukölln wurde aktualisiert!
scenes.welcomescene.update_msg=Pixel Dungeon Neukölln basiert auf Shattered Pixel Dungeon v4.0, dem bisher wohl größten Update des Originals: eine riesige neue Quest, jede Menge neue Grafik, 6 neue Verzauberungen und viele kleinere Änderungen. Obendrauf kommt der Neuköllner Untergrund: neue Rollen, neue Texte, derselbe Späti. Dieser Fork ist in Entwicklung, nicht alles ist schon fertig.
scenes.welcomescene.patch_intro=Pixel Dungeon Neukölln hat Patches erhalten!
scenes.welcomescene.patch_bugfixes=Dieser Patch enthält Fehlerkorrekturen.
scenes.welcomescene.patch_translations=Dieser Patch enthält neue Übersetzungen.
scenes.welcomescene.patch_balance=Dieser Patch beinhaltet Balancing-Änderungen.
scenes.welcomescene.patch_msg=Dieser Patch beinhaltet auch kleine Optimierungen und Leistungs-Verbesserungen.
scenes.welcomescene.what_msg=Es scheint, als stammten deine vorhandenen Spielstände aus einer zukünftigen Version von Pixel Dungeon Neukölln!\n\nSei vorsichtig! Deine Spielstände könnten Dinge enthalten, die es in dieser Version noch nicht gibt. Das kann sehr merkwürdige Fehler hervorrufen.
scenes.welcomescene.lang_warning_title=Unvollständige Übersetzung
scenes.welcomescene.lang_warning_msg=Einige Inhalte dieses Updates wurden noch nicht übersetzt.\n\nEin paar Beschreibungen könnten auf Englisch sein.\n\nWir arbeiten daran, und eine vollständige Übersetzung sollte bald verfügbar sein. Also so bald, wie Berlin eben "bald" meint.\n\nDanke für dein Verständnis.
scenes.welcomescene.continue=Weiter
scenes.welcomescene.changelist=Änderungsliste
scenes.welcomescene.save_warning=Pixel Dungeon Neukölln wurde unterbrochen, als es gerade deinen Spielstand speichern wollte. Das Spiel hat dagegen einen eingebauten Schutz, deine Spieldaten sind also wahrscheinlich in Ordnung.\n\nSo etwas passiert meist, wenn dein Gerät plötzlich keinen Strom mehr hat oder das Spiel zum Beenden gezwungen wird, bevor es sich ordnungsgemäß schließen kann. Oft liegt das am Energiesparmodus auf Mobilgeräten. Wenn du diesen Fehler öfter siehst, kann es helfen, das Gerät neu zu starten.
scenes.welcomescene.controller_title=Controller-Eingabe
scenes.welcomescene.controller_body=Du spielst mit einem Controller? Nutze das rechte Steuerkreuz, um einen Cursor über den Bildschirm zu bewegen.\n\nBetätige RT/R2 oder das rechte Steuerkreuz, um mit dem Cursor etwas auszuwählen.
scenes.welcomescene.controller_okay=Okay
scenes.introscene.page1=Montagmorgen, Hermannplatz. Du musst zur Sitzung beim Mieterverein. Die Anzeige verspricht die M41 in 2 Minuten, seit zwanzig Minuten. Dann verschwindet der Bus ganz von der Tafel, als hätte es ihn nie gegeben.
scenes.introscene.page2=Die nächste kommt tatsächlich. Sie fährt los, als du noch drei Schritte von der Tür entfernt bist, eine Minute vor Fahrplan. Der Fahrer hebt die Hand. Ein Gruß war das nicht.
scenes.introscene.page3=Also gut: Fahrrad, dann schaffst du die Sitzung noch. Es steht im Keller, zwischen Sperrmüll, einer Schrankwand aus den Achtzigern und einem Kinderwagen, der dort seit 2009 "nur kurz" parkt.
scenes.introscene.page4=Auf der ersten Stufe liegt ein Hundehaufen. Hinter dir fällt die Brandschutztür mit einem satten Klacken ins Schloss. Der Schlüssel liegt irgendwo weiter unten. Das Fahrrad hoffentlich auch.
scenes.introscene.next=Weiter
scenes.introscene.start=Ab in den Keller
scenes.introscene.skip=Überspringen
