scenes.amuletscene.exit=Schluss für heute
scenes.amuletscene.stay=Ich bin noch nicht fertig
scenes.amuletscene.text=Da ist er: der letzte unbefristete Mietvertrag Berlins. Altbau, Kaltmiete von 1987, keine Staffel, kein Index, kein Eigenbedarf. Im Feld „Mieter“ steht nichts. Darunter, klein gedruckt: _Übertragbar nur an die Hausgemeinschaft._\n\nDu kannst jetzt Schluss machen und den Lauf als Sieg beenden. Oder du behältst den Vertrag, bleibst noch ein wenig sterblich und trägst ihn Treppe für Treppe nach oben. Du weißt ja noch, was auf der ersten Stufe liegt.

