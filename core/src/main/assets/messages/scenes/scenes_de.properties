scenes.aboutscene.nk_title=Pixel Dungeon Neukölln
scenes.aboutscene.nk_body=Ein inoffizieller deutscher Fork von _Shattered Pixel Dungeon_, nicht vom Original-Entwickler unterstützt.\nNeukölln-Setting, neue Gegner, Texte und Pixelart: _codeausberlin_\nAlle Credits des Originals unten gelten weiter.

