scenes.heroselectscene.challenges_nowin=Herausforderungen sind optionale Modifikatoren, die das Spiel schwieriger machen. Manche Herausforderungen machen den Untergrund gefährlicher, andere verringern die Kraft deiner Fähigkeiten oder Gegenstände.\n\n_Du musst mindestens ein Spiel gewinnen, bevor du Herausforderungen annehmen kannst._
