###features
levels.features.chasm.chasm=A100-Baulücke
levels.features.chasm.yes=Ja, ich nehme die Abfahrt
levels.features.chasm.no=Nein, lieber doch nicht...
levels.features.chasm.jump=Möchtest du wirklich in diesen nie fertig gebauten Abschnitt der A100 springen? Ein Sturz aus dieser Höhe tut weh. Die Verkehrsfreigabe ist seit Jahren „demnächst“.
levels.features.chasm.ondeath=Du bist zu Tode gestürzt. Freigegeben war der Abschnitt ohnehin nicht...
levels.features.chasm.rankings_desc=In die A100 gestürzt



###rooms
levels.rooms.secret.ratkingroom$ratkingroomdeco.statue_name=Rattenstatue
levels.rooms.secret.ratkingroom$ratkingroomdeco.pillow_name=Königskissen
levels.rooms.secret.ratkingroom$ratkingroomdeco.statue_desc=Eine Statue nach dem Ebenbild des Pfandkönigs. Wer hat die bezahlt? Und warum hat sie eine Denkmalschutzplakette?
levels.rooms.secret.ratkingroom$ratkingroomdeco.pillow_desc=Dieses aufgeplusterte lila Kissen wäre für dich als Bett zu klein, aber es hat genau die richtige Größe für den Pfandkönig, die wichtigste Ratte der Welt. Laut Etikett: Zu verschenken, nur an Adel.

levels.rooms.special.magicalfireroom$eternalfire.desc=Hier lodert eine Wand aus gleißend grünem Feuer, eindeutig magischen Ursprungs. Vermutlich hat jemand versucht, die Nebenkostenabrechnung zu verbrennen. Die Flammen stehen so dicht, dass du nicht hindurchkommst, und sie entzünden alles, was ihnen zu nahe kommt. Von allein wird dieses Feuer nicht ausgehen, du wirst also etwas brauchen, um es zu löschen.

levels.rooms.special.sentryroom$sentry.name=rote Schildwache
levels.rooms.special.sentryroom$sentry.desc=Diese blutrote Schildwache bewacht den Schatz am anderen Ende des Raumes wie eine Hausmeisterin den Fahrradkeller. Sie beschießt dich mit Strahlen aus Magie des Zerfalls, sobald du ein Gebiet betrittst, das sie verteidigt.\n\nSie ist immun gegen alle schädlichen Effekte und kann Unsichtbares sehen, braucht aber eine Weile, bis sie sich zum Feuern aufgeladen hat.\n\nAus irgendeinem Grund will sie nur auf dich schießen, als wüsste sie genau, dass hier unten sowieso niemand etwas mitnehmen darf.
levels.rooms.special.sentryroom$sentry.discover_hint=Du kannst diesen Gegner überall im Untergrund finden.

levels.rooms.special.toxicgasroom$toxicvent.name=Giftgebläse
levels.rooms.special.toxicgasroom$toxicvent.desc=Diesen Haufen hat vor Ewigkeiten jemand ausgelöst, und seitdem hat sich niemand zuständig gefühlt. Obwohl er nicht mehr aktiv ist, strömt immer noch Giftgas in den Raum, und daran wird sich so bald nichts ändern. Du musst einen Weg finden, dich vor dem Gas zu schützen, wenn du diesen Raum erkunden willst.

levels.rooms.special.weakfloorroom$hiddenwell.name=Ferner Brunnen
levels.rooms.special.weakfloorroom$hiddenwell.desc=Tief unten erkennst du einen Brunnen. Vielleicht liegt da unten ja etwas?

levels.rooms.quest.ambitiousimproom$questentrance.name=Kellertreppe zur Ilse
levels.rooms.quest.ambitiousimproom$questentrance.desc=Diese Treppe führt hinab zur Ilse, dem letzten Club im Quartier. Ein magisches Absperrband mit der Aufschrift "Zukünftige Eventfläche" verhindert den Zutritt, du kannst darüber laufen, als wäre dort normaler Boden.

levels.rooms.quest.blacksmithroom$questentrance.name=Kabelschacht
levels.rooms.quest.blacksmithroom$questentrance.desc=Diese Leiter führt hinab in einen alten Kabelschacht direkt unter der Werkstatt des Netztechnikers. Ein Schild sagt: Achtung, Glasfaser. Ein zweites Schild darunter: Seit 2019.

levels.rooms.quest.blacksmithroom$smithyvisuals.name=Technikerwerkstatt
levels.rooms.quest.blacksmithroom$smithyvisuals.desc=Eine provisorische Werkstatt, die der Netztechniker hier eingerichtet hat, komplett mit glühender Esse, einer Kabeltrommel als Amboss und einem Wasserbecken, das absolut widerlich aussieht. Im Auftragssystem steht sie als Hausanschluss.

levels.rooms.quest.ritualsiteroom$ritualmarker.name=Ritualzeichen
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Ein aufgemaltes Zeichen für ein finsteres Ritual, sorgfältiger ausgeführt als jeder Bebauungsplan. Die Kerzen gehören normalerweise an die vier Ecken.
levels.rooms.quest.ritualsiteroom$table.name=Unheimlicher Tisch
levels.rooms.quest.ritualsiteroom$table.desc=Dieser schwere Tisch wurde grob zu einer Art Folterbank umgebaut. Handwerklich eher Eigenleistung.

levels.rooms.quest.massgraveroom$massgravedeco.name=Massengrab
levels.rooms.quest.massgraveroom$massgravedeco.desc=Der Boden ist mit Knochen übersät. Wer auch immer hier lag, wartete auf etwas, das nie kam. Was ist hier passiert?

levels.rooms.quest.mineentrance$questexit.name=Ausgang des Kabelschachts
levels.rooms.quest.mineentrance$questexit.desc=Diese Leiter führt aus dem Kabelschacht hinaus, zurück in die Werkstatt des Netztechnikers.

levels.rooms.quest.vault.vaultentranceroom$questentranceinternal.name=Lastenaufzug
levels.rooms.quest.vault.vaultentranceroom$questentranceinternal.desc=Diese Plattform ist genauso groß wie der Treppenschacht über dir. Vermutlich der Lastenaufzug für Boxen und Getränkekisten. Der reguläre Weg ist, wie überall in dieser Stadt, gesperrt.

levels.rooms.quest.vault.vaultfinalroom.imp_warning_unprepared=Als du den großen Raum betrittst, scheint die Zeit langsamer zu laufen, und du hörst die Stimme des Ehrgeizigen Filialisten:\n\n"Der VIP-Bereich! Meine Statuette steht direkt dahinter. Da wartet garantiert ein Türsteher oder eine fiese Sicherung, also _solltest du wirklich erst alles erkunden und dich vorbereiten, bevor du weitergehst!_ Ich will meinen Preis, keine Todesanzeige. Tote Kundschaft bewertet schlecht."
levels.rooms.quest.vault.vaultfinalroom.imp_warning_prepared=Als du den großen Raum betrittst, scheint die Zeit langsamer zu laufen, und du hörst die Stimme des Ehrgeizigen Filialisten:\n\n"Der VIP-Bereich! Meine Statuette steht direkt dahinter. Da wartet garantiert ein Türsteher oder eine fiese Sicherung, also _sieh zu, dass du voll aufgerüstet und bereit für einen großen Kampf bist!_ Ich will meinen Preis, keine Todesanzeige. Tote Kundschaft bewertet schlecht."
levels.rooms.quest.vault.vaultfinalroom.final_warning=Du hörst, wie sich die Anlage auflädt. Noch ein Schritt nach vorn, und der Drop kommt!
levels.rooms.quest.vault.vaultfinalroom$markertiles.name=Riesiges Bodenlogo
levels.rooms.quest.vault.vaultfinalroom$markertiles.desc=Das Clublogo, fünf Meter breit in den Boden eingelassen.\n\nDer ganze Floor summt vor Energie, als warte hier ein gewaltiger Drop nur darauf, ausgelöst zu werden.
levels.rooms.quest.vault.vaultfinalroom$vaulttreasure.desc=Hier liegen Konfetti und Goldlametta vom letzten Drop. Schade, dass du nichts davon mitnehmen kannst. Steuerlich wäre es ohnehin kompliziert.

###traps
levels.traps.alarmtrap.name=kreischroter Haufen
levels.traps.alarmtrap.alarm=Der Haufen kreischt los wie ein Rauchmelder um drei Uhr nachts. Der Lärm schallt über die ganze Ebene!
levels.traps.alarmtrap.desc=Ein roter Haufen mit eingebautem Quietschspielzeug. Irgendwo bellt ein Hund zurück. Wer darauf tritt, alarmiert vermutlich alles und jeden auf dieser Ebene.

levels.traps.blazingtrap.name=lodernder Haufen
levels.traps.blazingtrap.desc=Dieser orange Haufen dampft verdächtig nach Grillanzünder. Der Hund hat offenbar vom Hofsommerfest gefressen. Wer darauf tritt, entzündet ein starkes chemisches Gemisch und setzt einen großen Bereich in Brand.

levels.traps.burningtrap.name=glimmender Haufen
levels.traps.burningtrap.desc=Ein oranger Haufen, der leise vor sich hin glimmt, wie ein Einweggrill, den niemand gelöscht hat. Wer darauf tritt, entzündet ein chemisches Gemisch und setzt die Umgebung in Flammen.

levels.traps.chillingtrap.name=kühler weißer Haufen
levels.traps.chillingtrap.desc=Ein weißer Haufen mit Raureif. Der Hund hat einen Kühlakku gefressen, das macht der nur hier. Wird er ausgelöst, lässt die Chemie darin die Luft um ihn herum rasch gefrieren.

levels.traps.confusiontrap.name=verwirrend türkiser Haufen
levels.traps.confusiontrap.desc=Ein türkiser Haufen mit Duftnote „Frisch renoviert“. Wer darauf tritt, setzt in der unmittelbaren Umgebung eine Wolke Verwirrungsgas frei.

levels.traps.cursingtrap.name=verfluchter violetter Haufen
levels.traps.cursingtrap.curse=Deine getragene Ausrüstung wird verflucht!
levels.traps.cursingtrap.desc=Dieser violette Haufen enthält dieselbe bösartige Magie wie verfluchte Ausrüstung und verbreitet sich wie ein Kettenbrief in der Hausgruppe. Wer darauf tritt, verflucht Gegenstände in der unmittelbaren Umgebung und die eigene getragene Ausrüstung.

levels.traps.disarmingtrap.name=roter Fundsachen-Haufen
levels.traps.disarmingtrap.disarm=Deine Waffe wurde wegteleportiert! Irgendwo auf dieser Ebene wartet sie jetzt auf Abholung.
levels.traps.disarmingtrap.desc=Ein roter Haufen voller sehr spezieller Teleportationsmagie. Wer hineintritt, dessen Waffe wird an einen anderen Ort auf der Ebene versetzt. Das Fundbüro hätte dafür sechs Wochen gebraucht.

levels.traps.disintegrationtrap.name=violetter Zerfallshaufen
levels.traps.disintegrationtrap.one=Der Haufen löst dein/e %s auf!
levels.traps.disintegrationtrap.some=Der Haufen löst einige deiner %s auf!
levels.traps.disintegrationtrap.ondeath=Der violette Zerfallshaufen hat dich aufgelöst. Rückstandslos, anders als er selbst...
levels.traps.disintegrationtrap.desc=Wird dieser violette Haufen ausgelöst, schießt er Zerfallsstrahlen auf das nächstgelegene Ziel, richtet erheblichen Schaden an und zerstört Gegenstände.\n\nZum Glück liegt er gut sichtbar mitten im Weg.

levels.traps.distortiontrap.name=verzerrter türkiser Haufen
levels.traps.distortiontrap.desc=Dieser türkise Haufen ist aus seltsamer Magie unbekannter Herkunft entstanden, fragt lieber nicht, von welchem Hund. Wer darauf tritt, beschwört an diese Stelle alle möglichen Kreaturen, wie ein Hausflur nach einer WG-Party.

levels.traps.explosivetrap.name=knallorangener Haufen
levels.traps.explosivetrap.desc=Dieser orange Haufen enthält körniges Sprengpulver und einen Zünder. Der Hund hat an Silvester etwas gefunden. Wer darauf tritt, löst eine Explosion in der unmittelbaren Umgebung aus.

levels.traps.flashingtrap.name=grauer Blitzhaufen
levels.traps.flashingtrap.desc=In diesem grauen Haufen steckt ein starkes Blitzpulver. Wird er ausgelöst, blendet, verkrüppelt und verletzt er sein Opfer vorübergehend.\n\nDer Vorrat an Pulver muss riesig sein, denn er kann oft ausgelöst werden, ohne sich zu verbrauchen. Der Kotbeutelspender daneben ist natürlich leer.

levels.traps.flocktrap.name=wolliger weißer Haufen
levels.traps.flocktrap.desc=Ein weißer, erstaunlich flauschiger Haufen, vielleicht der Witz eines Laienmagiers, vielleicht ein Förderprojekt „Urban Farming“. Wer darauf tritt, beschwört eine Herde magischer Schafe.

levels.traps.frosttrap.name=tiefgefrorener Haufen
levels.traps.frosttrap.desc=Ein weißer Haufen, hart wie ein Altbau im Februar mit defekter Gasetagenheizung. Wird er ausgelöst, lässt die Chemie darin die Luft in weitem Umkreis rasch gefrieren.

levels.traps.gatewaytrap.name=türkiser Pendlerhaufen
levels.traps.gatewaytrap.desc=Dieser besondere türkise Teleport-Haufen funktioniert wie Schienenersatzverkehr: Er kann unendlich oft ausgelöst werden und bringt dich immer an dieselbe Stelle, egal wohin du eigentlich wolltest.

levels.traps.geysertrap.name=sprudelnder türkiser Haufen
levels.traps.geysertrap.desc=Unter diesem türkisen Haufen wartet ein Wasserrohr seit dem Mauerfall auf seinen Moment. Wird er ausgelöst, schießt eine Wasserfontäne hervor, die feurigen Gegnern schadet, alle Figuren in der Nähe wegschleudert, Feuer löscht und die umliegenden Felder in Wasser verwandelt.

levels.traps.gnollrockfalltrap.name=staubgrauer Bautrupp-Haufen
levels.traps.gnollrockfalltrap.desc=Diesen Haufen hat der Bautrupp mit etwas magischer Unterstützung selbst hinterlassen, ganz ohne Ausschreibung. Wird er ausgelöst, lösen sich Steine und fallen sofort in einem Bereich von 5x5 Feldern um ihn herum herunter. Weil das Gestein hier weicher ist, richtet das weniger Schaden an als ein normaler bröckelgrauer Haufen, aber deine Rüstung schützt nicht dagegen. Auf Felder, die an eine Barrikade grenzen, fallen keine Steine, da Barrikaden die Decke stützen.\n\n_Dieser Haufen unterscheidet nicht zwischen Freund und Feind und ist für die Bauwichte genauso gefährlich wie für dich._

levels.traps.grimtrap.name=grabesgrauer Haufen
levels.traps.grimtrap.ondeath=Der Strahl des grabesgrauen Haufens hat dich getötet. Widerspruch ist zwecklos...
levels.traps.grimtrap.desc=In diesem grauen Haufen steckt extrem mächtige, zerstörerische Magie, genug, um alle außer den gesündesten Helden sofort zu töten. Wie ein Mahnbescheid, nur schneller zugestellt. Wird er ausgelöst, schießt er einen Strahl tödlicher Magie auf die nächstgelegene Figur.\n\nZum Glück liegt er gut sichtbar mitten im Weg.

levels.traps.grippingtrap.name=klebriger grauer Haufen
levels.traps.grippingtrap.desc=Dieser graue Haufen klebt sich an die Füße von allem, was hineintritt, verletzt sie und verlangsamt die Bewegung. Die Schuhe riechen danach noch tagelang.\n\nWeil er so einfach gebaut ist, kann er oft ausgelöst werden, ohne sich zu verbrauchen.

levels.traps.guardiantrap.name=roter Wachschutz-Haufen
levels.traps.guardiantrap.alarm=Der Haufen stößt ein durchdringendes Geräusch aus, das über die ganze Ebene schallt!
levels.traps.guardiantrap.desc=Dieser rote Haufen ist mit einem seltsamen magischen Mechanismus verbunden, der Wächter beschwört und alle Gegner auf dieser Ebene alarmiert. Wachschutz auf Abruf, der Hund gehört wohl zum Objektschutz.
levels.traps.guardiantrap$guardian.name=Wachschutz auf Abruf
levels.traps.guardiantrap$guardian.desc=Diese bläuliche Erscheinung ist ein genaues Abbild der Kunst-am-Bau-Statuen hier unten. Sie wurde nie eingestellt, arbeitet aber trotzdem.
levels.traps.guardiantrap$guardian.desc_weapon=Auch wenn die Statue fast körperlos ist, sieht ihr _%s_ ziemlich echt aus.
levels.traps.guardiantrap$guardian.discover_hint=Du kannst diesen Gegner über einen bestimmten Haufen finden.

levels.traps.oozetrap.name=schleimgrüner Haufen
levels.traps.oozetrap.desc=Wird dieser grüne Haufen ausgelöst, verspritzt er ätzenden Schleim, der brennt, bis er abgewaschen wird. Das Futter war wohl vegan und sehr abgelaufen.

levels.traps.pitfalltrap.name=bodenloser roter Haufen
levels.traps.pitfalltrap.triggered_hero=Der Boden um dich herum gibt nach!
levels.traps.pitfalltrap.triggered=Der Boden um den ausgelösten Haufen herum gibt nach!
levels.traps.pitfalltrap.no_pit=Der Boden hier ist zu fest, als dass unter dem Haufen etwas nachgeben könnte.
levels.traps.pitfalltrap.desc=Unter diesem roten Haufen steckt ein großer Falltürmechanismus, gebaut vermutlich von denselben Leuten, die hier auch die Straßen aufreißen. Kurz nachdem er ausgelöst wird, rutscht alles in seiner Nähe durch den Boden und fällt nach unten! Auf besonders festem Untergrund funktioniert das allerdings nicht.

levels.traps.poisondarttrap.name=grüner Blasrohr-Haufen
levels.traps.poisondarttrap.ondeath=Dich hat der grüne Blasrohr-Haufen getötet...
levels.traps.poisondarttrap.desc=In der Nähe muss ein kleines Blasrohr versteckt sein. Wer auf diesen grünen Haufen tritt, löst einen vergifteten Pfeil auf das nächstgelegene Ziel aus.\n\nZum Glück liegt er gut sichtbar mitten im Weg.

levels.traps.rockfalltrap.name=bröckelgrauer Haufen
levels.traps.rockfalltrap.ondeath=Dich haben fallende Steine erschlagen. Die Sanierung hat begonnen...
levels.traps.rockfalltrap.desc=Dieser graue Haufen ist mit losen Steinen an der Decke verbunden. Wer darauf tritt, lässt sie im ganzen Raum herunterkrachen! Liegt der Haufen nicht in einem bestimmten Raum, fallen die Steine stattdessen in einem Bereich um ihn herum.\n\nZum Glück liegt er gut sichtbar mitten im Weg.

levels.traps.shockingtrap.name=knisternder gelber Haufen
levels.traps.shockingtrap.desc=In diesem gelben Haufen ist eine große Menge Energie gespeichert, verkabelt nach dem Vorbild einer Altbau-Elektrik von 1962. Wer darauf tritt, entlädt diese Energie in ein Feld um den Haufen.

levels.traps.stormtrap.name=gewittergelber Haufen
levels.traps.stormtrap.desc=In diesem gelben Haufen ist eine gewaltige Menge Energie gespeichert. Wer darauf tritt, entlädt sie in einen großen elektrischen Sturm.

levels.traps.summoningtrap.name=lockender türkiser Haufen
levels.traps.summoningtrap.desc=Dieser türkise Haufen riecht für die Monster dieses Gebiets unwiderstehlich. Wer darauf tritt, beschwört mehrere Monster dieses Gebiets an diese Stelle. Wie ein offenes WLAN, nur mit Zähnen.

levels.traps.teleportationtrap.name=türkiser Sprunghaufen
levels.traps.teleportationtrap.desc=Wird dieser türkise Haufen ausgelöst, teleportiert er alles in seiner Umgebung an zufällige Orte auf dieser Ebene.

levels.traps.tengudarttrap.desc=Der Kurzparker hat sich eindeutig auf einen Kampf vorbereitet, gründlicher als auf jede Einparklücke. Dieser Haufen löst eine versteckte Scheibenwaschdüse aus, die einen vergifteten Strahl auf das nächste Ziel spritzt, das nicht der Kurzparker ist.\n\nDer Haufen ist so gut getarnt, dass man ihn ohne magische Hilfe unmöglich entdecken kann. Während er platziert wird, ist er allerdings kurz sichtbar.

levels.traps.toxictrap.name=giftgrüner Haufen
levels.traps.toxictrap.desc=Ein grüner Haufen, der nach Kellerabteil nach dem Hochwasser riecht. Wer darauf tritt, setzt in der Umgebung eine Wolke Giftgas frei. „Der macht das sonst nie“, sagt der Besitzer.

levels.traps.trap.discover_hint=Du kannst diesen Haufen zufällig finden. In jeder Region liegen andere Haufen herum.
levels.traps.trap.rankings_desc=Getötet durch: %s

levels.traps.corrosiontrap.name=ätzend grauer Haufen
levels.traps.corrosiontrap.desc=Wer auf diesen grauen Haufen tritt, setzt in der unmittelbaren Umgebung eine Wolke tödlichen, ätzenden Gases frei. Stärker als jeder Entkalker aus dem Späti.

levels.traps.warpingtrap.name=türkiser Irrhaufen
levels.traps.warpingtrap.desc=Dieser Haufen wirkt wie ein türkiser Sprunghaufen, lässt den Helden aber zusätzlich vergessen, wie die Ebene aufgebaut ist! Wie ein Tourist ohne Handyempfang.

levels.traps.weakeningtrap.name=schlappgrüner Haufen
levels.traps.weakeningtrap.desc=Dunkle Magie in diesem grünen Haufen saugt die Energie aus allem, was hineintritt. Danach fühlst du dich wie nach drei Wohnungsbesichtigungen am Stück. Mächtige Gegner können dem Effekt jedoch widerstehen.

levels.traps.worndarttrap.name=verwitterter Blasrohr-Haufen
levels.traps.worndarttrap.ondeath=Dich hat der verwitterte Blasrohr-Haufen getötet. Peinlich...
levels.traps.worndarttrap.desc=In der Nähe muss ein kleines Blasrohr versteckt sein. Wer auf diesen grauen Haufen tritt, löst einen Schuss auf das nächstgelegene Ziel aus.\n\nDer Haufen ist so alt, dass er kaum noch gefährlich ist. Er ist nicht einmal versteckt. Bestandsschutz.



###levels
levels.cavesbosslevel.wires_name=Freiliegende Kabel
levels.cavesbosslevel.wires_desc=Der Boden der Baugrube ist aufgerissen, man sieht dicke, freigelegte Kabel. Sie verbinden die elektrischen Baumaschinen hier miteinander. Die Kabeltrommel trägt einen Prüfaufkleber von vor 20 Jahren.\n\nDurch die Kabel scheint Strom zu fließen. Wenn die DM-300 Bohrlinde hierher fährt, kann sie hier vermutlich Energie abzapfen.
levels.cavesbosslevel.energy_desc=Der Boden versprüht hier elektrische Funken, es wäre gefährlich, darauf zu treten. _Die Funken scheinen allerdings in eine bestimmte Richtung zu wandern..._ vielleicht führen sie zur Stromquelle?
levels.cavesbosslevel.gate_name=Bauzauntor
levels.cavesbosslevel.gate_desc=Ein großes Metalltor versperrt den Weg ins Renditequartier. Aus dem Stromkasten in der Mitte dringt ein lautes Brummen, er ist vermutlich mit den Schaltkreisen und Maschinen in der Nähe verbunden. Vielleicht öffnet sich das Tor, wenn man die DM-300 Bohrlinde zerstört?
levels.cavesbosslevel.gate_desc_broken=Das Tor war offenbar mit der Bohrlinde verbunden, denn es ist explodiert, als die Bohrlinde besiegt wurde. Jetzt liegen nur noch zerschmetterte Teile herum. Der erste Bauabschnitt gilt damit als abgeschlossen.
levels.cavesbosslevel.water_desc=Bei all dem Strom in dieser Baugrube ist Wasser nicht immer sehr sicher...

levels.citybosslevel.throne_name=Thron
levels.citybosslevel.throne_desc=Dieser beeindruckend große Thron ist der Sitz des Reichs der Eigentümerzwerge, heute Konferenzzimmer eines machtgierigen Nekromanten mit Immobilienportfolio.\n\nAn diesem Thron scheinen magische oder mechanische Teile verbaut zu sein; der König der Eigentumswohnungen könnte zusätzliche Kräfte haben, solange er darauf sitzt.
levels.citybosslevel.summoning_name=Beschwörungspostament
levels.citybosslevel.summoning_desc=Dieses Postament hat in der Mitte eine größere Öffnung, aus der dunkle Energie geradezu strahlt.\n\nDer König der Eigentumswohnungen nutzt diese Postamente als Fokuspunkte seiner nekromantischen Magie und beschwört darauf seine Lakaien. Ein Postament muss sich einige Züge lang aufladen, bevor die Beschwörung vollzogen wird, und an der sich aufbauenden magischen Kraft lässt sich erkennen, welche Art Lakai erscheint.

levels.caveslevel.grass_name=Leuchtmoos
levels.caveslevel.high_grass_name=Tunnelpilze
levels.caveslevel.water_name=Eiskaltes Grundwasser
levels.caveslevel.entrance_desc=Die Bauleiter führt hinauf zu einer höheren Ebene.
levels.caveslevel.exit_desc=Die Bauleiter führt hinunter auf eine tiefere Ebene.
levels.caveslevel.high_grass_desc=Riesige Pilze, gewachsen seit dem ersten Spatenstich, versperren die Sicht.
levels.caveslevel.wall_deco_desc=Ist das eine Goldader? Nein: Glasfaser, verlegt und nie angeschlossen. Im Licht schimmert sie trotzdem golden.
levels.caveslevel.bookshelf_desc=Ein Regal voller Bauakten, Nachtragsangebote und Gutachten zu Gutachten. Obenauf ein Stapel Plakate: „Wir bauen! Kanzler März.“ Aufgehängt hat sie niemand.
levels.caveslevel.region_deco_name=Tunnelgerüst
levels.caveslevel.region_deco_desc=Ein großes Metallgerüst, errichtet von Zwergen, die damals noch keine Eigentümerzwerge waren und hier einen U-Bahn-Schacht graben sollten. Oben entlang erkennst du eine längst stillgelegte Lorenschiene. Laut Bauschild ist die Fertigstellung für nächstes Jahr geplant. Das Bauschild ist 40 Jahre alt.

levels.citylevel.water_name=Zierwasserbecken
levels.citylevel.high_grass_name=Wuchernde Fassadenbegrünung
levels.citylevel.entrance_desc=Eine Rampe führt hinauf auf eine höhere Ebene. Sie ist die einzige barrierefreie Stelle im ganzen Quartier.
levels.citylevel.exit_desc=Eine Rampe führt hinunter auf die Ebene darunter.
levels.citylevel.deco_desc=Hier fehlen mehrere Bodenplatten. Darunter kommt der alte Tanzboden des Clubs zum Vorschein, der hier war, bevor das Quartier belebt wurde.
levels.citylevel.statue_desc=Diese Statue eines Eigentümerzwergs posiert heroisch vor einer Glasfassade. Davor eine Bodenmarkierung: „Fotopunkt Kanzler März“. Auf dem Sockel steht: „Er hat hier Werte geschaffen.“ Welche, steht nicht dabei.
levels.citylevel.bookshelf_desc=Ein Regal voller Coffee-Table-Books über Minimalismus, Achtsamkeit und "Kiezkultur erleben". Keins davon wurde je aufgeschlagen.
levels.citylevel.region_deco_name=Designerfeuerschale
levels.citylevel.region_deco_desc=Ein erhöhtes Postament mit einer hellen, grünen, magischen Flamme, aufgestellt als "Lounge-Element". Die Flamme ist so dicht, dass sie beinahe fest sein könnte. Heizen tut sie trotzdem nur die Rendite.

levels.hallslevel.water_name=kalte Lava
levels.hallslevel.grass_name=Glutmoos
levels.hallslevel.high_grass_name=Glutpilze
levels.hallslevel.statue_name=Säule
levels.hallslevel.water_desc=Es sieht aus wie Lava, ist aber kalt, wie jedes Versprechen aus dem Rathaus. Vermutlich ungefährlich.
levels.hallslevel.statue_desc=Diese Säule wurde aus echten Schädeln gefertigt. Laut Plakette ein Denkmal für alle, die hier unten auf einen Rückruf gewartet haben. Großartig.
levels.hallslevel.bookshelf_desc=Gesetzbücher und Verwaltungsvorschriften in uralten, toten Amtssprachen glimmen leicht in diesem Regal. Ganz vorn steht eine Akte: „Wasserschaden 3. OG, gemeldet 2009, in Bearbeitung.“
levels.hallslevel.region_deco_name=Rathausbrocken
levels.hallslevel.region_deco_desc=Ein riesiger Steinbrocken, aus dem Fundament des Rathauses gebrochen. Darauf klebt noch ein Plakatrest: „Ordnung ist das Fundament. Kanzler März.“ Er trägt offensichtlich nichts mehr.


levels.level.hidden_trap=Ein versteckter %s geht los!
levels.level.chasm_name=A100-Baulücke
levels.level.floor_name=Boden
levels.level.grass_name=Gras
levels.level.water_name=Wasser
levels.level.wall_name=Wand
levels.level.closed_door_name=Geschlossene Tür
levels.level.open_door_name=offene Tür
levels.level.entrace_name=Ebeneneingang
levels.level.exit_name=Ebenenausgang
levels.level.embers_name=Asche
levels.level.furrowed_grass_name=Zertrampelte Vegetation
levels.level.locked_door_name=verschlossene Tür
levels.level.crystal_door_name=Kristalltür
levels.level.pedestal_name=Podest
levels.level.barricade_name=Barrikade
levels.level.high_grass_name=hohes Gras
levels.level.locked_exit_name=Verschlossener Ebenenausgang
levels.level.unlocked_exit_name=Entriegelter Ebenenausgang
levels.level.well_name=Brunnen
levels.level.empty_well_name=versiegter Brunnen
levels.level.statue_name=Statue
levels.level.inactive_trap_name=ausgelöster Haufen
levels.level.bookshelf_name=Bücherregal
levels.level.alchemy_name=Alchemiekessel
levels.level.default_name=???
levels.level.chasm_desc=Ein nie fertig gebauter Abschnitt der A100. Den Boden siehst du nicht, das Bauschild schon: Fertigstellung demnächst.
levels.level.water_desc=Wenn du brennst, gehe ins Wasser, um das Feuer zu löschen.
levels.level.entrance_desc=Die Treppe führt hinauf zu einer höheren Ebene.
levels.level.exit_desc=Die Treppe führt hinunter auf eine tiefere Ebene. Das Treppenhauslicht geht nach zehn Sekunden aus.
levels.level.embers_desc=Der Boden ist mit Asche bedeckt.
levels.level.high_grass_desc=Dichte Vegetation versperrt die Sicht. Auf der Baumscheibe stand mal "Bitte nicht betreten".
levels.level.locked_door_desc=Diese Tür ist verschlossen. Du brauchst einen passenden Schlüssel, um sie aufzuschließen. Der Hausmeister kommt erst Donnerstag.
levels.level.crystal_door_desc=Diese verschlossene Tür ist aus magischem Kristall gefertigt, sehr offen und sehr zu. Du kannst zwar hindurchsehen, benötigst aber einen Kristallschlüssel, um sie zu öffnen.
levels.level.locked_exit_desc=Dicke Eisenstangen versperren den Zugang zur weiterführenden Treppe.
levels.level.barricade_desc=Eine sorgfältig errichtete Barrikade aus Sperrmüllholz. Das Holz ist knochentrocken. Ob man es anzünden kann?
levels.level.inactive_trap_desc=Dieser Haufen wurde bereits ausgelöst und ist nicht mehr gefährlich. Nur noch eklig.
levels.level.statue_desc=Irgendjemand hat versucht, diesen Ort aufzuwerten, und ist daran offensichtlich gescheitert. So fängt es immer an.
levels.level.alchemy_desc=Dieser Kessel ist mit magischem Wasser gefüllt. Gegenstände können darin in etwas Neues verwandelt werden! Upcycling, aber diesmal funktioniert es.
levels.level.empty_well_desc=Der Brunnen ist ausgetrocknet. Ein Zettel: „Wasser abgestellt wegen Wartung. Dauer: unbestimmt.“

levels.level$feeling.chasm_desc_r1=Irgendwo ist der Kellerboden weggesackt, direkt in ein Stück A100. Die Hausverwaltung nennt das Souterrain mit Autobahnanschluss.
levels.level$feeling.water_desc_r1=Es plätschert. Entweder der Kanal oder der Wasserschaden aus dem dritten Stock, gemeldet 2009.
levels.level$feeling.grass_desc_r1=Es riecht nach frischer Minze. Die wuchert hier, seit die Shisha-Bar aus dem Vorderhaus ihre Kübel im Hof überwintern lässt.
levels.level$feeling.dark_desc_r1=Die Kellerbeleuchtung hat eine Zeitschaltuhr. Sie ist gerade abgelaufen. Irgendwas bewegt sich trotzdem.
levels.level$feeling.large_desc_r1=Dieser Keller reicht vom Barbershop an der Sonnenallee bis unter die Konditorei drei Häuser weiter. Im Exposé stünde jetzt: großzügiger Schnitt.
levels.level$feeling.traps_desc_r1=Der Boden wirkt hier besonders heimtückisch. Auf der ersten Stufe lag schon ein Haufen, und es war nicht der letzte.
levels.level$feeling.secrets_desc_r1=Durch die Wand hörst du die Haarschneidemaschinen vom Barbershop summen. Hier gibt es mehr Durchgänge, als auf dem Lageplan stehen.
levels.level$feeling.chasm_desc_r2=Deine Schritte hallen. Ganze Wartebereiche sind in eine A100-Baugrube gesackt. Der Planfeststellungsbeschluss liegt noch im Eingangskorb.
levels.level$feeling.water_desc_r2=Es tropft von der Decke in bereitgestellte Eimer. Die Eimer haben eine Inventarnummer.
levels.level$feeling.grass_desc_r2=Die Büropflanzen sind außer Kontrolle geraten. Niemand war für das Gießen zuständig.
levels.level$feeling.dark_desc_r2=Das Licht ist aus. Energiesparmaßnahme. Im Dunkeln raschelt es nach Formularen.
levels.level$feeling.large_desc_r2=Dieser Flur hört nicht auf. Irgendwo am Ende soll Schalter 1 sein.
levels.level$feeling.traps_desc_r2=Überall Haufen. Neben jedem steckt eine Wartenummer.
levels.level$feeling.secrets_desc_r2=Hinter einigen Wänden liegen Akten, die offiziell nie existiert haben.
levels.level$feeling.chasm_desc_r3=Hier kreuzt die U-Bahn-Baustelle die A100-Baustelle. Fertig ist keine von beiden.
levels.level$feeling.water_desc_r3=Grundwasser drückt in den Tunnel. Die Pumpen laufen seit 2009 und pumpen den Wasserschaden aus dem dritten Stock ab.
levels.level$feeling.grass_desc_r3=Auf der Baustelle wächst ein ganzer Wald. So lange liegt sie schon still.
levels.level$feeling.dark_desc_r3=Die Baustellenlampen sind aus. Irgendwo in der Dunkelheit wummert ein Bass, seit Freitag, und etwas bewegt sich im Takt.
levels.level$feeling.large_desc_r3=Dieser Bauabschnitt ist riesig. Laut Bauschild ist er seit Jahren fast fertig.
levels.level$feeling.traps_desc_r3=Überall Haufen, Kabel und lose Platten. Arbeitsschutz war im Budget nicht vorgesehen, Kotbeutel auch nicht.
levels.level$feeling.secrets_desc_r3=Die Baupläne stimmen nicht mit dem Tunnel überein. Irgendwo gibt es Abkürzungen.
levels.level$feeling.chasm_desc_r4=Unter den Glasfassaden klafft ein Stück A100. Im Exposé heißt es: Tiefgarage mit Autobahnanbindung.
levels.level$feeling.water_desc_r4=Hier plätschert ein Designerbrunnen, gespeist aus einem Wasserschaden von 2009. Im Exposé heißt er Wasserspiel.
levels.level$feeling.grass_desc_r4=Vertikale Gärten, so weit das Auge reicht. Gegossen wird von Leuten, die hier nie wohnen werden.
levels.level$feeling.dark_desc_r4=Die Beleuchtung ist nur für Eigentümer freigeschaltet. Mieter tappen im Dunkeln, wie immer.
levels.level$feeling.large_desc_r4=Dieses Quartier ist unverschämt groß. Die Quadratmeter wurden einzeln bepreist.
levels.level$feeling.traps_desc_r4=Die Böden sind poliert und trügerisch. Wie der Mietvertrag mit Staffelmiete.
levels.level$feeling.secrets_desc_r4=Hinter den Hochglanzwänden stehen noch die alten Altbaumauern. Sie haben Durchgänge.
levels.level$feeling.chasm_desc_r5=Der Boden unter dem Rathaus bricht in einen A100-Abschnitt, den es laut Akte gar nicht gibt. Zuständig ist niemand.
levels.level$feeling.water_desc_r5=Hier fließt etwas, das kein Wasser ist. Laut Aktenlage ist es trotzdem Trinkwasser.
levels.level$feeling.grass_desc_r5=Aus den Aktenbergen wuchert etwas. Es wächst schneller als jede Bearbeitungszeit.
levels.level$feeling.dark_desc_r5=Es ist stockdunkel, und etwas beobachtet dich. Irgendwo raschelt die Akte „Hundekot, ungeklärt, seit 1987“.
levels.level$feeling.large_desc_r5=Diese Halle ist gewaltig. Hier passen alle offenen Anträge der Stadt hinein, und es sind alle hier.
levels.level$feeling.traps_desc_r5=Jede Fliese hier ist ein Paragraph. Einige davon sind scharf.
levels.level$feeling.secrets_desc_r5=Das Fundament ist voller Hohlräume. Die Stadt hat hier unten mehr versteckt als Geld.
levels.level$feeling.chasm_title=Ebene mit A100-Baulücke
levels.level$feeling.water_title=Wasser-Ebene
levels.level$feeling.grass_title=Grüne Ebene
levels.level$feeling.dark_title=dunkle Ebene
levels.level$feeling.large_title=große Ebene
levels.level$feeling.traps_title=Hundehaufen-Ebene
levels.level$feeling.secrets_title=Ebene mit Geheimnissen
levels.level$feeling.chasm_desc=Deine Schritte hallen. Unter dieser Ebene liegt ein Stück A100, das nie jemand zu Ende gebaut hat.
levels.level$feeling.water_desc=Irgendwo in der Nähe plätschert Wasser. Ein Rohrbruch, den niemand meldet, weil ihn alle für den Rohrbruch der anderen halten.
levels.level$feeling.grass_desc=Ein beißender Geruch von Vegetation liegt in der Luft, irgendwo zwischen Baumscheibe, Balkonkräutern und Guerilla-Gardening.
levels.level$feeling.dark_desc=Die Beleuchtung hier läuft auf Sparflamme. Du hörst Feinde, die sich in der Dunkelheit bewegen.
levels.level$feeling.large_desc=Diese Ebene kommt dir ungewöhnlich ausgedehnt vor, wie ein Altbau mit Hinterhaus, Seitenflügel und zweitem Hinterhaus.
levels.level$feeling.traps_desc=Der Boden hier wirkt sehr trügerisch. Viele Hunde haben hier sehr viel Freiheit genossen.
levels.level$feeling.secrets_desc=Die Atmosphäre dieser Ebene deutet auf viele versteckte Geheimnisse hin, wie ein Kellerabteil, das seit Jahren niemandem gehören will.

levels.mininglevel.wall_desc=Eine glatte Gesteinswand, etwas weicher als üblich. Du kannst dich mit deiner Spitzhacke hindurcharbeiten, aber das kostet Kraft und macht dich ein wenig hungriger. Schneller als die offizielle Tunnelbaufirma bist du trotzdem.
levels.mininglevel.gold_extra_desc=Das Glasfaserstück kannst du vermutlich mit deiner Spitzhacke herausschlagen.
levels.mininglevel.crystal_name=Kristallstachel
levels.mininglevel.boulder_name=Geröllbrocken
levels.mininglevel.crystal_desc=Hier tritt farbiger Kristall großflächig zutage. Diese Kristalle sind zerbrechlich und können leicht mit einer Spitzhacke zerschlagen werden. Sie zerbrechen auch, wenn direkt daneben geschürft wird.
levels.mininglevel.boulder_desc=Ein großer Geröllbrocken versperrt den Weg, übrig geblieben von einem Bauabschnitt, den niemand abgenommen hat. Mit einer Spitzhacke sollte er recht leicht zu zerschlagen sein.
levels.mininglevel.barricade_desc=Diese Holzbarrikade steht fest und stützt die Decke.\n\nVermutlich hat der Bautrupp sie gebaut, um sich vor fallenden Steinen zu schützen. Arbeitsschutz auf Bauwicht-Niveau. _Alle angrenzenden Felder sind vor Steinschlag durch Haufen und Angriffe geschützt._\n\nSie sieht aber so aus, als würde sie genauso gut brennen wie jede andere Barrikade.

levels.prisonlevel.water_name=Wischwasser
levels.prisonlevel.empty_deco_desc=Der Boden ist mit Kaffeeflecken, Stempelfarbe und etwas bedeckt, das hoffentlich nur getrocknete Tinte ist.
levels.prisonlevel.bookshelf_desc=Ein Aktenregal, randvoll mit Anträgen, die nie bearbeitet wurden. Das Papier ist knochentrocken. Vielleicht kann man es anzünden?
levels.prisonlevel.region_deco_name=Wartekabine
levels.prisonlevel.region_deco_desc=Ein Metallkäfig, gerade groß genug für eine wartende Person. Das Schild daran sagt: „Bitte warten Sie, bis Ihre Nummer aufgerufen wird.“ Daneben ein Plakat: „Termine für alle. Ab der nächsten Legislatur. Kanzler März.“ Der Käfig ist fest im Boden verankert, du kannst ihn nicht bewegen.
levels.prisonlevel.region_deco_alt_name=Hängende Wartekabine
levels.prisonlevel.region_deco_alt_desc=Ein Metallkäfig, gerade groß genug für eine wartende Person. Er hängt an einer Kette über einem tiefen Abgrund. Die Wartenummer darin wurde nie aufgerufen.

levels.sewerlevel.water_name=Kellerwasser
levels.sewerlevel.empty_deco_desc=Feuchtes Moos wuchert zwischen den Gehwegplatten. Im Inserat hieß das "begrünter Innenbereich".
levels.sewerlevel.bookshelf_desc=Ein Zu-verschenken-Regal voller alter Stadtführer, Steuerratgeber von 2009 und einer Dissertation über Gentrifizierung. Die Bücher sind brennbar.
levels.sewerlevel.region_deco_name=Straßenpapierkorb
levels.sewerlevel.region_deco_desc=Ein orangefarbener Straßenpapierkorb, überklebt mit Stickern und einem Wahlplakat: „Mehr Ordnung im Hinterhof. Kanzler März.“ Darunter übersprüht: „Erst mal Licht im Keller.“ Er ist fest verschraubt und lässt sich nicht verschieben.

levels.vaultlevel$vaultflametrap.name=Pyro-Düse
levels.vaultlevel$vaultflametrap.desc=Diese Düse gehört zur Pyrotechnik und stößt in regelmäßigen Abständen grüne Flammen aus. Kurz bevor sie feuert, siehst du die Flammen sich aufbauen.



###Tiles
tiles.custom.carpet.name=Teppich
tiles.custom.carpet.desc=Dicker Teppichboden bedeckt den Boden, frisch verlegt für die Besichtigung. Er muss irgendwie behandelt worden sein, denn er ist nicht brennbar.
levels.vaultlevel.intro_title=Freitag, Ilsenbrücke
levels.vaultlevel.intro_text=Der Teleport fühlt sich an wie Sonntagmittag, und plötzlich ist alles wieder da.\n\nFreitag, 23:40, Ilsenbrücke. Du wartest auf Malte, ihr wolltet zusammen in die Ilse. Um 23:52 schreibt er: "Sorry, ganz spontan Gästeliste im Bärghain bekommen. Plus null. Nächstes Mal, versprochen!"\n\nDu gehst allein. Die Schlange ist lang, der Türsteher sagt ausnahmsweise nicht "Heute nicht". Danach fehlen ein paar Stunden.\n\nJetzt wachst du auf einem Sofa im Chill-out der Ilse auf. Jacke, Tasche, Ausrüstung: weg. Am Handgelenk ein Bändchen, im Kopf noch die Bassline.\n\n_Finde die %d Garderobenmarken, die im Club verteilt sind, und hol an der Garderobe dein Lieblingsstück zurück._ Hinten im VIP-Bereich steht die Statuette des Filialisten. _Mit dem Bändchen kommst du durch den Notausgang raus, sobald du den Eingangsbereich verlassen hast._
levels.walldeco.shisha_name=Shisha-Bar
levels.walldeco.shisha=Hinter der Scheibe glimmen zwei Wasserpfeifen, davor steht ein weißer Plastikstuhl. Er wohnt hier länger als alle Mieter im Vorderhaus.
levels.walldeco.konditorei_name=Konditorei
levels.walldeco.konditorei=Baklava auf Silbertabletts, Pistazie obendrauf, Sirup überall. Die Gewerbemiete ist in drei Jahren um die Hälfte gestiegen, der Preis pro Stück um zehn Cent.
levels.walldeco.barbershop_name=Barbershop
levels.walldeco.barbershop=Spiegel, roter Stuhl, rot-weiß-blaue Drehsäule. Ohne Termin, ohne Wartenummer, ohne Formular: die effizienteste Behörde im Kiez.
levels.walldeco.fallrohr_name=Fallrohr
levels.walldeco.fallrohr=Ein Zinkrohr leitet den Regen vom Dach in den Hof, großzügig am Gully vorbei. Die Hausverwaltung prüft den Vorgang seit 2014.
levels.walldeco.maerz_1_name=Wahlplakat
levels.walldeco.maerz_1=Ein zerrissenes Wahlplakat: MÄRZ. Jemand hat ihm einen Schnurrbart gemalt, jemand anderes einen Blümchen-Sticker geklebt. Versprochen wird »mehr Tempo«; das Plakat hängt seit drei Wahlen.
levels.walldeco.graffiti_miete_name=Graffiti
levels.walldeco.graffiti_miete=Pink gesprüht, quer über Putz und Klinker: MIETE?! Die Farbe ist nach unten gelaufen. Als Einzige hier.
levels.walldeco.flyer_baerg_name=Flyerwand
levels.walldeco.flyer_baerg=Ein pinker Flyer für den Bärghain, darunter drei ältere. Auf keinem steht, wann die Party endet. Das gilt als Service.
levels.walldeco.gesuch_1_name=Wohnungsgesuch
levels.walldeco.gesuch_1=Ein Abreißzettel mit Hundefoto: »Paar, beide unbefristet, sucht 2 Zimmer, gern Hinterhaus, gern ohne Fenster. Zahlen jede Provision und die Ablöse für eine Küche, die wir nie sehen werden. Hund heißt Keks, ist aber auch bereit auszuziehen.« Zwei Streifen fehlen. Auf allen steht 0176-KEINE-HOFFNUNG.
levels.walldeco.amtslampe_name=Wandlampe
levels.walldeco.amtslampe=Messinglampe mit Milchglasschirm, Baujahr unbekannt, Zuständigkeit ungeklärt. Ausgetauscht wird sie, sobald ein Termin frei wird.
levels.walldeco.graffiti_herz_name=Wartenummer-Anzeige
levels.walldeco.graffiti_herz=Die Anzeige zeigt eine Nummer, die niemand gezogen hat. Daneben klebt ein rotes Herz: Hier hat sich jemand verliebt, irgendwo zwischen 214 und 215.
levels.walldeco.feuerloescher_name=Feuerlöscher
levels.walldeco.feuerloescher=Ein roter Feuerlöscher, laut Plakette zuletzt 2011 geprüft. Für die nächste Prüfung ist ein anderes Referat zuständig.
levels.walldeco.maerz_2_name=Wahlplakat
levels.walldeco.maerz_2=Mit roter Nadel ans Brett gesteckt: MÄRZ verspricht »schnellere Verfahren«. Der Antrag, das Plakat abzuhängen, ist seit der letzten Wahl in Bearbeitung.
levels.walldeco.notausgang_name=Notausgang-Schild
levels.walldeco.notausgang=Ein grünes Schild mit Doppelpfeil. Es zeigt in beide Richtungen, wie jede Auskunft hier.
levels.walldeco.gesuch_2_name=Wohnungsgesuch
levels.walldeco.gesuch_2=Ein Zettel mit rotem Herz: »Suche Wohnung, in der ich alt werden kann. Alternativ eine, in der ich den nächsten Monat überstehe. Liebe Makler, ich hab euch lieb, bitte meldet euch.« Ein Streifen fehlt. Den hat die Sachbearbeiterin genommen, für ihre eigene Suche.
levels.walldeco.plakat_baerg_name=Clubplakat
levels.walldeco.plakat_baerg=Wild plakatiert auf den Tübbing: BÄRG, giftgrün auf Schwarz. Der Club ist längst weitergezogen; das Plakat hält länger als der Bauzeitenplan.
levels.walldeco.graffiti_kran_name=Schablonen-Graffiti
levels.walldeco.graffiti_kran=Ein Baukran als Schablonenbild, rot durchgestrichen. Der echte Kran steht seit Jahren still. Das Graffiti ist wenigstens fertig geworden.
levels.walldeco.gesuch_3_name=Wohnungsgesuch
levels.walldeco.gesuch_3=Getippt, mit blauem Stempel, an die Tunnelwand geklebt: »Solventer Mieter sucht Wohnung jeder Art. Habe SCHUFA, Bürgschaft, Gehaltsnachweise der letzten zehn Jahre und notfalls eine Niere. Zahle jede Provision, auch rückwirkend.« Alle Streifen hängen noch. Hier unten ruft niemand an.
levels.walldeco.lueftung_name=Abluftgitter
levels.walldeco.lueftung=Ein Abluftgitter aus gebürstetem Edelstahl. Es pustet warme Tiefgaragenluft auf den Gehweg: das Einzige, was das Quartier an die Nachbarschaft abgibt.
levels.walldeco.kamera_name=Überwachungskamera
levels.walldeco.kamera=Eine Kamera über dem Eingang. Laut Aufkleber dient sie Ihrer Sicherheit. Gemeint ist die der Tiefgaragenstellplätze.
levels.walldeco.messingschild_name=Messingschild
levels.walldeco.messingschild=Ein poliertes Messingschild ohne Namen. Die 40 Wohnungen dahinter sind voll vermietet. Gewohnt wird in keiner.
levels.walldeco.graffiti_vermieten_name=Maklerschild
levels.walldeco.graffiti_vermieten=Ein Maklerschild »Zu vermieten«, mit einem großen schwarzen X übersprüht. Der Makler hat es trotzdem ins Exposé übernommen: »lebendiges Street-Art-Umfeld«.
levels.walldeco.graffiti_kiez_name=Graffiti
levels.walldeco.graffiti_kiez=KIEZ, in Pink über die Glasfassade gesprüht. Morgen wird die Fassade gereinigt. Das Wort steht dann im Verkaufsprospekt.
levels.walldeco.paternoster_name=Paternoster
levels.walldeco.paternoster=Offene Kabinen fahren ohne Pause im Kreis. Wer oben aussteigt, kommt irgendwann wieder unten an, wie jeder Antrag in diesem Haus.
levels.walldeco.graffiti_wegda_name=Graffiti
levels.walldeco.graffiti_wegda=WEG DA, weiß auf den Rathausklinker gesprüht. Unklar, wer gemeint ist. Angesprochen fühlen sich alle.
levels.walldeco.graffiti_taube_name=Schablonen-Taube
levels.walldeco.graffiti_taube=Eine Taube, mit Schablone auf den Klinker gesprüht. Die echten Tauben haben sie längst als Nachbarin akzeptiert, anders als das Denkmalamt.
