levels.level.default_name=???
levels.level.chasm_desc=Du kannst den Boden nicht sehen. Die Hausverwaltung auch nicht.
levels.level.water_desc=Wenn du brennst, gehe ins Wasser, um das Feuer zu löschen.
levels.level.entrance_desc=Die Treppe führt hinauf zu einer höheren Ebene.
levels.level.exit_desc=Die Treppe führt hinunter auf eine tiefere Ebene. Das Treppenhauslicht geht nach zehn Sekunden aus.
levels.level.embers_desc=Der Boden ist mit Asche bedeckt.
levels.level.high_grass_desc=Dichte Vegetation versperrt die Sicht. Auf der Baumscheibe stand mal "Bitte nicht betreten".
levels.level.locked_door_desc=Diese Tür ist verschlossen. Du brauchst einen passenden Schlüssel, um sie aufzuschließen. Der Hausmeister kommt erst Donnerstag.
levels.level.crystal_door_desc=Diese verschlossene Tür ist aus magischem Kristall gefertigt, sehr offen und sehr zu. Du kannst zwar hindurchsehen, benötigst aber einen Kristallschlüssel, um sie zu öffnen.
levels.level.locked_exit_desc=Dicke Eisenstangen versperren den Zugang zur weiterführenden Treppe.
levels.level.barricade_desc=Eine sorgfältig errichtete Barrikade aus Sperrmüllholz. Das Holz ist knochentrocken. Ob man es anzünden kann?
levels.level.inactive_trap_desc=Dieser Haufen wurde bereits ausgelöst und ist nicht mehr gefährlich. Nur noch eklig.
levels.level.statue_desc=Irgendjemand hat versucht, diesen Ort aufzuwerten, und ist daran offensichtlich gescheitert. So fängt es immer an.
levels.level.alchemy_desc=Dieser Kessel ist mit magischem Wasser gefüllt. Gegenstände können darin in etwas Neues verwandelt werden! Upcycling, aber diesmal funktioniert es.
levels.level.empty_well_desc=Der Brunnen ist ausgetrocknet. Ein Zettel: „Wasser abgestellt wegen Wartung. Dauer: unbestimmt.“

levels.level$feeling.chasm_desc_r1=Irgendwo ist der Kellerboden weggesackt. Die Hausverwaltung nennt das Souterrain mit Galerie.
levels.level$feeling.water_desc_r1=Es plätschert. Entweder der Kanal oder der Wasserschaden aus dem dritten Stock, gemeldet 2009.
levels.level$feeling.grass_desc_r1=Es riecht nach Hinterhofbegrünung. Also nach Unkraut mit Mietaufschlag.
levels.level$feeling.dark_desc_r1=Die Kellerbeleuchtung hat eine Zeitschaltuhr. Sie ist gerade abgelaufen. Irgendwas bewegt sich trotzdem.
levels.level$feeling.large_desc_r1=Dieser Keller ist ungewöhnlich groß. Im Exposé stünde jetzt: großzügiger Schnitt.
levels.level$feeling.traps_desc_r1=Der Boden wirkt hier besonders heimtückisch. Auf der ersten Stufe lag schon ein Haufen, und es war nicht der letzte.
levels.level$feeling.secrets_desc_r1=Hier gibt es mehr Verschläge, als auf dem Lageplan stehen. Irgendwer lagert hier seit Jahrzehnten Dinge.
levels.level$feeling.chasm_desc_r2=Deine Schritte hallen. Ganze Wartebereiche sind in die Tiefe gesackt, samt Wartenden.
levels.level$feeling.water_desc_r2=Es tropft von der Decke in bereitgestellte Eimer. Die Eimer haben eine Inventarnummer.
levels.level$feeling.grass_desc_r2=Die Büropflanzen sind außer Kontrolle geraten. Niemand war für das Gießen zuständig.
levels.level$feeling.dark_desc_r2=Das Licht ist aus. Energiesparmaßnahme. Im Dunkeln raschelt es nach Formularen.
levels.level$feeling.large_desc_r2=Dieser Flur hört nicht auf. Irgendwo am Ende soll Schalter 1 sein.
levels.level$feeling.traps_desc_r2=Überall Haufen. Neben jedem steckt eine Wartenummer.
levels.level$feeling.secrets_desc_r2=Hinter einigen Wänden liegen Akten, die offiziell nie existiert haben.
levels.level$feeling.chasm_desc_r3=Die Baugrube ist hier tiefer als geplant. Das war sie schon immer.
levels.level$feeling.water_desc_r3=Grundwasser drückt in den Tunnel. Die Pumpen laufen seit 2009 und pumpen den Wasserschaden aus dem dritten Stock ab.
levels.level$feeling.grass_desc_r3=Auf der Baustelle wächst ein ganzer Wald. So lange liegt sie schon still.
levels.level$feeling.dark_desc_r3=Die Baustellenlampen sind aus. Irgendwo in der Dunkelheit wummert ein Bass, seit Freitag, und etwas bewegt sich im Takt.
levels.level$feeling.large_desc_r3=Dieser Bauabschnitt ist riesig. Laut Bauschild ist er seit Jahren fast fertig.
levels.level$feeling.traps_desc_r3=Überall Haufen, Kabel und lose Platten. Arbeitsschutz war im Budget nicht vorgesehen, Kotbeutel auch nicht.
levels.level$feeling.secrets_desc_r3=Die Baupläne stimmen nicht mit dem Tunnel überein. Irgendwo gibt es Abkürzungen.
levels.level$feeling.chasm_desc_r4=Unter den Glasfassaden klafft ein Loch. Man nennt es Tiefgarage mit Weitblick.
levels.level$feeling.water_desc_r4=Hier plätschert ein Designerbrunnen, gespeist aus einem Wasserschaden von 2009. Im Exposé heißt er Wasserspiel.
levels.level$feeling.grass_desc_r4=Vertikale Gärten, so weit das Auge reicht. Gegossen wird von Leuten, die hier nie wohnen werden.
levels.level$feeling.dark_desc_r4=Die Beleuchtung ist nur für Eigentümer freigeschaltet. Mieter tappen im Dunkeln, wie immer.
levels.level$feeling.large_desc_r4=Dieses Quartier ist unverschämt groß. Die Quadratmeter wurden einzeln bepreist.
levels.level$feeling.traps_desc_r4=Die Böden sind poliert und trügerisch. Wie der Mietvertrag mit Staffelmiete.
levels.level$feeling.secrets_desc_r4=Hinter den Hochglanzwänden stehen noch die alten Altbaumauern. Sie haben Durchgänge.
levels.level$feeling.chasm_desc_r5=Der Boden unter dem Rathaus bricht ins Nichts. Zuständig ist niemand.
levels.level$feeling.water_desc_r5=Hier fließt etwas, das kein Wasser ist. Laut Aktenlage ist es trotzdem Trinkwasser.
levels.level$feeling.grass_desc_r5=Aus den Aktenbergen wuchert etwas. Es wächst schneller als jede Bearbeitungszeit.
levels.level$feeling.dark_desc_r5=Es ist stockdunkel, und etwas beobachtet dich. Irgendwo raschelt die Akte „Hundekot, ungeklärt, seit 1987“.
levels.level$feeling.large_desc_r5=Diese Halle ist gewaltig. Hier passen alle offenen Anträge der Stadt hinein, und es sind alle hier.
levels.level$feeling.traps_desc_r5=Jede Fliese hier ist ein Paragraph. Einige davon sind scharf.
levels.level$feeling.secrets_desc_r5=Das Fundament ist voller Hohlräume. Die Stadt hat hier unten mehr versteckt als Geld.
levels.level$feeling.chasm_title=Ebene mit Abgrund
levels.level$feeling.water_title=Wasser-Ebene
levels.level$feeling.grass_title=Grüne Ebene
levels.level$feeling.dark_title=dunkle Ebene
levels.level$feeling.large_title=große Ebene
levels.level$feeling.traps_title=Hundehaufen-Ebene
levels.level$feeling.secrets_title=Ebene mit Geheimnissen
levels.level$feeling.chasm_desc=Deine Schritte hallen, als bestünde der Boden hier nur noch aus Hoffnung und Gipskarton.
levels.level$feeling.water_desc=Irgendwo in der Nähe plätschert Wasser. Ein Rohrbruch, den niemand meldet, weil ihn alle für den Rohrbruch der anderen halten.
levels.level$feeling.grass_desc=Ein beißender Geruch von Vegetation liegt in der Luft, irgendwo zwischen Baumscheibe, Balkonkräutern und Guerilla-Gardening.
levels.level$feeling.dark_desc=Die Beleuchtung hier läuft auf Sparflamme. Du hörst Feinde, die sich in der Dunkelheit bewegen.
levels.level$feeling.large_desc=Diese Ebene kommt dir ungewöhnlich ausgedehnt vor, wie ein Altbau mit Hinterhaus, Seitenflügel und zweitem Hinterhaus.
levels.level$feeling.traps_desc=Der Boden hier wirkt sehr trügerisch. Viele Hunde haben hier sehr viel Freiheit genossen.
levels.level$feeling.secrets_desc=Die Atmosphäre dieser Ebene deutet auf viele versteckte Geheimnisse hin, wie ein Kellerabteil, das seit Jahren niemandem gehören will.

levels.mininglevel.wall_desc=Eine glatte Gesteinswand, etwas weicher als üblich. Du kannst dich mit deiner Spitzhacke hindurcharbeiten, aber das kostet Kraft und macht dich ein wenig hungriger. Schneller als die offizielle Tunnelbaufirma bist du trotzdem.
levels.mininglevel.gold_extra_desc=Das kannst du vermutlich mit deiner Spitzhacke herausschlagen.
levels.mininglevel.crystal_name=Kristallstachel
levels.mininglevel.boulder_name=Geröllbrocken
levels.mininglevel.crystal_desc=Hier tritt farbiger Kristall großflächig zutage. Diese Kristalle sind zerbrechlich und können leicht mit einer Spitzhacke zerschlagen werden. Sie zerbrechen auch, wenn direkt daneben geschürft wird.
levels.mininglevel.boulder_desc=Ein großer Geröllbrocken versperrt den Weg, übrig geblieben von einem Bauabschnitt, den niemand abgenommen hat. Mit einer Spitzhacke sollte er recht leicht zu zerschlagen sein.
levels.mininglevel.barricade_desc=Diese Holzbarrikade steht fest und stützt die Decke.\n\nVermutlich hat der Bautrupp sie gebaut, um sich vor fallenden Steinen zu schützen. Arbeitsschutz auf Bauwicht-Niveau. _Alle angrenzenden Felder sind vor Steinschlag durch Haufen und Angriffe geschützt._\n\nSie sieht aber so aus, als würde sie genauso gut brennen wie jede andere Barrikade.

levels.prisonlevel.water_name=Wischwasser
levels.prisonlevel.empty_deco_desc=Der Boden ist mit Kaffeeflecken, Stempelfarbe und etwas bedeckt, das hoffentlich nur getrocknete Tinte ist.
levels.prisonlevel.bookshelf_desc=Ein Aktenregal, randvoll mit Anträgen, die nie bearbeitet wurden. Das Papier ist knochentrocken. Vielleicht kann man es anzünden?
levels.prisonlevel.region_deco_name=Wartekabine
levels.prisonlevel.region_deco_desc=Ein Metallkäfig, gerade groß genug für eine wartende Person. Das Schild daran sagt: „Bitte warten Sie, bis Ihre Nummer aufgerufen wird.“ Daneben ein Plakat: „Termine für alle. Ab der nächsten Legislatur. Kanzler März.“ Der Käfig ist fest im Boden verankert, du kannst ihn nicht bewegen.
levels.prisonlevel.region_deco_alt_name=Hängende Wartekabine
levels.prisonlevel.region_deco_alt_desc=Ein Metallkäfig, gerade groß genug für eine wartende Person. Er hängt an einer Kette über einem tiefen Abgrund. Die Wartenummer darin wurde nie aufgerufen.

levels.sewerlevel.water_name=Kellerwasser
levels.sewerlevel.empty_deco_desc=Feuchtes Moos wuchert zwischen den Gehwegplatten. Im Inserat hieß das "begrünter Innenbereich".
levels.sewerlevel.bookshelf_desc=Ein Zu-verschenken-Regal voller alter Stadtführer, Steuerratgeber von 2009 und einer Dissertation über Gentrifizierung. Die Bücher sind brennbar.
levels.sewerlevel.region_deco_name=Straßenpapierkorb
levels.sewerlevel.region_deco_desc=Ein orangefarbener Straßenpapierkorb, überklebt mit Stickern und einem Wahlplakat: „Mehr Ordnung im Hinterhof. Kanzler März.“ Darunter übersprüht: „Erst mal Licht im Keller.“ Er ist fest verschraubt und lässt sich nicht verschieben.

levels.vaultlevel$vaultflametrap.name=Flammenauslass
levels.vaultlevel$vaultflametrap.desc=Dieser Auslass stößt in regelmäßigen Abständen Stöße grüner Flammen aus. Kurz bevor er feuert, siehst du die Flammen sich aufbauen.



###Tiles
tiles.custom.carpet.name=Teppich
tiles.custom.carpet.desc=Dicker Teppichboden bedeckt den Boden, frisch verlegt für die Besichtigung. Er muss irgendwie behandelt worden sein, denn er ist nicht brennbar.
