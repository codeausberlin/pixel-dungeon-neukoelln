challenges.no_food=Auf Diät
challenges.no_food_desc=Nahrungsmittel sind ohnehin knapp, und der Späti hat die Portionen auch verkleinert!\n\n- Nahrung und das Füllhorn haben nur ein Drittel des hungerstillenden Effekts\n- Andere Sättigungsquellen sind davon nicht betroffen
challenges.no_armor=Der Glaube ist meine Rüstung
challenges.no_armor_desc=Du brauchst Vertrauen in dich selbst, denn deine Rüstung ist so viel wert wie eine Kaution bei Auszug!\n\n- Der Basisschutzwert ist für alle Rüstungen, außer Kleidung, reduziert.\n- Alle Verbesserungen bei Rüstung sind nun kaum noch effektiv.\n- Die Verteidigungskraft des irdenen Wächters ist ebenfalls deutlich reduziert.
challenges.no_healing=Ingwer-Allergie
challenges.no_healing_desc=Ingwer-Heilshots sind sicher praktisch, leider bist du allergisch dagegen! Deine Heilpraktikerin hat es dir ja gesagt.\n\n- Ingwer-Heilshots und Gegenstände, die mit Ingwer-Heilshots hergestellt werden, sowie Pflasterfrucht vergiften den Helden, anstatt ihn zu heilen.\n- Reste-Bowle kann den Helden nicht zufällig vergiften oder heilen.\n- Diese Gegenstände funktionieren für andere Charaktere weiterhin normal.
challenges.no_herbalism=Versiegelte Flächen
challenges.no_herbalism_desc=Jede Baumscheibe wurde zubetoniert, und klares Wasser gibt es in diesem Untergrund auch nicht mehr. Die Bauaufsicht nennt das Aufwertung.\n\n- Tautropfen sind entfernt\n- Pflanzen sind entfernt\n- Samen erscheinen weiterhin, werden aber nicht gedeihen
challenges.swarm_intelligence=Schwarmintelligenz
challenges.swarm_intelligence_desc=Pass auf, die Monster im Untergrund werden schlauer! Sie haben eine Chatgruppe gegründet.\n\n- Solange Gegner dich oder deine Verbündeten sehen, locken sie andere Gegner in der Nähe zu deiner Position.\n- Die Reichweite dafür beginnt bei nur 2 Feldern, wächst aber um 2 für jeden Zug, in dem der Gegner dich sieht, bis maximal 12.\n- Wird die Sichtlinie unterbrochen, setzt sich die Lockreichweite zurück, selbst kurz, zum Beispiel durch eine Tür.
challenges.darkness=Stromsperre
challenges.darkness_desc=Die Zeitschaltuhr im Treppenhaus steht auf drei Sekunden. Die Hausverwaltung nennt das Energiesparen.\n\n- normal sichtbare Reichweite stark reduziert\n- eine Handytaschenlampe erscheint auf jeder Ebene\n- andere Lichtquellen sind 1/5 so effektiv
challenges.no_scrolls=Vergriffene Vordrucke
challenges.no_scrolls_desc=Ein bestimmter Vordruck ist vergriffen. Natürlich immer der, den du am dringendsten brauchst.\n\n- Die Hälfte der Modernisierungsbescheide wird aus dem Untergrund entfernt
challenges.champion_enemies=Feindliche Champions
challenges.champion_enemies_desc=Du bist nicht der Einzige, der aufsteigen kann!\n\nNormale Gegner haben eine 1/8 Chance, mit einem speziellem Champion-Buff auf Ebene 1 zu erscheinen; diese Chance erhöht sich graduell bis zu 1/6 auf Ebene 21.\n\n- Champions wachen auf, wenn sie schlafend erscheinen;\n- Der Held erfährt, wenn ein Champion erscheint;\n- Champions können nicht zu Verbündeten gemacht werden.\n\nEs gibt sechs Arten von gegnerischen Champions:\n_Flammend (orange):_ +25% Nahkampfschaden, entzündet beim Treffer, verbreitet Flammen bei Tod, kann keine Wasserfelder entzünden;\n_Projizierend (lila):_ +25% Nahkampfschaden, +3 Nahkampf-Reichweite;\n_Antimagisch (grün):_ -50% erlittener Schaden, immun gegen magische Effekte;\n_Gigantisch (blau):_ -80% erlittener Schaden, +1 Nahkampfreichweite, kann keine Tunnel betreten;\n_Gesegnet (gelb):_ 4x Genauigkeit und Ausweichen;\n_Wachsend (rot):_ +20% Genauigkeit, Ausweichen, Schaden und effektive Lebenspunkte. Erhöht sich alle 4 Züge um 1%.
challenges.stronger_bosses=Bösere Bosse
challenges.stronger_bosses_desc=Die Bosse sind mit dieser Herausforderung viel härter! Wie die Hausverwaltung nach der Umwandlung in Eigentum.\n\n_Mietschimmel:_ +20% Gesundheit\n_-_ Heilung im Wasser erhöht sich auf 3/Zug\n_-_ Pumpt sich in 1 Zug auf, statt in 2\n_Schalterspringer:_ +25% Gesundheit\n_-_ Phase 1: Haufen sind viel tödlicher\n_-_ Phase 2: Fähigkeiten sind häufiger\n_DM-300 Bohrlinde:_ +33% Gesundheit\n_-_ Pylonen sind zäher und 3 aktivieren\n_-_ Fähigkeiten sind mächtiger und häufiger\n_-_ Die Bohrlinde ist schneller, wenn sie aufgeladen ist\n_-_ Freiliegende Drähte sind doppelt so häufig\n_König der Eigentumswohnungen:_ +50% Gesundheit\n_-_ Untertanen sind in allen Phasen stärker\n_-_ Phase 1: schnellere Fähigkeiten und Beschwörungen\n_-_ Phase 2: 2 Untertanen mehr pro Zug\n_-_ Phase 3: 2x Gesundheit, schnellere Beschwörungen\n_Ewiger Mietspiegel:_\n_-_ Es werden zwei Fäuste auf einmal beschworen!\n_-_ +60% Laserschaden\n_-_ Stärkere Untertanen

