###blobs
actors.blobs.blizzard.name=Schneesturm
actors.blobs.blizzard.desc=Hier tobt ein Schneesturm. Der Winterdienst ist informiert und kommt im April.

actors.blobs.confusiongas.name=Verwirrungsgas
actors.blobs.confusiongas.desc=Eine Wolke aus Verwirrungsgas wirbelt hier herum. Riecht wie der Ausgang vom Club am Sonntagmittag.

actors.blobs.electricity.name=Elektrizität
actors.blobs.electricity.desc=Ein elektrisches Feld wirft hier helle Funken. Die Elektrik hat vermutlich der Schwager des Vermieters verlegt.
actors.blobs.electricity.rankings_desc=Durch Stromschlag getötet
actors.blobs.electricity.ondeath=Ein Stromschlag hat dich erledigt... Der Elektriker hatte keinen Termin frei.

actors.blobs.fire.name=Feuer
actors.blobs.fire.desc=Hier wütet ein Feuer. Irgendwer hat wieder im Hinterhof gegrillt.

actors.blobs.foliage.name=Laub
actors.blobs.foliage.desc=Lichtstrahlen durchbrechen die Finsternis des unterirdischen Gartens. Ein Schild sagt: Gemeinschaftsgarten, Warteliste 2031.

actors.blobs.freezing.name=eiskalte Luft
actors.blobs.freezing.desc=Die Luft hier ist unnatürlich kalt. Heizung wird "zeitnah" repariert.

actors.blobs.goowarn.name=dunkle Energie
actors.blobs.goowarn.desc=Partikel dunkler Energie schwärmen hier umher! Riecht nach feuchter Tapete.

actors.blobs.inferno.name=Inferno
actors.blobs.inferno.desc=Hier wütet ein Inferno. Die Feuerwehr steht im Stau auf der Sonnenallee.

actors.blobs.paralyticgas.name=Lähmungsgas
actors.blobs.paralyticgas.desc=Eine Wolke aus Lähmungsgas wirbelt hier herum. Wer sie einatmet, fühlt sich wie im Wartebereich des Bürgeramts.

actors.blobs.regrowth.name=Wildwuchs

actors.blobs.sacrificialfire.name=Opferflamme
actors.blobs.sacrificialfire.desc=Hier steht ein Altar mit einer brennenden Opferflamme, gestiftet vom Quartiersmanagement. Jede Kreatur, die hier getötet wird, wird von den Flammen als Opfer für die Geister des Kiezes verzehrt.\n\nVielleicht gibt es eine Belohnung, wenn genügend Opfer dargebracht worden sind? Förderanträge funktionieren ähnlich.
actors.blobs.sacrificialfire.worthy=Das Feuer verzehrt deine Opfergabe und wird größer. Das Quartiersmanagement ist zufrieden.
actors.blobs.sacrificialfire.unworthy=Das Feuer verzehrt deine Opfergabe, verändert sich aber nicht. Nicht förderfähig.
actors.blobs.sacrificialfire.reward=Das Feuer erstrahlt hell und erlischt. Zurück bleibt eine Belohnung, der Förderbescheid kommt per Post.

actors.blobs.bauzaun.name=Bauzaun
actors.blobs.bauzaun.desc=Ein Bauzaun. In ein paar Zügen ist er wieder weg, oder früher, wenn er Feuer fängt.

actors.blobs.scherben.name=Scherben
actors.blobs.scherben.desc=Hier glitzern zerbrochene Pfandflaschen am Boden. Wer hineintritt, verletzt sich, außer er fliegt.
actors.blobs.scherben.step=Autsch! Scherben.
actors.blobs.scherben.ondeath=Du bist an zerbrochenen Pfandflaschen verblutet...
actors.blobs.scherben.rankings_desc=Von Pfandflaschen zerschnitten

actors.blobs.smokescreen.name=Nebelwand
actors.blobs.smokescreen.desc=Hier wirbelt eine dicke, schwarze Rauchwolke herum. Nebelmaschine auf Anschlag, wie auf dem Floor um sechs Uhr früh.

actors.blobs.stenchgas.name=Stinkgas
actors.blobs.stenchgas.desc=Eine übelriechende Wolke hängt hier schwer in der Luft. Die Biotonne wurde seit drei Wochen nicht geleert.

actors.blobs.stormcloud.name=Gewitterwolken
actors.blobs.stormcloud.desc=Hier wabert eine Wolke aus Wasserdampf herum. Klassisches Berliner Sommerwetter.

actors.blobs.toxicgas.name=Giftgas
actors.blobs.toxicgas.desc=Eine grünliche Wolke aus giftigen Gasen wirbelt hier herum. Der Leihscooter-Akku im Keller war es nicht. Sagt der Anbieter.
actors.blobs.toxicgas.rankings_desc=Erstickt
actors.blobs.toxicgas.ondeath=Du bist am giftigen Gas gestorben... Laut Messprotokoll lagen alle Werte im Rahmen.

actors.blobs.corrosivegas.name=Zersetzungsgas
actors.blobs.corrosivegas.desc=Hier wirbelt eine Wolke aus tödlich ätzendem Gas herum. Mindestens so ätzend wie die Kommentare in der Nachbarschafts-App.

actors.blobs.waterofawareness.name=Wasser der Wahrnehmung
actors.blobs.waterofawareness.procced=Als du einen Schluck nimmst, spürst du, wie sich dein Geist mit Erkenntnis füllt. Du weißt jetzt sogar, wer im Haus den Müll falsch trennt.
actors.blobs.waterofawareness.desc=Die Macht des Wissens strahlt aus dem Wasser dieses Brunnens. Wenn du davon trinkst, werden alle getragenen Gegenstände vollständig identifiziert, Flüche auf allen Gegenständen in deinem Inventar erkannt und alle Gegenstände in der aktuellen Ebene offenbart.

actors.blobs.waterofhealth.name=Wasser der Gesundheit
actors.blobs.waterofhealth.procced=Als du einen Schluck nimmst, fühlst du, wie alle deine Wunden verheilen. Ganz ohne Überweisung.
actors.blobs.waterofhealth.desc=Das einzige Wasser hier unten, das nicht aus einem Rohrbruch stammt. Trinke aus diesem Brunnen, um deine Wunden zu heilen, deinen Hunger zu stillen und Flüche von allen getragenen Gegenständen zu brechen.

actors.blobs.web.name=Spinnennetz
actors.blobs.web.desc=Dicke Spinnweben bedecken hier alles. Die Spinnweben werden von allem zerstört, was sie berührt oder durch sie hindurchgeworfen wird, aber der betroffene Gegenstand bleibt an der Stelle hängen.



###buffs
actors.buffs.adrenaline.name=Adrenalin
actors.buffs.adrenaline.desc=Ein Kraftschub wie drei Mate auf nüchternen Magen, der Angriffs- und Bewegungsgeschwindigkeit verstärkt.\n\nDas so freigegebene Adrenalin ermöglicht es dem Anwender, die doppelte Angriffs- und 1,5-fache Bewegungsgeschwindigkeit zu entfalten\n\nVerbleibende Züge: %s

actors.buffs.adrenalinesurge.name=Stärkebonus
actors.buffs.adrenalinesurge.desc=Ein plötzlicher Kraftschub, leider befristet wie jeder neue Mietvertrag.\n\nStärkebonus +%d.\nZüge bis zum Abklingen: %s.

actors.buffs.amok.name=Amok
actors.buffs.amok.desc=Amok erzeugt einen Zustand aus Zorn und Verwirrung, ungefähr wie Schienenersatzverkehr um 7:40 Uhr.\n\nSolange eine Kreatur Amok läuft, wird diese alles angreifen, was in ihrer Nähe ist, egal ob Freund oder Feind. \n\nVerbleibende Züge mit Amok: %s.

actors.buffs.arcanearmor.name=arkane Rüstung
actors.buffs.arcanearmor.desc=Ein feiner Schild umgibt dich, welcher den Schaden von magischen Angriffen verringert.\n\nDeine magische Rüstung ist momentan verstärkt um: 0-%d.\n\nZüge, bis die magische Rüstung vergeht: %s.

actors.buffs.artifactrecharge.name=Artefaktaufladung
actors.buffs.artifactrecharge.desc=Energie durchströmt dich und erhöht die Aufladegeschwindigkeit deiner ausgerüsteten Artefakte.\n\nDieser Effekt betrifft Artefakte unterschiedlich stark, jedoch wird jedes Artefakt schneller aufgeladen als normal.\n\nVerbleibende Züge: %s.

actors.buffs.ascensionchallenge.name=Fluch des Mietvertrags
actors.buffs.ascensionchallenge.desc=Irgendwie hält der Ewige Mietspiegel über den Mietvertrag seinen Einfluss auf diese Welt aufrecht und versucht, deinen Aufstieg zu verhindern! Ein unbefristeter Vertrag ist ihm ein Dorn im Auge.\n\nSein Einfluss macht die Unterwelt wesentlich gefährlicher: Die Zahl der Gegner wächst und sie werden stärker! Diese Macht wird weiter wachsen, wenn nichts dagegen unternommen wird. Sie kann eingedämmt werden, wenn man Gegner besiegt, die durch die Macht des Mietspiegels verstärkt worden sind.
actors.buffs.ascensionchallenge.desc_clear=Die dunkle Energie, die der Mietvertrag ausstrahlt, ist einstweilen, so gut es möglich ist, geschwächt.
actors.buffs.ascensionchallenge.desc_beckon=Der Mietvertrag _ruft gerade entfernte Gegner herbei_ und führt sie zu deiner Position. Alle wollen ihn haben.
actors.buffs.ascensionchallenge.desc_haste=Der Mietvertrag _beschleunigt jetzt entfernte Gegner,_ so dass sie schneller zu dir kommen!
actors.buffs.ascensionchallenge.desc_slow=Der Mietvertrag _verlangsamt dich_ gerade, so dass Effekte der Geschwindigkeitserhöhung negiert werden!
actors.buffs.ascensionchallenge.desc_damage=Die vom Mietvertrag abgestrahlte Energie ist so stark geworden, dass sie dir _direkt schadet!_
actors.buffs.ascensionchallenge.beckon=Der Mietvertrag ruft nun weit entfernte Gegner herbei. Das spricht sich schnell rum.
actors.buffs.ascensionchallenge.haste=Der Mietvertrag beschleunigt nun weit entfernte Gegner!
actors.buffs.ascensionchallenge.slow=Der Mietvertrag fühlt sich in deinen Habseligkeiten nun an wie ein Aktenordner voller Nebenkostenabrechnungen!
actors.buffs.ascensionchallenge.damage=Der Mietvertrag beginnt, dunkle Energie auszustrahlen. Das Papier brennt!
actors.buffs.ascensionchallenge.weaken_info=Der Fluch des Mietvertrags kann geschwächt werden, indem mehr Feinde besiegt werden.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Wenn du Feinde besiegst, wird sich der Fluch des Mietvertrags abschwächen!
actors.buffs.ascensionchallenge.weaken=Du spürst, wie der Fluch des Mietvertrags etwas nachlässt.
actors.buffs.ascensionchallenge.break=Du nimmst dir etwas Zeit, um Atem zu schöpfen, und spürst, wie deine Wunden zu heilen beginnen!
actors.buffs.ascensionchallenge.almost=Du spürst, wie die Macht des Ewigen Mietspiegels über den Mietvertrag schwächer wird, du hast es fast geschafft!
actors.buffs.ascensionchallenge.on_kill=Die dunkle Energie verschlingt dich...

actors.buffs.barkskin.name=Rindenhaut
actors.buffs.barkskin.desc=Deine Haut ist gehärtet und fühlt sich rau und fest an wie Rinde. Oder wie eine Alteingesessene nach zehn Wintern ohne funktionierende Heizung.\n\nDie gehärtete Haut erhöht deine effektive Rüstung, wodurch du dich besser gegen physische Angriffe verteidigen kannst.\n\nDeine Rüstung ist derzeit erhöht um: 0-%d.\nVerbleibende Züge bis zur Schwächung der Rindenhaut: %s.\n\nFalls du Rindenhaut von mehreren Quellen erhältst, wirkt sich nur die stärkste aus.

actors.buffs.barrier.name=Barriere
actors.buffs.barrier.desc=Eine dauerhafte Kraftblase, die jeden Schaden blockiert, dicht wie die Brandschutztür, die hinter dir zugefallen ist.\n\nDie Barriere übernimmt den Schaden für alles, was sie schützt, solange noch Abschirmung vorhanden ist. Die Abschirmung wird jedoch mit der Zeit langsam abgebaut.\n\nVerbleibende Abschirmung: %d.

actors.buffs.berserk.angered=verärgert
actors.buffs.berserk.berserk=rasend
actors.buffs.berserk.exhausted=erschöpft
actors.buffs.berserk.recovering=sich erholend
actors.buffs.berserk.angered_desc=Die Schwere ihrer Verletzungen verstärkt die Schläge der Wutbürgerin. Erleidet sie physischen Schaden, wächst ihre Wut und verleiht ihr Bonusschaden. Auch Schaden, den die Rüstung abblockt, zählt für die Wut.\n\nDie Wut klingt mit der Zeit ab. Je niedriger ihre Gesundheit, desto länger hält sie an.\n\nBei 100%% Wut kann die Wutbürgerin in Raserei verfallen und erhält dann Abschirmung abhängig von der Stufe ihrer Rüstung und ihren fehlenden LP. In der Raserei baut sich diese Abschirmung mit der Zeit ab; ist sie aufgebraucht, muss sie sich erholen, bevor sie wieder Wut aufbauen kann.\n\nDerzeitige Wut: _%1$.0f%%_\n_+%2$.0f%%_ Schaden\n\nRaserei-Abschirmung mit derzeitiger Rüstung und LP: _%3$d_
actors.buffs.berserk.berserk_desc=Furcht und Zweifel verblassen, nur der blanke Zorn bleibt. In diesem Zustand ist die Wutbürgerin äußerst gefährlich: _Sie verursacht +50%% Schaden und erhält zusätzliche Abschirmung,_ verliert aber jeden Zug Abschirmung.\n\nSinkt ihre Abschirmung auf 0, endet die Raserei.\n\nDanach muss sich die Wutbürgerin erholen, bevor sie wieder Wut aufbauen kann.\n\nVerbleibende Abschirmung: %d
actors.buffs.berserk.recovering_desc=Auch Empörung hat Grenzen. Die Wutbürgerin muss sich erholen, bevor sie ihre Wut wieder einsetzen kann.\n\nWährend sie sich erholt, baut erlittener Schaden keine Wut auf.
actors.buffs.berserk.recovering_desc_turns=Züge bis zur Genesung: _%d_
actors.buffs.berserk.recovering_desc_levels=Level bis zur Erholung: _%.2f_
actors.buffs.berserk.rankings_desc=Zu Tode gewütet.
actors.buffs.berserk.action_name=Raserei
actors.buffs.berserk.no_seal=Du benötigst deinen Kiez-Aufnäher für die Raserei!

actors.buffs.bleeding.name=blutend
actors.buffs.bleeding.ondeath=Du bist verblutet...
actors.buffs.bleeding.heromsg=Du blutest!
actors.buffs.bleeding.rankings_desc=Verblutet
actors.buffs.bleeding.desc=Aus dieser Wunde tritt eine besorgniserregende Menge Blut aus. Die Hausarztpraxis nimmt leider keine neuen Patienten auf.\n\nDie Blutung richtet jeden Zug Schaden an. Dieser Schaden verringert sich jeden Zug um einen zufälligen Wert, bis die Blutung gestillt ist.\n\nDiese Blutung richtet im Moment bis zu %d Schaden an.

actors.buffs.bless.name=gesegnet
actors.buffs.bless.desc=Eine beträchtliche Steigerung der Konzentration, ausgelöst durch eine Eingebung der Götter, so sagt man. Oder durch einen freien Sitzplatz in der U8.\n\nDieser Segen steigert die Zielgenauigkeit und Ausweichrate um 25%%, was den Gesegneten einen Kampf wesentlich effektiver bestreiten lässt.\n\nVerbleibende Züge mit Segnung: %s.

actors.buffs.blindness.name=geblendet
actors.buffs.blindness.heromsg=Du bist geblendet!
actors.buffs.blindness.desc=Geblendet zu sein hüllt die Welt in einen dunklen Schleier, als hätte die Treppenhausbeleuchtung nach 30 Sekunden wieder abgeschaltet.\n\nWährend ein Charakter geblendet ist, ist seine Sichtweite auf ein Feld reduziert, womit Fernkampfangriffe nutzlos sind und man weiter entfernte Feinde leicht aus der Sicht verliert. Zusätzlich ist ein geblendeter Held nicht in der Lage, Schriftrollen oder Bücher zu lesen. \n\nVerbleibende Züge mit Erblindung: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=brennend
actors.buffs.burning.heromsg=Du hast Feuer gefangen!
actors.buffs.burning.burnsup=%s verbrennt!
actors.buffs.burning.ondeath=Du bist verbrannt...
actors.buffs.burning.rankings_desc=Zu Asche verbrannt
actors.buffs.burning.desc=Nur wenige Dinge sind besorgniserregender, als in Flammen zu stehen. Die Mülltonnen im Hinterhof können ein Lied davon singen.\n\nFeuer richtet jeden Zug Schaden an, bis es durch Wasser gelöscht wird oder abklingt. Auch das Zerschmettern eines Trankes in unmittelbarer Nähe kann Feuer löschen.\n\nSolange man brennt, besteht die Gefahr, dass entflammbare Gegenstände oder Terrain entzündet werden, sobald man mit diesem in Berührung kommt.\n\nVerbleibende Züge in Flammen: %s.

actors.buffs.championenemy.warn=Du spürst eine tödliche Gegenwart. Irgendwer hier unten hat ein Premium-Abo.
actors.buffs.championenemy$blazing.name=Flammen-Champion
actors.buffs.championenemy$blazing.desc=Flammende Champions verursachen 25% mehr Nahkampfschaden, entzünden Gegner, die sie angreifen, sind immun gegen Feuer und verbreiten bei ihrem Tod Feuer um sich herum. Wasser ist von diesem Feuer aber nicht betroffen.
actors.buffs.championenemy$projecting.name=projizierender Champion
actors.buffs.championenemy$projecting.desc=Projizierende Champions verursachen 25% mehr Nahkampfschaden und haben +3 Angriffsreichweite.
actors.buffs.championenemy$antimagic.name=Antimagie-Champion
actors.buffs.championenemy$antimagic.desc=Antimagische Champions erleiden 50% weniger Schaden und sind immun gegenüber magischen Effekten.
actors.buffs.championenemy$giant.name=Riesen-Champion
actors.buffs.championenemy$giant.desc=Riesen-Champions erleiden 80% weniger Schaden und haben +1 Angriffsreichweite, können sich aber nicht durch enge Räume bewegen.
actors.buffs.championenemy$blessed.name=gesegneter Champion
actors.buffs.championenemy$blessed.desc=Gesegnete Champions haben eine 4-fache Genauigkeit und Ausweichrate.
actors.buffs.championenemy$growing.name=Wachstums-Champion
actors.buffs.championenemy$growing.desc=Wachsende Champions erhalten einen stetig steigenden Bonus auf Genauigkeit, Ausweichen, physischen Schaden und eine Reduzierung des erlittenen Schadens.\n\nAktueller Genauigkeit-/Ausweich-/Schadensbonus: %1$d%%\nAktuelle Schadensreduzierung: %2$d%%

actors.buffs.charm.name=betört
actors.buffs.charm.heromsg=Du wurdest betört!
actors.buffs.charm.cant_attack=Du wurdest von diesem Gegner betört und kannst ihn nicht angreifen.
actors.buffs.charm.desc=Betörung ist eine manipulative Magie, die Feinde zeitweilig dazu bringen kann, einander zu mögen. Wie ein gelungenes WG-Casting, nur kürzer.\n\nCharaktere, welche von Betörung betroffen sind, können den Feind, von welchem sie betört wurden, nicht direkt angreifen. Dabei ist es aber nach wie vor möglich, andere Ziele zu attackieren. Der Schock durch Schmerz wird die Dauer der Betörung verringern.\n\nVerbleibende Züge mit Betörung: %s.

actors.buffs.chill.name=unterkühlt
actors.buffs.chill.freezes=%s friert ein!
actors.buffs.chill.desc=Nicht ganz gefroren, aber trotzdem viel zu kalt. Altbau im Februar eben.\n\nUnterkühlte Ziele führen alles langsamer aus, abhängig von den übrigen Zügen des Effekts. Im schlimmsten Fall wirkt die Unterkühlung wie eine Verlangsamung.\n\nVerbleibende Züge mit Unterkühlung: %1$s.\nGeschwindigkeit ist reduziert um: %2$s%%

actors.buffs.combo.name=Kombi
actors.buffs.combo.action_name=Kombi-Angriff
actors.buffs.combo.combo=%d-Treffer-Kombi!
actors.buffs.combo.bad_target=Das Ziel ist zu weit entfernt
actors.buffs.combo.prompt=Wähle ein Ziel für den Angriff.
actors.buffs.combo.desc=Erfolgreiche Angriffe bringen die Kiezboxerin in Fahrt: Jeder Treffer mit Nah- oder Wurfwaffen erhöht die Kombi um 1, eine längere Pause setzt sie aber vollständig zurück. Während einer Kombi baut sich die Abschirmung des Kiez-Aufnähers nicht mit der Zeit ab.\n\nDie Kombi ermöglicht besondere Kombi-Angriffe mit Treffergarantie! Ab einer Kombi von 2, 4, 6, 8 und 10 stehen verschiedene Aktionen bereit. Manche beenden die Kombi, andere nicht, und jede ist nur einmal pro Kombi einsetzbar.\n\nAktuelle Kombi: %1$d.\n\nZüge bis zum Ende der Kombi: %2$s.
actors.buffs.combo$combomove.clobber.name=Prügel
actors.buffs.combo$combomove.clobber.desc=Stößt einen Gegner 2 Felder zurück, verursacht aber keinen Schaden und kann ihn nicht in Fallgruben stoßen. Erhöht den Kombi-Zähler um 1.
actors.buffs.combo$combomove.clobber.empower_desc=Stößt einen Gegner 3 Felder zurück, verursacht Schwindel, aber keinen Schaden. Erhöht den Kombi-Zähler um 1.
actors.buffs.combo$combomove.slam.name=Harter Schlag
actors.buffs.combo$combomove.slam.desc=Verursacht %d%% (Kombi*20%%) deines Rüstungswertes als zusätzlichen Schaden. Setzt die Kombi bei Verwendung zurück.
actors.buffs.combo$combomove.slam.empower_desc=_Springt bis zu %1$d Feld(ern)_ und verursacht %2$d%% (Kombi*20%%) deiner Abwehrkraft als Bonus-Schaden. Setzt den Kombi-Zähler zurück, wenn verwendet.
actors.buffs.combo$combomove.parry.name=Parade
actors.buffs.combo$combomove.parry.desc=Blockt den nächsten Angriff innerhalb eines Zuges, und kontert diesen sofort. Setzt den Kombi-Zähler auch dann zurück, wenn nichts pariert wurde.
actors.buffs.combo$combomove.parry.empower_desc=Blockt _alle Angriffe_ innerhalb eines Zugs und kontert sie sofort. Setzt den Kombi-Zähler zurück, wenn nichts pariert wurde.
actors.buffs.combo$combomove.crush.name=Brecher
actors.buffs.combo$combomove.crush.desc=Fügt dem Primärziel %d%% (Kombi*25%%) Schaden und die Hälfte dieses Schadens allen umliegenden Gegnern in einem 7x7 Felder großen Wirkungsbereich zu.
actors.buffs.combo$combomove.crush.empower_desc=_Springt bis zu %1$d Feld(er)_ und fügt dem Primärziel %2$d%% (Kombi*25%%) Schaden sowie allen anderen Gegnern in einem 7x7 Felder großen Wirkungsbereich die Hälfte dieses Schadens zu. Bei Benutzung wird die Kombi zurückgesetzt.
actors.buffs.combo$combomove.fury.name=Wut
actors.buffs.combo$combomove.fury.desc=Trifft den Gegner einmal pro gesammelter Kombi. Jeder Treffer verursacht 60% Schaden und kann Verzauberungen auslösen. Setzt den Kombi-Zähler bei Benutzung zurück.
actors.buffs.combo$combomove.fury.empower_desc=_Springt bis zu %d Feld(er)_ und trifft einen Gegner je einmal pro Kombi, die du hast; jeder Treffer verursacht 60%% Schaden und kann Verzauberungen auslösen. Bei Benutzung wird die Kombi zurückgesetzt.

actors.buffs.corruption.name=korrumpiert
actors.buffs.corruption.desc=Korruption sickert in das Innerste eines Wesens und dreht es gegen die eigenen Leute. Lobbyarbeit im Zeitraffer.\n\nKorrumpierte Kreaturen greifen ihre Verbündeten an und ignorieren ihre vorherigen Gegner. Korruption schadet außerdem dem Opfer, wodurch es langsam verendet.\n\nKorruption ist permanent und kann nur durch den Tod beendet werden.

actors.buffs.cripple.name=verkrüppelt
actors.buffs.cripple.heromsg=Du bist verkrüppelt!
actors.buffs.cripple.desc=Du bist dir ziemlich sicher, dass Beine nicht auf diese Weise gebeugt werden sollten. Die Bordsteinkante am Hermannplatz sieht das anders.\n\nVerkrüppelte bewegen sich nur halb so schnell, wodurch sie zwei Züge benötigen, um sich ein Feld fortzubewegen.\n\nAnzahl verbleibender Züge mit Verkrüppelung: %s.

actors.buffs.daze.name=benommen
actors.buffs.daze.heromsg=Du bist benommen!
actors.buffs.daze.desc=Ohrensausen und verschwommene Sicht erschweren den Kampf. Fühlt sich an wie Montag nach dem Club.\n\nWährend du benommen bist, sind Genauigkeit und Ausweichen um 50%% reduziert.\n\nVerbleibende Züge mit Benommenheit: %s.

actors.buffs.degrade.name=geschwächt
actors.buffs.degrade.heromsg=Deine Ausrüstung fühlt sich schwächer an!
actors.buffs.degrade.desc=Mächtige dunkle Magie zehrt an der Stärke deiner Ausrüstung, welche durch Modernisierungsbescheide aufgewertet wurden!\n\nVerbesserte Ausrüstungsgegenstände werden temporär so behandelt, als hätten sie eine niedrigere Stufe als tatsächlich. _Jede Verbesserung ab +3 wird exponentiell schwächer als die vorige._ Die Beschreibungen deiner Gegenstände wird angepasst, um die reduzierten Werte zu spiegeln.\n\nSchwächungen beeinflussen keine Stärkeanforderungen, Ladungen von Zauberstäben, Haltbarkeit von Wurfwaffen oder Artefakte.\n\nVerbleibende Züge mit Schwächung: %s. Die Nutzung eines Modernisierungsbescheids oder Entfluchungsantrags wird die Schwächung sofort aufheben.

actors.buffs.doom.name=verdammt
actors.buffs.doom.desc=Es ist schwer, optimistisch zu bleiben, wenn es scheint, dass alle Welt dich tot sehen möchte. Oder zumindest ausgezogen.\n\nVerdammte Charaktere erleiden +67% Schaden aus allen Schadensquellen.\n\nDie Verdammung ist permanent, ihre Auswirkungen enden erst mit dem Tod.

actors.buffs.dread.name=Grauen
actors.buffs.dread.desc=Ein Grauen, so groß, dass sein Ziel so schnell wie möglich aus der Unterwelt fliehen will. Es kündigt fristlos.\n\nKreaturen, die vom Grauen betroffen sind, laufen mit hoher Geschwindigkeit vor ihrem Gegner davon und verschwinden vollständig aus der Unterwelt, sobald sie außer Sichtweite sind. Für Gegner, die auf diese Weise verschwinden, gibt es keine Gegenstände und nur die Hälfte an Erfahrungspunkten. Der Schock des Schmerzes verringert die Dauer des Grauens.\n\nVerbleibende Züge des Grauens: %d.

actors.buffs.drowsy.name=schläfrig
actors.buffs.drowsy.desc=Eine magische Kraft macht dich müde wie die dritte Runde in der Warteschleife der Hotline. Nach einigen Zügen fällt das Ziel in einen tiefen magischen Schlaf.\n\nDer Held kann der Schläfrigkeit widerstehen, wenn er Schaden nimmt oder bei voller Gesundheit ist.\n\nZüge bis zum Eintritt des magischen Schlafs: %s

actors.buffs.earthimbue.name=eins mit der Erde
actors.buffs.earthimbue.desc=Du wirst von der Kraft der Erde erfüllt!\n\nAlle physischen Angriffe lassen den Erdboden unter den Feinden beben, so dass sie für eine kurze Zeit verkrüppelt werden.\n\nVerbleibende Züge mit Erd-Durchdringung: %s.

actors.buffs.enhancedrings.name=Souvenir-Boost
actors.buffs.enhancedrings.desc=Das zuletzt benutzte Artefakt des Touristen verstärkt seine Ringe um +1 Stufe.\n\nVerbleibende Züge: %s.

actors.buffs.fireimbue.name=eins mit dem Feuer
actors.buffs.fireimbue.desc=Die Kräfte des Feuers durchströmen deinen Körper!\n\nAlle deine physischen Angriffe haben eine Chance, dass Gegner in Flammen aufgehen. Außerdem bist du komplett immun gegen die Auswirkungen von Feuer. \n\nVerbleibende Züge mit Feuer-Durchdringung: %s.

actors.buffs.foresight.name=Vorhersehung
actors.buffs.foresight.desc=Irgendwie ist es dir nun möglich, die räumlichen Umrisse des dich umgebenden Gebietes in deinem Geist zu erblicken.\n\nSolange der Effekt der Vorhersehung anhält, werden dir sämtliche Felder in einem großen Radius um dich herum offenbar, einschließlich eventueller versteckter Haufen oder Türen.\n\nVerbleibende Züge mit Vorhersehung: %s.

actors.buffs.frost.name=eingefroren
actors.buffs.frost.freezes=%s friert ein!
actors.buffs.frost.desc=Nicht zu verwechseln mit einer kompletten Einfrierung: Hier ist das Ziel eher von einer unschädlichen Eisschicht umhüllt.\n\nEinfrieren wirkt ähnlich wie Lähmung, was dem Opfer jegliche Bewegung verwehrt. Anders als bei einer Lähmung endet der Effekt, wenn das eingefrorene Ziel Schaden erleidet, da dadurch die Eisschicht aufbricht.\n\nVerbleibende Züge mit Einfrieren: %s.

actors.buffs.frostimbue.name=eins mit dem Frost
actors.buffs.frostimbue.desc=Die Kräfte des Eises durchströmen deinen Körper!\n\nAlle deine physischen Angriffe werden Feinde immer stärker einfrieren. Zusätzlich bist du selbst komplett gegen Kälte immun.\n\nVerbleibende Züge mit Frostkraft: %s.

actors.buffs.fury.name=wütend
actors.buffs.fury.heromsg=Du wirst wütend!
actors.buffs.fury.desc=Du bist wütend wie beim dritten Presslufthammer vor sieben Uhr, und das bekommen deine Feinde ab.\n\nDeine Wut erhöht deinen physischen Schaden um 50%%.\n\nSolange deine Lebensenergie unter 50%% bleibt, hält die Wut an.

actors.buffs.blobimmunity.name=reinigende Barriere
actors.buffs.blobimmunity.desc=Eine wunderliche Kraft umgibt dich mit einer Schutzschicht, welche alle über die Luft kommenden negativen Effekte blockiert.\n\nDu bist immun gegen alle an den Ort gebundenen Effekte, solange die Barriere anhält.\n\nVerbleibende Züge mit Immunität: %s.

actors.buffs.gravitychaostracker.name=Gravitationschaos
actors.buffs.gravitychaostracker.desc_intro=Alle paar Züge werden alle Figuren auf der aktuellen Ebene in eine zufällige Richtung geworfen.
actors.buffs.gravitychaostracker.desc_positive=Du und deine Verbündeten scheinen allerdings immun zu sein.
actors.buffs.gravitychaostracker.desc_duration=Es ist unklar, wie lange dieser Effekt anhält, aber er kann sicher nicht ewig andauern.

actors.buffs.greaterhaste.name=größere Eile
actors.buffs.greaterhaste.desc=Ein unglaublicher Geschwindigkeitsschub, für einen Moment fühlt es sich an, als ob alles andere stillsteht.\n\nUnter dem Einfluss größerer Eile dauern Bewegungsaktionen überhaupt keine Zeit, andere Aktionen werden jedoch weiterhin mit normaler Geschwindigkeit ausgeführt. Jeder Bewegungsschritt verbraucht einen Zug größerer Eile.\n\nVerbleibende Züge größerer Eile: %d

actors.buffs.hausregel.name_quiet=Ruhezeit
actors.buffs.hausregel.name_sweep=Kehrwoche
actors.buffs.hausregel.desc_quiet=Die Hausordnungs-Hydra hat Ruhezeit verkündet. Jeder Zug, in dem du dich bewegst, kostet dich 8 bis 14 Lebenspunkte.\n\nVerbleibende Züge: %d.
actors.buffs.hausregel.desc_sweep=Die Hausordnungs-Hydra hat Kehrwoche verkündet. Jeder Zug, in dem du auf demselben Feld bleibst, kostet dich 8 bis 14 Lebenspunkte, außer du kannst dich nicht bewegen.\n\nVerbleibende Züge: %d.
actors.buffs.hausregel.fine_quiet=Bußgeld wegen Ruhestörung: %d Lebenspunkte.
actors.buffs.hausregel.fine_sweep=Bußgeld wegen versäumter Kehrwoche: %d Lebenspunkte.
actors.buffs.hausregel.ondeath=Nach Hausordnung zu Tode verwarnt...

actors.buffs.haste.name=Eile
actors.buffs.haste.desc=Energie fließt durch deine Muskeln, als würde gerade die letzte Bahn einfahren!\n\nWährend du unter Eile stehst, rennst du mit 3-facher Geschwindigkeit, wirst aber alle anderen Aktionen mit normaler Geschwindigkeit ausführen\n\nVerbleibende Züge mit Eile: %s.

actors.buffs.healing.name=Heilung
actors.buffs.healing.desc=Ein magisches Heilmittel, das Wunden schließt und Fleisch wieder zusammenfügt, ganz ohne Wartezimmer.\n\nDie Lebensenergie wird mit jedem Zug wiederhergestellt, bis die heilende Wirkung endet. Die Stärke der Heilung kann mit der Zeit abnehmen.\n\nNächste Heilung: %d.\n\nVerbleibende Züge mit Heilung: %d.

actors.buffs.herodisguise.name=Tarnung
actors.buffs.herodisguise.desc=Illusionäre Magie hat dein Aussehen verändert! Der Effekt ist rein kosmetisch, wie jede Fassadensanierung.\n\nVerbleibende Züge mit Verkleidung: %s.

actors.buffs.hex.name=verhext
actors.buffs.hex.heromsg=Du wurdest verhext!
actors.buffs.hex.desc=Dunkle Magie stört die Konzentration wie ein Laubbläser um sieben Uhr morgens.\n\nVerhexung reduziert Genauigkeit und Ausweichen um 20%%, sodass das Ziel im Kampf weniger effektiv ist.\n\nVerbleibende Züge mit Verhexung: %s.

actors.buffs.holdfast.name=Hier geh ick nich weg
actors.buffs.holdfast.desc=Die Alteingesessene hält ihre Stellung. Das erhöht ihre Rüstung um %1$d-%2$d und verlangsamt den Abbau einiger Effekte um %3$d%%. Das hält an, bis sie sich bewegt.

actors.buffs.hunger.hungry=hungrig
actors.buffs.hunger.starving=verhungernd
actors.buffs.hunger.onhungry=Du hast Hunger. Irgendwo riecht es nach Döner.
actors.buffs.hunger.onstarving=Du verhungerst!
actors.buffs.hunger.ondeath=Du bist verhungert...
actors.buffs.hunger.cursedhorn=Das verfluchte Horn stiehlt dem Essen einen Teil seiner Energie, wenn du etwas isst.
actors.buffs.hunger.rankings_desc=Verhungert
actors.buffs.hunger.desc_intro_hungry=Dein Bauch verlangt nach etwas zu essen, aber es lässt sich noch aushalten. Ein Döner wäre jetzt trotzdem was.
actors.buffs.hunger.desc_intro_starving=Du bist so hungrig, dass es weh tut. Selbst der Schokoriegel aus dem Späti-Kühlschrank von 2019 sieht verlockend aus.
actors.buffs.hunger.desc=\n\nDein Hunger wächst mit der Zeit, die du unter Neukölln verbringst. Irgendwann beginnst du zu verhungern. Während du verhungerst, verlierst du Lebensenergie, anstatt sie zu regenerieren.\n\nRationieren ist wichtig! Wenn du genug Lebensenergie hast, kann Hungern eine Option sein, um Nahrung für später aufzusparen. Durch geschicktes Rationieren reicht deine Nahrung viel länger!

actors.buffs.invisibility.name=unsichtbar
actors.buffs.invisibility.desc=Du verschmilzt so vollständig mit deiner Umgebung wie die Hausverwaltung, sobald die Heizung ausfällt. Niemand kann dich entdecken.\n\nSolange du unsichtbar bist, können Gegner dich nicht angreifen oder verfolgen. Physische Angriffe oder magische Effekte (wie die Verwendung von Schriftrollen und Zauberstäben) beenden die Unsichtbarkeit sofort.\n\nVerbleibende Züge mit Unsichtbarkeit: %s.

actors.buffs.invulnerability.name=unverwundbar
actors.buffs.invulnerability.desc=Dieser Charakter ist mit großer Schutzkraft ausgestattet, die ihm für kurze Zeit Unverwundbarkeit verleiht!\n\nVerbleibende Züge: %s

actors.buffs.levitation.name=schwebend
actors.buffs.levitation.desc=Eine magische Kraft lässt dich schwerelos über dem Boden schweben, hoch über Hundehaufen und Kronkorken.\n\nSchwebende Charaktere bewegen sich lautlos und ignorieren alle bodenbasierten Effekte. Haufen lösen nicht aus, brennende Charaktere können sich nicht im Wasser löschen, Pflanzen werden nicht zertrampelt, Wurzeln verfehlen und Gruben werden überflogen. Sei vorsichtig, denn all diese Dinge können in der Sekunde in Kraft treten, in der die Levitation endet!\n\nVerbleibende Züge mit Schweben: %s

actors.buffs.lifelink.name=Lebensverbindung
actors.buffs.lifelink.ondeath=Das Lebensband hat dich getötet…
actors.buffs.lifelink.desc=Die Lebenskraft dieses Charakters ist mit einem anderen Charakter in der Nähe verbunden. Jeglicher Schaden wird von diesen beiden geteilt.\n\nSobald diesem Charakter Schaden zugefügt wird, wird die Hälfte davon stattdessen an den Charakter am Ende der Lebensband weitergegeben.\n\nVerbleibende Züge mit Lebensband: %s.

actors.buffs.light.name=beleuchtet
actors.buffs.light.desc=Selbst im dunkelsten Keller ist ein ruhiges Licht an deiner Seite tröstlich. Die Hausverwaltung tauscht die Glühbirne ja nicht.\n\nLicht hält Dunkelheit in Schach und erlaubt es dir, die umliegende Gegend angemessen zu erhellen.\n\nVerbleibende Züge mit Illumination: %s.

actors.buffs.lockedfloor.name=Ebene ist verschlossen
actors.buffs.lockedfloor.desc=Diese Ebene ist verschlossen, und du kannst sie nicht verlassen! Der Notausgang ist, wie immer, zugestellt.\n\nWährend eine Ebene verschlossen ist, leidest du keinen Hunger und erleidest keinen Schaden durch Verhungern. Außerdem stoppen deine passiven Regenerationseffekte, wenn du nicht gerade dabei bist, den Boss auf dieser Ebene zu besiegen.\n\nWenn du von einem ungesegneten Zweitschlüssel wiederbelebt wirst, während die Ebene verschlossen ist, wird die Ebene neu gestartet.\n\nBesiege den Boss, um die Ebene zu entriegeln.

actors.buffs.lostinventory.name=verlorenes Inventar
actors.buffs.lostinventory.desc=Du hast dein Inventar irgendwo hier unten verloren, wie früher den Fahrradschlüssel! Bis du es wiederfindest, kannst du kaum Gegenstände aufnehmen und benutzen.

actors.buffs.magicalsight.name=magische Sicht
actors.buffs.magicalsight.desc=Irgendwie kannst du mit deinem Geist anstelle deiner Augen sehen.\n\nSolange Magische Sicht aktiv ist, kannst du in einem 12-Felder-Radius durch das Gelände blicken.\n\nVerbleibende Züge mit magischer Sicht: %s.

actors.buffs.magicalsleep.name=magischer Schlaf
actors.buffs.magicalsleep.toohealthy=Du bist zu gesund und widerstehst dem Drang zu schlafen.
actors.buffs.magicalsleep.fallasleep=Du fällst in einen magischen Schlaf.
actors.buffs.magicalsleep.wakeup=Du wachst auf und fühlst dich erfrischt und gesund.
actors.buffs.magicalsleep.desc=Dieser Charakter ist in einen magischen Schlaf gefallen, tief wie ein Sonntagmittag nach der Afterhour. Auf natürliche Weise wacht er nicht auf.\n\nMagischer Schlaf ähnelt normalem Schlaf, allerdings kann nur zugefügter Schaden das Ziel wecken.\n\nFür den Helden und seine Verbündeten hat der magische Schlaf einige regenerative Eigenschaften, die es ihnen erlauben, sich beim Schlafen schnell zu heilen.

actors.buffs.magicimmune.name=immun gegenüber Magie
actors.buffs.magicimmune.desc=Alle magischen Effekte verlieren ihre Gewalt über dich, du bist ihnen gegenüber vollkommen immun.\n\nSolange die Immunität gegen Magie anhält, haben schädigende und helfende magische Effekte keine Wirkung auf dich, einschließlich solcher Dinge wie Flüche, Verzauberungen, Zauberstäbe, Schriftrollen, Ringe, Artefakte usw. Die Fähigkeiten der Heldenrüstung sind allerdings stark genug, um trotz dieses Effekts zu funktionieren.\n\nVerbleibende Züge mit Immunität gegen Magie: %s.

actors.buffs.mindvision.name=übersinnliche Wahrnehmung
actors.buffs.mindvision.desc=Irgendwie kannst du alle Kreaturen auf dieser Ebene mithilfe deiner Gedanken ausmachen. Es fühlt sich an wie die Nachbarschafts-App, nur ehrlicher.\n\nAlle Wesen auf dieser Ebene sind sichtbar, solange die übersinnliche Wahrnehmung aktiv ist. Eine dadurch gesichtete Kreatur gilt als gültiges Ziel für viele magische Effekte.\n\nVerbleibende Züge mit übersinnlicher Wahrnehmung: %s.

actors.buffs.momentum.momentum=Schwung aufbauen
actors.buffs.momentum.running=freilaufend
actors.buffs.momentum.resting=sich erholend
actors.buffs.momentum.action_name=Freilauf
actors.buffs.momentum.momentum_desc=Beim Laufen baut der Sightseeing-Sprinter Schwung auf, den er zum Freilaufen einsetzen kann.\n\nJeder Schwungpunkt ergibt 2 Züge Freilaufen; der Sightseeing-Sprinter kann bis zu 10 Schwung sammeln. Bleibt er stehen, verliert er den Schwung schnell.\n\nDerzeitiger Schwung: %d.
actors.buffs.momentum.running_desc=Beim Laufen baut der Sightseeing-Sprinter Schwung auf, den er zum Freilaufen einsetzen kann.\n\nBeim Freilaufen bewegt er sich doppelt so schnell und erhält einen Ausweich-Bonus abhängig von seiner Stufe.\n\nVerbleibende Züge: %d.
actors.buffs.momentum.resting_desc=Beim Laufen baut der Sightseeing-Sprinter Schwung auf, den er zum Freilaufen einsetzen kann.\n\nDer Sightseeing-Sprinter braucht Zeit zum Verschnaufen, bevor er wieder Schwung aufbauen kann.\n\nVerbleibende Züge: %d.

actors.buffs.monkenergy.name=Energie
actors.buffs.monkenergy.action=Fähigkeiten der Hinterhof-Yogini
actors.buffs.monkenergy.desc=Indem sie Feinde besiegt, sammelt die Hinterhof-Yogini Energie, die sie in einer Vielzahl verschiedener Fähigkeiten einsetzen kann. Die meisten Feinde bringen ihr, wenn sie besiegt werden, 1 Energie, und die Hinterhof-Yogini verliert mit der Zeit keine Energie.\n\nAktuelle Energie: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Die Hinterhof-Yogini hat gerade eine Fähigkeit eingesetzt, und muss etwas warten, bevor sie eine weitere einsetzen kann.\n\nAktuelle Abklingzeit: %d Züge.
actors.buffs.monkenergy$monkability$flurry.name=hastige Hiebe
actors.buffs.monkenergy$monkability$flurry.desc=Zwei sofortige Schläge, die %1$d-%2$d Schaden verursachen und Rüstung ignorieren. Diese Fähigkeit kann nicht sofort wiederholt werden.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Zwei sofortige Schläge, die %1$d-%2$d Schaden verursachen, Rüstung ignorieren _und die Verzauberung deiner Waffe nutzen_. Diese Fähigkeit kann nicht sofort wiederholt werden.
actors.buffs.monkenergy$monkability$focus.name=Konzentration
actors.buffs.monkenergy$monkability$focus.desc=Die Hinterhof-Yogini konzentriert sich einen Zug lang, so dass sie den nächsten, gegen sie geführten Angriff pariert.
actors.buffs.monkenergy$monkability$focus.empower_desc=Die Hinterhof-Yogini _fokussiert augenblicklich_, wodurch sie den nächsten, gegen sie geführten Angriff pariert.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=konzentriert
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Die Hinterhof-Yogini konzentriert sich auf ihre Umgebung und kann den nächsten gegen sie geführten Angriff voraussehen. Solange sie konzentriert ist, wird sie den nächsten Angriff garantiert parieren.
actors.buffs.monkenergy$monkability$dash.name=Sprint
actors.buffs.monkenergy$monkability$dash.prompt=Wähle einen Ort
actors.buffs.monkenergy$monkability$dash.desc=Ein augenblicklicher Sprint auf bis zu 4 Felder Entfernung. Mit dieser Fähigkeit kann man über Gefahren, nicht aber über Gegner oder durch Hindernisse springen.
actors.buffs.monkenergy$monkability$dash.empower_desc=Ein augenblicklicher Sprung über bis zu _8 Felder_. Durch diese Fähigkeit kann man über Gefahren, nicht aber über Gegner oder durch Hindernisse springen.
actors.buffs.monkenergy$monkability$dragonkick.name=Drachentritt
actors.buffs.monkenergy$monkability$dragonkick.desc=Ein verheerender Tritt, der %1$d-%2$d Schaden zufügt und Rüstungen ignoriert. Der Tritt schleudert das Ziel fort und paralysiert es einen Zug pro Feld, das es dabei zurücklegt.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Ein verheerender Tritt, der _%1$d-%2$d Schaden_ verursacht und dabei Rüstung ignoriert. Der Tritt stößt _alle angrenzenden Ziele_ weg und paralysiert sie so lange, wie viele Felder sie gestoßen wurden.
actors.buffs.monkenergy$monkability$meditate.name=Meditieren
actors.buffs.monkenergy$monkability$meditate.desc=Die Hinterhof-Yogini fokussiert 5 Züge lang Energie in ihrem Körper. Dies reinigt sie von den meisten negativen Effekten und gewährt ihr 8 Züge lang Aufladung von Zauberstäben und Artefakten.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Die Hinterhof-Yogini fokussiert ihre Energie 5 Züge lang in ihren Körper. Dadurch werden die meisten negativen Effekte neutralisiert und sie erhält 8 Züge Aufladung für Zauberstäbe und Artefakte. _Sie erhält außerdem 80% Schadensresistenz während der Meditation, und 20% ihrer fehlenden Lebenspunkte werden allmählich wiederhergestellt._

actors.buffs.ooze.name=ätzender Schlamm
actors.buffs.ooze.heromsg=Ätzender Schlamm frisst sich durch dein Fleisch! Wasch ihn ab!
actors.buffs.ooze.ondeath=Du löst dich auf...
actors.buffs.ooze.rankings_desc=Aufgelöst
actors.buffs.ooze.desc=Diese klebrige Säure haftet sich an Fleisch und löst es langsam auf. Sie riecht verdächtig nach Mietschimmel.\n\nDer Schlamm wird dir durchgängig Schaden zufügen, kann jedoch sofort im Wasser abgewaschen werden.\n\nVerbleibende Züge mit Schlamm: %s.

actors.buffs.paralysis.name=gelähmt
actors.buffs.paralysis.heromsg=Du bist gelähmt!
actors.buffs.paralysis.out=widersteht der Lähmung
actors.buffs.paralysis.desc=Häufig ist es das Schlimmste, gar nichts zu tun. Frag jeden im Wartebereich des Bürgeramts.\n\nEine Lähmung bringt sämtliche Aktionen zum Erliegen und zwingt das Ziel dazu, solange auszuharren, bis der Effekt vorüber ist. Der Schmerz von erlittenen Verletzungen kann aber dazu führen, dass Opfer der Lähmung widerstehen und sich damit von der Wirkung befreien.\n\nVerbleibende Züge mit Lähmung: %s.

actors.buffs.physicalempower.name=körperlich ertüchtigt
actors.buffs.physicalempower.desc=Deine Schläge sind verstärkt, so dass du mit physischen Angriffen mehr Schaden austeilst, sofern du Gegner angreifst.\n\nBonusschaden: %1$d.\nVerbleibende Schläge: %2$d.

actors.buffs.pincushion.name=Nadelkissen
actors.buffs.pincushion.desc=Die Wurfwaffen, die du gegen diesen Charakter eingesetzt hast, stecken derzeit in ihm und fallen zu Boden, nachdem er besiegt wurde.\n\nDie folgenden Gegenstände sind derzeit angeheftet:

actors.buffs.poison.name=vergiftet
actors.buffs.poison.heromsg=Du bist vergiftet!
actors.buffs.poison.ondeath=Du bist an der Vergiftung gestorben...
actors.buffs.poison.rankings_desc=Dem Gift erlegen
actors.buffs.poison.desc=Gift arbeitet sich durch deinen gesamten Körper und schädigt diesen nach und nach. War wohl doch nicht bio.\n\nDas Gift richtet jeden Zug Schaden an, bis es abklingt. Die Menge des Schadens hängt von der Dauer der Vergiftung ab,\n\nVerbleibende Züge mit Vergiftung: %s.

actors.buffs.preparation.name=Vorbereitung
actors.buffs.preparation.action_name=vorbereiteter Schlag
actors.buffs.preparation.desc=Der Schnappschütze wartet geduldig auf das perfekte Motiv, bereit, aus dem Schatten zuzuschlagen.
actors.buffs.preparation.desc_dmg=Sein nächster Angriff wird _%1$d%% Bonusschaden anrichten_ und einfache Gegner mit weniger als _%2$d%% Gesundheit_ oder Bosse mit weniger als _%3$d%% Gesundheit_ sofort erledigen.
actors.buffs.preparation.desc_dmg_likely=Der Angriff hat außerdem eine höhere Chance, mehr Schaden zuzufügen.
actors.buffs.preparation.desc_blink=Er kann sich an den Gegner heran teleportieren, bevor er angreift, mit einer maximalen Reichweite von _%d._
actors.buffs.preparation.desc_invis_time=Unsichtbar verbrachte Züge: _%d._
actors.buffs.preparation.desc_invis_next=Züge mit verstärkten Angriffen: _%d._
actors.buffs.preparation.prompt=Wähle ein anzugreifendes Ziel!\nMaximale Teleportationsreichweite: %d
actors.buffs.preparation.no_target=Hier gibt es nichts anzugreifen.
actors.buffs.preparation.out_of_reach=Das Ziel ist außer Reichweite.
actors.buffs.preparation.assassinated=gemeuchelt

actors.buffs.prismaticguard.name=Spektralschild
actors.buffs.prismaticguard.desc=Du wirst von einem spektralen Abbild geschützt, das derzeit nicht aktiv ist. Wenn Feinde zugegen sind, wird das Abbild zu deinem Schutze aktiv!\n\nSolange es inaktiv ist, wird das Abbild sich stetig von Schaden erholen, den es erlitten hat.\n\nDerzeitige Lebenspunkte: %d/%d.
actors.buffs.prismaticguard.desc_many=Dieses spektrale Abbild profitiert auch von der Macht der Vielen. Verbleibende Züge: %d.

actors.buffs.recharging.name=aufladend
actors.buffs.recharging.desc=Energie fließt durch deinen Körper wie Strom aus dem Balkonkraftwerk und verbessert die Aufladerate deiner Zauberstäbe.\n\nDie Aufladung wird jeden Zug um ein Viertel erhöht, zusätzlich zur Standardaufladung.\n\nVerbleibende Züge mit Aufladung: %s.

actors.buffs.revealedarea.name=aufgedecktes Gebiet
actors.buffs.revealedarea.desc=Dem Helden wurde vorübergehend ein Teil dieser Ebene offenbart. Er sieht diesen Teil, egal wo er sich befindet.\n\nVerbleibende Züge: %s.

actors.buffs.revealedchar.name=aufgedeckt
actors.buffs.revealedchar.desc=Dieser Charakter wurde dem Helden offenbart. Der Held wird ihn sehen, egal, wo er sich befindet.\n\nVerbleibende Züge: %s.

actors.buffs.roots.name=verwurzelt
actors.buffs.roots.heromsg=Du kannst dich nicht bewegen!
actors.buffs.roots.desc=Wurzeln (magisch oder natürlich) schlingen sich um Füße und halten ihre Opfer am Boden. Ick wohn hier, sagen die Wurzeln.\n\nWurzeln fesseln das Opfer und zwingen es zur Bewegungslosigkeit. Andere Aktionen können weiterhin durchgeführt werden, einschließlich Teleportationseffekte.\n\nVerbleibende Züge mit Verwurzelung: %s.

actors.buffs.scrollempower.name=Schriftrollenverstärker
actors.buffs.scrollempower.desc=Die Energie der Schriftrolle, die der Expat gerade gelesen hat, verstärkt seine Zauberstäbe!\n\nStufenbonus: +%1$d.\nVerbleibende Schüsse: %2$d.

actors.buffs.shadows.name=mit den Schatten verschmolzen
actors.buffs.shadows.desc=Du bist mit den Schatten verschmolzen, was dir Unsichtbarkeit gewährt und deinen Stoffwechsel verlangsamt.\n\nWährend du unsichtbar bist, können Gegner dich weder angreifen noch dir folgen. Die meisten physischen und magischen Angriffe (wie Schriftrollen oder Zauberstäbe) beenden die Unsichtbarkeit sofort. Außerdem wächst dein Hunger langsamer, während du unsichtbar bist.\n\nDie Tarnung hält, bis du die Schatten verlässt oder einem Gegner zu nahe kommst.

actors.buffs.slow.name=verlangsamt
actors.buffs.slow.desc=Verlangsamungsmagie wirkt auf den Zeitfluss ihres Ziels; für das Ziel bewegt sich alles ungewöhnlich schnell. Willkommen im Behördentempo.\n\nEin verlangsamter Charakter benötigt für alle seine Aktionen doppelt so viel Zeit wie gewöhnlich.\n\nVerbleibende Züge mit Verlangsamung: %s.

actors.buffs.snipersmark.name=Markierung der Abstandshalterin
actors.buffs.snipersmark.action_name_snapshot=Schnellschuss
actors.buffs.snipersmark.action_name_volley=Salve
actors.buffs.snipersmark.action_name_sniper=Präzisionsschuss
actors.buffs.snipersmark.desc=Die Abstandshalterin hat das Ziel im Blick, das sie zuletzt angegriffen hat. Sie kann mit ihrem Bogen einen Spezialangriff ausführen, der von der Feineinstellung des Bogens abhängt.\n\nEin nicht eingestellter Bogen feuert einen _Schnellschuss_, der weniger Schaden verursacht, aber keine Zeit kostet.\n\nEin auf Tempo eingestellter Bogen feuert eine _Salve_ aus drei Pfeilen. Jeder Pfeil verursacht weniger Schaden, kann aber trotzdem Verzauberungen auslösen. Die Salve dauert 1 Zug.\n\nEin auf Schaden eingestellter Bogen feuert einen _Präzisionsschuss_. Er trifft garantiert, verursacht Bonusschaden abhängig von der Entfernung zum Ziel und dauert 2 Züge.\n\nVerbleibende Züge: %s.

actors.buffs.soulmark.name=als Lead markiert
actors.buffs.soulmark.desc=Der Growth-Hacker hat diese Kreatur als Lead markiert. Er heilt sich, während sie physischen Schaden erleidet.\n\nVerbleibende Züge der Lead-Markierung: %s.

actors.buffs.stamina.name=Ausdauer
actors.buffs.stamina.desc=Du hast unendliche Ausdauer, als wäre der Aufzug endlich repariert!\n\nSolange du unter dem Einfluss der Ausdauer stehst, läufst du 50 %% schneller, führst alle anderen Aktionen aber mit normaler Geschwindigkeit aus.\n\nVerbleibende Züge mit Ausdauer: %s.

actors.buffs.swarminteltracker.name=Schwarmintelligenz
actors.buffs.swarminteltracker.desc=Wie die Hausgruppe im Messenger: Einer sieht was, alle wissen es.\n\nGegner, die dich oder deine Verbündeten sehen, locken andere Gegner zu deiner Position.\n\nDiese Anlockung hat eine begrenzte Reichweite. Je länger du gesehen wirst, desto weiter reicht sie, bis höchstens 12. Wenn du auch nur kurz aus dem Blickfeld verschwindest, wird die Reichweite zurückgesetzt.\n\nAktuelle größte Anlockreichweite: %d.

actors.buffs.vulnerable.name=verwundbar
actors.buffs.vulnerable.heromsg=Du fühlst dich zerbrechlich!
actors.buffs.vulnerable.desc=Du fühlst dich so ungeschützt wie ein Altbau ohne Milieuschutz.\n\nVerwundbarkeitsmagie steigert jeden physischen Schaden, der einem Charakter zugefügt wird, um 33%%, nachdem der Schaden durch die Rüstung reduziert worden ist.\n\nVerbleibende Züge mit Verwundbarkeit: %s.

actors.buffs.terror.name=verängstigt
actors.buffs.terror.desc=Terror ist manipulative Magie, die ihr Ziel in unkontrollierte Panik versetzt, ungefähr wie ein Brief mit dem Betreff Modernisierungsankündigung.\n\nTerrorisierte Charakter werden gezwungen, vor ihrem Feind Reißaus zu nehmen und zu versuchen, so viele Türen und Wände wie möglich zwischen sich und den Feind zu bringen. Allerdings verringert der Schock durch Schmerz die Dauer des Terrors.\n\nVerbleibende Züge mit Terror: %s.

actors.buffs.toxicimbue.name=eins mit dem Gift
actors.buffs.toxicimbue.desc=Du bist eins mit dem Element des Giftes, wie der Hinterhof am dritten Tag ohne Müllabfuhr!\n\nImmer, wenn du dich bewegst, bricht ein Schwall giftiger Gase hervor, der deinen Gegnern schadet. Solange du diesen Effekt besitzt, und einige Züge darüber hinaus, bist du gegen Giftgas und Gift immun.\n\nVerbleibende Züge mit toxischer Durchdringung: %s.

actors.buffs.corrosion.name=Korrosion
actors.buffs.corrosion.heromsg=Du löst dich auf!
actors.buffs.corrosion.ondeath=Du löst dich auf...
actors.buffs.corrosion.rankings_desc=Aufgelöst
actors.buffs.corrosion.desc=Eine starke Säure löst Fleisch, Metall und Knochen mit atemberaubender Geschwindigkeit auf. Schneller als ein Mietvertrag nach Eigenbedarfskündigung.\n\nDer Schaden durch die Zersetzung steigt mit der Zeit, in der sich das Ziel weiter auflöst.\n\nVerbleibende Züge mit Zersetzung: %1$s.\nDerzeitiger Zersetzungsschaden: %2$d.

actors.buffs.vertigo.name=schwindelig
actors.buffs.vertigo.desc=In einer geraden Linie zu laufen ist schwierig, wenn sich die ganze Welt dreht. Wie die dritte Runde im Kettenkarussell auf dem Rummel.\n\nSolange man unter Schwindel leidet, bewegt man sich in eine zufällige Richtung anstatt in die gewünschte Richtung.\n\nVerbleibende Züge mit Schwindelgefühl: %s

actors.buffs.wandempower.name=Zauberstäbe gestärkt
actors.buffs.wandempower.desc=Deine schadensverursachenden Zauberstäbe wurden verstärkt, wodurch der Schaden, den sie verursachen, für einige Treffer erhöht ist.\n\nBonusschaden: %1$d.\nVerbleibende Treffer: %2$d.

actors.buffs.weakness.name=geschwächt
actors.buffs.weakness.heromsg=Du fühlst dich geschwächt!
actors.buffs.weakness.desc=Alles erscheint plötzlich sehr viel schwerer. Wie der Wocheneinkauf in den vierten Stock ohne Aufzug.\n\nSchwächungsmagie reduziert die körperliche Stärke eines Charakters, so dass dieser um 33%% verringerten Schaden verursacht.\n\nVerbleibende Züge mit Schwäche: %s.

actors.buffs.wellfed.name=gut genährt
actors.buffs.wellfed.desc=Du bist so satt wie nach einem Döner mit alles um drei Uhr nachts.\n\nSolange dein Bauch voll ist, wächst dein Hunger nicht, und du heilst eine Zeitlang etwas mehr.\n\nVerbleibende Züge: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=Du kannst nicht auf dich selbst zielen!
actors.hero.abilities.armorability.no_target=Dort befindet sich kein Ziel!
actors.hero.abilities.armorability.prompt=Wähle einen Ort als Ziel
actors.hero.abilities.armorability.cost=Aufladekosten: _%d_

actors.hero.abilities.warrior.heroicleap.name=Sprung übern Hof
actors.hero.abilities.warrior.heroicleap.prompt=Wähle die Richtung, in die du springen möchtest
actors.hero.abilities.warrior.heroicleap.short_desc=Die Alteingesessene nimmt den _Sprung übern Hof_ zu einem gewählten Ort und segelt dabei über Gegner und Gefahren hinweg. Die Abkürzung kennt sie seit 1978.
actors.hero.abilities.warrior.heroicleap.desc=Die Alteingesessene springt zu einem gewählten Ort und überspringt dabei alle Gegner und Gefahren auf dem Weg. Über Wände oder anderes festes Gelände kann sie jedoch nicht springen.
actors.hero.abilities.warrior.shockwave.name=Ruhe da unten!
actors.hero.abilities.warrior.shockwave.short_desc=Die Alteingesessene stampft auf den Boden und brüllt _„Ruhe da unten!“_. Die Druckwelle breitet sich kegelförmig aus; getroffene Gegner erleiden Schaden und werden verkrüppelt.
actors.hero.abilities.warrior.shockwave.desc=Die Alteingesessene stampft auf den Boden wie auf die Decke der Nachbarn und erzeugt eine Druckwelle, die bis zu 5 Felder weit in einem Kegel von 60 Grad reicht.\n\nGetroffene Gegner sind 5 Züge lang verkrüppelt. Außerdem erleiden sie 5-10 Schaden, plus 1-2 Schaden für jeden Stärkepunkt der Alteingesessenen über 10.
actors.hero.abilities.warrior.endure.name=Aussitzen
actors.hero.abilities.warrior.endure$enduretracker.name=ausgesessen
actors.hero.abilities.warrior.endure$enduretracker.desc=Die Alteingesessene hat es ausgesessen und verursacht nun Bonusschaden, abhängig vom Schaden, den sie dabei eingesteckt hat.\n\nBonusschaden: %1$d\nVerbleibende Treffer: %2$d
actors.hero.abilities.warrior.endure.short_desc=Die Alteingesessene _sitzt es aus_: Sie überspringt mehrere Züge, erhält aber hohe Schadensresistenz. Danach verursacht sie Bonusschaden, abhängig davon, was sie eingesteckt hat.
actors.hero.abilities.warrior.endure.desc=Die Alteingesessene sitzt 3 Züge lang aus und erleidet dabei nur halben Schaden aus allen Quellen. Diese Reduktion wirkt vor schadensmindernden Effekten wie Rüstung.\n\nDanach verursacht ihr nächster Treffer innerhalb von 10 Zügen Bonusschaden. Er entspricht der Hälfte des gesamten Schadens, der ihr beim Aussitzen zugefügt wurde, gemessen vor jeder Schadensreduktion!\n\nHat die Alteingesessene gerade eine Kombi, verlängert diese Fähigkeit deren verbleibende Zeit um 3 Züge.

actors.hero.abilities.mage.elementalblast.name=Disruption
actors.hero.abilities.mage.elementalblast.no_staff=Ohne deinen Selfie-Stick kannst du diese Fähigkeit nicht einsetzen.
actors.hero.abilities.mage.elementalblast.short_desc=„Let's disrupt this space!“ Der Expat entfesselt eine _Disruption_ aus seinem Selfie-Stick. Sie erfasst einen großen Bereich um ihn herum; die Wirkung hängt vom eingebundenen Zauberstab ab.
actors.hero.abilities.mage.elementalblast.desc=Der Expat entfesselt eine Welle aus Magie, die einen Kreis mit bis zu 4 Feldern Radius erfasst und bis zu 15-25 Schaden verursacht. Die genaue Wirkung der Disruption hängt vom Zauberstab ab, der in den Selfie-Stick des Expats eingebunden ist.
actors.hero.abilities.mage.elementalblast.generic_desc=Die Wirkung der Disruption ähnelt der Wirkung des Zauberstabs, wenn man mit ihm auf einen Gegner oder Verbündeten schießt.
actors.hero.abilities.mage.wildmagic.name=Brainstorming
actors.hero.abilities.mage.wildmagic.no_wands=Du hast keine Zauberstäbe, die du einsetzen könntest!
actors.hero.abilities.mage.wildmagic.short_desc=„No idea is a bad idea!“ Beim _Brainstorming_ feuert der Expat seine Zauberstäbe innerhalb eines Zuges mehrmals zufällig auf ein gewähltes Ziel.
actors.hero.abilities.mage.wildmagic.desc=Der Expat entfesselt die Kraft seiner Zauberstäbe und feuert sie in einem einzigen Zug bis zu 4 Mal zufällig ab. Sein Selfie-Stick zählt dabei nicht mit.\n\nJeder Zauberstab erhält dabei +2 Stufen, bis höchstens +3. Jeder Schuss verbraucht eine halbe Ladung, und kein Zauberstab kann öfter als 2 Mal feuern.
actors.hero.abilities.mage.warpbeacon.name=Homeoffice-Anker
actors.hero.abilities.mage.warpbeacon.depths=Du kannst dich nicht zwischen Ebenen teleportieren!
actors.hero.abilities.mage.warpbeacon.locked_floor=Du kannst eine verriegelte Ebene nicht verlassen!
actors.hero.abilities.mage.warpbeacon.too_far=Dieser Ort ist zu weit entfernt!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Dort kannst du keinen Anker setzen!
actors.hero.abilities.mage.warpbeacon.window_desc=Dein Homeoffice-Anker liegt derzeit auf Ebene %d.
actors.hero.abilities.mage.warpbeacon.window_tele=Zum Anker teleportieren
actors.hero.abilities.mage.warpbeacon.window_clear=Anker entfernen
actors.hero.abilities.mage.warpbeacon.window_cancel=abbrechen
actors.hero.abilities.mage.warpbeacon.short_desc=„I'm working remotely today.“ Der Expat setzt an seinem Standort einen _Homeoffice-Anker_, zu dem er sich jederzeit sofort zurückteleportieren kann.
actors.hero.abilities.mage.warpbeacon.desc=Der Expat setzt einen Anker, zu dem er sich nach Belieben teleportieren kann. Das Setzen dauert 1 Zug, das Teleportieren geht sofort.\n\nStandardmäßig kann sich der Expat nicht zwischen Ebenen teleportieren und mit dem Anker auch keine unerreichbaren Orte wie verschlossene Räume betreten. Teleportiert er sich in Gegner hinein, schiebt er sie beiseite.

actors.hero.abilities.rogue.smokebomb.name=Blitzlicht
actors.hero.abilities.rogue.smokebomb.fov=Du kannst nur zu einem leeren Feld in deinem Sichtfeld springen.
actors.hero.abilities.rogue.smokebomb.prompt=Wähle, wohin du springen möchtest
actors.hero.abilities.rogue.smokebomb$ninjalog.name=Pappaufsteller
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Ein lebensgroßer Pappaufsteller des Touristen, Daumen hoch, Sonnenbrille auf. Gegner halten ihn aus unerfindlichen Gründen für das Original!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Diesen Charakter kannst du durch Verwendung einer bestimmten Rüstungsfertigkeit entdecken.
actors.hero.abilities.rogue.smokebomb.short_desc=Der Tourist löst ein _Blitzlicht_ aus und teleportiert sich im selben Moment weg. Gegner neben seiner alten Position werden geblendet.
actors.hero.abilities.rogue.smokebomb.desc=„Nur ein Foto, bitte!“ Der Tourist löst ein grelles Blitzlicht aus und teleportiert sich bis zu 6 Felder weit. Er kann durch Gefahren und Gegner hindurch teleportieren, aber nicht durch festes Gelände wie Wände.\n\nGegner direkt neben seiner alten Position werden 5 Züge lang geblendet.
actors.hero.abilities.rogue.deathmark.name=Roter Pin
actors.hero.abilities.rogue.deathmark.ally_target=Du kannst nur Gegner markieren.
actors.hero.abilities.rogue.deathmark.short_desc=Der Tourist setzt einen _roten Pin_ auf einen gewählten Gegner, als Sehenswürdigkeit auf seiner Karte. Markierte Gegner erleiden Bonusschaden, können aber nicht sterben, bevor die Markierung endet.
actors.hero.abilities.rogue.deathmark.desc=Der Tourist markiert einen gewählten Gegner mit einem roten Pin. Der Gegner erleidet 25% Bonusschaden. Die Markierung wirkt sofort und hält 5 Züge.\n\nMarkierte Gegner erleiden Bonusschaden, können aber nicht sterben, solange die Markierung besteht. Hat ein Gegner beim Ende der Markierung 0 LP, stirbt er sofort.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=rot gepinnt
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Dieser Gegner trägt einen roten Pin. Er erleidet 25%% Bonusschaden, kann aber nicht sterben, bevor die Markierung endet.\n\nVerbleibende Züge: %s.
actors.hero.abilities.rogue.shadowclone.name=Partnerlook
actors.hero.abilities.rogue.shadowclone.short_desc=Der Tourist ruft einen _Doppelgänger im Partnerlook_ herbei, den er im Kampf lenken kann.
actors.hero.abilities.rogue.shadowclone.desc=Der Tourist ruft eine schattenhafte Kopie seiner selbst im identischen Outfit herbei, die er im Kampf lenken kann. Das Lenken kostet keine Ladung.\n\nDer Doppelgänger hat 80 LP, keine Rüstung und verursacht 10-20 Schaden. Mit Talenten lassen sich alle diese Werte verbessern, sodass der Doppelgänger von Waffe und Rüstung des Helden profitiert.
actors.hero.abilities.rogue.shadowclone$shadowally.name=Tourist im Partnerlook
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Dein Doppelgänger geht an diese Position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Dein Doppelgänger folgt dir.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Dein Doppelgänger greift an!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Eine Kopie des Touristen aus schattenhafter Dunkelheit, gleicher Poncho, gleiche Bauchtasche. Sie steht reglos da, mit leeren Augen, und kleine Schwaden aus Dunkelheit steigen wie Dampf von ihr auf.\n\nDer Doppelgänger ist keine perfekte Kopie, aber ein ordentlicher Kämpfer und kann mit den richtigen Talenten von der Ausrüstung des Touristen profitieren.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Diesen Charakter kannst du durch Verwendung einer bestimmten Rüstungsfertigkeit entdecken.

actors.hero.abilities.huntress.spectralblades.name=Upcycling-Klingen
actors.hero.abilities.huntress.spectralblades.short_desc=Die Zugezogene wirft _Upcycling-Klingen_ auf ein Ziel. Der Schaden hängt von ihrer angelegten Nahkampfwaffe ab.
actors.hero.abilities.huntress.spectralblades.desc=Die Zugezogene wirft eine schimmernde Klinge aus aufgearbeitetem Altmetall auf einen Gegner. Sie wirkt wie ein Fernangriff mit ihrer Nahkampfwaffe: Alle normalen Effekte der Nahkampfwaffe greifen, auch Verzauberungen.
actors.hero.abilities.huntress.naturespower.name=Balkonkraftwerk
actors.hero.abilities.huntress.naturespower.short_desc=Die Zugezogene schaltet ihr _Balkonkraftwerk_ ein und erhöht kurzzeitig ihre Bewegungsgeschwindigkeit und die Feuerrate ihres Bogens.
actors.hero.abilities.huntress.naturespower.desc=Die Zugezogene lädt sich und ihren Bogen mit Sonnenstrom vom Balkon auf! Das hält 8 Züge an.\n\nIn dieser Zeit bewegt sie sich doppelt so schnell und greift mit ihrem Bogen 33% schneller an. Die Bogen-Boni wirken nicht, wenn die Abstandshalterin ihre Spezialangriffe einsetzt.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=Balkonkraftwerk
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Die Zugezogene steht unter Balkonstrom: Bewegungsgeschwindigkeit und Angriffsgeschwindigkeit mit dem Bogen sind kurzzeitig erhöht.\n\nVerbleibende Züge: %s.
actors.hero.abilities.huntress.spirithawk.name=Geistertaube
actors.hero.abilities.huntress.spirithawk.no_space=Es ist kein Platz in deiner Nähe frei.
actors.hero.abilities.huntress.spirithawk.short_desc=Die Zugezogene ruft eine _Geistertaube_ herbei, die Orte auskundschaftet und Gegner ablenkt.
actors.hero.abilities.huntress.spirithawk.desc=Die Zugezogene ruft eine Geistertaube herbei. Solange die Taube da ist, lenkt sie sie durch erneutes Einsetzen der Fähigkeit. Die Taube bleibt 100 Züge, das Lenken kostet keine Ladung.\n\nDie Taube hat kaum LP und Angriffskraft, ist aber schnell, ausweichstark und treffsicher. Sie teilt jederzeit ihr ganzes Sichtfeld mit der Zugezogenen. Flächeneffekte wie Feuer oder Giftgas können ihr nichts anhaben. Sie greift nur an, wenn sie ausdrücklich dazu aufgefordert wird.
actors.hero.abilities.huntress.spirithawk$hawkally.name=Geistertaube
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Deine Taube fliegt an diese Position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Deine Taube folgt dir.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Deine Taube greift an!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Eine magische Taube, herbeigerufen von der Zugezogenen. Sie leuchtet in hellem, geisterhaftem Blau und ruckt ständig mit dem Kopf, während sie die Umgebung mustert.\n\nEine große Kämpferin ist sie nicht, aber dank Tempo und Weitblick ideal zum Auskundschaften und Ablenken. Brot nimmt sie trotzdem.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Verbleibende Züge: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=garantiertes Ausweichen übrig: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Diesen Charakter kannst du durch Verwendung einer bestimmten Rüstungsfertigkeit entdecken.

actors.hero.abilities.duelist.challenge.name=herausfordern
actors.hero.abilities.duelist.challenge.prompt=Wähle einen Feind zum Herausfordern
actors.hero.abilities.duelist.challenge.already_dueling=Du kannst nur an einem Duell gleichzeitig teilnehmen.
actors.hero.abilities.duelist.challenge.ally_target=Du kannst nur Feinde zum Kampf herausfordern.
actors.hero.abilities.duelist.challenge.unreachable_target=Du musst dazu in der Lage sein, dein Ziel zu erreichen.
actors.hero.abilities.duelist.challenge.distant_target=Dieser Gegner ist zu weit entfernt, als dass du ihn herausfordern könntest.
actors.hero.abilities.duelist.challenge.short_desc=Die Zweikämpferin _fordert_ einen in der Nähe befindlichen Gegner zu einem Duell, wodurch alle anderen Gegner zeitweilig eingefroren werden.
actors.hero.abilities.duelist.challenge.desc=Die Zweikämpferin fordert einen in der Nähe befindlichen Gegner zum Duell. Dieser Gegner ist dann gezwungen, gegen sie zu kämpfen, während alle anderen Gegner zeitweilig in der Zeit eingefroren werden.\n\nDas Ziel muss erreichbar und sich innerhalb eines Radius von 5 Feldern um die Zweikämpferin herum befinden. Das Duell hält an, bis 10 Züge vorüber sind, der Gegner stirbt oder die Zweikämpferin mehr als 5 Felder vom Gegner entfernt steht.\n\nEingefrorene Gegner sind unverwundbar. Die Alliierten der Zweikämpferin werden durch diese Fähigkeit nicht eingefroren, wird jedoch ein Boss herausgefordert, so werden seine Lakaien ebenfalls nicht eingefroren.
actors.hero.abilities.duelist.challenge$duelparticipant.name=Duellteilnehmer
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Dieser Charakter nimmt an einem Duell teil. Er sowie jeder seiner Alliierten oder Lakaien können normal agieren, während andere eingefroren sind.\n\nDas Duell dauert eine bestimmte Zeit an, bis einer der Teilnehmer stirbt, oder bis die Teilnehmer sich auseinander bewegen, bis sie mehr als 5 Felder voneinander entfernt sind.\n\nVerbleibende Züge: %d.
actors.hero.abilities.duelist.elementalstrike.name=Elementarschlag
actors.hero.abilities.duelist.elementalstrike.short_desc=Die Zweikämpferin setzt einen _Elementarschlag_ ein, bei dem sich ein auf ihrer Waffenverzauberung beruhender Effekt kegelförmig ausbreitet.
actors.hero.abilities.duelist.elementalstrike.desc=Die Zweikämpferin schlägt einen Feind oder einen Ort mit einem regulären Angriff, der garantiert trifft und einen magischen Effekt in einem kegelförmigen Bereich von 65 Grad bis zu 4 Felder weit hervorruft. Dieser magische Effekt ist je nach der Verzauberung der Primärwaffe der Zweikämpferin unterschiedlich.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Ein Elementarschlag ohne Verzauberung ruft einen geringen magischen Impuls hervor, der allen Feinden in Reichweite zwischen 6 und 12 Schadenspunkte zufügt.
actors.hero.abilities.duelist.feint.name=Finte
actors.hero.abilities.duelist.feint.prompt=Wähle einen Ort, wohin du sprinten möchtest
actors.hero.abilities.duelist.feint.too_far=Dieser Ort befindet sich nicht direkt neben dir.
actors.hero.abilities.duelist.feint.bad_location=Du kannst dich nicht an diesen Ort  bewegen.
actors.hero.abilities.duelist.feint.short_desc=Die Zweikämpferin _schlägt eine Finte_ und täuscht dabei einen Angriff vor, während sie aber auf ein angrenzendes Feld springt. Feinde werden ihr Nachbild angreifen und stehen einem Gegenangriff gegenüber schutzlos da.
actors.hero.abilities.duelist.feint.desc=Die Zweikämpferin täuscht einen Angriff vor, während sie aber auf ein nächstgelegenes Feld springt und ein kurzzeitiges Nachbild von sich hinterlässt. Feinde, welche die Zweikämpferin angreifen, werden stattdessen dieses Nachbild angreifen.\n\nFeinde, die ein solches Nachbild angreifen, werden verwirrt, wodurch ihre nächste Aktion abgebrochen wird und sie einem Überraschungsangriff schutzlos gegenüberstehen.

actors.hero.abilities.cleric.ascendedform.name=aufgestiegene Form
actors.hero.abilities.cleric.ascendedform.short_desc=Der Kleriker nimmt eine _Aufgestiegene Form_ an, erhält so neue Zaubersprüche, Angriffsreichweite und Abschirmung.
actors.hero.abilities.cleric.ascendedform.desc=Der Kleriker strahlt heilige Energie aus sich selbst aus und nimmt für 10 Züge eine erweiterte strahlende Form an. In dieser Form kann der Kleriker neue Zauber wirken, erhält 2 Angriffsreichweite und 30 Abschirmung; alle weiteren Zauber, die er wirkt, gewähren 10 Abschirmung pro verwendeter Ladung des Heiligen Folianten.\n\nDie Abschirmung durch die aufgestiegene Form und ihre Zauber lässt nicht normal nach, sie verschwindet jedoch sofort, sobald die aufgestiegene Form endet. Die Fähigkeit kann erneut verwendet werden, um die Dauer der aufgestiegenen Form zu verlängern.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=aufgestiegene Form
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Strahlende Energie entweicht dem Körper des Klerikers. In dieser Form erhält der Kleriker 2 Angriffsreichweite (durch die heilige Energie, die von ihm ausgeht) und 10 Abschirmung, sobald er eine Ladung des heiligen Folianten verbraucht. Er kann auch Zauber wirken, die durch die Talente der aufgestiegenen Form freigeschaltet werden.\n\nDie Abschirmung, die durch die aufgestiegene Form und ihre Zauber gewährt wird, verfällt nicht normal, sie verschwindet jedoch sofort, wenn die aufgestiegene Form endet.\n\nDerzeitige Abschirmung: %1$d.\nVerbleibende Züge: %2$d.
actors.hero.abilities.cleric.trinity.name=Dreieinigkeit
actors.hero.abilities.cleric.trinity.no_imbue=Die Dreieinigkeit hat derzeit keinen Effekt für eine ihrer Formen festgelegt, nutze einen ihrer Sprüche!
actors.hero.abilities.cleric.trinity.no_duplicate=Dreieinigkeit kann keine Wirkung duplizieren, die du bereits ausgerüstet hast!
actors.hero.abilities.cleric.trinity.ench_glyph_use=Dreieinigkeit wird diese Wirkung für _%1$d Züge_ anwenden, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Dreieinigkeit wird diese _mächtige_ Wirkung für _%1$d Züge_ entfalten, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.wand_use=Dreieinigkeit wird diesen Stab mit einer Stärke von _+%1$d_ entfesseln, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.wand_multi_use=Dreieinigkeit wird diesen _mehrfach aufladbaren_ Stab mit einer Stärke von _+%1$d_ entfesseln, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.thrown_use=Dreieinigkeit wird diese Waffe mit einer Stärke von _+%1$d_ schleudern, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.ring_use=Dreieinigkeit wird die Wirkung dieses Rings mit einer Stärke von _+%1$d_ für 20 Zügen gewähren, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Dreieinigkeit wird die Fernalchemie-Wirkung dieses Artefakts entfalten, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Dreieinigkeit wird die passive Lebensregeneration dieses Artefakts mit einer Stärke von _+%1$d_ für 20 Zügen gewähren, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.driedrose_use=Dreieinigkeit wird die Wirkung dieses Artefakts entfesseln, um eine verderbte, verbündete Totengeisterscheinung mit der Lebensenergie eines Christbaums der Stufe _+%1$d_ zu beschwören, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.etherealchains_use=Dreieinigkeit wird die Kettenzauber-Wirkung dieses Artefakts mit einer Reichweite von _+%1$d_ anwenden, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Dreieinigkeit wird die Verzehr-Wirkung dieses Artefakts entfalten, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Dreieinigkeit wird die Diebstahlwirkung dieses Artefakts mit einer Stärke von _+%1$d_ anwenden, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Dreieinigkeit wird die Wurzelwirkung dieses Artefakts mit einem zufällig schädlichen Samen entfalten, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.skeletonkey_use=Dreieinigkeit wird die Einsetzen-Wirkung dieses Artefakts entfalten, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Dreieinigkeit wird die Wahrsage-Wirkung dieses Artefakts mit einer Stärke von _+%1$d_ anwenden, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Dreieinigkeit wird die Zeitstopp-Wirkung dieses Artefakts mit einer Dauer von _%1$d Zügen_ entfalten, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Dreieinigkeit wird die zufällige Schriftrollen-Wirkung dieses Artefakts entfalten, mit einer _%1$d/10_ Chance, die exotische Variante ohne zusätzliche Kosten zu gewähren, zum Preis von _%2$s Ladung._
actors.hero.abilities.cleric.trinity.cost=Die Ladungskosten dieser Fähigkeit variieren, betragen jedoch meist _%d._
actors.hero.abilities.cleric.trinity.short_desc=Der Kleriker erhält eine _Dreieinigkeit_ an Fähigkeiten, die Ausrüstung simulieren, welche er gesehen hat und die durch Einsatz neuer Zaubersprüche zugeordnet werden können.
actors.hero.abilities.cleric.trinity.desc=Der Kleriker erhält eine _Dreieinigkeit_ neuer Rüstungsfähigkeiten, die durch Einsatz dreier neuer Zaubersprüche verschiedenen Effekten von Gegenständen zugeordnet werden können. Jeder dieser Zaubersprüche simuliert den Effekt verschiedener Arten von Ausrüstungsgegenständen, den der Kleriker im Verlauf seines aktuellen Abenteuers identifiziert hat: Körperform (Waffen und Rüstungen), Verstandesform (Zauberstäbe und Wurfwaffen) und Geistform (Ringe und Artefakte).\n\nJede Dreieinigkeit kann mit nur einem Effekt gleichzeitig geprägt sein, und der Kleriker wählt, welcher davon aktiviert wird, wenn Dreieinigkeit genutzt wird. Dreieinigkeit dupliziert nicht die Effekte von Gegenständen, die bereits ausgerüstet sind.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Wähle aus, welche Form der Dreieinigkeit genutzt werden soll. Die Wirkungen unterschiedlicher Formen können gleichzeitig aktiv sein.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Körperform: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Verstandesform: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Geistform: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Wähle eine Wirkung aus, die in die Dreieinigkeit eingewoben werden soll. Weitere Informationen werden vor der Bestätigung angezeigt.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Der Körperform zuweisen
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Der Verstandesform zuweisen
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Der Geistform zuweisen
actors.hero.abilities.cleric.powerofmany.name=die Macht der Vielen
actors.hero.abilities.cleric.powerofmany.prompt_default=Wähle einen Verbündeten oder einen Ort
actors.hero.abilities.cleric.powerofmany.prompt_ally=Lenke deinen Lichtverbündeten
actors.hero.abilities.cleric.powerofmany.ally_exists=Du hast bereits einen ermächtigten Verbündeten.
actors.hero.abilities.cleric.powerofmany.no_vision=Du kannst keinen Ort als Ziel wählen, den du nicht siehst.
actors.hero.abilities.cleric.powerofmany.only_allies=Du kannst nur Verbündete ermächtigen.
actors.hero.abilities.cleric.powerofmany.short_desc=Der Kleriker kanalisiert die _Macht der Vielen_ und verleiht so einem Verbündeten Macht, oder erschafft einen neuen.
actors.hero.abilities.cleric.powerofmany.desc=Der Kleriker kanalisiert die _Macht der Vielen_ und verleiht so einem Verbündeten Macht, oder erschafft für 100 Züge einen neuen, so bemächtigten. Zielt man damit auf ein leeres Feld, wird ein neuer Verbündeter geschaffen.\n\nSolange der Verbündete durch die Macht der Vielen bemächtigt ist, verursacht er +25% Schaden, erleidet -25% Schaden und teilt seinen Sichtkreis mit dem Kleriker. Außerdem bekommt er 25 Abschirmung, wenn die Fähigkeit genutzt wird.\n\nDer Kleriker erlangt ebenso drei neue Zaubersprüche, die nur mit einem bemächtigten Verbündeten gewirkt werden können. Die Macht der Vielen endet nicht, solange einer dieser Zaubersprüche aktiv ist.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=die Macht der Vielen
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Dieser Verbündete wurde von der Macht der Vielen gestärkt, was ihm +25%% verursachten Schaden und -25%% erlittenen Schaden gewährt. Zudem teilt er sein Sichtfeld mit dem Kleriker und kann von Zaubern der Macht der Vielen profitieren.\n\nDie Macht der Vielen bleibt bestehen, selbst wenn Verbündete wie ein spektrales Abbild sich verbergen, aber die Dauer läuft dennoch weiter ab.\n\nVerbleibende Züge: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=Lichtverbündeter
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Dein Verbündeter bewegt sich zu dieser Position.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Dein Verbündeter bewegt sich und folgt dir.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Dein Verbündeter geht zum Angriff über!
actors.hero.abilities.cleric.powerofmany$lightally.desc=Eine Kopie eines der Abenteuer suchenden Gefährten des Klerikers, bestehend aus festem Licht. Obwohl sie die Gestalt eines anderen Helden hat, besitzt sie keine seiner einzigartigen Fähigkeiten. Dieser Verbündete bleibt bestehen, solange die Macht der Vielen auf ihn angewandt ist.\n\nDieser Verbündete kann ohne Kosten gelenkt werden, indem die Rüstungsfähigkeit der Macht der Vielen erneut verwendet wird.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Diesen Charakter kannst du durch Verwendung einer bestimmten Rüstungsfertigkeit entdecken.


actors.hero.abilities.ratmogrify.name=rattifizieren
actors.hero.abilities.ratmogrify.cant_transform=Du kannst das nicht rattifizieren!
actors.hero.abilities.ratmogrify.too_strong=Dieser Gegner ist zu stark zum Rattifizieren!
actors.hero.abilities.ratmogrify.short_desc=Du _rattifizierst_ einen Gegner! Er wird eine Zeitlang zur Ratte ohne Fähigkeiten. Die Hausverwaltung merkt keinen Unterschied.
actors.hero.abilities.ratmogrify.desc=Du verwandelst einen Gegner 6 Züge lang in eine Ratte! Bosse, Verbündete und Ratten können nicht rattifiziert werden.\n\nVerwandelte Gegner behalten ihre ursprünglichen Werte, haben aber keine Fähigkeiten.
actors.hero.abilities.ratmogrify$transmograt.name=rattifiziert %s
actors.hero.abilities.ratmogrify$transmograt.desc=Dieser Gegner wurde in eine Ratte verwandelt. Eine enorme Verbesserung, wenn du mich fragst! - Der Pfandkönig
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Getötet von einem rattifizierten Gegner

##Cleric Spells
actors.hero.spells.auraofprotection.name=Aura des Schutzes
actors.hero.spells.auraofprotection.short_desc=Stärkt die Verteidigung für den Mieterschützer und Verbündete in deiner Nähe.
actors.hero.spells.auraofprotection.desc=Der Mieterschützer strahlt für 20 Züge schützende Energie aus. Alle Verbündeten innerhalb von 2 Feldern (inklusive des Mieterschützers) nehmen %1$d%% weniger Schaden und bekommen den Effekt seiner Rüstungsglyphe bei +%2$d%% Energie.\n\nDiese Schadensverminderung tritt ein vor anderen schadensvermindernden Effekten (z. B. Rüstung). Die Erhöhung der Energie der Glyphe findet immer statt. Jedoch kann dieser Zauber die Glyphe nicht dazu bringen, mehr als ein mal angewendet zu werden, wenn ein Charakter schon davon profitiert (zum Beispiel der Mieterschützer selbst oder ein spektrales Abbild).
actors.hero.spells.auraofprotection$aurabuff.name=Aura des Schutzes
actors.hero.spells.auraofprotection$aurabuff.desc=Der Mieterschützer strahlt schützende Energie um sich herum aus.\n\nJeder nahestehende Verbündete (einschließlich des Mieterschützers selbst) erleidet verringerten Schaden und erhält die Wirkung der Rüstungsglyphe des Mieterschützers mit verstärkter Kraft.\n\nVerbleibende Züge: %s.

actors.hero.spells.beamingray.name=glänzender Strahl
actors.hero.spells.beamingray.no_space=Es ist kein Platz dafür da, dass dein Verbündeter dort erscheint.
actors.hero.spells.beamingray.out_of_range=Dieser Ort ist außer Reichweite.
actors.hero.spells.beamingray.short_desc=Teleportiert deinen Verbündeten und gewährt Bonusschaden.
actors.hero.spells.beamingray.desc=Der Kleriker lenkt die Kraft seines Verbündeten in einen Lichtstrahl, der ihn an einen Ort versetzt. Trifft der Strahl auf einen Feind, erscheint der Verbündete in dessen Nähe und wendet sich ihm zu.\n\nDer Strahl hat eine Reichweite von höchstens %1$d Feldern und erhöht den Bonusschaden der Macht der Vielen für 10 Züge auf +%2$d%% gegen den nächsten Feind im Umkreis von 4 Feldern. Der Strahl kann sogar normalerweise unbewegliche Verbündete versetzen, seine Reichweite ist dann aber halbiert.
actors.hero.spells.beamingray$beamingrayboost.name=glänzender Strahl
actors.hero.spells.beamingray$beamingrayboost.desc=Dieser Verbündete wurde kürzlich durch den Versetzungsstrahl teleportiert und erhält nach der Versetzung Bonusschaden gegen den nächsten Feind. Die Macht der Vielen endet nicht, solange dieser Segen aktiv ist.\n\nVerbleibende Züge: %s.

actors.hero.spells.blessspell.name=segnen
actors.hero.spells.blessspell.short_desc=Segnet und schirmt den Kleriker ab, segnet und heilt andere.
actors.hero.spells.blessspell.desc=Der Kleriker spricht einen heiligen Segen auf sich selbst oder einen anderen Charakter aus, den er sehen kann.\n\nWenn der Segen auf sich selbst gewirkt wird, ist der Effekt schwächer und gewährt %1$d Züge Segen und %2$d Barriere.\n\nWenn er auf andere Charaktere gewirkt wird, ist der Zauber mächtiger und gewährt %3$d Züge Segen und %4$d Heilung. Überschüssige Heilung wird in Barriere umgewandelt.

actors.hero.spells.bodyform.name=Körperform
actors.hero.spells.bodyform.short_desc=Weist Dreieinigkeit einer Verzauberung oder Glyphe zu.
actors.hero.spells.bodyform.desc=Der Kleriker wählt eine Verzauberung oder Glyphe aus, die er in diesem Abenteuer identifiziert hat, und webt Dreieinigkeit in deren Wirkung ein.\n\nWird die Dreieinigkeit verwendet, erhält der Kleriker die Wirkung der gewählten Verzauberung oder Glyphe für %d Züge. Diese temporäre Verzauberung oder Glyphe funktioniert mit jeder Wirkung, die auch eine reguläre Verzauberung oder Glyphe hätte.\n\nDieser Zauber ersetzt jede andere Körperwirkung, mit der Dreieinigkeit momentan verbunden ist.
actors.hero.spells.bodyform$bodyformbuff.name=Körperform
actors.hero.spells.bodyform$bodyformbuff.desc=Die Körperform der Dreieinigkeit gewährt dir momentan die Kraft einer Verzauberung oder Glyphe, als hättest du sie auf deiner aktuellen Waffe oder Rüstung ausgerüstet.\n\nBeachte, dass die Körperform keine zusätzliche Kopie einer Wirkung gewähren kann, von der du bereits profitierst.\n\nAktuelle Wirkung: %1$s.\nVerbleibende Züge: %2$s.

actors.hero.spells.cleanse.name=reinigen
actors.hero.spells.cleanse.short_desc=Hebt Schwächungen auf und gewährt Abschirmung.
actors.hero.spells.cleanse.desc=Der Kleriker hebt alle schädlichen Status-Effekte an sich und an Verbündeten im Sichtfeld auf. Nachdem der Spruch abgelaufen ist, erhalten alle betroffenen Charaktere auch %1$d Züge Immunität gegen Schwächung und %2$d Barriere.

actors.hero.spells.clericspell.prompt=Wähle ein Ziel
actors.hero.spells.clericspell.no_target=Es ist kein Ziel da.
actors.hero.spells.clericspell.invalid_target=Du kannst diesen Ort nicht ins Ziel nehmen.
actors.hero.spells.clericspell.invalid_enemy=Du kannst nicht auf diesen Feind zielen.
actors.hero.spells.clericspell.charge_cost=Ladungskosten: %d

actors.hero.spells.divinesense.name=göttlicher Sinn
actors.hero.spells.divinesense.short_desc=Erhalte zeitweilig übersinnliche Wahrnehmung in einem weiten Umkreis.
actors.hero.spells.divinesense.desc=Der Kleriker fokussiert seine Sinne auf seiner Umgebung und erhält für 50 Züge übersinnliche Wahrnehmung in einem Umkreis von %d Feldern. Dieser Spruch benötigt keine Zeit, wenn er gewirkt wird.
actors.hero.spells.divinesense$divinesensetracker.name=göttlicher Sinn
actors.hero.spells.divinesense$divinesensetracker.desc=Dieser Charakter ist vorübergehend in der Lage, andere nahe Kreaturen mit seinem Verstand wahrzunehmen!\n\nVerbleibende Züge: %s.

actors.hero.spells.divineintervention.name=göttlicher Eingriff
actors.hero.spells.divineintervention.short_desc=Eine massive Verstärkung der Abschirmung für den Kleriker und seine Verbündeten.
actors.hero.spells.divineintervention.desc=Der Kleriker lässt eine enorme Menge an Kraft aus seinem Folianten in sich selbst und seine Verbündeten fließen und verstärkt jeden auf %1$d Abschirmung und verlängert die Aufgestiegene Form um %2$d Züge. Die unglaubliche Verteidigungskraft dieses Zaubers wird durch seine sehr hohen Ladekosten aufgewogen.\n\nGenau wie andere Arten der Abschirmung, die durch die aufgestiegene Form gewährt werden, verfällt diese Abschirmung nicht auf die übliche Weise, sondern erlischt sofort, wenn die aufgestiegene Form endet.

actors.hero.spells.flash.name=Blinken
actors.hero.spells.flash.prompt=Wähle einen Ort
actors.hero.spells.flash.short_desc=Zu einem nahegelegenen Ort teleportieren.
actors.hero.spells.flash.desc=Der Kleriker kanalisiert seine aufgestiegene Form an einen nahegelegenen Ort und teleportiert sich dorthin. _Blinken_ kann den Kleriker an jeden entdeckten Ort teleportieren, der in Reichweite und unbesetzt ist. Dieser Zauber kostet jedes Mal mehr Foliantenladungen, wenn er in derselben aufgestiegenen Form verwendet wird.

actors.hero.spells.guidinglight.name=Leitlicht
actors.hero.spells.guidinglight.short_desc=Fügt auf die Entfernung magischen Schaden zu und garantiert einen Treffer.
actors.hero.spells.guidinglight.desc=Der Kleriker feuert einen Blitz aus magischer Energie ab, der ein Ziel trifft, 2-8 Schaden verursacht und es erleuchtet. Der nächste ungehinderte physische Angriff auf einen erleuchteten Feind trifft ihn garantiert.
actors.hero.spells.guidinglight.desc_priest=_Dieser Zauber ist mächtiger, wenn er vom Quartiersmanager gewirkt wird._ Der erste Einsatz des Zaubers innerhalb von 50 Zügen kostet keine Foliantenladungen, und die Erleuchtung wird von Gnadenstrahl, Stäben, anderen Charakteren und Artefakten verbraucht, die direkt auf Feinde wirken. Wenn die Erleuchtung auf diese Weise verwendet wird, verursacht sie zusätzlichen Magieschaden in Höhe der Stufe des Quartiersmanagers + 5.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Leitlicht
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Der Quartiersmanager kann nach 50 Zügen erneut kostenfrei Leitlicht wirken.\n\nVerbleibende Züge: %s.
actors.hero.spells.guidinglight$illuminated.name=Beleuchtet
actors.hero.spells.guidinglight$illuminated.desc=Dieser Charakter leuchtet infolge des Treffers durch das Leitlicht. Obwohl das Leuchten nicht stark genug ist, um die Umgebung zu erhellen, macht die magische Wirkung es dem Kleriker wesentlich leichter, ihn zu treffen.
actors.hero.spells.guidinglight$illuminated.desc_priest=Der Quartiersmanager kann die Erleuchtung zusätzlich zum Gnadenstrahl, einem Stabblitz, einen Schlag eines Verbündeten oder die Wirkung mancher Artefakte verbrauchen. Auf diese Weise verursacht die Erleuchtung zusätzlichen Schaden in Höhe der Stufe des Quartiersmanagers +5.
actors.hero.spells.guidinglight$illuminated.desc_generic=Andere Helden können die Erleuchtung weiterhin nutzen, um von der Fähigkeit des sengenden Lichts zu profitieren, erhalten jedoch keine zusätzliche Präzision.

actors.hero.spells.hallowedground.name=geweihter Boden
actors.hero.spells.hallowedground.prompt=Wähle einen Ort
actors.hero.spells.hallowedground.short_desc=Heilt Verbündete, verlangsamt Feinde und verbreitet in seinem Wirkungsbereich Gras.
actors.hero.spells.hallowedground.desc=Der Quartiersmanager konzentriert seine göttliche Magie auf den Boden in der Nähe und erschafft so für 20 Züge einen %1$dx%1$d großen, geweihten Bereich.\n\nWenn dieser Zauber gewirkt wird, heilt er alle Verbündeten um 15 LP (gesunde Verbündete und der Quartiersmanager erhalten Abschirmung), lässt Feinde kurzzeitig verwurzeln und breitet kurzes Gras aus.\n\nDer geweihte Boden heilt Verbündete um 1 LP pro Zug (gesunde Verbündete und der Quartiersmanager erhalten Abschirmung), lähmt Feinde und lässt zufällig hohes Gras wachsen.\n\nGeweihter Boden wird durch Feuer zerstört und erzeugt zerfurchtes Gras, wenn passive Regenerationseffekte deaktiviert sind oder der Quartiersmanager eine Zeit lang keine Erfahrung gesammelt hat.
actors.hero.spells.hallowedground$hallowedterrain.desc=Der Boden hier wurde geweiht. Geweihter Boden verlangsamt Feinde, heilt Verbündete und lässt Gras hervorsprießen.

actors.hero.spells.holyintuition.name=heilige Intuition
actors.hero.spells.holyintuition.prompt=wähle einen Gegenstand
actors.hero.spells.holyintuition.cursed=Du spürst, dass in diesem Gegenstand bösartige Magie lauert.
actors.hero.spells.holyintuition.uncursed=Dieser Gegenstand ist frei von bösartiger Magie.
actors.hero.spells.holyintuition.short_desc=Bestimmt, ob ein Gegenstand verflucht ist.
actors.hero.spells.holyintuition.desc=Der Kleriker fokussiert seine Sinne auf einen Gegenstand und bestimmt, ob dieser verflucht ist, ohne ihn ausrüsten zu müssen.

actors.hero.spells.holylance.name=heilige Lanze
actors.hero.spells.holylance.short_desc=Fügt auf Entfernung schweren magischen Schaden zu.
actors.hero.spells.holylance.desc=Der Quartiersmanager konzentriert eine große Menge Energie in einer verheerenden Wurflanze aus Licht. Diese Lanze verursacht %1$d-%2$d Schaden und fügt untoten und dämonischen Zielen immer maximalen Schaden zu.\n\nDieser Zauber ist sehr teuer und hat eine Abklingzeit von 30 Zügen.
actors.hero.spells.holylance$lancecooldown.name=Abklingzeit heilige Lanze
actors.hero.spells.holylance$lancecooldown.desc=Der Quartiersmanager hat vor kurzem die Heilige Lanze gewirkt und muss warten, bevor er sie nochmals wirken kann.\n\nVerbleibende Züge: %s.

actors.hero.spells.holyward.name=heilige Wache
actors.hero.spells.holyward.glyph_name=%s des Lichts
actors.hero.spells.holyward.glyph_desc=Diese Glyphe erhöht ein wenig den Schaden, den eine Rüstung abblocken kann.
actors.hero.spells.holyward.short_desc=Überschreibt zeitweilig Glyphen, um die Rüstungsstärke zu erhöhen.
actors.hero.spells.holyward.desc=Der Kleriker durchwirkt seine Rüstung mit der Glyphe des heiligen Lichts und erhöht so ihre Rüstungskraft um 1. Dieser Zauber wirkt augenblicklich.\n\nDiese Rune verweilt für 50 Züge und überschreibt für diese Zeit andere nützliche Runen auf der Rüstung. Der Kleriker kann diesen Effekt auch ohne eine Rüstung nutzen.
actors.hero.spells.holyward.desc_paladin=_Dieser Zauber ist mächtiger, wenn er vom Mieterschützer gewirkt wird._ Die zusätzliche Schadensverringerung erhöht sich auf 3, der Zauber überschreibt keine bestehenden Glyphen mehr, und das Wirken anderer Zauber während der aktiven heiligen Wache verlängert deren Dauer um 10 Züge pro verwendeter Ladung.
actors.hero.spells.holyward$holyarmbuff.name=heilige Wache
actors.hero.spells.holyward$holyarmbuff.desc=Der Kleriker verleiht der von ihm getragenen Rüstung heilige Energie, wodurch jede eventuell vorhandene Glyphe überschrieben wird und die Rüstung einen zusätzlichen Schadenspunkt abblockt.\n\nVerbleibende Züge: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Der Mieterschützer hat seine getragene Rüstung mit heiliger Energie durchdrungen, wodurch die Rüstung zusätzlich 3 Schadenspunkte blockiert. \n\nDas Wirken anderer Zauber während der aktiven heiligen Wache verlängert deren Dauer um 10 Züge pro verwendeter Ladung. \n\nVerbleibende Züge: %s.

actors.hero.spells.holyweapon.name=heilige Waffe
actors.hero.spells.holyweapon.ench_name=heiliges %s
actors.hero.spells.holyweapon.ench_desc=Feinde, die von einer heiligen Waffe getroffen wurden, bekommen zusätzlichen magischen Schaden.
actors.hero.spells.holyweapon.short_desc=Überschreibt zeitweilig Verzauberungen, um den Schaden zu erhöhen.
actors.hero.spells.holyweapon.desc=Der Kleriker durchwirkt seine Waffe mit heiliger Energie, sodass sie bei Gegnern zusätzlich 2 magischen Schaden verursacht. Dieser Zauber wirkt augenblicklich.\n\nDie Verzauberung verweilt für 50 Züge und überschreibt temporär andere nützliche Verzauberungen auf der Waffe. Auch unbewaffnete Angriffe profitieren von diesem Effekt.
actors.hero.spells.holyweapon.desc_paladin=_Dieser Zauber ist mächtiger, wenn er vom Mieterschützer gewirkt wird._ Der zusätzliche magische Schaden erhöht sich auf 6, der Zauber überschreibt keine bestehenden Verzauberungen mehr, und das Wirken anderer Zauber während der aktiven heiligen Waffe verlängert deren Dauer um 10 Züge pro verwendeter Ladung.
actors.hero.spells.holyweapon$holywepbuff.name=heilige Waffe
actors.hero.spells.holyweapon$holywepbuff.desc=Der Kleriker verleiht der von ihm getragenen Waffe heilige Energie, wodurch jede eventuell vorhandene Verzauberung überschrieben wird und die Waffe zusätzlich 2 magischen Schaden verursacht.\n\nVerbleibende Züge: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Der Mieterschützer hat seine getragene Waffe mit heiliger Energie durchdrungen, wodurch seine Angriffe zusätzlichen magischen Schaden in Höhe von 6 verursachen. \n\nDas Wirken anderer Zauber während der aktiven heiligen Waffe verlängert deren Dauer um 10 Züge pro verwendeter Ladung. \n\nVerbleibende Züge: %s.

actors.hero.spells.judgement.name=Urteil
actors.hero.spells.judgement.short_desc=Schädigt alle sichtbaren Feinde.
actors.hero.spells.judgement.desc=Der Kleriker schlägt seine Faust gegen den Boden und erzeugt so eine Lichteruption, die allen Feinden in seinem Sichtbereich Schaden zufügt. Dies fügt %1$d-%2$d Grundschaden und weitere 33%% Schadenspunkte pro Zauberspruch zu, den der Kleriker gewirkt hat, seit er zuletzt die aufgestiegene Form angenommen hat (oder seit dem letzten Spruch des Urteils).\n\nDerzeit wird Urteil %3$d-%4$d Schaden zufügen.

actors.hero.spells.layonhands.name=Handauflegung
actors.hero.spells.layonhands.short_desc=Heilt sofort einen direkt benachbarten Charakter oder schirmt den Mieterschützer ab.
actors.hero.spells.layonhands.desc=Der Mieterschützer bündelt heilige Energie in seinen Händen, um alles zu heilen oder zu schützen, was er berührt. \n\nDer Mieterschützer kann diesen Zauber auf einen benachbarten Charakter wirken, um ihm %1$d Heilung zu gewähren, oder auf sich selbst, um %1$d Abschirmung zu erhalten. Überschüssige Heilung durch diesen Zauber wird in Abschirmung umgewandelt. \n\nDieser Zauber wird augenblicklich gewirkt und kann wiederholt eingesetzt werden, jedoch nicht mehr als die dreifache Menge an Abschirmung gleichzeitig gewähren.

actors.hero.spells.lifelinkspell.name=Lebensverbindung
actors.hero.spells.lifelinkspell.short_desc=Teilt Schaden mit einem Verbündeten und reduziert dessen erlittenen Schaden.
actors.hero.spells.lifelinkspell.desc=Der Kleriker stärkt die Verbindung zwischen sich und seinem gestärkten Verbündeten. Durch diese gestärkte Verbindung wird jeglicher erlittener Schaden für %1$d Züge zwischen dem Helden und seinem Verbündeten geteilt, und der defensive Bonus der Macht der Vielen wird auf -%2$d%% erlittenen Schaden erhöht. Beachte, dass der Schaden nach der Rüstungsreduktion, aber vor der Schadensminderung durch die Macht der Vielen geteilt wird.\n\nSolange dieser Effekt aktiv ist, wirken wohltätige Klerikerzauber der Stufe 3 oder darunter sowohl auf den Kleriker als auch auf seinen Verbündeten, wenn sie ansonsten nur auf einen von beiden wirken würden.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=Schutz durch Lebensband
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Der Kleriker hat kürzlich Lebensband auf diesen Verbündeten gewirkt.\n\nZusätzlich zu den üblichen Vorteilen von Lebensband erleidet diese Gestalt verminderten Schaden, wohltätige Klerikerzauber wirken auf sowohl den Kleriker als auch diesen Verbündeten, anstatt nur auf einen von beiden, und die Macht der Vielen läuft nicht ab, solange dieser Segen aktiv ist.\n\nVerbleibende Züge: %s.

actors.hero.spells.mindform.name=Verstandesform
actors.hero.spells.mindform.short_desc=Ordnet Dreieinigkeit einem Zauberstab oder einer Wurfwaffe zu.
actors.hero.spells.mindform.desc=Der Kleriker wählt einen Zauberstab oder Wurfwaffen, die er während dieses Abenteuers identifiziert hat, und erfüllt Dreieinigkeit mit deren Wirkung.\n\nWenn Dreieinigkeit verwendet wird, kann der Kleriker einen einzelnen Angriff ausführen, als würde er den gewählten Gegenstand mit +%d verwenden. Dies löst alle Effekte aus, die beim Einsatz dieses Gegenstandstyps normalerweise ausgelöst würden.\n\nDieser Spruch ersetzt jeden anderen Verstandeseffekt, mit dem Dreieinigkeit derzeit erfüllt ist.

actors.hero.spells.mnemonicprayer.name=Gebet zum Gedenken
actors.hero.spells.mnemonicprayer.short_desc=Verlängert positive wie negative Effekte an einem Verbündeten oder Feind und wendet Erleuchtet erneut an.
actors.hero.spells.mnemonicprayer.desc=Der Quartiersmanager spricht ein Gebet, das die Dauer aller positiven oder negativen Effekte an einem bestimmten Ziel um %1$d Züge verlängert. Dieser Zauber wirkt augenblicklich. Positive Effekte halten bei Verbündeten (einschließlich des Quartiersmanagers selbst) länger an, schädliche Effekte halten bei Feinden länger an.\n\nEingedenken kann nur eine bestimmte Instanz eines positiven oder negativen Effekts einmal verlängern, und es eignet sich nicht dazu, Effekte, die durch Rüstungsfähigkeiten verliehen werden, zu verlängern.

actors.hero.spells.radiance.name=Gnadenstrahl
actors.hero.spells.radiance.short_desc=Beleuchtet und betäubt kurzzeitig sichtbare Feinde.
actors.hero.spells.radiance.desc=Der Quartiersmanager entfesselt ein heiliges Strahlen, das alle sichtbaren Feinde für 3 Züge betäubt. Ist ein Gegner bereits beleuchtet, so löst Gnadenstrahl den Bonusschaden der Beleuchtung aus und wendet den Beleuchtungseffekt an. Gnadenstrahl lässt auch den Quartiersmanager selbst für 100 Züge leuchten, wenn die aktuelle Ebene in Dunkelheit gehüllt ist.

actors.hero.spells.recallinscription.name=Runen-Echo
actors.hero.spells.recallinscription.short_desc=Wiederholt eine kürzlich eingesetzte Stadttaube oder Schriftrolle.
actors.hero.spells.recallinscription.desc=Der Kleriker verwendet heilige Magie, um die Wirkung einer Stadttaube oder einer Schriftrolle, die er innerhalb der letzten %s Züge verwendet hat, zu wiederholen.\n\nRunen-Echo kann nicht verwendet werden, um Modernisierungsbescheide zu replizieren. Die Aufladekosten dieses Zaubers variieren je nachdem, welcher Gegenstand zuletzt verwendet wurde: 2 für eine Stadttaube, 3 für eine Schriftrolle, 4 für eine exotische Schriftrolle. Diese Aufladekosten verdoppeln sich auch beim Replizieren eines Umwidmungsantrags oder von Alchemiegegenständen, die mithilfe von Umwandlung oder Verbesserung hergestellt werden müssen.
actors.hero.spells.recallinscription$useditemtracker.name=kürzlich verwendete Rune
actors.hero.spells.recallinscription$useditemtracker.desc=Der Kleriker hat kürzlich einen Gegenstand verwendet, der mit dem Runen-Echo-Zauber funktioniert. Der Kleriker kann diesen Zauber wirken, um den Effekt des Gegenstands zu wiederholen.\n\nVerwendeter Gegenstand: %1$s.\n\nVerbleibende Züge: %2$s.

actors.hero.spells.shieldoflight.name=Lichtschild
actors.hero.spells.shieldoflight.short_desc=Gewährt zeitweilig Rüstungsschutz gegen ein Ziel.
actors.hero.spells.shieldoflight.desc=Der Kleriker schafft eine dünne Lichtbarriere zwischen sich und einem Feind, wodurch der Rüstungswert gegen diesen Feind für 5 Züge um %1$d-%2$d erhöht wird.\n\nDieser Spruch benötigt keine Zeit für seine Wirkung, er kann jedoch nicht gegen mehrere Ziele gleichzeitig eingesetzt werden.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=Lichtschild
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Ein feiner Lichtschild steht zwischen diesem Charakter und einem Feind. Er ist nicht stark genug, um Angriffe vollständig abzublocken, wird sie aber abschwächen.\n\nVerbleibende Züge: %s

actors.hero.spells.spiritform.name=Geistform
actors.hero.spells.spiritform.short_desc=Ordnet Dreieinigkeit einem Ring oder einem Artefakt zu.
actors.hero.spells.spiritform.desc=Der Kleriker wählt einen Ring oder ein Artefakt, die er während dieses Abenteuers identifiziert hat (außer dem Heiligen Folianten), und erfüllt Dreieinigkeit mit dessen Wirkung.\n\nWenn ein Ring gewählt wird, gewährt Dreieinigkeit die Wirkung dieses Rings mit +%1$d für 20 Züge.\n\nWenn ein Artefakt gewählt wird, ahmt Dreieinigkeit die Wirkung dieses Artefakts mit +%2$d nach. Jedes Artefakt hat unterschiedliche spezifische Effekte und Rüstungsladungskosten, wenn es mit Dreieinigkeit verwendet wird.\n\nDieser Spruch ersetzt jeden anderen Geisteffekt, mit dem Dreieinigkeit derzeit erfüllt ist.
actors.hero.spells.spiritform$spiritformbuff.name=Geistform
actors.hero.spells.spiritform$spiritformbuff.desc=Die Geistform von Dreieinigkeit gewährt dir derzeit die Macht eines Gegenstands, als würdest du ihn ausgerüstet haben.\n\nBeachte, dass die Geistform keine zusätzliche Kopie eines Effekts gewähren kann, von dem du bereits profitierst.\n\nAktueller Effekt: %1$s.\n\nVerbleibende Züge: %2$s.

actors.hero.spells.smite.name=zerschlagen
actors.hero.spells.smite.short_desc=Garantiert einen Treffer mit Bonusschaden und Kraft durch Verzauberung.
actors.hero.spells.smite.desc=Der Mieterschützer durchdringt einen Nahkampfangriff mit rechtschaffener Zerstörungskraft.\n\nZusätzlich zum normalen Nahkampfschaden macht Göttliche Strafgewalt nicht behinderte Angriffe garantiert treffsicher, verleiht +300%% Verzauberungsmacht und verursacht zusätzlichen magischen Schaden von %1$d - %2$d.\n\nDer zusätzliche magische Schaden von Göttliche Strafgewalt skaliert mit der Stufe des Mieterschützers und erreicht gegen untote oder dämonische Feinde stets den maximalen Schaden.

actors.hero.spells.stasis.name=Entrückung
actors.hero.spells.stasis.short_desc=Entfernt Verbündete vorübergehend aus der Unterwelt und bewahrt sie auf.
actors.hero.spells.stasis.desc=Der Kleriker konzentriert seine Verbindung zu seinem Verbündeten auf sich selbst, wodurch dieser vorübergehend in einer Art Energiestasis im Inneren des Klerikers gefangen gehalten wird. Der Verbündete bleibt bis zu %d Züge lang erhalten, wobei alle auf ihn wirkenden positiven Effekte in der Zeit in Entrückung unberührt bleiben.\n\nDer Verbündete erscheint neben dem Kleriker, sobald die Entrückung auf natürliche Weise endet, oder er kann den Zauber sofort und kostenlos erneut wirken, um den Effekt vorzeitig zu beenden. Entrückung kann sogar unbewegliche Verbündete bewegen, sie aber nicht zwischen Ebenen transferieren.
actors.hero.spells.stasis$stasisbuff.name=Verbündeter in Entrückung
actors.hero.spells.stasis$stasisbuff.left_behind=Dein unbeweglicher Verbündeter bleibt zurück.
actors.hero.spells.stasis$stasisbuff.desc=Der Kleriker hat derzeit einen Verbündeten in Entrückung. Alle positiven Effekte dieses Verbündeten, einschließlich der Macht der Vielen, bleiben erhalten, und er erscheint nach Ablauf des Effekts wieder neben dem Kleriker. Der Effekt kann auch vorzeitig durch erneutes Wirken von Entrückung beendet werden.\n\nVerbündeter in Entrückung: %1$s.\nVerbleibende Züge: %2$s.

actors.hero.spells.sunray.name=Sonnenstrahl
actors.hero.spells.sunray.short_desc=Fügt auf Entfernung magischen Schaden zu und blendet das Ziel einmal.
actors.hero.spells.sunray.desc=Der Kleriker feuert einen blendenden Lichtstrahl auf ein Ziel, fügt ihm damit %1$d-%2$d Schaden zu und blendet es für %3$d Züge. Sonnenstrahl fügt untoten und dämonischen Zielen maximalen Schaden zu.\n\nNachdem ein Feind durch diesen Spruch getroffen wurde, passt sich sein Gesichtssinn an, so dass er nicht nochmals geblendet werden kann. Wenn er jedoch nochmals von diesem Spruch getroffen wird, während er geblendet ist, wird er durch das Licht überwältigt und wird stattdessen gelähmt.

actors.hero.spells.walloflight.name=Wand aus Licht
actors.hero.spells.walloflight.short_desc=Erschafft eine Wand, die Feinde blockiert.
actors.hero.spells.walloflight.desc=Der Mieterschützer erschafft direkt vor sich eine Wand aus massivem Licht. Sie ist 1 Feld stark und %1$d Felder breit und hält 20 Züge.\n\nDiese Wand funktioniert wie eine normale Wand, ist aber durchsichtig. Gegner, die beim Erschaffen in der Wand gefangen sind, werden kurzzeitig betäubt und nach Möglichkeit zurückgedrängt. Alle in der Wand gefangenen Gegner können sich befreien.\n\nDie Wand kann in alle vier Himmelsrichtungen oder Diagonalen gewirkt werden. Ist bereits eine Wand aktiv, kann der Zauber kostenlos erneut verwendet werden, um die Wand sofort zu beräumen.
actors.hero.spells.walloflight.early_end=Du zerstreust die Lichtwand.
actors.hero.spells.walloflight$lightwall.desc=Schimmernde Lichtpaneele versperren hier den Durchgang.

##main hero
actors.hero.hero.name=du
actors.hero.hero.leave=Du kannst noch nicht gehen: Die Brandschutztür ist zugefallen, und der Schlüssel liegt ganz unten. Nach oben geht es erst mit dem Mietvertrag.
actors.hero.hero.level_up=Level Up!
actors.hero.hero.new_level=Stufenaufstieg! +Genauigkeit, +Ausweichen, +5 LP!
actors.hero.hero.new_talent=+1 Talentpunkt!
actors.hero.hero.unspent=Du hast noch unverteilte Talentpunkte!
actors.hero.hero.level_cap=Stärker wirst du nicht mehr, aber deine Erfahrung gibt dir einen Kräfteschub! Man lernt eben nie aus.
actors.hero.hero.you_now_have=Du hast aufgenommen: %s.
actors.hero.hero.you_cant_have=Du kannst nicht mehr mitnehmen: %s.
actors.hero.hero.locked_chest=Dieser Sperrmüllberg ist angekettet und du hast keinen Schlüssel für das Schloss.
actors.hero.hero.locked_door=Du hast keinen passenden Schlüssel. Der Hausmeister hätte einen, der kommt Donnerstag.
actors.hero.hero.noticed_smth=Du bemerkst etwas.
actors.hero.hero.wait=...
actors.hero.hero.search=suchen
actors.hero.hero.search_distracted=Du kannst dich kaum konzentrieren, das Suchen ist ermüdend.
actors.hero.hero.key_distracted=Das Schloss klemmt wie jede Kellertür im Haus. Du musst es weiter versuchen.
actors.hero.hero.pain_resist=Die Schmerzen helfen dir, dem Drang nach Schlaf zu widerstehen.
actors.hero.hero.revive=Oben dreht sich dein Zweitschlüssel im Schloss, und du stehst wieder auf! Die Nachbarin aus dem Erdgeschoss hat ihn zum Glück nie zurückgegeben.

##classes
actors.hero.expatincantations.line_0=Let's circle back!
actors.hero.expatincantations.line_1=Synergy!
actors.hero.expatincantations.line_2=Per my last email!
actors.hero.expatincantations.line_3=Low-hanging fruit!
actors.hero.expatincantations.line_4=Move fast, break walls!
actors.hero.expatincantations.line_5=Quick sync?
actors.hero.expatincantations.line_6=Disrupt!
actors.hero.expatincantations.line_7=Deep dive!
actors.hero.expatincantations.line_8=Pivot!
actors.hero.expatincantations.line_9=Ship it!
actors.hero.expatincantations.line_10=Take this offline!
actors.hero.expatincantations.line_11=Scalable!

actors.hero.heroclass.warrior=Alteingesessene
actors.hero.heroclass.warrior_desc_short=Die Alteingesessene behauptet ihren Platz im Kiez und steckt dank der Abschirmung ihres _Kiez-Aufnähers_ zusätzlichen Schaden weg. Der Aufnäher lässt sich zwischen Rüstungen übertragen und _nimmt eine Verbesserung mit._ Umziehen? Ick wohn hier.
actors.hero.heroclass.warrior_desc=Die Alteingesessene hat drei Sanierungen, vier Quartierskonzepte und eine Mietpreisbremse überlebt. Ihr _Kiez-Aufnäher_ verleiht ihr einen Schub Abschirmung, wenn sie unter die Hälfte ihrer Lebenspunkte fällt. Er lässt sich zwischen Rüstungen übertragen und _nimmt eine Verbesserung mit_.\n\nSie beginnt mit einer _verbogenen Gardinenstange_, _drei Hoftauben_ (seit 1978 gefüttert), Hoodie, Sternchen-Pils und Bauchtasche.\n\nSie erkennt automatisch:\n_-_ Anmeldebescheinigungen\n_-_ Ingwer-Heilshots\n_-_ Lärmbeschwerden\n\n_Ick wohn hier:_ Rückstoß wirft sie nur halb so weit zurück wie andere.
actors.hero.heroclass.warrior_unlock=Die Alteingesessene ist von Anfang an spielbar.

actors.hero.heroclass.mage=Expat
actors.hero.heroclass.mage_desc_short=Der Expat murmelt fremdsprachige Beschwörungen und kanalisiert Magie durch seinen _magischen Selfie-Stick_, der stärker ist als ein Zauberstab. Er kann ihn _mit jedem gefundenen Zauberstab verschmelzen_. Niemand versteht den Pitch. Die Geschosse schon.
actors.hero.heroclass.mage_desc=Der Expat nennt seine Magie disruptiv, und die kaputten Wände geben ihm recht. Sein _einzigartiger magischer Selfie-Stick_ lädt deutlich schneller auf als ein Zauberstab und hat eine Ladung mehr. Er _kann mit jedem Zauberstab verschmolzen werden_, den der Expat unterwegs findet.\n\nAnfangs ist ein _Konfetti-Werfer_ darin eingebunden. Dazu kommen Hoodie, Sternchen-Pils und Bauchtasche.\n\nEr erkennt automatisch:\n_-_ Anmeldebescheinigungen\n_-_ Grillanzünder-Flaschen\n_-_ Modernisierungsbescheide\n\nSeine Beschwörung: Let's take this offline.
actors.hero.heroclass.mage_unlock=Der Expat ist von Anfang an spielbar.

actors.hero.heroclass.rogue=Tourist
actors.hero.heroclass.rogue_desc_short=Der Tourist taucht mit seinem _Poncho der Schatten_ ab, weicht Feinden aus und schlägt aus der Unsichtbarkeit zu. Außerdem _entdeckt er versteckte Haufen und Geheimnisse aus größerer Entfernung_. Er ist nur übers Wochenende hier, seit zwölf Wochenenden.
actors.hero.heroclass.rogue_desc=Der Tourist sucht das authentische Neukölln. Leider sucht es inzwischen zurück. Mit seinem _einzigartigen Poncho der Schatten_ wird er nach Belieben unsichtbar, solange der Poncho Ladung hat.\n\nEr _entdeckt versteckte Haufen und Geheimnisse_ aus größerer Entfernung.\n\nEr beginnt mit _einem Taschenmesser_, _drei Souvenir-Brieföffnern_ zum Werfen (mit Fernsehturm-Griff), Hoodie, Sternchen-Pils und Bauchtasche.\n\nEr erkennt automatisch:\n_-_ Anmeldebescheinigungen\n_-_ Tarnkappen-Limos\n_-_ Kiez-Lagepläne\n\nSeine Ausrede: Ich bin nur übers Wochenende hier.
actors.hero.heroclass.rogue_unlock=Der Tourist ist von Anfang an spielbar.

actors.hero.heroclass.huntress=Zugezogene
actors.hero.heroclass.huntress_desc_short=Die Zugezogene ist Meisterin der Wurfwaffen und hält mit ihrem _Upcycling-Bogen mit unendlich vielen Pfeilen_ Abstand. Durch hohes Gras bewegt sie sich, _ohne es zu zertrampeln_. Gekommen ist sie wegen der guten Anbindung, geblieben ist der Abstand.
actors.hero.heroclass.huntress_desc=Die Zugezogene wollte eigentlich nur einen Balkon. Jetzt erkundet sie die Unterwelt und hält Probleme mit ihrem _einzigartigen Upcycling-Bogen_ auf Distanz, der unendlich viele beschworene Pfeile verschießt.\n\nHohes Gras durchquert sie, _ohne es zu zertrampeln_.\n\nSie beginnt außerdem mit _Spülhandschuhen_, Hoodie, Sternchen-Pils und Bauchtasche.\n\nSie erkennt automatisch:\n_-_ Anmeldebescheinigungen\n_-_ Gedankenlese-Kombuchas\n_-_ Plenumsprotokolle\n\nIhr Plan: Erst mal ankommen. Seit sechs Jahren.
actors.hero.heroclass.huntress_unlock=Die Zugezogene ist von Anfang an spielbar.

actors.hero.heroclass.duelist=Zweikämpferin
actors.hero.heroclass.duelist_desc_short=Die Zweikämpferin ist eine Meisterin der Waffen, sie kann ihre Waffe dazu einsetzen, eine _besondere Waffenfähigkeit_ aufzurufen. Diese besondere Fähigkeit ist _bei jeder Waffe eine andere._
actors.hero.heroclass.duelist_desc=Die Zweikämpferin beginnt mit einem _einzigartigen Stockschirm_, dessen besondere Fähigkeit mit der Zeit wieder aufgeladen wird.\n\nJede Waffe im Spiel hat eine _eigene besondere Fähigkeit_, welche die Zweikämpferin nutzen kann.\n\nDie Zweikämpferin beginnt auch mit _zwei Zeltheringen_, einem Hoodie, einem Sternchen-Pils und einer Bauchtasche.\n\nDie Zweikämpferin identifiziert automatisch:\n_-_ Anmeldebescheinigungen\n_-_ Kraft-Wegbiere\n_-_ Ausweiskopien
actors.hero.heroclass.duelist_unlock=Um die Zweikämpferin freizuschalten, _rüste eine Waffe der Klasse 2 oder höher ohne Einbußen durch mangelnde Stärke_ aus.

actors.hero.heroclass.cleric=Kleriker
actors.hero.heroclass.cleric_desc_short=Der Kleriker ist ein göttlicher Spruchwirker, der seinen einzigartigen _heiligen Folianten_ einsetzt, um göttliche Magie zu kanalisieren. Er kann mittels der Talente _Sprüche lernen und verbessern_.
actors.hero.heroclass.cleric_desc=Der Kleriker startet mit einem _einzigartigen heiligen Folianten_, den er einsetzen kann, um verschiedene Sprüche zu wirken.\n\nDie meisten der Talente des Klerikers betreffen das Erlernen neuer oder die Verbesserung bekannter Sprüche.\n\nDer Kleriker ist anfangs mit einem _Nudelholz_, einem Hoodie, einem Sternchen-Pils und einer Bauchtasche ausgerüstet.\n\nDer Kleriker identifiziert automatisch:\n_-_ Anmeldebescheinigungen\n_-_ Reinheits-Leitungswasser\n_-_ Entfluchungsanträge
actors.hero.heroclass.cleric_unlock=Um den Kleriker freizuschalten, musst du _den Fluch auf einem beliebigen verfluchten Ausrüstungsgegenstand vollständig entfernen._

actors.hero.herosubclass.berserker=Wutbürgerin
actors.hero.herosubclass.berserker_short_desc=Die _Wutbürgerin_ baut Wut auf, wenn sie Schaden erleidet. Wut erhöht ihren Schaden, und bei 100% kann sie in Raserei verfallen und erhält dabei zusätzliche Abschirmung.
actors.hero.herosubclass.berserker_desc=Wenn die Wutbürgerin physischen Schaden erleidet, wird sie wütend, selbst wenn ihre Rüstung den Schaden abblockt! Die Wut klingt mit der Zeit ab, bei niedriger Gesundheit aber langsamer.\n\nUnter Wut verursacht die Wutbürgerin bis zu 50% mehr Schaden. Bei maximaler Wut kann sie in Raserei verfallen: Sie erhält viel Abschirmung, und ihre Wut lässt nicht nach, solange die Abschirmung hält. Die Abschirmung wächst mit der Stufe ihrer Rüstung und fällt bei niedriger Gesundheit deutlich höher aus. Nach der Raserei braucht die Wutbürgerin etwas Zeit, um sich zu erholen.\n\nIhr Leserbrief ist in Arbeit. Seit 1989.
actors.hero.herosubclass.gladiator=Kiezboxerin
actors.hero.herosubclass.gladiator_short_desc=Die _Kiezboxerin_ baut mit erfolgreichen Angriffen eine Kombi auf und setzt sie für besondere Kombi-Angriffe ein.
actors.hero.herosubclass.gladiator_desc=Die Kiezboxerin erhöht ihre Kombi um 1, wenn sie mit einer Nahkampf- oder Wurfwaffe trifft. Landet sie 5 Züge lang (15 Züge nach einem Sieg) keinen Treffer, fällt ihre Kombi vollständig auf null.\n\nMit steigender Kombi werden Kombi-Angriffe mit Treffergarantie verfügbar:\n2er Kombi: stößt den Gegner zurück, Kombi bleibt erhalten\n4er Kombi: Schaden abhängig von der Rüstung\n6er Kombi: pariert, Kombi bleibt erhalten\n8er Kombi: trifft das Ziel und Gegner in der Nähe\n10er Kombi: greift einmal pro Kombi-Stufe an
actors.hero.herosubclass.battlemage=Hands-on-Gründer
actors.hero.herosubclass.battlemage_short_desc=Der _Hands-on-Gründer_ löst Bonuseffekte aus, wenn er seinen Selfie-Stick als Nahkampfwaffe einsetzt. Die Effekte hängen vom Zauberstab ab, der mit dem Selfie-Stick verbunden ist.
actors.hero.herosubclass.battlemage_desc=Der Hands-on-Gründer packt selbst mit an: Schlägt er mit seinem Selfie-Stick im Nahkampf zu, erhält er einen Bonuseffekt, als hätte der Selfie-Stick eine zusätzliche Verzauberung. Der Effekt hängt vom eingebundenen Zauberstab ab; jeder Zauberstab hat seinen eigenen. Außerdem erhält der Selfie-Stick des Hands-on-Gründers bei jedem Schlag 0,5 Ladungen.
actors.hero.herosubclass.warlock=Growth-Hacker
actors.hero.herosubclass.warlock_short_desc=Der _Growth-Hacker_ kann Gegner mit seinen Zauberstäben als Lead markieren. Fügt er markierten Gegnern physischen Schaden zu, heilt er sich.
actors.hero.herosubclass.warlock_desc=Greift der Growth-Hacker mit einem Zauberstab an, kann er das Ziel als Lead markieren. Chance und Dauer der Lead-Markierung steigen mit der Stufe des Zauberstabs.\n\nFügt der Growth-Hacker einem markierten Gegner Schaden zu, heilt er 2 LP pro 5 Schaden, allerdings nur mit Nahkampf- oder Wurfwaffen, nicht mit Zauberstäben! Wachstum um jeden Preis, nur eben nicht seinen.
actors.hero.herosubclass.assassin=Schnappschütze
actors.hero.herosubclass.assassin_short_desc=Der _Schnappschütze_ kann, während er unsichtbar ist, den perfekten Schnappschuss vorbereiten. Je länger er wartet, desto stärker wird sein Angriff.
actors.hero.herosubclass.assassin_desc=Der Schnappschütze bereitet seinen nächsten Angriff vor, sobald er unsichtbar wird. Je länger er sich vorbereitet, desto stärker wird der Angriff. Die Vorbereitung kann bis zu 9 Züge dauern.\n\nDanach verursacht sein nächster Angriff Bonusschaden, er kann zu seinem Ziel springen und ausreichend geschwächte Gegner sofort erledigen. Das Motiv war nie besser.
actors.hero.herosubclass.freerunner=Sightseeing-Sprinter
actors.hero.herosubclass.freerunner_short_desc=Der _Sightseeing-Sprinter_ baut beim Laufen Schwung auf und kann ihn zum Freilaufen nutzen. Das gibt ihm kurzzeitig mehr Tempo und Ausweichen.
actors.hero.herosubclass.freerunner_desc=Der _Sightseeing-Sprinter_ baut beim Laufen Schwung auf: Nach 10 Zügen in Bewegung hat er bis zu 10 Schwung, verliert ihn aber schnell, wenn er stehen bleibt. Jeder Schwungpunkt ergibt 2 Züge Freilaufen.\n\nBeim Freilaufen bewegt er sich doppelt so schnell und erhält einen Ausweich-Bonus abhängig von seiner Stufe. Danach folgt eine Abklingzeit, bevor er wieder Schwung aufbauen kann. Zwölf Sehenswürdigkeiten, ein Nachmittag.
actors.hero.herosubclass.sniper=Abstandshalterin
actors.hero.herosubclass.sniper_short_desc=Die _Abstandshalterin_ durchdringt mit Fernangriffen die Rüstung ihrer Gegner. Nach einem Angriff mit einer Wurfwaffe kann sie mit einem Spezialangriff ihres Bogens nachsetzen.
actors.hero.herosubclass.sniper_desc=Die Abstandshalterin hält Distanz wie niemand sonst im Kiez; ihre Fernangriffe durchdringen gegnerische Rüstung. Trifft sie einen Gegner mit einer Wurfwaffe, markiert sie ihn und kann dann mit ihrem Bogen einen Spezialangriff ausführen. Welcher das ist, hängt von der Feineinstellung des Bogens ab.\n\nEin nicht eingestellter Bogen gibt sofort einen Schuss mit verringertem Schaden ab. Ein auf Tempo eingestellter Bogen feuert eine Salve aus drei Pfeilen mit verringertem Schaden, die trotzdem Verzauberungen auslösen können; das dauert 1 Zug. Ein auf Schaden eingestellter Bogen feuert einen Präzisionsschuss, der garantiert trifft und Bonusschaden verursacht; das dauert 2 Züge.
actors.hero.herosubclass.warden=Baumscheibenpatin
actors.hero.herosubclass.warden_short_desc=_Die Baumscheibenpatin_ sieht durch hohes Gras und erhält Bonuseffekte, wenn sie Samen pflanzt und Pflanzen zertritt.
actors.hero.herosubclass.warden_desc=Die Baumscheibenpatin hat eine Patenschaft für jedes Stück Grün im Kiez übernommen, und das Grün dankt es ihr mit Bonuseffekten rund um Gras und Pflanzen. Sie sieht durch hohes und niedergetretenes Gras, als wäre es freies Feld.\n\nUm jeden Samen, den sie wirft oder pflanzt, wächst Gras. Zertritt sie Pflanzen, erhält sie Bonuseffekte. Diese ersetzen die normalen Pflanzeneffekte, sodass ihr keine Pflanze schadet, auf die sie tritt.
actors.hero.herosubclass.champion=Nebenjobberin
actors.hero.herosubclass.champion_short_desc=Die _Nebenjobberin_ kann zwei Waffen führen und bekommt mehr Waffenladungen. Ihre normalen Angriffe erfolgen mit der Primärwaffe, aber sie kann die Waffen tauschen und die Fähigkeiten beider Waffen einsetzen.
actors.hero.herosubclass.champion_desc=Die Nebenjobberin beherrscht Nahkampfwaffen perfekt und kann zusätzlich zu ihrer Primärwaffe eine zweite Waffe ausrüsten. Ihre normalen Angriffe erfolgen mit der Primärwaffe, aber sie kann ihre Waffen augenblicklich tauschen und die Fähigkeit einer der Waffen einsetzen.\n\nSie erhält außerdem 2 maximale Ladungen der Waffenfähigkeit mehr und eine um 50% erhöhte Aufladegeschwindigkeit der Waffenfähigkeit.
actors.hero.herosubclass.monk=Hinterhof-Yogini
actors.hero.herosubclass.monk_short_desc=Die _Hinterhof-Yogini_ baut im Kampf Energie auf. Diese Energie kann in einer Reihe von einzigartigen Fähigkeiten eingesetzt werden.
actors.hero.herosubclass.monk_desc=Die Hinterhof-Yogini beherrscht die Körpertechnik perfekt. Wenn sie Feinde besiegt, gewinnt sie Energie, welche in einer Vielzahl an defensiven und technischen Fähigkeiten eingesetzt werden kann. Diese Energie nimmt mit der Zeit nicht ab, hat aber einen Maximalwert in Abhängigkeit von der Stufe der Hinterhof-Yogini.\n\n1 Energie: schnelle Faustschläge\n2 Energie: fokussiert aufs Ausweichen gegen den nächsten Angriff\n3 Energie: augenblicklich im Nahbereich springen\n4 Energie: einen Feind zurücktreten\n5 Energie: meditieren zum Löschen des Status und zur Wiederherstellung der Ladungen von Zauberstäben und Artefakten
actors.hero.herosubclass.priest=Quartiersmanager
actors.hero.herosubclass.priest_short_desc=Der _Quartiersmanager_ erhält neue, weit reichende Sprüche und eine verstärkte Version des Leitlichts.
actors.hero.herosubclass.priest_desc=Der Quartiersmanager erhält eine Vielzahl neuer und verbesserter Zauber mit Fokus auf den Fernkampf und Zusammenarbeit mit magischen Gegenständen.\n\nDer Quartiersmanager kann _Leitlicht_ einmal alle 50 Züge kostenlos wirken, erleuchtet Gegner, die direkt von seinen Zaubern getroffen werden, und kann diesen Erleuchtungs-Effekt durch Angriffe - mit manchen Artefakten, Zauberstäben und Verbündeten - entladen, um Bonus-Schaden in Höhe seiner Stufe +5 zu verursachen.\n\nDer Quartiersmanager erlernt außerdem den Zauber _Gnadenstrahl_, der die Dunkelheit vertreibt, alle sichtbaren Gegner trifft und diese kurzzeitig betäubt. Dieser Zauber erleuchtet Gegner und erfordert 2 Ladungen.
actors.hero.herosubclass.paladin=Mieterschützer
actors.hero.herosubclass.paladin_short_desc=Der _Mieterschützer_ erhält neue Zauber mit kurzer Reichweite und verstärkte Versionen der heiligen Waffe und der heiligen Wache.
actors.hero.herosubclass.paladin_desc=Der Mieterschützer erhält eine Vielzahl neuer und verbesserter Zauber, die den Nahkampf und die Synergie mit Waffen und Rüstungen betonen.\n\nDie Zauber _Heilige Waffe_ und _Heiliger Schutz_ des Mieterschützers gewähren höhere Boni, überschreiben nicht mehr bereits bestehende Verzauberungen und Glyphen und können durch das Wirken anderer Zauber verlängert werden.\n\nDer Mieterschützer erhält außerdem den Zauber _Göttliche Strafgewalt_, der einen garantierten Nahkampftreffer mit Bonusschaden und Verzauberungskraft ermöglicht.

##talents
actors.hero.talent$provokedangertracker.name=Jetzt reicht's aber
actors.hero.talent$provokedangertracker.desc=Die Alteingesessene hat gerade ihre Abschirmung verloren. Ihr nächster physischer Angriff verursacht Bonusschaden.\n\nVerbleibende Züge: %s.
actors.hero.talent$lingeringmagictracker.name=Follow-up-Call
actors.hero.talent$lingeringmagictracker.desc=Der Expat hat gerade einen Zauberstab oder seinen Selfie-Stick benutzt. Sein nächster physischer Angriff verursacht Bonusschaden.\n\nVerbleibende Züge: %s.
actors.hero.talent$followupstriketracker.name=Erst Zettel, dann Klingeln
actors.hero.talent$followupstriketracker.desc=Die Zugezogene hat gerade einen Gegner mit einer Wurfwaffe angegriffen. Der Zettel hängt, jetzt wird geklingelt: Ihr nächster Nahkampfangriff gegen dasselbe Ziel verursacht Bonusschaden.\n\nVerbleibende Züge: %s.
actors.hero.talent$patientstriketracker.name=geduldiger Schlag
actors.hero.talent$patientstriketracker.desc=Die Zweikämpferin hat einen Zug gewartet, ihr nächster Nahkampfangriff wird Bonusschaden anrichten.
actors.hero.talent$improvisedprojectilecooldown.name=Abklingzeit: Aus dem Fenster geworfen
actors.hero.talent$improvisedprojectilecooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=Abklingzeit: Baumscheibenpflege
actors.hero.talent$rejuvenatingstepscooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$seershotcooldown.name=Abklingzeit: Vorab-Besichtigung
actors.hero.talent$seershotcooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$aggressivebarriercooldown.name=Abklingzeit aggressive Barriere
actors.hero.talent$aggressivebarriercooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$liquidagilacctracker.name=flüssige Wendigkeit
actors.hero.talent$liquidagilacctracker.desc=Der nächste normale Angriff der Zweikämpferin erhält zusätzliche Genauigkeit.\n\nVerbleibende Züge: %s.
actors.hero.talent$lethalhastecooldown.name=Abklingzeit letale Eile
actors.hero.talent$lethalhastecooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$swiftequipcooldown.name=Abklingzeit rasches Ausrüsten
actors.hero.talent$swiftequipcooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$preciseassaulttracker.name=präziser Angriff
actors.hero.talent$preciseassaulttracker.desc=Der nächste normale Angriff der Zweikämpferin erhält zusätzliche Genauigkeit.\n\nVerbleibende Züge: %s.
actors.hero.talent$deadlyfollowuptracker.name=tödliches Nachtreten
actors.hero.talent$deadlyfollowuptracker.desc=Nachdem die Zweikämpferin einen Feind mit einer Wurfwaffe angegriffen hat, verursacht sie bei ihren nächsten Nahkampfangriff gegen dasselbe Ziel Bonusschaden.\n\nVerbleibende Züge: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=hingerichtet
actors.hero.talent$satiatedspellstracker.name=Schutzzauber
actors.hero.talent$satiatedspellstracker.desc=Der nächste Zauber, den der Kleriker wirkt, verleiht ihm eine geringe Menge an Abschirmung.
actors.hero.talent$searinglightcooldown.name=Sengendes Licht
actors.hero.talent$searinglightcooldown.desc=Du hast dieses Talent vor kurzem benutzt und musst warten, bevor du es erneut nutzen kannst.\n\nVerbleibende Züge: %s.

#warrior
actors.hero.talent.hearty_meal.title=Schmalzstulle
actors.hero.talent.hearty_meal.desc=Schmalz auf Schrippe, seit 1978 dasselbe Rezept.\n\n_+1:_ Essen heilt die Alteingesessene um _4 LP_, wenn sie 33% oder weniger Gesundheit hat.\n\n_+2:_ Essen heilt die Alteingesessene um _6 LP_, wenn sie 33% oder weniger Gesundheit hat.
actors.hero.talent.veterans_intuition.title=Kenn ick schon
actors.hero.talent.veterans_intuition.desc=Jede Waffe hier unten hat sie schon mal gesehen, meistens im Hausflur.\n\n_+1:_ Die Alteingesessene identifiziert Waffen _1,75x schneller_ und Rüstungen _2,5x schneller_.\n\n_+2:_ Die Alteingesessene identifiziert Waffen _2,5x schneller_ und Rüstungen, _sobald sie sie anlegt_.
actors.hero.talent.provoked_anger.title=Jetzt reicht's aber
actors.hero.talent.provoked_anger.desc=Wer ihr die Deckung nimmt, bekommt die Antwort sofort und ohne Termin.\n\n_+1:_ Wenn ein Abschirmungseffekt der Alteingesessenen durch Schaden zerstört wird, verursacht ihr nächster physischer Angriff _3 Bonusschaden_.\n\n_+2:_ Wenn ein Abschirmungseffekt der Alteingesessenen durch Schaden zerstört wird, verursacht ihr nächster physischer Angriff _5 Bonusschaden_.
actors.hero.talent.iron_will.title=Ick wohn hier
actors.hero.talent.iron_will.desc=Drei Eigentümer, zwei Sanierungen, ein Satz: Ick wohn hier.\n\n_+1:_ Die Abschirmung durch den Kiez-Aufnäher der Alteingesessenen wird _um 1_ erhöht.\n\n_+2:_ Die Abschirmung durch den Kiez-Aufnäher der Alteingesessenen wird _um 2_ erhöht.
actors.hero.talent.iron_will.meta_desc=_Wenn eine andere Figur dieses Talent erhält_, gewährt es passiv eine Version des Kiez-Aufnäher-Effekts mit höchstens 1 bzw. 2 Abschirmung.

actors.hero.talent.iron_stomach.title=Currywurstmagen
actors.hero.talent.iron_stomach.desc=Ihr Magen hat vierzig Jahre Imbissbude überstanden, da stört ein Gegner beim Essen nicht.\n\n_+1:_ Essen dauert für die Alteingesessene 1 Zug und verleiht ihr währenddessen _75% Schadensresistenz_.\n\n_+2:_ Essen dauert für die Alteingesessene 1 Zug und verleiht ihr währenddessen _100% Schadensresistenz_.
actors.hero.talent.liquid_willpower.title=Wegbier-Wille
actors.hero.talent.liquid_willpower.desc=_+1:_ Wenn die Alteingesessene einen Trank, ein Gebräu oder ein Elixier trinkt oder wirft, erhält sie _6,5% ihrer maximalen LP als Abschirmung_.\n\n_+2:_ Wenn die Alteingesessene einen Trank, ein Gebräu oder ein Elixier trinkt oder wirft, erhält sie _10% ihrer maximalen LP als Abschirmung_.\n\nDie Abschirmung verdoppelt sich bei Kraft-Wegbier, Lebenserfahrungs-Weiße oder Alchemie-Gegenständen, die aus diesen Tränken hergestellt werden müssen.\n\nBei Alchemie-Gegenständen mit größerer Ausgabemenge (z. B. Rohrbruch-Bowle) wird das Talent mit einer Chance ausgelöst, die davon abhängt, wie viele Exemplare hergestellt werden.
actors.hero.talent.runic_transference.title=Aufnäher-Umzug
actors.hero.talent.runic_transference.desc=Der Aufnäher zieht mit um, wie die Schrankwand von 1983.\n\n_+1:_ Der Kiez-Aufnäher der Alteingesessenen kann _normale Glyphen_ genauso übertragen wie eine Verbesserung.\n\n_+2:_ Der Kiez-Aufnäher der Alteingesessenen kann _normale, starke und verfluchte Glyphen_ genauso übertragen wie eine Verbesserung.\n\nDer Aufnäher kann nur Glyphen übertragen, die schon auf der Rüstung lagen, als er angebracht wurde.
actors.hero.talent.runic_transference.meta_desc=_Wenn eine andere Figur dieses Talent erhält_, schützt es stattdessen Glyphen auf deiner Rüstung davor, durch Modernisierungsbescheide entfernt zu werden. Glyphen können bei +1 erst ab Stufe 6 (statt 4) verloren gehen, bei +2 erst ab Stufe 7 (statt 4). Ab +8 gehen Glyphen weiterhin garantiert verloren.
actors.hero.talent.lethal_momentum.title=In einem Abwasch
actors.hero.talent.lethal_momentum.desc=Treppenhaus, Hof, Gegner: alles in einem Abwasch.\n\n_+1:_ Wenn die Alteingesessene einen Gegner mit einer physischen Waffe tötet, kostet dieser Schlag mit _67% Chance_ keinen Zug.\n\n_+2:_ Wenn die Alteingesessene einen Gegner mit einer physischen Waffe tötet, kostet dieser Schlag mit _100% Chance_ keinen Zug.
actors.hero.talent.improvised_projectiles.title=Aus dem Fenster geworfen
actors.hero.talent.improvised_projectiles.desc=Blumentopf, Hausschuh, Fernbedienung: Aus dem Fenster fliegt, was gerade da ist.\n\n_+1:_ Die Alteingesessene kann einen Gegner für _2 Züge_ blenden, indem sie einen beliebigen Gegenstand, der keine Wurfwaffe ist, nach ihm wirft. Abklingzeit: 50 Züge.\n\n_+2:_ Die Alteingesessene kann einen Gegner für _3 Züge_ blenden, indem sie einen beliebigen Gegenstand, der keine Wurfwaffe ist, nach ihm wirft. Abklingzeit: 50 Züge.

actors.hero.talent.hold_fast.title=Hier geh ick nich weg
actors.hero.talent.hold_fast.desc=Die Hausverwaltung hat es mit Briefen versucht, der Investor mit Geld, bewegt hat sie keiner.\n\n_+1:_ Wenn die Alteingesessene mit angebrachtem Kiez-Aufnäher wartet, erhält sie _1-2 Rüstung_ und verlangsamt den Abbau von Kombi- und Abschirmungseffekten um _50%_, bis sie sich bewegt.\n\n_+2:_ Wenn die Alteingesessene mit angebrachtem Kiez-Aufnäher wartet, erhält sie _2-4 Rüstung_ und verlangsamt den Abbau von Kombi- und Abschirmungseffekten um _75%_, bis sie sich bewegt.\n\n_+3:_ Wenn die Alteingesessene mit angebrachtem Kiez-Aufnäher wartet, erhält sie _3-6 Rüstung_ und verlangsamt den Abbau von Kombi- und Abschirmungseffekten um _100%_, bis sie sich bewegt.
actors.hero.talent.hold_fast.meta_desc=_Wenn eine andere Figur dieses Talent erhält_, braucht es keinen Kiez-Aufnäher, gewährt aber höchstens so viel Rüstung wie die Klasse deiner angelegten Rüstung plus deren Stufe.
actors.hero.talent.strongman.title=Kohlenschlepperin
actors.hero.talent.strongman.desc=Kohlen in den vierten Stock, jeden Winter bis 1998.\n\n_+1:_ Die Stärke der Alteingesessenen wird um _8% erhöht_, abgerundet.\n\n_+2:_ Die Stärke der Alteingesessenen wird um _13% erhöht_, abgerundet.\n\n_+3:_ Die Stärke der Alteingesessenen wird um _18% erhöht_, abgerundet.

actors.hero.talent.endless_rage.title=Dauerempörung
actors.hero.talent.endless_rage.desc=Ihre Empörung hat keinen Deckel, nur Nachträge.\n\n_+1:_ Die Wutbürgerin kann bis zu _116% Wut_ erreichen.\n\n_+2:_ Die Wutbürgerin kann bis zu _133% Wut_ erreichen.\n\n_+3:_ Die Wutbürgerin kann bis zu _150% Wut_ erreichen.\n\nJeder Punkt Wut über 100% erhöht die Raserei-Abschirmung um 1% und senkt die Abklingzeit um 1%, erhöht den Bonusschaden aber nicht über +50%.
actors.hero.talent.deathless_fury.title=Unkündbar
actors.hero.talent.deathless_fury.desc=Sterben kommt nicht in Frage, solange der Leserbrief nicht gedruckt ist.\n\n_+1:_ Die Raserei startet automatisch, wenn die Wutbürgerin sterben würde und ihre Wut bei 100% oder mehr liegt. Danach gilt eine Abklingzeit von _3 Heldenstufen_.\n\n_+2:_ Die Raserei startet automatisch, wenn die Wutbürgerin sterben würde und ihre Wut bei 100% oder mehr liegt. Danach gilt eine Abklingzeit von _2 Heldenstufen_.\n\n_+3:_ Die Raserei startet automatisch, wenn die Wutbürgerin sterben würde und ihre Wut bei 100% oder mehr liegt. Danach gilt eine Abklingzeit von _1 Heldenstufe_.\n\nDie Wutbürgerin stirbt trotzdem, wenn sie beim Ende der Raserei 0 LP hat.
actors.hero.talent.enraged_catalyst.title=Brandbrief
actors.hero.talent.enraged_catalyst.desc=Ein Brandbrief wirkt besser, wenn er in Großbuchstaben geschrieben ist.\n\n_+1:_ Verzauberungen und Flüche auf der Waffe der Wutbürgerin lösen umso öfter aus, je mehr Wut sie hat, bis zu _15% öfter_ bei 100% Wut.\n\n_+2:_ Verzauberungen und Flüche auf der Waffe der Wutbürgerin lösen umso öfter aus, je mehr Wut sie hat, bis zu _30% öfter_ bei 100% Wut.\n\n_+3:_ Verzauberungen und Flüche auf der Waffe der Wutbürgerin lösen umso öfter aus, je mehr Wut sie hat, bis zu _45% öfter_ bei 100% Wut.

actors.hero.talent.cleave.title=Rundumschlag
actors.hero.talent.cleave.desc=Nach einem K.o. tänzelt sie noch eine Weile weiter, wie beim Training im Vereinsheim.\n\n_+1:_ Die zusätzliche Kombi-Zeit, die die Kiezboxerin für einen Sieg erhält, steigt von 15 auf _30 Züge_.\n\n_+2:_ Die zusätzliche Kombi-Zeit, die die Kiezboxerin für einen Sieg erhält, steigt von 15 auf _45 Züge_.\n\n_+3:_ Die zusätzliche Kombi-Zeit, die die Kiezboxerin für einen Sieg erhält, steigt von 15 auf _60 Züge_.
actors.hero.talent.lethal_defense.title=Angriff ist die beste Abwehr
actors.hero.talent.lethal_defense.desc=Die beste Deckung ist ein Gegner, der nicht mehr aufsteht.\n\n_+1:_ Wenn die Kiezboxerin einen Gegner mit einem Kombi-Angriff tötet, sinkt die Abklingzeit der Abschirmung ihres Kiez-Aufnähers _um 50 Züge_.\n\n_+2:_ Wenn die Kiezboxerin einen Gegner mit einem Kombi-Angriff tötet, sinkt die Abklingzeit der Abschirmung ihres Kiez-Aufnähers _um 100 Züge_.\n\n_+3:_ Wenn die Kiezboxerin einen Gegner mit einem Kombi-Angriff tötet, sinkt die Abklingzeit der Abschirmung ihres Kiez-Aufnähers _um 150 Züge_.\n\nDurch dieses Talent kann die Abklingzeit bis auf -150 Züge sinken. Die Abschirmung ist dann nach dem Auslösen sofort wieder verfügbar.
actors.hero.talent.enhanced_combo.title=Boxverein-Kombi
actors.hero.talent.enhanced_combo.desc=Dienstags und donnerstags Training im Boxverein, seit 1987 ohne Ausfall.\n\n_+1:_ Ab einer Kombi von 7 stößt Prügel Gegner 3 Felder weit zurück, verursacht Schwindel und kann Gegner in Gruben stoßen.\n\n_+2:_ Zusätzlich zu den Vorteilen von +1 wirkt Parade ab einer Kombi von 9 gegen mehrere Angriffe.\n\n_+3:_ Zusätzlich zu den Vorteilen von +1 und +2 kann die Kiezboxerin bei Harter Schlag, Brecher und Wut bis zu Kombi/3 Felder weit springen.

actors.hero.talent.body_slam.title=Arschbombe
actors.hero.talent.body_slam.desc=Sie landet wie ein Umzugskarton voller Bücher: mit Wucht und ohne Rücksicht auf die Dielen.\n\n_+1:_ Wenn die Alteingesessene nach einem Sprung landet, erleiden alle benachbarten Gegner Schaden in Höhe von _1-4 plus 25%_ ihres Rüstungsblocks.\n\n_+2:_ Wenn die Alteingesessene nach einem Sprung landet, erleiden alle benachbarten Gegner Schaden in Höhe von _2-8 plus 50%_ ihres Rüstungsblocks.\n\n_+3:_ Wenn die Alteingesessene nach einem Sprung landet, erleiden alle benachbarten Gegner Schaden in Höhe von _3-12 plus 75%_ ihres Rüstungsblocks.\n\n_+4:_ Wenn die Alteingesessene nach einem Sprung landet, erleiden alle benachbarten Gegner Schaden in Höhe von _4-16 plus 100%_ ihres Rüstungsblocks.
actors.hero.talent.impact_wave.title=Dielenbeben
actors.hero.talent.impact_wave.desc=Unten fallen die Deckenlampen, drüben die Gegner.\n\n_+1:_ Wenn die Alteingesessene nach einem Sprung landet, werden alle benachbarten Gegner _2 Felder_ zurückgestoßen und mit _25% Chance_ 5 Züge lang verwundbar.\n\n_+2:_ Wenn die Alteingesessene nach einem Sprung landet, werden alle benachbarten Gegner _3 Felder_ zurückgestoßen und mit _50% Chance_ 5 Züge lang verwundbar.\n\n_+3:_ Wenn die Alteingesessene nach einem Sprung landet, werden alle benachbarten Gegner _4 Felder_ zurückgestoßen und mit _75% Chance_ 5 Züge lang verwundbar.\n\n_+4:_ Wenn die Alteingesessene nach einem Sprung landet, werden alle benachbarten Gegner _5 Felder_ zurückgestoßen und mit _100% Chance_ 5 Züge lang verwundbar.
actors.hero.talent.double_jump.title=Nochmal rüber
actors.hero.talent.double_jump.desc=Den Hof kennt sie auswendig, also springt sie gleich nochmal rüber.\n\n_+1:_ Springt die Alteingesessene innerhalb von 3 Zügen ein zweites Mal, kostet dieser Sprung _16% weniger_ Ladung.\n\n_+2:_ Springt die Alteingesessene innerhalb von 3 Zügen ein zweites Mal, kostet dieser Sprung _30% weniger_ Ladung.\n\n_+3:_ Springt die Alteingesessene innerhalb von 3 Zügen ein zweites Mal, kostet dieser Sprung _40% weniger_ Ladung.\n\n_+4:_ Springt die Alteingesessene innerhalb von 3 Zügen ein zweites Mal, kostet dieser Sprung _50% weniger_ Ladung.

actors.hero.talent.expanding_wave.title=Hellhörig
actors.hero.talent.expanding_wave.desc=Im Altbau hört man alles, und jetzt hören es alle.\n\n_+1:_ Die Reichweite von „Ruhe da unten!“ steigt von 5 auf _6 Felder_, der Kegel wird von 60 auf _75 Grad_ breiter.\n\n_+2:_ Die Reichweite von „Ruhe da unten!“ steigt von 5 auf _7 Felder_, der Kegel wird von 60 auf _90 Grad_ breiter.\n\n_+3:_ Die Reichweite von „Ruhe da unten!“ steigt von 5 auf _8 Felder_, der Kegel wird von 60 auf _105 Grad_ breiter.\n\n_+4:_ Die Reichweite von „Ruhe da unten!“ steigt von 5 auf _9 Felder_, der Kegel wird von 60 auf _120 Grad_ breiter.
actors.hero.talent.striking_wave.title=Klopfzeichen
actors.hero.talent.striking_wave.desc=Sie klopft, bis die Nachbarn zurückklopfen oder umfallen.\n\n_+1:_ „Ruhe da unten!“ nutzt mit _30% Chance_ auch Treffereffekte wie Verzauberungen und Kombi.\n\n_+2:_ „Ruhe da unten!“ nutzt mit _60% Chance_ auch Treffereffekte wie Verzauberungen und Kombi.\n\n_+3:_ „Ruhe da unten!“ nutzt mit _90% Chance_ auch Treffereffekte wie Verzauberungen und Kombi.\n\n_+4:_ „Ruhe da unten!“ nutzt mit _100% Chance_ auch Treffereffekte wie Verzauberungen und Kombi und verleiht Verzauberungen _+20% Kraft_.
actors.hero.talent.shock_force.title=Mit Nachdruck
actors.hero.talent.shock_force.desc=Einmal sagt sie es freundlich, danach mit Nachdruck.\n\n_+1:_ „Ruhe da unten!“ verursacht _20% mehr Schaden_ und betäubt mit _25% Chance_, statt zu verkrüppeln.\n\n_+2:_ „Ruhe da unten!“ verursacht _40% mehr Schaden_ und betäubt mit _50% Chance_, statt zu verkrüppeln.\n\n_+3:_ „Ruhe da unten!“ verursacht _60% mehr Schaden_ und betäubt mit _75% Chance_, statt zu verkrüppeln.\n\n_+4:_ „Ruhe da unten!“ verursacht _80% mehr Schaden_ und betäubt mit _100% Chance_, statt zu verkrüppeln.

actors.hero.talent.sustained_retribution.title=Nachtragend
actors.hero.talent.sustained_retribution.desc=Sie vergisst nichts, sie zahlt es in Raten zurück.\n\n_+1:_ Die Alteingesessene verursacht _115% Bonusschaden_, verteilt auf _2 Treffer_, statt 100% Bonusschaden in 1 Treffer.\n\n_+2:_ Die Alteingesessene verursacht _130% Bonusschaden_, verteilt auf _3 Treffer_, statt 100% Bonusschaden in 1 Treffer.\n\n_+3:_ Die Alteingesessene verursacht _145% Bonusschaden_, verteilt auf _4 Treffer_, statt 100% Bonusschaden in 1 Treffer.\n\n_+4:_ Die Alteingesessene verursacht _160% Bonusschaden_, verteilt auf _5 Treffer_, statt 100% Bonusschaden in 1 Treffer.
actors.hero.talent.shrug_it_off.title=Schon Schlimmeres erlebt
actors.hero.talent.shrug_it_off.desc=Sie hat schon zwei Winter ohne Heizung ausgesessen.\n\n_+1:_ Die Schadensreduktion der Alteingesessenen beim Aussitzen steigt von 50% _auf 60%_.\n\n_+2:_ Die Schadensreduktion der Alteingesessenen beim Aussitzen steigt von 50% _auf 68%_.\n\n_+3:_ Die Schadensreduktion der Alteingesessenen beim Aussitzen steigt von 50% _auf 74%_.\n\n_+4:_ Die Schadensreduktion der Alteingesessenen beim Aussitzen steigt von 50% _auf 80%_.
actors.hero.talent.even_the_odds.title=Viel Feind, viel Ehr
actors.hero.talent.even_the_odds.desc=Je mehr gegen sie sind, desto sicherer weiß sie, dass sie recht hat.\n\n_+1:_ Wenn das Aussitzen endet, verursacht die Alteingesessene für jeden Gegner im Umkreis von 2 Feldern zusätzlich _5% Bonusschaden_.\n\n_+2:_ Wenn das Aussitzen endet, verursacht die Alteingesessene für jeden Gegner im Umkreis von 2 Feldern zusätzlich _10% Bonusschaden_.\n\n_+3:_ Wenn das Aussitzen endet, verursacht die Alteingesessene für jeden Gegner im Umkreis von 2 Feldern zusätzlich _15% Bonusschaden_.\n\n_+4:_ Wenn das Aussitzen endet, verursacht die Alteingesessene für jeden Gegner im Umkreis von 2 Feldern zusätzlich _20% Bonusschaden_.

#mage
actors.hero.talent.empowering_meal.title=Power-Lunch
actors.hero.talent.empowering_meal.desc=Nach dem Power-Lunch pitcht der Selfie-Stick doppelt so überzeugend.\n\n_+1:_ Essen gewährt dem Expat bei den nächsten 3 Zauberstab-Treffern _2 Bonusschaden_.\n\n_+2:_ Essen gewährt dem Expat bei den nächsten 3 Zauberstab-Treffern _3 Bonusschaden_.
actors.hero.talent.scholars_intuition.title=Quick Learner
actors.hero.talent.scholars_intuition.desc=Jeden Zauberstab versteht er nach dem ersten Onboarding, die Mülltrennung bis heute nicht.\n\n_+1:_ Der Expat identifiziert Zauberstäbe _3x schneller_.\n\n_+2:_ Der Expat identifiziert Zauberstäbe, _sobald er sie benutzt_.
actors.hero.talent.lingering_magic.title=Follow-up-Call
actors.hero.talent.lingering_magic.desc=Nach dem Zauber kommt der Follow-up-Call, diesmal mit dem Stock.\n\n_+1:_ Wenn der Expat einen Zauberstab oder seinen Selfie-Stick einsetzt, verursacht sein nächster physischer Angriff _1-2 Bonusschaden_.\n\n_+2:_ Wenn der Expat einen Zauberstab oder seinen Selfie-Stick einsetzt, verursacht sein nächster physischer Angriff _2 Bonusschaden_.
actors.hero.talent.backup_barrier.title=Plan B
actors.hero.talent.backup_barrier.desc=Ist das Budget weg, greift Plan B: der Firmenzuschuss.\n\n_+1:_ Der Expat erhält _3 Abschirmung_, wenn er die letzte Ladung seines Selfie-Sticks verbraucht.\n\n_+2:_ Der Expat erhält _5 Abschirmung_, wenn er die letzte Ladung seines Selfie-Sticks verbraucht.
actors.hero.talent.backup_barrier.meta_desc=_Wenn eine andere Figur dieses Talent erhält_, löst stattdessen ihr Zauberstab mit der höchsten Stufe es aus.

actors.hero.talent.energizing_meal.title=Matcha-Boost
actors.hero.talent.energizing_meal.desc=Ein Schluck Matcha, und der Selfie-Stick lädt schneller als das Firmenlaptop.\n\n_+1:_ Essen dauert für den Expat 1 Zug und gewährt ihm _5 Züge Zauberstab-Aufladung_.\n\n_+2:_ Essen dauert für den Expat 1 Zug und gewährt ihm _8 Züge Zauberstab-Aufladung_.
actors.hero.talent.inscribed_power.title=Whitepaper-Power
actors.hero.talent.inscribed_power.desc=Ein Whitepaper gelesen, und schon ist er Experte.\n\n_+1:_ Wenn der Expat eine Schriftrolle liest oder einen Zauber benutzt, erhalten seine _nächsten 2 Zauberstab-Schüsse_ +2 Stufen.\n\n_+2:_ Wenn der Expat eine Schriftrolle liest oder einen Zauber benutzt, erhalten seine _nächsten 3 Zauberstab-Schüsse_ +2 Stufen.\n\nDie Zahl der verstärkten Schüsse verdoppelt sich bei Modernisierungsbescheiden, Umwidmungsanträgen oder Alchemie-Gegenständen, die aus diesen Schriftrollen hergestellt werden müssen.\n\nBei Alchemie-Gegenständen mit größerer Ausgabemenge (z. B. den meisten Zaubern) wird das Talent mit einer Chance ausgelöst, die davon abhängt, wie viele Exemplare hergestellt werden.
actors.hero.talent.wand_preservation.title=Exit-Strategie
actors.hero.talent.wand_preservation.desc=Er gibt nie etwas ganz auf, er macht einen Exit mit Rückkaufoption.\n\n_+1:_ Wenn der Expat einen neuen Zauberstab in seinen Selfie-Stick einbindet, erhält er den alten Zauberstab mit +0 zurück. _Das klappt nur einmal._\n\n_+2:_ Wenn der Expat einen neuen Zauberstab in seinen Selfie-Stick einbindet, erhält er den alten Zauberstab mit +0 zurück. _Das klappt immer wieder, mit einer Abklingzeit von einer Heldenstufe._
actors.hero.talent.wand_preservation.meta_desc=_Wenn eine andere Figur dieses Talent erhält_, bringt das Auflösen eines Zauberstabs im Alchemiekessel stattdessen 1 (bei +1) bzw. 2 (bei +2) arkanes Harz mehr.
actors.hero.talent.arcane_vision.title=Stakeholder-Radar
actors.hero.talent.arcane_vision.desc=Wen er einmal angepingt hat, den hat er auf dem Schirm.\n\n_+1:_ Wenn der Expat einen Gegner mit einem Zauberstab trifft, nimmt er ihn _10 Züge lang_ per Gedankensicht wahr.\n\n_+2:_ Wenn der Expat einen Gegner mit einem Zauberstab trifft, nimmt er ihn _15 Züge lang_ per Gedankensicht wahr.
actors.hero.talent.shield_battery.title=Burn Rate
actors.hero.talent.shield_battery.desc=Er verbrennt eigenes Kapital, um länger am Markt zu bleiben.\n\n_+1:_ Der Expat kann einen Zauberstab auf sich selbst richten und alle Ladungen in Abschirmung umwandeln, _4% der maximalen LP pro Ladung_.\n\n_+2:_ Der Expat kann einen Zauberstab auf sich selbst richten und alle Ladungen in Abschirmung umwandeln, _6% der maximalen LP pro Ladung_.

actors.hero.talent.desperate_power.title=Last-Minute-Pitch
actors.hero.talent.desperate_power.desc=Seine besten Ideen hat er fünf Minuten vor der Deadline.\n\n_+1:_ Die Zauberstäbe und der Selfie-Stick des Expats erhalten beim letzten Schuss _+1 Stufe_, wenn sie nur noch eine Ladung haben.\n\n_+2:_ Die Zauberstäbe und der Selfie-Stick des Expats erhalten beim letzten Schuss _+2 Stufen_, wenn sie nur noch eine Ladung haben.\n\n_+3:_ Die Zauberstäbe und der Selfie-Stick des Expats erhalten beim letzten Schuss _+3 Stufen_, wenn sie nur noch eine Ladung haben.
actors.hero.talent.ally_warp.title=Hot Desking
actors.hero.talent.ally_warp.desc=Feste Plätze gibt es nicht, auch nicht für Verbündete.\n\n_+1:_ Der Expat kann einen Verbündeten im Umkreis von _2 Feldern_ wählen und sofort mit ihm den Platz tauschen.\n\n_+2:_ Der Expat kann einen Verbündeten im Umkreis von _4 Feldern_ wählen und sofort mit ihm den Platz tauschen.\n\n_+3:_ Der Expat kann einen Verbündeten im Umkreis von _6 Feldern_ wählen und sofort mit ihm den Platz tauschen.\n\nMit unbeweglichen Verbündeten kann der Expat nicht tauschen.

actors.hero.talent.empowered_strike.title=Hands-on-Mentalität
actors.hero.talent.empowered_strike.desc=Nach dem Zauber packt er selbst mit an, fürs Foto.\n\n_+1:_ Der erste Nahkampfschlag des Hands-on-Gründers mit seinem Selfie-Stick nach einem Zauberstab-Schuss verursacht _+16% Schaden_, und der Bonuseffekt des Selfie-Sticks erhält _+50% Kraft_.\n\n_+2:_ Der erste Nahkampfschlag des Hands-on-Gründers mit seinem Selfie-Stick nach einem Zauberstab-Schuss verursacht _+33% Schaden_, und der Bonuseffekt des Selfie-Sticks erhält _+100% Kraft_.\n\n_+3:_ Der erste Nahkampfschlag des Hands-on-Gründers mit seinem Selfie-Stick nach einem Zauberstab-Schuss verursacht _+50% Schaden_, und der Bonuseffekt des Selfie-Sticks erhält _+150% Kraft_.
actors.hero.talent.mystical_charge.title=Synergieeffekt
actors.hero.talent.mystical_charge.desc=Jeder Schlag ist ein Synergieeffekt, so steht es im Quartalsbericht.\n\n_+1:_ Schläge mit dem Selfie-Stick gewähren dem Hands-on-Gründer _0,5 Züge_ Artefakt-Aufladung.\n\n_+2:_ Schläge mit dem Selfie-Stick gewähren dem Hands-on-Gründer _1 Zug_ Artefakt-Aufladung.\n\n_+3:_ Schläge mit dem Selfie-Stick gewähren dem Hands-on-Gründer _1,5 Züge_ Artefakt-Aufladung.
actors.hero.talent.excess_charge.title=Überliquidität
actors.hero.talent.excess_charge.desc=Überschüssiges Kapital schichtet er sofort in Sicherheit um.\n\n_+1:_ Schießt der Hands-on-Gründer mit voll geladenem Selfie-Stick, erhält er _0,67 Abschirmung_ pro Stufe des Selfie-Sticks.\n\n_+2:_ Schießt der Hands-on-Gründer mit voll geladenem Selfie-Stick, erhält er _1,33 Abschirmung_ pro Stufe des Selfie-Sticks.\n\n_+3:_ Schießt der Hands-on-Gründer mit voll geladenem Selfie-Stick, erhält er _2 Abschirmung_ pro Stufe des Selfie-Sticks.

actors.hero.talent.soul_siphon.title=Crowdfunding
actors.hero.talent.soul_siphon.desc=Andere schlagen zu, er kassiert mit.\n\n_+1:_ Physischer Schaden durch andere Figuren löst die Lead-Markierung des Growth-Hackers mit _13% Wirkung_ aus.\n\n_+2:_ Physischer Schaden durch andere Figuren löst die Lead-Markierung des Growth-Hackers mit _27% Wirkung_ aus.\n\n_+3:_ Physischer Schaden durch andere Figuren löst die Lead-Markierung des Growth-Hackers mit _40% Wirkung_ aus.
actors.hero.talent.soul_eater.title=Free Lunch
actors.hero.talent.soul_eater.desc=Es gibt kein Free Lunch, außer man lässt andere bezahlen.\n\n_+1:_ Die Lead-Markierung gewährt _0,33 Züge_ Sättigung pro verursachtem physischem Schaden. Als Lead markierte Gegner lösen bei ihrem Tod mit _10% Chance_ Essens-Effekte aus.\n\n_+2:_ Die Lead-Markierung gewährt _0,67 Züge_ Sättigung pro verursachtem physischem Schaden. Als Lead markierte Gegner lösen bei ihrem Tod mit _20% Chance_ Essens-Effekte aus.\n\n_+3:_ Die Lead-Markierung gewährt _1 Zug_ Sättigung pro verursachtem physischem Schaden. Als Lead markierte Gegner lösen bei ihrem Tod mit _30% Chance_ Essens-Effekte aus.
actors.hero.talent.necromancers_minions.title=Unbezahlte Praktikanten
actors.hero.talent.necromancers_minions.desc=Bezahlt werden sie in Sichtbarkeit.\n\n_+1:_ Stirbt ein als Lead markierter Gegner, erweckt der Growth-Hacker ihn mit _13% Chance_ als verderbten Geist, der für ihn kämpft.\n\n_+2:_ Stirbt ein als Lead markierter Gegner, erweckt der Growth-Hacker ihn mit _27% Chance_ als verderbten Geist, der für ihn kämpft.\n\n_+3:_ Stirbt ein als Lead markierter Gegner, erweckt der Growth-Hacker ihn mit _40% Chance_ als verderbten Geist, der für ihn kämpft.

actors.hero.talent.blast_radius.title=Skalieren
actors.hero.talent.blast_radius.desc=Was in einem Kiez funktioniert, funktioniert in jedem, glaubt er.\n\n_+1:_ Der Radius der Disruption steigt von 4 auf _5 Felder_.\n\n_+2:_ Der Radius der Disruption steigt von 4 auf _6 Felder_.\n\n_+3:_ Der Radius der Disruption steigt von 4 auf _7 Felder_.\n\n_+4:_ Der Radius der Disruption steigt von 4 auf _8 Felder_.
actors.hero.talent.elemental_power.title=Mehr Impact
actors.hero.talent.elemental_power.desc=Mehr Impact, gemessen in Wandschäden.\n\n_+1:_ Die Kraft der Disruption steigt um _25%_.\n\n_+2:_ Die Kraft der Disruption steigt um _50%_.\n\n_+3:_ Die Kraft der Disruption steigt um _75%_.\n\n_+4:_ Die Kraft der Disruption steigt um _100%_.
actors.hero.talent.reactive_barrier.title=Netzwerk-Schild
actors.hero.talent.reactive_barrier.desc=Wen er trifft, der ist jetzt Teil seines Netzwerks.\n\n_+1:_ Der Expat erhält _2,5 Abschirmung_ für jede von der Disruption getroffene Figur, höchstens für 5 Figuren.\n\n_+2:_ Der Expat erhält _5 Abschirmung_ für jede von der Disruption getroffene Figur, höchstens für 6 Figuren.\n\n_+3:_ Der Expat erhält _7,5 Abschirmung_ für jede von der Disruption getroffene Figur, höchstens für 7 Figuren.\n\n_+4:_ Der Expat erhält _10 Abschirmung_ für jede von der Disruption getroffene Figur, höchstens für 8 Figuren.

actors.hero.talent.wild_power.title=Out of the Box
actors.hero.talent.wild_power.desc=Keine Idee ist zu schlecht, wenn man sie laut genug präsentiert.\n\n_+1:_ Beim Brainstorming werden Zauberstäbe um _2 oder 3 Stufen verstärkt, bis höchstens +4_.\n\n_+2:_ Beim Brainstorming werden Zauberstäbe um _3 Stufen verstärkt, bis höchstens +5_.\n\n_+3:_ Beim Brainstorming werden Zauberstäbe um _3 oder 4 Stufen verstärkt, bis höchstens +6_.\n\n_+4:_ Beim Brainstorming werden Zauberstäbe um _4 Stufen verstärkt, bis höchstens +7_.
actors.hero.talent.fire_everything.title=Alle Ideen raus
actors.hero.talent.fire_everything.desc=Alle Ideen auf einmal, keine davon priorisiert.\n\n_+1:_ Brainstorming feuert _5_ statt 4 Mal, und jeder Zauberstab kann mit 25% Chance bis zu 3 Mal verwendet werden.\n\n_+2:_ Brainstorming feuert _6_ statt 4 Mal, und jeder Zauberstab kann mit 50% Chance bis zu 3 Mal verwendet werden.\n\n_+3:_ Brainstorming feuert _7_ statt 4 Mal, und jeder Zauberstab kann mit 75% Chance bis zu 3 Mal verwendet werden.\n\n_+4:_ Brainstorming feuert _8_ statt 4 Mal, und jeder Zauberstab kann mit 100% Chance bis zu 3 Mal verwendet werden.
actors.hero.talent.conserved_magic.title=Lean Startup
actors.hero.talent.conserved_magic.desc=Weniger Ressourcen, gleicher Output, den Rest regelt der Pitch.\n\n_+1:_ Jeder Brainstorming-Schuss verbraucht _0,33 Ladungen_ statt 0,5, und Brainstorming kostet mit _25% Chance_ keinen Zug.\n\n_+2:_ Jeder Brainstorming-Schuss verbraucht _0,225 Ladungen_ statt 0,5, und Brainstorming kostet mit _50% Chance_ keinen Zug.\n\n_+3:_ Jeder Brainstorming-Schuss verbraucht _0,15 Ladungen_ statt 0,5, und Brainstorming kostet mit _75% Chance_ keinen Zug.\n\n_+4:_ Jeder Brainstorming-Schuss verbraucht _0,1 Ladungen_ statt 0,5, und Brainstorming kostet mit _100% Chance_ keinen Zug.

actors.hero.talent.telefrag.title=Disruptiver Markteintritt
actors.hero.talent.telefrag.desc=Er betritt den Markt genau da, wo schon jemand steht.\n\n_+1:_ Teleportiert sich der Expat in eine andere Figur hinein, fügt er ihr _10-15 Schaden_ zu und erleidet selbst _5 Schaden_.\n\n_+2:_ Teleportiert sich der Expat in eine andere Figur hinein, fügt er ihr _20-30 Schaden_ zu und erleidet selbst _10 Schaden_.\n\n_+3:_ Teleportiert sich der Expat in eine andere Figur hinein, fügt er ihr _30-45 Schaden_ zu und erleidet selbst _15 Schaden_.\n\n_+4:_ Teleportiert sich der Expat in eine andere Figur hinein, fügt er ihr _40-60 Schaden_ zu und erleidet selbst _20 Schaden_.\n\nDieses Talent kann den Helden nicht töten, und Effekte, die gegen Magie schützen, verringern den Selbstschaden.
actors.hero.talent.remote_beacon.title=Remote First
actors.hero.talent.remote_beacon.desc=Homeoffice ist da, wo das WLAN hinreicht.\n\n_+1:_ Der Expat kann seinen Homeoffice-Anker an einem beliebigen Ort im Umkreis von _4 Feldern_ setzen.\n\n_+2:_ Der Expat kann seinen Homeoffice-Anker an einem beliebigen Ort im Umkreis von _8 Feldern_ setzen.\n\n_+3:_ Der Expat kann seinen Homeoffice-Anker an einem beliebigen Ort im Umkreis von _12 Feldern_ setzen.\n\n_+4:_ Der Expat kann seinen Homeoffice-Anker an einem beliebigen Ort im Umkreis von _16 Feldern_ setzen.\n\nAn unerreichbaren Orten kann der Expat keinen Anker setzen.
actors.hero.talent.longrange_warp.title=Standortwechsel
actors.hero.talent.longrange_warp.desc=Heute Neukölln, morgen Lissabon, übermorgen eine Ebene tiefer.\n\n_+1:_ Der Expat kann sich jetzt für _150% der Ladungskosten_ zwischen Ebenen teleportieren.\n\n_+2:_ Der Expat kann sich jetzt für _117% der Ladungskosten_ zwischen Ebenen teleportieren.\n\n_+3:_ Der Expat kann sich jetzt für _83% der Ladungskosten_ zwischen Ebenen teleportieren.\n\n_+4:_ Der Expat kann sich jetzt für _50% der Ladungskosten_ zwischen Ebenen teleportieren.\n\nAus einer verriegelten Ebene kann sich der Expat so nicht wegteleportieren.

#rogue
actors.hero.talent.cached_rations.title=Frühstück to go
actors.hero.talent.cached_rations.desc=Vom Frühstücksbuffet des Hostels, in Servietten gewickelt, für später.\n\n_+1:_ Der Tourist findet in den nächsten Ebenen _2 Hostel-Lunchpakete_ in Sperrmüllbergen.\n\n_+2:_ Der Tourist findet in den nächsten Ebenen _3 Hostel-Lunchpakete_ in Sperrmüllbergen.\n\nHostel-Lunchpakete sind schnell gegessen, sättigen mäßig, heilen 5 LP und laden den Poncho der Schatten um 1 auf.
actors.hero.talent.thiefs_intuition.title=Souvenirblick
actors.hero.talent.thiefs_intuition.desc=Er erkennt sofort, welcher Ring echt ist und welcher vom Flohmarkt am Kanal.\n\n_+1:_ Der Tourist identifiziert Ringe _2x schneller_ und erkennt die Sorte eines Rings, _sobald er ihn anlegt_.\n\n_+2:_ Der Tourist identifiziert Ringe, _sobald er sie anlegt_, und erkennt die Sorte eines Rings, _sobald er ihn aufhebt_.
actors.hero.talent.sucker_punch.title=Überraschungsbesuch
actors.hero.talent.sucker_punch.desc=Niemand rechnet mit dem Mann mit dem Stadtplan.\n\n_+1:_ Der Tourist verursacht _1-2 Bonusschaden_, wenn er einen Gegner zum ersten Mal überraschend angreift.\n\n_+2:_ Der Tourist verursacht _2 Bonusschaden_, wenn er einen Gegner zum ersten Mal überraschend angreift.
actors.hero.talent.protective_shadows.title=Im Schatten der Reisegruppe
actors.hero.talent.protective_shadows.desc=In der Reisegruppe fällt keiner auf, nur der Rollkoffer.\n\n_+1:_ Der Tourist erhält _jeden zweiten Zug_, in dem er unsichtbar ist, 1 Abschirmung, _bis höchstens 3_.\n\n_+2:_ Der Tourist erhält _jeden Zug_, in dem er unsichtbar ist, 1 Abschirmung, _bis höchstens 5_.

actors.hero.talent.mystical_meal.title=Streetfood-Magie
actors.hero.talent.mystical_meal.desc=Streetfood um drei Uhr nachts lädt mehr auf als jede Steckdose im Hostel.\n\n_+1:_ Essen dauert für den Touristen 1 Zug (Hostel-Lunchpakete isst er sofort) und gewährt ihm _3 Züge Artefakt-Aufladung_.\n\n_+2:_ Essen dauert für den Touristen 1 Zug (Hostel-Lunchpakete isst er sofort) und gewährt ihm _5 Züge Artefakt-Aufladung_.\n\nMit diesem Talent kann sich die Foodsharing-Tüte nicht selbst aufladen.
actors.hero.talent.inscribed_stealth.title=Reiseführer-Tarnung
actors.hero.talent.inscribed_stealth.desc=Wer in den Reiseführer starrt, wird von allen übersehen.\n\n_+1:_ Der Tourist wird _3 Züge_ lang unsichtbar, nachdem er eine Schriftrolle gelesen oder einen Zauber benutzt hat.\n\n_+2:_ Der Tourist wird _5 Züge_ lang unsichtbar, nachdem er eine Schriftrolle gelesen oder einen Zauber benutzt hat.\n\nDie Dauer verdoppelt sich bei Modernisierungsbescheiden, Umwidmungsanträgen oder Alchemie-Gegenständen, die aus diesen Schriftrollen hergestellt werden müssen.\n\nBei Alchemie-Gegenständen mit größerer Ausgabemenge (z. B. den meisten Zaubern) wird das Talent mit einer Chance ausgelöst, die davon abhängt, wie viele Exemplare hergestellt werden.
actors.hero.talent.wide_search.title=Weitwinkel
actors.hero.talent.wide_search.desc=Mit Weitwinkel passt der ganze Hinterhof aufs Foto, samt Geheimtür.\n\n_+1:_ Der Suchbereich des Touristen wächst von einem 5x5-Quadrat auf einen _7x7-Kreis_.\n\n_+2:_ Der Suchbereich des Touristen wächst von einem 5x5-Quadrat auf ein _7x7-Quadrat_.
actors.hero.talent.wide_search.meta_desc=_Wenn eine andere Figur dieses Talent erhält_, wächst ihr Suchbereich stattdessen von einem 3x3-Quadrat auf einen 5x5-Kreis bei +1 bzw. ein 5x5-Quadrat bei +2.
actors.hero.talent.silent_steps.title=Flüsterrollkoffer
actors.hero.talent.silent_steps.desc=Der Rollkoffer hat neue Rollen, und der Hinterhof schläft endlich durch.\n\n_+1:_ Der Tourist weckt keine schlafenden Gegner, solange er _3 oder mehr Felder entfernt_ ist.\n\n_+2:_ Der Tourist weckt keine schlafenden Gegner, solange er _nicht direkt neben ihnen_ steht.
actors.hero.talent.rogues_foresight.title=Geheimtipp
actors.hero.talent.rogues_foresight.desc=Einen Geheimtipp riecht er, bevor er im Blog steht.\n\n_+1:_ Betritt der Tourist eine Ebene mit einem geheimen Raum, bemerkt er mit _75% Chance_, dass die Ebene ein Geheimnis birgt.\n\n_+2:_ Betritt der Tourist eine Ebene mit einem geheimen Raum, bemerkt er mit _100% Chance_, dass die Ebene ein Geheimnis birgt.

actors.hero.talent.light_cloak.title=Poncho in der Bauchtasche
actors.hero.talent.light_cloak.desc=Der Poncho passt zusammengefaltet in die Bauchtasche, wie alles Wichtige.\n\n_+1:_ Der Tourist kann seinen Poncho der Schatten auch unangelegt benutzen. Unangelegt lädt er sich aber nur mit _25% Geschwindigkeit_ auf.\n\n_+2:_ Der Tourist kann seinen Poncho der Schatten auch unangelegt benutzen. Unangelegt lädt er sich aber nur mit _50% Geschwindigkeit_ auf.\n\n_+3:_ Der Tourist kann seinen Poncho der Schatten auch unangelegt benutzen. Unangelegt lädt er sich aber nur mit _75% Geschwindigkeit_ auf.
actors.hero.talent.light_cloak.meta_desc=_Wenn eine andere Figur dieses Talent erhält_, laden sich stattdessen alle Artefakte bei +1/+2/+3 um 7/13/20% schneller auf.
actors.hero.talent.enhanced_rings.title=Souvenir-Boost
actors.hero.talent.enhanced_rings.desc=Nach jedem Souvenir fühlt sich der ganze Schmuck echter an.\n\n_+1:_ Benutzt der Tourist ein Artefakt, erhalten seine Ringe _3 Züge_ lang +1 Stufe.\n\n_+2:_ Benutzt der Tourist ein Artefakt, erhalten seine Ringe _6 Züge_ lang +1 Stufe.\n\n_+3:_ Benutzt der Tourist ein Artefakt, erhalten seine Ringe _9 Züge_ lang +1 Stufe.

actors.hero.talent.enhanced_lethality.title=Der perfekte Moment
actors.hero.talent.enhanced_lethality.desc=Der perfekte Moment kommt nur einmal, und die Kamera ist schon oben.\n\n_+1:_ Der Schnappschütze erledigt Gegner schon unter _4/13/27/67% Gesundheit_ je Vorbereitungsstufe sofort, statt unter 3/10/20/50%.\n\n_+2:_ Der Schnappschütze erledigt Gegner schon unter _5/17/33/83% Gesundheit_ je Vorbereitungsstufe sofort, statt unter 3/10/20/50%.\n\n_+3:_ Der Schnappschütze erledigt Gegner schon unter _6/20/40/100% Gesundheit_ je Vorbereitungsstufe sofort, statt unter 3/10/20/50%.
actors.hero.talent.assassins_reach.title=Zoomobjektiv
actors.hero.talent.assassins_reach.desc=Mit Zoom ist jedes Motiv näher, als es denkt.\n\n_+1:_ Die Teleport-Reichweite des Schnappschützen je Vorbereitungsstufe steigt von 1/2/3/4 auf _1/3/4/6 Felder_.\n\n_+2:_ Die Teleport-Reichweite des Schnappschützen je Vorbereitungsstufe steigt von 1/2/3/4 auf _2/4/6/8 Felder_.\n\n_+3:_ Die Teleport-Reichweite des Schnappschützen je Vorbereitungsstufe steigt von 1/2/3/4 auf _2/5/7/10 Felder_.\n\nDer Teleport führt durch Gefahren und Gegner, aber nicht durch festes Gelände wie Wände.
actors.hero.talent.bounty_hunter.title=Souvenirjäger
actors.hero.talent.bounty_hunter.desc=Kein Trip ohne Andenken, auch nicht dieser.\n\n_+1:_ Tötet der Schnappschütze einen Gegner mit einem vorbereiteten Angriff, steigt die Chance, dass der Gegner etwas fallen lässt, um _2/4/8/16%_ je Vorbereitungsstufe.\n\n_+2:_ Tötet der Schnappschütze einen Gegner mit einem vorbereiteten Angriff, steigt die Chance, dass der Gegner etwas fallen lässt, um _4/8/16/32%_ je Vorbereitungsstufe.\n\n_+3:_ Tötet der Schnappschütze einen Gegner mit einem vorbereiteten Angriff, steigt die Chance, dass der Gegner etwas fallen lässt, um _6/12/24/48%_ je Vorbereitungsstufe.

actors.hero.talent.evasive_armor.title=Leichtes Gepäck
actors.hero.talent.evasive_armor.desc=Wer nur Handgepäck hat, erwischt jeden Anschluss.\n\n_+1:_ Beim Freilaufen erhält der Sightseeing-Sprinter zusätzlich _+1 Ausweichen_ pro Stärkepunkt, den er über der Anforderung seiner Rüstung hat.\n\n_+2:_ Beim Freilaufen erhält der Sightseeing-Sprinter zusätzlich _+2 Ausweichen_ pro Stärkepunkt, den er über der Anforderung seiner Rüstung hat.\n\n_+3:_ Beim Freilaufen erhält der Sightseeing-Sprinter zusätzlich _+3 Ausweichen_ pro Stärkepunkt, den er über der Anforderung seiner Rüstung hat.
actors.hero.talent.projectile_momentum.title=Schnappschuss im Laufen
actors.hero.talent.projectile_momentum.desc=Aus dem Lauf geknipst und trotzdem scharf.\n\n_+1:_ Beim Freilaufen erhält der Sightseeing-Sprinter mit Wurfwaffen _+50% Genauigkeit und +15% Schaden_.\n\n_+2:_ Beim Freilaufen erhält der Sightseeing-Sprinter mit Wurfwaffen _+100% Genauigkeit und +30% Schaden_.\n\n_+3:_ Beim Freilaufen erhält der Sightseeing-Sprinter mit Wurfwaffen _+150% Genauigkeit und +45% Schaden_.
actors.hero.talent.speedy_stealth.title=Unauffällig eilig
actors.hero.talent.speedy_stealth.desc=Unsichtbar und in Eile, wie jede Reisegruppe auf dem Weg zum Frühstück.\n\n_+1:_ Der Sightseeing-Sprinter erhält 2 Schwung pro Zug, solange er unsichtbar ist.\n\n_+2:_ Zusätzlich zu den Vorteilen von +1 läuft das Freilaufen nicht ab, solange der Sightseeing-Sprinter unsichtbar ist.\n\n_+3:_ Zusätzlich zu den Vorteilen von +1 und +2 bewegt sich der Sightseeing-Sprinter unsichtbar mit doppelter Geschwindigkeit, egal ob er gerade freiläuft oder nicht.

actors.hero.talent.hasty_retreat.title=Anschlussverbindung
actors.hero.talent.hasty_retreat.desc=Nach dem Blitz gleich weiter, der nächste Programmpunkt wartet.\n\n_+1:_ Nach dem Blitzlicht-Teleport erhält der Tourist _1 Zug_ Eile und Unsichtbarkeit.\n\n_+2:_ Nach dem Blitzlicht-Teleport erhält der Tourist _2 Züge_ Eile und Unsichtbarkeit.\n\n_+3:_ Nach dem Blitzlicht-Teleport erhält der Tourist _3 Züge_ Eile und Unsichtbarkeit.\n\n_+4:_ Nach dem Blitzlicht-Teleport erhält der Tourist _4 Züge_ Eile und Unsichtbarkeit.
actors.hero.talent.body_replacement.title=Pappaufsteller
actors.hero.talent.body_replacement.desc=Der Pappaufsteller überzeugt mehr als das Original.\n\n_+1:_ Nach dem Blitzlicht-Teleport lässt der Tourist einen Pappaufsteller mit _20 LP und 1-3 Rüstung_ zurück.\n\n_+2:_ Nach dem Blitzlicht-Teleport lässt der Tourist einen Pappaufsteller mit _40 LP und 2-6 Rüstung_ zurück.\n\n_+3:_ Nach dem Blitzlicht-Teleport lässt der Tourist einen Pappaufsteller mit _60 LP und 3-9 Rüstung_ zurück.\n\n_+4:_ Nach dem Blitzlicht-Teleport lässt der Tourist einen Pappaufsteller mit _80 LP und 4-12 Rüstung_ zurück.\n\nEs kann immer nur ein Pappaufsteller gleichzeitig stehen.
actors.hero.talent.shadow_step.title=Diskreter Blitz
actors.hero.talent.shadow_step.desc=Blitz, Tourist weg, niemand hat etwas gesehen.\n\n_+1:_ Setzt der Tourist Blitzlicht ein, während er unsichtbar ist, wirkt es sofort und kostet _16% weniger_ Ladung, blendet aber keine Gegner und löst keine anderen Talente aus.\n\n_+2:_ Setzt der Tourist Blitzlicht ein, während er unsichtbar ist, wirkt es sofort und kostet _30% weniger_ Ladung, blendet aber keine Gegner und löst keine anderen Talente aus.\n\n_+3:_ Setzt der Tourist Blitzlicht ein, während er unsichtbar ist, wirkt es sofort und kostet _41% weniger_ Ladung, blendet aber keine Gegner und löst keine anderen Talente aus.\n\n_+4:_ Setzt der Tourist Blitzlicht ein, während er unsichtbar ist, wirkt es sofort und kostet _50% weniger_ Ladung, blendet aber keine Gegner und löst keine anderen Talente aus.

actors.hero.talent.fear_the_reaper.title=Gruselführung
actors.hero.talent.fear_the_reaper.desc=Die Gruselführung beginnt da, wo der rote Pin steckt.\n\n_+1:_ Erreichen mit rotem Pin markierte Gegner 0 LP, werden sie _verkrüppelt_.\n\n_+2:_ Erreichen mit rotem Pin markierte Gegner 0 LP, werden sie _verängstigt und verkrüppelt_.\n\n_+3:_ Erreichen mit rotem Pin markierte Gegner 0 LP, werden sie _verängstigt und verkrüppelt_, und Gegner im Umkreis von 3 Feldern werden _verkrüppelt_.\n\n_+4:_ Erreichen mit rotem Pin markierte Gegner 0 LP, werden sie _verängstigt und verkrüppelt_, und Gegner im Umkreis von 3 Feldern werden _verängstigt und verkrüppelt_.
actors.hero.talent.deathly_durability.title=Andenken
actors.hero.talent.deathly_durability.desc=Von jeder Sehenswürdigkeit nimmt er etwas mit.\n\n_+1:_ Gegner, die durch den roten Pin sterben, geben dem Touristen Abschirmung in Höhe von _13%_ der LP, die sie beim Markieren hatten.\n\n_+2:_ Gegner, die durch den roten Pin sterben, geben dem Touristen Abschirmung in Höhe von _25%_ der LP, die sie beim Markieren hatten.\n\n_+3:_ Gegner, die durch den roten Pin sterben, geben dem Touristen Abschirmung in Höhe von _38%_ der LP, die sie beim Markieren hatten.\n\n_+4:_ Gegner, die durch den roten Pin sterben, geben dem Touristen Abschirmung in Höhe von _50%_ der LP, die sie beim Markieren hatten.
actors.hero.talent.double_mark.title=Zweiter Pin
actors.hero.talent.double_mark.desc=Zwei Pins auf der Karte, und der Tagesplan steht.\n\n_+1:_ Ein zweites Ziel, das gleichzeitig mit dem ersten markiert wird, kostet _30% weniger_ Ladung.\n\n_+2:_ Ein zweites Ziel, das gleichzeitig mit dem ersten markiert wird, kostet _50% weniger_ Ladung.\n\n_+3:_ Ein zweites Ziel, das gleichzeitig mit dem ersten markiert wird, kostet _65% weniger_ Ladung.\n\n_+4:_ Ein zweites Ziel, das gleichzeitig mit dem ersten markiert wird, kostet _75% weniger_ Ladung.

actors.hero.talent.shadow_blade.title=Gleiches Taschenmesser
actors.hero.talent.shadow_blade.desc=Der Partnerlook reicht bis zum Taschenmesser.\n\n_+1:_ Der Doppelgänger im Partnerlook erhält _8%_ des Heldenschadens pro Zug und nutzt mit _25% Chance_ die Verzauberung der Heldenwaffe.\n\n_+2:_ Der Doppelgänger im Partnerlook erhält _16%_ des Heldenschadens pro Zug und nutzt mit _50% Chance_ die Verzauberung der Heldenwaffe.\n\n_+3:_ Der Doppelgänger im Partnerlook erhält _24%_ des Heldenschadens pro Zug und nutzt mit _75% Chance_ die Verzauberung der Heldenwaffe.\n\n_+4:_ Der Doppelgänger im Partnerlook erhält _32%_ des Heldenschadens pro Zug und nutzt mit _100% Chance_ die Verzauberung der Heldenwaffe.
actors.hero.talent.cloned_armor.title=Gleicher Poncho
actors.hero.talent.cloned_armor.desc=Im Partnerlook gibt es keinen halben Poncho.\n\n_+1:_ Der Doppelgänger im Partnerlook erhält _12%_ des Rüstungswerts des Helden und nutzt mit _25% Chance_ die Glyphe der Heldenrüstung.\n\n_+2:_ Der Doppelgänger im Partnerlook erhält _24%_ des Rüstungswerts des Helden und nutzt mit _50% Chance_ die Glyphe der Heldenrüstung.\n\n_+3:_ Der Doppelgänger im Partnerlook erhält _36%_ des Rüstungswerts des Helden und nutzt mit _75% Chance_ die Glyphe der Heldenrüstung.\n\n_+4:_ Der Doppelgänger im Partnerlook erhält _48%_ des Rüstungswerts des Helden und nutzt mit _100% Chance_ die Glyphe der Heldenrüstung.
actors.hero.talent.perfect_copy.title=Perfekter Partnerlook
actors.hero.talent.perfect_copy.desc=So perfekt, dass die Ferienwohnung beide für Mieter hält.\n\n_+1:_ Der Doppelgänger im Partnerlook erhält _10%_ der maximalen LP des Helden und kann bis zu _1 Feld_ Entfernung sofort mit dem Helden den Platz tauschen.\n\n_+2:_ Der Doppelgänger im Partnerlook erhält _20%_ der maximalen LP des Helden und kann bis zu _2 Felder_ Entfernung sofort mit dem Helden den Platz tauschen.\n\n_+3:_ Der Doppelgänger im Partnerlook erhält _30%_ der maximalen LP des Helden und kann bis zu _3 Felder_ Entfernung sofort mit dem Helden den Platz tauschen.\n\n_+4:_ Der Doppelgänger im Partnerlook erhält _40%_ der maximalen LP des Helden und kann bis zu _4 Felder_ Entfernung sofort mit dem Helden den Platz tauschen.

#huntress
actors.hero.talent.natures_bounty.title=Bahndamm-Beeren
actors.hero.talent.natures_bounty.desc=Am Bahndamm wächst mehr als im Hochbeet, das weiß sie nach sechs Jahren.\n\n_+1:_ Die Zugezogene findet in den nächsten Ebenen _4 Beeren_, versteckt im hohen Gras.\n\n_+2:_ Die Zugezogene findet in den nächsten Ebenen _6 Beeren_, versteckt im hohen Gras.\n\nBeeren sind schnell gegessen, sättigen ein wenig und können einen brauchbaren Samen enthalten.
actors.hero.talent.survivalists_intuition.title=Flohmarktblick
actors.hero.talent.survivalists_intuition.desc=Auf dem Flohmarkt erkennt sie Qualität auf den ersten Blick.\n\n_+1:_ Die Zugezogene identifiziert Wurfwaffen _3x schneller_.\n\n_+2:_ Die Zugezogene identifiziert Wurfwaffen, _sobald sie damit trifft_.
actors.hero.talent.followup_strike.title=Erst Zettel, dann Klingeln
actors.hero.talent.followup_strike.desc=Erst der Zettel im Treppenhaus, dann das persönliche Gespräch an der Wohnungstür.\n\n_+1:_ Trifft die Zugezogene einen Gegner mit ihrem Bogen oder einer Wurfwaffe, verursacht ihr nächster Nahkampfangriff gegen diesen Gegner _2 Bonusschaden_.\n\n_+2:_ Trifft die Zugezogene einen Gegner mit ihrem Bogen oder einer Wurfwaffe, verursacht ihr nächster Nahkampfangriff gegen diesen Gegner _3 Bonusschaden_.
actors.hero.talent.natures_aid.title=Balkongrün
actors.hero.talent.natures_aid.desc=Jede Pflanze in Sichtweite ist irgendwie ihre, sagt sie im Plenum.\n\n_+1:_ Löst in ihrem Sichtfeld eine Pflanze ihren Effekt aus, erhält die Zugezogene 0-2 Rindenhaut-Rüstung, die alle _3 Züge_ nachlässt.\n\n_+2:_ Löst in ihrem Sichtfeld eine Pflanze ihren Effekt aus, erhält die Zugezogene 0-2 Rindenhaut-Rüstung, die alle _5 Züge_ nachlässt.

actors.hero.talent.invigorating_meal.title=Smoothie-Schub
actors.hero.talent.invigorating_meal.desc=Ein Smoothie im Gehen, weil sie keine Zeit hat, anzukommen.\n\n_+1:_ Essen dauert für die Zugezogene 1 Zug (Beeren isst sie sofort) und gewährt ihr _1 Zug Eile_.\n\n_+2:_ Essen dauert für die Zugezogene 1 Zug (Beeren isst sie sofort) und gewährt ihr _2 Züge Eile_.
actors.hero.talent.liquid_nature.title=Guerilla-Gießkanne
actors.hero.talent.liquid_nature.desc=Wo sie etwas verschüttet, wächst Guerilla-Grün.\n\n_+1:_ Trinkt oder wirft die Zugezogene einen Trank, ein Gebräu oder ein Elixier, sprießt in der Umgebung _Gras auf bis zu 4 Feldern_, und benachbarte Gegner werden _1 Zug_ lang festgewurzelt.\n\n_+2:_ Trinkt oder wirft die Zugezogene einen Trank, ein Gebräu oder ein Elixier, sprießt in der Umgebung _Gras auf bis zu 6 Feldern_, und benachbarte Gegner werden _2 Züge_ lang festgewurzelt.\n\nGrasmenge und Wurzeldauer verdoppeln sich bei Kraft-Wegbier, Lebenserfahrungs-Weiße oder Alchemie-Gegenständen, die aus diesen Tränken hergestellt werden müssen.\n\nBei Alchemie-Gegenständen mit größerer Ausgabemenge (z. B. Rohrbruch-Bowle) wird das Talent mit einer Chance ausgelöst, die davon abhängt, wie viele Exemplare hergestellt werden.
actors.hero.talent.rejuvenating_steps.title=Baumscheibenpflege
actors.hero.talent.rejuvenating_steps.desc=Jede Baumscheibe, über die sie geht, bekommt Aufmerksamkeit.\n\n_+1:_ Tritt die Zugezogene auf kurzes Gras oder Glut, sprießt dort hohes Gras, das sie sofort niedertritt. Abklingzeit: _10 Züge_.\n\n_+2:_ Tritt die Zugezogene auf kurzes Gras oder Glut, sprießt dort hohes Gras, das sie sofort niedertritt. Abklingzeit: _5 Züge_.\n\nDas Talent erzeugt niedergetretenes Gras, wenn passive Regenerationseffekte deaktiviert sind oder die Heldin lange keine Erfahrung gesammelt hat.
actors.hero.talent.heightened_senses.title=Nachbarschaftsgespür
actors.hero.talent.heightened_senses.desc=Sie merkt sofort, wenn jemand neu im Haus ist, und findet es nicht gut.\n\n_+1:_ Die Zugezogene nimmt Figuren im Umkreis von _2 Feldern_ per Gedankensicht wahr.\n\n_+2:_ Die Zugezogene nimmt Figuren im Umkreis von _3 Feldern_ per Gedankensicht wahr.
actors.hero.talent.durable_projectiles.title=Upcycling
actors.hero.talent.durable_projectiles.desc=Weggeworfen wird nichts, auch nicht nach dem Wurf.\n\n_+1:_ Wurfwaffen der Zugezogenen haben _+50% Haltbarkeit_.\n\n_+2:_ Wurfwaffen der Zugezogenen haben _+75% Haltbarkeit_.

actors.hero.talent.point_blank.title=Zu nah dran
actors.hero.talent.point_blank.desc=Nähe ist nicht ihr Ding, aber sie arbeitet daran.\n\n_+1:_ Setzt die Zugezogene ihren Bogen oder eine Wurfwaffe im Nahkampf ein, hat sie _-25% Genauigkeit_ statt -50%.\n\n_+2:_ Setzt die Zugezogene ihren Bogen oder eine Wurfwaffe im Nahkampf ein, hat sie _normale Genauigkeit_ statt -50%.\n\n_+3:_ Setzt die Zugezogene ihren Bogen oder eine Wurfwaffe im Nahkampf ein, hat sie _+25% Genauigkeit_ statt -50%.\n\nAus der Distanz haben Wurfwaffen und der Upcycling-Bogen immer +50% Genauigkeit. Abstand halten lohnt sich also.
actors.hero.talent.seer_shot.title=Vorab-Besichtigung
actors.hero.talent.seer_shot.desc=Erst die Besichtigung, dann die Bewerbungsmappe.\n\n_+1:_ Schießt die Zugezogene einen Pfeil auf den Boden, sieht sie _5 Züge_ lang einen 3x3-Bereich um diese Stelle. Abklingzeit: 20 Züge.\n\n_+2:_ Schießt die Zugezogene einen Pfeil auf den Boden, sieht sie _10 Züge_ lang einen 3x3-Bereich um diese Stelle. Abklingzeit: 20 Züge.\n\n_+3:_ Schießt die Zugezogene einen Pfeil auf den Boden, sieht sie _15 Züge_ lang einen 3x3-Bereich um diese Stelle. Abklingzeit: 20 Züge.
actors.hero.talent.seer_shot.meta_desc=_Wenn eine andere Figur dieses Talent erhält_, löst jede Wurfwaffe es aus.

actors.hero.talent.farsight.title=Weitblick vom Dach
actors.hero.talent.farsight.desc=Vom Dachgarten sieht man bis zur nächsten Mieterhöhung.\n\n_+1:_ Die Sichtweite der Abstandshalterin steigt _um 25%_.\n\n_+2:_ Die Sichtweite der Abstandshalterin steigt _um 50%_.\n\n_+3:_ Die Sichtweite der Abstandshalterin steigt _um 75%_.
actors.hero.talent.shared_enchantment.title=Tauschregal
actors.hero.talent.shared_enchantment.desc=Was im Tauschregal liegt, gehört allen, auch die Verzauberung.\n\n_+1:_ Wurfwaffen nutzen mit _33% Chance_ die Verzauberung auf dem Bogen der Abstandshalterin.\n\n_+2:_ Wurfwaffen nutzen mit _67% Chance_ die Verzauberung auf dem Bogen der Abstandshalterin.\n\n_+3:_ Wurfwaffen nutzen mit _100% Chance_ die Verzauberung auf dem Bogen der Abstandshalterin.\n\nDie Verzauberung des Bogens kann zusätzlich zur Verzauberung der Wurfwaffe auslösen.
actors.hero.talent.shared_upgrades.title=Gemeinschaftsgarten
actors.hero.talent.shared_upgrades.desc=Gemeinschaftsgarten heißt: Alle profitieren, sie am meisten.\n\n_+1:_ Greift die Abstandshalterin mit einer verbesserten Wurfwaffe an, verlängert jede Stufe die Markierung um 1 Zug und erhöht den Schaden ihres Spezialangriffs um 16%, bis höchstens _2 Züge und +33% Schaden bei +2_.\n\n_+2:_ Greift die Abstandshalterin mit einer verbesserten Wurfwaffe an, verlängert jede Stufe die Markierung um 1 Zug und erhöht den Schaden ihres Spezialangriffs um 16%, bis höchstens _4 Züge und +67% Schaden bei +4_.\n\n_+3:_ Greift die Abstandshalterin mit einer verbesserten Wurfwaffe an, verlängert jede Stufe die Markierung um 1 Zug und erhöht den Schaden ihres Spezialangriffs um 16%, bis höchstens _6 Züge und +100% Schaden bei +6_.

actors.hero.talent.durable_tips.title=Reparaturcafé
actors.hero.talent.durable_tips.desc=Kaputt heißt nur: noch nicht im Reparaturcafé gewesen.\n\n_+1:_ Präparierte Dartpfeile halten bei der Baumscheibenpatin _2x so lange_.\n\n_+2:_ Präparierte Dartpfeile halten bei der Baumscheibenpatin _3x so lange_.\n\n_+3:_ Präparierte Dartpfeile halten bei der Baumscheibenpatin _4x so lange_.
actors.hero.talent.barkskin.title=Stadtbaumrinde
actors.hero.talent.barkskin.desc=Nach sechs Jahren Kiez hat sie eine dickere Haut als die Linden vor dem Haus.\n\n_+1:_ Tritt die Baumscheibenpatin auf nicht niedergetretenes hohes Gras oder auf Pflanzen, erhält sie Rindenhaut-Rüstung in Höhe von _0-33% ihrer Stufe_, die jeden Zug nachlässt.\n\n_+2:_ Tritt die Baumscheibenpatin auf nicht niedergetretenes hohes Gras oder auf Pflanzen, erhält sie Rindenhaut-Rüstung in Höhe von _0-67% ihrer Stufe_, die jeden Zug nachlässt.\n\n_+3:_ Tritt die Baumscheibenpatin auf nicht niedergetretenes hohes Gras oder auf Pflanzen, erhält sie Rindenhaut-Rüstung in Höhe von _0-100% ihrer Stufe_, die jeden Zug nachlässt.
actors.hero.talent.shielding_dew.title=Tropfenschild
actors.hero.talent.shielding_dew.desc=„Jeder Tropfen zählt“, sagt sie beim Gießen der Baumscheibe. Sie meint auch die aus dem Späti.\n\n_+1:_ Bei voller Gesundheit geben Biertropfen der Baumscheibenpatin Abschirmung, bis zu _20% ihrer maximalen LP_.\n\n_+2:_ Bei voller Gesundheit geben Biertropfen der Baumscheibenpatin Abschirmung, bis zu _40% ihrer maximalen LP_.\n\n_+3:_ Bei voller Gesundheit geben Biertropfen der Baumscheibenpatin Abschirmung, bis zu _60% ihrer maximalen LP_.

actors.hero.talent.fan_of_blades.title=Klingenfächer
actors.hero.talent.fan_of_blades.desc=Upcycling in Serie: eine Klinge, mehrere Ziele.\n\n_+1:_ Upcycling-Klingen treffen bis zu _1 weiteres Ziel_ mit 50% Schaden. Es muss sichtbar sein und in einem Kegel von _30 Grad_ liegen.\n\n_+2:_ Upcycling-Klingen treffen bis zu _2 weitere Ziele_ mit 50% Schaden. Sie müssen sichtbar sein und in einem Kegel von _60 Grad_ liegen.\n\n_+3:_ Upcycling-Klingen treffen bis zu _3 weitere Ziele_ mit 50% Schaden. Sie müssen sichtbar sein und in einem Kegel von _90 Grad_ liegen.\n\n_+4:_ Upcycling-Klingen treffen bis zu _4 weitere Ziele_ mit 50% Schaden. Sie müssen sichtbar sein und in einem Kegel von _120 Grad_ liegen.
actors.hero.talent.projecting_blades.title=Durch die Brandmauer
actors.hero.talent.projecting_blades.desc=Die Brandmauer ist kein Hindernis, nur ein Vorschlag.\n\n_+1:_ Upcycling-Klingen haben _+25% Genauigkeit_ und durchdringen bis zu _2 feste Felder_.\n\n_+2:_ Upcycling-Klingen haben _+50% Genauigkeit_ und durchdringen bis zu _4 feste Felder_.\n\n_+3:_ Upcycling-Klingen haben _+75% Genauigkeit_ und durchdringen bis zu _6 feste Felder_.\n\n_+4:_ Upcycling-Klingen haben _+100% Genauigkeit_ und durchdringen bis zu _8 feste Felder_.
actors.hero.talent.spirit_blades.title=Zweites Leben
actors.hero.talent.spirit_blades.desc=Altmetall bekommt ein zweites Leben und die Verzauberung dazu.\n\n_+1:_ Upcycling-Klingen nutzen mit _30% Chance_ auch die Verzauberung des Upcycling-Bogens.\n\n_+2:_ Upcycling-Klingen nutzen mit _60% Chance_ auch die Verzauberung des Upcycling-Bogens.\n\n_+3:_ Upcycling-Klingen nutzen mit _90% Chance_ auch die Verzauberung des Upcycling-Bogens.\n\n_+4:_ Upcycling-Klingen nutzen mit _100% Chance_ auch die Verzauberung des Upcycling-Bogens und verleihen jeder Verzauberung _+10% Kraft_.

actors.hero.talent.growing_power.title=Mehr Watt
actors.hero.talent.growing_power.desc=Mehr Watt vom Balkon, und die Nachbarn fragen nach dem Stromanbieter.\n\n_+1:_ Das Balkonkraftwerk erhöht Angriffs- und Bewegungsgeschwindigkeit um _38% und 125%_ statt um 33% und 100%.\n\n_+2:_ Das Balkonkraftwerk erhöht Angriffs- und Bewegungsgeschwindigkeit um _42% und 150%_ statt um 33% und 100%.\n\n_+3:_ Das Balkonkraftwerk erhöht Angriffs- und Bewegungsgeschwindigkeit um _46% und 175%_ statt um 33% und 100%.\n\n_+4:_ Das Balkonkraftwerk erhöht Angriffs- und Bewegungsgeschwindigkeit um _50% und 200%_ statt um 33% und 100%.
actors.hero.talent.natures_wrath.title=Wildwuchs
actors.hero.talent.natures_wrath.desc=Stadtgrün kann auch zurückschlagen.\n\n_+1:_ Solange das Balkonkraftwerk läuft, lösen Schüsse aus dem Upcycling-Bogen mit _8% Chance_ einen zufälligen schädlichen Pflanzeneffekt aus.\n\n_+2:_ Solange das Balkonkraftwerk läuft, lösen Schüsse aus dem Upcycling-Bogen mit _17% Chance_ einen zufälligen schädlichen Pflanzeneffekt aus.\n\n_+3:_ Solange das Balkonkraftwerk läuft, lösen Schüsse aus dem Upcycling-Bogen mit _25% Chance_ einen zufälligen schädlichen Pflanzeneffekt aus.\n\n_+4:_ Solange das Balkonkraftwerk läuft, lösen Schüsse aus dem Upcycling-Bogen mit _33% Chance_ einen zufälligen schädlichen Pflanzeneffekt aus.\n\nMögliche Pflanzen: Blendwerk, Brandnessel, Frostbeule, Neidmoos und Schwindelranke.
actors.hero.talent.wild_momentum.title=Sonnenstunden
actors.hero.talent.wild_momentum.desc=Jeder erledigte Gegner bringt eine Sonnenstunde mehr, sagt ihr Solarrechner.\n\n_+1:_ Tötet die Zugezogene einen Gegner mit dem Upcycling-Bogen, läuft das Balkonkraftwerk _1 Zug_ länger, insgesamt höchstens _2 Züge_ länger.\n\n_+2:_ Tötet die Zugezogene einen Gegner mit dem Upcycling-Bogen, läuft das Balkonkraftwerk _2 Züge_ länger, insgesamt höchstens _4 Züge_ länger.\n\n_+3:_ Tötet die Zugezogene einen Gegner mit dem Upcycling-Bogen, läuft das Balkonkraftwerk _3 Züge_ länger, insgesamt höchstens _6 Züge_ länger.\n\n_+4:_ Tötet die Zugezogene einen Gegner mit dem Upcycling-Bogen, läuft das Balkonkraftwerk _4 Züge_ länger, insgesamt höchstens _8 Züge_ länger.

actors.hero.talent.eagle_eye.title=Taubenblick
actors.hero.talent.eagle_eye.desc=Tauben sehen alles, vor allem Krümel.\n\n_+1:_ Die Sichtweite der Geistertaube steigt von 6 auf _7 Felder_.\n\n_+2:_ Die Sichtweite der Geistertaube steigt von 6 auf _8 Felder_.\n\n_+3:_ Die Sichtweite der Geistertaube steigt von 6 auf _9 Felder_, und sie erhält _2 Felder_ Gedankensicht.\n\n_+4:_ Die Sichtweite der Geistertaube steigt von 6 auf _10 Felder_, und sie erhält _3 Felder_ Gedankensicht.
actors.hero.talent.go_for_the_eyes.title=Picken auf Augenhöhe
actors.hero.talent.go_for_the_eyes.desc=Die Taube zielt auf Augenhöhe, wie jede Taube am Bahnsteig.\n\n_+1:_ Angriffe der Geistertaube blenden Gegner _2 Züge_ lang.\n\n_+2:_ Angriffe der Geistertaube blenden Gegner _5 Züge_ lang.\n\n_+3:_ Angriffe der Geistertaube blenden Gegner _5 Züge_ lang und verkrüppeln sie _2 Züge_ lang.\n\n_+4:_ Angriffe der Geistertaube blenden Gegner _5 Züge_ lang und verkrüppeln sie _5 Züge_ lang.
actors.hero.talent.swift_spirit.title=Flinke Flügel
actors.hero.talent.swift_spirit.desc=Flink wie eine Taube, die den Krümel zuerst gesehen hat.\n\n_+1:_ Die Geschwindigkeit der Geistertaube steigt von 2 auf _2,5 Felder_ pro Zug, und sie weicht den ersten _2 Angriffen_ gegen sie garantiert aus.\n\n_+2:_ Die Geschwindigkeit der Geistertaube steigt von 2 auf _3 Felder_ pro Zug, und sie weicht den ersten _4 Angriffen_ gegen sie garantiert aus.\n\n_+3:_ Die Geschwindigkeit der Geistertaube steigt von 2 auf _3,5 Felder_ pro Zug, und sie weicht den ersten _6 Angriffen_ gegen sie garantiert aus.\n\n_+4:_ Die Geschwindigkeit der Geistertaube steigt von 2 auf _4 Felder_ pro Zug, und sie weicht den ersten _8 Angriffen_ gegen sie garantiert aus.

#duelist
actors.hero.talent.strengthening_meal.title=kräftigende Mahlzeit
actors.hero.talent.strengthening_meal.desc=_+1:_ Verzehren von Nahrung gewährt der Zweikämpferin 3 Punkte Bonus-Schaden bei ihren nächsten _2 Angriffen_, bei denen sie einem Gegner physischen Schaden zufügt.\n\n_+2:_ Verzehren von Nahrung gewährt der Zweikämpferin 3 Punkte Bonus-Schaden bei ihren nächsten _3 Angriffen_, bei denen sie einem Gegner physischen Schaden zufügt
actors.hero.talent.adventurers_intuition.title=Intuition des Abenteurers
actors.hero.talent.adventurers_intuition.desc=_+1:_ Die Zweikämpferin identifiziert Waffen _2,5x schneller_ und Rüstungen _1,75x schneller_.\n\n_+2:_ Die Zweikämpferin identifiziert Waffen _sobald sie diese ausrüstet_ und Rüstungen _2,5x schneller_.
actors.hero.talent.patient_strike.title=geduldiger Schlag
actors.hero.talent.patient_strike.desc=_+1:_ Wenn die Zweikämpferin wartet, bevor sie einen Nahkampfangriff ausführt, wird sie damit _1-2 Punkte Bonus-Schaden_ zufügen.\n\n_+2:_ Wenn die Zweikämpferin wartet, bevor sie einen Nahkampfangriff ausführt, wird sie damit _2 Punkte Bonus-Schaden_ zufügen.
actors.hero.talent.aggressive_barrier.title=aggressive Barriere
actors.hero.talent.aggressive_barrier.desc=_+1:_ Die Zweikämpferin erhält _3 Schildpunkte_, wenn sie eine Waffenfähigkeit einsetzt und weniger als _50% Lebenspunkte_ hat.\n\n_+2:_ Die Zweikämpferin erhält _5 Schildpunkte_, wenn sie eine Waffenfähigkeit einsetzt und weniger als _50% Lebenspunkte_ hat.
actors.hero.talent.aggressive_barrier.meta_desc=_Wenn dieses Talent durch einen anderen Helden gewonnen wird_, verleiht es stattdessen eine Abschirmung bei Nahkampfangriffen mit niedrigen Lebenspunkten, mit einer Abklingzeit von 50 Zügen.

actors.hero.talent.focused_meal.title=fokussierte Mahlzeit
actors.hero.talent.focused_meal.desc=_+1:_ Das Essen von Nahrung dauert für die Zweikämpferin 1 Zug und gewährt ihr _0,67 Ladung_ auf ihre Waffen.\n\n_+2:_ Das Essen von Nahrung dauert für die Zweikämpferin 1 Zug und gewährt ihr _1 Ladung_ auf ihre Waffen.
actors.hero.talent.focused_meal.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ verleiht es stattdessen dem nächsten Treffer Bonusschaden in Höhe seiner Stufe/3 bei +1 oder Stufe/2 bei +2.
actors.hero.talent.liquid_agility.title=flüssige Wendigkeit
actors.hero.talent.liquid_agility.desc=_+1:_ Beim Trinken oder Werfen eines Tranks, Gebräus oder Elixiers hat die Zweikämpferin _3x Ausweichfähigkeit_ und _3x Genauigkeit_ bei ihrem nächsten Nahkampfangriff innerhalb von 5 Zügen.\n\n_+2:_ Beim Trinken oder Werfen eines Tranks, Gebräus oder Elixiers hat die Zweikämpferin _unendliche Ausweichfähigkeit_ und _unendliche Genauigkeit_ bei ihrem nächsten Nahkampfangriff innerhalb von 5 Zügen.\n\nDieser Bonus hält einen zusätzlichen Zug und einen zusätzlichen Angriff an, wenn Kraft-Wegbier, Lebenserfahrungs-Weiße oder alchemische Gegenstände verwendet werden, die mit diesen Pullen hergestellt werden müssen.\n\nBei alchemischen Gegenständen mit höheren Produktionsmengen (z. B. Rohrbruch-Bowle) besteht eine Chance, dass dieses Talent ausgelöst wird, je nachdem, wie viele von diesem Gegenstand hergestellt werden.
actors.hero.talent.weapon_recharging.title=Waffenaufladung
actors.hero.talent.weapon_recharging.desc=_+1:_ Die Zweikämpferin erhält aller _15 Züge_ eine Waffenladung, solange ein Waffen- oder Artefakt-Aufladungseffekt anhält.\n\n_+2:_ Die Zweikämpferin erhält aller _10 Züge_ eine Waffenladung, solange ein Waffen- oder Artefakt-Aufladungseffekt anhält.
actors.hero.talent.weapon_recharging.meta_desc=_Wenn dieses Talent durch einen anderen Helden gewonnen wird_, führt es dazu, dass er beim Aufladen +5% Nahkampfschaden bei +1 verursacht, oder +7,5% Nahkampfschaden bei +2.
actors.hero.talent.lethal_haste.title=letale Eile
actors.hero.talent.lethal_haste.desc=_+1:_ Trifft die Zweikämpferin einen Feind mit einer Waffenfähigkeit und landet einen tödlichen Schlag, erhält sie _3 Züge_ sofortige Eile. \n\n_+2:_ Trifft die Zweikämpferin einen Feind mit einer Waffenfähigkeit und landet einen tödlichen Schlag, erhält sie _5 Züge_ sofortige Eile.
actors.hero.talent.lethal_haste.meta_desc=_Wenn dieses Talent durch einen anderen Helden gewonnen wird_, wird es stattdessen durch reguläre Angriffe mit Waffen ausgelöst, mit einer Abklingzeit von 100 Zügen.
actors.hero.talent.swift_equip.title=rasches Ausrüsten
actors.hero.talent.swift_equip.desc=_+1:_ Die Zweikämpferin kann ihre ausgerüstete Waffe _einmal_ alle 20 Züge sofort umrüsten.\n\n_+2:_ Die Zweikämpferin kann ihre ausgerüstete Waffe _zweimal_ alle 20 Züge sofort umrüsten.\n\nWenn die Zweikämpferin über dieses Talent verfügt und es sich nicht in der Abklingzeit befindet, wird die Schnellnutzung eine nicht ausgerüstete Waffe ausrüsten.

actors.hero.talent.precise_assault.title=präziser Angriff
actors.hero.talent.precise_assault.desc=_+1:_ Wenn die Zweikämpferin eine Waffenfähigkeit einsetzt, erhält sie innerhalb von 5 Zügen _zweifache Genauigkeit_ bei ihrem nächsten Nahkampfangriff.\n\n_+2:_ Wenn die Zweikämpferin eine Waffenfähigkeit einsetzt, erhält sie innerhalb von 5 Zügen _fünffache Genauigkeit_ bei ihrem nächsten Nahkampfangriff.\n\n_+3:_ Wenn die Zweikämpferin eine Waffenfähigkeit einsetzt, erhält sie innerhalb von 5 Zügen _unendliche Genauigkeit_ bei ihrem nächsten Nahkampfangriff.
actors.hero.talent.precise_assault.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ erhöht es stattdessen die Nahkampfgenauigkeit um 10 % bei +1, 20 % bei +2 oder 30 % bei +3.
actors.hero.talent.deadly_followup.title=tödliches Nachtreten
actors.hero.talent.deadly_followup.desc=_+1:_ Wenn die Zweikämpferin einen Gegner mit einer Wurfwaffe trifft, fügt sie ihm 5 Züge lang _10% mehr Nahkampfschaden_ zu.\n\n_+2:_ Wenn die Zweikämpferin einen Gegner mit einer Wurfwaffe trifft, fügt sie ihm 5 Züge lang _20% mehr Nahkampfschaden_ zu.\n\n_+3:_ Wenn die Zweikämpferin einen Gegner mit einer Wurfwaffe trifft, fügt sie ihm 5 Züge lang _30% mehr Nahkampfschaden_ zu.

actors.hero.talent.varied_charge.title=gewechselte Ladung
actors.hero.talent.varied_charge.desc=_+1:_ Die Nebenjobberin erhält sofort _0,17 Waffenaufladungen_, wenn sie zwei verschiedene Waffenfähigkeiten nutzt, ohne Zeitlimit.\n\n_+2:_ Die Nebenjobberin erhält sofort _0,33 Waffenaufladungen_, wenn sie zwei verschiedene Waffenfähigkeiten nutzt, ohne Zeitlimit.\n\n_+3:_ Die Nebenjobberin erhält sofort _0,5 Waffenaufladungen_, wenn sie zwei verschiedene Waffenfähigkeiten nutzt, ohne Zeitlimit.
actors.hero.talent.twin_upgrades.title=Zwillings-Verbesserungen
actors.hero.talent.twin_upgrades.desc=_+1:_ Ist eine der beiden ausgerüsteten Waffen der Nebenjobberin auf einer niedrigeren Stufe und _2 oder mehr Ränge niedriger_ als die andere, wird sie auf die Stufe der anderen Waffe verbessert.\n\n_+2:_ Ist eine der beiden ausgerüsteten Waffen der Nebenjobberin auf einer niedrigeren Stufe und _1 oder mehr Ränge niedriger_ als die andere, wird sie auf die Stufe der anderen Waffe verbessert.\n\n_+3:_ Ist eine der beiden ausgerüsteten Waffen der Nebenjobberin auf einer niedrigeren Stufe und _auf dem gleichen oder einem niedrigeren Rang_ wie die andere, wird sie auf die Stufe der anderen Waffe verbessert.
actors.hero.talent.combined_lethality.title=kombinierte Letalität
actors.hero.talent.combined_lethality.desc=_+1:_ Nutzt die Nebenjobberin zwei verschiedene Waffenfähigkeiten in Folge, so wird die zweite Fähigkeit jeden Gegner, der kein Boss ist, töten, sofern er _weniger als 13% seiner maximalen Lebenspunkte_ hat.\n\n_+2:_ Nutzt die Nebenjobberin zwei verschiedene Waffenfähigkeiten in Folge, so wird die zweite Fähigkeit jeden Gegner, der kein Boss ist, töten, sofern er _weniger als 27% seiner maximalen Lebenspunkte_ hat.\n\n_+3:_ Nutzt die Nebenjobberin zwei verschiedene Waffenfähigkeiten in Folge, so wird die zweite Fähigkeit jeden Gegner, der kein Boss ist, töten, sofern er _weniger als 40% seiner maximalen Lebenspunkte_ hat.\n\nDieser Angriff kann ein regulärer Nahkampfangriff oder Teil einer Waffenfähigkeit sein.

actors.hero.talent.unencumbered_spirit.title=Unbeschwerter Geist
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Die Hinterhof-Yogini erhält _50% mehr Energie_ für jedes Ausrüstungsteil _der Klasse 3 oder niedriger_, das sie ausgerüstet hat.\n\n_+2:_ Die Hinterhof-Yogini erhält _75% mehr Energie_ für jedes Ausrüstungsteil _der Klasse 2 oder niedriger_, das sie ausgerüstet hat. Der Bonus der Klasse 3 bleibt unverändert.\n\n_+3:_ Die Hinterhof-Yogini erhält _100% mehr Energie_ für jedes Ausrüstungsteil _der Klasse 1 oder niedriger_, das sie ausgerüstet hat. Der Bonus der Klasse 2 und 3 bleibt unverändert. Sie erhält außerdem einen Hoodie und Spülhandschuhe.\n\nDas Talent gewährt keinen Bonus, wenn sie keine Waffe trägt oder mit einem Tresenfaust-Ring angreift.
actors.hero.talent.monastic_vigor.title=klösterliche Lebenskraft
actors.hero.talent.monastic_vigor.desc=_+1:_ Wenn die Hinterhof-Yogini _100% Energie_ hat, sind ihre Fähigkeiten verstärkt.\n\n_+2:_ Wenn die Hinterhof-Yogini _80% oder mehr Energie_ hat, sind ihre Fähigkeiten verstärkt.\n\n_+3:_ Wenn die Hinterhof-Yogini _60% oder mehr Energie_ hat, sind ihre Fähigkeiten verstärkt.\n\nWenn die Fähigkeiten verstärkt sind:\n- Hastige Hiebe verwenden Waffenverzauberungen\n- Konzentration passiert augenblicklich\n- Sprint erhält +4 Reichweite\n- Drachentritt fügt +50% Schaden zu, schleudert alle benachbarten Feinde zurück und paralysiert sie.\n- Meditation gewährt 80% Schadensresistenz und heilt langsam 20% der fehlenden Lebenspunkte.
actors.hero.talent.combined_energy.title=kombinierte Energie
actors.hero.talent.combined_energy.desc=_+1:_ Wenn die Hinterhof-Yogini innerhalb von 5 Zügen eine Waffenfähigkeit und eine Fähigkeit mit _4+ Energie_ einsetzt, erhält sie 1 verbrauchte Energie zurück.\n\n_+2:_ Wenn die Hinterhof-Yogini innerhalb von 5 Zügen eine Waffenfähigkeit und eine Fähigkeit mit _3+ Energie_ einsetzt, erhält sie 1 verbrauchte Energie zurück.\n\n_+3:_ Wenn die Hinterhof-Yogini innerhalb von 5 Zügen eine Waffenfähigkeit und eine Fähigkeit mit _2+ Energie_ einsetzt, erhält sie 1 verbrauchte Energie zurück.

actors.hero.talent.close_the_gap.title=Lückenschluss
actors.hero.talent.close_the_gap.desc=_+1:_ Die Zweikämpferin teleportiert _bis zu zwei Felder weit_ in Richtung ihres Ziels, wenn sie ein Duell beginnt.\n\n_+2:_ Die Zweikämpferin teleportiert _bis zu drei Felder weit_ in Richtung ihres Ziels, wenn sie ein Duell beginnt.\n\n_+3:_ Die Zweikämpferin teleportiert _bis zu vier Felder weit_ in Richtung ihres Ziels, wenn sie ein Duell beginnt.\n\n_+4:_ Die Zweikämpferin teleportiert _bis zu fünf Felder weit_ in Richtung ihres Ziels, wenn sie ein Duell beginnt.\n\nDie Teleportation kann durch Gefahren und Gegner gehen, aber nicht durch festes Gelände wie Mauern. Die Teleportation wird berücksichtigt, wenn bestimmt wird, ob ein Gegner für eine Herausforderung innerhalb der Reichweite ist.
actors.hero.talent.invigorating_victory.title=erfrischender Sieg
actors.hero.talent.invigorating_victory.desc=_+1:_ Wenn die Zweikämpferin ihr Ziel besiegt, bevor das Duell beendet ist, wird sie um _5 LP plus 30% des Schadens_, den sie beim Duell eingesteckt hat, geheilt.\n\n_+2:_ Wenn die Zweikämpferin ihr Ziel besiegt, bevor das Duell beendet ist, wird sie um _10 LP plus 50% des Schadens_, den sie beim Duell eingesteckt hat, geheilt.\n\n_+3:_ Wenn die Zweikämpferin ihr Ziel besiegt, bevor das Duell beendet ist, wird sie um _15 LP plus 65% des Schadens_, den sie beim Duell eingesteckt hat, geheilt.\n\n_+4:_ Wenn die Zweikämpferin ihr Ziel besiegt, bevor das Duell beendet ist, wird sie um _20 LP plus 75% des Schadens_, den sie beim Duell eingesteckt hat, geheilt.
actors.hero.talent.elimination_match.title=K.o.-Runde
actors.hero.talent.elimination_match.desc=_+1:_ Wenn die Zweikämpferin innerhalb von 3 Zügen nach Abschluss eines Duells wieder zu einem Duell herausfordert, so hat die neue Herausforderung _16% weniger_ Ladungskosten.\n\n_+2:_ Wenn die Zweikämpferin innerhalb von 3 Zügen nach Abschluss eines Duells wieder zu einem Duell herausfordert, so hat die neue Herausforderung _30% weniger_ Ladungskosten.\n\n_+3:_ Wenn die Zweikämpferin innerhalb von 3 Zügen nach Abschluss eines Duells wieder zu einem Duell herausfordert, so hat die neue Herausforderung _40% weniger_ Ladungskosten.\n\n_+4:_ Wenn die Zweikämpferin innerhalb von 3 Zügen nach Abschluss eines Duells wieder zu einem Duell herausfordert, so hat die neue Herausforderung _50% weniger_ Ladungskosten.

actors.hero.talent.elemental_reach.title=elementare Reichweite
actors.hero.talent.elemental_reach.desc=_+1:_ Die Reichweite des Elementarschlags ist von 4 auf _5 Felder_ erhöht, sein Winkel von 65 auf _75 Grad_ erweitert.\n\n_+2:_ Die Reichweite des Elementarschlags ist von 4 auf _6 Felder_ erhöht, sein Winkel von 65 auf _85 Grad_ erweitert.\n\n_+3:_ Die Reichweite des Elementarschlags ist von 4 auf _7 Felder_ erhöht, sein Winkel von 65 auf _95 Grad_ erweitert.\n\n_+4:_ Die Reichweite des Elementarschlags ist von 4 auf _8 Felder_ erhöht, sein Winkel von 65 auf _105 Grad_ erweitert.
actors.hero.talent.striking_force.title=Schlagkraft
actors.hero.talent.striking_force.desc=_+1:_ Die Wirkung eines Elementarschlags ist um _30%_ erhöht.\n\n_+2:_ Die Wirkung eines Elementarschlags ist um _60%_ erhöht.\n\n_+3:_ Die Wirkung eines Elementarschlags ist um _90%_ erhöht.\n\n_+4:_ Die Wirkung eines Elementarschlags ist um _120%_ erhöht.
actors.hero.talent.directed_power.title=gerichtete Kraft
actors.hero.talent.directed_power.desc=_+1:_ Der direkte Angriff mittels Elementarschlag wird pro Gegner in Reichweite des Effekts, einschließlich des direkten Ziels, _um 30% verstärkt_.\n\n_+2:_ Der direkte Angriff mittels Elementarschlag wird pro Gegner in Reichweite des Effekts, einschließlich des direkten Ziels, _um 60% verstärkt_.\n\n_+3:_ Der direkte Angriff mittels Elementarschlag wird pro Gegner in Reichweite des Effekts, einschließlich des direkten Ziels, _um 90% verstärkt_.\n\n_+4:_ Der direkte Angriff mittels Elementarschlag wird pro Gegner in Reichweite des Effekts, einschließlich des direkten Ziels, _um 120% verstärkt_.

actors.hero.talent.feigned_retreat.title=fingierter Rückzug
actors.hero.talent.feigned_retreat.desc=_+1:_ Wenn ein Feind das Nachbild der Zweikämpferin angreift, erhält sie _2 Züge_ Eile.\n\n_+2:_ Wenn ein Feind das Nachbild der Zweikämpferin angreift, erhält sie _4 Züge_ Eile.\n\n_+3:_ Wenn ein Feind das Nachbild der Zweikämpferin angreift, erhält sie _6 Züge_ Eile.\n\n_+4:_ Wenn ein Feind das Nachbild der Zweikämpferin angreift, erhält sie _8 Züge_ Eile.
actors.hero.talent.expose_weakness.title=Schwäche bloßstellen
actors.hero.talent.expose_weakness.desc=_+1:_ Feinde, die das Nachbild der Zweikämpferin angreifen, werden für _2 Züge_ geschwächt und verwundbar.\n\n_+2:_ Feinde, die das Nachbild der Zweikämpferin angreifen, werden für _4 Züge_ geschwächt und verwundbar.\n\n_+3:_ Feinde, die das Nachbild der Zweikämpferin angreifen, werden für _6 Züge_ geschwächt und verwundbar.\n\n_+4:_ Feinde, die das Nachbild der Zweikämpferin angreifen, werden für _8 Züge_ geschwächt und verwundbar.
actors.hero.talent.counter_ability.title=Fähigkeit kontern
actors.hero.talent.counter_ability.desc=_+1:_ Wenn die Zweikämpferin innerhalb von 3 Zügen, nachdem ihr Nachbild angegriffen wurde, eine Waffenfähigkeit einsetzt, erhält sie sofort _0,38 Ladungen_ zurück.\n\n_+2:_ Wenn die Zweikämpferin innerhalb von 3 Zügen, nachdem ihr Nachbild angegriffen wurde, eine Waffenfähigkeit einsetzt, erhält sie sofort _0,77 Ladungen_ zurück.\n\n_+3:_ Wenn die Zweikämpferin innerhalb von 3 Zügen, nachdem ihr Nachbild angegriffen wurde, eine Waffenfähigkeit einsetzt, erhält sie sofort _1,13 Ladungen_ zurück.\n\n_+4:_ Wenn die Zweikämpferin innerhalb von 3 Zügen, nachdem ihr Nachbild angegriffen wurde, eine Waffenfähigkeit einsetzt, erhält sie sofort _1,5 Ladungen_ zurück.

#cleric
actors.hero.talent.satiated_spells.title=verstärkte Zauber
actors.hero.talent.satiated_spells.desc=_+1:_ Durch Essen erhält der Kleriker _3 Abschirmung_, wenn er das nächste Mal einen Zauber wirkt.\n\n_+2:_ Durch Essen erhält der Kleriker _5 Abschirmung_, wenn er das nächste Mal einen Zauber wirkt.
actors.hero.talent.satiated_spells.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird_, gewährt es stattdessen sofort Abschirmung, der normalerweise nach 10 Zügen nachzulassen beginnt.
actors.hero.talent.holy_intuition.title=heilige Intuition
actors.hero.talent.holy_intuition.desc=+1: Der Kleriker kann _Heilige Intuition_ wirken, einen Zauber, der _3 Ladungen_ kostet und enthüllt, ob ein Gegenstand verflucht ist.\n\n+2: Der Kleriker kann _Heilige Intuition_ wirken, einen Zauber, der _2 Ladungen_ kostet und enthüllt, ob ein Gegenstand verflucht ist.
actors.hero.talent.holy_intuition.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ kann der Held stattdessen den Fluchstatus eines verfluchten Gegenstands unmittelbar vor dem Ausrüsten erkennen, und zwar in 15% der Fälle bei +1 oder in 25% der Fälle bei +2.
actors.hero.talent.searing_light.title=sengendes Licht
actors.hero.talent.searing_light.desc=_+1:_ Die physischen Angriffe des Klerikers auf von _Leitlicht_ erleuchtete Gegner verursachen _+3 Schaden._\n\n_+2:_ Die physischen Angriffe des Klerikers auf von _Leitlicht_ erleuchtete Gegner verursachen _+5 Schaden._
actors.hero.talent.searing_light.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ gewährt es stattdessen seinen Bonusschaden, nachdem ein Zauberstab oder Artefakt auf einen Feind angewendet wurde, mit einer Abklingzeit von 20 Zügen.
actors.hero.talent.shield_of_light.title=Lichtschild
actors.hero.talent.shield_of_light.desc=_+1:_ Der Kleriker kann _Lichtschild_ wirken, einen Zauber, der sofort wirkt und ihm _2–4 Rüstung_ für 5 Züge gegen ein Ziel gewährt, was 1 Ladung kostet.\n\n_+2:_ Der Kleriker kann _Lichtschild_ wirken, einen Zauber, der sofort wirkt und ihm _3–6 Rüstung_ für 5 Züge gegen ein Ziel gewährt, was 1 Ladung kostet.
actors.hero.talent.shield_of_light.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ verringert es stattdessen den physischen Schaden, den dir dein anvisierter Feind zufügt, um 1, zu 33% der Zeit bei +1 oder zu 50% der Zeit bei +2.

actors.hero.talent.enlightening_meal.title=Erleuchtende Mahlzeit
actors.hero.talent.enlightening_meal.desc=_+1:_ Das Essen von Nahrung kostet den Kleriker _1 Zug_ und gewährt ihm _0.67 Ladung_ für seinen Heiligen Folianten.\n\n_+2:_ Das Essen von Nahrung kostet den Kleriker _1 Zug_ und gewährt ihm _1 Ladung_ für seinen Heiligen Folianten.
actors.hero.talent.enlightening_meal.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ gewährt es stattdessen 2 Züge Zauberstab- und Artefaktaufladung bei +1 oder 3 Züge bei +2. Dies kann nicht dazu verwandt werden, die Foodsharing-Tüte sich selbst aufladen zu lassen.
actors.hero.talent.recall_inscription.title=Runen-Echo
actors.hero.talent.recall_inscription.refunded=Dein Gegenstand wurde erstattet!
actors.hero.talent.recall_inscription.desc=_+1:_ Der Kleriker kann _Runen-Echo_ wirken, einen Zauber, der den Effekt der letzten Stadttaube oder der letzten Schriftrolle, die er in den letzten _10 Zügen_ verwendet hat, repliziert.\n\n_+2:_ Der Kleriker kann _Runen-Echo_ wirken, einen Zauber, der den Effekt der letzten Stadttaube oder der letzten Schriftrolle, die er in den letzten _300 Zügen_ verwendet hat, repliziert.\n\nRunen-Echo kann nicht verwendet werden, um Modernisierungsbescheide zu replizieren. Die Aufladekosten dieses Zaubers variieren je nachdem, welcher Gegenstand zuletzt verwendet wurde: 2 für eine Stadttaube, 3 für eine Schriftrolle, 4 für eine exotische Schriftrolle. Diese Aufladekosten verdoppeln sich auch beim Replizieren eines Umwidmungsantrags oder von Alchemiegegenständen, die mithilfe von Umwandlung oder Verbesserung hergestellt werden müssen.
actors.hero.talent.recall_inscription.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ werden stattdessen alle Schriftrollen und Stadttauben in 10% der Fälle mit +1 und in 15% der Fälle mit +2 zurückerstattet. Modernisierungsbescheide sind von diesem Effekt ausgenommen.
actors.hero.talent.sunray.title=Sonnenstrahl
actors.hero.talent.sunray.desc=_+1:_ Der Kleriker kann _Sonnenstrahl_ wirken, einen Zauber, der 4–8 Schaden verursacht und das Ziel für 4 Züge blendet. Dies kostet 1 Ladung.\n\n_+2:_ Der Kleriker kann _Sonnenstrahl_ wirken, einen Zauber, der 6–12 Schaden verursacht und das Ziel für 6 Züge blendet. Dies kostet 1 Ladung.\n\nSonnenstrahl kann jedes Ziel nur einmal blenden. Ist das Ziel bereits durch Sonnenstrahl geblendet, wird es gelähmt. Dämonischen und untoten Gegnern fügt Sonnenstrahl stets maximalen Schaden zu.
actors.hero.talent.sunray.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ führt es stattdessen dazu, dass Zauberstäbe und Artefakte Feinde 4 Züge lang blenden, 15% der Zeit bei +1 oder 25% der Zeit bei +2.
actors.hero.talent.divine_sense.title=Göttlicher Sinn
actors.hero.talent.divine_sense.desc=_+1:_ Der Kleriker kann _Göttlicher Sinn_ wirken, einen Zauber, der ihm 50 Züge lang _8 Felder_ Übersinnliche Wahrnehmung gewährt sofort wirksam ist. Dies kostet 2 Ladungen.\n\n_+2:_ Der Kleriker kann _Göttlicher Sinn_ wirken, einen Zauber, der ihm 50 Züge lang _12 Felder_ Übersinnliche Wahrnehmung gewährt und sofort wirksam ist. Dies kostet 2 Ladungen.
actors.hero.talent.divine_sense.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ gewährt es ihm stattdessen für einen kurzen Moment Übersinnliche Wahrnehmung, nachdem er einen Zauberstab oder ein Artefakt verwendet hat, mit einer Reichweite von 3 Feldern bei +1 oder 5 Feldern bei +2.
actors.hero.talent.bless.title=Segen
actors.hero.talent.bless.desc=_+1:_ Der Kleriker kann _Segen_ spenden, einen Zauber, der _6 Züge Segen und 10 Abschirmung_ gewährt, wenn er auf sich selbst gewirkt wird, oder _10 Züge Segen und 10 Heilung_, wenn er auf einen anderen Charakter gewirkt wird. Dies kostet 1 Ladung.\n\n_+2:_ Der Kleriker kann _Segen_ spenden, einen Zauber, der _10 Züge Segen und 15 Abschirmung_ gewährt, wenn er auf sich selbst gewirkt wird, oder _15 Züge Segen und 15 Heilung_, wenn er auf einen anderen Charakter gewirkt wird. Dies kostet 1 Ladung.\n\nÜberschüssige Heilung durch diesen Zauber wird in Abschirmung umgewandelt.
actors.hero.talent.bless.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ erhöht es stattdessen die Genauigkeit und Ausweichfähigkeit des Helden und aller Verbündeten um 3% bei +1 oder um 5% bei +2.

actors.hero.talent.cleanse.title=Läuterung
actors.hero.talent.cleanse.desc=_+1:_ Der Kleriker kann _Läuterung_ wirken, einen Zauber, der negative Statuseffekte von ihm und seinen Verbündeten in der Nähe entfernt und ihnen _10 Abschirmung_ gewährt. Dies kostet 2 Ladungen.\n\n_+2:_ Der Kleriker kann _Läuterung_ wirken, einen Zauber, der ihm und seinen Verbündeten in der Nähe 3 Züge lang Immunität gegen negative Status gewährt und ihnen _20 Abschirmung_ gewährt. Dies kostet 2 Ladungen.\n\n_+3:_ Der Kleriker kann _Läuterung_ wirken, einen Zauber, der ihm und seinen Verbündeten in der Nähe 5 Züge lang Immunität gegen negative Status gewährt und ihnen _30 Abschirmung_ gewährt. Dies kostet 2 Ladungen.
actors.hero.talent.cleanse.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ werden stattdessen negative Statuseffekte des Helden nach der Verwendung eines Zauberstabs oder Artefakts beseitigt, und zwar in 10/20/30% der Fälle bei +1/+2/+3.
actors.hero.talent.light_reading.title=Leichte Lektüre
actors.hero.talent.light_reading.desc=_+1:_ Der Kleriker kann seinen Heiligen Folianten auch verwenden, wenn er nicht ausgerüstet ist. Ist dies der Fall, lädt er sich allerdings nur mit _25% der Geschwindigkeit_ auf.\n\n_+2:_ Der Kleriker kann seinen Heiligen Folianten auch verwenden, wenn er nicht ausgerüstet ist. Ist dies der Fall, lädt er sich allerdings nur mit _50% der Geschwindigkeit_ auf.\n\n_+3:_ Der Kleriker kann seinen Heiligen Folianten auch verwenden, wenn er nicht ausgerüstet ist. Ist dies der Fall, lädt er sich allerdings nur mit _75% der Geschwindigkeit_ auf.
actors.hero.talent.light_reading.meta_desc=_Wenn dieses Talent von einem anderen Helden erlangt wird,_ erhöht es stattdessen die Aufladegeschwindigkeit aller Zauberstäbe um 7/13/20% bei +1/+2/+3.

actors.hero.talent.holy_lance.title=Heilige Lanze
actors.hero.talent.holy_lance.desc=_+1:_ Der Quartiersmanager kann _Heilige Lanze_ wirken, einen verheerenden Zauber, der _30–55 Schaden_ verursacht und 4 Ladungen kostet.\n\n_+2:_ Der Quartiersmanager kann _Heilige Lanze_ wirken, einen verheerenden Zauber, der _45–83 Schaden_ verursacht und 4 Ladungen kostet.\n\n_+3:_ Der Quartiersmanager kann _Heilige Lanze_ wirken, einen verheerenden Zauber, der _60–110 Schaden_ verursacht und 4 Ladungen kostet.\n\nHeilige Lanze fügt dämonischen und untoten Gegnern immer maximalen Schaden zu. Heilige Lanze hat eine Abklingzeit von 30 Züge, bevor sie erneut gewirkt werden kann.
actors.hero.talent.hallowed_ground.title=Geheiligter Boden
actors.hero.talent.hallowed_ground.desc=_+1:_ Der Quartiersmanager kann _Geheiligter Boden_ wirken, einen Zauber, der Gelände in einem _3x3-Bereich_ für 20 Züge heiligt und dafür 2 Ladungen benötigt.\n\n_+2:_ Der Quartiersmanager kann _Geheiligter Boden_ wirken, einen Zauber, der Gelände in einem _5x5-Bereich_ für 20 Züge heiligt und dafür 2 Ladungen benötigt.\n\n_+3:_ Der Quartiersmanager kann _Geheiligter Boden_ wirken, einen Zauber, der Gelände in einem _7x7-Bereich_ für 20 Züge heiligt und dafür 2 Ladungen benötigt.\n\nWenn er gewirkt wird, heilt Geheiligter Boden Verbündete um 15 LP, macht Gegner kurzzeitig bewegungsunfähig und verbreitet kurzes Gras. Anschließend heilt er langsam Verbündete, verkrüppelt Gegner und lässt hohes Gras zufällig wachsen. Geheiligter Boden gewährt dem Quartiersmanager Abschirmung statt Heilung und wird durch Feuer zerstört.
actors.hero.talent.mnemonic_prayer.title=Eingedenken
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Der Quartiersmanager kann _Eingedenken_ wirken, einen Zauber, der die Wirkung von positiven/negativen Effekten auf Verbündete/Feinde um _3 Züge_ verlängert. Dies kostet 1 Ladung.\n\n_+2:_ Der Quartiersmanager kann _Eingedenken_ wirken, einen Zauber, der die Wirkung von positiven/negativen Effekten auf Verbündete/Feinde um _4 Züge_ verlängert. Dies kostet 1 Ladung.\n\n_+3:_ Der Quartiersmanager kann _Eingedenken_ wirken, einen Zauber, der die Wirkung von positiven/negativen Effekten auf Verbündete/Feinde um _5 Züge_ verlängert. Dies kostet 1 Ladung.\n\nDas Wirken von Eingedenken benötigt keine Zeit. Eingedenken kann eine bestimmte Wirkung von positiven und negativen Effekten nur einmal verlängern und hat keinen Einfluss auf Rüstungsfähigkeiten.

actors.hero.talent.lay_on_hands.title=Handauflegung
actors.hero.talent.lay_on_hands.desc=_+1:_ Der Mieterschützer kann _Handauflegung_ wirken, einen Zauber, der einen nahen Charakter sofort um _15 LP_ heilt oder dem Mieterschützer _15 Abschirmung_ gewährt. Dies kostet 1 Ladung.\n\n_+2:_ Der Mieterschützer kann _Handauflegung_ wirken, einen Zauber, der einen nahen Charakter sofort um _20 LP_ heilt oder dem Mieterschützer _20 Abschirmung_ gewährt Dies kostet 1 Ladung.\n\n_+3:_ Der Mieterschützer kann _Handauflegung_ wirken, einen Zauber, der einen nahen Charakter sofort um _25 LP_ heilt oder dem Mieterschützer _25 Abschirmung_ gewährt Dies kostet 1 Ladung.\n\nÜberschüssige Heilung durch diesen Zauber wird in Abschirmung umgewandelt. Handauflegung kann wiederholt gewirkt werden, kann aber nicht mehr als einen dreifach gewirkten Abschirmung gewähren.
actors.hero.talent.aura_of_protection.title=Aura des Schutzes
actors.hero.talent.aura_of_protection.desc=_+1:_ Der Mieterschützer kann die _Aura des Schutzes_ wirken, einen Zauber, der dem Mieterschützer und allen Verbündeten im Umkreis von 2 Feldern 20% Schadensresistenz und den Effekt der Rüstungsglyphe des Mieterschützers mit +50% Stärke für 20 Züge gewährt. Dies kostet 2 Ladungen.\n\n_+2:_ Der Mieterschützer kann die _Aura des Schutzes_ wirken, einen Zauber, der dem Mieterschützer und allen Verbündeten im Umkreis von 2 Feldern 30% Schadensresistenz und den Effekt der Rüstungsglyphe des Mieterschützers mit +75% Stärke für 20 Züge gewährt. Dies kostet 2 Ladungen.\n\n_+3:_ Der Mieterschützer kann die _Aura des Schutzes_ wirken, einen Zauber, der dem Mieterschützer und allen Verbündeten im Umkreis von 2 Feldern 40% Schadensresistenz und den Effekt der Rüstungsglyphe des Mieterschützers mit +100% Stärke für 20 Züge gewährt. Dies kostet 2 Ladungen.
actors.hero.talent.wall_of_light.title=Wand aus Licht
actors.hero.talent.wall_of_light.desc=_+1:_ Der Mieterschützer kann _Wand aus Licht_ wirken, einen Zauber, der eine _3 Felder breite_ massive Wand vor dem Mieterschützer erschafft, die Gegner abwehrt und 20 Züge lang anhält. Dies kostet 3 Ladungen.\n\n_+2:_ Der Mieterschützer kann _Wand aus Licht_ wirken, einen Zauber, der eine _5 Felder breite_ massive Wand vor dem Mieterschützer erschafft, die Gegner abwehrt und 20 Züge lang anhält. Dies kostet 3 Ladungen.\n\n_+3:_ Der Mieterschützer kann _Wand aus Licht_ wirken, einen Zauber, der eine _7 Felder breite_ massive Wand vor dem Mieterschützer erschafft, die Gegner abwehrt und 20 Züge lang anhält. Dies kostet 3 Ladungen.\n\nDie Wand kann gerade oder diagonal platziert werden; es kann immer nur eine Wand gleichzeitig existieren.

actors.hero.talent.divine_intervention.title=göttlicher Eingriff
actors.hero.talent.divine_intervention.desc=_+1:_ In der Aufgestiegenen Gestalt kann der Kleriker _Göttlicher Beistand_ wirken. Dies erhöht die Abschirmung des Klerikers und aller Verbündeten um bis zu _150 Punkte_ und verlängert die Aufgestiegene Gestalt um _3 Züge._\n\n_+2:_ In der Aufgestiegenen Gestalt kann der Kleriker _Göttlicher Beistand_ wirken. Dies erhöht die Abschirmung des Klerikers und aller Verbündeten um bis zu _200 Punkte_ und verlängert die Aufgestiegene Gestalt um _4 Züge._\n\n_+3:_ In der Aufgestiegenen Gestalt kann der Kleriker _Göttlicher Beistand_ wirken. Dies erhöht die Abschirmung des Klerikers und aller Verbündeten um bis zu _250 Punkte_ und verlängert die Aufgestiegene Gestalt um _5 Züge._\n\n+4: In der Aufgestiegenen Gestalt kann der Kleriker _Göttlicher Beistand_ wirken. Dies erhöht die Abschirmung des Klerikers und aller Verbündeten um bis zu _300 Punkte_ und verlängert die Aufgestiegene Gestalt um _6 Züge._\n\nDie Kosten von Göttlicher Beistand betragen satte 5 Foliantenladungen und es kann nur einmal in derselben Aufgestiegenen Form gewirkt werden.
actors.hero.talent.judgement.title=Richtspruch
actors.hero.talent.judgement.desc=_+1:_ In aufgestiegener Form kann der Kleriker _Richtspruch_ wirken, das allen sichtbaren Gegnern _10–20 Schaden_ zufügt.\n\n_+2:_ In aufgestiegener Form kann der Kleriker _Richtspruch_ wirken, das allen sichtbaren Gegnern _15–30 Schaden_ zufügt.\n\n_+3:_ In aufgestiegener Form kann der Kleriker _Richtspruch_ wirken, das allen sichtbaren Gegnern _20–40 Schaden_ zufügt.\n\n_+4:_ In aufgestiegener Form kann der Kleriker _Richtspruch_ wirken, das allen sichtbaren Gegnern _25–50 Schaden_ zufügt.\n\nRichtspruch kostet 3 Foliantenladungen. Richtspruch verursacht +33% Schaden für jeden Zauber, den der Kleriker seit dem Eintreten in die aufgestiegene Form oder seit dem letzten Wirken von _Richtspruch_ gewirkt hat.
actors.hero.talent.flash.title=Blitz
actors.hero.talent.flash.desc=_+1:_ In der Aufgestiegenen Form kann der Kleriker mit _Blitz_ bis zu _3 Felder_ weit teleportieren.\n\n_+2:_ In der Aufgestiegenen Form kann der Kleriker mit _Blitz_ bis zu _4 Felder_ weit teleportieren.\n\n_+3:_ In der Aufgestiegenen Form kann der Kleriker mit _Blitz_ bis zu _5 Felder_ weit teleportieren.\n\n_+4:_ In der Aufgestiegenen Form kann der Kleriker mit _Blitz_ bis zu _6 Felder_ weit teleportieren.\n\nBlitz kostet anfangs 2 Foliantenladungen und 1 weitere Ladung für jede Verwendung in derselben aufgestiegenen Form.

actors.hero.talent.body_form.title=Körperform
actors.hero.talent.body_form.desc=Der Kleriker kann _Körperform_ wirken, wodurch Dreieinigkeit die Kraft einer Verzauberung oder Glyphe erhält, die er in diesem Abenteuer identifiziert hat. Dies kostet 2 Ladungen.\n\n+1: Bei Einsatz von Dreieinigkeit erhält der Kleriker den gewählten Effekt für _20 Züge._\n\n+2: Bei Einsatz von Dreieinigkeit erhält der Kleriker den gewählten Effekt für _27 Züge._\n\n+3: Bei Einsatz von Dreieinigkeit erhält der Kleriker den gewählten Effekt für _33 Züge._\n\n+4: Bei Einsatz von Dreieinigkeit erhält der Kleriker den gewählten Effekt für _40 Züge._\n\nDreieinigkeit kann jeweils nur mit einer Körperform erfüllt werden. Die Rüstungskosten von Dreieinigkeit sind höher, wenn die gewählte Glyphe selten und mächtig ist.
actors.hero.talent.mind_form.title=Verstandesform
actors.hero.talent.mind_form.desc=Der Kleriker kann _Verstandesform_ wirken, die Dreieinigkeit die Kraft eines Zauberstabs oder einer Wurfwaffe verleiht, die der Kleriker in diesem Abenteuer verwendet hat. Dies kostet 3 Ladungen.\n\n_+1:_ Bei Dreieinigkeit nutzt der Kleriker den Zauber- oder Wurfeffekt des gewählten Gegenstands, als wäre dieser _+3._\n\n_+2:_ Bei Dreieinigkeit nutzt der Kleriker den Zauber- oder Wurfeffekt des gewählten Gegenstands, als wäre dieser _+4._\n\n_+3:_ Bei Dreieinigkeit nutzt der Kleriker den Zauber- oder Wurfeffekt des gewählten Gegenstands, als wäre dieser _+5._\n\n_+4:_ Bei Dreieinigkeit nutzt der Kleriker den Zauber- oder Wurfeffekt des gewählten Gegenstands, als wäre dieser _+6._\n\nDreieinigkeit kann jeweils nur mit einer Verstandesform erfüllt werden.
actors.hero.talent.spirit_form.title=Geistform
actors.hero.talent.spirit_form.desc=Der Kleriker kann _Geistform_ wirken, die Dreieinigkeit mit der Kraft eines Rings oder Artefakts erfüllt, das der Kleriker in diesem Abenteuer identifiziert hat (mit Ausnahme des Heiligen Folianten). Dies kostet 4 Ladungen.\n\n_+1:_ Bei Einsatz von Dreieinigkeit erhält der Kleriker für 20 Züge den Effekt eines Rings mit _+1_ oder löst den Effekt eines Artefakts mit _+4_ aus.\n\n_+2:_ Bei Einsatz von Dreieinigkeit erhält der Kleriker für 20 Züge den Effekt eines Rings mit _+2_ oder löst den Effekt eines Artefakts mit _+6_ aus.\n\n_+3:_ Bei Einsatz von Dreieinigkeit erhält der Kleriker für 20 Züge den Effekt eines Rings mit _+3_ oder löst den Effekt eines Artefakts mit _+8_ aus.\n\n_+4:_ Bei Einsatz von Dreieinigkeit erhält der Kleriker für 20 Züge den Effekt eines Rings mit _+4_ oder löst den Effekt eines Artefakts mit _+10_ aus.\n\nDreieinigkeit kann jeweils nur mit einer Geistform erfüllt werden. Artefakte haben unterschiedliche Effekte und Rüstungskosten, wenn sie durch Dreieinigkeit ausgelöst werden.

actors.hero.talent.beaming_ray.title=Strahl der Versetzung
actors.hero.talent.beaming_ray.desc=Der Kleriker kann von einem ermächtigten Verbündeten aus einen _Strahl der Versetzung_ für 1 Ladung wirken. Dieser Strahl durchdringt Wände und teleportiert den Verbündeten an einen Zielort. Befindet sich dort ein Gegner, erscheint der Verbündete neben ihm und nimmt ihn ins Visier. Der Strahl der Versetzung kann sogar normalerweise unbewegliche Verbündete teleportieren, hat dabei aber nur die halbe Reichweite.\n\n_+1:_ Der Strahl der Versetzung hat eine maximale Reichweite von _4 Feldern_ und erhöht den Bonus der Macht der Vielen auf _+35% Schaden_ gegen den nächsten Gegner für 10 Züge.\n\n_+2:_ Der Strahl der Versetzung hat eine maximale Reichweite von _8 Feldern_ und erhöht den Bonus der Macht der Vielen auf _+40% Schaden_ gegen den nächsten Gegner für 10 Züge.\n\n_+3:_ Der Strahl der Versetzung hat eine maximale Reichweite von _12 Feldern_ und erhöht den Bonus der Macht der Vielen auf _+45% Schaden_ gegen den nächsten Gegner für 10 Züge.\n\n_+4:_ Der Strahl der Versetzung hat eine maximale Reichweite von _16 Feldern_ und erhöht den Bonus der Macht der Vielen auf _+50% Schaden_ gegen den nächsten Feind für 10 Züge.
actors.hero.talent.life_link.title=Lebensband
actors.hero.talent.life_link.desc=Der Kleriker kann _Lebensband_ zwischen sich und einem ermächtigten Verbündeten für 2 Ladungen wirken. Dieser Zauber bewirkt, dass der Schaden zwischen dem Kleriker und seinem Verbündeten geteilt wird und dass vorteilhafte Klerikerzauber der Klasse 3 oder niedriger auf beide wirken, wenn einer von ihnen betroffen ist.\n\n_+1:_ Lebensband hält _10 Züge_ an und erhöht den Bonus der Macht der Vielen auf _-35% erlittenen Schaden._\n\n_+2:_ Lebensband hält _13 Züge_ an und erhöht den Bonus der Macht der Vielen auf _-40% erlittenen Schaden._\n\n_+3:_ Lebensband hält _17 Züge_ an und erhöht den Bonus der Macht der Vielen auf _-45% erlittenen Schaden._\n\n_+4:_ Lebensband hält _20 Züge_ an und erhöht den Bonus der Macht der Vielen auf _-50% erlittenen Schaden._
actors.hero.talent.stasis.title=Entrückung
actors.hero.talent.stasis.desc=Der Kleriker kann _Entrückung_ auf einen ermächtigten Verbündeten wirken. Dies kostet 2 Ladungen. Entrückung entfernt den Verbündeten vorübergehend aus der Unterwelt und erhält die verbleibende Zeit aller positiven Effekte, einschließlich der Macht der Vielen. Der Verbündete erscheint wieder neben dir, sobald der Effekt endet. Entrückung kann sofort und kostenlos erneut gewirkt werden, um den Effekt vorzeitig zu beenden. Entrückung wirkt auch auf unbewegliche Verbündete, kann diese aber nicht zwischen Ebenen bewegen.\n\n_+1:_ Entrückung hält maximal _60 Züge_ an.\n\n_+2:_ Entrückung hält maximal _90 Züge_ an.\n\n_+3:_ Entrückung hält maximal _120 Züge_ an.\n\n_+4:_ Entrückung hält maximal _150 Züge_ an.\n\nDer Kleriker kann außerdem Strahl der Versetzung wirken, wenn sich ein Verbündeter in Entrückung befindet, um ihn wiederzubeschwören, oder Lebensband einsetzen, um dessen Effekt präventiv anzuwenden. Verbündete profitieren jedoch nicht von Lebensband, während sie sich in Entrückung befinden.


#universal
actors.hero.talent.heroic_energy.title=Letzte Reserven
actors.hero.talent.heroic_energy.rat_title=Rattenreserven
actors.hero.talent.heroic_energy.desc=Für eine Etage reicht es immer noch.\n\n_+1:_ Die Rüstungsfähigkeit des Helden hat um _12% reduzierte_ Ladungskosten.\n\n_+2:_ Die Rüstungsfähigkeit des Helden hat um _23% reduzierte_ Ladungskosten.\n\n_+3:_ Die Rüstungsfähigkeit des Helden hat um _32% reduzierte_ Ladungskosten.\n\n_+4:_ Die Rüstungsfähigkeit des Helden hat um _40% reduzierte_ Ladungskosten.

actors.hero.talent.ratsistance.title=Rattwehr
actors.hero.talent.ratsistance.desc=Wer die Pfandratten kennt, weiß, wo sie zubeißen.\n\n_+1:_ Feindlich gesinnte rattifizierte Feinde verursachen _-10% Schaden_.\n\n_+2:_ Feindlich gesinnte rattifizierte Feinde verursachen _-19% Schaden_.\n\n_+3:_ Feindlich gesinnte rattifizierte Feinde verursachen _-27% Schaden_.\n\n_+4:_ Feindlich gesinnte rattifizierte Feinde verursachen _-35% Schaden_.
actors.hero.talent.ratlomacy.title=Rattlomatie
actors.hero.talent.ratlomacy.desc=Mit Ratten verhandelt man auf Augenhöhe, dann bleiben sie.\n\n_+1:_ Wenn du Rattifizierung auf einen bereits rattifizierten Feind anwendest, wird er freundlich gesinnt und die Verwandlung wird dauerhaft.\n\n_+2:_ Wenn du Rattifizierung auf einen bereits rattifizierten Feind anwendest, wird er freundlich gesinnt, die Verwandlung wird dauerhaft und er erhält _2 Züge_ Adrenalin.\n\n_+3:_ Wenn du Rattifizierung auf einen bereits rattifizierten Feind  anwendest, wird er freundlich gesinnt, die Verwandlung wird dauerhaft und er erhält _4 Züge_ Adrenalin.\n\n_+4:_ Wenn du Rattifizierung auf einen bereits rattifizierten Feind  anwendest, wird er freundlich gesinnt, die Verwandlung wird dauerhaft und er erhält _6 Züge_ Adrenalin.
actors.hero.talent.ratforcements.title=Rattentruppen
actors.hero.talent.ratforcements.desc=Wo eine Ratte ist, sind die Kollegen nicht weit.\n\n_+1:_ Wenn du Rattifizierung auf dich selbst anwendest, wird _1_ verbündete Beutelratte neben dir _beschworen_.\n\n_+2:_ Wenn du Rattifizierung auf dich selbst anwendest, werden _2_ verbündete Beutelratten neben dir _beschworen_.\n\n_+3:_ Wenn du Rattifizierung auf dich selbst anwendest, werden _3_ verbündete Beutelratten neben dir _beschworen_.\n\n_+4:_ Wenn du Rattifizierung auf dich selbst anwendest, werden _4_ verbündete Beutelratten neben dir _beschworen_.



###npcs
actors.mobs.npcs.blacksmith.name=Netztechniker
actors.mobs.npcs.blacksmith.intro_quest_warrior=Na, Alteingesessene! Dich kenn ick. Du hast den Anschluss als Erste im Haus beantragt. Termin zwischen acht und achtzehn Uhr, wa? Hier bin ick.
actors.mobs.npcs.blacksmith.intro_quest_mage=Na, Expat! Du hast "Can we circle back on my fiber?" jesagt, bevor ick überhaupt Hallo sagen konnte. Gecirclet wird hier seit zwei Jahren.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Na, Tourist! Du suchst WLAN? Dit Passwort steht uff keenem Zettel, weil et keen Netz jibt. Deshalb bin ick ja hier.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Na, Zugezogene! Bist bestimmt wegen der "guten Anbindung" hergezogen, wa? Die Anbindung bin ick. Ick komm. Irgendwann.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Na, du! Siehst aus, als hättste ooch 'n Termin.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Na, du! Beten hilft beim Router ooch nich.
actors.mobs.npcs.blacksmith.intro_quest_start=Willste dich nützlich machen, hä? Ick hätt' da wat. Ick soll hier endlich die Anschlüsse legen, aber mir fehlt dit Material. Unter meiner Werkstatt geht 'n alter Kabelschacht runter, da die Leiter. Schnapp dir die Spitzhacke und hol mir _Glasfaserstücke. 40 Stück_ sollten reichen. Dit Gestein da unten is' schön weich, _du kannst dich mit etwas Mühe durch die Wände graben._\n\nWat heißt hier, wieso ick dit nich selber mache? Ick bin nur bis zum Hausübergabepunkt zuständig. Der Schacht is' Tiefbau.\n\nIs' ja jut, wenn de dit Zeug bringst, schraub ick dir wat zusammen. Kannst froh sein, ick bin hier unten der Einzige, der noch wat Handwerkliches kann. Der Rest macht Hotline.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Aber pass auf, der Stollen is' gefährlich für so 'n kleenet Menschlein wie dich. Liegt seit der letzten Bauunterbrechung brach, inzwischen wachsen da unten 'ne Menge Kristalle. Die funkeln schön, sind aber zu zerbrechlich und deshalb nix wert, und irgendwelche magischen Dinger passen auf die auf. Die sind ziemlich stark, also _sei vorsichtig beim Schürfen,_ sonst ziehste deren Aufmerksamkeit auf dich.\n\nIrgendwo gibt's auch so 'nen _Riesenkristall._ Der is' viel stabiler, also mach dich auf 'nen Kampf gefasst, wenn du da drauf haust. Ick wette, der bremst dit Wachstum von allen Kristallen, wenn du den kaputt machst. Ick zahl' extra, wenn du dit hinkriegst!
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Aber pass auf, der Stollen is' gefährlich für so 'n kleenet Menschlein wie dich. 'N Subunternehmer-Bautrupp is' auch hinter der Glasfaser her, und jetzt zerlegen die da unten allet. Keene Pläne, keene Statik, keene Ahnung. Durch deren Gebuddel gibt's überall Felsbrüche und Einstürze. Da musste dich durchwühlen, also Obacht bei _frisch gebrochenem Fels._\n\nEiner von denen is' besonders übel, so 'ne Art _Tiefbau-Geomant_, der den Fels mit Magie rumschiebt. Ick zahl' extra, wenn du den findest und plattmachst, aber der haut garantiert zurück, hähä.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Aber pass auf, der Stollen is' gefährlich für so 'n kleenet Menschlein wie dich. Da unten wuchert inzwischen Hausschwamm, und zwar so 'n richtiges Monstrum. Dit hat Pilzwachen ausgebildet, die sind tödlich, wenn se dich sehen, aber wenigstens können se dir nich' hinterherrennen. _Bleib außer Sichtweite,_ wenn de weiterleben willst.\n\nIck zahl' extra, wenn du den _größten Pilz_ ausschaltest, aber dit wird nich' einfach. Der hängt an Myzel-Knoten, die in den Wänden stecken. Die meisten davon musste zerstören, eh' du ihm wat anhaben kannst. Dit Bauamt nennt dit übrigens "Bestandsschutz".
actors.mobs.npcs.blacksmith.reminder=Ick hab heute noch zwölf Termine. Alle zwischen acht und achtzehn Uhr. Der Schachteinstieg is' da drüben.
actors.mobs.npcs.blacksmith.reminder_crystal=Bring mir so viel Glasfaser, wie de kannst, und versuch' auch, den großen Kristall zu zerbrechen.
actors.mobs.npcs.blacksmith.reminder_gnoll=Bring mir so viel Glasfaser, wie de kannst, und versuch' auch, den Tiefbau-Geomanten zu erledigen.
actors.mobs.npcs.blacksmith.reminder_fungi=Bring mir so viel Glasfaser, wie de kannst, und versuch' auch, den Riesenpilz zu erledigen.
actors.mobs.npcs.blacksmith.lost_pick=Is' dit dein Ernst? Wo is' meine Spitzhacke?! Die steht im Inventar vom Netzbetreiber!
actors.mobs.npcs.blacksmith.quest_start_prompt=Bereit zum Abstieg? Sieh zu, dass de Platz für die Glasfaser hast.\n\n_Ick lass' dich nur einmal da runter!_ Versicherungstechnisch.
actors.mobs.npcs.blacksmith.enter_yes=Bin bereit
actors.mobs.npcs.blacksmith.enter_no=Noch nicht
actors.mobs.npcs.blacksmith.exit_warn_none=Biste schon fertig? Du hast ja fast gar keene Glasfaser! _40 Stück_ solltest de schon schaffen!\n\n_Denk dran, ick lass dich nich' noch mal runter, wenn de erst wieder oben bist._
actors.mobs.npcs.blacksmith.exit_warn_low=Biste schon fertig? Sieht nich' nach viel Glasfaser aus. _40 Stück_ solltest de schon schaffen!\n\n_Denk dran, ick lass dich nich' noch mal runter, wenn de erst wieder oben bist._
actors.mobs.npcs.blacksmith.exit_warn_med=Biste schon fertig? Bisschen Glasfaser haste ja, aber im Stollen is' definitiv noch mehr. _40 Stück_ solltest de schon schaffen!\n\n_Denk dran, ick lass dich nich' noch mal runter, wenn de erst wieder oben bist._
actors.mobs.npcs.blacksmith.exit_warn_high=Biste schon fertig? Haste ja ordentlich Glasfaser dabei, aber 'n bisschen mehr könnt' ick noch gebrauchen. _40 Stück_ solltest de schon schaffen!\n\n_Denk dran, ick lass dich nich' noch mal runter, wenn de erst wieder oben bist._
actors.mobs.npcs.blacksmith.exit_warn_full=Biste schon fertig? Haste ja viel Glasfaser dabei. Guck aber, dass de nix von deinem Krempel unten liegen lässt. Da unten wird sonst allet zu Fundmaterial.\n\n_Denk dran, ick lass dich nich' noch mal runter, wenn de erst wieder oben bist._
actors.mobs.npcs.blacksmith.exit_warn_crystal=Der Riesenkristall is' ooch noch da unten. Ick zahl' extra, wenn de den zerstörst.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Der Tiefbau-Geomant is' ooch noch da unten. Ick zahl' extra, wenn de den erledigst.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Der Riesenpilz is' ooch noch da unten. Ick zahl' extra, wenn de den plattmachst.
actors.mobs.npcs.blacksmith.exit_yes=Bin fertig
actors.mobs.npcs.blacksmith.exit_no=Noch nicht
actors.mobs.npcs.blacksmith.get_lost=Laut Benachrichtigungskarte hab ick dich nich angetroffen. Also zisch ab!
actors.mobs.npcs.blacksmith.entrance_blocked=Der Weg nach unten ist versperrt. Ein Schild sagt: Kabelschacht vorübergehend gesperrt.
actors.mobs.npcs.blacksmith.cant_enter_old=Dieses Gebiet ist in diesem Abenteuer nicht zugänglich. Beginne ein neues Spiel, um das neue Abenteuer zu versuchen!
actors.mobs.npcs.blacksmith.def_verb=geblockt
actors.mobs.npcs.blacksmith.desc=Der Techniker vom Netzbetreiber, auf den das ganze Haus seit zwei Jahren wartet: Termin zwischen 8 und 18 Uhr, das Jahr stand nicht dabei. Jetzt ist er tatsächlich da, mit Messgerät, Weste ohne Logo und einem Block Karten mit dem Aufdruck „Wir haben Sie leider nicht angetroffen“.

actors.mobs.npcs.ghost.name=Dagebliebener Schwabe
actors.mobs.npcs.ghost.rat_1=Grüß Gott, %s! Du siehst mich? Des isch schön. Alle meine Freunde sind über Weihnachten zu ihren Eltern gfahren, nur i bin dageblieben. Seitdem bin i a bissle durchsichtig. Und jetzt hockt die _verfaulende Pfandratte_ in meinem Kellerabteil, mitten in der Mülltrennung. Mach sie platt, gell? Vorher trau i mich net zu meinem Gelben Sack.\n\n_Hüte dich vor ihrer Stinkwolke und ihrem ätzenden Biss. Die Säure löst sich im Wasser auf._
actors.mobs.npcs.ghost.rat_2=Bitte, hilf mir. Der Hausmeister kommt erst nach Dreikönig wieder.\n\n_Kämpf nah am Wasser. Meide den Gestank._
actors.mobs.npcs.ghost.gnoll_1=Grüß Gott, %s! Du siehst mich? Des isch schön. Über die Feiertage sind alle heimgfahren, i bin dageblieben, und im Treppenhaus grüßt keiner zurück. Seitdem werd i immer durchsichtiger. Der _Abstandswicht_ hat mir meinen Christbaumständer abgeknöpft und will 300 Euro Abstand dafür. Mach ihn platt, gell? Der Ständer hat 4,99 kostet.\n\n_Er ist nicht wie die anderen Wichte: Er versteckt sich und wirft mit Pfeilen. Hüte dich vor seinen Gift- und Brandpfeilen und kämpf nicht aus der Ferne._
actors.mobs.npcs.ghost.gnoll_2=Bitte, hilf mir. Ohne Ständer steht der Baum schief, und des halt i net aus.\n\n_Lass dich nicht treffen. Geh nah an ihn ran._
actors.mobs.npcs.ghost.crab_1=Grüß Gott, %s! Du siehst mich? Des isch schön. Ganz Berlin isch über Weihnachten bei den Eltern, nur i bin dageblieben. So allein war i no nie. Man sieht scho durch mich durch. Der _große Kanalpanzer_ hockt vor den Mülltonnen, und i hab diese Woch Kehrwoche. Mach ihn platt, gell? Sonst bleibt der Hof dreckig.\n\n_Das Viech ist uralt, mit riesiger Schere und dickem Panzer. Hüte dich vor der Schere: Du musst ihn überraschen, sonst blockt er damit._
actors.mobs.npcs.ghost.crab_2=Bitte, hilf mir. Die Kehrwoche wartet net.\n\n_Er blockt immer, wenn er dich kommen sieht._
actors.mobs.npcs.ghost.find_me=Danke! Komm zu mir an den Kellereingang. I bin der, durch den man durchschaut.
actors.mobs.npcs.ghost.desc=Ein Schwabe im Norwegerpulli mit kleinem Rentier, eine Tupperdose Spätzle in der Hand, halb durchsichtig. Er ist über Weihnachten ausnahmsweise nicht heimgefahren, und seit seine Berliner Freunde bei ihren Eltern sind, hat ihn niemand mehr gegrüßt. Inzwischen sieht man den Hinterhof durch ihn hindurch. In Berlin gilt das als angekommen.

actors.mobs.npcs.imp.name=Ehrgeiziger Filialist
actors.mobs.npcs.imp.old_intro=Bist du zufällig freiberuflich? Ich liebe Freiberufliche! Immer da, wenn was weg muss. Abgerechnet wird natürlich auf Provisionsbasis.
actors.mobs.npcs.imp.old_golems_1=In meinem Fall müssten _Umzugsgolems_ weg. Weißt du, ich will hier eine kleine Späti-Filiale eröffnen, aber diese dummen Golems sind schlecht fürs Geschäft! Mit einem wandelnden Granitklumpen kann man keinen Gewerbemietvertrag verhandeln, verdammt nochmal! Also, bitte, erledige... sagen wir, _4 von ihnen_, und die Belohnung gehört dir.
actors.mobs.npcs.imp.old_monks_1=In meinem Fall müssten _Concierge-Mönche_ weg. Weißt du, ich will hier eine kleine Späti-Filiale eröffnen, aber diese Irren kaufen selbst nichts und verscheuchen mir die Laufkundschaft. Also, bitte, erledige... sagen wir, _5 von ihnen_, und die Belohnung gehört dir.
actors.mobs.npcs.imp.old_golems_2=Na, wie läuft deine Golem-Safari? Vergiss nicht, die Eigentümermarken einzusammeln.
actors.mobs.npcs.imp.old_monks_2=Oh, du lebst noch! Ich wusste, dein Kung-Fu ist stärker als ihre Hausordnung. Vergiss nicht, ihnen die Eigentümermarken abzunehmen. Ohne Beleg keine Provision.
actors.mobs.npcs.imp.cya=Bis bald, %s! Bewerte uns gern. Fünf Sterne, sonst Fluch.
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.quest_intro_1=Oh hallo! Suchst du zufällig einen Nebenjob? Ich liebe Leute mit Nebenjob. Die sind immer verfügbar, gegen angemessene Vergütung natürlich.\n\nDirekt unter uns liegt die Ilse, der letzte Club im Quartier. Die Eigentümer lassen sie noch laufen, bis der Bauantrag für die Eventfläche durch ist. Im VIP-Bereich steht eine Statuette, die ich unbedingt haben will. Nein, nicht als Wertanlage. Das unterscheidet uns.\n\nDer Club ist aber voller Personal, Lichtanlagen und Leute, die seit Freitag nicht nach Hause gegangen sind. Ich könnte Hilfe gebrauchen!
actors.mobs.npcs.imp.quest_intro_2=An der Tür heißt es immer nur "Heute nicht." Mit einem Zauber, den ich vorbereitet habe, kann ich dich direkt hineinteleportieren, aber _deine Ausrüstung kann ich nicht mitteleportieren._ Im Club liegt aber genug herum, das dir weiterhilft! _Am besten gehst du den Leuten dort anfangs aus dem Weg und suchst nach Sachen, die weniger gut bewacht sind._\n\nIch kann dich mit zwei Gegenständen zurückholen. Einer davon ist meine Statuette, der andere kann _alles aus dem Club sein, was dir gefällt!_\n\nIch habe auch selbst ein paar Wertsachen gesammelt, die dich interessieren könnten! Wenn du mir hier hilfst, _eröffne ich weiter unten eine Filiale_, und wir kommen ins Geschäft.
actors.mobs.npcs.imp.quest_in_progress=Stell dich einfach in die Mitte der Kellertreppe, wenn du bereit bist, dann teleportiere ich dich hinein.
actors.mobs.npcs.imp.enter_text=Bereit? Ich passe hier oben auf deine Sachen auf, _du bekommst alles zurück, wenn du wiederkommst._ Ehrenwort unter Kleingewerbetreibenden.\n\nNimm aber diesen _Hoodie_ und dieses _Exit-Bändchen_ mit. Benutze das Bändchen, wenn du meine Statuette hast. ...Na gut, _du kannst es auch früher benutzen, wenn du in Schwierigkeiten steckst_, aber dann erwarte nicht die volle Belohnung!\n\nDie Leute da unten sind seit Freitag auf den Beinen und entsprechend träge. Es sollte leicht sein, unentdeckt zu bleiben, vor allem, _wenn du dich hinter der Richtung hältst, in die sie gerade laufen._ Falls dich doch jemand sieht, _sollte er dich nicht verfolgen, wenn er dich nur kurz sieht._ Wenn du aufmerksam bist, kannst du wahrscheinlich auch _Schritte in der Nähe hören._\n\nUnd sammle die _7 Garderobenmarken_ ein. Ohne alle 7 gibt die Garderobe nichts heraus.
actors.mobs.npcs.imp.quest_completed_bad=Na ja, danke, dass du es versucht hast.\n\nDer Teleportzauber für die Ilse braucht sehr lange, bis er wieder bereit ist. Du solltest also weiterziehen. Ich trage es als "Learning" ein.
actors.mobs.npcs.imp.quest_completed_good=Danke für deine Hilfe!\n\nIch brauche etwas Zeit, um meinen Teleportzauber wieder vorzubereiten, und ich muss mit deinen Informationen noch ein bisschen planen.\n\nIch packe zusammen, und wir sehen uns ein paar Ebenen tiefer in Filiale zwei. Umsonst gibt es da leider nichts. Ich bin ein Konzern in der Seed-Phase.
actors.mobs.npcs.imp.quest_completed_great=Großartige Arbeit da unten, vielen Dank!\n\nIch habe hier alles, was ich brauche. Ich packe zusammen, und wir sehen uns ein paar Ebenen tiefer in Filiale zwei. Rabatt gibt es trotzdem keinen, Wachstum kostet.\n\nWas an der Statuette so wichtig war? Nicht das, was du denkst, eigentlich ist sie ziemlich gewöhnlich. Sie stammt aus einem Kiez, den es nicht mehr gibt, vielleicht ist sie die letzte ihrer Art. Wenn diese gierigen Eigentümer sie nicht als Deko in ihren VIP-Bereich gestellt hätten, wäre sie wohl mit allem anderen abgerissen worden...
actors.mobs.npcs.imp.enter_yes=In die Ilse hinabsteigen
actors.mobs.npcs.imp.enter_no=Hierbleiben
actors.mobs.npcs.imp.desc=Dieser kleine rote Kerl sieht aus wie ein Wicht, trägt aber ein Firmen-Lanyard mit der Aufschrift "Späti Next Level, Filialleitung". Die Kette besteht bisher nur aus ihm. Wichte sind niedere Dämonen, bekannt für ihren Verstand, nicht für ihre Kraft.\n\nVon Dämonen hast du bisher nur in alten Geschichten gehört, gleich neben bezahlbaren Altbauwohnungen. Du hast nie einen Beweis gesehen, dass es sie gibt, aber dieser Wicht ist eindeutig echt und freut sich sehr, dich zu sehen.

actors.mobs.npcs.impshopkeeper.name=Ehrgeiziger Filialist
actors.mobs.npcs.impshopkeeper.greetings=Hallo, %s! Willkommen in Filiale zwei!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Was hast du getan, %s? Schnell kaufen, die Filiale wird gerade abgewickelt!
actors.mobs.npcs.impshopkeeper.thief=Ich dachte, wir hätten eine Vertrauensbasis! Dafür gibt's einen Stern. Einen!
actors.mobs.npcs.impshopkeeper.buyback=Der Filialist gibt dir den Gegenstand fröhlich pfeifend zurück.
actors.mobs.npcs.impshopkeeper.desc=Der Filialist hat an der Grenze zu den Hallen unter dem Rathaus seine zweite Späti-Filiale eröffnet. Kühlschrankleuchten, Kaugummiregal, ein Schild "Kartenzahlung ab 100 Euro. Kein Wechselgeld für Dämonen". Es ist schön, hier ein freundliches Gesicht zu sehen, aber die Preise sind Lagezuschlag pur.

actors.mobs.npcs.mirrorimage.name=Spiegelbild
actors.mobs.npcs.mirrorimage.desc=Diese Illusion sieht dir sehr ähnlich, sie scheint sogar deine aktuelle Rüstung und Waffe zu tragen.\n\nSpiegelbilder suchen nach Feinden und greifen diese mit ihren imitierten Waffen an, welche sich genauso verhalten wie deine, aber weniger Schaden anrichten. Zuerst sind sie fast unsichtbar, aber um angreifen zu können, müssen Spiegelbilder eine feste Form annehmen.\n\nObwohl sie viel Schaden austeilen können, halten Spiegelbilder nicht lange durch und verblassen, sobald sie getroffen werden.
actors.mobs.npcs.mirrorimage.discover_hint=Du kannst diesen Charakter mit einer bestimmten Schriftrolle finden.

actors.mobs.npcs.npc.discover_hint=Du findest diesen Charakter in einer bestimmten Region unter Neukölln.

actors.mobs.npcs.prismaticimage.name=Lichtbrechung
actors.mobs.npcs.prismaticimage.desc=Diese glitzernde Illusion sieht dir sehr ähnlich, sie scheint sogar deine derzeitige Waffe und Rüstung zu tragen.\n\nPrismatische Abbilder versuchen, die Aufmerksamkeit der Feinde auf sich zu lenken und setzen ihre verbesserte Verteidigung und Gesundheit dazu ein, dich zu schützen. Sie verfügen zwar nicht über die gleiche Schlagkraft wie Spiegelbilder, so aber doch über bessere Ausdauer und profitieren auch von den Vorteilen deiner Rüstung.\n\nWenn ihre Lebenspunkte auf 0 fallen, verblassen sie über mehrere Züge und können in dieser Zeit immer noch geheilt werden. Wenn keine Feinde zugegen sind, verblassen die Abbilder und finden zu ihrem Herrn zurück.
actors.mobs.npcs.prismaticimage.discover_hint=Du kannst diesen Charakter mit einer bestimmten Schriftrolle finden.

actors.mobs.npcs.ratking.name=Pfandkönig
actors.mobs.npcs.ratking.not_sleeping=Ich schlafe nicht! Ich sortiere Leergut mit geschlossenen Augen!
actors.mobs.npcs.ratking.what_is_it=Was ist? Audienzen nur dienstags. Heute wird Leergut sortiert, und das ist Staatsgeschäft!
actors.mobs.npcs.ratking.confused=Wa... Wo bin ich? Mein Königreich braucht mich! Wer hat die Mehrwegkisten umgestellt?
actors.mobs.npcs.ratking.crown_clothes=Zieh dir was an! In dem Aufzug sagt dir sogar der Türsteher vom Bärghain "Heute nicht". Und ich bin strenger.
actors.mobs.npcs.ratking.crown_desc=Oooh, ist diese Krone für mich? Sie glänzt viel mehr als meine Kronkorkenkrone, darum werde ich sie gnädigerweise annehmen!\n\nTatsächlich gedenke ich sogar, dir eine Belohnung für diese Krone anzubieten. Eine ungeheure Macht, die eines Helden wie dir angemessen ist! Würde dir das gefallen?
actors.mobs.npcs.ratking.crown_yes=Selbstverständlich!
actors.mobs.npcs.ratking.crown_info=Erzähle mir erstmal mehr.
actors.mobs.npcs.ratking.crown_no=Lieber doch nicht...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, vielen Dank! Jetzt geh' und mach deinen König stolz! Und bring Leergut mit!
actors.mobs.npcs.ratking.crown_fine=Wohlan! Es ist ja nicht so, dass ich sie wollte... Die war eh nur vergoldet...
actors.mobs.npcs.ratking.crown_after=Freust du dich über deine neue Rüstung? Keine Rücknahme! Das hier ist kein Pfandautomat!
actors.mobs.npcs.ratking.desc_crown=Diese Ratte ist etwas größer als eine gewöhnliche Pfandratte. Sie trägt die Krone des Königs der Eigentumswohnungen auf dem Kopf und sieht damit zum ersten Mal aus wie ein Immobilienbesitzer.
actors.mobs.npcs.ratking.desc_birthday=Diese Ratte ist etwas größer als eine gewöhnliche Pfandratte. Sie trägt einen klitzekleinen grünen Partyhut anstelle der üblichen Kronkorkenkrone. Alles Gute zum Geburtstag, Pfandkönig!
actors.mobs.npcs.ratking.desc_winter=Diese Ratte ist etwas größer als eine gewöhnliche Pfandratte. Sie trägt eine klitzekleine Glühweinmütze anstelle der üblichen Kronkorkenkrone. Schöne Feiertage! Die Glühweinbecher sind natürlich Pfand.
actors.mobs.npcs.ratking.desc=Diese Ratte ist etwas größer als eine gewöhnliche Pfandratte. Sie trägt eine klitzekleine Krone aus Kronkorken und herrscht über ein Reich aus Mehrwegkisten. Den Pfandautomaten im Späti erkennt sie nicht als Autorität an.
actors.mobs.npcs.ratking.discover_hint=Du findest diesen Charakter am Ende einer bestimmten Region unter Neukölln.

actors.mobs.npcs.sheep.name=Schaf
actors.mobs.npcs.sheep.baa!=Bäh!
actors.mobs.npcs.sheep.baa?=Bäh?
actors.mobs.npcs.sheep.baa.=Bäh.
actors.mobs.npcs.sheep.baa...=Bäh...
actors.mobs.npcs.sheep.def_verb=geblockt
actors.mobs.npcs.sheep.desc=Dies ist ein magisches Schaf. Was daran so magisch sein soll? Du kannst es nicht töten. Es wird einfach stehenbleiben, sein Futter wiederkäuen und sein sorgenfreies Leben genießen, bis es wie durch Zauberhand verschwindet. Das Grünflächenamt hält es für eine Pilotphase.
actors.mobs.npcs.sheep.discover_hint=Du kannst diesen Charakter mit einem bestimmten Gegenstand oder einer bestimmten Falle finden.

actors.mobs.npcs.shopkeeper.name=Spätimann
actors.mobs.npcs.shopkeeper.thief=Dieb. Bei meinen Preisen. Respekt eigentlich. Trotzdem Ladenschluss.
actors.mobs.npcs.shopkeeper.warn=Letzte Warnung. Die Kamera ist 'ne Attrappe. Das Hausverbot ist echt.
actors.mobs.npcs.shopkeeper.flee=Der Rollladen knallt runter, der Händler ist weg. Am Schild steht "Bin gleich zurück". Das stimmt nicht.
actors.mobs.npcs.shopkeeper.sell=Verkaufe einen Gegenstand
actors.mobs.npcs.shopkeeper.talk=Unterhalten
actors.mobs.npcs.shopkeeper.buyback=Der Spätimann gibt dir den Gegenstand widerwillig zurück. Ohne Pfand.
actors.mobs.npcs.shopkeeper.talk_prison_intro=Na. Ooch zum Amt? Ick kauf an, ick verkauf. Dit is hier der einzige Schalter, der offen hat.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Dich kenn ick doch. Wie immer? Schrippe, Wegbier und dit Gefühl, dass früher allet besser war. Dit Letzte is gratis.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Firmenkreditkarte? Nee, Kollege. Pitch ooch nich. Münzen.
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Nee, dit is keene Immersive Experience. Ja, die Monster sind echt. Und nee, Fotos vom Laden kosten extra.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Sechs Jahre im Kiez? Dann biste nich mehr neu. Dann biste Inventar mit Jutebeutel.
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Na, reisende Heldin? Städte retten kannste später. Erst ma wat kaufen, und bitte nich direkt vor meiner Tür sterben.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Na, Hochwürden? Beten hilft hier unten wenig. Heiltrank hilft mehr. Kostet ooch mehr.
actors.mobs.npcs.shopkeeper.talk_caves=Ebene elf. Bauwagen statt Kantine, gleicher Service. Karte geht ooch hier erst ab zehn. Dit Lesegerät hat der Bohrer jefressen.\n\nWenn du den Netztechniker triffst: Der hat bei mir ooch 'n Termin. Zwischen acht und achtzehn Uhr. Seit zwei Jahren.
actors.mobs.npcs.shopkeeper.talk_city=Ebene sechzehn. Unten droht die Apokalypse, oben steigt die Gewerbemiete. Irgendwo musste ick ja hin.\n\nDer März war hier. Hat vorm Laden 'n Foto gemacht, ernster Blick, Hand am Kühlschrank, "nah an den Menschen". Gekauft hat er nix. Die Einkaufstüte hatte er mitgebracht.
actors.mobs.npcs.shopkeeper.talk_halls=Na, Dämonenjäger? Für euch gibt's Sonderpreise. Sonder heißt nicht niedrig.\n\nUnd pass auf da unten. Die Dämonen sind schlimmer als alles in der Ilse, und da unten gibt's kein Exit-Bändchen, das dich rausholt. Tote Kundschaft kauft nicht nach.\n\nOb die Dämonen so sind wie ich? Nein. Ich bin Kleinunternehmer und habe meinen Verstand behalten. Die da unten arbeiten alle für den Mietspiegel.
actors.mobs.npcs.shopkeeper.talk_ascent=Unbefristeter Mietvertrag? Dann ist heute früher Ladenschluss. Kaufen, zahlen, raus. Wir müssen hier beide weg.
actors.mobs.npcs.shopkeeper.desc=Der Spätimann führt die letzte funktionierende Infrastruktur unter Neukölln und ist hier unten der Einzige, der zuständig ist. Auf den Ebenen 6, 11 und 16 kauft er deine Fundstücke an und verkauft Vorräte.\n\nEr weiß, was unten lauert. Er weiß auch, dass du neun Euro fünfzig hast. Karte geht erst ab zehn.

actors.mobs.npcs.wandmaker.name=Ewiger Antragsteller
actors.mobs.npcs.wandmaker.intro_warrior=Oh, seien Sie gegrüßt! Eine Alteingesessene, hier im Amt! Welch angenehme Überraschung an diesem deprimierenden Ort. Sie haben sicher auch seit der Wende keinen Termin mehr bekommen. Wenn Sie Zeit haben, und die hat hier jeder, hätte ich vielleicht eine Aufgabe für Sie.
actors.mobs.npcs.wandmaker.intro_rogue=Du meine Güte, haben Sie mich erschreckt! Ein Tourist, hier im Wartebereich? Das steht in keinem Reiseführer. Ich hätte eine Aufgabe für Sie. Die Wartenummer dürfen Sie als Souvenir behalten.
actors.mobs.npcs.wandmaker.intro_mage=Oh, hallo %s! Sie warten auch auf die Ausländerbehörde? Ich warte hier seit 1994. Dann sind Sie jetzt wirklich integriert.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, hallo! Ein freundliches Gesicht in dieser Tiefe. Moment, Sie kommen mir bekannt vor. Wohnen Sie nicht in meiner alten Wohnung? Für das Dreifache? Grüßen Sie die Dielen.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, hallo, meine Dame! Welch angenehme Überraschung, in dieser deprimierenden Umgebung einer Heldin zu begegnen! Wenn Sie gewillt wären, einem alten Mann zu helfen, hätte ich eine Aufgabe für Sie.
actors.mobs.npcs.wandmaker.intro_cleric=Oh, hallo, Eure Heiligkeit! Welch freudige Überraschung, Sie an einem solch bedrückenden Ort zu treffen. Ich mag es nicht, jemandem etwas aufzubürden, aber ich hätte da wahrscheinlich eine Aufgabe für Sie.
actors.mobs.npcs.wandmaker.intro_1=\n\nIch bin hier, um eine seltene Zutat für einen Zauberstab zu finden. Eigentlich wollte ich nur meinen Personalausweis verlängern. Dann habe ich mich verlaufen, meine Wartenummer ist abgelaufen, und mein magischer Schutzschild wird schwächer. Ich muss bald hier raus, aber ohne irgendetwas nach Hause gehen? Das wäre das vierte Mal.
actors.mobs.npcs.wandmaker.intro_dust=Ich suche nach _Leichenstaub._ Das ist eine besondere Art verfluchter Knochen, die man an Orten wie diesem findet, wo Menschen zu lange gewartet haben. Hier müsste irgendwo ein verbarrikadierter Raum sein, vermutlich das Archiv. Dort gibt es solchen Staub bestimmt. Seien Sie aber vorsichtig, der Fluch darauf ist ziemlich mächtig, also _kommen Sie so schnell wie möglich zurück,_ damit ich den Staub reinigen kann.
actors.mobs.npcs.wandmaker.intro_ember=Ich suche nach _frischer Asche_ von einem neugeborenen Feuerelementar. Elementare entstehen normalerweise, wenn ein Beschwörungsritual außer Kontrolle gerät. Hier im Amt ist das schon mal mit einem Heizkostenbescheid passiert. Suchen Sie einfach ein paar Kerzen und einen Ritualplatz, Sie bekommen bestimmt eins herbeigerufen. Passen Sie aber auf, dass Sie sich beim Kampf _nicht Ihre Rückzugsmöglichkeiten nehmen,_ oder halten Sie _etwas bereit, das Frost erzeugen kann._ Neugeborene Elementare sind recht stark und chaotisch, aber Kälte können sie nicht leiden.
actors.mobs.npcs.wandmaker.intro_berry=Die frühere Amtsleiterin hat hier eine _Faulbeere_ als Büropflanze gezüchtet, und ich brauche die Samen dieser Pflanze. Seit ihrer Pensionierung gießt sie keiner mehr, außer mit Kaffeeresten, und inzwischen muss sie außer Rand und Band sein. Diese Aufgabe braucht also Fingerspitzengefühl. Der Garten sollte hier irgendwo in der Nähe sein. Versuchen Sie, _Abstand von den Ranken zu halten,_ wenn Sie nicht in kleine Stückchen geschnitten werden möchten. Alles anzuzünden wirkt verlockend, aber bitte lassen Sie das, es vernichtet die gesamte Pflanze samt Samen.
actors.mobs.npcs.wandmaker.intro_2=\n\nWenn Sie mir das besorgen, belohne ich Sie mit einem meiner ausgezeichneten Zauberstäbe. Ich habe zwei mitgebracht, Sie dürfen sich einen aussuchen und behalten. Ganz ohne Antrag. Sagen Sie es bitte niemandem.
actors.mobs.npcs.wandmaker.reminder_dust=Haben Sie den Leichenstaub gefunden, %s? Suchen Sie nach verbarrikadierten Räumen.
actors.mobs.npcs.wandmaker.reminder_ember=Haben Sie die Asche gefunden, %s? Sie brauchen vier Kerzen und einen Ritualplatz.
actors.mobs.npcs.wandmaker.reminder_berry=Haben Sie einen Faulbeersamen gefunden, %s? Suchen Sie nach einem Raum, der vollständig zugewuchert ist.
actors.mobs.npcs.wandmaker.def_verb=geblockt
actors.mobs.npcs.wandmaker.desc=Dieser alte, aber noch rüstige Herr hält eine vergilbte Wartenummer in der Hand: 0816. Ein magischer Schutzschild umgibt ihn.\n\nDie Anzeigetafel zeigt 0815, und das seit Jahrzehnten. Er ist als Nächstes dran.



##vault quest
actors.mobs.quest.vault.vaultbosselemental.name=Anlage vom Mainfloor
actors.mobs.quest.vault.vaultbosselemental.rankings_desc=Von der Anlage vom Mainfloor weggeblasen
actors.mobs.quest.vault.vaultbosselemental.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.
actors.mobs.quest.vault.vaultbosselemental.desc=Boxen, Scheinwerfer, Nebelkanonen und Pyrotechnik, zu einem einzigen Turm verschraubt und von niemandem mehr bedient. Gesteuert wird die Show anscheinend vom riesigen Bodenlogo darunter. Dadurch kann die Anlage _den Modus wechseln!_ Jeder Modus hat eigene Angriffe, Resistenzen und Schwächen.
actors.mobs.quest.vault.vaultbosselemental.desc_fire=Die Anlage läuft gerade im _Pyro-Modus_. In diesem Modus verschießt sie Feuerbälle und schickt Flammenwellen über den Floor. Sie zielt mit den Feuerbällen in die Richtung, in die du dich bewegst, und die Flammenwellen haben immer eine Lücke. Trifft dich eins von beiden, wirst du _in Brand gesetzt_.\n\nIn diesem Modus ist sie _resistent gegen Magie_, die das Feuer nur weiter anheizt. Ihren glühenden Kern könnte man aber wohl leicht mit _Wurfwaffen_ treffen.
actors.mobs.quest.vault.vaultbosselemental.fire_resist=Die Flammen wachsen, als die Anlage den Großteil deines Magieangriffs schluckt!
actors.mobs.quest.vault.vaultbosselemental.fire_weak=Deine Wurfwaffe trifft den Kern der Anlage und verursacht zusätzlichen Schaden!
actors.mobs.quest.vault.vaultbosselemental.desc_frost=Die Anlage läuft gerade im _CO2-Modus_. In diesem Modus bläst sie einen schwenkenden Kältekegel und einen Wirbel aus wandernder Eisluft über den Floor. Mit gutem Timing kann man beiden Angriffen ausweichen, aber der Kegel ist auf Entfernung besonders tödlich. Trifft dich eins von beiden, _frierst du ein_.\n\nIn diesem Modus ist sie außerdem _resistent gegen Wurfwaffen_, die an ihrer Reifschicht kleben bleiben. Die Reifschicht sieht aber nicht besonders stabil aus, ein Treffer mit einer _Nahkampfwaffe_ dürfte also besonders viel Schaden anrichten.
actors.mobs.quest.vault.vaultbosselemental.frost_resist=Die Wurfwaffe bleibt an der Reifschicht der Anlage kleben!
actors.mobs.quest.vault.vaultbosselemental.frost_weak=Dein Nahkampftreffer zerschlägt einen Teil der Reifschicht und verursacht zusätzlichen Schaden!
actors.mobs.quest.vault.vaultbosselemental.desc_shock=Die Anlage läuft gerade im _Strobo-Modus_. In diesem Modus feuert sie einen Blitz auf deine Position oder schickt Funkenlinien von den Seiten des Floors. Diesen Angriffen kann man etwas leichter ausweichen, aber sie setzt sie häufiger ein. Trifft dich eins von beiden, wirst du _kurzzeitig betäubt_.\n\nIn diesem Modus ist sie außerdem _resistent gegen Nahkampfangriffe_, die dir einen schmerzhaften Schlag verpassen. Das elektrische Feld um die Anlage wird aber durch _Magie_ gestört, was zusätzlichen Schaden verursacht.
actors.mobs.quest.vault.vaultbosselemental.shock_resist=Als du zuschlagen willst, bekommst du einen schmerzhaften Schlag!
actors.mobs.quest.vault.vaultbosselemental.shock_weak=Die Magie stört das elektrische Feld der Anlage und verursacht zusätzlichen Schaden!

actors.mobs.quest.vault.vaultdm100.name=Strobo-Automat
actors.mobs.quest.vault.vaultdm100.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.
actors.mobs.quest.vault.vaultdm100.desc=Diese DM-100 sehen fast genauso aus wie die Aufrufautomaten aus dem Amt, nur blitzt ihr Auge im Takt. Jemand hat sie zur Lichtanlage umgebaut, die Wartenummer zeigen sie trotzdem noch an.\n\nSie verhalten sich genau wie normale DM-100. _Sie schleudern weiterhin Blitze auf Entfernung_, und der Umbau macht sie etwas robuster.

actors.mobs.quest.vault.vaultdm200.name=Nebelmaschine auf Ketten
actors.mobs.quest.vault.vaultdm200.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.
actors.mobs.quest.vault.vaultdm200.desc=Dieses DM-200 von der Baustelle wurde zur Nebelmaschine umgebaut und rollt jetzt über den Floor. Der Nebel riecht nach Erdbeere und Baustaub.\n\nGenau wie das Original ist es _zu groß für enge Räume_ und _stößt weiterhin giftiges Gas aus_.

actors.mobs.quest.vault.vaultrat.desc=Diese Pfandratte hat ein etwas verändertes Verhalten, um die Feind-KI in der Schatzkammer zu testen:\n_-_ Man kann ihre Bewegungen durch die Wand "hören".\n_-_ Sie patrouilliert entlang einer vorgegebenen Route.\n_-_ Während sie patrouilliert, hat sie rückseitig eine drastisch eingeschränkte Reichweite, innerhalb der sie etwas bemerken kann.\n_-_ Die Reichweite, innerhalb der sie etwas bemerkt, ist im Schlaf ebenso reduziert.\n_-_ Wenn sie dich bemerkt, wird sie dich zunächst "untersuchen", bevor sie zur Verfolgung übergeht. "Untersuchende" Gegner bewegen sich auf dich zu, greifen aber nicht an, und sie verlieren deine Fährte leichter hinter Türen und Ecken.

actors.mobs.quest.vault.vaultskeleton.name=Schlangensteher
actors.mobs.quest.vault.vaultskeleton.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.
actors.mobs.quest.vault.vaultskeleton.desc=Er stand schon in der Schlange, als hier unten noch Kohlen lagen. Irgendwann hat ihn der Türsteher reingewunken, aus Mitleid.\n\nEr verhält sich genau wie ein normaler ewig Wartender und _zerplatzt beim Tod in Knochensplitter_. Der Bart, den er sich beim Warten hat wachsen lassen, schützt ihn etwas besser.

actors.mobs.quest.vault.vaultshaman.name=Warm-up-DJ
actors.mobs.quest.vault.vaultshaman.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.
actors.mobs.quest.vault.vaultshaman.desc=Diese Gutachter von der Baustelle stehen jetzt hinter Plattentellern, die Kopfhörer sitzen eng wie eine Maske. Welchen Track sie als Nächstes spielen, weiß niemand. Sie selbst auch nicht.
actors.mobs.quest.vault.vaultshaman.spell_desc=Diese DJs beschießen dich weiterhin mit Magie, aber ohne farbigen Helm lässt sich _nicht erkennen, welche Art von Magie_ sie einsetzen. Die Kopfhörer schützen sie etwas besser als ein Helm, und hinter ihren Angriffen steckt deutlich mehr Kraft als bei einem normalen Gutachter.



###mobs
actors.mobs.acidic.name=ätzender Mahnbescheid-Skorpion
actors.mobs.acidic.desc=Diese riesigen, spinnenartigen Dämonen aus der Rechtsabteilung unter dem Rathaus meiden den Nahkampf. Sie schießen lieber verkrüppelnde, zahnbesetzte Stacheln aus großer Entfernung, gern mit Fristsetzung. Dieser hier trieft zusätzlich vor zersetzendem Schlamm.

actors.mobs.albino.name=Albino-Pfandratte
actors.mobs.albino.desc=Eine seltene Pfandratte mit schneeweißem Fell und gezackten Zähnen. Die Galerie im ehemaligen Kiosk hat sie drei Wochen lang ausgestellt, als Installation „Weiß auf Grau“.\n\nIhre Bisse können Blutungen verursachen.
actors.mobs.albino.discover_hint=Du findest diesen seltenen Gegner in einer bestimmten Region im Untergrund.

actors.mobs.armoredstatue.name=gepanzerte Kunst-am-Bau-Statue
actors.mobs.armoredstatue.desc=Wären da nicht diese beunruhigend rot leuchtenden Augen, könnte man sie für ein weiteres Kunst-am-Bau-Projekt halten, das 1 Prozent der Baukosten verschlungen hat.\n\nDank der Rüstung, die sie trägt, ist sie in hervorragender Verfassung. Sie zu besiegen könnte sehr schwer werden.
actors.mobs.armoredstatue.desc_arm_wep=Die Statue selbst ist aus Stein, aber _%1$s_ und _%2$s_, die sie bei sich trägt, sehen sehr echt aus.

actors.mobs.bandit.name=Nummernhehler
actors.mobs.bandit.desc=Ein Elite-Nummernklauer im anthrazitfarbenen Maßanzug mit lila Einstecktuch. Er handelt mit gestohlenen Wartenummern und hat trotz seines größeren Könnens genauso vergessen, worauf er eigentlich wartet, wie die gewöhnlichen Klauer.\n\nNummernhehler bestehlen dich nicht nur, sondern blenden, verkrüppeln und vergiften dich auch kurzzeitig! Dafür tragen sie viel häufiger zusätzliche Beute bei sich als gewöhnliche Nummernklauer.

actors.mobs.bat.name=Schachtvampir
actors.mobs.bat.desc=Diese flinken, hartnäckigen Fledermäuse hängen in den U-Bahn-Schächten der ewigen Baustelle und sind weit gefährlicher, als sie aussehen. Mit jedem erfolgreichen Angriff saugen sie Lebensenergie ab, genau wie der Bauherr die Fördermittel. So können sie weit größere Gegner besiegen.

actors.mobs.bee.name=Dachgarten-Biene
actors.mobs.bee.desc_honey=Trotz ihrer geringen Größe verteidigen Dachgarten-Bienen ihr Zuhause bis aufs Blut. Diese hier ist aber besänftigt und scheint dir folgen zu wollen. Vermutlich hält sie dich für ein Urban-Gardening-Projekt.
actors.mobs.bee.desc=Trotz ihrer geringen Größe verteidigen Dachgarten-Bienen ihr Zuhause erbittert. Sie gehört einem Bio-Imker vom Dach nebenan, und sie ist sehr wütend. Bleib lieber auf Distanz.
actors.mobs.bee.discover_hint=Du kannst diesen Charakter mit einem bestimmten Gegenstand finden.

actors.mobs.brute.name=Bautrupp-Grobian
actors.mobs.brute.enraged=rasend
actors.mobs.brute.def_verb=geblockt
actors.mobs.brute.desc=Grobiane sind die größten, stärksten und zähesten Wichte im Bautrupp. Sie tragen Helm, aber aus Prinzip nie richtig. Wenn sie tödlich verletzt sind, verfallen sie in Raserei, wodurch sie kurzzeitig einen Schild erhalten und weit mehr Schaden zufügen.
actors.mobs.brute$bruterage.name=Grobian-Raserei
actors.mobs.brute$bruterage.desc=Dieser Bautrupp-Grobian ist tödlich verletzt, will dich aber mit in den Feierabend reißen!\n\nDer Grobian stirbt, sobald sein Schild abgelaufen ist, entweder mit der Zeit oder durch zugefügten Schaden. Bis dahin fügt er erheblich mehr Schaden zu, pass also auf!\n\nVerbleibende Züge mit Schild: %d.

actors.mobs.causticslime.name=ätzender Abflussschleim
actors.mobs.causticslime.desc=Dieser Abflussschleim wurde von der dunklen Magie aus der Tiefe verdorben, oder vom Fettabscheider unter der Designer-Burgerbraterei im Neubau. Er hat seine grüne Farbe verloren, und ätzender Schlamm tropft von ihm herunter.
actors.mobs.causticslime.discover_hint=Du findest diesen seltenen Gegner in einer bestimmten Region im Untergrund.

actors.mobs.crab.name=Kanalpanzer
actors.mobs.crab.desc=Eine riesige Krabbe aus dem Neuköllner Untergrund. Sie ist extrem schnell, gut gepanzert und kennt offenbar eine Abkürzung. Die Hausverwaltung nennt sie standorttypische Fauna.

actors.mobs.crystalguardian.name=Kristallwächter
actors.mobs.crystalguardian.def_verb=geblockt
actors.mobs.crystalguardian.desc=Diese großen, kristallinen Wächter sähen fast aus wie Deko aus einem Loft-Showroom, wären da nicht die hell strahlenden Augen. Der verhärtete Kristall macht sie zwar träge, aber sehr robust. Es wäre also besser, _sie so lange wie möglich in ihrem Kristallnest schlafen zu lassen._\n\nIn engen Räumen bewegen sich Kristallwächter wegen ihrer Größe sehr viel langsamer. Außerdem sind sie so widerstandsfähig, dass sie nicht endgültig getötet werden können. Man kann sie niederschlagen und so eine Zeit lang ausschalten, aber nach einer Weile stehen sie einfach wieder auf. Wie jedes Bauprojekt in dieser Stadt.
actors.mobs.crystalguardian.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.crystalmimic.name=Vitrinenmonster
actors.mobs.crystalmimic.ate=Die Vitrine hat dein %s gefressen!
actors.mobs.crystalmimic.escaped=Das Vitrinenmonster ist entkommen!
actors.mobs.crystalmimic.desc=Sperrmüllmonster sind magische Wesen, die jede beliebige Gestalt annehmen können. Hier unten sehen sie fast immer aus wie Sperrmüllberge, um arglose Schnäppchenjäger anzulocken.\n\nVitrinenmonster sind schlauer als ihre gewöhnlichen Artgenossen: Sie vermeiden den Kampf und stehlen lieber Gegenstände. Werden sie entdeckt, versuchen sie zu fliehen, und mit ihren Angriffen können sie Feinde an eine andere Position schieben.

actors.mobs.crystalspire.name=Riesenkristall
actors.mobs.crystalspire.warning=Der Kristall vibriert, als du darauf schlägst. Wenn du so weitermachst, wird das Aufmerksamkeit auf dich ziehen... Mehr als eine Anwohnerbeschwerde.
actors.mobs.crystalspire.alert=Die Vibrationen werden stärker und rollen durch den ganzen Stollen!
actors.mobs.crystalspire.rankings_desc=Vom Riesenkristall durchbohrt
actors.mobs.crystalspire.desc=Dieser gigantische Kristall aus ultrahartem Material ist vermutlich der Ursprung all der seltsamen kristallinen Kreaturen im Stollen. Deine normalen Waffen sind dagegen kaum zu gebrauchen, du müsstest schon deine Spitzhacke nehmen, um ihn zu zerstören.\n\n_Sieh zu, dass du vorbereitet bist, bevor du loslegst._ Einen derart mächtigen Kristall zu zertrümmern dauert bestimmt eine Weile, und ungestört bleibst du dabei wahrscheinlich nicht. Der Kristall selbst verfügt möglicherweise sogar über gewisse Mittel der Selbstverteidigung. _Vielleicht lassen sich seine Angriffe gegen seine eigenen Lakaien richten._
actors.mobs.crystalspire.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.crystalwisp.name=Kristallbüschel
actors.mobs.crystalwisp.beam_kill=Der Lichtstrahl hat dich getötet...
actors.mobs.crystalwisp.desc=Ein kleiner, zorniger, fliegender Brocken aus gehärtetem Kristall, der hell leuchtet wie ein Späti um vier Uhr morgens. Kristallbüschel sind nicht allzu stark, aber bei freier Schusslinie feuern sie Lichtstrahlen auf dich ab.\n\nKristallbüschel sind klein genug, um sich zwischen den Kristallsäulen hindurchzubewegen, können aber nicht hindurchschießen.
actors.mobs.crystalwisp.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.demonspawner.name=Kündigungsschleuder
actors.mobs.demonspawner.on_death=Als die Kündigungsschleuder stirbt, scheint die dämonische Energie hier nachzulassen.
actors.mobs.demonspawner.desc=Diese rotierende Masse aus Eigentümerzwergen-Fleisch druckt im Sekundentakt Entmietungsdämonen aus den gefallenen Zwergen dieses Gebiets. Offensichtlich haben diese Dämonen kein Problem damit, jede nur erdenkliche Ressource gegen ihre Feinde einzusetzen. Das nennt man hier Verwertung.\n\nSo furchterregend sie aussehen: Kündigungsschleudern können sich weder bewegen noch selbst verteidigen. Ihre erhebliche Masse macht es aber schwer, sie schnell zu töten, und bei Gefahr bringen sie schneller Entmietungsdämonen hervor.\n\n_Die Kündigungsschleudern scheinen mit einer zentralen Quelle dämonischer Energie verbunden zu sein. Sie zu töten, könnte diese Quelle schwächen._

actors.mobs.dm100.name=DM-100 Aufrufautomat
actors.mobs.dm100.zap_kill=Der Stromschlag hat dich getötet... Deine Nummer wurde aufgerufen.
actors.mobs.dm100.desc=Der DM-100 ist eine frühe Version der "Verteidigungsmaschine" der Eigentümerzwerge, gedacht zum Schutz ihrer Bergleute in den Stollen unter dem Amt. Sein Stromschlag erwies sich als zu schwach, also schenkte man ihn dem Bezirk als Wartenummernautomaten. Jahrelang stand er ungenutzt herum, dann landete er im Amt, wo man ihn anfangs für zu grausam hielt. Doch als die Wartenden immer widerspenstiger wurden, wurde er schließlich zur Notwendigkeit. Er verteilt Stromschläge, auch auf Entfernung.

actors.mobs.dm200.name=DM-200 Bauaggregat
actors.mobs.dm200.vent=Das DM-200 schießt einen Strahl aus giftigen Dieselabgasen!
actors.mobs.dm200.desc=Das DM-200 ist die zweite Generation der "Verteidigungsmaschine" der Eigentümerzwerge, gedacht zum Schutz ihrer Bergleute auf der Baustelle und im Renditequartier weiter unten. Diese Maschinen sind viel größer und sperriger als ihre Vorläufer und greifen mit verheerenden hydraulischen Fäusten an. Die Umweltplakette ist gefälscht.\n\nIhre Größe ist zugleich ihre Hauptschwäche: Sie passen nicht in enge Tunnel und Türöffnungen. Zum Ausgleich gaben die Zwerge dem DM-200 die Fähigkeit, seine giftigen Abgase gegen weit entfernte oder unerreichbare Gegner auszustoßen.

actors.mobs.dm201.name=DM-201 Wachaggregat
actors.mobs.dm201.vent=Das DM-201 feuert eine zersetzende Granate!
actors.mobs.dm201.desc=Die Zwerge experimentierten kurz damit, die geringe Beweglichkeit des DM-200 zum Konzept zu machen, und schufen einige völlig stationäre Modelle. Das DM-201 ist ein nachgerüstetes DM-200, das als unbeweglicher Wachturm dient, ähnlich wie der Bauzaun, der hier seit 2011 steht. Im Austausch für die fehlende Beweglichkeit sind die neuen Modelle deutlich haltbarer und schlagkräftiger.\n\nDa das DM-201 keinen Motor hat, aus dem man Abgase ablassen könnte, haben die Zwerge es stattdessen mit zersetzenden Gasgranaten ausgestattet! Es geht jedoch vorsichtig damit um und feuert sie nur ab, wenn zwischen ihm und seinem Angreifer genug Abstand ist.

actors.mobs.dm300.name=DM-300 Bohrlinde
actors.mobs.dm300.notice=UNBEFUGTES PERSONAL FESTGESTELLT! BAUSTELLE BETRETEN VERBOTEN! ELTERN HAFTEN FÜR IHRE KINDER!
actors.mobs.dm300.shield=Bohrlinde zapft Energie aus frei liegendem Baustrom ab und baut einen Schild auf!
actors.mobs.dm300.charging=SCHADEN ERLITTEN! AKTIVIERE BAUSTROMVERTEILER!
actors.mobs.dm300.charging_hint=Bohrlinde ist unverwundbar, solange sie unter Strom steht.
actors.mobs.dm300.supercharged=VORTRIEB! VORTRIEB! VORTRIEB!
actors.mobs.dm300.charge_lost=BAUSTROMVERTEILER BESCHÄDIGT! RÜCKGRIFF AUF LOKALE ENERGIE! FERTIGSTELLUNG: HERBST. JAHR: WIRD NACHGEREICHT.
actors.mobs.dm300.pylons_destroyed=ALARM! INSTABILITÄT IM BAUSTROMNETZ! ERÖFFNUNGSTERMIN WIRD ÜBERPRÜFT!
actors.mobs.dm300.rankings_desc=Von Bohrlinde untertunnelt
actors.mobs.dm300.def_verb=geblockt
actors.mobs.dm300.defeated=KRITISCHER SCHADEN! NEUER ERÖFFNUNGSTERMIN: UNBEKA-
actors.mobs.dm300.desc=Bohrlinde, offiziell DM-300, ist die größte und stärkste "Verteidigungsmaschine", die die Eigentümerzwerge je gebaut haben, und nebenbei die Tunnelbohrmaschine der ewigen U-Bahn-Verlängerung. Wie jede Tunnelbohrmaschine hat sie einen Frauennamen und eine Taufe mit Sekt bekommen. Seitdem bohrt sie. Wohin, weiß niemand mehr.\n\nDiese Maschine ist mit Ventilen ausgestattet, aus denen giftige Abgase strömen, und mit einem Hochleistungsbohrer, mit dem sie angreift und den Boden aufbricht. Außerdem kann sie sich mit dem Baustromnetz verbinden, was ihre Kräfte noch weiter steigert.
actors.mobs.dm300.desc_supercharged=Bohrlinde ist elektrisch geladen. In diesem Zustand ist sie unverwundbar und bewegt sich mit doppelter Geschwindigkeit! Zudem kann sie sich nun durch _soliden Fels_ graben, bewegt sich dabei aber langsamer.\n\nSie jetzt anzugreifen ist sinnlos, aber _irgendetwas auf dieser Baustelle muss sie mit Energie versorgen._ Das zu zerstören, könnte sie schwächen.

actors.mobs.dwarfking.name=König der Eigentumswohnungen
actors.mobs.dwarfking.notice=Wie kannst du es wagen! Das ist Privatgelände! Ab morgen auch dein Flur.
actors.mobs.dwarfking.lifelink_1=Ich brauche etwas von deiner Rendite, Kleinanleger!
actors.mobs.dwarfking.lifelink_2=Schieß Kapital nach, Kleinanleger!
actors.mobs.dwarfking.teleport_1=Mach sie fertig, Kleinanleger!
actors.mobs.dwarfking.teleport_2=Halte sie hin, Kleinanleger! Wie bei der Mängelanzeige!
actors.mobs.dwarfking.wave_1=Genug! Erhebt euch, meine Anleger!
actors.mobs.dwarfking.wave_2=Mehr! Nachschusspflicht für euren König!
actors.mobs.dwarfking.wave_3=Unrentabel! RÄUMT SIE! JETZT!
actors.mobs.dwarfking.enraged=Du kannst mich nicht töten, %s. ICH. BIN. SYSTEMRELEVANT!
actors.mobs.dwarfking.losing=Nein! Ich habe doch nur verwaltet! Du hast keine Ahnung, was darunter liegt... unter dem Rathaus...
actors.mobs.dwarfking.defeated=Du hast... uns allen das Verderben gebracht... Der Markt... wird sich... rächen...
actors.mobs.dwarfking.rankings_desc=Vom König der Eigentumswohnungen geräumt
actors.mobs.dwarfking.desc=Vor vielen Jahren war er Rodney, ein kleiner Hausverwalter der Eigentümerzwerge. Dann entdeckte er Geheimnisse, die ihm Macht über Leben, Tod und Mietverträge verliehen, kaufte seinesgleichen auf, dann den alten König und schließlich jede Wohnung im Quartier. Heute nennt er sich König der Eigentumswohnungen und gebietet über eine Legion untoter Kleinanleger. Auf seinem Klingelschild steht noch immer Rodney.\n\nDer König ist ein aggressiver Feind, der seine Gegner bevorzugt mit Horden untoter Lakaien umzingelt und überwältigt.
actors.mobs.dwarfking$dkghoul.rankings_desc=Vom König der Eigentumswohnungen geräumt
actors.mobs.dwarfking$dkmonk.rankings_desc=Vom König der Eigentumswohnungen geräumt
actors.mobs.dwarfking$dkwarlock.rankings_desc=Vom König der Eigentumswohnungen geräumt
actors.mobs.dwarfking$dkgolem.rankings_desc=Vom König der Eigentumswohnungen geräumt

actors.mobs.ebonymimic.name=Schatten-Sperrmüll
actors.mobs.ebonymimic.reveal=Da war ein Sperrmüllmonster!
actors.mobs.ebonymimic.hidden_name=verdächtiger Umriss
actors.mobs.ebonymimic.hidden_desc=Da scheint etwas zu sein, aber es ist fast vollkommen durchsichtig. Laut Ordnungsamt steht hier nichts.
actors.mobs.ebonymimic.desc=Sperrmüllmonster sind magische Wesen, die jede beliebige Gestalt annehmen können. Hier unten sehen sie fast immer aus wie Sperrmüllberge, um arglose Schnäppchenjäger anzulocken.\n\nSchatten-Sperrmüll ist eine verstohlene Sorte, die fast unsichtbar werden kann. Er lauert auf Dingen, die Neugierige wahrscheinlich anfassen, trägt aber auch eigene Beute. Einmal entdeckt, ist er nicht zäher als normaler Sperrmüll, aber sein Überraschungsbiss ist verheerend.
actors.mobs.ebonymimic.discover_hint=Du kannst diesen Gegner mit einem bestimmten Kleinod finden.

actors.mobs.elemental$fireelemental.name=Heizkosten-Feuerelementar
actors.mobs.elemental$fireelemental.desc=Elementare sind chaotische Wesen, die oft entstehen, wenn starke okkulte Magie außer Kontrolle gerät. Oder eine Heizkostennachzahlung. Sie haben nur geringe Intelligenz und sind meist mit einer bestimmten Art von Magie verbunden.\n\nHeizkosten-Feuerelementare sind eine häufige Art von Elementaren und verursachen Schaden durch Feuermagie. Im Nahkampf setzen sie ihr Ziel in Brand, und gelegentlich verschießen sie auch Feuerstöße.
actors.mobs.elemental$newbornfireelemental.name=neugeborenes Heizkosten-Feuerelementar
actors.mobs.elemental$newbornfireelemental.charging=Das Elementar lädt sich auf!
actors.mobs.elemental$newbornfireelemental.desc=Elementare sind chaotische Wesen, die oft entstehen, wenn starke okkulte Magie außer Kontrolle gerät. Sie haben nur geringe Intelligenz und sind meist mit einer bestimmten Art von Magie verbunden.\n\nDieses Feuerelementar ist frisch beschworen, gerade erst aus dem Bescheid geschlüpft, aber trotzdem schon ziemlich gefährlich!
actors.mobs.elemental$newbornfireelemental.rankings_desc=Von einem neugeborenen Feuerelementar eingeäschert
actors.mobs.elemental$newbornfireelemental.desc_boss=Weil es so stümperhaft beschworen wurde, kann dieses Elementar Feuer erst nach einem Zug Aufladung und nur in ungenauen Stößen verschießen.
actors.mobs.elemental$newbornfireelemental.desc_ally=Da dieses Elementar durch einen Zauberspruch beschworen wurde, hat es seine Flamme etwas besser im Griff. Fernangriffe beherrscht es nicht, aber es kann Feinde im Nahkampf in Brand setzen.
actors.mobs.elemental$newbornfireelemental.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.
actors.mobs.elemental$frostelemental.name=Heizungsausfall-Frostelementar
actors.mobs.elemental$frostelemental.desc=Elementare sind chaotische Wesen, die oft entstehen, wenn starke okkulte Magie außer Kontrolle gerät. Sie haben nur geringe Intelligenz und sind meist mit einer bestimmten Art von Magie verbunden.\n\nFrostelementare sind eine häufige Art von Elementaren. Sie bilden sich in jedem Altbau, dessen Heizung im Januar "planmäßig gewartet" wird, und schwächen ihre Feinde mit Kältemagie. Sie frieren ihr Ziel im Nahkampf oder mit einem gelegentlichen Fernangriff ein. Im Wasser ist ihre Magie wesentlich wirksamer.
actors.mobs.elemental$shockelemental.name=Kurzschluss-Schockelementar
actors.mobs.elemental$shockelemental.desc=Elementare sind chaotische Wesen, die oft entstehen, wenn starke okkulte Magie außer Kontrolle gerät. Sie haben nur geringe Intelligenz und sind meist mit einer bestimmten Art von Magie verbunden.\n\nSchockelementare sind eine seltenere Art von Elementaren, geboren aus Luxussanierungen mit Elektrik vom Schwager. Sie zerreißen ihre Feinde mit Stromschlägen und Lichtblitzen. Im Nahkampf verteilen sie Stromschläge an Feinde in der Nähe und fügen dem Hauptziel zusätzlichen Schaden zu, wenn es im Wasser steht. Mitunter richten sie auch einen Lichtblitz als Fernangriff gegen ihr Ziel, der es zeitweise blendet.
actors.mobs.elemental$chaoselemental.name=Nebenkosten-Chaoselementar
actors.mobs.elemental$chaoselemental.desc=Elementare sind chaotische Wesen, die oft entstehen, wenn starke okkulte Magie außer Kontrolle gerät. Sie haben nur geringe Intelligenz und sind meist mit einer bestimmten Art von Magie verbunden.\n\nChaoselementare sind eine seltene und gefährliche Art von Elementaren, die sich noch auf kein Element festgelegt haben, genau wie die Posten einer Nebenkostenabrechnung. Beim Angriff entfesseln sie wilde, unvorhersehbare Magie.

actors.mobs.eye.name=Auge des Ordnungsamts
actors.mobs.eye.deathgaze_kill=Der Blick des Ordnungsamts hat dich getötet... Knöllchen inklusive.
actors.mobs.eye.desc=Diese schwebenden Bälle aus aufgestauter dämonischer Energie sehen alles: falsch getrennten Müll, Grillen im Park, den Späti nach 22 Uhr. Im Nahkampf können sie sich wehren, ihre wahre Stärke zeigt sich aber in ihrer Magie.\n\nNachdem es kurz Energie gesammelt hat, verschießt ein Auge des Ordnungsamts einen verheerenden Energiestrahl, den _Todesblick_. Alles in seiner Blickrichtung nimmt enormen Schaden. Kluge Abenteurer gehen schnell in Deckung.

actors.mobs.fetidrat.name=verfaulende Pfandratte
actors.mobs.fetidrat.rankings_desc=Von der verfaulenden Pfandratte aufgelöst
actors.mobs.fetidrat.desc=Mit dieser Ratte stimmt offensichtlich etwas nicht. Sie hat in der Biotonne übernachtet, und zwar im August. Ihr schmieriges, schwarzes Fell und die faulende Haut haben nichts mit den gesunden Pfandratten gemein, die du bisher gesehen hast. Ihre blassen, grünen Augen machen sie besonders bedrohlich.\n\nDie Ratte sondert eine übelriechende Wolke ab, und der Gestank macht dich benommen, wenn du nahe herankommst.\n\nDunkler Schleim tropft ihr aus dem Maul und frisst sich durch den Boden. In Wasser scheint er sich aber aufzulösen.
actors.mobs.fetidrat.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.fungalcore.name=Hausschwamm-Kern
actors.mobs.fungalcore.desc=Dieser gigantische Pilz muss die Quelle des Hausschwammbefalls in diesem Stollen sein. Laut Gutachten ist er "optisch unbedenklich".

actors.mobs.fungalsentry.name=Hausschwamm-Wache
actors.mobs.fungalsentry.desc=Dieser besonders hohe Pilz dient als Verteidigungsstellung für das größere Pilzgeflecht in diesem Stollen.\n\nEr ist unbeweglich, schießt aber präzise Giftstöße auf alles, was in seine Sicht gerät. Die Stöße selbst sind recht schwach, _aber das Gift kann sich schnell zu tödlichen Mengen summieren._ Man kann ihn töten, besser wäre es aber, ihn zu meiden.

actors.mobs.fungalspinner.name=Hausschwamm-Spinne
actors.mobs.fungalspinner.desc=Diese Flatterbandspinne wird von einem parasitären Hausschwamm gesteuert. Der Pilz hat auch ihre Fähigkeiten verändert, ihre Spinn- und Giftdrüsen sind völlig überwuchert.\n\nStatt mit Netzen bespuckt dich die Hausschwamm-Spinne mit Grünzeug, verbreitet so die Pilzsporen und kann dich verwurzeln. Vergiften kann sie dich nicht, aber direkt neben einem Pilz ist sie erheblich schadensresistent.

actors.mobs.ghoul.name=Kleinanleger-Wiedergänger
actors.mobs.ghoul.desc=Als die Eigentümergemeinschaft zerfiel und der jetzige König der Eigentumswohnungen die uneingeschränkte Macht an sich riss, erging es den Schwachen und denen, die ihm auf der Eigentümerversammlung widersprachen, nicht gut. Je besser der König die dunkle Magie beherrschte, desto gründlicher unterwarf er diese Kleinanleger seinem Willen. Jetzt bilden sie das Fußvolk seiner Armee und zahlen trotzdem noch Hausgeld.\n\nWiedergänger sind für sich genommen nicht besonders stark, aber sie treten in Gruppen auf, und in großer Zahl sind sie viel schwerer zur Strecke zu bringen. _Ein besiegter Wiedergänger steht einige Züge später wieder auf, solange noch ein anderer Wiedergänger in der Nähe ist._

actors.mobs.escooter.name=Leihscooter
actors.mobs.escooter.bell=Kling!
actors.mobs.escooter.warning=Ein Leihscooter klingelt und nimmt Anlauf! Raus aus seiner Spur!
actors.mobs.escooter.hit_hero=Der Leihscooter fährt dich über den Haufen!
actors.mobs.escooter.hit=Der Leihscooter rammt: %s. Die App bedankt sich für die Fahrt.
actors.mobs.escooter.crash=Der Leihscooter kracht gegen die Wand und bleibt quer im Weg liegen. Wie immer.
actors.mobs.escooter.ondeath=Von einem Leihscooter überfahren. Die Minutenpauschale läuft weiter.
actors.mobs.escooter.desc=Ein herrenloser Leihscooter, der beschlossen hat, dass der Keller jetzt sein Geschäftsgebiet ist. Einen Parkplatz hat er noch nie gefunden. Gesucht hat er auch nicht.\n\n_Steht er 2 bis 5 Felder entfernt in gerader Linie zu dir (waagerecht, senkrecht oder diagonal), klingelt er einen Zug lang. Danach fährt er bis zu 6 Felder geradeaus und rammt die erste Figur in seiner Spur für 3 bis 7 Schaden._ Tritt aus der Spur. Ist sie leer, kracht er ins nächste Hindernis, nimmt selbst Schaden und liegt 2 Züge lang um. Danach braucht er 4 Züge, bis er wieder Anlauf nimmt.

actors.mobs.gasalchemist.name=Herr Fuß
actors.mobs.gasalchemist.warning=Herr Fuß schlüpft aus den Latschen! Gleich steht eine Stinkwolke um ihn. Halte Abstand!
actors.mobs.gasalchemist.desc=Ein frei erfundener Nachbar aus dem Seitenflügel, der auf seine Latschen schwört und auf die Socken darin, beide seit 2016 im Dienst. Er beschreibt seinen Mief wie andere Leute Wein: Kopfnote Emmentaler, Abgang Turnhalle, Jahrgang 2016.\n\n_In deiner Nähe schlüpft er aus den Latschen und kündigt so eine Stinkwolke an. Du hast einen Zug Zeit, Abstand zu gewinnen._ Anschließend breitet sich der Mief um ihn herum aus und schadet anderen Wesen. Ihm selbst macht er nichts aus. Zwischen zwei Wolken müssen seine Socken erst ein paar Züge nachreifen.

actors.mobs.gnoll.name=Besichtigungswicht
actors.mobs.gnoll.desc=Ein kleiner, zotteliger Kellerbewohner mit Bewerbungsmappe unterm Arm. Er steht seit sechs Uhr für die Einzimmerwohnung im Seitenflügel an und hält dich für Bewerber Nummer 213.\n\nEin einfacher Nahkämpfer: nicht besonders stark, nicht besonders schlau, aber selten allein.

actors.mobs.gnollexile.name=verstoßener Tiefbauer
actors.mobs.gnollexile.desc=Dieser graupelzige Wicht trägt eine große Markierung auf der Schulter, die ihn als Verstoßenen ausweist. Bautrupps werfen normalerweise nur raus, wer Regeln ignoriert oder Gesetze bricht, zum Beispiel, indem er pünktlich fertig wird. Verstoßene müssen stark und schlau sein, um zu überleben. Dieser hier scheint zu wissen, wie man den Speer in seiner Hand benutzt.
actors.mobs.gnollexile.desc_passive=_Der verstoßene Tiefbauer greift nicht an._ Er ist nicht so aggressiv wie die anderen Bauarbeiter hier und hält einen Kampf mit dir wohl für unbezahlte Überstunden. Du könntest ihn vorbeiziehen lassen, aber er trägt einen Rucksack, der voll mit nützlichen Gegenständen sein könnte...
actors.mobs.gnollexile.desc_aggro=_Der verstoßene Tiefbauer schaut zornig um sich._ Anscheinend hat er sich doch für den Kampf entschieden. Pass auf, ein Speer!
actors.mobs.gnollexile.seen_passive=Der speerschwingende Tiefbauer schaut dich warnend an, greift aber nicht an.
actors.mobs.gnollexile.seen_aggro=Der speerschwingende Tiefbauer greift an!

actors.mobs.gnollgeomancer.name=Tiefbau-Geomant
actors.mobs.gnollgeomancer.warning=Der Geomant beginnt sich zu rühren. Seine Frühstückspause endet. Vergewissere dich, dass du bereit bist, bevor du weitermachst!
actors.mobs.gnollgeomancer.alert=Der Geomant erwacht! Der ganze Stollen scheint in Bewegung zu geraten, als er mit irrem Gelächter davonspringt!
actors.mobs.gnollgeomancer.rock_kill=Der fliegende Felsbrocken hat dich erschlagen...
actors.mobs.gnollgeomancer.rockfall_kill=Herabfallende Felsbrocken haben dich erschlagen... Ein Helm wäre Pflicht gewesen.
actors.mobs.gnollgeomancer.rankings_desc=Vom Tiefbau-Geomanten verschüttet
actors.mobs.gnollgeomancer.desc=Dieser beeindruckend große, ältere Bauwicht muss die Quelle der erdbewegenden Magie sein, die hier wirkt, und wohl auch der Chef des ganzen Bautrupps. Anders als die Sprengmeister, die hier herumrumoren, ist der Geomant in seiner Magie gut bewandert, und geworfene oder fallende Steine können ihn nicht verletzen. Für den Nahkampf hat er allerdings keinerlei Mittel.
actors.mobs.gnollgeomancer.desc_armor=Der Geomant steckt gerade in einer Schicht aus Steinrüstung. _Du musst nahe heran und sie mit deiner Spitzhacke brechen, bevor du ihm Schaden zufügen kannst._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Ein Bautrupp-Sprengmeister in der Nähe hält ein Gerät, das die Steinrüstung des Geomanten mit Energie versorgt. Im Moment kannst du sie in keiner Weise beschädigen!_
actors.mobs.gnollgeomancer.desc_sleeping=Dieser beeindruckend große Bauwicht ist von einer Steinschicht umgeben und sieht beinahe aus wie ein Denkmal für den ersten Spatenstich. Bei genauerem Hinsehen erkennt man, wie sich die Steine auf magische Weise im Takt seines Atems bewegen. Solange er so in Stein gehüllt ist, kann er nicht verletzt werden, und im Moment schläft er buchstäblich wie ein Stein.\n\nMit deiner Spitzhacke kannst du dich vermutlich durch die Steinschichten hacken, aber _mach dich auf einen Kampf gefasst, wenn du das tust._ Der Geomant muss die Quelle der erdbewegenden Magie hier sein und wohl auch der Chef des ganzen Bautrupps. _Es wäre keine schlechte Idee, die verstreuten Bauarbeiter zu besiegen, bevor du ihn angreifst._
actors.mobs.gnollgeomancer.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.gnollguard.name=Bautrupp-Wachmann
actors.mobs.gnollguard.def_verb=geblockt
actors.mobs.gnollguard.spear_warn=Der Wachmann landet einen bösen Treffer mit der Spitze seines Speers!
actors.mobs.gnollguard.desc=Ein groß und stark aussehender Bauwicht mit Speer und Schild, aber ohne Helm. Arbeitsschutz ist hier eher eine Empfehlung. Diese Wachleute sind vermutlich Grobiane in Ausbildung, die den Stollen vor eindringenden Wildtieren und Anwohnerbeschwerden schützen sollen.\n\nDer Wachmann ist stark genug, um den Speer mit einer Hand zu führen, aber nicht besonders gut damit. _Er braucht genug offenes Gelände, um aus der Entfernung anzugreifen, und er verursacht wesentlich weniger Schaden, wenn du nah genug dran bist._
actors.mobs.gnollguard.desc_armor=_Ein Bautrupp-Sprengmeister in der Nähe hält ein Gerät, das diesem Wachmann eine irdene Rüstung verleiht, die den ihm zugefügten Schaden wesentlich verringert._
actors.mobs.gnollguard.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.gnollsapper.name=Bautrupp-Sprengmeister
actors.mobs.gnollsapper.desc=Ein kleiner, schwacher, aber intelligenter Bauwicht mit bleichem Fell und einem Ranzen voller Geräte, die kein TÜV je gesehen hat. Sprengmeister sind vermutlich hier, um Glasfaser aufzuspüren und abzubauen, und haben zu ihrem Schutz einen Wachmann in der Nähe. Sie können zwar kämpfen, aber ihre Angriffe sind erbärmlich schwach, nicht stärker als die eines Besichtigungswichts.\n\nStatt direkt zu kämpfen, setzen Sprengmeister lieber ihre Geräte ein und lassen das Gestein für sich kämpfen. Erdbewegende Magie beherrschen sie selbst nicht, also nutzen sie umso mehr ihre Apparate. _Es dürfte eine Menge Wege geben, ihre Angriffe gegen sie selbst oder gegen ihren Wachmann zu richten._
actors.mobs.gnollsapper.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.gnolltrickster.name=Abstandswicht
actors.mobs.gnolltrickster.rankings_desc=Vom Abstandswicht über den Tisch gezogen
actors.mobs.gnolltrickster.desc=Eine merkwürdige Kreatur, sogar für einen Wicht. Er ist gebuckelt, grinst boshaft und klammert sich an seine Umhängetasche. Er verlangt 3000 Euro Abstand für eine Einbauküche ohne Herd und hält dabei selbst gern Abstand.\n\nIn der Tasche steckt eine große Sammlung dürftig gebastelter Pfeile, allesamt mit gefährlichen Substanzen versetzt.
actors.mobs.gnolltrickster.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.goldenmimic.name=angekettetes Sperrmüllmonster
actors.mobs.goldenmimic.desc=Sperrmüllmonster sind magische Wesen, die jede beliebige Gestalt annehmen können. Hier unten sehen sie fast immer aus wie Sperrmüllberge, um arglose Schnäppchenjäger anzulocken.\n\nAngekettete Sperrmüllmonster sind eine stärkere Sorte, die es auf die Stärksten abgesehen hat. Sie tragen bessere Schätze, sind aber auch viel stärker als normale. Premium-Sperrmüll eben.

actors.mobs.golem.name=Umzugsgolem
actors.mobs.golem.def_verb=geblockt
actors.mobs.golem.desc=Umzugsgolems sind der Versuch der Eigentümerzwerge, die Mängel ihrer Maschinen mit neu entdeckter Magie zu beheben. Im Vergleich mit Bohrlinde sind sie wesentlich kompakter und effizienter, aber immer noch sehr todbringend. Sie haben schon hunderte Mieter an den Stadtrand getragen, samt Schrankwand.\n\nGolems sind zu groß für enge Durchgänge, zum Ausgleich haben die Zwerge ihnen magische Kräfte verliehen. Sie können sich von einem Raum in einen anderen teleportieren und Feinde, die außer Reichweite sind, zu sich heranteleportieren.

actors.mobs.goo.name=Mietschimmel
actors.mobs.goo.notice=FALSCH GELÜFTET!
actors.mobs.goo.defeated=...ICH... KOMME... IM... NOVEMBER... WIEDER...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=Der Mietschimmel bläht sich auf! Geh auf Abstand!
actors.mobs.goo.enraged=Wütend
actors.mobs.goo.gluuurp=ICH BIN KEIN MANGEL. ICH BIN AUSSTATTUNG!
actors.mobs.goo.rankings_desc=Vom Mietschimmel absorbiert
actors.mobs.goo.desc=Jahrzehnte ignorierter Mängelanzeigen haben ein Bewusstsein entwickelt. Der Mietschimmel behauptet, du hättest falsch gelüftet. Seine glibbrige Masse speichert gefährliche Energie.\n\n_Wenn er sich aufbläht, geh auf Abstand._ Im Wasser kann er sich heilen. Seine ätzenden Angriffe lassen sich mit Wasser abwaschen. Die Kaution bekommst du trotzdem nicht wieder.

actors.mobs.greatcrab.name=großer Kanalpanzer
actors.mobs.greatcrab.noticed=Der Kanalpanzer verteidigt sich mit seiner riesigen Scherenklaue.
actors.mobs.greatcrab.def_verb=geblockt
actors.mobs.greatcrab.rankings_desc=Vom großen Kanalpanzer zerschnippelt
actors.mobs.greatcrab.desc=Dieser Kanalpanzer ist riesig, sogar im Vergleich mit anderen seiner Art. Seine blaue Schale ist von Rissen und Seepocken überzogen, er wohnt hier eindeutig länger als jeder Mieter. Schwerfällig bewegt er sich umher und hält mit Mühe das Gleichgewicht mit seiner enormen Scherenklaue. Er hat zwar nur eine Schere, aber deren Größe gleicht das leicht aus.\n\nSobald er einen Feind erblickt, hält er die Klaue vor sich und schützt sich so hinter einem undurchdringlichen Panzer vor Angriffen. Gegen Angriffe, die er nicht kommen sieht oder die von mehreren Gegnern ausgehen, kann er sich jedoch nicht verteidigen.
actors.mobs.greatcrab.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.guard.name=Amtssecurity
actors.mobs.guard.scorpion=Sie da! Herkommen!
actors.mobs.guard.def_verb=geblockt
actors.mobs.guard.desc=Einst sollten sie im Amt für Ordnung sorgen, heute sind sie kaum besser als die Wartenden. Wie Zombies schlurfen sie durch die Flure, auf der Suche nach allem, was hier nicht hingehört, zum Beispiel Leute ohne Termin. Also dich!\n\nSie tragen Ketten um die Hüfte, vermutlich, um Feinde zu sich heranzuziehen.

actors.mobs.hermitcrab.name=Tonnenpanzer
actors.mobs.hermitcrab.def_verb=geblockt
actors.mobs.hermitcrab.desc=Aus irgendeinem Grund trägt dieser Kanalpanzer den abgebrochenen oberen Teil einer Regentonne auf dem Kopf. Das zusätzliche Gewicht bremst ihn auf normale Geschwindigkeit, verschafft ihm aber deutlich mehr Verteidigung. Außerdem glaubst du, dass in der Tonne etwas herumspringt...

actors.mobs.luxussanierer.name=Luxussanierer
actors.mobs.luxussanierer.plan=Hier entsteht Wohnraum!
actors.mobs.luxussanierer.warning=Der Luxussanierer vermisst die Felder hinter dir! Nächsten Zug stehen dort Bauzäune!
actors.mobs.luxussanierer.desc=Er sieht überall Potenzial, besonders dort, wo gerade noch jemand wohnt. Auf seinem Bauplan steht über deinem Fluchtweg eine Dachterrasse.\n\n_Bist du 2 bis 6 Felder entfernt, markiert er die freien Felder neben dir, die weiter von ihm weg liegen. Einen Zug später stellt er dort für 8 Züge Bauzäune auf._ Bauzäune blockieren Weg und Sicht, brennen aber wie jede Barrikade. Felder mit Figuren oder Gegenständen bleiben frei. Zwischen zwei Plänen braucht er 7 Züge.

actors.mobs.hausordnungshydra.name=Hausordnungs-Hydra
actors.mobs.hausordnungshydra.quiet_short=RUHEZEIT!
actors.mobs.hausordnungshydra.sweep_short=KEHRWOCHE!
actors.mobs.hausordnungshydra.quiet=Die Hydra verkündet Ruhezeit: Nicht bewegen!
actors.mobs.hausordnungshydra.sweep=Die Hydra verkündet Kehrwoche: Nicht stehenbleiben!
actors.mobs.hausordnungshydra.desc=Jede Hausordnung, die je in einem Treppenhaus hing, zu einem Wesen verwachsen. Jeder Kopf wurde von einer anderen Hausverwaltung verfasst, und keiner hat die anderen gelesen.\n\n_Bis 6 Felder Entfernung verkündet sie für 3 Züge eine Hausregel, abwechselnd Ruhezeit (Bewegen wird bestraft) und Kehrwoche (auf demselben Feld bleiben wird bestraft). Deine erste Aktion nach der Ansage ist frei. Jeder Verstoß kostet 8 bis 14 Lebenspunkte._ Wer sich nicht bewegen kann, zahlt bei Kehrwoche nichts. Zwischen zwei Regeln braucht sie 7 Züge, und mit ihrem Tod enden alle ihre Regeln.

actors.mobs.mimic.name=Sperrmüllmonster
actors.mobs.mimic.reveal=Zu verschenken. Mit Zähnen!
actors.mobs.mimic.hidden_hint=An diesem Sperrmüllberg scheint etwas eigenartig zu sein... Die Matratze atmet. Es wäre keine gute Idee, darin zu wühlen.
actors.mobs.mimic.desc=Ein magisches Wesen in Gestalt eines Sperrmüllbergs. Sein Geschäftsmodell: Menschen nehmen grundsätzlich alles mit, wenn es kostenlos am Straßenrand steht.\n\nSein Biss ist heftig, dafür steckt oft mehr Beute darin als in einem gewöhnlichen Sperrmüllberg. Keine Rücknahme, keine Garantie.
actors.mobs.mimic.discover_hint=Du kannst diesen Gegner überall im Untergrund finden.

actors.mobs.necromancer.name=Wiedervorlagebeamter
actors.mobs.necromancer.desc=Diese Beamten sind übrig geblieben, nachdem das Amt alle Stellen gestrichen hat, die sie hätten beaufsichtigen können. Ihre dunkle Kunst heißt Wiedervorlage.\n\nWiedervorlagebeamte beschwören ewig Wartende und verzaubern sie, damit sie für sie kämpfen. Wird der Beamte getötet, stirbt auch der Wartende, den er beschworen hat.
actors.mobs.necromancer$necroskeleton.name=wiedervorgelegter Wartender
actors.mobs.necromancer$necroskeleton.desc=Dieser Wartende wurde von einem Wiedervorlagebeamten zurück ins Leben geholt. Er verhält sich wie ein normaler ewig Wartender und stirbt, sobald der Beamte, der ihn gerufen hat, getötet wurde.

actors.mobs.mob.died=Du hörst etwas in der Ferne sterben. Irgendwo wird eine Wohnung frei.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Getötet von: %s
actors.mobs.mob.discover_hint=Du findest diesen Gegner in einer bestimmten Region im Untergrund.

actors.mobs.monk.name=Concierge-Mönch
actors.mobs.monk.def_verb=geblockt
actors.mobs.monk.parried=Heute nicht.
actors.mobs.monk.desc=Diese Concierges sind Fanatiker, die sich dem Schutz ihres Königs und seiner Lobby mit ganzer Körperkraft verschrieben haben. Ihre Ergebenheit ist so groß, dass sie ihren Geist vollständig dem König unterstellt haben. Jetzt streifen sie wie geistlose Zombies durchs Renditequartier und fragen jeden, zu wem er will.\n\nMönche verlassen sich ganz auf den Nahkampf und setzen ihre bloßen Fäuste zum Angriff wie zur Verteidigung ein. Wenn sie konzentriert sind, wehren sie die nächste physische Attacke gegen sich ab, selbst wenn diese normalerweise garantiert getroffen hätte. Mönche bauen Konzentration schneller auf, wenn sie sich bewegen, und langsamer im direkten Kampf.
actors.mobs.monk$focus.name=konzentriert
actors.mobs.monk$focus.desc=Dieser Mönch ist vollständig auf sein Ziel konzentriert und scheint dessen Bewegungen vorauszuahnen, bevor sie passieren. Er hat dich schon am Klingelschild erkannt.\n\nSolange er so konzentriert ist, geht die nächste physische Attacke gegen ihn garantiert fehl, ganz egal, unter welchen Bedingungen. Das Abwehren dieser Attacke verbraucht die Konzentration, und er muss sie neu aufbauen, um eine weitere Attacke abzuwehren. Mönche bauen Konzentration schneller auf, wenn sie sich bewegen.

actors.mobs.phantompiranha.name=Phantom-Kanalpiranha
actors.mobs.phantompiranha.teleport_away=Der Phantom-Kanalpiranha teleportiert sich davon...
actors.mobs.phantompiranha.desc=Phantom-Kanalpiranhas sind eine seltene Art mit magischen Fähigkeiten und unheimlich durchsichtigen Körpern. Wenn sie angegriffen werden, teleportieren sie sich, entweder in Sicherheit oder in Angriffsreichweite ihres Gegners!\n\nSie zu bekämpfen ist ermüdend, aber ihr Fleisch ist für seine magischen Eigenschaften berühmt. Ein Restaurant in Mitte verkauft es als "Spree-Sashimi".

actors.mobs.pfandgolem.name=Pfandgolem
actors.mobs.pfandgolem.shatter=Der Pfandgolem zerspringt! Überall Scherben, keine davon rückgabefähig.
actors.mobs.pfandgolem.desc=Ein Haufen leerer Pfandflaschen, der so lange in einer Kellerecke auf den Rückgabeautomaten gewartet hat, dass ihm Beine gewachsen sind. Er ist nachtragend. Sehr.\n\n_Langsam: Er bewegt sich mit halber Geschwindigkeit, schlägt aber kräftig zu und steckt einiges weg._ Wenn er zerbricht, liegen auf seinem Feld und allen begehbaren Nachbarfeldern Scherben. Sie bleiben 20 Züge liegen und verursachen 1 bis 3 Schaden bei jedem Schritt hinein, auch wenn du nur sein Pfandgeld aufsammelst.

actors.mobs.piranha.name=Kanalpiranha
actors.mobs.piranha.desc=Diese fleischfressenden Fische kamen aus dem Landwehrkanal durch den Gully und fanden die überfluteten Keller gemütlicher. Ihre Bisse sind tödlich, also: einfach nicht reinspringen.
actors.mobs.piranha.discover_hint=Du kannst diesen Gegner überall im Untergrund finden.

actors.mobs.pylon.name=Baustromverteiler
actors.mobs.pylon.desc_inactive=Ein Baustromverteiler, der die Elektrizität für die Maschinen auf dieser Baustelle regelt. Das Prüfsiegel ist von 2009.\n\nDieser Verteiler ist derzeit nicht aktiv und immun gegen Schaden.
actors.mobs.pylon.desc_active=Ein Baustromverteiler, der die Elektrizität für die Maschinen auf dieser Baustelle regelt. Er summt geradezu vor elektrischer Energie, das muss die Quelle von Bohrlindes Superladung sein!\n\nIn diesem Zustand sind Baustromverteiler verwundbar, feuern aber im Uhrzeigersinn Stromschläge auf die umliegenden Felder. Dank ihrer massiven Metallbauweise können sie eine große Menge Schaden einstecken.

actors.mobs.presslufter.name=Presslufter
actors.mobs.presslufter.rev=RATATATA!
actors.mobs.presslufter.warning=Der Presslufthammer läuft warm! Weg von dem Bauarbeiter!
actors.mobs.presslufter.ondeath=Vom Presslufthammer plattgemacht. Fertigstellung ist weiterhin für nächstes Jahr geplant.
actors.mobs.presslufter.desc=Dieser Bauarbeiter stemmt schon an diesem Tunnelstück, seit bevor die Linie überhaupt geplant wurde. Niemand weiß, wer ihn beauftragt hat. Niemand traut sich, ihn abzubestellen.\n\n_Steht er neben dir, läuft sein Hammer einen Zug lang warm und er markiert alle Felder um sich herum. Dann schlägt er auf alle gleichzeitig ein und verursacht 10 bis 24 Schaden bei jedem, der dort steht._ Ein Schritt weg reicht. Danach braucht sein Hammer 5 Züge, bis er es wieder kann.

actors.mobs.rat.name=Pfandratte
actors.mobs.rat.desc=Kleine, aggressive Kellerbewohnerin mit großen Ansprüchen. Jeder Kronkorken im Hof gehört ihr, auch der unter deinem Schuh.\n\nSie beißt, ist aber einzeln recht schwach.

actors.mobs.ripperdemon.name=Entmietungsdämon
actors.mobs.ripperdemon.leap=Der Entmietungsdämon setzt zum Sprung an!
actors.mobs.ripperdemon.desc=Diese schrecklichen Kreaturen entstehen, wenn dämonische Mächte die vielen Zwergenkadaver in dieser Region verwerten. Entmietungsdämonen sind abgemagerte, schaurige Gestalten, die Zwergen ähneln, aber gebrochene Körper und lange, scharfe Knochenkrallen haben. Sie klingeln nie. Sie stehen einfach im Wohnzimmer.\n\nEntmietungsdämonen sind nicht besonders widerstandsfähig, aber wendig und gefährlich. Sie überspringen große Entfernungen, um Ziele schnell zu erreichen, bevor sie sie mit ihren Klauen aufspießen.

actors.mobs.rotheart.name=Faulbeerherz
actors.mobs.rotheart.desc=Die Frucht der Faulbeere ist einzigartig. Anstatt zu verrotten und Nährstoffe abzugeben, wächst sie, verhärtet sich und umschließt den Samen. So schützt sie die inneren Organe, die in ihr wachsen. Diese große Kugel nennt man das Herz einer ausgewachsenen Faulbeere. Im Amt steht sie im Inventar als "Zimmerpflanze, Kat. B".
actors.mobs.rotheart.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.rotlasher.name=Faulbeerranke
actors.mobs.rotlasher.rankings_desc=Von einer Büropflanze ausgepeitscht
actors.mobs.rotlasher.desc=Die Faulbeerranke ist Teil des Wurzelwerks einer ausgewachsenen Faulbeere und ihr wichtigstes Verteidigungsmittel. Ranken sind blind und stecken fest im Boden, greifen aber jede Bedrohung, die ihnen zu nahe kommt, heftig an. Wenn keine Feinde in der Nähe sind, stehen sie reglos da und versuchen, wie harmlose Büropflanzen auszusehen.
actors.mobs.rotlasher.discover_hint=Du kannst diesen Gegner während einer bestimmten Aufgabe finden.

actors.mobs.scorpio.name=Mahnbescheid-Skorpion
actors.mobs.scorpio.desc=Diese riesigen, spinnenartigen Dämonen aus der Rechtsabteilung unter dem Rathaus meiden den Nahkampf. Sie schießen lieber verkrüppelnde, zahnbesetzte Stacheln aus großer Entfernung. Jeder Stachel trägt ein Aktenzeichen.

actors.mobs.senior.name=Ober-Concierge
actors.mobs.senior.desc=Diese Concierges sind Fanatiker, die sich dem Schutz ihres Königs und seiner Lobby mit ganzer Körperkraft verschrieben haben. Ihre Ergebenheit ist so groß, dass sie ihren Geist vollständig dem König unterstellt haben. Jetzt streifen sie wie geistlose Zombies durchs Renditequartier.\n\nDieser Ober-Concierge beherrscht den Nahkampf meisterhaft und gewinnt in Bewegung viel schneller Konzentration als normale Mönche. Wenn sie konzentriert sind, wehren Mönche die nächste physische Attacke gegen sich ab, selbst wenn diese normalerweise garantiert getroffen hätte. Mönche bauen Konzentration schneller auf, wenn sie in Bewegung sind, und langsamer im direkten Kampf.

actors.mobs.shaman.name=Bautrupp-Gutachter
actors.mobs.shaman.bolt_kill=Das Gutachten hat dich getötet...
actors.mobs.shaman.desc=Gutachter sind intelligente Bauwichte, die Kampfmagie einsetzen, um ihre fehlende Kraft auszugleichen. Trotz ihrer Schwäche genießen sie im Bautrupp hohes Ansehen, denn nur sie können bescheinigen, dass alles nach Plan läuft.
actors.mobs.shaman$redshaman.spell_desc=Dieser Gutachter trägt einen roten Helm. Er setzt Magie ein, die zeitweise _deine Angriffskraft schwächt._
actors.mobs.shaman$blueshaman.spell_desc=Dieser Gutachter trägt einen blauen Helm. Er setzt Magie ein, die zeitweise _den dir zugefügten Schaden erhöht._
actors.mobs.shaman$purpleshaman.spell_desc=Dieser Gutachter trägt einen violetten Helm. Er setzt Magie ein, die zeitweise _deine Zielgenauigkeit und dein Ausweichen herabsetzt._

actors.mobs.armoredbrute.name=gepanzerter Bautrupp-Grobian
actors.mobs.armoredbrute.desc=Die ältesten Grobiane im Bautrupp tragen schwere Schutzausrüstung, um ihren Status zu zeigen. Nach 30 Jahren Baustelle sind sie selbst halb Stahlträger. Die Rüstung macht sie wesentlich unempfindlicher gegen physischen Schaden, und dank besserer Disziplin halten sie ihre Raserei wesentlich länger durch, bevor sie ihren Wunden erliegen.

actors.mobs.skeleton.name=ewig Wartender
actors.mobs.skeleton.explo_kill=Du wurdest durch eine Knochenexplosion getötet... Deine Nummer wurde nie aufgerufen.
actors.mobs.skeleton.def_verb=geblockt
actors.mobs.skeleton.desc=Ewig Wartende bestehen aus den Knochen glückloser Kellerbesucher und aller, die im Amt auf einen Termin gewartet haben und nie drankamen. Die dunkle Magie aus den tieferen Ebenen hält sie in Bewegung, die Hoffnung auf Aufruf auch. Nachdem sie genug Schaden genommen haben, zerfallen sie in einer Knochenexplosion. Die Splitter schaden allem in der Nähe, Rüstung schwächt diesen Schaden aber sehr wirksam ab.

actors.mobs.slime.name=Abflussschleim
actors.mobs.slime.def_verb=geblockt
actors.mobs.slime.desc=Abflussschleime sind seltsame, leicht magische Kreaturen mit gummiartiger Hülle und flüssigem Kern. Seit dem letzten Rohrbruch, den die Hausverwaltung als "Feuchtigkeit" bezeichnet, finden sie in den Kellern reichlich Wasser und Nahrung.\n\nWegen ihrer elastischen Außenhaut ist es schwierig, einem Abflussschleim mehr als _6 Schaden_ pro Attacke zuzufügen.

actors.mobs.snake.name=Kabelschlange
actors.mobs.snake.hint=Versuche, den Suchknopf auf einer Schlange anzuwenden, um zu erfahren, wie man sie bekämpfen kann.
actors.mobs.snake.desc=Was im Altbau aus der Wand hängt, ist nicht immer Elektrik. Diese Schlange weicht gewöhnlichen Angriffen sehr geschickt aus. _Magie und Überraschungsangriffe_ treffen sie zuverlässiger.\n\nLass sie dir durch eine Tür folgen und _schlage zu, sobald sie durch die Tür kommt_. So greifst du aus einer Position an, die sie vorher nicht sehen konnte.

actors.mobs.spectralnecromancer.name=Geister-Sachbearbeiter
actors.mobs.spectralnecromancer.desc=Ewig Wartende sind zwar das täglich Brot eines Wiedervorlagebeamten, aber manche arbeiten lieber mit weniger körperlichem Personal. Geister-Sachbearbeiter haben sich für Spuk als Diener entschieden! Im Stellenplan zählen die Geister als Vollzeitkräfte.\n\nEin einzelner Geist ist nicht so stark wie ein ewig Wartender, aber diese Sachbearbeiter beschwören ohne Scheu gleich einen ganzen Haufen davon!

actors.mobs.spinner.name=Flatterbandspinne
actors.mobs.spinner.desc=Diese grünlichen, behaarten Spinnen aus den Baugruben meiden den direkten Kampf. Stattdessen warten sie lieber auf Abstand, während ihre Opfer in rot-weißem Absperrnetz festhängen und langsam an ihrem giftigen Biss sterben. Sie verschießen ihre Netze über große Entfernungen und versuchen, jeden Weg ihres Opfers abzusperren. Umleitung ist nicht ausgeschildert.

actors.mobs.statue.name=belebte Kunst-am-Bau-Statue
actors.mobs.statue.def_verb=geblockt
actors.mobs.statue.desc=Man könnte denken, dies sei nur eine weitere Kunst-am-Bau-Statue, die niemand bestellt hat und niemand abbauen darf, aber die rot leuchtenden Augen verraten sie.
actors.mobs.statue.desc_weapon=Die Statue selbst ist aus Stein, aber _%s_, das sie bei sich trägt, sieht sehr echt aus.
actors.mobs.statue.discover_hint=Du kannst diesen Gegner überall im Untergrund finden.

actors.mobs.succubus.name=Stadtmarketing-Sukkubus
actors.mobs.succubus.desc=Sukkubi sind Dämonen, die den Verstand ihrer Opfer manipulieren. Dieser hier hat die Gestalt einer blassen, schwarz gekleideten Kampagnen-Muse angenommen und flüstert den Slogan der neuen Imagekampagne: „Neukölln. Jetzt mit Concierge.“\n\nWenn Sukkubi angreifen, können sie ihren Feind zeitweise betören, sodass er sie nicht mehr direkt angreifen kann. Greifen sie einen betörten Feind an, stehlen sie ihm etwas Lebenskraft.

actors.mobs.swarm.name=Biomüllschwarm
actors.mobs.swarm.desc=Der Biomüll hat eine Vollversammlung einberufen. Jeder nichtmagische Treffer teilt diesen Schwarm in zwei kleinere, ebenso gefährliche Schwärme. Magie erspart dir weitere Arbeitsgruppen.

actors.mobs.tengu.name=Kurzparker
actors.mobs.tengu.notice_gotcha=HUUUP! Mach Platz, %s. Ich steh nur kurz hier.
actors.mobs.tengu.interesting=Warnblinker an. Ich park mal eben um. Aufs Feld.
actors.mobs.tengu.notice_have=(Lichthupe) Du schon wieder, %s? Ich steh immer noch nur kurz.
actors.mobs.tengu.defeated=Ich stand doch... nur... kurz...
actors.mobs.tengu.rankings_desc=Vom Kurzparker übersehen
actors.mobs.tengu.desc=Ein SUV, breiter als der Radweg, auf dem er sonst steht: getönte Scheiben, Warnblinker, die Hupe als Grußformel. Hinter der Außenstelle hat er das Tempelhofer Feld entdeckt, und seitdem hält er die Landebahn für seinen Parkplatz.\n\nWird er getroffen, parkt er um und steht plötzlich woanders. Aus dem Seitenfenster wirft er dir scharfkantig gefaltete Parkknöllchen entgegen. Nach jedem Umparken liegen neue Haufen im Raum: Merk sie dir, solange du sie siehst.\n\nIst seine Karosserie halb zerbeult, fährt er alles auf: Abgasbomben, Glut aus der Grillzone und seine Alarmanlage. Zwischen ihm und dem Parkplatz direkt vor der Tür steht nur noch eines: du.

actors.mobs.tengu$bombability$bombblob.desc=Hier bläht sich eine Wolke aus überhitztem Abgas auf. Vorsicht, sie wird explodieren!
actors.mobs.tengu$bombability$bombitem.name=Abgasbombe
actors.mobs.tengu$bombability$bombitem.cant_pickup=Sie klebt am Boden wie Kaugummi auf dem Parkplatz, du kannst sie nicht bewegen!
actors.mobs.tengu$bombability$bombitem.desc=Der Kurzparker hat hier einen glühenden Klumpen aus dem Auspuff fallen lassen, aus dem dicker, heißer Qualm steigt. Er tickt laut wie ein Motor im Leerlauf und zählt auf eine Explosion herunter!\n\nDer Klumpen hat sich in den Boden gebrannt, du kannst ihn nicht aufheben.

actors.mobs.tengu$fireability$fireblob.desc=Der Kurzparker hat die Glut einer Einweggrillschale aus der Grillzone aufgewirbelt. Hier steigt schon Dampf auf, gleich brennt es!

actors.mobs.tengu$shockerability$shockerblob.desc=Hier baut sich Spannung auf. Alles, was auf diesem Feld steht, bekommt im nächsten Zug einen Stromschlag!
actors.mobs.tengu$shockerability$shockeritem.name=Alarmanlage
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Davon geht zu viel Strom aus. Du kannst sie nicht anfassen!
actors.mobs.tengu$shockerability$shockeritem.desc=Der Kurzparker hat hier seine Alarmanlage abgeworfen, zusammengeflickt aus alten DM-100-Aufrufautomaten. Sie jault, blinkt und sprüht Funken, allerdings in einem vorhersagbaren Muster.\n\nWegen der ganzen Elektrizität gibt es keine Möglichkeit, sie aufzuheben.

actors.mobs.technojuenger.name=Technojünger
actors.mobs.technojuenger.drop_short=DROP!
actors.mobs.technojuenger.warning=Der Technojünger reißt beide Arme hoch: Der Drop kommt! Raus aus dem markierten Bereich!
actors.mobs.technojuenger.drop=BUMM. Der Bass-Drop fegt alle um den Technojünger von den Füßen.
actors.mobs.technojuenger.desc=Kam Freitag rein, ist nie wieder rausgegangen. Der Stempel am Handgelenk stammt aus drei Clubs vorher, die Sonnenbrille bleibt auf, weil die Sonne hier unten nur ein Gerücht ist.\n\n_Er schläft nie. Bist du bis zu 2 Felder entfernt, kündigt er einen Bass-Drop einen Zug vorher an und markiert alle Felder in diesem Umkreis. Dann schleudert er alle dort 2 Felder weg (ein Aufprall an der Wand tut weh) und macht sie 3 Züge lang schwindelig._ Raus aus dem markierten Bereich. Zwischen zwei Drops braucht er 6 Züge.

actors.mobs.terminhaendler.name=Terminhändler
actors.mobs.terminhaendler.sold=Die 0815? Verkauft! Nächster!
actors.mobs.terminhaendler.waitloop=Dein Termin wurde weiterverkauft. Du hängst in der Warteschleife!
actors.mobs.terminhaendler.desc=Er hat alle Termine des Amts in der ersten Sekunde per Skript gebucht und verkauft sie jetzt im Flur weiter. Gegen eine kleine Gebühr. Oder eine große. Quittung gibt's nicht, Kartenzahlung auch nicht.\n\n_Jeder Treffer schickt dich 3 Züge lang in die Warteschleife (verlangsamt), außer du bist schon verlangsamt. Danach zieht er sich 4 Züge zurück und kommt wieder._ Verfolge ihn oder nutz die Pause, um dich neu aufzustellen. Hat er keinen Fluchtweg mehr, kämpft er.

actors.mobs.thief.name=Nummernklauer
actors.mobs.thief.stole=Der Nummernklauer hat %s von dir gestohlen!
actors.mobs.thief.carries=\n\nDer Nummernklauer trägt ein _%s._ Gestohlen, versteht sich.
actors.mobs.thief.escapes=Der Nummernklauer konnte mit deinem %s entkommen!
actors.mobs.thief.desc=Diese Wartenden dürfen längst gehen, aber das Amt ist immer noch ihr Gefängnis. Die Zeit im Wartebereich hat ihnen Verstand und Freiheit geraubt. Sie haben vergessen, wer sie sind und worauf sie warten, und klauen jetzt allen anderen die Sachen.\n\nNummernklauer stehlen lieber und laufen weg, statt zu kämpfen. Behalte sie im Blick, sonst siehst du deine gestohlenen Dinge vielleicht nie wieder.

actors.mobs.tormentedspirit.name=gequälter Vormieter
actors.mobs.tormentedspirit.desc=Gequälte Vormieter sind eigentlich gutmütige Geister, die allerdings verflucht wurden. Solange der Fluch auf ihnen liegt, greifen sie wie Vormieterspuk alles und jeden an und sind dabei sogar stärker!\n\nVielleicht lässt sich der Fluch lösen, wenn du den richtigen Gegenstand in unmittelbarer Nähe des gequälten Vormieters benutzt. Er wäre dir sicher dankbar...
actors.mobs.tormentedspirit.thank_you=Danke... Die Kaution... kannste behalten...

actors.mobs.npcs.vaultlaser.name=Showlaser
actors.mobs.npcs.vaultlaser.ondeath=Der Showlaser hat dich getötet...
actors.mobs.npcs.vaultlaser.desc=Diese Laser gehören zur Lichtshow und feuern in regelmäßigen oder halbzufälligen Abständen Strahlen ab, die immer dieselbe Stelle treffen. _Gegen die Strahlen gibt es keinerlei Schutz, du musst ihnen ausweichen._ Die Show läuft seit Freitag ohne Pause.

actors.mobs.npcs.vaultsentry.name=Moving Head
actors.mobs.npcs.vaultsentry.ondeath=Der Stromschlag des Moving Head hat dich getötet...
actors.mobs.npcs.vaultsentry.desc=Dieser Scheinwerfer schwenkt in einem festen Muster über den Raum und sucht Leute ohne Bändchen. Wer vom Lichtkegel erfasst wird, _bekommt garantiert einen Stromschlag._ Dem Muster kann man oft ausweichen, und der Scheinwerfer muss dich tatsächlich sehen, um dich zu entdecken. _Alles, was die Sicht behindert, wirkt also gut gegen ihn._

actors.mobs.npcs.vaulttokendoor.name=Garderobe
actors.mobs.npcs.vaulttokendoor.def_verb=geblockt
actors.mobs.npcs.vaulttokendoor.desc=Ein Tresen mit heruntergelassenem Rollgitter. Dahinter hängen Jacken bis unter die Decke, und irgendwo dahinter liegt auch etwas von dir. Am Gitter ein Schild: "Ausgabe nur gegen alle 7 Marken. Keine Diskussion."
actors.mobs.npcs.vaulttokendoor.no_tokens=_Ohne Garderobenmarken gibt es hier nichts. Sie müssen irgendwo im Club verteilt sein._
actors.mobs.npcs.vaulttokendoor.too_few_tokens=_Die Garderobiere zählt deine Garderobenmarken und schiebt sie zurück._ Es fehlen noch welche.
actors.mobs.npcs.vaulttokendoor.enough_tokens=_Du hast alle Garderobenmarken beisammen._ Willst du sie abgeben?
actors.mobs.npcs.vaulttokendoor.open=Marken abgeben
actors.mobs.npcs.vaulttokendoor.not_yet=Noch nicht
actors.mobs.npcs.vaulttokendoor.unlocked=Die Garderobiere nimmt die Marken, zählt zweimal nach und zieht das Rollgitter hoch.

actors.mobs.npcs.vaultmirror.name=Garderobenspiegel
actors.mobs.npcs.vaultmirror.def_verb=geblockt
actors.mobs.npcs.vaultmirror.desc=Ein großer Spiegel mit Goldrahmen und Lichterkette hinter dem Garderobentresen. Er summt leise, spiegelt aber nichts. Hier prüft man, ob man noch so aussieht wie beim Reinkommen.
actors.mobs.npcs.vaultmirror.approach=Hinter dem Tresen hängt ein großer Spiegel, eine Lichterkette blinkt um den Goldrahmen. Seine Oberfläche ist pechschwarz, bis du näher kommst. Als du dich zum Spiegel beugst, blinkt die Lichterkette hell auf, und hinter dem Glas erscheint eine erschreckend vertraute Szene.
actors.mobs.npcs.vaultmirror.scene_warrior=Du siehst deinen _Kiez-Aufnäher_, in zwei Hälften zerrissen, halb im Schnee auf dem Hinterhof deines alten Hauses. Die Szene ist fast wie eine Erinnerung, aber die Einzelheiten stimmen nicht. Du hast es nie übers Herz gebracht, den Aufnäher wegzuwerfen, ihn zu behalten fühlte sich an wie ein Teil deiner Strafe. Du hast es auch lange genug angestarrt, um zu wissen, dass der Riss in einem etwas anderen Winkel verläuft.
actors.mobs.npcs.vaultmirror.scene_mage=Du siehst deinen _magischen Selfie-Stick_ auf einem Schreibtisch in einem Coworking-Space liegen. Die Szene ist fast wie eine Erinnerung, aber die Einzelheiten stimmen nicht. Das war dein Hot Desk, viel zu sichtbar, um dort den Selfie-Stick aufzubewahren. Außerdem sieht der Platz belebter aus, als er sollte. Echte Arbeit hast du dort nie gemacht, nur Calls.
actors.mobs.npcs.vaultmirror.scene_rogue=Du siehst den _Poncho der Schatten_, sorgfältig auf einem Ständer in einem Museumsshop drapiert. Die Szene ist fast wie eine Erinnerung, aber die Einzelheiten stimmen nicht. Der Laden ist still und leer, und der Wachmann lässt freundlich den Blick durch den Raum schweifen. Als du ihn dort friedlich und unversehrt stehen siehst, spürst du einen vertrauten Stich von Schuld.
actors.mobs.npcs.vaultmirror.scene_huntress=Du siehst deinen _Upcycling-Bogen_ auf einem großen, flachen, runden Stein, umgeben von dichtem Grün, fast wie in dem Gemeinschaftsgarten, den es auf der Brache mal gab. Die Szene ist fast wie eine Erinnerung, aber die Einzelheiten stimmen nicht. Die kleine Lichtung ist still und leer, ganz anders als das Fest, bei dem du den Bogen bekommen hast. Genau genommen spürst du überhaupt nichts von der Natur um dich herum.
actors.mobs.npcs.vaultmirror.scene_duelist=Vor dir steht eine große Gestalt in der Rüstung der königlichen Garde: dein verstorbener Vater. Die Szene ist fast wie eine Erinnerung, aber die Einzelheiten stimmen nicht. Der freundliche Blick in seinen Augen ist genau so, wie du ihn in Erinnerung hast, aber sein Gesicht ist von Jahren gezeichnet, die er nie erleben durfte. Er hält dir sein _verzaubertes Großschwert_ hin.
actors.mobs.npcs.vaultmirror.scene_cleric=Du siehst einen geöffneten Reliquienschrein in einer hell erleuchteten Kapelle, darin der _heilige Foliant_. Die Szene ist fast wie eine Erinnerung, aber die Einzelheiten stimmen nicht. Du hast den Schrein nie aus dem Lager geholt, nur den Folianten selbst. Auch die göttliche Energie, die der Foliant ausstrahlt, fühlt sich ungewohnt an, als würde er Kraft aus einer anderen Quelle beziehen.
actors.mobs.npcs.vaultmirror.scene_final=Du bemerkst, dass das Glas des Spiegels vollständig verschwunden ist. Nichts hindert dich daran, hineinzugreifen und dein Lieblingsstück zurückzuholen.
actors.mobs.npcs.vaultmirror.take=Zurückholen
actors.mobs.npcs.vaultmirror.scene_take=Als du hineingreifst und den Gegenstand herausholst, bleibt die Szene unverändert, als gäbe es ihn zweimal.\n\nDas Bild im Spiegel verblasst, und der Gegenstand in deiner Hand pulsiert leise im Takt der Bassline, die durch die Wand dringt.\n\nDu weißt nicht genau, was gerade passiert ist, aber der Gegenstand scheint an diesen Club gebunden zu sein. Mit nach draußen nehmen kannst du ihn wahrscheinlich nicht.
actors.mobs.npcs.vaultmirror.scene_nothing=Du schaust noch einmal in den Spiegel, aber nichts passiert. Du siehst nur dich selbst, im Hoodie aus dem Fundus.

actors.mobs.warlock.name=Abschreibungshexer
actors.mobs.warlock.bolt_kill=Der Schattenblitz hat dich getötet... Steuerlich absetzbar.
actors.mobs.warlock.desc=Als sich das Interesse der Eigentümerzwerge von der Ingenieurskunst zur Finanzmagie verlagerte, kamen die Hexer im Renditequartier an die Macht. Sie begannen mit Elementarmagie, wandten sich aber schnell Dämonologie, Nekromantie und Sonderabschreibungen zu. Der stärkste von ihnen bestieg den Thron, und seine Kumpane dürfen weiter ihre dunkle Magie praktizieren, solange sie ihm ihren freien Willen unterordnen.\n\nDiese Hexer besitzen starke, zerstörerische Magie und können die Verbesserungsmagie deiner Ausrüstung zeitweise außer Kraft setzen, sie schreiben sie quasi ab. Je stärker ein Gegenstand verbessert ist, desto stärker ist er betroffen.

actors.mobs.wraith.name=Vormieterspuk
actors.mobs.wraith.desc=Dies ist der rachsüchtige Geist eines Vormieters, dessen Sperrmüll angerührt wurde. Als ätherisches Wesen ist er mit gewöhnlichen Waffen sehr schwer zu treffen.
actors.mobs.wraith.discover_hint=Du kannst diesen Gegner überall im Untergrund finden.

actors.mobs.yogdzewa.name=Ewiger Mietspiegel
actors.mobs.yogdzewa.notice=ICH. SEHE. DEINE. NETTOKALTMIETE.
actors.mobs.yogdzewa.darkness=Die Dunkelheit rückt näher. Aus der Tiefe tönt es: DUNKELHEIT. WOHNWERTMINDERND. NICHT. BERÜCKSICHTIGT.
actors.mobs.yogdzewa.hope=DEINE. HOFFNUNG. IST. NICHT. ORTSÜBLICH!
actors.mobs.yogdzewa.defeated=ICH. WERDE. IN. ZWEI. JAHREN. NEU. ERHOBEN.
actors.mobs.yogdzewa.rankings_desc=Vom Ewigen Mietspiegel verschlungen
actors.mobs.yogdzewa.desc=Der Ewige Mietspiegel ist kein Mensch, sondern eine Tabelle, die zum alten Gott geworden ist. Er frisst jeden neuen, höheren Vertrag, und die Eigentümerzwerge haben ihn unter dem Rathaus weggeschlossen, statt ihn abzuschaffen. Alle zwei Jahre wird er neu erhoben. Gesunken ist er dabei noch nie.\n\nSeine wahre Form passt nicht in diese Welt. Stattdessen hat er Avatare erschaffen und dämonische Lakaien beschworen, die hier seine Befehle ausführen.\n\nDieses riesige Auge ist der Brennpunkt seiner Macht in dieser Welt. Das Auge selbst ist unbeweglich, kann aber mächtige Strahlen dämonischer Magie abfeuern und eine Vielzahl von Lakaien beschwören, die es unterstützen.
actors.mobs.yogdzewa.desc_spawners=Du spürst Wellen dämonischer Energie, die von den höheren Ebenen zum Auge strömen. Der Mietspiegel muss diese Energie von Kreaturen beziehen, die du dort oben am Leben gelassen hast. _Er wird diese Energie nutzen, um stärkere Lakaien zu beschwören!_
actors.mobs.yogdzewa$larva.name=Mieterhöhungslarve
actors.mobs.yogdzewa$larva.rankings_desc=Vom Ewigen Mietspiegel verschlungen
actors.mobs.yogdzewa$larva.desc=Diese winzigen Ausgeburten des Mietspiegels sind einfache Lakaien, die sich leicht erzeugen lassen. Einzeln sind sie schwach, aber sie werden schnell herbeigerufen und sind in der Masse überwältigend. Wie kleine Erhöhungen um jeweils 15 Prozent.
actors.mobs.yogdzewa$yogripper.rankings_desc=Vom Ewigen Mietspiegel verschlungen
actors.mobs.yogdzewa$yogeye.rankings_desc=Vom Ewigen Mietspiegel verschlungen
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Vom Ewigen Mietspiegel verschlungen

actors.mobs.yogfist.invuln_warn=Diese Faust ist in der Nähe des Auges unverwundbar!
actors.mobs.yogfist.rankings_desc=Vom Ewigen Mietspiegel verschlungen
actors.mobs.yogfist.desc=Diese Faust ist ein Teil der Macht des Mietspiegels. Die Fäuste sind mit seiner Macht verbunden und in der Nähe des Auges unverwundbar.
actors.mobs.yogfist$burningfist.name=Heizkostenfaust
actors.mobs.yogfist$burningfist.desc=Diese Faust ist aus chaotischer, feuriger Magie geformt. Sie heizt nach Verbrauch ab, und verbraucht wird alles um sie herum. Während sie sich bewegt, setzt sie ständig die Umgebung in Brand. Außerdem verschießt sie feurige Stöße, die beim Aufprall Flammen verbreiten.\n\nIn der Nähe von Wasser kann die Faust keine Flammen verbreiten, aber ihre Hitze ist so groß, dass das Wasser um sie herum nach kurzer Zeit verdampft!
actors.mobs.yogfist$soiledfist.name=Fassadenbegrünungsfaust
actors.mobs.yogfist$soiledfist.desc=Diese Faust ist aus chaotischer Erdmagie geformt und das grüne Feigenblatt jedes Investorenprojekts. Wenn sie sich bewegt, lässt sie ständig Pflanzen um sich sprießen. Außerdem verschießt sie konzentrierte Erdstöße, die ihr Ziel mit schnell wachsenden Ranken und Wurzeln fesseln!\n\nDie Faust bezieht Kraft aus diesem Pflanzenleben und widersteht einer gewissen Menge Schaden, je nachdem, wie viel hohe oder zertrampelte Vegetation in ihrer Nähe ist!
actors.mobs.yogfist$rottingfist.name=Faust des Instandhaltungsstaus
actors.mobs.yogfist$rottingfist.desc=Diese Faust ist aus lebendiger Fäulnis geformt, aus allem, was jahrzehntelang nicht repariert wurde. Sie ist eine hoch aufragende Masse aus verwesendem Fleisch, die im Nahkampf ätzenden Schleim und im Fernkampf giftige Gase absondert. Schlimmer noch: Wegen ihrer großen Masse blutet die Faust, anstatt direkt Schaden zu nehmen.\n\nMit Wasser lässt sich der Schleim abwaschen, aber die Faust kann auch Wasser aufnehmen, um sich zu heilen! Außerdem erneuert sich ihre Blutung, wenn du sie beschädigst, während sie blutet, wird aber nicht stärker!
actors.mobs.yogfist$rustedfist.name=Ratenzahlungsfaust
actors.mobs.yogfist$rustedfist.desc=Diese Faust ist aus lebendem Metall geformt. Sie ist eine hoch aufragende Masse aus sich wandelndem Metall, die mächtige Nahkampfangriffe ausführt und ihre Ziele aus der Entfernung lähmen kann. Wegen ihrer enormen Masse nimmt die Faust Schaden nicht sofort, sondern in Raten über einen längeren Zeitraum.\n\nDie Faust ist jedoch sperrig und kann sich nicht in enge Gänge zwängen. Außerdem wächst der verzögerte Schaden weiter an, wenn die Faust mehrmals getroffen wird. Die Zinsen zahlt sie selbst.
actors.mobs.yogfist$brightfist.name=Hochglanzprospekt-Faust
actors.mobs.yogfist$brightfist.teleport=Die Faust teleportiert sich mit einem Lichtblitz davon, der dich erheblich blendet!
actors.mobs.yogfist$brightfist.desc=Diese Faust ist aus reiner Lichtenergie geformt, so strahlend wie ein Exposé für Mikroapartments. Sie verschießt jeden Zug kräftige Strahlen aus gleißendem Licht! Diese Strahlen blenden dich vorübergehend und richten zusätzlich schweren Schaden an. Außerdem kann die Faust die Arena kurz in blendendes Licht tauchen, um zu entkommen!\n\nIm Nahkampf hat die Faust jedoch keine besonderen Fähigkeiten.
actors.mobs.yogfist$darkfist.name=Nebenkostenfaust
actors.mobs.yogfist$darkfist.teleport=Die Faust teleportiert sich in einem Strudel aus Dunkelheit davon, wodurch deine Lichtquelle erlischt!
actors.mobs.yogfist$darkfist.desc=Diese Faust besteht aus purer, dunkler Energie. In ihr steckt die Nebenkostenabrechnung, die dir seit dem ersten Keller hinterherkommt, und hier unten wird sie persönlich zugestellt. Sie kann jeden Zug mächtige Strahlen dunkler Magie abfeuern! Neben schwerem Schaden schwächen diese Strahlen auch deine Lichtquelle. Außerdem kann die Faust das Gebiet kurz in Dunkelheit hüllen, um zu entkommen!\n\nIm Nahkampf hat diese Faust allerdings keine besonderen Fähigkeiten.


