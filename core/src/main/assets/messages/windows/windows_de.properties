windows.wndsupportprompt.title=Ein Hinweis zum Original
windows.wndsupportprompt.intro=Hallo! Neukölln Pixel Dungeon ist ein inoffizieller Fork von Shattered Pixel Dungeon, entwickelt von Evan Debenham auf Basis von Pixel Dungeon von Watabou. Ich hoffe, dir macht der Ausflug in den Untergrund Spaß!
windows.wndsupportprompt.close=Schließen

windows.wndtradeitem.buy=Kaufen für %dg
windows.wndtradeitem.steal=Mit einer Chance von %1$d%% stehlen\nLadungen benutzt: %2$d
windows.wndtradeitem.steal_warn=Dein VIP-Bändchen hat nicht genügend Ladung, um diesen Gegenstand garantiert zu stehlen. Wenn der Versuch fehlschlägt, macht der Laden zu, und zwar richtig, nicht nur Mittagspause. Bist du sicher, dass du den Diebstahl riskieren möchtest?
windows.wndtradeitem.steal_warn_yes=Ja, ich bin mir sicher.
windows.wndtradeitem.steal_warn_no=Nein, lieber doch nicht...
windows.wndtradeitem.sell=Verkaufen für %dg
