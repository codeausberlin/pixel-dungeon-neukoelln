windows.wndtradeitem.sell_all=Verkaufe alle für %dg

windows.wndupgrade.title=Gegenstand modernisieren
windows.wndupgrade.desc=Die Modernisierung verbessert einen Gegenstand dauerhaft:
windows.wndupgrade.remaining=Du hast noch _%d_ Modernisierungen übrig.
windows.wndupgrade.unided=Die Eigenschaften dieses Gegenstandes sind dir nicht bekannt; hier wird sein nicht-verbesserter Zustand angezeigt.
windows.wndupgrade.unknown_ring=Da du den Effekt dieses Rings nicht kennst, hast du auch keine Ahnung, was eine Aufwertung mit sich bringen würde.
windows.wndupgrade.cursed=Durch die Verbesserung dieses Gegenstands gibt es außerdem eine Chance von 33%, den Fluch zu lösen.
windows.wndupgrade.cursed_weaken=Wenn dieser Gegenstand verbessert wird, wird auch sein Fluch geschwächt und es besteht eine Chance von 33%, ihn vollständig zu lösen.
windows.wndupgrade.curse_infusion=Wenn der Fluch gelöst ist, profitiert der Gegenstand nicht mehr von der Fluchinfusion!
windows.wndupgrade.enchant=Bei der Aufwertung dieses Gegenstands besteht auch eine Chance von %d%%, dass seine Verzauberung zerstört wird!
windows.wndupgrade.glyph=Bei der Aufwertung dieses Gegenstands besteht auch die Chance von %d%%, dass seine Glyphe zerstört wird!
windows.wndupgrade.harden=Durch das Aufrüsten dieses Gegenstands besteht auch die Chance von %d%%, dass seine Verhärtung gebrochen wird!
windows.wndupgrade.resin=Dieser Zauberstab wurde mit arkanem Harz verstärkt, normale Verbesserungen setzen sich über solche mit arkanem Harz hinweg!
windows.wndupgrade.thrown_dust=Waffen aus diesem Satz, die nicht in deinem Inventar sind, zerfallen zu Staub.
