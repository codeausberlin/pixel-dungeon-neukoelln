windows.wndblacksmith.prompt=Okay, Deal is' Deal. Hier is' mein Angebot. Ohne Rechnung, versteht sich. Ick arbeite aber nur mit identifizierten und nich' verfluchten Gegenständen.\n\n_Aktuelle Gunst: %d_
windows.wndblacksmith.pickaxe=_Spitzhacke (%d Gunst):_ Die Spitzhacke kannste zurückhaben, wenn de willst. Ick hab jenug davon, die Tunnelfirma hat hier dreihundert Stück verjessen.
windows.wndblacksmith.pickaxe_verify=Willste ganz sicher dit olle Ding? Dit Gestein hier oben is' nich' so weich wie unten im Stollen, durchgraben kannste dich hier damit nirgends.
windows.wndblacksmith.pickaxe_free=Hast jute Arbeit jeleistet. Ick schenk se dir. Sag's aber keenem, sonst will jeder eine.
windows.wndblacksmith.pickaxe_yes=Ja, ich will sie.
windows.wndblacksmith.pickaxe_no=Lass gut sein.
windows.wndblacksmith.reforge=_Erneuern (%d Gunst):_ Ick kann zwei Gegenstände vom gleichen Typ zu einem mit verbesserter Qualität erneuern.
windows.wndblacksmith.harden=_Härten (%d Gunst):_ Ick kann 'ne Waffe oder Rüstung härten, dann is' et leichter, 'ne Verzauberung oder Glyphe dran zu bewahren.
windows.wndblacksmith.upgrade=_Verbessern (%d Gunst):_ Haste 'nen Gegenstand mit weniger als +2, kann ick den für dich verbessern.
windows.wndblacksmith.smith=_Schmieden (%d Gunst):_ Ick kann versuchen, dir 'ne neue Waffe oder Rüstung zu schmieden. Die wird höherklassig und wahrscheinlich ooch verbessert, und du kannst in gewissem Rahmen aussuchen, wat de willst. Handwerk, Kumpel. Kriegste oben nirgends mehr unter sechs Monaten Wartezeit.
windows.wndblacksmith.smith_verify=Alles klar, ick feuer den Schmelzofen an, und dann kannste dir wat aussuchen.
windows.wndblacksmith.smith_yes=Feuer an.
windows.wndblacksmith.smith_no=Lass gut sein.
windows.wndblacksmith.cashout=_Auszahlen (alle Gunst):_ Ick kann dir ooch normales Gold geben, dit hier rumliegt. 1 für jeden Punkt Gunst. Bar uff die Kralle.
windows.wndblacksmith.cashout_verify=Okay, dit gibt %d Gold. Danach mach ick aber keene Arbeit mehr für dich!
windows.wndblacksmith.cashout_yes=Gib mir das Gold.
windows.wndblacksmith.cashout_no=Lass gut sein.
windows.wndblacksmith$wndreforge.message=Okay, ick kann dir aus zwei identifizierten Gegenständen vom gleichen Typ 'nen neuen basteln. Der schwächere von beiden jeht dabei drauf, damit der stärkere 'ne Verbesserung kriegt. Wenn beide die gleiche Stufe haben, behalt ick den linken. Nennt man Nachverdichtung.
windows.wndblacksmith$wndreforge.prompt=Gegenstand erneuern
windows.wndblacksmith$wndreforge.reforge=Gegenstände erneuern
windows.wndblacksmith$hardenselector.prompt=Härte Gegenstand
windows.wndblacksmith$upgradeselector.prompt=Verbessere Gegenstand
windows.wndblacksmith$wndsmith.prompt=Okay, pass uff, dit kann ick machen. Der Schmiedeofen is' schon anjeheizt, also beeil dich mit der Entscheidung. Gas kostet.

