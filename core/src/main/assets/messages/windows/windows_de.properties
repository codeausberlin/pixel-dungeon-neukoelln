windows.wndvictorycongrats.title=Sieg, ganz ohne Termin!
windows.wndvictorycongrats.start_text=Du hast den Untergrund von Neukölln bezwungen! Und du hast heute was gelernt: Der Kiez gehört keinem, deshalb muss man ihn...\n„Kuli macht fuffzig Cent“, sagt der Spätimann. „Karte erst ab zehn.“\n\nNeu bei der Heldenauswahl:
windows.wndvictorycongrats.challenges=Du kannst jetzt Herausforderungen starten! Mit ihnen kannst du das Spiel auf vielfältige Weise schwieriger gestalten.
windows.wndvictorycongrats.custom_seeds=Du kannst jetzt _benutzerdefinierte Seeds_ nutzen! Derselbe Seed und die gleiche Spielversion erzeugen immer denselben Untergrund.
windows.wndvictorycongrats.dailies=Du kannst jetzt an _täglichen Läufen teilnehmen!_ Jeden Tag gibt es einen neuen täglichen Lauf, der für alle Mitspieler gleich ist!
windows.wndvictorycongrats.thank_you=Vielen Dank, dass du Neukölln Pixel Dungeon spielst, einen Fan-Fork von Shattered Pixel Dungeon!
windows.wndvictorycongrats.support_prompt=Wenn dir das Spiel gefällt, denk bitte darüber nach, das Original Shattered Pixel Dungeon von Evan Debenham zu unterstützen. Ohne seine jahrelange Arbeit (und die von Watabou) gäbe es diesen Kiez nicht!
windows.wndvictorycongrats.support=Original unterstützen
windows.wndvictorycongrats.close=Schließen

windows.wndwandmaker.dust=Oh, Sie haben den Staub! Machen Sie sich wegen der Geister keine Sorgen, das bekomme ich schon hin. Wie versprochen dürfen Sie sich einen meiner Zauberstäbe aussuchen. Handgefertigt, nicht aus dem Concept Store.
windows.wndwandmaker.ember=Oh, Sie haben die Asche! Ich hoffe, der Heizkosten-Feuerelementar hat Ihnen keine ernsthaften Probleme gemacht. Wie versprochen dürfen Sie sich einen meiner Zauberstäbe aussuchen. Ohne Antrag, ohne Gebühr, ohne Wartenummer.
windows.wndwandmaker.berry=Oh, Sie haben die Beere! Ich hoffe, der Faulbeerstrauch hat Ihnen keine ernsthaften Probleme gemacht. Wie versprochen dürfen Sie sich einen meiner Zauberstäbe aussuchen. Bearbeitungszeit: sofort. So etwas hat es hier noch nie gegeben.
windows.wndwandmaker.farewell=Möge Ihnen das Glück hold sein, %s! Und falls Sie oben einen bezahlbaren Werkstattraum sehen: Ich stehe auf der Liste. Platz 4.000.
