windows.wndranking$statstab.copy_seed_desc=Möchtest du den Seed dieser Platzierung als benutzerdefinierten Seed für ein neues Spiel verwenden? Bedenke, dass in Spielen mit benutzerdefinierten Seeds keine Abzeichen erlangt werden können. Außerdem zählen sie nicht zur Anzahl gespielter Spiele und tauchen am unteren Ende der Rangliste auf.\n\nWenn diese Platzierung von einem sehr alten Spiel stammt, bedenke, dass verschiedene Versionen von Neukölln Pixel Dungeon auch verschiedene Untergründe erzeugen können, selbst wenn der Seed derselbe ist.
