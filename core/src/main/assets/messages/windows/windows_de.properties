windows.wndsadghost.rat=Danke! Die Pfandratte isch weg. Ihr Leergut bring i morgen selber zurück. Pfand isch Pfand.
windows.wndsadghost.gnoll=Danke! Der Abstandswicht isch weg, und mein Ständer isch wieder da. Ohne Abstand. Des hätt mein Vater sehen sollen.
windows.wndsadghost.crab=Danke! Der Kanalpanzer isch weg. Jetzt kann i endlich die Kehrwoche machen. Merken wird's keiner, aber i weiß es.
windows.wndsadghost.give_item=Nimm eins davon, gell. I hab alles doppelt, für den Notfall. Mei Mutter sagt, man weiß nie.\n\nUnd noch was: Mein Christbaum isch weg. Den hab i jeden Tag gegossen, obwohl er scho genadelt hat. Irgendwer hat ihn aus dem Fenster gworfen, des macht man hier im Januar wohl so. Wenn du ihn findest......
windows.wndsadghost.confirm=Bestätigen
windows.wndsadghost.cancel=Abbrechen
windows.wndsadghost.farewell=Ade, und frohe Weihnachten! Grüß schön, falls oben einer zurückgrüßt.

